automation_notes_paragraph: >-
  The Pestov 9.1 problem was solved by Claude (Anthropic) under the author's
  direction, with no custom proof tool. The construction first appears in the
  records of the Claude Code agent that landed it, nine minutes after that
  agent was given the question. An agent in a second session found the same
  group independently three minutes later. Two further agents each re-derived
  the proof as independent reviewers. All prose for that result was written
  by Claude (Anthropic), which also produced the Lean formalisation, except the
  property (T) module GroupApproximation/Pestov91/Kazhdan.lean, which was
  written by a Claude Opus 5 agent. No Codex or GPT agent worked on that
  result. The third methods entry above is that run.

