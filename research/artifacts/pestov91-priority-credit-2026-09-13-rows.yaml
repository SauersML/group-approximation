sources_entry:
  - title: An infinite simple group with property (T) that is sofic and hyperlinear
    type: original-proof
    relationship: other
    contributors:
      - name: Claude (Anthropic)
        role: >-
          solved the problem, reviewed the proof independently twice, and
          wrote all the prose for this result
    note: >-
      The positive answer to Open question 9.1 of Pestov's "Hyperlinear and
      sofic groups: a brief guide", the question checked by
      Palomar/comparator-pestov91.json, is first presented in this project.
      Ozawa asks it in print in 2003: "It is unknown whether there exists a
      simple property (T) group Γ which is hyperlinear" (arXiv:math/0306067
      v1, 2003-06-03, unchanged in v2 of 2004-05-10). Pestov prints it as Open
      question 8.1 of arXiv:0804.3968 v1 (2008-04-24), numbered 9.1 in v8
      (2008-08-04): "Let G be an infinite simple group with Kazhdan's property
      (T). Can it be hyperlinear (sofic)?" Arzhantseva still lists the sofic
      form as unknown in 2014 (Trends in Mathematics 1, p. 11). The witness is
      EL_3(LC(X, F_q) ⋊ Z) modulo its centre, for an infinite minimal subshift
      X, formalised with q = 2. The argument was committed to this public
      repository on 2026-09-13 at 03:18:24 UTC (f375478c7). It passed
      independent review at 03:48:55 UTC (0efeac410), was recorded in the
      research graph as answering the question at 04:09:24 UTC (8b65f0932),
      and passed a second independent review at 05:56:33 UTC (badc66e2d). An
      agent in a second session found the same group independently three
      minutes after the first and published it at 04:06:49 UTC (5dfab98df).
      The Lean endpoint <ENDPOINT_DECL> landed at <ENDPOINT_UTC> UTC
      (<ENDPOINT_SHA>), and the Palomar surface at <PALOMAR_UTC> UTC
      (<PALOMAR_SHA>). All of this postdates the latest version of every source
      checked for an earlier answer. The newest is Alekseev and Thom's list of
      known examples (arXiv:2608.05362 v1, 2026-08-05), which names no simple
      one. No earlier or independent answer was found in print. The check was
      bounded: the LaTeX sources of more than twenty papers; the PDFs of
      Kirchberg (1994), Arzhantseva (2014) and Pisier (2020, Chapter 17); and
      the OpenAlex titles and abstracts of works citing Ozawa, Pestov and
      seven further sources. The arXiv API was rate-limited, and journal
      versions were not opened.

