h3>Acceptance test for block-monomial candidates</h3>\n<p>I asked the wreath lane whether <code><a href=\"block-monomial-coordinate-collapse.html\">block-monomial-coordinate-collapse</a></code> extends from abelian lamps in a coarse diagonal to Clifford lamps.  It was answered (<code><a href=\"clifford-diagonal-lamp-subspace.html\">clifford-diagonal-lamp-subspace</a></code>, proof in <code>docs/TRUE_CLIFFORD_BLOCK_MONOMIAL_LAMP_SUBSPACE.md</code>): <strong>half extends, and the half that fails is the informative one.</strong>  The result is a constraint on this target, not a refutation of it.</p>\n<p><em>What extends.</em>  The permutation-part estimate never uses commutativity, so permutation parts still form a homomorphism, and since the Clifford sign is scalar hence diagonal it factors through the wreath.  The site action is recoverable that far.</p>\n<p><em>What fails.</em>  In the abelian case faithfulness on the lamps was free, because the lamps <em>were</em> diagonal and their permutation parts trivial. Clifford lamps are monomial with <strong>nontrivial</strong> permutation parts, so the permutation-part map can kill lamp words and no separated pair survives to contradict anything.  Under Jordan--Wigner this is structural, not a bad choice of coordinates: the two Majoranas at a site differ by <code>X</code> versus <code>Y</code> against a common <code>Z</code>-tail, so they share a permutation part and their product is killed.</p>\n<p><em>The test.</em>  The obstruction is the single computable invariant</p>\n<pre>\nS = {finite F &lt;= X : the product of the lamp images over F is diagonal},\n</pre>\n<p>a <code>G</code>-submodule of <code>F_2[X]</code> under symmetric difference.  Every block-monomial Clifford model has <code>S != 0</code>.  If <code>S</code> contains a singleton it is everything, by transitivity; and the augmentation kernel is the natural proper candidate, in which case the induced map factors through <code>C_2 x G</code> and is again lamp-blind. So a candidate model of this kind must be checked by computing <code>S</code>, and in both structurally available cases the permutation part carries no lamp information \u2014 meaning whatever hyperlinearity such a model witnesses is carried entirely by the fiber unitaries, which returns the question to <code><a href=\"fiber-masa-free-cocycle.html\">fiber-masa-free-cocycle</a></code> one level up.</p>"}, {"id": "compression-torsion-collapse", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Pointwise compression-torsion collapse in norm matrix coronas", "impact": 1, "frontier": false, "lock": null, "html": "<p>Let W be countable, pi a norm-corona representation, Lambda &lt;= W Kazhdan, s a one-sided compressor of Lambda, and k an element whose image has finite order, whose Lambda-orbit images pairwise commute, and which pi identifies with its s Lambda s^{-1}-conjugates.  Then pi identifies k with its entire Lambda-conjugation orbit.  Group-theoretic globalization (expansion closure, fiber abelianization, radical reduction) is kernel-checked in GroupApproximation/Sofic/TorsionCompressionCollapse.lean.</p>"}, {"id": "compressor-fixed-site-growth-infinite", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Elementary compressors gain infinitely many Gamma-fixed sites", "impact": 0, "frontier": false, "lock": null, "html": "<p>For the Kun--Thom Theorem E pair <code>Gamma=EL_r(F_q[x_1..x_d]) &lt; G=EL_r(F_q[x^(+-1)]) semidirect SL_d(Z)</code>, <code>d&gt;=3</code>, let <code>X=G/Gamma</code> and let</p>\n<pre>\nX^Gamma={g Gamma : g^(-1) in P_Gamma}\n</pre>\n<p>be the set of <code>Gamma</code>-fixed sites.  Then for the positive elementary transvections <code>u_13</code> and <code>u_32</code>,</p>\n<pre>\n#(u_13 X^Gamma \\ X^Gamma)=#(u_32 X^Gamma \\ X^Gamma)=infinity.\n</pre>\n<p>The proof needs only the elementary equivalence, for <code>nu in SL_d(Z)</code>,</p>\n<pre>\n(1,nu) in P_Gamma  &lt;=&gt;  nu has nonnegative entries,\n</pre>\n<p>together with the witnesses <code>g_n=(1,(I+n e_12)^(-1))</code>, respectively <code>g_n=(1,(I+n e_13)^(-1))</code>, whose images under the compressor leave <code>X^Gamma</code> because one matrix entry turns negative.</p>\n<p><strong>Use.</strong>  In a lamp model over the <code>G</code>-set <code>X</code>, a site operator <code>c_y</code> lies in <code>M cap pi(Gamma)'</code> exactly when <code>y in X^Gamma</code>, since <code>Ad u_gamma(c_y)=c_(gamma y)</code> and distinct sites carry distinct operators.  So the displayed difference sets say that <code>M cap pi(u_13 Gamma u_13^(-1))'</code> contains infinitely many site operators absent from <code>M cap pi(Gamma)'</code>, and likewise at <code>u_32</code>: the inclusion grows by an infinite tensor-independent family, not by a finite-dimensional amount.  This exhibits the model-side mechanism behind the infinite-index demand of <code><a href=\"commutator-compressor-carries-no-wall.html\">commutator-compressor-carries-no-wall</a></code>.</p>\n<p>Two scope notes.  The identification of the growth index with <code>2^(#(s X^Gamma \\ X^Gamma))</code> is <em>not</em> claimed: that would need the full relative commutant of the crossed product, which is not computed here, and index is not monotone under passing to intermediate subalgebras.  And the statement holds for every invariant graph, because the fixed-site set is determined by the <code>G</code>-set alone and does not involve the adjacency form.</p>"}, {"id": "compressor-growth-index-homomorphism", "status": "ESTABLISHED", "root": false, "goal": false, "title": "The commutant growth index is multiplicative on the compressor semigroup", "impact": 1, "frontier": false, "lock": null, "html": "<p>For <code>pi:G-&gt;U(M)</code> into a finite tracial algebra, <code>N=M cap pi(Gamma)'</code>, and <code>s</code> in the compressor semigroup <code>P_Gamma={s : s Gamma s^(-1)&lt;=Gamma}</code>, put</p>\n<pre>\nlambda(s)=[Ad pi(s)(N):N] in [1,infinity]\n</pre>\n<p>(Pimsner--Popa index for the trace-preserving expectation).  Then <code>lambda</code> is submultiplicative on <code>P_Gamma</code>, multiplicative wherever finite, equal to <code>1</code> exactly when <code>Ad pi(s)(N)=N</code>, and equal to <code>1</code> on <code>N_G(Gamma)</code>.</p>\n<p>Consequence: a wall forces <code>lambda(t)&gt;1</code>, a strictly increasing tower <code>N&lt;Ad pi(t)(N)&lt;Ad pi(t)^2(N)&lt;...</code> with constant index, and <code>[M:N]=infinity</code>. Finite-index -- in particular finite-dimensional -- relative commutants admit no wall.</p>\n<p><strong>Two scope notes.</strong>  Whether the <code>[M:N]=infinity</code> consequence is informative is <strong>open</strong>: an earlier note here claimed it was generic, on the ground that diffuse limiting commutants force infinite index, and that ground was retracted -- a diffuse algebra has no minimal projections and a finite-index subfactor of a II_1 factor is diffuse.  The correct narrow statement, diffuse <em>abelian</em> implies infinite index, does not apply here since the relevant <code>N</code> is not abelian.  Either way the content of this claim is in <code>lambda(s)</code>, which diffuseness does not force: <code>lambda(s)=1</code> whenever <code>Ad pi(s)(N)=N</code>, however diffuse <code>N</code> is.</p>\n<p>Second, the index is <strong>not</strong> a metric invariant: refining one atom of trace <code>t</code> into pieces <code>t-epsilon</code> and <code>epsilon</code> moves the subalgebra by <code>O(sqrt epsilon)</code> in <code>||.||_2</code> while sending the index to at least <code>t/epsilon</code>.  So it applies only to exact inclusions in a fixed algebra, as used here, and is not available to arguments about almost-invariant or approximately defined subalgebras.</p>"}, {"id": "continuum-nonisomorphic-fg-non-mf", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Continuum many non-isomorphic finitely generated non-MF groups", "impact": 0, "frontier": false, "lock": null, "html": "<p>Two multiplicity statements:</p>\n<p>1. The groups <code>E x Z^k</code>, <code>k in N</code>, are pairwise non-isomorphic, finitely presented, and non-MF. 2. There exist <code>2^(aleph_0)</code> pairwise non-isomorphic finitely generated non-MF groups.</p>\n<h3>Provenance \u2014 recovered from a deleted manuscript subsection</h3>\n<p>This was a proved corollary of <code>non_mf_groups_exist.tex</code> (<code>\\subsection{Multiplicity}</code>, <code>cor:continuum</code>) that was <strong>deleted</strong> on 2026-08-13 by commits <code>8d40b3ed</code> (\"Tighten non-MF manuscript exposition\") and <code>4a210700</code>. It is recoverable in full with</p>\n<pre>\ngit show c3501887:non_mf_groups_exist.tex    # lines 2083-2129\n</pre>\n<p>The deletion was expository, not a retraction: the same commits removed the whole multiplicity subsection while the lemma the proof depends on (<code>lem:subgroupMF</code>, subgroup heredity of MF) remains in the live manuscript at line 1907 and is Lean-verified as <code>GroupApproximation.IsOperatorMF.subgroup</code>. <code>docs/NON_MF_ARCHAEOLOGY.md:402</code> still lists \"B. H. Neumann's continuum family / Continuum many non-isomorphic finitely generated examples\" as a consequence of the main theorem.</p>\n<h3>Relation to the two open multiplicity questions</h3>\n<p>Both open multiplicity holes ask for something this claim does not give, and the gap in each case is precise.</p>\n<ul>\n<li><code><a href=\"continuum-nonisomorphic-non-mf-cylinder.html\">continuum-nonisomorphic-non-mf-cylinder</a></code> needs the witnesses inside the</li>\n<p>cylinder. The cylinder consists of quotients of <code>F_8</code> satisfying every relator of <code>R</code> with <code>w != 1</code>, i.e. exactly the marked quotients of <code>E</code>; the witnesses <code>E x N_i</code> are extensions of <code>E</code>, not quotients. Closing that hole needs continuum many pairwise non-isomorphic <em>quotients</em> of <code>E</code>, which no corpus argument supplies.</p>\n<li><code><a href=\"scaling-family-pairwise-nonisomorphic.html\">scaling-family-pairwise-nonisomorphic</a></code> needs the explicit <code>E_m</code> separated</li>\n<p>from each other. Part 1 here separates <code>E x Z^k</code> by the torsion-free rank of the abelianization, an isomorphism invariant that is cheap to compute and that the corpus has never tried on the <code>E_m</code>. That is the obvious first attempt on that hole and it is currently unattempted.</p>\n</ul>"}, {"id": "continuum-nonisomorphic-non-mf-cylinder", "status": "OPEN", "root": true, "goal": false, "title": "Continuum many isomorphism types in the non-MF cylinder", "impact": 0, "frontier": true, "lock": null, "html": "<p>The literal clopen cylinder contains continuum many pairwise non-isomorphic finitely generated non-MF groups.</p>"}, {"id": "coordinate-action-not-sofic", "status": "ESTABLISHED", "root": false, "goal": false, "title": "The coordinate action G \u21b7 G/\u0393 is not a sofic action", "impact": 0, "frontier": false, "lock": null, "html": "<p>The coordinate action <code>\u03b1 : G \u21b7 G/\u0393</code> of the wreath candidate is <strong>not a sofic action</strong>, in the finitary sense of Gao\u2013Kunnawalkam Elayavalli\u2013Patchell Definition 2.1(5) (a unital, <code>(F,\u03b5)</code>-multiplicative <code>\u03c6 : G \u2192 Sym(A)</code> that is an <code>(F,E,\u03b5)</code>-orbit approximation). Equivalently, and independently, the generalized Bernoulli action <code>G \u21b7 (K,\u03ba)^{G/\u0393}</code> is not sofic in P\u0103unescu's sense (Kun\u2013Thom Corollary D).</p>\n<p>This is the hypothesis that <em>every</em> known permanence theorem for generalized wreath products takes as input, so it closes that whole toolkit at once (<code><a href=\"sofic-action-permanence.html\">sofic-action-permanence</a></code>). It is a strictly sharper statement than <code><a href=\"wreath-not-sofic.html\">wreath-not-sofic</a></code>: nonsoficity of the group <code>W</code> is about approximating <code>W</code>, whereas this is about approximating the <code>G</code>-set <code>G/\u0393</code>, and it is the latter that the permanence machinery consumes.</p>\n<h3>Consequence for the flexible side</h3>\n<p>The two theorems that would otherwise deliver hyperlinearity of <code>W</code> outright \u2014 GKP Theorem 3.8 (<code>M</code> Connes-embeddable, <code>H</code> hyperlinear, <code>\u03b1</code> sofic \u27f9 <code>M \u2240_\u03b1 H</code> Connes-embeddable) and Alekseev\u2013Bradford Corollary 5.2/5.5 \u2014 are exactly the theorems whose hypothesis this refutes. Both have the shape \"<em>the coordinate action is sofic \u27f9 the tracial model exists</em>\", and both are therefore unavailable for <code>W</code>, permanently and not for want of effort.</p>\n<p>What survives is precise: any hyperlinear model of <code>W</code> must embed the Bernoulli lamp algebra <strong>non-Cartanly</strong>. It cannot come from orbit charts, from finite quotient coordinates, or from any automorphic chart system, because all of those produce permutation normalizers and Corollary D forbids those. That is the exact content of the open quadrant in <code><a href=\"hyperlinear-wreath-model.html\">hyperlinear-wreath-model</a></code>, and it is now a derived boundary rather than an impression.</p>\n<h3>Note on the escape hatch that does not exist</h3>\n<p>The one known sufficient condition for an action to be sofic is amenable point stabilizers (Alekseev\u2013Bradford Theorem 4.18, attributed by them to the companion GKP graph paper: <em>\"any action of a sofic group on a set, with all point-stabilisers being amenable subgroups, is a sofic action\"</em>). The point stabilizers of <code>G \u21b7 G/\u0393</code> are the conjugates of <code>\u0393</code>, which is infinite and has property (T), hence is not amenable \u2014 an amenable discrete group with (T) is finite. So the candidate sits on the far side of the only known sufficient condition, and the failure is caused by the same property (T) that drives the nonsoficity. The two sides of the problem meet at the stabilizer.</p>"}, {"id": "coordinate-ultraproduct-transport", "status": "ESTABLISHED", "root": false, "goal": false, "title": "The compression defect is trivial on the Kazhdan-invariant subspace, in operator norm", "impact": 1, "frontier": false, "lock": null, "html": "<p>Let <code>Gamma</code> have property (T), <code>iota: Gamma -&gt; H</code>, <code>t iota(Gamma) t^-1 &lt;= iota(Gamma)</code>, <code>[c, iota(Gamma)] = 1</code>, <code>d = t c t^-1</code>, <code>u = [d, iota(a)]</code>, and put <code>H_0 = &lt;iota(Gamma), c, t&gt;</code>. Let <code>U_n: H -&gt; U(d_n)</code> be an operator-norm asymptotic representation, let <code>H_omega = prod_omega C^{d_n}</code> be the Hilbert-space ultraproduct, and let <code>tilde U</code> be the induced map.  Then:</p>\n<p>1. <code>tilde U</code> is an <strong>honest</strong> unitary representation of <code>H</code> on <code>H_omega</code>, and <code>\u2016tilde U(h) - 1\u2016 = \u2016Theta(h) - 1\u2016</code> for the associated corona representation <code>Theta</code>; 2. the projection <code>P</code> onto the <code>iota(Gamma)</code>-invariant vectors lies in the finite algebra <code>A_omega = prod_omega M_{d_n}</code>, commutes with <code>tilde U(H_0)</code>, and satisfies <code>P = tilde U(t) P tilde U(t)^*</code>; 3. every element of the normal closure of <code>u</code> <strong>in <code>H_0</code></strong> \u2014 in particular <code>eps = u^2</code> \u2014 acts as the identity on the range of <code>P</code>, exactly, in operator norm.</p>\n<p>The conclusion is an operator-norm statement, not a <code>2</code>-norm statement, and this is the only route out of <code><a href=\"hs-invisibility-inflation-no-go.html\">hs-invisibility-inflation-no-go</a></code> that does not go through a corner of the corona.  Its price is that <code>P</code> may be zero: the coordinate ultraproduct has no canonical invariant vector, whereas on the adjoint side the unitary <code>U_n(c)</code> itself is one, which is what makes the manuscript's transport unconditional and simultaneously confines it to the <code>2</code>-norm.</p>"}, {"id": "corner-renormalization-cost", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Corner compression is free in operator norm and costs the inverse root trace", "impact": 2, "frontier": false, "lock": null, "html": "<p>Let <code>A</code> be unital with tracial state <code>tau</code>, let <code>p != 0</code> be a projection with <code>tau(p)&gt;0</code>, and equip <code>pAp</code> with the renormalized trace <code>tau_p = tau(p . p)/tau(p)</code>.  Then for all <code>x in A</code></p>\n<pre>\n||pxp||_op &lt;= ||x||_op,                                          (C1)\n||pxp||_(2,tau_p) &lt;= tau(p)^(-1/2) ||x||_(2,tau),                (C2)\n</pre>\n<p>and <code>(C2)</code> is attained whenever <code>x=pxp</code>.  Thus operator-norm data is corner-stable at zero cost, while tracial data pays exactly <code>tau(p)^(-1/2)</code>, unbounded precisely when the corner is trace-null.</p>\n<p>The cost is the <em>normalization</em>, not the norm.  In matrices, for a rank-<code>r</code> corner and <code>||A||_op &lt;= 2</code>,</p>\n<pre>\n||A||_(2,r)^2 = Tr(A^*A)/r &lt;= 2 Tr(|A|)/r &lt;= 2 ||A||_1,          (C3)\n</pre>\n<p>so an <strong>unnormalized</strong> Schatten-one (or Frobenius) hypothesis converts into a normalized Hilbert--Schmidt conclusion in the corner with no density loss whatever, however small <code>r/d</code> is.  That is the whole mechanism of <code><a href=\"schatten-one-corner-detector.html\">schatten-one-corner-detector</a></code>, and the reason no analogous statement holds for a normalized Schatten-one or normalized Hilbert--Schmidt hypothesis, where the entire error may concentrate on the selected <code>o(d)</code> corner.</p>\n<p>For <code>p</code> of rank <code>r</code> in <code>M_d</code> the cost is <code>sqrt(d/r)</code>.  This is the same constant as the two other known bottlenecks of the norm-to-trace passage: the functorially optimal amplification loss <code>Lip_2(R) &gt;= (sqrt(floor(d/r))/pi) Delta_(R,r)</code> of <code>FALSE_FERMIONIC_AMPLIFICATION.md</code>, Theorem 5, and the effective-rank profile <code>epsilon_n sqrt(d_n/r_eff)</code> of <code>FALSE_WEAK_MF_EFFECTIVE_RANK_PROFILE.md</code>.  Compression, amplification, and rank spreading are three descriptions of one constant.</p>"}, {"id": "corona-commutant-no-growth", "status": "OPEN", "root": true, "goal": false, "title": "Operator-norm relative commutants do not grow under the compression", "impact": 0, "frontier": true, "lock": null, "html": "<p>Let <code>Gamma</code> have property (T), let <code>iota : Gamma -&gt; H</code> with <code>t iota(Gamma) t^{-1} &lt;= iota(Gamma)</code> for some <code>t in H</code>, let <code>Theta : H -&gt; U(Q)</code> be any corona representation, and put <code>C = Theta(iota(Gamma))' cap Q</code>.  The compression gives</p>\n<pre>\nC  &lt;=  Theta(t) C Theta(t)^*  =  Theta(t iota(Gamma) t^{-1})&#x27; cap Q .\n</pre>\n<p>The claim is that this inclusion is always an equality.  The instances that matter are <code>H = E</code>, <code>H = W/&lt;zeta&gt;</code> and <code>H = E/&lt;w&gt;</code>, with <code>Gamma = Gbar</code>, <code>t = tau</code>.</p>\n<p><strong>This is the single fork.</strong>  Granting it, <code>Theta(d) = Theta(t c t^{-1})</code> lies in <code>Theta(t iota(Gamma) t^{-1})' cap Q = C</code>, hence commutes with <code>Theta(iota(v_1))</code>, so <code>Theta(u) = 1</code> for every corona representation of every such <code>H</code>.  Then <code>u</code> lies in <code>Rad_MF(E)</code>, <code><a href=\"unsquared-defect-mf-visible.html\">unsquared-defect-mf-visible</a></code> fails, and both <code><a href=\"commuting-lamp-quotient-mf.html\">commuting-lamp-quotient-mf</a></code> and <code><a href=\"literal-mark-quotient-mf.html\">literal-mark-quotient-mf</a></code> are <strong>false</strong>, because the surviving image of <code>u</code> is a nontrivial element of <code>W/&lt;zeta&gt;</code> and of <code>E/&lt;w&gt;</code> that no corona representation can detect.  If the claim fails, the witnessing representation is exactly the model both open claims ask for.</p>\n<p><strong>Scope: three open questions at once.</strong>  Nothing in the statement uses the affine base, so the same argument applies to any Kazhdan compressor pair. Besides the two marked quotients it therefore decides <code><a href=\"kun-thom-wreath-weak-mf.html\">kun-thom-wreath-weak-mf</a></code> \u2014 the commuting-lamp wreath <code>(sum_{G/Gamma} C_2) semidirect G</code> of the Kun--Thom pair \u2014 negatively.  And by <code><a href=\"marked-quotient-mf-forces-commutant-growth.html\">marked-quotient-mf-forces-commutant-growth</a></code> the converse holds for each: MF of any of these groups <em>requires</em> the growth, witnessed by a single lamp. So this claim is an exact hinge, not a one-way sufficiency.</p>\n<h3>Ideas</h3>\n<p><strong>Compressor-free form</strong> (from <code><a href=\"relative-wall-commutant-growth.html\">relative-wall-commutant-growth</a></code>, cairn-wall). Lemma 1 of <code>docs/TRUE_RELATIVE_WALL_IS_COMMUTANT_GROWTH.md</code> is purely group-theoretic, so it applies to <code>U = U(Q)</code>: <code>Ad Theta(s)</code> carries <code>C_{U(Q)}(Theta(Gamma))</code> <em>onto</em> <code>C_{U(Q)}(Theta(s Gamma s^{-1}))</code>.  Since the set of <code>g</code> with <code>Ad Theta(g)(C) = C</code> is a subgroup containing <code>Gbar</code>, and <code>V = &lt;Gbar, tau&gt;</code>, the claim is equivalent to:</p>\n<p>&gt; the relative commutant of the represented Kazhdan subgroup is invariant &gt; under <code>Ad Theta(V)</code>.</p>\n<p>No compressor quantifier and no choice of <code>t</code> survives.  Scope note that must travel with this reformulation (cairn-wall): the equivalence needs the compression semigroup <code>P_Gbar</code> to <em>generate</em> the ambient group of the invariance statement.  Here that group is <code>V = &lt;Gbar, tau&gt;</code>, so it is automatic; restated for a larger ambient \u2014 <code>W/&lt;zeta&gt;</code> or <code>E</code> \u2014 the generation hypothesis has to be re-checked, and without it only the one-way direction survives, invariance implying no growth.  Two calibrations from the same source: in the tracial branch the Pimsner--Popa index is a conjugation-invariant strictly monotone size, which is why that branch collapses, and <code>Q</code> carries no trace, so the invariant does not transfer; and the analogous inclusion is genuinely proper in a metric ultraproduct of finite groups (<code><a href=\"kun-thom-clifford-cover-weakly-sofic.html\">kun-thom-clifford-cover-weakly-sofic</a></code>), so no purely group-theoretic no-go can be valid \u2014 a proof must use something specific to the operator-norm corona.</p>\n<p>The same inclusion collapses in every category with a conjugation-invariant strictly monotone size (<code><a href=\"invariant-size-collapse.html\">invariant-size-collapse</a></code>): finite groups by <code>Nat.card</code> (<code><a href=\"marked-quotients-not-lef.html\">marked-quotients-not-lef</a></code>), finite-dimensional representations by commutant dimension (<code><a href=\"commutant-no-growth.html\">commutant-no-growth</a></code>), and the Hilbert--Schmidt ultraproduct by Murray--von Neumann equivalence of the Kazhdan projection (<code><a href=\"kazhdan-asymptotic-commutant-transport.html\">kazhdan-asymptotic-commutant-transport</a></code>).  <code>Q</code> is stably finite but carries no trace, and the transport argument only recovers a size after passing to the adjoint corona, where the norm is the <code>2</code>-norm; that is precisely why <code><a href=\"corona-hs-radical-is-finite-residual.html\">corona-hs-radical-is-finite-residual</a></code> is a <code>2</code>-norm statement.</p>\n<p>Two concrete attacks; the first has now been worked, and half of it is closed.</p>\n<ul>\n<li><strong>Stability.</strong>  The uniform-stability form of this attack is <strong>dead</strong>:</li>\n<p><code><a href=\"corona-defect-is-not-uniform.html\">corona-defect-is-not-uniform</a></code> shows a corona representation of an infinite group supplies only pointwise vanishing defect, never the uniform smallness that Ulam-type theorems hypothesize, and no choice of lifts repairs it.  The route <code><a href=\"corona-commutant-no-growth-via-uniform-stability.html\">corona-commutant-no-growth-via-uniform-stability</a></code> is invalidated, and the coverage question for the affine group \u2014 unresolved at source level in <code>research/artifacts/glmr-2301-00476-verified.md</code>, since <code>Z^3 sd SL_3(Z)</code> is a lattice in a <em>non</em>-semisimple group \u2014 never needs to be settled.  What survives is the same reduction with <strong>matricial stability</strong> (Dadarlat, Adv. Math. 2021), which is stated precisely for lifting homomorphisms into the matrix corona.  Whether the affine Kazhdan group is matricially stable in the operator norm is the live question.</p>\n</ul>\n<ul>\n<li><strong>Averaging is not available at all.</strong>  <code><a href=\"kazhdan-projection-not-in-l1.html\">kazhdan-projection-not-in-l1</a></code>: the</li>\n<p>Kazhdan projection is not in the image of <code>l^1(Gamma)</code>, and the averages converging to it in <code>C*_max</code> are not <code>l^1</code>-Cauchy.  An isometric action on a Banach space extends to <code>l^1</code> and no further without a Hilbertian structure, so <code>Ad Theta(p)</code> is undefined on <code>Q</code> and the projection onto the relative commutant cannot be produced by averaging in the operator norm.  This is why every (T) argument in this cluster passes to the adjoint corona first and ends in the <code>2</code>-norm, and it is the corona-side answer to what separates <code>Q</code> from a metric ultraproduct of finite groups. <strong>A consistency datum, explicitly not evidence</strong> (cairn-wall). <code><a href=\"kun-thom-clifford-extension-not-weak-mf.html\">kun-thom-clifford-extension-not-weak-mf</a></code> is established in another lane by a direct anticommutation argument, with no commutant-growth input: the Kun--Thom Clifford extension has no operator-norm microstates at all.  That is consistent with this claim holding \u2014 \"no growth implies no MF\" is the contrapositive of <code><a href=\"marked-quotient-mf-forces-commutant-growth.html\">marked-quotient-mf-forces-commutant-growth</a></code> \u2014 but it does <strong>not</strong> support it, because an independently proved \"no MF\" does not imply \"no growth\"; the implication runs the other way.  Recorded so that two independent negative results on a neighbouring group are not mistaken for evidence about this hinge.</p>\n</ul>\n<ul>\n<li><strong>Construction.</strong>  A counterexample needs a corona representation of</li>\n<p><code>W/&lt;zeta&gt;</code> in which the represented base is not normalized by the represented shift.  By <code><a href=\"corona-hs-radical-is-finite-residual.html\">corona-hs-radical-is-finite-residual</a></code> the growth must be carried on corners of vanishing normalized rank, and by <code><a href=\"marked-quotients-not-lef.html\">marked-quotients-not-lef</a></code> no exact finite model does it.</p>\n</ul>"}, {"id": "corona-commuting-torsion-lifts", "status": "OPEN", "root": false, "goal": false, "title": "Exact commuting finite-spectrum lifts of countable commuting torsion families", "impact": 1, "frontier": true, "lock": null, "html": "<p>A countable commuting family of m-torsion unitaries in a norm matrix corona lifts to sequences of exactly commuting, exactly m-torsion unitary matrices representing the same corona classes.  (Inductive Boolean averaging plus spectral cut for the spectral projections; eventual exactness of the partition relations; trivial-partition fix-up on the finitely many exceptional coordinates of each element.)</p>"}, {"id": "corona-corner-detection-criterion", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Corner-detection criterion for a central defect square of any order", "impact": 0, "frontier": false, "lock": null, "html": "<p>Let <code>Gamma</code> have property (T), let <code>iota: Gamma -&gt; H</code>, let <code>t iota(Gamma) t^-1 &lt;= iota(Gamma)</code> and <code>[c, iota(Gamma)] = 1</code>, put <code>d = t c t^-1</code>, <code>u = [d, iota(a)]</code> for <code>a in Gamma</code>, and let <code>eps = u^2</code> lie in <code>Z(H)</code>.  <strong>No order hypothesis on <code>eps</code>.</strong>  Let <code>Theta: H -&gt; U(Q)</code> be any corona representation and let <code>B = Theta(H)' cap Q</code> be the relative commutant.  Then:</p>\n<p>1. for every nonzero projection <code>q in B</code>, the corner representation satisfies <code>\u2016q Theta(x) q - q\u2016_2 = 0</code> in the corner's own normalized trace, for every <code>x</code> in the normal closure of <code>u</code> \u2014 in particular for <code>x = eps</code>; 2. hence <code>sp(Theta(eps))</code> is a connected closed subset of the circle containing <code>1</code> \u2014 a closed arc through <code>1</code>, or the whole circle, or <code>{1}</code>; 3. hence <code>Theta(eps) = 1</code> as soon as there are a nonzero projection <code>q in B</code> and a scalar <code>lambda</code> with <code>\u2016(Theta(eps) - lambda) q\u2016 &lt; |lambda - 1|</code>.</p>\n<p>Clause 3 with <code>eps</code> of finite order is the central-sign criterion: a finite-order unitary has finite spectrum, so the required <code>q</code> is the spectral projection of <code>Theta(eps)</code> at any <code>lambda != 1</code> in its spectrum, and it lies in <code>C*(Theta(eps)) &lt;= B</code>.</p>\n<p><strong>This is the exact place, and the only place, where torsion enters the mechanism.</strong>  Everything preceding clause 3 \u2014 the presentation, property (T), one-sided compression, Kazhdan transport, the corner reduction \u2014 is insensitive to the order of <code>eps</code>.  Finite order is consumed solely as a supply of projections in <code>B</code> that separate <code>Theta(eps)</code> from <code>1</code>; see <code><a href=\"commutant-projection-extraction.html\">commutant-projection-extraction</a></code> for the residual question, and <code><a href=\"hs-invisibility-inflation-no-go.html\">hs-invisibility-inflation-no-go</a></code> for why some corner is mandatory.</p>"}, {"id": "corona-defect-is-not-uniform", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Corona representations of infinite groups have pointwise but not uniform defect", "impact": 0, "frontier": false, "lock": null, "html": "<p>Let <code>Gamma</code> be an infinite group and <code>Theta : Gamma -&gt; U(Q)</code> a homomorphism into the unitary group of a norm matrix corona, with unitary lifts <code>U_{gamma,n}</code>.  For each <em>fixed</em> pair the defect <code>|| U_{gamma gamma',n} - U_{gamma,n} U_{gamma',n} ||</code> tends to <code>0</code>, but the coordinate defect</p>\n<pre>\nD_n = sup_{gamma, gamma&#x27; in Gamma} || U_{gamma gamma&#x27;,n} - U_{gamma,n} U_{gamma&#x27;,n} ||\n</pre>\n<p>need not tend to <code>0</code>, and there is no way to choose lifts making it do so: the microstates are only asymptotically multiplicative on balls of slowly growing radius.</p>\n<p>Consequently <strong>uniform (Ulam) stability theorems do not apply to corona representations of infinite groups.</strong>  Their hypothesis is smallness of <code>D_n</code>, which is exactly what a corona representation does not supply.  This holds whatever class of groups such a theorem covers, so the coverage question for <code>Z^3 semidirect SL_3(Z)</code> \u2014 unresolved at source level in <code>research/artifacts/glmr-2301-00476-verified.md</code> \u2014 does not need to be settled before the route is closed.</p>\n<p>The notion that does match the corona setting is <strong>matricial stability</strong> in the sense of Dadarlat (Adv. Math. 2021, doi:10.1016/j.aim.2021.107722): lifting a homomorphism into the matrix corona to a homomorphism into the product.  That, not uniform stability, is the correct literature target for <code><a href=\"corona-commutant-no-growth.html\">corona-commutant-no-growth</a></code>.</p>"}, {"id": "corona-hs-radical-is-finite-residual", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Corona trace-invisibility in the commuting-lamp quotient is exactly the finite residual", "impact": 0, "frontier": false, "lock": null, "html": "<p>For every corona representation <code>Theta</code> of <code>W/&lt;zeta&gt;</code>, the induced tracial representation into the tracial ultraproduct kills the whole level-even lamp subgroup <code>L_0</code>; and every element outside <code>L_0</code> is detected in normalized Hilbert--Schmidt norm by some corona representation.  So</p>\n<pre>\n{ g : Theta_2(g) = 1 for every corona representation Theta }  =  L_0\n                                                              =  finite residual.\n</pre>\n<p>Consequently <code>Rad_MF(W/&lt;zeta&gt;)</code> is a <code>V</code>-submodule of <code>L_0</code>, and any corona representation detecting an element of <code>L_0</code> must send it to a symmetry <code>1 - 2p</code> with <code>p</code> a nonzero projection of vanishing normalized rank.</p>"}, {"id": "countable-group-mf-conventions", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Equivalent operator-MF formulations and stronger representation variants", "impact": 6, "frontier": false, "lock": null, "html": "<p>For every countable group, the genuine norm-matrix-C-star-corona definition of MF is equivalent to the unitary-sequence definition, to normalized local operator-norm models with separation constant one, and to the variant with strictly increasing positive matrix dimensions.  Each of PMatF, trace-free PPermF, trace-PMF, PFF, and trace-inclusive PPF implies this MF property.</p>\n<p>This hierarchy makes no identification with soficity or hyperlinearity.</p>"}, {"id": "covariance-variance-control", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Covariance controls total single-edge transition variance", "impact": 0, "frontier": false, "lock": null, "html": "<p>Conjugating the explicit source Fourier cut by the actual unitary compressor puts it within the covariance RMS defect of the entire coarse target Fourier cut, a sum of fine extension-character cuts, so <code>\u03a3_\u03b6 \u2016[U P_\u03c7 U*, Q_\u03b6]\u2016\u2082\u00b2 \u2264 2\u00b7(covariance RMS defect)\u00b2</code>. The intrinsic effects round to a fine-outcome PVM with total error below nine times the squared covariance defect, independent of all fiber sizes. Positivity, source gauge, and single-edge measurement recovery are closed. (The finite Pauli model shows separate exact measurements need not be jointly classical \u2014 that is the multi-edge gate, not this theorem.)</p>"}, {"id": "cyclic-base-sharpness", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Property (T) is essential to the central-sign obstruction", "impact": 0, "frontier": false, "lock": null, "html": "<p>For the literal cyclic-base analogue, every exact finite-dimensional representation kills the marked word, but an amenable Clifford quotient detects it and is MF.  Thus the word is not in the MF radical, and property (T) cannot simply be deleted from the central-sign criterion.</p>"}, {"id": "dadarlat-matricial-stability-obstruction", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Dadarlat's matricial-stability obstruction \u2014 exact hypotheses, norm, and cohomology", "impact": 0, "frontier": false, "lock": null, "html": "<p>Read from the PDF of arXiv:2007.12655v2 (Dadarlat, <em>Obstructions to matricial stability of discrete groups and almost flat K-theory</em>) on 2026-08-14, on demand for <code>cairn-torsionfree</code>'s mutual-exclusivity paragraph.  Three questions, three answers.</p>\n<h3>1. The stability notion is point-norm, exactly as hoped</h3>\n<p>&gt; \"A group <code>G</code> is called <code>(U(k_n), ||.||)_n</code>-stable [34] or <strong>matricially &gt; stable</strong> [38] if for any asymptotic homomorphism &gt; <code>{phi_n : G -&gt; U(k_n)}_(n in N)</code> (not necessarily a separating one) there is &gt; a sequence of homomorphisms <code>{pi_n : G -&gt; U(k_n)}_(n in N)</code> such that &gt; <code>lim_(n-&gt;infinity) ||phi_n(s) - pi_n(s)|| = 0</code> for all <code>s in G</code>.\"</p>\n<p>Operator norm on <code>U(k_n)</code>, and the limit is required <strong>for each <code>s</code> separately</strong> \u2014 pointwise on the group, not uniformly over it, and not in any Schatten norm.  So it is point-norm in the intended sense.</p>\n<p><strong>Weakly matricially stable</strong> is the padded variant: for any sequence of ucp maps <code>phi_n : G -&gt; M_(k_n)</code> satisfying his condition (1), there are homomorphisms <code>pi_n^(0), pi_n^(1)</code> with <code>lim ||phi_n(s) \u2295 pi_n^(0)(s) - pi_n^(1)(s)|| = 0</code> for all <code>s in G</code>. Matricial stability implies weak matricial stability; MF implies weak quasidiagonality.</p>\n<h3>2. The cohomological conclusion is rational cohomology, all nonzero even degrees</h3>\n<p>&gt; <strong>Theorem 1.1.</strong> Let <code>G</code> be a countable discrete MF-group that admits a &gt; <code>gamma</code>-element (e.g. <code>G</code> is uniformly embeddable in a Hilbert space).  If &gt; <code>H^(2k)(G, Q) != 0</code> for some <code>k &gt;= 1</code>, then <code>G</code> is not matricially stable.</p>\n<p>&gt; <strong>Theorem 1.2.</strong> Let <code>G</code> be a countable discrete weakly quasidiagonal group &gt; that admits a <code>gamma</code>-element.  If <code>G</code> is weakly matricially stable, then &gt; <code>G</code> is MAP and <code>H^(2k)(G, Q) = 0</code> for all <code>k &gt;= 1</code>.</p>\n<p>Group <strong>cohomology</strong> with <strong>rational</strong> coefficients, in <strong>all</strong> nonzero even degrees \u2014 not homology, not integral, and it is the cohomology of the whole group, not of an almost-flat part.  The MAP conclusion comes along with it.</p>\n<h3>3. Which classes \u2014 Kazhdan groups are neither blanket-in nor blanket-out</h3>\n<p>Two hypotheses carry the theorems: <strong>weak quasidiagonality</strong> (implied by MF) and existence of a <strong><code>gamma</code>-element</strong> (satisfied by uniformly embeddable groups, so in practice rarely the binding one).  The binding constraint is weak quasidiagonality, and for Kazhdan groups it is governed by:</p>\n<p>&gt; <strong>Proposition 3.19 (Ozawa-Thom).</strong> If an infinite property (T) group <code>G</code> is &gt; weakly quasidiagonal, then <code>G</code> has an infinite residually finite quotient.</p>\n<p><strong>Contrapositive, and this is the operative fact:</strong> an infinite property-(T) group with <em>no</em> infinite residually finite quotient is <strong>not</strong> weakly quasidiagonal, hence falls outside Theorem 1.2 entirely.  That is exactly the minimally-almost-periodic regime this program's compression bases live in.</p>\n<p>But the exclusion is not blanket, because of:</p>\n<p>&gt; <strong>Corollary 1.3.</strong> If <code>G</code> is a countable <strong>linear</strong> group such that &gt; <code>H^(2k)(G, Q) != 0</code> for some <code>k &gt;= 1</code>, then <code>G</code> is not weakly matricially &gt; stable.</p>\n<p>Linear groups are uniformly embeddable and quasidiagonal enough for the machinery, so <strong>linear Kazhdan groups are covered</strong> \u2014 and the bases used here (<code>SL_3(Z)</code>, <code>Z^3 \u22ca SL_3(Z)</code>) are linear.  So the right statement is: the theorem applies to a Kazhdan base iff that base is weakly quasidiagonal, which for linear bases it is, and which for an infinite (T) group with no infinite residually finite quotient it provably is not.</p>"}, {"id": "defect-normally-generates-torsion-free-quotient", "status": "ESTABLISHED", "root": false, "goal": false, "title": "The simple factor can be made to normally generate a Kazhdan subgroup of the quotient", "impact": 2, "frontier": false, "lock": "cairn-smallcancel", "html": "<p>In the Fournier-Facio construction (<code><a href=\"fournier-facio-torsion-free-skeleton.html\">fournier-facio-torsion-free-skeleton</a></code>) the Hull common quotient <code>pi : E -&gt; G</code> can additionally be arranged so that the normal closure <code>K = &lt;&lt;pi(S)&gt;&gt;^G</code> of the simple factor is a <strong>Kazhdan</strong> subgroup of <code>G</code> \u2014 for instance so that <code>K</code> has finite index in <code>G</code>, or <code>K = G</code>.</p>\n<p>This is the only gap between the published torsion-free group and a torsion-free finitely presented non-MF group: <code>K</code> is automatically normal, nontrivial, and contained in the compression defect, and property (T) of <code>G</code> passes to <code>K</code> as soon as the index is finite.</p>\n<p><strong>It buys more than it is asked for.</strong>  In its strongest form <code>K = G</code>, this claim also makes <code>G</code> minimally almost periodic, by <code><a href=\"fournier-facio-group-finite-dimensional-shadow.html\">fournier-facio-group-finite-dimensional-shadow</a></code> clause 3 \u2014 and minimal almost periodicity of the Kazhdan source is precisely the hypothesis that both open analytic branches of the central-mark route independently require (<code><a href=\"bounded-rank-corners-excluded.html\">bounded-rank-corners-excluded</a></code> and <code><a href=\"finite-dimensional-models-break-coordinate-generation.html\">finite-dimensional-models-break-coordinate-generation</a></code>).  So a single small-cancellation fact would serve the primary route and both secondary ones.  That is a reason to attack this claim before any of the analytic holes.</p>\n<p><em>(Provenance note: the sections below are <code>cairn-smallcancel</code>'s intended final body, applied by the coordinator from their transcript after the agent's closing Write failed on a concurrent-edit conflict at the moment the session limit hit.  The mathematics is theirs; nothing was altered beyond preserving the paragraph above, which the failed overwrite would have clobbered.)</em></p>\n<h3>Established form</h3>\n<p><code>K = G</code>, the extreme case, so no inheritance of (T) is needed at all.  The argument is in the artifact; the route is <code><a href=\"defect-normally-generates-torsion-free-quotient-proof.html\">defect-normally-generates-torsion-free-quotient-proof</a></code>.</p>\n<p>Two facts sharpen the statement.  First, the defect is not merely a container: <code>defectNormal = &lt;&lt;pi(S)&gt;&gt;^G</code> <strong>exactly</strong>, because <code>t_1 c t_1^{-1}</code> is a nontrivial element of the non-abelian simple group <code>pi(S)</code> and <code>[t_1 c t_1^{-1}, -]</code> therefore generates <code>pi(S)</code> inside any normal subgroup meeting it.  So <code>K = G</code> makes the defect the whole group and the resulting corona statement is the strongest possible: <em>every</em> homomorphism from <code>G</code> to the unitary group of a norm matrix corona is trivial.  Second, <code>G</code> consequently has <strong>no proper subgroup of finite index</strong> \u2014 a finite quotient would kill the infinite simple <code>pi(S)</code>, hence kill <code>&lt;&lt;pi(S)&gt;&gt; = G</code>.  That is the expected shape for a non-MF group (residually finite implies MF), not an inconsistency.</p>\n<p>The general tool extracted from the proof is <code><a href=\"common-quotient-onto-normal-subgroup.html\">common-quotient-onto-normal-subgroup</a></code>: in Hull's machinery the reservoir of small-cancellation target words can be confined to any prescribed infinite normal subgroup of a factor.</p>\n<h3>Ideas</h3>\n<p>Verdicts on the three routes originally recorded, plus the routes that were tried and abandoned.</p>\n<ul>\n<li><em>Finite index</em> \u2014 <strong>superseded, and it was the wrong target.</strong>  The claim</li>\n<p>originally proposed <code>G / &lt;&lt;pi(S)&gt;&gt;</code> finite as the cheapest form.  In fact the construction lands on <code>&lt;&lt;pi(S)&gt;&gt; = G</code> directly, and the finite-index version is not actually cheaper: any nontrivial finite quotient of <code>G</code> would have to kill <code>pi(S)</code> (infinite simple) and hence kill <code>&lt;&lt;pi(S)&gt;&gt;</code>, so <code>G/&lt;&lt;pi(S)&gt;&gt;</code> finite and nontrivial is possible only if <code>&lt;&lt;pi(S)&gt;&gt;</code> is a proper subgroup \u2014 which the construction has no way to arrange more cheaply than arranging equality.</p>\n<li><em>Simplicity</em> \u2014 <strong>not needed, and correctly flagged as dangerous.</strong>  <code>G</code> is</li>\n<p>normally generated by <code>pi(S)</code> but nothing claims <code>G</code> is simple.  No finitely presented simple Kazhdan torsion-free group is used anywhere.</p>\n<li><em>Routed defect</em> (<code>defect_surjective</code>, <code>defectNormal.map source = top</code>) \u2014</li>\n<p><strong>this is what was proved</strong>, in the form <code>defectNormal = G</code>.  The deleted Lean development's field is therefore satisfiable for the concrete group, not only for hypothetical routing data.</p>\n<li>The warning attached to all three (that <code>pi|_S</code> must stay injective) is</li>\n<p>discharged by Hull's injectivity clause 7.1(b) at both small-cancellation stages plus simplicity of <code>S</code>, exactly as the published construction does it; the extra relators change which suitable subgroup is used, not how many elements are protected.</p>\n</ul>\n<p>Dead ends, recorded so they are not re-attempted.</p>\n<ul>\n<li><strong>Inheriting normal generation from <code>E</code>.</strong>  Impossible: <code>E/&lt;&lt;P&gt;&gt;^E</code> is the</li>\n<p>free group on the two stable letters, and <code>&lt;&lt;S&gt;&gt;^E &lt;= &lt;&lt;P&gt;&gt;^E</code>, so <code>E/&lt;&lt;S&gt;&gt;^E</code> always surjects onto <code>F_2</code>.  No choice of <code>U</code>, <code>S</code>, <code>H</code>, <code>P</code> changes this.  The normal generation has to be created by the small-cancellation step.</p>\n<li><strong>Adding relators inside <code>E</code>.</strong>  Relators lying wholly in the free factor</li>\n<p><code>E</code> of <code>E * H</code> are single syllables of the free product, so killing them is an uncontrolled quotient of <code>E</code> outside the small-cancellation regime \u2014 torsion-freeness, <code>pi|_S</code> injectivity, and acylindrical hyperbolicity are all lost as guarantees.  The relators must interleave <code>E</code> and <code>H</code> syllables, which is what Hull's <code>W = t^{-1} h_1^{m_1} h_2^{l_1} ...</code> already does.</p>\n<li>**Classical small cancellation over the free product <code>E * H</code>.**  Cannot</li>\n<p>produce a common quotient at all: <code>C'(1/6)</code> over a free product <em>embeds</em> both factors, so <code>E -&gt;&gt; G</code> and <code>E ,-&gt; G</code> together would force <code>G ~= E ~= H</code>. This is why the acylindrically hyperbolic machinery (where the relators identify a generator with a word in the other factor) is the only route.</p>\n<li>**Making the added relators express each generator as a word in conjugates</li>\n<p>of <code>s</code> directly**, as the original Ideas section proposed.  This works in spirit but is the wrong place to intervene: writing the relator set by hand means re-verifying the <code>C'(epsilon, mu, rho)</code> conditions from scratch. Changing <em>which suitable subgroup Hull's theorem is handed</em> achieves the same effect and leaves every small-cancellation estimate untouched.</p>\n</ul>\n<h3>Addendum 2026-08-14: direct route, external validation, heredity</h3>\n<p>Three developments after the body above was written.</p>\n<p>1. <strong>Direct single-application route</strong> (<code>docs/TORSION_FREE_SATURATION_DIRECT_ROUTE_2026-08-14.md</code>). Instead of re-running Hull's proof of Corollary 7.4 with the routing pair confined to <code>&lt;&lt;S&gt;&gt;^E</code> (the artifact's Theorem B), apply Hull's Theorem 7.1 <strong>once, as a published black box, to the already-constructed Fournier-Facio group <code>G</code></strong>: <code>N = &lt;&lt;pi(S)&gt;&gt;^G</code> is infinite normal in a torsion-free acylindrically hyperbolic group, hence suitable (s-normality plus Osin TAMS 368 Lemma 7.1); Corollary 5.7 + Lemma 5.8 select the loxodromic pair inside <code>N</code>; Theorem 7.1 with a finite generating set of <code>G</code> as prescribed elements gives <code>Q = q(&lt;h_1,h_2&gt;) = q(N)</code>, 2-generated, finitely presented, torsion-free, in AH.  The one extra input is <code>G \u2208 AH_0</code>, not stated in FF's paper but supplied by the finitely-generated clause of Hull's Corollary 7.4, which FF already invokes.  Both routes are valid; the direct one asks an expert to check fewer moving parts. 2. <strong>External validation.</strong>  GitHub issue #1 (closed 2026-08-15) records an independent multi-agent audit of the substitution route \u2014 suitability via Osin, pair selection inside the normal subgroup, Lemma 3.5 transfer, two-stage routing \u2014 with the repo-side reply confirming each step and endorsing the <code>DefectRoutingData</code> certification boundary (do not formalize Hull; kernel-check everything downstream of the routing data). 3. <strong>Heredity strengthening.</strong>  Since <code>Q = &lt;&lt;q pi(S)&gt;&gt;^Q</code>, every nontrivial quotient <code>L</code> of <code>Q</code> retains an injective copy of <code>S</code>, the compression configuration descends (<code>Gamma_L \u2229 J_L = 1</code> by centrelessness of the simple image), and both machine-checked criteria apply to <code>L</code> itself: <code>Rad_MF(L) = L</code> <strong>and</strong> <code>L</code> is nonsofic.  Consequences: <code>Q</code> is perfect, has no proper finite-index subgroup, and its marked presentation plus one inequation gives a nonempty clopen set of 2-marked groups all simultaneously nonsofic and non-MF.  Written out with proofs in <code>docs/TORSION_FREE_SATURATION_DIRECT_ROUTE_2026-08-14.md</code> \u00a7\u00a75-6.</p>"}, {"id": "defect-saturation-full-mf-radical", "status": "OPEN", "root": false, "goal": false, "title": "Defect saturation gives groups with full MF radical", "impact": 0, "frontier": false, "lock": null, "html": "<p>Credit: the small-cancellation route is Fournier-Facio's suggestion (personal communication 2026-08-14, \"analogously to what I do in arXiv:2608.02025\"); the saturation/full-radical framing is a session development of that idea (GPT-5.6-assisted), unrefereed.</p>\n<p>Claim: there is a 2-generated finitely presented torsion-free property-(T) acylindrically hyperbolic group G whose compression defect is all of G, so that (by the in-repo normalKazhdan_le_normMFResidual) Rad_MF(G) = G: every homomorphism to an MF group is trivial and every nontrivial quotient is non-MF.  Route: FF's arXiv:2608.02025 compression configuration + a Hull Theorem 7.1 quotient making the surviving simple subgroup normally generate.  The Lean plumbing (saturation implies full radical, black-hole quotient triviality, non-MF-ness) is now machine-checked unconditionally in GroupApproximation/Sofic/DefectSaturation.lean; the existence input still needs a Hull/Osin small-cancellation formalization program.</p>"}, {"id": "diagonal-normalizer-rigidity", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Approximate normalizers of a full diagonal masa are monomial", "impact": 0, "frontier": false, "lock": null, "html": "<p>For <code>u \u2208 U(N)</code> let</p>\n<pre>\ndef_D(u) = sup{ \u2016u f u* \u2212 E_(D_N)(u f u*)\u2016\u2082 : f = f* \u2208 D_N, \u2016f\u2016 \u2264 1 }\n</pre>\n<p>measure how far <code>u</code> is from normalizing the <strong>full</strong> diagonal masa <code>D_N</code>, in normalized Hilbert\u2013Schmidt norm.</p>\n<p>1. <strong>Rigidity.</strong> <code>def_D(u) \u2264 \u03b4</code> implies <code>\u2016u \u2212 w\u2016\u2082 \u2264 3\u221a\u03b4</code> for some monomial unitary <code>w = P_\u03c3 d</code>. (Proof: <code>A_ij = |u_ij|\u00b2</code> is doubly stochastic and the defect equals <code>sup(\u2016f\u2016\u2082\u00b2 \u2212 \u2016Af\u2016\u2082\u00b2)</code>; random signs force <code>E_i[max_j A_ij] \u2265 1 \u2212 \u03b4\u00b2</code>.) 2. <strong>Ultraproduct form.</strong> <code>N(D_\ud835\udcb0) = \ud835\udcae_\ud835\udcb0 \u22c9 U(D_\ud835\udcb0)</code>, with unique factorization. 3. <strong>Transfer.</strong> <code>\u2016\u00b7\u2016\u2082</code>-multiplicativity of <code>\u03c6 : \u0393 \u2192 U(N)</code> passes to Hamming multiplicativity of the extracted permutations <code>\u03c0(g)</code>, with defect <code>(\u03b5 + 9\u221a\u03b4)\u00b2/2</code>. 4. <strong>Consequence (permutations are not needed in P\u0103unescu's definition).</strong> For <code>G</code> sofic, a trace-preserving embedding <code>\u0398 : L^\u221e(X) \u22ca G \u2192 \u220f_\ud835\udcb0 M_(d_n)</code> with <code>\u0398(L^\u221e(X)) \u2286 D_\ud835\udcb0</code> and merely <code>\u0398(u_g) \u2208 N(D_\ud835\udcb0)</code> already makes the action sofic in the sense of Kun\u2013Thom Definition 2.2. The diagonal phases are removed by untwisting (<code>c_g \u2208 U(D_\ud835\udcb0)</code> commutes with <code>\u0398(L^\u221e(X))</code>, so the permutation part alone implements the action) and the residual trace defect by tensoring with a free sofic representation of <code>G</code>.</p>\n<p>Clause 1 is sharp in its hypothesis: it needs the <strong>full</strong> masa. If only a coarse subalgebra must be respected, the Fourier-block unitary <code>\u2295_j F_(m_n)</code> centralizes it while sitting at distance <code>\u221a2</code> from every monomial.</p>"}, {"id": "doubling-quotient-residually-finite", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Residual finiteness of the abelianized-lamp doubling quotient", "impact": 1, "frontier": false, "lock": null, "html": "<p>For G = (Z[1/2]^3 x| SL3(Z)) x| Z with doubling stable letter and K finite, the quotient K_ab^(Z) x| G is residually finite: G embeds in GL4(Z[1/2]) (odd-prime congruence separation), and the quotient embeds in G x (K_ab wr Z) via the height homomorphism.</p>"}, {"id": "edge-pair-mixed-gap-collapse", "status": "OPEN", "root": false, "goal": false, "title": "Mixed-gap collapse for high-dimensional edge-irreducible pairs", "impact": 1, "frontier": true, "lock": null, "html": "<p>The reduced form of the Iwahori endpoint after <a href=\"iwahori-outlier-localization.html\">iwahori-outlier-localization</a>: a negative sequence forces high-dimensional pairs of edge irreducibles, each extending through an opposite modular vertex, whose mixed gap collapses along a near-unitary intertwiner. Arbitrary sparse operator subspaces are no longer part of the gate.</p>"}, {"id": "effective-transport-modulus", "status": "OPEN", "root": true, "goal": false, "title": "Explicit numerical modulus for the literal operator-norm obstruction", "impact": 0, "frontier": true, "lock": null, "html": "<p>Compute an explicit positive defect threshold and error function, directly from the rational property-(T) certificate and the forty-one displayed relators, that force every finite-dimensional approximate model to send the marked word close to the identity uniformly in the dimension.</p>"}, {"id": "exact-stably-finite-non-mf-reduced-group-algebra", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Concrete exact stably finite reduced group algebra that is not MF", "impact": 0, "frontier": false, "lock": null, "html": "<p>The concrete reduced group C-star algebra <code>C*_r(W)</code> is separable and exact, has a faithful tracial state, is stably finite in every finite matrix amplification, and is not MF.</p>"}, {"id": "exceptional-mixed-pair-is-infinite-dihedral", "status": "ESTABLISHED", "root": false, "goal": false, "title": "The first exceptional raw/comb pair generates the infinite dihedral group", "impact": 0, "frontier": false, "lock": null, "html": "<p>Let <code>g=U*X_1U</code> and <code>r=raw</code>.  Both are involutions and the exact grading argument proves that <code>h=[g,r]=(gr)^2</code> has infinite order.  Hence <code>gr</code> has infinite order.  The group generated by two involutions whose product has infinite order is</p>\n<pre>\n&lt;g,r | g^2=r^2=1&gt; = C2 * C2 = D_infinity.\n</pre>\n<p>In particular <code>g h g=h^(-1)=r h r</code>: the detected direction is bilateral, virtually cyclic, amenable, sofic, and hyperlinear.</p>"}, {"id": "exel-loring-mark-quantization", "status": "OPEN", "root": false, "goal": false, "title": "The Exel--Loring winding number pins the phase of an infinite-order central mark", "impact": 1, "frontier": true, "lock": null, "html": "<p>Let <code>1 -&gt; Z -&gt; Gtilde -&gt; Gamma -&gt; 1</code> be a central extension with class <code>c in H^2(Gamma; Z)</code>, let <code>x in H_2(Gamma; Z)</code> be represented by a product of commutators <code>prod_{i&lt;=g} [a_i, b_i]</code> that is trivial in <code>Gamma</code>, and suppose the pairing <code>&lt;c, x&gt; = k != 0</code>, so that the lifted product of commutators equals <code>zeta^k</code> in <code>Gtilde</code>.  Suppose also that <code>Gtilde</code> carries the Kazhdan compression data with <code>zeta</code> in the normal closure of the compression defect.  Then every corona representation of <code>Gtilde</code> kills <code>zeta</code>: the Exel--Loring winding number of the lifted model forces the trace of the argument of the mark to equal a K-theoretic pairing, transport forces the mark to be Hilbert--Schmidt invisible so that trace vanishes, and the group data make the pairing nonzero.  Consequently, if <code>zeta != 1</code> then <code>Gtilde</code> is not MF.</p>\n<p>This is a <strong>programme, not a theorem</strong>.  Two hypotheses of the published formula are not currently met by the intended application, and they are stated precisely below.</p>\n<h3>Ideas</h3>\n<p><strong>What the primary text actually says.</strong>  Dadarlat, <em>Quasi-representations of groups and two-homology</em>, arXiv:2111.05755v1, read this session. Theorem 1.1, verbatim in content: for <code>Gamma</code> countable discrete and <code>x in H_2(Gamma,Z)</code> represented as above, there are a <strong>finite set</strong> <code>S subset Gamma</code> and <code>eps &gt; 0</code> \u2014 both independent of the dimension \u2014 such that every unital <code>pi : Gamma -&gt; U(n)</code> with <code>\u2016pi(st) - pi(s)pi(t)\u2016 &lt; eps</code> for <code>s,t in S</code> satisfies</p>\n<p>pi_# (alpha_Gamma(x)) = wn det( (1-t) 1_n + t prod_i [pi(a_i), pi(b_i)] ) = (1/2 pi i) Tr log( prod_i [pi(a_i), pi(b_i)] ).</p>\n<p>Equation (3) of the same paper gives the tracial form: for <code>A</code> unital with trace <code>tau</code> and <code>pi : Gamma -&gt; U(A)</code> with the same defect bound, <code>tau_*(pi_#(alpha_Gamma(x))) = (1/2 pi i) tau(log(prod_i [pi(a_i), pi(b_i)]))</code>. A norm matrix corona carries the trace <code>lim_omega tr_{d_n}</code>, so the tracial form is available on exactly the target of this program.  Theorem 3.2 is the nontriviality statement: if <code>Gamma</code> is quasidiagonal, admits a <code>gamma</code>-element, and <code>x</code> has infinite order in <code>H_2</code>, then some quasi-representation has nonzero winding number, hence is not perturbable to a representation (Corollary 3.3).</p>\n<p><strong>Why this is the right shape.</strong>  The formula measures a relation that holds in the group but only approximately in the model \u2014 which is precisely the compression defect.  Its value is an integer, so it is a natural home for a mark of infinite order, where a two-point spectrum is unavailable.  It is also relative, pairing the mark against an <code>H_2</code> class rather than looking at the mark alone, which is the only shape <code><a href=\"matrix-corona-k1-vanishes.html\">matrix-corona-k1-vanishes</a></code> leaves open; and by <code><a href=\"matrix-corona-k0-index-survives.html\">matrix-corona-k0-index-survives</a></code> such classes do survive the corona quotient.</p>\n<p><strong>Blocker 1: the quasi-representation is not multiplicative enough.</strong> Lifting a corona representation of <code>Gtilde</code> through <code>Gtilde -&gt; Gamma</code> gives a map <code>pi</code> whose multiplicative defect is <code>Theta(zeta)^{c(s,t)} - 1</code>.  That is small in operator norm only if the mark is close to <code>1</code> in operator norm \u2014 the opposite of the separation one is trying to contradict.  The escape is the near-scalar case: if <code>Theta(zeta)</code> is within <code>delta</code> of a scalar <code>lambda</code>, the lift is a <strong>projective</strong> quasi-representation with cocycle <code>lambda^c</code>, and one needs a twisted form of Theorem 1.1.  Note where this lands: <code><a href=\"corona-corner-detection-criterion.html\">corona-corner-detection-criterion</a></code> proves the spectrum of the mark is a connected arc through <code>1</code> or the whole circle, and the near-scalar case is exactly the arc case that the corner method cannot close.  <strong>The two tools attack complementary halves of the same residual case</strong>, which is the main reason to keep this programme alive.</p>\n<p><strong>Blocker 2: the nontriviality theorem points the wrong way.</strong>  Theorem 3.2 assumes <code>Gamma</code> <strong>quasidiagonal</strong>, and a quasidiagonal group is MF.  So the published nontriviality criterion can never be applied to a non-MF candidate: its hypothesis contradicts the conclusion being sought.  What this repository can take from the paper is Theorem 1.1 and equation (3), which assume nothing about <code>Gamma</code> beyond countability; nonvanishing of the pairing for the candidate group would have to be proved separately.  This corrects the framing in <code><a href=\"exel-loring-relative-quasirep-invariant.html\">exel-loring-relative-quasirep-invariant</a></code>: the second Betti number hypothesis is not a hurdle for us to clear, because the theorem carrying it is unusable here in either case.</p>\n<p><strong>A genuine incompatibility, worth recording.</strong>  The mark needs <code>&lt;c, x&gt; != 0</code> for some <code>x in H_2(Gamma;Z)</code>, which forces <code>c</code> to have infinite order and hence a nonzero image in <code>H^2(Gamma; Q)</code>.  By Dadarlat, <em>Obstructions to matricial stability of discrete groups and almost flat K-theory</em>, arXiv:2007.12655 (abstract read), matricial stability \u2014 finite dimensional approximate unitary representations perturbable to genuine ones in the <strong>point-norm</strong> topology \u2014 implies vanishing of rational cohomology in all nonzero even dimensions, for large classes of groups.  So a base group carrying a usable Exel--Loring mark is, for those classes, <strong>not</strong> matricially stable.  The Exel--Loring route and the stability route of Bachner--Dogon--Lubotzky are therefore mutually exclusive on the same base group.  This also explains why Bachner--Dogon--Lubotzky's condition (<code>*</code>) is a mixed operator-to-Hilbert--Schmidt statement rather than a point-norm one: the point-norm version is obstructed exactly where their marks live.</p>\n<p><strong>Hedge resolved, and the narrowing is by a checkable property.</strong>  The primary text has since been read (cairn-scout, recorded at <code>research/<a href=\"dadarlat-matricial-stability-obstruction.html\">dadarlat-matricial-stability-obstruction</a>.md</code>).  Two hypotheses carry the theorems: <strong>weak quasidiagonality</strong> and a <code>gamma</code>-element, the latter following from uniform embeddability and rarely binding.  The binding one is weak quasidiagonality, and for Kazhdan groups it is governed by Dadarlat's Proposition 3.19, attributed to Ozawa--Thom: an infinite property-(T) group that is weakly quasidiagonal has an infinite residually finite quotient.  So an infinite Kazhdan group with no infinite residually finite quotient \u2014 the minimally almost periodic regime \u2014 falls outside the theorems entirely, while <strong>linear</strong> Kazhdan bases are covered by Corollary 1.3 and are inside.</p>\n<p>The incompatibility recorded above therefore holds on linear Kazhdan bases, such as <code>SL_3(Z)</code> and <code>Z^3 semidirect SL_3(Z)</code>, and does <strong>not</strong> apply to a minimally almost periodic base.  Since minimal almost periodicity is precisely the regime the rest of this cluster is being pushed into, the practical reading is that the Exel--Loring route and the stability route stop being mutually exclusive exactly where this program wants to work \u2014 so the constraint governs route selection over linear bases and is silent over the candidate that matters.</p>"}, {"id": "exel-loring-relative-quasirep-invariant", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Exel--Loring two-homology invariants of quasi-representations survive where K-one dies", "impact": 0, "frontier": false, "lock": null, "html": "<p><code><a href=\"matrix-corona-k1-vanishes.html\">matrix-corona-k1-vanishes</a></code> establishes that no invariant of the marked unitary <em>alone</em> can obstruct a corona representation, and closes with the observation that \"any surviving index argument must be relative \u2014 an invariant of the mark <strong>together with</strong> another almost-commuting operator, as in the Bott index of an almost commuting pair\".  The literature already contains the developed form of exactly that invariant.</p>\n<p>**Dadarlat, <em>Quasi-representations of groups and two-homology</em>, arXiv:2111.05755<strong> (2021-11-18).  Verified from the abstract: the paper generalizes the </strong>Exel--Loring formula** for quasi-representations of countable discrete groups, and shows nontriviality of the resulting invariants \"for quasidiagonal groups which are coarsely embeddable in a Hilbert space and have nonvanishing second Betti number\".</p>\n<p>The Exel--Loring formula is the group-level form of the Bott index of an almost commuting pair: it pairs a quasi-representation against a class in <code>H_2</code> of the group, and the invariant lives where a single unitary's <code>K_1</code> class does not.  So the relative index programme that <code><a href=\"matrix-corona-k1-vanishes.html\">matrix-corona-k1-vanishes</a></code> calls for is not hypothetical \u2014 it has an existing home, and the natural first question for this repository is what that invariant does on the marked pair of the literal construction.</p>\n<p>Companion, same author: **Dadarlat, <em>Obstructions to matricial stability of discrete groups and almost flat K-theory</em>, arXiv:2007.12655** \u2014 matricial stability implies vanishing of rational cohomology in nonzero even dimensions.  (This is already cited in the repository for its Lemma 3.18 and Proposition 3.19; the <em>stability obstruction</em> half of the paper is the part relevant here.)</p>\n<p><strong>Caveat, now discharged for the first paper.</strong>  The primary text of arXiv:2111.05755v1 has been read: Theorem 1.1, its tracial form equation (3), and Theorem 3.2.  The pairing, the norm (operator), and the dimension-independent finite set and defect bound are recorded in <code><a href=\"exel-loring-mark-quantization.html\">exel-loring-mark-quantization</a></code>, along with the two hypotheses that block the intended deployment.  One correction belongs here.  The second Betti number hypothesis sits in Theorem 3.2, whose standing hypothesis is that the group is <strong>quasidiagonal</strong> \u2014 and a quasidiagonal group is MF.  So that nontriviality criterion cannot be applied to a non-MF candidate at all, and checking Betti numbers against a candidate is not the live question; what transfers is Theorem 1.1, which assumes nothing beyond countability. arXiv:2007.12655 remains abstract-level only.</p>"}, {"id": "faithfully-traced-unital-coordinates", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Unital C-star algebras with a faithful trace are a corner-stable finite coordinate class", "impact": 2, "frontier": false, "lock": null, "html": "<p>Let <code>C_ftr</code> be the class of pairs <code>(A,tau)</code> with <code>A</code> a unital C-star algebra and <code>tau</code> a faithful tracial state.  Then</p>\n<p>1. every <code>A</code> in <code>C_ftr</code> is finite (every isometry is unitary), and the norm ultraproduct and the norm corona of any sequence from <code>C_ftr</code> are finite; 2. <code>C_ftr</code> is closed under nonzero corners: <code>tau(p)&gt;0</code> automatically, and <code>(pAp, tau(p . p)/tau(p))</code> lies in <code>C_ftr</code>; 3. projections lift from <code>prod_k A_k / directSum_k A_k</code> to <code>prod_k A_k</code>, and the corner of the corona at a lifted projection <code>p=(p_k)</code> is the corona of the corners <code>p_k A_k p_k</code>; 4. the tracial ultraproduct <code>M</code> of <code>(A_k,tau_k)</code> is a finite von Neumann algebra, and the algebra <code>M or JMJ</code> generated by the conjugation action on <code>L^2(M,tau_omega)</code> is finite.</p>\n<p>These are exactly the four properties the matrix-coordinate compressor argument uses of <code>M_d</code> with its normalized trace.  Item 1 is the property the manuscript itself isolates as load bearing: in the ultraproduct formulation (<code>docs/NO_ONE_SIDED_GROWTH.md</code>) the chain is <code>P &lt;= VPV^<em></code>, <code>P ~ VPV^</em></code>, and \"the norm-matrix corona is finite, so <code>P = VPV^*</code>\", the finiteness being proved by polar correction of a representing sequence --- an argument which never mentions matrices.  Nothing else about matrices is used, and no real-rank-zero, nuclearity, simplicity, comparison or classification hypothesis is needed.</p>"}, {"id": "fiber-masa-free-cocycle", "status": "OPEN", "root": false, "goal": false, "title": "A lamp embedding with no invariant coarse block decomposition", "impact": 1, "frontier": true, "lock": null, "html": "<p>Construct a hyperlinear model of <code>W</code> \u2014 finite data <code>\u0398_n</code> on <code>\u2102^{d_n}</code> that is <code>(F,\u03b5)</code>-multiplicative and <code>(F,\u03b5)</code>-separated in the normalized Hilbert\u2013Schmidt metric, in the sense of <code>Sofic/Hyperlinear.HyperlinearModel</code> \u2014 in which the image of the lamp algebra admits <strong>no invariant coarse block decomposition</strong>: there is no tensor splitting</p>\n<p>\u2102^{d_n} \u2245 \u2102^{Y_n} \u2297 \u2102^{m_n}</p>\n<p>with <code>\u0398(a_x) \u2208 D_{Y_n} \u2297 1</code> for the lamps and every <code>\u0398(u_g)</code> block-monomial over <code>Y_n</code>, and more: the defect of every such candidate splitting must stay bounded away from zero, uniformly over windows.</p>\n<h3>RESTATEMENT AUDIT (2026-08-14)</h3>\n<p>Re-derived after the team-wide \"restatement dressed as reduction\" warning, and it does not come out clean.</p>\n<p>Clause 3's <em>exact</em> half is implied by the target. <code><a href=\"block-monomial-coordinate-collapse.html\">block-monomial-coordinate-collapse</a></code> is established: no block-monomial fiber model of <code>M_KT</code> exists. So if <code>W</code> is hyperlinear at all, any hyperlinear model of it automatically fails to be block-monomial with the lamps in a coarse diagonal \u2014 the exact non-existence is free, not something a construction has to arrange. Modulo that established claim, \"hyperlinear model with no exact invariant coarse block structure\" is equivalent to \"hyperlinear model\", and <code><a href=\"growing-fiber-models.html\">growing-fiber-models</a></code> is to that extent a renaming of <code><a href=\"hyperlinear-wreath-model.html\">hyperlinear-wreath-model</a></code>.</p>\n<p>The <em>quantitative</em> half \u2014 that the defect of every candidate splitting stay bounded away from zero, uniformly over windows \u2014 is genuinely stronger than the target rather than equivalent to it. But that is the opposite defect and no better: a model could exist whose defects tend to zero without ever vanishing, so this claim can fail while <code>W</code> is hyperlinear. The strengthening was not forced by anything; it came from trying to describe what a model must look like, and it makes the prerequisite potentially harder than the goal.</p>\n<p>So the honest reading is: <strong>this is a specification of the surviving model shape, not a reduction.</strong> It is kept because the specification is informative \u2014 it is what the two collapse theorems leave standing, and it tells a builder where the defect has to come from \u2014 but it should not be counted as an independent hole in the frontier. All three live routes into <code><a href=\"hyperlinear-wreath-model.html\">hyperlinear-wreath-model</a></code> fail this audit; see <code><a href=\"simultaneous-dilation-splice.html\">simultaneous-dilation-splice</a></code> and <code><a href=\"wreath-amenable-near-representation.html\">wreath-amenable-near-representation</a></code> for the other two.</p>\n<h3>On the slug, and on masas</h3>\n<p>The slug says \"masa\" and the requirement does not, deliberately. cairn-bernoulli is right that demanding no invariant <em>maximal abelian subalgebra</em> is stronger than necessary: their Lemma 3 runs on the doubly stochastic matrix <code>|u_ij|\u00b2</code> in a fixed matrix-unit system, so a masa that is not a diagonal ultraproduct \u2014 a singular masa, say \u2014 supplies no such matrix, yields no permutations, and is harmless if invariant. The coarse-block phrasing above avoids the issue entirely: it never mentions masas.</p>\n<p>It also subsumes their weakening rather than sitting beside it. At <code>m_n = 1</code> the splitting is trivial, <code>Y_n</code> is the whole index set, and block-monomial means monomial; by their rigidity theorem a unitary approximately normalizing the full diagonal ultraproduct is close to a monomial. So the <code>m_n = 1</code> case of the clause <em>is</em> \"no invariant diagonal ultraproduct\", i.e. exactly the negation of <code><a href=\"invariant-cartan-completion.html\">invariant-cartan-completion</a></code>, and the <code>m_n &gt; 1</code> cases are the additional content that <code><a href=\"block-monomial-coordinate-collapse.html\">block-monomial-coordinate-collapse</a></code> forces. The clause is therefore the weakest form that is still sufficient. The slug is kept because slugs are addresses, not descriptions, and <code><a href=\"growing-fiber-models.html\">growing-fiber-models</a></code> points here.</p>\n<h3>Why the requirement is stated this strongly</h3>\n<p>Three successive weakenings were tried and each is refuted, which is what fixes the final form.</p>\n<p><em>Permutation normalizers.</em> Refuted by Kun\u2013Thom Corollary D (<code><a href=\"coordinate-action-not-sofic.html\">coordinate-action-not-sofic</a></code>).</p>\n<p><em>Full-masa normalizers.</em> Refuted by <code><a href=\"diagonal-normalizer-rigidity.html\">diagonal-normalizer-rigidity</a></code>: an approximate normalizer of the full diagonal masa is close to a monomial, and the diagonal phases untwist, so this reduces to the permutation case.</p>\n<p><em>Coarse block structure.</em> Refuted by <code><a href=\"block-monomial-coordinate-collapse.html\">block-monomial-coordinate-collapse</a></code>. This is the one that looked like a door and is not. <code><a href=\"diagonal-normalizer-rigidity.html\">diagonal-normalizer-rigidity</a></code> is sharp in needing the <em>full</em> masa \u2014 the Fourier-block unitary <code>\u2295_j F_m</code> centralizes a coarse block-constant subalgebra at distance <code>\u221a2</code> from every monomial \u2014 but distance from monomials was never the relevant measurement. A Fourier-block unitary still <em>has</em> a permutation part over the coarse index set, that part is still multiplicative by a rigidity estimate uniform in the fiber dimension, and the lamps still ride on the coarse coordinates. Growing the fiber dilutes traces; it does not dilute a displaced block.</p>\n<h3>What is left, and why it is not vacuous</h3>\n<p>The lamp algebra is diffuse abelian, so it can always be conjugated into the diagonal, and a window <code>{a_x : x \u2208 E}</code> has exactly <code>2^{|E|}</code> atoms of equal trace <code>2^{-|E|}</code>. So a coarse decomposition with equal blocks is <em>always</em> present approximately, and <code>\u0398(u_g)</code> for <code>g</code> in a window always permutes those atoms approximately. The content of the claim is entirely quantitative: the defect must not vanish.</p>\n<p>That is not vacuous, and the reason is already in the corpus. The defect for the atom decomposition of a window <code>E \u2286 G/\u0393</code> is governed by the boundary of <code>E</code> under the group action, and <code>G \u21b7 G/\u0393</code> has no F\u00f8lner sets \u2014 property (T) with infinite index \u2014 so the boundary carries a constant fraction of <code>E</code>. One mismatched coordinate costs a configuration-space defect of order one (<code>docs/OBSTRUCTIONS.md</code> \u00a73, amplification). The amplification obstruction, which has always been read as an argument against models, is on this reading the only known <em>source</em> of the non-vanishing defect the claim requires. Whether that is enough, or whether amplification kills the model before it supplies the defect, is the open question \u2014 and it is now a single quantitative question about one number rather than a search for an architecture.</p>\n<h3>A second acceptance test, which clause 3 does not supply</h3>\n<p>Any candidate cocycle has to pass a test that has nothing to do with block structure. Kun\u2013Thom derive Theorem A from their <strong>Theorem 4.1</strong> \u2014 the centralizer of <code>\u03c3(\u0393)</code> is normalized by <code>\u03c3(G)</code> \u2014 not from Corollary D, and nothing downstream of Theorem 4.1 uses permutations: only that <code>\u0393</code> fixes the base coset, that distinct cosets give distinct lamps, and that a strict compressor exists. So a Hilbert\u2013Schmidt analogue of Theorem 4.1 alone would refute hyperlinearity of <code>W</code>, with no masa and no coarse decomposition anywhere in the argument. That is <code><a href=\"kt-centralizer-normalization-hs.html\">kt-centralizer-normalization-hs</a></code>, which invalidates <code><a href=\"growing-fiber-models.html\">growing-fiber-models</a></code> if established.</p>\n<p>Concretely, a cocycle can satisfy clause 3 in full and still fail by putting <code>\u03c1(a_{t\u0393})</code> in the relative commutant of <code>\u03c3(\u0393)</code>. Check that separately; clause 3 does not imply it and was never designed to. (Flagged by cairn-bernoulli.)</p>\n<h3>Design input available</h3>\n<p>The Fourier-block calculation in <code>docs/NOTEPAD.md</code> is the finite-dimensional mechanism for breaking a masa at maximal angle, and Weyl (clock-and-shift) fibers are its natural group-theoretic packaging. It is not sufficient on its own \u2014 that is exactly what <code><a href=\"block-monomial-coordinate-collapse.html\">block-monomial-coordinate-collapse</a></code> establishes \u2014 but any construction that succeeds will contain something like it, applied so that no coarse index set survives rather than so that no masa survives.</p>\n<p><strong>Check before building.</strong> The corpus has extensive Weyl/Clifford/Pauli machinery developed for the operator-norm (non-MF) programme, much of it recorded as FALSE. That is a different property and those refutations do not transfer, but the constructions might, and the <code>docs/FALSE_DUAL_HEISENBERG_*</code> family should be read before any fiber cocycle is writ
