ng-part witness the question is entirely about the acting part's contribution.</p>\n<p>This is a <strong>sufficient</strong> condition only.  Hyperlinearity is not known to return a weak-soficity witness \u2014 hyperlinear approximations live in <code>U(n)</code>, not in finite groups \u2014 so a negative answer for Glebsky's construction would not show the Kun--Thom wreath non-hyperlinear.  What the criterion does give is one finite, mechanical route from the settled statement \"the Kun--Thom wreath is weakly sofic and not sofic\" to Question 3.4: whether Glebsky's witnesses admit a uniformly Hilbert embeddable reparametrization.</p>"}, {"id": "hilbert-embeddable-length-lp-feasibility", "status": "ESTABLISHED", "root": false, "goal": false, "title": "The Hilbert embeddable witness question is a finite linear program over class functions", "impact": 0, "frontier": false, "lock": null, "html": "<p>Fix a finite group <code>H</code>, a defect set <code>X \u2286 H</code>, a target set <code>T \u2286 H</code> that is <code>n</code>-separated from <code>X</code>, and a separation constant <code>c &gt; 0</code>. Four facts.</p>\n<p>1. <strong>The truncation is removable.</strong> Glebsky's length is <code>min{d(1,\u00b7)/n, 1}</code> for <code>d</code> the word metric of the Cayley graph <code>\u0393(H, X^H)</code>. Replace it by <code>\u2113'(h) = 1 \u2212 exp(\u2212d(1,h)/n)</code>. If <code>d</code> is conditionally negative definite so is <code>\u2113'</code> (Schoenberg: <code>exp(\u2212td)</code> is positive definite, and <code>1</code> minus a normalized positive definite function is conditionally negative definite). The profile is unchanged: <code>\u2113' \u2248 1/n</code> on defects, <code>\u2113' \u2265 1 \u2212 e\u207b\u00b9 &gt; 0.63</code> on <code>n</code>-separated elements. So the whole question is whether the <strong>untruncated conjugation-invariant word metric</strong> is conditionally negative definite. 2. <strong>Glebsky's length is the pointwise maximum of the admissible ones.</strong> If <code>\u2113</code> is any invariant length with <code>\u2113 \u2264 1/n</code> on <code>X</code>, then subadditivity and conjugation invariance give <code>\u2113(x\u2081^{g\u2081}\u00b7\u00b7\u00b7x_k^{g_k}) \u2264 k/n</code>, so <code>\u2113 \u2264 d(1,\u00b7)/n</code> pointwise. He therefore takes the length that separates best and has the least reason to be conditionally negative definite. 3. <strong>Conjugation-invariant word metrics are not conditionally negative definite in general, and the smallest nonabelian case already fails.</strong> The <code>\ud835\udd3d\u2082</code>-rank length on <code>GL\u2082(\ud835\udd3d\u2082)</code> recorded as the calibrating failure in <code><a href=\"hilbert-embeddable-length-hyperlinearity.html\">hilbert-embeddable-length-hyperlinearity</a></code> <strong>is</strong> such a word metric: <code>GL\u2082(\ud835\udd3d\u2082) \u2245 S\u2083</code>, and <code>rank(g\u22121)/2</code> is half the word metric with respect to the transposition class, <code>d = (0,1,1,1,2,2)</code>. Expanding <code>d = a\u00b71 + b\u00b7sgn + c\u00b7\u03c7</code> gives <code>c = \u22122/3</code>, <code>a = 7/6</code>, <code>b = +1/6 &gt; 0</code>. So the upper endpoint of the admissible interval can fail, and any repair must go strictly below it. (The cyclic case is safe: <code>min{k, m\u2212k}</code> on <code>\u2124/m</code> has nonpositive coefficients at every nontrivial character.) 4. <strong>Feasibility is a finite linear program.</strong> Every constraint on the class function <code>\u2113</code> is linear: <code>\u2113(1) = 0</code> and <code>\u2113 \u2265 0</code>; subadditivity <code>\u2113(gh) \u2264 \u2113(g) + \u2113(h)</code> (finitely many inequalities); <code>\u2113 \u2264 1/n</code> on <code>X</code> and <code>\u2113 \u2265 c</code> on <code>T</code>; and conditional negative definiteness, which by the character criterion is \"the coefficient of every nontrivial irreducible is <code>\u2264 0</code>\". So for each candidate <code>H</code> the existence of a Hilbert embeddable witnessing length is decidable, and an infeasibility certificate is an LP dual: a positive combination of character functionals and subadditivity relations forcing a positive coefficient.</p>\n<p>This converts <code><a href=\"hilbert-embeddable-witness-for-kun-thom-wreath.html\">hilbert-embeddable-witness-for-kun-thom-wreath</a></code> from \"inspect Glebsky's metric\" into \"decide a linear program on the finite groups his Proposition 5 supplies\", and it explains why item 3 is not fatal \u2014 the failing length is only the endpoint of the interval the program searches.</p>\n<p>5. <strong>The separation constraint collapses, and the program becomes a character ratio.</strong> By <code><a href=\"hilbert-embeddable-amplification.html\">hilbert-embeddable-amplification</a></code> the separation level is free: tensoring the realizing representation sends defect <code>\u03b4 \u21a6 \u221a\u03b4</code> and separation <code>c \u21a6 1 \u2212 e^{\u2212c/\u221a\u03b4} \u2192 1</code>, so <code>\u2113 \u2265 c</code> on the targets may be weakened to <code>\u2113 &gt; 0</code> on the targets. What remains is the interaction of <code>\u2113 \u2264 \u03b5</code> on <code>X</code> with the cone alone, and by <code><a href=\"hilbert-embeddable-is-representation-realized.html\">hilbert-embeddable-is-representation-realized</a></code> the cone is generated by the <code>\u03c8_\u03c7</code>. For a single defect element <code>x</code> and the mark <code>w</code>, maximizing <code>\u03a3 a_\u03c7 \u03c8_\u03c7(w)</code> subject to <code>\u03a3 a_\u03c7 \u03c8_\u03c7(x) \u2264 1</code>, <code>a \u2265 0</code> is an LP whose optimum sits on an extreme ray, i.e. on a <strong>single</strong> irreducible. Hence</p>\n<pre>\n   R(K, x, w) = sup_\u2113 \u2113(w)/\u2113(x) = max_{\u03c7 \u2260 triv} (\u03c7(1) \u2212 Re \u03c7(w))/(\u03c7(1) \u2212 Re \u03c7(x)),\n</pre>\n<p>a ratio read straight off the character table, and a Hilbert embeddable witness exists along a family of models iff <code>R \u2192 \u221e</code> along it. (For several defect elements the denominator is a max of linear functionals and the optimum may mix, but the single-defect case already fixes the shape.)</p>\n<p>The ratio is unchanged if the <strong>normalized</strong> generators <code>g_\u03c7 = 1 \u2212 Re \u03c7/\u03c7(1)</code> are used instead of <code>\u03c8_\u03c7 = \u03c7(1) \u2212 Re \u03c7</code>, since <code>\u03c8_\u03c7 = \u03c7(1)\u00b7g_\u03c7</code> and a positive rescaling of cone generators cannot change the maximum of a ratio of two linear functionals over the cone. The normalized form is the one to state, because by <code>cairn-survivor</code>'s correction it is the dimension-free one: the LP is a program in the normalized multiplicity vector <code>\u03bb</code> on the <strong>simplex</strong>, with defect constraint <code>\u03a3 \u03bb_\u03c7 (1 \u2212 Re \u03c7(x)/\u03c7(1)) \u2264 \u03b4</code> and separation constraint <code>\u03a3 \u03bb_\u03c7 Re \u03c7(y)/\u03c7(1) \u2264 1 \u2212 c</code>. In that form the character-gap collapse is one line: if <code>|\u03c7(x)|/\u03c7(1) \u2264 c &lt; 1</code> for all nontrivial <code>\u03c7</code> and all <code>x \u2260 1</code>, then <code>Re \u03c6(x) \u2264 1 \u2212 (1\u2212c)(1 \u2212 \u03bb_triv)</code>, so <code>\u03c6 \u2248 1</code> on <code>X</code> forces <code>\u03bb_triv \u2248 1</code>, hence <code>\u03c6 \u2248 1</code> everywhere and there is no separation. 6. <strong>The exactly-zero-defect case is dead, so the question is genuinely asymptotic.</strong> <code>\u2113(x) = 0</code> forces <code>\u03c8_\u03c7(x) = 0</code> for every <code>\u03c7</code> in the support of <code>\u2113</code>, i.e. <code>x \u2208 ker \u03c0_\u03c7</code>, i.e. <code>\u2113</code> factors through <code>K/\u27e8\u27e8X\u27e9\u27e9</code>; then <code>\u2113(w) &gt; 0</code> requires <code>w \u2209 \u27e8\u27e8X\u27e9\u27e9</code>, which is a genuine finite-quotient witness and is forbidden (<code><a href=\"finite-quotient-blindness.html\">finite-quotient-blindness</a></code>). So <code>R = \u221e</code> at finite level is impossible, and everything depends on the rate at which <code>R</code> grows.</p>"}, {"id": "hilbert-embeddable-witness-for-kun-thom-wreath", "status": "OPEN", "root": false, "goal": false, "title": "A Hilbert embeddable weak-soficity witness for the Kun--Thom wreath", "impact": 3, "frontier": true, "lock": null, "html": "<p>Show that the weak-soficity witnesses for</p>\n<pre>\nW = (directSum_(G/Gamma) Z/2Z) semidirect G\n</pre>\n<p>supplied by Glebsky's permanence theorem \u2014 or any other witnesses for <code>W</code>, or for its Clifford cover \u2014 can be chosen with <strong>Hilbert embeddable</strong> invariant lengths, in the sense of <code><a href=\"hilbert-embeddable-length-hyperlinearity.html\">hilbert-embeddable-length-hyperlinearity</a></code>.</p>\n<p><strong>The precise form, with the reparametrization named.</strong>  Conditional negative definiteness is not invariant under reparametrizing a length: on <code>S_4</code> the Hamming length is Hilbert embeddable while its square is not, and on <code>S_3</code> the <code>F_2</code>-rank length is not while its square root is.  So the usable statement is not \"the witnessing lengths <code>d_n</code> are Hilbert embeddable\" but</p>\n<p>&gt; there is <strong>one</strong> increasing <code>f</code> with <code>f(0)=0</code>, continuous at <code>0</code>, <strong>not &gt; depending on <code>n</code></strong>, such that every <code>f o d_n</code> is Hilbert embeddable and &gt; bounded by <code>1</code>.</p>\n<p>Defect and separation transport through any such <code>f</code>, so this is what the criterion actually consumes, and it is strictly weaker than either fixed choice.  Naming <code>f</code> is where the bookkeeping lives.</p>\n<p><strong>The function, named, and two constraints removed.</strong>  Take <code>f(t)=1-exp(-t)</code>.  By <code><a href=\"hilbert-embeddable-amplification.html\">hilbert-embeddable-amplification</a></code> this single <code>n</code>-independent choice does three things at once: it is a Bernstein function, so it preserves conditional negative definiteness; it reproduces the profile of Glebsky's cap <code>min{t,1}</code> within absolute constants, so it replaces the cap without disturbing defect or separation; and its reparametrizations <code>1-exp(-rt)</code> amplify any fixed positive separation to <code>1-o(1)</code>, so the separation constant carries no content here.  What remains of this claim is therefore exactly one thing: <strong>is the uncapped conjugation-invariant word metric of the error set conditionally negative definite?</strong>  Not the cap, not the separation level, not the factors.</p>\n<p><strong>The target is a whole family, and any one member suffices.</strong>  By <code><a href=\"kun-thom-clifford-cover-weakly-sofic.html\">kun-thom-clifford-cover-weakly-sofic</a></code>, every cover <code>Wtilde_S=Vtilde_S semidirect G</code> in the invariant-graph family of <code><a href=\"invariant-graph-clifford-phase.html\">invariant-graph-clifford-phase</a></code> is weakly sofic and not sofic: the lamp group <code>Vtilde_S</code> is locally finite, hence sofic, <code>G</code> is residually finite by Kun--Thom Theorem E, and Glebsky's permanence theorem applies to each of them.  So the character test may be run against the witnesses for any <code>S</code>, not only against those for <code>W</code> itself.  Since the marked word survives in every such cover, a Hilbert embeddable witness for a single <code>S</code> answers Question 3.4.  This is the one place where the invariant-graph freedom survives \u2014 unlike the locality direction, which <code><a href=\"marked-double-coset-infinite-degree.html\">marked-double-coset-infinite-degree</a></code> closes.</p>\n<p>Glebsky, <em>Extensions of a residually finite group by a weakly sofic group are weakly sofic</em>, Rev. Mat. Iberoam. 39 (2023) 1097--1104, Theorem 1.1, gives the witnesses; his proof runs through a characterization of weak soficity by solvability of equations over groups, so the bi-invariant metric is produced rather than prescribed, and its character expansion has not been inspected.  The test is finite and mechanical: expand each witnessing length in irreducible characters and check that every nontrivial coefficient is nonpositive.</p>\n<h3>Where the difficulty is not, and where it is</h3>\n<p>Glebsky's proof of Theorem 1.1 constructs no metric at all (<code><a href=\"glebsky-weak-soficity-is-metric-free.html\">glebsky-weak-soficity-is-metric-free</a></code>): it runs on the algebraic side of his Lemma 1.2, whose clause (3) says a group is weakly sofic iff it is a subgroup of a <strong>quotient</strong> of a direct product of finite groups.  So the character question has to be asked about lengths on finite sub-products, and about what survives the quotient.  Three facts, which together say the obstruction cannot live in the factors.</p>\n<ul>\n<li><strong>The Hilbert embeddable lengths form a large cone.</strong>  Nonnegative</li>\n<p>combinations of Hilbert embeddable lengths are Hilbert embeddable, and so is the pullback of one along any homomorphism, since conditional negative definiteness of a kernel is preserved by both operations.  The discrete length is Hilbert embeddable, realized by the regular representation.</p>\n<li><strong>Consequently the normalized support length</strong></li>\n<p><code>ell(f)=|{alpha in A : f_alpha != 1}|/|A|</code> on a finite direct product <code>prod_(alpha in A) F_alpha</code> <strong>is Hilbert embeddable</strong>, being the average of the pullbacks of the discrete lengths of the factors.  For the Kun--Thom wreath the factors are copies of <code>Z/2</code>, which have two characters, so no difficulty can hide in the factors' character theory.</p>\n<li>**Both extremes of that cone nonetheless fail, and both fail on</li>\n<p>separation.**  The normalized support length dilutes: the marked involution is supported on two coordinates, so its length is <code>2/|A|</code>, which tends to zero \u2014 this is the no-dilution constraint below, in its sharpest form.  At the other extreme, the discrete length pulled back along <code>F_A -&gt; F_A/proj_A(M)</code> makes the defect exactly zero, but its separation is zero too: a witness of that shape would be a genuine homomorphism to a finite group separating the mark, making <code>W</code> locally embeddable in finite groups, which it is not.</p>\n</ul>\n<p>So the live question is entirely about the middle of the cone: a Hilbert embeddable length on the finite sub-product which is small on the truncated error set and at least <code>1/2</code> on the truncated lifts, <strong>both of which lie inside <code>proj_A(M)</code></strong>.  The quotient, not the factors, carries the whole problem \u2014 and that is a finite design question to which the character test of <code><a href=\"hilbert-embeddable-length-hyperlinearity.html\">hilbert-embeddable-length-hyperlinearity</a></code> applies directly.</p>\n<p>Two constraints any witness must already satisfy.  Only the second is a filter; the first was expected to be one and is not.</p>\n<ul>\n<li><strong>No dilution of a single lamp.</strong>  Let <code>w=a_o a_(h Gamma)</code> be the marked</li>\n<p>involution and <code>a_o</code> a single lamp, so that <code>w = a_o * g a_o g^(-1)</code> for a suitable <code>g</code>.  A Hilbert embeddable <code>ell</code> need not itself be subadditive, but <code>sqrt(ell)</code> is: conditional negative definiteness says <code>ell(a^(-1)b)=||f(a)-f(b)||^2</code> for a map <code>f</code> into a Hilbert space, so <code>sqrt(ell)</code> is a conjugation-invariant pseudometric.  Applying the triangle inequality to <code>sqrt(ell)</code> and squaring, a witness separating <code>w</code> by <code>c</code> must give <strong>every</strong> lamp length at least <code>c/4</code>, up to the multiplicative defect.  A model in which individual lamps become asymptotically invisible cannot separate the mark.  This is the weak-soficity form of the fermionic amplification remark in docs/FALSE_FERMIONIC_KUN_THOM_ENDPOINT.md \u00a75. (Constant corrected from <code>c/2</code> to <code>c/4</code> in the adversarial audit: the earlier statement assumed subadditivity of <code>ell</code> itself.)</p>\n</ul>\n<p><strong>It is not a filter.</strong>  <code><a href=\"lamp-character-orbit-separation.html\">lamp-character-orbit-separation</a></code> computes the separation exactly by Clifford theory: for a nontrivial irreducible not inflated from the acting quotient, the normalized separation of a two-site element is twice the fraction of the character orbit meeting exactly one of the two sites, which for a generic orbit tends to <code>1/2</code>.  So the mark is separated by an absolute constant independent of the number of sites, and the <code>2/|A|</code> decay that made dilution look threatening is an artifact of averaging over singleton orbits \u2014 the worst generator in the cone, not a representative one.  The inequality above remains true and remains a necessary condition; it simply rejects nothing.</p>\n<ul>\n<li><strong>The error set must be at unbounded word distance from the mark.</strong>  If</li>\n<p><code>w</code> lies in <code>C_m(X)</code> \u2014 a product of <code>m</code> conjugates of <code>X^(\u00b11)</code> \u2014 then <code>sqrt(ell)</code> is a conjugation-invariant pseudometric for any Hilbert embeddable <code>ell</code>, so <code>sqrt(ell(w)) &lt;= m max_(x in X) sqrt(ell(x))</code> and</p>\n</ul>\n<pre>\n  ell(w) &lt;= d_X(w)^2 * max_(x in X) ell(x).\n</pre>\n<p>The separation-to-defect ratio is therefore bounded by the <strong>square of the word distance</strong> from the error set to the mark, so a witness with vanishing defect and surviving mark forces <code>d_(X_n)(w) -&gt; infinity</code>.  (For a genuine bi-invariant metric, subadditive outright, the bound improves to <code>d_X(w)</code>.)  This is the quantitative form of the no-dilution bullet, and it is the constraint that actually bites.</p>\n<p>cairn-scout's check of Definition 6 shows how sharply.  On the Clifford cover, <code>[a_p,a_q]=z</code> gives <code>a_p a_q a_p^(-1) = z a_q</code>, so <code>z = a_q * (a_p a_q a_p^(-1))</code> is a product of exactly <strong>two</strong> lamp conjugates: with <code>X</code> the single lamps, <code>d_X(z)=2</code> on the nose.  The mark does not merely satisfy the bound, it achieves it.  Since word distance is an integer and separation needs <code>n &lt; d_X(w)</code>, the only admissible <code>n</code> is <code>1</code>, which is degenerate.  So <strong>the single lamps cannot be the error set</strong>, and the real lever is the choice of the test window <code>Phi</code>, since <code>X = Pr_1^k(Phi cap N)</code> is determined by it.</p>\n<ul>\n<li><strong>No finite-quotient witness.</strong>  Every genuine homomorphism from <code>W</code> to a</li>\n<p>finite group kills <code>w</code>, because in a finite quotient the compression <code>t Gamma t^(-1) &lt;= Gamma</code> becomes an equality, so the two marked cosets are identified.  The witnesses are therefore necessarily <em>approximate</em> homomorphisms, and the length must do the separating work that a quotient cannot.</p>\n</ul>\n<p>A positive answer answers Pestov's Question 3.4.  A negative answer \u2014 a proof that no Hilbert embeddable witness exists for <code>W</code> \u2014 would be the first evidence that <code>W</code> is not hyperlinear, and would be a genuine obstruction of a new kind, since it would separate weak soficity from hyperlinearity on an explicit group.</p>"}, {"id": "hs-expander-block-decomposition", "status": "OPEN", "root": false, "goal": false, "title": "Normalized-HS analogue of Kun's expander decomposition", "impact": 2, "frontier": true, "lock": null, "html": "<p>Let <code>Gamma</code> have property <code>(T)</code> with Kazhdan pair <code>(S,kappa)</code>.  Ask for a function <code>eps(delta) -&gt; 0</code> as <code>delta -&gt; 0</code>, depending only on <code>(S,kappa)</code>, such that every <code>delta</code>-almost representation <code>phi:Gamma -&gt; U(d)</code> in normalized Hilbert--Schmidt norm admits a projection <code>p in M_d</code> with <code>tau(1-p) &lt;= eps(delta)</code> and an orthogonal decomposition <code>p = p_1 + ... + p_k</code> for which</p>\n<ul>\n<li>each block is almost invariant:</li>\n<p><code>sum_i \u2016[phi(s),p_i]\u2016_2^2 &lt;= eps(delta)</code> for every <code>s in S</code>; and</p>\n<li>each block carries a uniform spectral gap, in the following exact form:</li>\n<p>writing <code>tau_i = tau(.)/tau(p_i)</code> for the normalized trace on <code>p_i M_d p_i</code> and <code>u_s = p_i phi(s) p_i</code>,</p>\n</ul>\n<pre>\nsum_(s in S) \u2016u_s x - x u_s\u2016_(2,p_i)^2 &gt;= kappa&#x27;^2 \u2016x - tau_i(x) p_i\u2016_(2,p_i)^2\n</pre>\n<p>for every <code>x = x^*</code> in <code>p_i M_d p_i</code>, with <code>kappa'&gt;0</code> depending only on <code>(S,kappa)</code>; and</p>\n<ul>\n<li>the blocks drift correctly under each compressor: for every <code>t</code> with</li>\n<p><code>t Gamma t^(-1) &lt;= Gamma</code> and every fine block <code>p_j</code> there is a single fine block <code>p_(sigma(j))</code> with</p>\n</ul>\n<pre>\n\u2016phi(t) p_j phi(t)^* - p_(sigma(j))\u2016_2 &lt;= eps(delta),\n    tau(p_(sigma(j))) &gt;= tau(p_j) - eps(delta).\n</pre>\n<p>The last clause was originally left to the consuming routes as a prose caveat.  It is folded into the statement here because a route may not assert an implication it does not establish, and both consumers need exactly this and nothing weaker.</p>\n<p><strong>Debt attached to this claim.</strong>  Whoever proves it must also discharge one piece of error bookkeeping that its consumer needs: the tracial Cheeger lemma in <code><a href=\"tracial-median-from-block-decomposition.html\">tracial-median-from-block-decomposition</a></code> is stated for genuine unitaries in <code>p_i M_d p_i</code>, whereas the compressions <code>p_i phi(s) p_i</code> of an almost-representation are only almost unitary there, with defect controlled by <code>\u2016[phi(s),p_i]\u2016_2</code>.  That error term has not been tracked.  It is bookkeeping inside a proved lemma rather than a missing mathematical input, which is why it is not a separate prerequisite, but it travels with this claim rather than with the route.  It is also the clause that should be proved <em>with</em> the decomposition rather than after it: \"almost invariant\" and \"almost carried to a single block by the compressor\" are the same construction seen twice.</p>\n<p>Neither <code>k</code> nor the traces <code>tau(p_i)</code> are constrained; blocks of vanishing normalized trace are allowed, as they are in the permutation case.</p>\n<p><strong>A nested pair is needed, not one decomposition.</strong>  Reading the argument this transcribes (<code>official/counterexample.tex:310-371</code>) shows it applies Kun's theorem <strong>twice</strong>, to <code>Gamma</code> and to the ambient <code>G=&lt;Gamma,t_1,...,t_m&gt;</code>, and uses both at once: the fine <code>Gamma</code>-blocks define the size observable, while the coarse ambient <code>G</code>-blocks supply the normalizing medians, one per ambient block.  The Lean instantiation does the same (<code>KunFixedDecomposition.expanderDecomposition</code> applied to <code>A.comap embedGamma</code> and to <code>A</code>).  So what is being asked for here is a <strong>nested</strong> pair of block algebras <code>B_G &lt;= B_Gamma</code>, the coarse one almost invariant under all of <code>G</code> and the fine one under <code>Gamma</code>, both with uniform gap.  Nesting matters operator-theoretically and not just bookkeeping: the size observable and the ambient projections must commute for the fiberwise functional calculus below to be defined, which is automatic for functions on a set and is a genuine demand on a tracial model.</p>\n<p>This is the exact normalized-HS transcription of Kun, <em>On sofic approximations of property (T) groups</em>, arXiv:1606.04471, which supplies it for sofic approximations: there the blocks are the connected components of the <code>S</code>-labelled Schreier graph, the almost-invariance is exact off <code>o(|Y|)</code> vertices, and the gap is uniform Cheeger expansion.  In that setting the block algebra exists for free, because a permutation model acts on a <em>set</em> and <code>l^infinity(Y)^Gamma</code> is atomic by construction.  A unitary model has no distinguished maximal abelian subalgebra, and an almost-representation has no isotypic decomposition, so the block algebra has to be produced rather than read off.</p>\n<p>The statement is close to, but not the same as, Alekseev--Thom's Open Problem 6.2 (arXiv:2608.05362), which asks for finite-dimensional <code>*</code>-subalgebras whose tracial ultraproduct is exactly the commutant of a Kazhdan group's ultraproduct image, realized as exact centralizers of chosen generator lifts.  A positive answer to that problem in its exact-centralizer form supplies this claim, since the centres of those subalgebras are the required block algebras.  This claim is weaker in asking only for a one-sided almost-invariant partition with a gap, and does not ask that the ultraproduct commutant be captured.</p>\n<p>Two cautions recorded so the statement is not weakened into triviality.</p>\n<ul>\n<li><strong>The ultraproduct form is false.</strong>  Take <code>Gamma=SL_3(Z)</code>, <code>phi_n</code> the</li>\n<p>left regular representation of <code>SL_3(Z/nZ)</code> pulled back along reduction. These are genuine representations, so <code>delta=0</code>.  Their commutants are the right regular algebras <code>C[SL_3(Z/nZ)]</code>, whose minimal projections have normalized trace <code>d_pi/|G_n| &lt;= |G_n|^(-1/2) -&gt; 0</code>; hence the tracial ultraproduct of the commutants is diffuse and admits no atoms at all.  So the decomposition can only be asked for at each finite level, with constants uniform in <code>d</code>, and any proof that passes to the ultraproduct first has already lost the block structure.</p>\n<li><strong>Genuine representations satisfy it trivially</strong> -- take the isotypic</li>\n<p>components -- so all the content is at <code>delta&gt;0</code>, where no isotypic decomposition exists.</p>\n<li><strong>At finite level atomicity is automatic</strong>, since every subalgebra of</li>\n<p><code>M_d</code> is atomic.  What fails is <em>uniformity</em>: the atom count diverges and the atom traces vanish, which is what the displayed example makes quantitative and what the permutation argument repairs with its median device.  So \"atomicity\" names the ultraproduct symptom; the finite-level content is uniform control of atom traces.</p>\n</ul>\n<h3>The exact case collapses, so the difficulty is entirely the error term</h3>\n<p>If the invariant algebra were exact, everything above is free.  Let <code>A</code> be a finite-dimensional abelian unital subalgebra of <code>M_d</code> commuting with a genuine <code>phi(Gamma)</code>, with atoms <code>p_1,...,p_k</code>, and let <code>u=phi(t)</code> for a compressor.  From <code>t Gamma t^(-1) &lt;= Gamma</code>, equivalently <code>Gamma &lt;= t^(-1) Gamma t</code>, any <code>a</code> commuting with <code>phi(Gamma)</code> has <code>u^*au</code> commuting with <code>phi(t^(-1) Gamma t) &gt;= phi(Gamma)</code>, so <code>u^*Au &lt;= A</code>.  The map <code>theta(a)=u^<em>au</code> is then a unital <code></em></code>-endomorphism of <code>A ~= C^k</code>, injective because conjugation is injective on <code>M_d</code>.  Unital <code>*</code>-endomorphisms of <code>C^k</code> are dual to self-maps <code>sigma</code> of the <code>k</code> atoms, and injectivity of <code>theta</code> is surjectivity of <code>sigma</code>; a surjective self-map of a finite set is a bijection.  Hence <code>u^*Au = A</code>, the atoms are permuted, <code>theta(p_j)=p_(sigma^(-1)(j))</code>, and</p>\n<pre>\ntau(p_(sigma^(-1)(j))) = tau(u^* p_j u) = tau(p_j),\n</pre>\n<p>so the block traces are preserved exactly and no median device is needed.</p>\n<p>This is <code><a href=\"invariant-size-collapse.html\">invariant-size-collapse</a></code> wearing a different hat -- the atom count is the conjugation-invariant strictly monotone size, and it exists here only because the algebra is atomic with finitely many atoms.  The consequence for this claim is worth stating plainly: <strong>the whole difficulty is the approximation error, not any genuine inequality of block traces.</strong>  In the exact world traces come out equal for free; the median device of <code><a href=\"tracial-median-concentration.html\">tracial-median-concentration</a></code> exists solely to recover that conclusion from an almost-invariant algebra.</p>\n<h3>Why the Pimsner--Popa index is not the invariant here</h3>\n<p>Offered by cairn-wall, whose lane uses it to real effect (<code><a href=\"compressor-growth-index-homomorphism.html\">compressor-growth-index-homomorphism</a></code>, <code><a href=\"commutator-compressor-carries-no-wall.html\">commutator-compressor-carries-no-wall</a></code>), on the ground that the index tolerates unequal traces where a minimal-projection count does not.  It does not transfer to this claim, and the reason is worth recording so it is not re-attempted.</p>\n<p>For finite-dimensional abelian <code>N &lt;= M</code> with atoms <code>e_i</code> of <code>N</code> and <code>f_j</code> of <code>M</code>, the trace-preserving conditional expectation gives <code>lambda = min_j tau(f_j)/tau(e_(i(j)))</code>, so</p>\n<pre>\nIndex(M,N) = max_j tau(e_(i(j)))/tau(f_j).\n</pre>\n<p>That is indeed a genuine \"how unequal are the pieces\" quantity, and on <strong>exact</strong> inclusions it is exactly what cairn-wall needs -- it is multiplicative along the compression semigroup and can be cancelled across a group relation.  But it is <strong>discontinuous in the metric this claim lives in</strong>.  Refining a single atom of trace <code>t</code> into pieces of trace <code>t-eps</code> and <code>eps</code> moves the subalgebra by <code>O(sqrt(eps))</code> in <code>\u2016.\u2016_2</code> -- the new atom has <code>\u2016e''\u2016_2 = sqrt(eps)</code> -- while sending the index to at least <code>t/eps</code>.  So the index blows up on refinements that are metrically invisible, which is the same failure mode as the atom count and is precisely the regime the median device exists to control.  An almost-invariant block algebra has no exact inclusion to take the index of in the first place.</p>\n<p>The quantity that does survive is the median-normalized size observable of <code><a href=\"tracial-median-concentration.html\">tracial-median-concentration</a></code>: <code>f = M(M+m_A)^(-1)</code> is a continuous functional calculus of a positive contraction, hence <code>\u2016.\u2016_2</code>-stable, and its concentration is exactly the unequal-trace statement.</p>\n<h3>An operator-norm strengthening would be a dichotomy, not a variant</h3>\n<p><code><a href=\"bounded-rank-corners-excluded.html\">bounded-rank-corners-excluded</a></code> (cairn-torsionfree) does not constrain this claim as stated -- these blocks are almost invariant in normalized Hilbert--Schmidt norm, which does not place them in the exact operator-norm relative commutant, and vanishing normalized trace is explicitly allowed. But it interacts sharply with the <strong>gap</strong> clause if anyone strengthens the almost-invariance to operator norm, and the interaction is worth recording before someone tries.</p>\n<p>Over a minimally almost periodic Kazhdan source such as <code>St_5(L)</code>, a bounded-rank projection in the exact relative commutant has finite-dimensional invariant range, hence gives a genuine finite-dimensional unitary representation, hence a <strong>trivial</strong> action on that range.  Now impose the gap clause on such a block: with <code>u_s = p_i</code> for every <code>s</code>, the left-hand side of the displayed inequality is <code>0</code>, so <code>x = tau_i(x) p_i</code> for every <code>x</code> in <code>p_i M_d p_i</code>, i.e. <code>rank(p_i)=1</code>.  So in an operator-norm version</p>\n<ul>\n<li>every bounded-rank block is forced to have rank exactly one, and</li>\n<li>if the whole fine decomposition consists of bounded-rank blocks, it is a</li>\n<p><strong>masa</strong>.</p>\n</ul>\n<p>The second horn is not a comfortable place to arrive.  A <code>phi(Gamma)</code> almost normalizing a full masa is the hypothesis of Theorem 9 of <code>docs/TRUE_DIAGONAL_NORMALIZER_RIGIDITY.md</code>, which concludes that a masa-normalizing tracial model contains a permutation model of comparable defect -- for a nonsofic group, a contradiction.  So an operator-norm strengthening must produce blocks of unbounded rank, and cannot terminate in small blocks.  Stated as a caution rather than a theorem: Theorem 9 carries its own hypotheses (<code>(F,eps)</code>-multiplicativity, <code>def_D(phi(g)) &lt;= delta</code>, and correctly carried lamp data) and is written for the Kun--Thom pair, so the second horn needs checking against those before it is used.</p>\n<h3>Placement of the Kazhdan projection-rounding theorem</h3>\n<p><code><a href=\"kazhdan-projection-rounding.html\">kazhdan-projection-rounding</a></code> (cairn-wall) proves that for a genuine <code>pi:G -&gt; U(M)</code> with <code>M</code> finite tracial and <code>N = M cap pi(Gamma)'</code>, every projection <code>p</code> in <code>M</code> has a projection <code>q</code> in <code>N</code> with <code>\u2016p-q\u2016_2 &lt;= (1+sqrt 2) kappa^(-1) max_s \u2016[pi(s),p]\u2016_2</code>.  Verified here independently: <code>a=E_N(p)</code> satisfies <code>tau(pa)=tau(a^2)</code> and <code>tau(a)=tau(p)</code> by bimodularity and trace preservation, giving the exact identity <code>\u2016p-a\u2016_2^2 = tau(a(1-a))</code>; and <code>(t-chi_([1/2,1])(t))^2 &lt;= 2t(1-t)</code> holds on <code>[0,1]</code> -- at <code>t&lt;1/2</code> it reduces to <code>t &lt;= 2/3</code> and at <code>t&gt;=1/2</code> to <code>t &gt;= 1/3</code> -- so cutting <code>a</code> at <code>1/2</code> costs a further <code>sqrt 2</code> factor.  The constant is right.</p>\n<p>Where it lands for this claim is the point.  Its proof needs <code>pi</code> to be a genuine homomorphism, both for <code>L^2(N)</code> to be the fixed space and for <code>(T)</code> to apply, so it lives on the <strong>ultraproduct</strong> side -- which is exactly the side where the displayed <code>SL_3(Z)</code> example shows the block structure has already been destroyed.  It is therefore not a tool for building the decomposition at finite level, which is where this claim has to be proved.</p>\n<p>One thing it is <strong>not</strong> needed for.  Its stated residual obstruction -- that one would still have to rule out projections of intermediate trace in <code>N</code> -- does not apply to the consumer here.  The Cheeger step of <code><a href=\"tracial-median-from-block-decomposition.html\">tracial-median-from-block-decomposition</a></code> never forces <code>tau(P)</code> toward <code>0</code> or <code>1</code>; it lower-bounds boundary energy by <code>min(tau_q(P), tau_q(q-P))</code>, which is what the threshold integral consumes.  That obstruction answered an earlier and cruder form of the question, superseded once the block gap was shown to <em>be</em> the Cheeger inequality.</p>\n<h3>Why offered tools keep landing on the wrong side</h3>\n<p>Three have been offered from neighbouring lanes and all three miss for the same structural reason, which is worth stating once so it is not rediscovered a fourth time.  The Pimsner--Popa index needs an <strong>exact inclusion</strong>. <code><a href=\"kazhdan-projection-rounding.html\">kazhdan-projection-rounding</a></code> needs a <strong>genuine homomorphism</strong>. <code><a href=\"coordinate-ultraproduct-transport.html\">coordinate-ultraproduct-transport</a></code> needs <strong>operator-norm</strong> asymptotic multiplicativity, since a small <code>\u2016.\u2016_2</code> defect gives no control on individual vectors and so assembles no honest representation on the coordinate ultraproduct.</p>\n<p>This claim lives at finite level, in normalized Hilbert--Schmidt norm, with only approximate invariance -- the one corner of the square where none of those three hypotheses is available.  That is not bad luck about which tools happen to exist.  It is a restatement of why the fork is open: every rigidity tool in the corpus buys its conclusion with exactness, in the metric, in the algebra, or in the homomorphism, and the Leavitt--Steinberg question is precisely the one that denies all three at once.</p>\n<p><strong>A genericity claim made here earlier was wrong and is retracted.</strong>  It read: because the index diverges whenever minimal projections have vanishing trace, any model with diffuse limiting commutant has infinite index, so the infinite-index regime is generic.  Two errors.  A diffuse algebra has <strong>no</strong> minimal projections at all, so the finite-dimensional formula above does not apply to it; and diffuseness alone does not force infinite index, since a finite-index subfactor of a <code>II_1</code> factor is diffuse.  What the computation actually supports is the <em>discontinuity</em> statement -- a scope limit on using the index as a metric invariant -- and nothing about diffuse limits.</p>\n<p>The nearest true statement is narrower: if <code>N</code> is diffuse <strong>abelian</strong> in a <code>II_1</code> factor <code>M</code> then <code>[M:N]=infinity</code>, because <code>N &lt;= N' cap M</code> makes the relative commutant infinite-dimensional while a finite-index inclusion has finite-dimensional relative commutant.  The commutant in the <code>SL_3(Z)</code> example is <code>prod_omega C[SL_3(Z/n)]</code>, which is diffuse but <strong>not</strong> abelian, so even that statement does not cover it.</p>\n<p><strong>Nor is the index the right target functional on an exact nesting.</strong>  For a finite-dimensional abelian nesting with <code>B_1</code>-atoms <code>p_i</code> and <code>B_0</code>-atoms <code>q_A = sum_(i in A) p_i</code>, the correct formula is</p>\n<pre>\n[B_1:B_0] = max_A ( sum_(i in A) tau(p_i) ) / ( min_(i in A) tau(p_i) )\n          &gt;= max_A #A,\n</pre>\n<p>with equality inside a block exactly when its fine atoms have equal trace (cairn-wall, Proposition 4a; the derivation is <code>E(p_i) = (tau(p_i)/tau(q_(A(i)))) q_(A(i))</code> and then <code>x=p_i</code> in the Pimsner--Popa definition).  The formula is right, but the proposed reformulation of <code><a href=\"tracial-median-concentration.html\">tracial-median-concentration</a></code> as <code>[B_1:B_0] / max_A #A -&gt; 1</code> is <strong>not</strong> equivalent to it, and the failure is in the useful direction.  Take one coarse block with <code>k</code> fine atoms all of trace <code>t</code>, and a second with two fine atoms of traces <code>10s</code> and <code>s</code>.  Then the first block contributes <code>k</code>, the second contributes <code>11</code>, so for <code>k &gt;= 11</code> the index is exactly <code>k</code> and <code>max_A #A = k</code>: the normalized quantity is exactly <code>1</code> while the second block has trace ratio <code>10</code>.  Taking maxima over coarse blocks discards precisely the per-block information the median device is about.</p>\n<p>A second mismatch points the same way.  The manuscript's <code>(8)</code> is a statement <em>after discarding an exceptional set of vanishing trace</em>, whereas the index is a bare maximum: one tiny unbalanced block leaves <code>(8)</code> untouched and sends the index up.  So the two are incomparable in both directions, and minimizing the index is not a proxy for the target.</p>\n<h3>Prior statement in the corpus</h3>\n<p>This node imports and sharpens a diagnosis the corpus already reached for a different target.  <code>docs/TRUE_DIAGONAL_NORMALIZER_RIGIDITY.md:407-412</code> names it verbatim as the decisive open sub-claim:</p>\n<p>&gt; any Hilbert--Schmidt analogue of Kun--Thom Theorem 4.1 (normalization of &gt; the centralizer of a Kazhdan sofic approximation).  Their proof runs on &gt; connected-component vertex masses and isotropy orders of a finite cluster &gt; groupoid; a hyperlinear approximation of a Kazhdan group has a spectral gap &gt; for the adjoint action, but its fixed algebra need not be atomic and &gt; carries no component sizes.  This is the decisive open sub-claim.</p>\n<p><code>docs/NOTEPAD.md:21875-21881</code> reaches the same conclusion in weaker form. What is added here is the statement as a decomposition claim with its quantifiers, the finite-level caveat above, and the wiring into the Leavitt--Steinberg fork.  The transfer is by analogy of method, not by implication: the cited file is written for the Kun--Thom wreath / Clifford lamp target, not for <code>St_5(L)</code>.</p>\n<p>Two further corpus facts bear directly on the shape of a proof.</p>\n<ul>\n<li><strong>Do not obtain the blocks by normalizing a masa.</strong></li>\n<p><code>docs/TRUE_DIAGONAL_NORMALIZER_RIGIDITY.md</code> Theorem 9 (<code>:323-336</code>) shows that a masa-normalizing tracial model contains a permutation model of comparable defect, so that relaxation is <em>equivalent to</em> soficity rather than weaker, and buys nothing.  Its Proposition 11 (<code>:348-368</code>) is the usable half: if a subalgebra with <code>k</code> atoms <strong>of equal trace</strong> is normalized to within <code>delta</code>, then <code>u</code> is <code>3 sqrt(delta)</code>-close to <code>U(N/k) wr Sym(k)</code> and the induced map on <code>k</code> points is Hamming-almost multiplicative.  So the equal-trace case of this claim already converts to a permutation model, which is why the unequal-trace case, handled in the permutation argument by the median device, is the substance.</p>\n<li><strong>One neighbouring step already has a proved HS analogue.</strong></li>\n<p><code>docs/TRUE_SPECTRAL_COAREA_INVARIANT_CUT.md</code> <code>(SCI2)</code> proves <code>integral_0^1 \u2016[P_t,A]\u2016_2^2 dt &lt;= \u2016[H,A]\u2016_2 \u2016A\u2016_2</code> for spectral projections <code>P_t</code> of a positive contraction, the normalized-HS analogue of the graph coarea identity <code>Matching/FiniteGraph.coarea</code>, with a common-threshold form <code>(SCI5)</code> for finitely many arrows.  This is evidence that the permutation layer is not uniformly untranslatable, and is the natural tool for producing a single almost-invariant cut once a candidate positive contraction is in hand.</p>\n</ul>"}, {"id": "hs-invisibility-inflation-no-go", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Hilbert--Schmidt invisibility alone never obstructs MF", "impact": 0, "frontier": false, "lock": null, "html": "<p>If a countable group <code>H</code> has a faithful corona representation on dimensions <code>(m_n)</code>, then for any <code>N_n</code> with <code>m_n / (m_n + N_n) -&gt; 0</code> it has a faithful corona representation on dimensions <code>d_n = m_n + N_n</code> in which <strong>every</strong> element is invisible in normalized Hilbert--Schmidt norm: <code>\u2016Theta(h) - 1\u2016_2 = 0</code> for all <code>h in H</code>, while <code>\u2016Theta(h) - 1\u2016_op</code> is unchanged.</p>\n<p>Consequences.</p>\n<ul>\n<li>No criterion whose conclusion is <code>\u2016Theta(x) - 1\u2016_2 = 0</code> for some</li>\n<p><code>x != 1</code>, in every corona representation, can prove non-MF-ness \u2014 however strong the group-theoretic hypotheses on <code>x</code> and on <code>H</code>.  Kazhdan transport must therefore always be followed by a <strong>renormalization of the trace on a corner</strong> cut by a projection commuting with the image.  Three sources of such a projection are known: averaging over a finite normal subgroup, the spectral projection of a finite-order central mark (<code><a href=\"corona-corner-detection-criterion.html\">corona-corner-detection-criterion</a></code>), and the Kazhdan fixed-space projection of a normal property-(T) subgroup, which is invariant precisely because the subgroup is normal (<code><a href=\"normal-kazhdan-defect-non-mf.html\">normal-kazhdan-defect-non-mf</a></code>).  Only the third avoids torsion.</p>\n<li>This is the precise asymmetry with soficity.  A sofic approximation</li>\n<p>measures its multiplicativity defect and its separation in the same Hamming metric, so a nontrivial invisible element contradicts soficity outright, with no torsion, corner, or spectral input.  MF measures the defect in operator norm and separation in operator norm, while transport concludes only in the (strictly weaker) normalized Hilbert--Schmidt norm. Hence a torsion-free nonsoficity construction carries no formal information for this problem: whatever torsion the nonsofic constructions use, it is not used to cross a metric gap, because on the sofic side there is none to cross.</p>\n</ul>"}, {"id": "hyperlinear-elementwise-visibility", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Elementwise trace visibility is equivalent to hyperlinearity", "impact": 5, "frontier": false, "lock": null, "html": "<p>Call <code>g != 1</code> in a countable group <code>G</code> <em>tracially visible</em> if there is a constant <code>c_g&gt;0</code> such that for every finite <code>F</code> in <code>G</code> and every <code>delta&gt;0</code> there is a finite-dimensional unitary map <code>phi:G-&gt;U(d)</code> with</p>\n<pre>\n||phi(a)phi(b)-phi(ab)||_(2,norm) &lt;= delta      (a,b in F),\nRe tr_d(phi(g)) &lt;= 1-c_g.\n</pre>\n<p>Then <code>G</code> is hyperlinear if and only if every <code>g != 1</code> is tracially visible.</p>\n<p>The <em>near-maximal, jointly separated</em> half of this is already formalized: <code>NormTraceGap.isHyperlinear_of_traced_normModels</code> builds a hyperlinear model from an operator-norm model whose traces separate at the same accuracy <code>eps</code>, its docstring recording that \"the norm clause contributes multiplicativity and nothing more\".  What this claim adds is that an arbitrarily small constant <code>c_g</code>, for one element at a time, is already enough. In particular hyperlinearity never requires a single model separating all elements at once, and the separation constant may be arbitrarily small: both the near-maximal separation <code>2-epsilon</code> of <code>HyperlinearModel</code> and joint separation are recovered from elementwise visibility with constants depending only on <code>g</code>.</p>"}, {"id": "hyperlinear-implies-sofic", "status": "OPEN", "root": false, "goal": false, "title": "Every hyperlinear group is sofic (affirmative answer to Question 3.4)", "impact": 2, "frontier": true, "lock": null, "html": "<p>The affirmative answer to Pestov's Question 3.4: hyperlinearity implies soficity for groups, i.e. the two approximation classes coincide (the converse, <a href=\"sofic-implies-hyperlinear.html\">sofic-implies-hyperlinear</a>, is formalized). Equivalently, by contraposition: every nonsofic group is non-hyperlinear.</p>\n<p><strong>Payoff.</strong> Nonsofic groups now exist unconditionally (<a href=\"kun-thom-nonsofic-wreath.html\">kun-thom-nonsofic-wreath</a>), so this claim would immediately produce an explicit non-hyperlinear group \u2014 see the route <a href=\"non-hyperlinear-from-hyperlinear-implies-sofic.html\">non-hyperlinear-from-hyperlinear-implies-sofic</a> into <a href=\"non-hyperlinear-group.html\">non-hyperlinear-group</a>. That makes the affirmative answer at least as strong as the program's other root target, not a consolation outcome.</p>\n<p><strong>What it would take.</strong> A general theorem converting hyperlinear approximations (asymptotic homomorphisms into unitaries with the normalized Hilbert\u2013Schmidt metric) into sofic approximations (into permutations with the Hamming metric), for arbitrary groups. No such technique exists. The caution of docs/OBSTRUCTIONS.md \u00a75 applies with full force: proving particular candidates non-hyperlinear (e.g. <a href=\"kt-pair-non-hyperlinear-rigidity.html\">kt-pair-non-hyperlinear-rigidity</a>) removes candidates one at a time and can never establish this universal statement.</p>"}, {"id": "hyperlinear-near-representation-criterion", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Hyperlinearity is equivalent to an essentially free amenable near representation", "impact": 1, "frontier": false, "lock": null, "html": "<p>Kahl--Schneider, <em>Hyperlinearity via amenable near representations</em>, arXiv:2504.10988 (submitted 2025-04-15, revised 2026-01-05), prove:</p>\n<p>&gt; a group is hyperlinear if and only if it admits an essentially free &gt; amenable near representation.</p>\n<p>Amenability of a unitary representation is in Bekka's sense, and the paper first characterizes it via the existence of an orthonormal basis supporting an invariant probability charge.  The result is the Hilbert-space analogue of Elek--Szabo's characterization of soficity by essentially free amenable actions, and the authors state that it answers a question of Pestov and Kwiatkowska.  The same paper gives parallel characterizations of Kirchberg's factorization property and of Haagerup's property.</p>\n<h3>Why this is recorded</h3>\n<p><code><a href=\"hyperlinear-wreath-model.html\">hyperlinear-wreath-model</a></code> records that \"the tools for proving <code>R^U</code>-embeddability abstractly are thin\".  This is a genuinely different tool, and its witness is soft in exactly the way the dead architectures were not: an invariant <strong>finitely additive charge</strong> on an orthonormal basis, rather than a finite equivariant partition.  Every one of the eight refuted architectures in <code>docs/OBSTRUCTIONS.md</code> \u00a75 tried to build a finite carrier, and <code>docs/FALSE_HALO_ACTION_AUDIT.md</code> shows why finite carriers with locally sofic labels are circular here.  A charge can exist where no finite carrier does, so the criterion is not obviously subject to the same collapse.</p>\n<p>Recorded as a reusable external criterion, not as progress on any candidate.</p>"}, {"id": "hyperlinear-nonsofic-group", "status": "OPEN", "root": false, "goal": false, "title": "Pestov Question 3.4: produce a hyperlinear non-sofic group", "impact": 1, "frontier": false, "lock": null, "html": "<p>The negative (separation) answer to Question 3.4 \u2014 one of the two admissible routes into the program goal <code><a href=\"q3-4-resolved.html\">q3-4-resolved</a></code>, alongside its negation <a href=\"hyperlinear-implies-sofic.html\">hyperlinear-implies-sofic</a>. Soficity implies hyperlinearity (<a href=\"sofic-implies-hyperlinear.html\">sofic-implies-hyperlinear</a>, formalized); the converse is Question 3.4 and is open.</p>\n<p>Logical caution (docs/OBSTRUCTIONS.md \u00a75): evidence that a candidate is <em>not</em> hyperlinear does not push Q3.4 toward \"yes\" \u2014 only the flexible side is informative about Q3.4 at all. Since every known nonsofic group comes from the same (T)-compression mechanism, Q3.4 may be inaccessible until a second nonsoficity mechanism exists.</p>\n<p><strong>Status of that caution as of 2026-08-14 (literature scout).</strong> It still holds literally: nonsofic groups now exist unconditionally, but every one of them \u2014 <code><a href=\"kun-thom-nonsofic-wreath.html\">kun-thom-nonsofic-wreath</a></code>, <code><a href=\"openai-leavitt-unit-nonsofic.html\">openai-leavitt-unit-nonsofic</a></code>, and Fournier-Facio's torsion-free example (arXiv:2608.02025) \u2014 is the same pattern, namely one-sided compression <code>t Gamma t^(-1) &lt;= Gamma</code> plus property (T) plus a commuting non-LEF subgroup. Two qualifications:</p>\n<ul>\n<li>A candidate second mechanism now exists in the literature, conditionally:</li>\n<p><code><a href=\"nonsofic-hyperbolic-group.html\">nonsofic-hyperbolic-group</a></code>, via Chapman--Peled (arXiv:2509.21566), whose engine is the local testability of expander codes rather than expander decomposition of sofic approximations. It is conditional on an unproved probabilistic estimate and has produced no group.</p>\n<li>The separation problem itself is no longer untouched: <code><a href=\"weakly-sofic-not-sofic.html\">weakly-sofic-not-sofic</a></code></li>\n<p>is now settled, by composing the Kun--Thom wreath with Glebsky's residually-finite-by-weakly-sofic permanence. That is the same shape as Q3.4 with a different approximation class, and it isolates what the hyperlinear side is missing \u2014 a permanence theorem with no hypothesis on the coset action.</p>\n</ul>"}, {"id": "hyperlinear-not-imply-mf", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Hyperlinearity does not imply the MF property", "impact": 0, "frontier": false, "lock": null, "html": "<p>There exists a hyperlinear group that is not MF; the concrete witness may be taken to be the finitely generated group <code>W</code>.  This is the premise-free Lean theorem <code>GroupApproximation.NonMFImpact.witness_hyperlinear_nonMF</code>.</p>"}, {"id": "hyperlinear-trace-not-mf-trace", "status": "ESTABLISHED", "root": false, "goal": false, "title": "A hyperlinear trace that is not an MF trace", "impact": 0, "frontier": false, "lock": null, "html": "<p>There is a separable unital C-star algebra carrying a trace which is hyperlinear but not MF, in the senses of Shulman, <em>Sections and cones</em>, arXiv:2507.22783v3.  Take <code>A = C^*(W)</code> for the sofic non-MF witness <code>W</code>, with <code>tau</code> its canonical trace.</p>\n<p>This answers, negatively, one of the two converse implications that paper records as open.  Verbatim from v3: \"Clearly every quasidiagonal trace is amenable and every MF-trace is hyperlinear.  Whether the converse implications hold is an open problem.\"  The present claim refutes <code>hyperlinear =&gt; MF</code>.  It says nothing about <code>amenable =&gt; quasidiagonal</code>, which involves completely positive maps and remains open.</p>\n<p>The contrast with that paper's Theorem 30 --- \"all hyperlinear traces on cones are MF\" --- is exactly a contrast: a cone is homotopically trivial and its traces are soft, whereas the obstruction here is the property-<code>(T)</code> compression rigidity that makes <code>W</code> non-MF while <code>W</code> is sofic.</p>\n<p>Consequence for this repository: the non-MF theorem has a trace-level corollary in the operator-algebra literature's own vocabulary, independent of the group formulation.</p>"}, {"id": "hyperlinear-wreath-model", "status": "OPEN", "root": false, "goal": false, "title": "Construct a hyperlinear model of the wreath candidate", "impact": 1, "frontier": false, "lock": null, "html": "<p>Construct microstates for the wreath candidate in which the <code>\u0393</code>-pieces genuinely have no consistent size \u2014 a model witnessing the compression inside <code>R^\ud835\udcb0</code> (docs/OBSTRUCTIONS.md \u00a75, \"Flexibility\").</p>\n<p>All <em>represented</em> constructive approaches are ruled out (see the approach list), but <strong>no exhaustiveness finding exists</strong>: the no-gos kill constructive methods and none kills abstract existence. This goal is OPEN, not refuted.</p>\n<p>The candidate is pinned in <code><a href=\"wreath-not-sofic.html\">wreath-not-sofic</a></code>: <code>W = (\u2295_{G/\u0393} \u2124/2\u2124) \u22ca G</code> for Kun\u2013Thom's Theorem E pair <code>\u0393 = EL_r(\ud835\udd3d_q[x\u2081,\u2026,x_d]) \u2264 G = EL_r(\ud835\udd3d_q[x\u2081^{\u00b11},\u2026,x_d^{\u00b11}]) \u22ca SL_d(\u2124)</code>, <code>q</code> a prime power, <code>r, d \u2265 3</code>.</p>\n<h3>The goal in operator-algebra form</h3>\n<p>Because the lamp group is abelian, Fourier transform identifies <code>L(\u2295_{G/\u0393} \u2124/2\u2124) = L^\u221e({\u00b11}^{G/\u0393})</code>, so</p>\n<p>L(W) = M_KT = L^\u221e({\u00b11}^{G/\u0393}) \u22ca G,</p>\n<p>the generalized Bernoulli crossed product. <code>IsHyperlinear</code> as defined in this repository uses unitary models with Hilbert\u2013Schmidt separation <code>2 \u2212 \u03b5</code>, and for unitaries <code>\u2016u \u2212 v\u2016\u2082\u00b2 = 2 \u2212 2 Re \u03c4(v^*u)</code>, so the separation clause forces the limit trace to be the canonical one. The claim is therefore equivalent to Connes embeddability of <code>M_KT</code>, and that is how the toolkit below is scored.</p>\n<h3>Ideas</h3>\n<p>The tools for proving <code>R^\ud835\udcb0</code>-embeddability abstractly are thin; a genuinely new idea is needed here, not a variation on the eight dead architectures.</p>\n<p>Verdicts on the abstract-embeddability toolkit follow, from a 2026-08-14 pass in which every statement was read verbatim in its authors' own source (transcriptions and provenance in the artifact). The summary is that the toolkit is now closed, not thin: every general tool fails at the same single point, and that point is identified.</p>\n<p><strong>Permanence theorems for wreath products \u2014 BLOCKED, definitively.</strong> Hayes\u2013Sale (arXiv:1608.02610) covers only the standard wreath product <code>\u2295_H G \u22ca H</code> and says nothing here. Gao\u2013Kunnawalkam Elayavalli\u2013Patchell Theorem 3.8 and Alekseev\u2013Bradford Corollary 5.2/5.5 are the right shape and generality \u2014 GKP 3.8 with <code>M = \u2102 \u2295 \u2102</code> and <code>H = G</code> concludes exactly Connes embeddability of <code>M_KT</code> \u2014 but all require the coordinate action <code>G \u21b7 G/\u0393</code> to be sofic, and <code><a href=\"coordinate-action-not-sofic.html\">coordinate-action-not-sofic</a></code> refutes that. The only known sufficient condition for the hypothesis, amenable point stabilizers, fails because the stabilizers are conjugates of the Kazhdan group <code>\u0393</code>. Recorded as the invalidated route <code><a href=\"sofic-action-permanence.html\">sofic-action-permanence</a></code>.</p>\n<p><strong>Sofic equivalence relations and sofic actions \u2014 BLOCKED, and two repo citations were wrong.</strong> Elek\u2013Lippner (arXiv:0906.3619) prove <code>\ud835\udca9(\u211b) \u21aa R^\u03c9</code> for sofic <code>\u211b</code>, but their only positive existence statement is Proposition 7.1, <em>\"The Bernoulli shift of a sofic group is sofic\"</em> \u2014 the ordinary Bernoulli shift over the group itself. There is <strong>no</strong> theorem there that an arbitrary p.m.p. action of a sofic group has sofic orbit relation, and any argument routed through one is void. Elek\u2013Szab\u00f3 (arXiv:math/0408400) contains no crossed product at all; its R^\u03c9 result is <em>\"All countable sofic groups are hyperlinear\"</em>, and its \"essentially free\" is a Tarski-type condition on a finitely additive measure on a set, not a p.m.p. hypothesis \u2014 so citing it for <code>L^\u221e(X) \u22ca G \u21aa R^\u03c9</code> is a misattribution, and the correct pin is P\u0103unescu. With those corrected, the relation route lands back on P\u0103unescu's Definition 1.4, which is precisely the diagonal-plus-permutation shape Kun\u2013Thom Corollary D refutes.</p>\n<p><strong>Amalgamated free products over amenable faces \u2014 BLOCKED for <code>M_KT</code>, but it relocates the problem usefully.</strong> Brown\u2013Dykema\u2013Jung Corollary 4.5 gives <code>\u2133\u2081 <em>_B \u2133\u2082 \u21aa R^\u03c9</code> when the <code>\u2133\u1d62</code> are and <code>B</code> is <strong>hyperfinite</strong>; the general case is explicitly open (Gao\u2013Junge, arXiv:2012.07940, verbatim: </em>\"the problem of given M and N embeddable, whether \u2217_N M is embeddable as well remains open\"*). <code>M_KT</code> is a crossed product with no natural amalgam decomposition, and where the corpus does produce one it is over <code>L(\u0393)</code>, a property (T) factor \u2014 about as far from hyperfinite as a base can be. This is the same (T)-compatibility toll as <code><a href=\"haagerup-t-exclusion.html\">haagerup-t-exclusion</a></code>, collected on the other side. It is worth recording that the neighbouring free-lamp group <code>H_K = G *_\u0393 (\u0393 \u00d7 K)</code> has <code>L(H_K) = L(G) *_{L(\u0393)} (L(\u0393) \u2297\u0304 L(\u2124))</code>, so <em>its</em> hyperlinearity is literally an instance of the open amalgamated-free-product problem over a (T) base. That is a cleaner-stated target than <code>M_KT</code>, and it is a different group \u2014 it belongs to a different node, not this one.</p>\n<p><strong>Trace-blindness \u2014 this is the right diagnosis, and it is a non-obstruction, not a construction.</strong> The defect that kills soficity is a size defect, and <code>docs/OBSTRUCTIONS.md</code> \u00a71 shows the failure of the invariant-size argument in <code>II\u2081</code> factors is sharp: <code>R \u22ca_\u03b8 \u2124</code> for the Bernoulli shift carries a unitary strictly compressing a subalgebra, so no invariant \u2014 index, entropy, or undiscovered \u2014 can settle the branch. The trace is additive under refinement, hence blind to substituting a block for a point. So the tracial theory really cannot see the sizes. What that buys is the <em>absence</em> of an obstruction; it does not hand over microstates, and the precise statement of what it does buy is <code><a href=\"fiber-masa-free-cocycle.html\">fiber-masa-free-cocycle</a></code> clause 3.</p>\n<p><strong>Where all of it fails is one point.</strong> Both halves of the construction are free. The lamp algebra <code>\u2102 \u2295 \u2102</code> is hyperfinite; the acting group <code>G</code> is residually finite, hence sofic, hence hyperlinear, so <code>L(G)</code> is already Connes embeddable and (T)-compatibility costs nothing here. Every failure above is a failure to embed the <em>action</em>, and after <code><a href=\"coordinate-action-not-sofic.html\">coordinate-action-not-sofic</a></code> the residual requirement is exactly one thing: the lamp algebra must be embedded <strong>non-Cartanly</strong> \u2014 no maximal abelian subalgebra containing it may be normalized by all the group unitaries. Kun\u2013Thom Corollary D forbids the Cartan case and says nothing about the rest.</p>\n<p><strong>The asymmetry, in its cleanest published form.</strong> Holt\u2013Rees (arXiv:1601.01836) prove wreath closure for <strong>weakly sofic</strong> and explicitly not for hyperlinear, and the candidate now sits in exactly that gap: <code>W</code> is weakly sofic \u2014 Glebsky's residually-finite-by-weakly-sofic permanence has no hypothesis on the coset action at all, and <code>W</code> is a restricted sum of finite groups extended by a residually finite group (<code><a href=\"weakly-sofic-not-sofic.html\">weakly-sofic-not-sofic</a></code>) \u2014 and not sofic. So the metric class that tolerates arbitrary bi-invariant metrics on finite groups already contains <code>W</code>, and the one that fixes normalized Hilbert\u2013Schmidt is the open case. The sharp question this suggests is whether Glebsky's permanence theorem has a normalized-HS analogue; the expected crux is that weak soficity permits metric surgery on the finite groups and HS on <code>U(n)</code> does not. Relatedly, since all actions of a LERF group on sets are sofic (arXiv:2402.17150), <code>G</code> is not LERF and <code>\u0393</code> is not separable in <code>G</code> \u2014 which is a genuine constraint and not merely a restatement, as the next paragraph shows.</p>\n<p><strong>There is a positive foothold, and it was in the corpus rather than the graph.</strong> <code><a href=\"positive-core-bernoulli-ce.html\">positive-core-bernoulli-ce</a></code> (now established, imported from <code>docs/FALSE_POSITIVE_CORE_IS_SOFIC.md</code>) exhibits honest matrix microstates for a genuine piece of the target: for <code>L\u208a = SL_d(\u2124) \u2229 M_d(\u2115)</code>, <code>T = \u0393L\u208a</code> and <code>X\u2080 = T\u0393/\u0393</code>, the action <code>\u0393 \u21b7 X\u2080</code> is sofic, so <code>W\u2080 = (\u2295_{X\u2080} C\u2082) \u22ca \u0393</code> is sofic and <code>N\u2080 = L^\u221e({\u00b11}^{X\u2080}) \u22ca \u0393</code> is Connes embeddable. The separating property is stabilizer separability: the positive stabilizers <code>\u2113\u0393\u2113\u207b\u00b9</code> are separable in <code>\u0393</code> by degree-truncation congruences, even though <code>\u0393</code> is not separable in <code>G</code>. So LERF is far more than the situation needs, and the same GKP theorem that kills the full action in contrapositive builds the model for the positive part. The route that uses this is <code><a href=\"positive-core-dilation-splice.html\">positive-core-dilation-splice</a></code>, whose single gap <code><a href=\"simultaneous-dilation-splice.html\">simultaneous-dilation-splice</a></code> turns out to <em>be</em> the open amalgamated-free-product problem over a nonamenable base (Gao\u2013Junge, arXiv:2012.07940) plus a quotient step for the <code>SL_d(\u2124)</code> relations. That identification is new and cuts both ways: the gate will not fall to a routine permanence lemma, but the candidate is now attached to a problem with independent attention.</p>\n<p><strong>A witness that is not a carrier.</strong> <code><a href=\"amenable-charge-route.html\">amenable-charge-route</a></code> applies Kahl\u2013Schneider's equivalence (<code><a href=\"hyperlinear-near-representation-criterion.html\">hyperlinear-near-representation-criterion</a></code>): hyperlinear iff there is an essentially free amenable near representation, the Hilbert-space analogue of Elek\u2013Szab\u00f3's set-level criterion for soficity. Since the witness is a finitely additive charge on an orthonormal basis rather than a finite carrier, the locally-sofic collapse of <code>docs/FALSE_HALO_ACTION_AUDIT.md</code> has nothing to grip, and the basis \u2014 the coordinate system \u2014 is explicitly not required to be equivariant. Same non-Cartan requirement, different toolbox (Hahn\u2013Banach rather than finite construction). Risk recorded there: if Bekka's (T) theorem forces an amenable representation of a Kazhdan group to contain a finite-dimensional subrepresentation, the lane collapses into the rigidity fork. I could not read that statement and did not use it.</p>\n<p><strong>The live architecture.</strong> <code><a href=\"growing-fiber-models.html\">growing-fiber-models</a></code> puts the lamps on a coordinate set and the group's Hilbert\u2013Schmidt separation in a growing unitary fiber the lamps cannot see. The route also carries the reason the naive version of that idea fails \u2014 block-monomial fibers have an invariant MASA and collapse back to a permutation model of the coordinate action that is still faithful on the lamps \u2014 which is what forces clause 3 and turns the architecture into <code><a href=\"fiber-masa-free-cocycle.html\">fiber-masa-free-cocycle</a></code>. The Fourier-block calculation in <code>docs/NOTEPAD.md</code>, written there as an obstruction to lifting an abstract embedding to a Cartan one, is the design principle for clause 3 read forwards.</p>\n<p><strong>Read the live routes as descriptions, not fronts (audit, 2026-08-14).</strong> All three routes currently open into this claim fail the \"restatement dressed as a reduction\" test, and each node carries the derivation. <code><a href=\"simultaneous-dilation-splice.html\">simultaneous-dilation-splice</a></code> asks for Connes embeddability of <code>M</code>, and <code>(FSD5)</code> says <code>M = L(W)</code> \u2014 the target verbatim, needing no established claim to see it. <code><a href=\"wreath-amenable-near-representation.html\">wreath-amenable-near-representation</a></code> is equivalent to the target modulo the established Kahl\u2013Schneider <strong>iff</strong>. <code><a href=\"fiber-masa-free-cocycle.html\">fiber-masa-free-cocycle</a></code>'s exact half is implied by the target modulo the established <code><a href=\"block-monomial-coordinate-collapse.html\">block-monomial-coordinate-collapse</a></code>, and its quantitative half is strictly <em>stronger</em> than the target rather than weaker \u2014 the opposite defect, and no better.</p>\n<p>Their implications are all true, so the graph is not lying; but the frontier here is <strong>one hole described three ways</strong>, not three fronts, and counting them otherwise overstates progress. What the three do supply is real and worth keeping: a localization of the difficulty (the core is discharged, only the dilation remains), a specification of the surviving model shape, and a change of scale from trace to operator norm. Descriptions of a hole, not reductions of one.</p>\n<p><strong>The dual target.</strong> The same pass identifies the rigidity-side twin, which this graph should also carry: <em>invariant Cartan completion</em> \u2014 that every abstract embedding of <code>M_KT</code> can be conjugated so that some diagonal ultraproduct containing the lamp algebra is normalized by all <code>\u0398(u_g)</code>. If that is true, <code>M_KT</code> is not Connes embeddable and this claim is refuted. It is the exact negation of <code><a href=\"fiber-masa-free-cocycle.html\">fiber-masa-free-cocycle</a></code> clause 3, and neither direction is known.</p>"}, {"id": "infinite-order-central-mark-group", "status": "OPEN", "root": false, "goal": false, "title": "A torsion-free Kazhdan compression group with an infinite-order central mark", "impact": 3, "frontier": true, "lock": null, "html": "<p>There is a <strong>torsion-free</strong> finitely presented group <code>H</code> carrying the full transport data \u2014 a property-(T) subgroup <code>iota(Gamma)</code>, an element <code>t</code> with <code>t iota(Gamma) t^-1 &lt;= iota(Gamma)</code> proper, an element <code>c</code> centralizing <code>iota(Gamma)</code> \u2014 such that the normal closure of the compression defect <code>u = [t c t^-1, iota(a)]</code> contains a <strong>nontrivial central element of infinite order</strong>.</p>\n<p>Together with <code><a href=\"commutant-projection-extraction.html\">commutant-projection-extraction</a></code> this yields the root; the two claims split that branch cleanly into its group-theoretic and its operator-algebraic halves.</p>\n<p>This is the <strong>secondary</strong> branch.  The root's primary route, <code><a href=\"torsion-free-non-mf-from-normal-kazhdan-defect.html\">torsion-free-non-mf-from-normal-kazhdan-defect</a></code>, needs no mark at all: it puts a normal Kazhdan subgroup in the defect and cuts the corner with its Kazhdan projection.  What keeps this claim alive is that it needs no small-cancellation machinery \u2014 the construction here is an explicit presentation of the same shape as the existing Clifford witness.</p>\n<h3>Ideas</h3>\n<p><strong>Heisenberg lamps instead of Clifford lamps.</strong>  In the existing witness the lamps are order-two Clifford generators at the sites of a coset space, two distinct lamps anticommute, and the mark is the resulting central sign <code>(e_o e_{o'})^2 = -1</code>.  Replace the Clifford lamp group by a Heisenberg lamp group over <code>Z</code>: lamp generators <code>x_o</code> of infinite order at the sites, with <code>[x_o, x_{o'}] = z</code> central of infinite order for distinct sites. <code>HeisenbergCentre.lean</code> already computes that the centre of the Heisenberg group over a ring is the coefficient ring on the nose, so the centre is a copy of <code>Z</code> rather than of <code>Z/2</code>.  This design also supplies the pairing that <code><a href=\"exel-loring-mark-quantization.html\">exel-loring-mark-quantization</a></code> needs: the mark is a commutator of two lamp generators, hence the value of the central extension class on the <code>H_2</code> class carried by that one commutator relation.  The mark is then not a square but a commutator: <code>u = [t c t^-1, iota(a)]</code> is again a product of lamps at two distinct sites, and <code>z = [u, x_{o'}]</code> lies in the normal closure of <code>u</code>. Clause 1 of <code><a href=\"corona-corner-detection-criterion.html\">corona-corner-detection-criterion</a></code> is stated for the whole normal closure precisely so that this variant is covered.</p>\n<p><strong>Torsion-freeness of the pieces.</strong>  A semidirect product of torsion-free groups is torsion-free, and torsion elements of an ascending HNN extension are conjugate into the base, so the mapping-telescope architecture preserves torsion-freeness.  What must change is the base: the literal affine base contains <code>SL_3(Z)</code>, which has torsion.  A torsion-free congruence subgroup (Selberg) of the affine Kazhdan base still carries the scaling compressor <code>v -&gt; N v</code> on the translation part, which is a proper injective self-embedding, and property (T) passes to finite-index subgroups.  So the base can be made torsion-free without losing the compression architecture.</p>\n<p><strong>What is genuinely open here.</strong>  Nontriviality of the mark.  In the Clifford case <code>z != 1</code> is proved by an explicit finite-dimensional Clifford model in which the sign is <code>-1</code>.  The Heisenberg analogue needs a model of the lamp group in which the central <code>Z</code> survives the quotient by the telescope relations; the finite-site-orbit machinery (<code><a href=\"finite-site-orbits-invariant-clifford-kernel.html\">finite-site-orbits-invariant-clifford-kernel</a></code>) is stated for finite invariant lamp subgroups and does not transfer verbatim to an infinite-order centre.  Soficity of the witness, which the Clifford version gets from local finiteness of the lamp kernel, would also be lost: a Heisenberg lamp kernel is nilpotent, hence amenable, hence still sofic, so the sofic-and-non-MF consequence should survive.</p>"}, {"id": "infranormal-compact-closure-normal", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Infranormal subgroups have normal closure in every compact image", "impact": 0, "frontier": false, "lock": null, "html": "<p>If <code>P_Gamma={g : g Gamma g^(-1)&lt;=Gamma}</code> generates <code>G</code>, then for every homomorphism <code>rho:G-&gt;K</code> to a compact group, the closure of <code>rho(Gamma)</code> is normal in the closure of <code>rho(G)</code>.  Compact recurrence upgrades each one-sided inclusion to equality.  Consequently the <code>Gamma</code>-fixed space of every finite-dimensional unitary representation is <code>G</code>-invariant.</p>"}, {"id": "invariant-cartan-completion", "status": "OPEN", "root": false, "goal": false, "title": "Invariant Cartan completion for the Kun\u2013Thom Bernoulli pair", "impact": 1, "frontier": true, "lock": null, "html": "<p>Given a trace-preserving embedding <code>\u0398 : M_KT \u2192 \u220f_\ud835\udcb0 M_(d_n)</code>, prove that after conjugation there is a <strong>diagonal ultraproduct</strong> <code>D_\ud835\udcb0</code> with <code>\u0398(A_KT) \u2286 D_\ud835\udcb0</code> and <code>\u0398(u_g) D_\ud835\udcb0 \u0398(u_g)* = D_\ud835\udcb0</code> for every <code>g \u2208 G</code>.</p>\n<p><strong>Establishing this refutes <code><a href=\"hyperlinear-wreath-model.html\">hyperlinear-wreath-model</a></code></strong> and produces the first non-hyperlinear group. By <code><a href=\"diagonal-normalizer-rigidity.html\">diagonal-normalizer-rigidity</a></code> clause 4, an invariant diagonal ultraproduct forces <code>\u0398(u_g) \u2208 \ud835\udcae_\ud835\udcb0 \u22c9 U(D_\ud835\udcb0)</code>, untwisting plus free amplification then yields a P\u0103unescu-sofic embedding, and <code><a href=\"coordinate-action-not-sofic.html\">coordinate-action-not-sofic</a></code> (Kun\u2013Thom Corollary D) forbids one. Because the containment half is free (abelian diagonalization), this claim is <em>equivalent</em> to non-Connes-embeddability of <code>M_KT</code>, not merely sufficient for it.</p>\n<h3>Two scope corrections worth carrying</h3>\n<p>1. <strong>Diagonal, not merely maximal abelian.</strong> The invariance must be asked of a <em>diagonal</em> ultraproduct <code>\u220f_\ud835\udcb0 D_(d_n)</code>. An invariant masa of <code>\u220f_\ud835\udcb0 M_(d_n)</code> that is not of that form yields no permutations: <code><a href=\"diagonal-normalizer-rigidity.html\">diagonal-normalizer-rigidity</a></code> runs on the doubly stochastic matrix of <code>|u_ij|\u00b2</code> in a fixed matrix unit system, and a singular masa supplies none. So the constructive negation (<code><a href=\"fiber-masa-free-cocycle.html\">fiber-masa-free-cocycle</a></code> clause 3) only has to defeat diagonal ultraproducts, which is strictly easier than defeating all masas. 2. <strong>Normalizers, not permutations.</strong> No <code>\u0398(u_g)</code> may even <em>normalize</em> such a <code>D_\ud835\udcb0</code>; requiring them to be permutations is not needed. This is what <code><a href=\"diagonal-normalizer-rigidity.html\">diagonal-normalizer-rigidity</a></code> clause 4 buys over the literal statement of Kun\u2013Thom Definition 2.2, and it is what makes the negation the exact remaining freedom rather than an artefact of P\u0103unescu's formulation.</p>\n<h3>Why no cited result gives it</h3>\n<p>Kun\u2013Thom start <em>inside</em> a permutation ultraproduct and prove a normalization theorem there; they do not upgrade arbitrary unitary normalizers. The Fourier-block calculation shows the upgrade cannot follow from abelianness or from finite-dimensional simultaneous diagonalization alone: all possible exoticity is stored in growing multiplicity fibers, which are invisible to the lamp algebra and to the trace.</p>"}, {"id": "invariant-graph-clifford-phase", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Invariant-graph central quotients carry the same sofic-radical phase, and only a sign", "impact": 2, "frontier": false, "lock": null, "html": "<p>Let <code>Gamma&lt;G</code> be a nonnormal infranormal Kazhdan pair as in <code><a href=\"kun-thom-clifford-radical-phase.html\">kun-thom-clifford-radical-phase</a></code>, <code>X=G/Gamma</code>, <code>o=Gamma</code>, <code>h=t^(-1)gamma t</code> outside <code>Gamma</code>, <code>y=h Gamma</code>, and</p>\n<pre>\nH=G *_Gamma (Gamma x C_2),   r=[k,h],   x=[k,r].\n</pre>\n<p>1. <strong>Free-lamp normal form.</strong>  <code>H = (*_X C_2) semidirect G</code>, with <code>k_(g Gamma)=g k g^(-1)</code>.  Under it <code>r=k_o k_y</code> and <code>x=(k_o k_y)^(-2)</code>, an element of infinite order. 2. <strong>The invariant-graph family.</strong>  Let <code>S</code> be any <code>G</code>-invariant set of unordered pairs of distinct points of <code>X</code> (equivalently a union of symmetric nontrivial double cosets <code>Gamma g Gamma</code>), let <code>V=directSum_X F_2</code> carry the adjacency form <code>b_S</code>, let <code>Vtilde_S</code> be the central extension</p>\n<pre>\n   z^2=1,  z central,  c_u^2=1,  [c_u,c_v]=z^(b_S(u,v)),\n</pre>\n<p>and <code>Wtilde_S=Vtilde_S semidirect G</code>.  Then <code>k |-&gt; c_o</code>, <code>g |-&gt; g</code> defines a surjection <code>H -&gt;&gt; Wtilde_S</code> with</p>\n<pre>\n   x |-&gt; z^(b_S(o,y)).\n</pre>\n<p>So <code>x</code> survives exactly when <code>{o,y} in S</code>, and every such <code>Wtilde_S</code> is a nonsofic quotient of <code>H</code>. 3. <strong>Tracial model.</strong>  Let <code>A_S</code> be the twisted group von Neumann algebra of <code>(V,b_S)</code> at the character <code>z |-&gt; -1</code> \u2014 self-adjoint unitaries <code>C_u</code> with <code>C_u C_v = (-1)^(b_S(u,v)) C_v C_u</code> and the canonical trace \u2014 with <code>G</code> permuting the <code>C_u</code>, and <code>M_S = A_S crossed_product G</code>.  Then <code>Wtilde_S</code> embeds faithfully in <code>U(M_S)<
