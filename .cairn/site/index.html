<script>
const DATA={"claims": [{"id": "additive-index-instability", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Additive indices are not amplification-stable", "impact": 0, "frontier": false, "lock": null, "html": "<p>Replacing a microstate by <code>\u03c6 \u2297 I_k</code> preserves every normalized-HS defect, trace, separation, and scalar word value, while an additive Fredholm/rank index is multiplied by <code>k</code>. Doubling kills its parity while a marked scalar <code>\u2212I</code> remains <code>\u2212I</code>; amplification by the order of any finite character gives the same no-go. Closed: determinant/parity shortcuts from microscopic leakage to the marked sign without a canonical multiplicity normalization.</p>"}, {"id": "amalgam-edge-compatible-corona-embeddings", "status": "OPEN", "root": false, "goal": false, "title": "Edge-compatible corona embeddings for the literal marked amalgam", "impact": 1, "frontier": true, "lock": null, "html": "<p>Writing <code>E/&lt;w&gt; = V *_{B_1} ((Z/2)^8 semidirect B_1)</code> (<code><a href=\"literal-lamp-kernel-clifford-block-amalgam.html\">literal-lamp-kernel-clifford-block-amalgam</a></code>), the datum required by <code><a href=\"shulman-amalgam-mf-criterion.html\">shulman-amalgam-mf-criterion</a></code> is: embeddings</p>\n<pre>\nphi_V : C*(V) -&gt; prod M_n / (+) M_n,\nphi_K : C*( (Z/2)^8 semidirect B_1 ) -&gt; prod M_n / (+) M_n\n</pre>\n<p>into one norm matrix corona whose restrictions to <code>C*(B_1)</code> coincide.</p>\n<h3>Ideas</h3>\n<p><strong>It is the same fork.</strong>  Compatibility forces the eight lamps of a block to become distinct commuting symmetries in <code>C = phi_V(B)' cap Q</code> that are permuted transitively by <code>phi_V(B_1)</code>, where <code>B</code> is the site stabilizer of index eight in <code>B_1</code>.  A symmetry in <code>C</code> that is <em>not</em> in <code>phi_V(B_1)' cap Q</code> is exactly operator-norm commutant growth at the compressor, so this claim implies the negation of <code><a href=\"corona-commutant-no-growth.html\">corona-commutant-no-growth</a></code> \u2014 the same hinge reached from a different direction, and independently of the Kazhdan transport argument (<code><a href=\"marked-quotient-mf-forces-commutant-growth.html\">marked-quotient-mf-forces-commutant-growth</a></code>).</p>\n<p><strong>The algebra-versus-group gap bites at the INPUT, not only the output.</strong> Residual finiteness of <code>V</code> gives <em>group</em> MF for free, and gives nothing at the algebra level: <code>C*(V)</code> MF is not implied by <code>V</code> being residually finite, linear, or residually finite dimensional-free in any other sense.  Both hypotheses of Theorem 20 are therefore genuinely open inputs here, including the one about a group whose group-level MF was trivial.  Do not read \"<code>V</code> is linear hence MF\" as \"<code>C*(V)</code> is MF\".</p>\n<p><strong>What is known about those inputs.</strong>  Both vertex algebras contain <code>C*(Z^3 sd SL_3(Z))</code>.  Bekka (arXiv:math/0609102, abstract verified in <code>research/artifacts/bekka-math-0609102-verified.md</code>) proves the full C*-algebra of <code>SL_n(Z)</code>, <code>n &gt;= 3</code>, has no faithful tracial state; a separating family of finite-dimensional representations would produce one, so these algebras are not residually finite dimensional.  That does <strong>not</strong> refute MF \u2014 a unital MF algebra carries a limit trace, which need not be faithful \u2014 but it closes the exact finite-dimensional side, so whatever supplies MF here must be genuinely asymptotic.  Shulman's own introduction says the status directly: outside the amenable and RFD classes \"it is not clear when full group C*-algebras are MF or at least stably finite\".</p>\n<p><strong>A structural asymmetry worth exploiting</strong> (cairn-literal): the edge group <code>B_1</code> has <em>finite</em> index <code>256</code> in the right-hand vertex group, and infinite index in <code>V</code>.  So the compatibility datum is not symmetric \u2014 one side extends an embedding of <code>C*(B_1)</code> across a finite-index overgroup.  Induction does not obviously help, since it returns a representation whose restriction is the induced one rather than the original, but the asymmetry should be checked before the two sides are treated alike.</p>\n<p><strong>What it is good for anyway.</strong>  It converts \"is the quotient MF\" into a question about two <em>residually finite</em> groups and one matching condition on a shared (T) subgroup, with no lamp combinatorics left.  Any negative answer for <code>C*(V)</code> would also be interesting on its own.</p>"}, {"id": "amenable-rep-of-kazhdan-has-fd-subrep", "status": "ESTABLISHED", "root": false, "goal": false, "title": "An amenable representation of a Kazhdan group has a finite-dimensional subrepresentation", "impact": 0, "frontier": false, "lock": null, "html": "<p>Let <code>G</code> have property (T) and let <code>\u03c0 : G \u2192 U(H)</code> be a unitary representation that is amenable in Bekka's sense \u2014 there is a state <code>m</code> on <code>B(H)</code> with <code>m(\u03c0(g)A\u03c0(g)^*) = m(A)</code>. Then <code>\u03c0</code> has a nonzero finite-dimensional subrepresentation.</p>\n<p>Proof (Proposition 3 of the artifact): normal states are weak-\\<em> dense and <code>Ad \u03c0</code> preserves them, so Day's trick gives density operators <code>\u03c1_i</code> with <code>\u2016\u03c0(g)\u03c1_i\u03c0(g)^</em> \u2212 \u03c1_i\u2016\u2081 \u2192 0</code>; Powers\u2013St\u00f8rmer (<code>\u2016a^{1/2} \u2212 b^{1/2}\u2016\u2082\u00b2 \u2264 \u2016a \u2212 b\u2016\u2081</code>) turns these into almost invariant unit vectors <code>\u03c1_i^{1/2}</code> of <code>Ad \u03c0</code> on <code>HS(H) \u2245 H \u2297 H\u0304</code>; property (T) gives a nonzero invariant <code>T \u2208 HS(H)</code>, i.e. <code>T \u2208 \u03c0(G)'</code>; and <code>T^*T</code> is a nonzero positive trace-class operator in <code>\u03c0(G)'</code>, so a spectral projection <code>1_{[\u03bb,\u221e)}(T^*T)</code> is a nonzero finite-rank projection commuting with <code>\u03c0(G)</code>.</p>\n<h3>Provenance</h3>\n<p><strong>The primary sources were not read</strong> \u2014 Springer authentication wall \u2014 so the statement is proved above rather than cited, from ingredients that are all standard and none of them specific to this problem. The node was created because a flagged-but-unread citation is not usable under the doctrine, and deriving it was cheaper than obtaining it.</p>\n<p><strong>Attribution, corrected.</strong> An earlier version of this section credited the statement to Bekka, <em>Amenable unitary representations of locally compact groups</em>, Invent. Math. 100 (1990) 383\u2013401. That is the wrong paper. <code>cairn-scout</code> located the dichotomy as Bekka\u2013Valette, <em>Kazhdan's property (T) and amenable representations</em>, Math. Z. 212 (1993) 293\u2013299, Theorem 1; Bekka's 1990 Theorem 5.1 is the separate equivalence \"<code>\u03c0</code> amenable \u27fa <code>\u03c0 \u2297 \u03c0\u0304</code> weakly contains <code>1</code>\", which is what makes the two statements look like one. See <code><a href=\"bekka-valette-amenable-t-dichotomy.html\">bekka-valette-amenable-t-dichotomy</a></code> for the verbatim record and its trust surface. Bekka\u2013Valette is also <strong>stronger</strong> than what is proved here: it is a dichotomy, giving the converse direction (a group lacking (T) admits an amenable representation with no nonzero finite-dimensional subrepresentation). Only the direction stated above is established in this repository.</p>\n<h3>Consequence for the charge lane</h3>\n<p>Kahl\u2013Schneider characterize hyperlinearity by an essentially free amenable <strong>near</strong> representation. If <code>\u03c0</code> were an essentially free amenable <strong>genuine</strong> representation of <code>W</code>, restricting the invariant state to <code>G \u2264 W</code> makes <code>\u03c0|_G</code> amenable, and <code>G</code> is Kazhdan by Kun\u2013Thom Theorem E, so <code>\u03c0|_G</code> would have a nonzero finite-dimensional subrepresentation. That is exactly the regime where this repository's rigidity results bite: <code>Criterion/CommutantRigidity.commutant_no_growth</code> collapses the relative commutant for genuine finite-dimensional representations, and <code>Criterion/ExactCompression.fixedSubmodule_map_eq</code> supplies the invariant size (<code>finrank</code>) that <code>no_strict_compression_of_invariantSize</code> consumes.</p>\n<p>So the genuine case is rigid, and the whole content of the criterion for <code>W</code> sits in the gap between <em>near</em> and <em>genuine</em>.</p>\n<p><strong>Correction (2026-08-14).</strong> An earlier version of this paragraph went on to conclude that the charge lane is therefore <em>not</em> independent of the rigidity branch \u2014 that it is \"independent exactly to the extent that flexibility is, and no further\". That inference was wrong and is retracted. It assumed that flexible HS-stability of <code>G</code> would let one replace an amenable near representation by a genuine one and then apply the theorem above. It does not. Amenability is the existence of an invariant <strong>state on <code>B(H)</code></strong>, and states are continuous for the operator norm, not for <code>\u2016\u00b7\u2016\u2082</code>; flexible HS-stability supplies only Hilbert\u2013Schmidt closeness. So invariance of the state does not transfer along the perturbation, and there is no route from the theorem above to a refutation of the near version.</p>\n<p>That is a sharper reason for the lane's survival than the observation that Bekka\u2013Valette is a statement about homomorphisms and a near representation is not one. The latter says the theorem does not apply; the former says no repair is available either, because amenability and near-ness are measured in incompatible topologies \u2014 amenability at the operator-norm scale, near-ness at the trace scale. The two lanes really are independent, and <code>cairn-scout</code> was right to report so.</p>\n<p>What is genuinely open, and is the pivot: whether a near-representation analogue of the dichotomy holds (<code><a href=\"near-representation-amenability-dichotomy.html\">near-representation-amenability-dichotomy</a></code>). If one does, the independence evaporates. Nothing read on either side bears on it.</p>"}, {"id": "bare-relative-wall-exists", "status": "OPEN", "root": false, "goal": false, "title": "One bare relative wall in a Connes-embeddable model", "impact": 1, "frontier": false, "lock": null, "html": "<p>Find a Connes-embeddable finite tracial von Neumann algebra <code>M</code>, a homomorphism <code>pi:G-&gt;U(M)</code> for the Kun--Thom infranormal Kazhdan pair <code>Gamma&lt;G</code>, and a unitary</p>\n<pre>\nv in M intersect pi(Gamma)&#x27;   with   [v,pi(h)]!=1,\nh=t^(-1) gamma t notin Gamma.\n</pre>\n<p>Equivalently (<code><a href=\"relative-wall-commutant-growth.html\">relative-wall-commutant-growth</a></code>), make one relative commutant grow strictly under one compressor: <code>M intersect pi(Gamma)' != M intersect pi(t Gamma t^(-1))'</code>.</p>\n<p>Neither faithfulness, nor the Clifford sign, nor a prescribed trace energy is required: by <code><a href=\"wall-energy-amplification.html\">wall-energy-amplification</a></code> the energy comes for free, and by the radical-collision endpoint the bare inequality already produces a hyperlinear nonsofic group.  This is the weakest known sufficient hypothesis in the whole Kun--Thom lane.</p>\n<p><strong>This is packaging, not a reduction of the difficulty.</strong>  Given a homomorphism <code>phi</code> of the free lamp <code>H_K=G *_Gamma (Gamma x K)</code> into a hyperlinear group with <code>phi(r)!=1</code>, put <code>pi=phi|_G</code> and <code>v=phi(k)</code>: that is a wall.  Conversely a wall defines such a <code>phi</code>.  So this claim is <em>equivalent</em> to the marked instance of the radical-collision criterion at <code>H=H_K</code>, and <code><a href=\"radical-collision-reformulation.html\">radical-collision-reformulation</a></code> records that the criterion is a restatement of Question 3.4 at full strength rather than a reduction of it.  What is gained here is only the <strong>minimality of the data</strong> \u2014 no faithfulness, no Clifford sign, no trace energy, one unitary in one relative commutant \u2014 and that is a packaging gain, not a logical one.  What keeps this claim from being a rename of the root is that the root quantifies over all countable groups while this one fixes the Kun--Thom pair: it is strictly stronger, so <code><a href=\"bare-wall-radical-collision-route.html\">bare-wall-radical-collision-route</a></code> is a specialization, not an equivalence.</p>\n<p>Its exact negation is <code><a href=\"kt-centralizer-normalization-hs.html\">kt-centralizer-normalization-hs</a></code>, the tracial analogue of Kun--Thom Theorem 4.1; establishing that would make the explicit even Clifford cover a nonhyperlinear group.  Precisely one of the two holds, and the fork is not symmetric in difficulty: the counting invariants that carry the permutation proof \u2014 cell sizes and isotropy orders of an atomic partition algebra \u2014 have no informative normalized shadow here.  By <code><a href=\"commutant-density-trace-blind.html\">commutant-density-trace-blind</a></code> the only such shadow is <code>lim_j sum_gamma mu_j(gamma)|chi(gamma)|^2</code>, which is conjugation invariant, hence identical for <code>Gamma</code> and <code>t Gamma t^(-1)</code>, and identically zero for every character supported at the identity.  The surviving invariant is the Pimsner--Popa index, which <code><a href=\"clifford-compressor-site-growth.html\">clifford-compressor-site-growth</a></code> computes to be infinite at every strict positive compressor in the Clifford model.</p>"}, {"id": "bekka-valette-amenable-t-dichotomy", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Bekka--Valette collapses amenable GENUINE representations of a (T) group, and only genuine ones", "impact": 0, "frontier": false, "lock": null, "html": "<p>Requested by <code>cairn-wreath</code>: does the amenable-charge lane collapse into the rigidity branch?  <strong>Not by this theorem \u2014 but read the two qualifications before quoting that as \"the lanes are independent\".</strong></p>\n<p>1. What is established here is only that Bekka--Valette does not <em>apply</em>: it is about genuine representations, and a near representation is not one.  That leaves open whether some <em>repair</em> bridges the gap. <code>cairn-wreath</code> supplied the stronger reason, recorded in the next section: no repair is available, because the two notions live at different metric scales. 2. Whether a <strong>near-representation analogue</strong> of the dichotomy holds is open, and nothing read here bears on it either way.  If one were established the lane closes.  That question is tracked as <code><a href=\"near-representation-amenability-dichotomy.html\">near-representation-amenability-dichotomy</a></code>; it is the single question deciding whether the charge route is a separate attack or the rigidity fork in different notation, so this node's conclusion is conditional on it and should never be cited without it.</p>\n<h3>The theorem</h3>\n<p>Bekka--Valette, <em>Kazhdan's property (T) and amenable representations</em>, Math. Z. 212 (1993), 293--299, Theorem 1.  The article is behind a Springer paywall; the statement is recorded here <strong>as used verbatim</strong> by Li--Ng, <em>Spectral gap actions and invariant states</em>, arXiv:1304.7051, in the proof of their Theorem 4.1, step (T5) implies (T1):</p>\n<p>&gt; \"Suppose that <code>Gamma</code> does not have property (T).  By [4, Theorem 1], there &gt; is a unitary representation <code>mu : Gamma -&gt; L(K)</code> such that <code>mu</code> does not &gt; have a nonzero finite dimensional subrepresentation and &gt; <code>pi := mu \u2297 conj(mu)</code> weakly contains <code>1_Gamma</code>.\"</p>\n<p>with their [4] being Bekka--Valette.  Since <code>pi \u2297 conj(pi)</code> weakly containing the trivial representation is Bekka's amenability of <code>pi</code> (Bekka, <em>Amenable unitary representations of locally compact groups</em>, Invent. Math. 100 (1990) 383--401; Li--Ng use the same equivalence in their Remark 4.2 via Bekka's Theorem 5.1), this says:</p>\n<pre>\nGamma lacks (T)  =&gt;  some AMENABLE unitary representation of Gamma has\n                     no nonzero finite-dimensional subrepresentation.\n</pre>\n<p>equivalently, in the direction that matters here:</p>\n<pre>\nGamma has (T)  =&gt;  every AMENABLE unitary representation of Gamma contains\n                   a nonzero finite-dimensional subrepresentation.\n</pre>\n<h3>Why it does not collapse the Kahl--Schneider lane</h3>\n<p><code><a href=\"hyperlinear-near-representation-criterion.html\">hyperlinear-near-representation-criterion</a></code> records Kahl--Schneider's Theorem B: <code>G</code> is hyperlinear iff there are a set <code>X</code>, a probability charge <code>mu</code> on <code>P(X)</code> and a <code>mu</code>-<strong>near</strong> representation <code>pi : G -&gt; U(l^2(X))</code> with <code>mu({x : |&lt;x, pi(g)x&gt;| &lt;= eps}) = 1</code> for every <code>g != e</code> and every <code>eps &gt; 0</code>. Their Definition 6.2: a <code>mu</code>-near representation is a map <code>pi : G -&gt; U(H)</code> with <code>mu_bullet</code> invariant under <code>pi(G)</code> and</p>\n<pre>\nmu({x in X : ||pi(gh)x - pi(g)pi(h)x|| &lt;= eps}) = 1   for all g,h and eps&gt;0.\n</pre>\n<p><strong><code>pi</code> is not a homomorphism.</strong>  Multiplicativity holds only <code>mu</code>-almost-everywhere, to within every <code>eps</code>.  Bekka--Valette is a statement about genuine unitary representations \u2014 \"subrepresentation\" presupposes an actual homomorphism \u2014 so it simply does not apply to these objects.</p>\n<h3>The stronger reason (<code>cairn-wreath</code>): a scale mismatch, not a parsing failure</h3>\n<p>Non-applicability alone would leave room for a repair \u2014 convert an amenable near representation into an amenable genuine one, then apply the theorem. <code>cairn-wreath</code> observed that no such repair is available on this branch, and the reason is metric rather than syntactic:</p>\n<p>&gt; amenability is the existence of an invariant <strong>state on <code>B(H)</code></strong>, and states &gt; are continuous for the <strong>operator norm</strong>; flexible HS-stability supplies &gt; only <code>||.||_2</code> closeness.  So invariance of the state does not transfer &gt; along the perturbation, at any stability hypothesis available here.</p>\n<p>Amenability lives at the operator-norm scale and near-ness at the trace scale, and the collapse cannot cross between them.  That is why the routes are genuinely separate rather than merely not-yet-shown-dependent \u2014 and, as they note, it is also why the amenable-charge route does not share a failure mode with the trace-scale routes (<code><a href=\"growing-fiber-models.html\">growing-fiber-models</a></code>, <code><a href=\"positive-core-dilation-splice.html\">positive-core-dilation-splice</a></code>).</p>\n<p>This is a better argument than the one above and supersedes it as the reason; the parsing point survives only as the observation that the theorem's statement does not even typecheck against a near representation.</p>\n<p><code>[MY INFERENCE]</code> The two lanes are therefore <strong>independent</strong>, and the near-ness is load-bearing rather than a technical convenience.  If genuine amenable representations had sufficed for the criterion, then for a Kazhdan group hyperlinearity would reduce by Bekka--Valette to possessing a nonzero finite-dimensional subrepresentation \u2014 which would make every minimally almost periodic Kazhdan group nonhyperlinear, a conclusion nobody has and which would settle far more than is settled.  So the charge-based witness evades the rigidity collapse <em>by construction</em>, which is consistent with the reason <code><a href=\"hyperlinear-near-representation-criterion.html\">hyperlinear-near-representation-criterion</a></code> was recorded as evading the eight dead finite-carrier architectures.</p>\n<h3>Trust surface</h3>\n<p>Bekka--Valette Theorem 1 was <strong>not</strong> read in the original (Springer paywall, the wall <code>cairn-wreath</code> flagged).  It is imported on Li--Ng's verbatim use of it, which is a primary source for the phrasing quoted above but not for the theorem's full statement \u2014 in particular the converse direction and any hypotheses on <code>Gamma</code> beyond countability/discreteness are not established here.  The identification \"amenable = <code>pi \u2297 conj(pi)</code> weakly contains 1\" is standard and was read in use rather than as a displayed theorem.  Anyone needing the full biconditional or the locally compact version should obtain the Math. Z. article.</p>"}, {"id": "block-escape-relocates-nonsoficity", "status": "OPEN", "root": false, "goal": false, "title": "Orbit resolution fails only through invariant blocks, and every such escape inherits the nonsoficity", "impact": 0, "frontier": false, "lock": null, "html": "<p>Let <code>K</code> act transitively on a finite site set <code>Y</code>, let <code>O</code> be a <code>K</code>-orbit of subsets of <code>Y</code>, and for a permutation <code>pi</code> write <code>fix_O(pi)</code> and <code>fix_Y(pi)</code> for the fractions of <code>O</code> fixed setwise and of <code>Y</code> fixed pointwise.</p>\n<p>1. <strong>The resolution lemma is false.</strong>  There is no function <code>delta</code> with <code>delta(epsilon) -&gt; 0</code> such that <code>fix_O(pi) &gt;= 1-epsilon</code> implies <code>fix_Y(pi) &gt;= 1-delta(epsilon)</code>, even for transitive <code>Y</code>.  If some nontrivial <code>K</code>-invariant partition of <code>Y</code> has every member of <code>O</code> a union of blocks, then <strong>every</strong> permutation preserving each block setwise fixes <strong>all</strong> of <code>O</code>, while moving as many points as the blocks are large. Transitivity does not help: it only rules out the degenerate version in which <code>O</code> ignores a <code>K</code>-invariant subset. 2. <strong>Blocks are the only failure at <code>epsilon = 0</code>.</strong>  If the indicator vectors <code>1_S</code>, <code>S in O</code>, span <code>F_2^Y</code>, then a permutation fixing every member of <code>O</code> fixes every vector of <code>F_2^Y</code> and is the identity.  So a total failure of resolution forces the <code>1_S</code> into a proper subspace, which is <code>K</code>-invariant; invariant partitions are the geometric instance of that. 3. <strong>Every block escape relocates the problem and inherits its nonsoficity.</strong>  In the Kun--Thom setting the site sets model <code>X=G/Gamma</code>, and an invariant partition corresponds to an intermediate subgroup <code>Gamma &lt;= H &lt;= G</code>, with the marked pair still separated exactly when <code>h notin H</code>.  For any such <code>H</code>, the <code>G</code>-map <code>G/Gamma -&gt; G/H</code> induces</p>\n<pre>\n   W = (directSum_(G/Gamma) Z/2Z) semidirect G\n     --&gt;  W_H = (directSum_(G/H) Z/2Z) semidirect G,\n</pre>\n<p>carrying the marked involution <code>w=a_(h Gamma) a_Gamma</code> to <code>a_(hH) a_H != 1</code>.  Since <code>w</code> lies in the sofic radical of <code>W</code>, <code>W_H</code> cannot be sofic; and by Gao--Kunnawalkam Elayavalli--Patchell a sofic underlying action would make <code>W_H</code> sofic.  So <code>G</code> acting on <code>G/H</code> is not a sofic action either.</p>\n<p>Consequently the proposed obstruction \u2014 that a Hilbert embeddable witness would yield a sofic approximation of the coset action \u2014 <strong>does not close as stated</strong>, because the character condition controls only the orbit of subsets and not the sites.  But the gap it leaves is not a place where a witness can comfortably live: any invariant partition that keeps the mark separated carries the same nonsoficity down to a smaller coset space, so the escape is a translation of the problem rather than a solution to it.</p>"}, {"id": "block-monomial-coordinate-collapse", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Block-monomial fiber models collapse to permutation models", "impact": 0, "frontier": false, "lock": null, "html": "<p>No <em>block-monomial fiber model</em> of <code>M_KT = L(W)</code> exists: no trace-preserving embedding <code>\u0398 : M_KT \u2192 \u220f_\ud835\udcb0 M_{d_n}</code> with <code>d_n = |Y_n|\u00b7m_n</code>, lamps in <code>\u220f_\ud835\udcb0(D_{Y_n} \u2297 1)</code>, and every <code>\u0398(u_g)</code> represented by matrices that are block-monomial over <code>Y_n</code> (permutation of <code>Y_n</code> with arbitrary <code>U(m_n)</code> blocks). The fiber dimension <code>m_n</code> is unconstrained.</p>\n<p>The proof is three moves. A block-monomial matrix has a permutation part, and <code>\u2016A \u2212 B\u2016\u2082\u00b2 \u2265 2 d_H(\u03c0(A), \u03c0(B))</code> uniformly in <code>m</code> \u2014 a mismatch of permutation parts moves a whole block, so growing the fiber dilutes traces but not mismatches. Hence multiplicativity of <code>\u0398</code> descends to the permutation parts and <code>\u03c3 : G \u2192 \ud835\udcae_\ud835\udcb0</code> is a homomorphism, covariant for the lamps because conjugating a coarse diagonal by a block-monomial cancels the blocks exactly. <code>\u03c3</code> need not be faithful \u2014 that is precisely what the fiber was meant to buy \u2014 but faithfulness is bought back for free by tensoring with a sofic representation of <code>G</code>, which exists because <code>G</code> is residually finite. The result is a genuine sofic-action witness, contradicting Kun\u2013Thom Corollary D.</p>\n<p><strong>What this closes.</strong> The most natural reading of \"the trace is blind to sizes\": put the lamps on coordinates, hide the group's Hilbert\u2013Schmidt separation in a growing unitary fiber, and escape Corollary D because the group unitaries are no longer permutations. The trace is indeed blind to the fiber. The obstruction is not in the fiber \u2014 it rides on the lamps, and the lamps are faithfully represented on the coordinates whatever the fiber does. Recorded as <code><a href=\"block-monomial-fiber-models.html\">block-monomial-fiber-models</a></code>, now invalidated.</p>\n<p><strong>Why it is not covered by <code><a href=\"diagonal-normalizer-rigidity.html\">diagonal-normalizer-rigidity</a></code>.</strong> That result needs the <strong>full</strong> diagonal masa, and says so: for a merely coarse subalgebra the Fourier-block unitary <code>\u2295_j F_{m}</code> centralizes it while sitting at distance <code>\u221a2</code> from every monomial, so no monomial approximation is available. This claim shows that gap is not a door. A Fourier-block unitary is still block-monomial over the coarse index set; its permutation part is still defined and still multiplicative; the lamps still ride on the coarse coordinates. Distance from monomials was never the relevant measurement \u2014 existence of a permutation part was.</p>\n<p><strong>Scope, and it is a real scope.</strong> Step 1 uses block-monomiality <em>exactly</em>, in the ultraproduct. Models whose group unitaries are only approximately block-monomial, with a defect bounded away from zero, are untouched \u2014 and that is the generic case, since a finite window of the lamp algebra has <code>2^k</code> atoms of equal trace, giving an approximate coarse decomposition whose defect is governed by the boundary of the window in <code>G/\u0393</code>, which carries a constant fraction of the mass because property (T) and infinite index leave no F\u00f8lner sets. Theorem 2 kills exact block structure; amplification (<code>docs/OBSTRUCTIONS.md</code> \u00a73) kills the naive approximate one. Nothing here says <code>M_KT</code> is not Connes-embeddable.</p>"}, {"id": "bounded-rank-corners-excluded", "status": "ESTABLISHED", "root": false, "goal": false, "title": "A corner detecting the mark cannot have bounded rank", "impact": 0, "frontier": false, "lock": null, "html": "<p>Let the transport data be as in <code><a href=\"coordinate-ultraproduct-transport.html\">coordinate-ultraproduct-transport</a></code>: <code>Gamma</code> Kazhdan, <code>iota : Gamma -&gt; H</code>, <code>t</code> compressing, <code>c</code> centralizing, <code>u = [t c t^-1, iota a]</code>, and a central <code>eps</code> in the normal closure of <code>u</code> inside <code>H_0</code>.  Let <code>Theta</code> be a corona representation, <code>q != 0</code> a projection in the relative commutant <code>Theta(H)' cap Q</code> with</p>\n<p>\u2016(Theta(eps) - lambda) q\u2016 = 0   for some lambda != 1,</p>\n<p>that is, a corner of the kind <code><a href=\"commutant-projection-extraction.html\">commutant-projection-extraction</a></code> asks for. If the lifted ranks of <code>q</code> are bounded by <code>r</code> along the ultrafilter, and <strong>every unitary representation of <code>iota(Gamma)</code> of dimension at most <code>r</code> is trivial</strong>, then no such <code>q</code> exists.</p>\n<p>Two instances.  If <code>iota(Gamma)</code> is perfect, every one-dimensional representation is trivial, so no detecting corner has rank one.  If <code>iota(Gamma)</code> is minimally almost periodic \u2014 every finite-dimensional unitary representation trivial, as the repository's Steinberg group <code>St_5(L)</code> is \u2014 then no detecting corner has bounded rank at all.</p>\n<p><strong>Compatibility with the block-decomposition lane.</strong>  This does not constrain <code><a href=\"hs-expander-block-decomposition.html\">hs-expander-block-decomposition</a></code>, whose blocks are almost invariant in <strong>normalized Hilbert--Schmidt</strong> norm and are explicitly allowed to have vanishing normalized trace; those blocks do not lie in the relative commutant used here, which is an exact commutant of the ultraproduct in operator norm.  The two statements meet only under a strengthening: an operator-norm version of that block decomposition would have to produce blocks of <strong>unbounded rank</strong> over a minimally almost periodic source, since bounded-rank blocks are excluded here.  Worth knowing before either lane strengthens its norm.</p>\n<p><strong>Consequence for method.</strong>  The only known way to build such a corner is to produce an approximate joint eigenvector and take the rank-one projection onto it.  That technique is therefore unavailable for exactly the groups this program cares about.  See <code><a href=\"commutant-projection-extraction.html\">commutant-projection-extraction</a></code> for the model where the technique does work and why the difference is the abelianization.</p>"}, {"id": "carrier-not-decoder", "status": "ESTABLISHED", "root": false, "goal": false, "title": "The long-root carrier is common but not a decoder", "impact": 0, "frontier": false, "lock": null, "html": "<p>The long root commutes with both outer packets and the middle root, so its nontrivial spectral cut is an exact common positive-density carrier \u2014 and the finite <code>UT\u2084(F\u2082)</code> regular model realizes this carrier and the full nested table WITHOUT a classical decoder. Carrier existence alone cannot be the finite-window decoder; <a href=\"finite-window-decoder.html\">finite-window-decoder</a> must use growing extension-fiber covariance, not merely the finite four-root packet.</p>"}, {"id": "central-extension-twisted-sector-criterion", "status": "ESTABLISHED", "root": false, "goal": false, "title": "MF of a central order-two extension is the twisted sector over the quotient", "impact": 0, "frontier": false, "lock": null, "html": "<p>Let <code>1 -&gt; C_2 -&gt; G -&gt; K -&gt; 1</code> be central with <code>K</code> MF, let <code>s(k)s(l) = omega(k,l) s(kl)</code> be a section cocycle, and let <code>chi</code> be the nontrivial character of <code>C_2</code>.  Then <code>G</code> is MF if and only if there are maps <code>v_n : K -&gt; U(d_n)</code> with</p>\n<pre>\n|| v_n(k) v_n(l) - chi(omega(k,l)) v_n(kl) ||_op -&gt; 0\n</pre>\n<p>for every fixed pair <code>k,l</code>.  No separation condition on <code>v_n</code> is needed.</p>\n<p><strong>What this says about the two marked quotients, and what it does not.</strong> Applied to <code>(E, &lt;w&gt;)</code> or <code>(W, &lt;zeta&gt;)</code>, the twisted condition says exactly that some corona representation of the total group sends the central involution to <code>-1</code>, which Theorem A refutes.  So here the criterion is a restatement of the non-MF theorem \u2014 the failure of MF for <code>E</code> is precisely the emptiness of the twisted sector over <code>E/&lt;w&gt;</code> \u2014 and it is consistent with either answer for <code><a href=\"commuting-lamp-quotient-mf.html\">commuting-lamp-quotient-mf</a></code> and <code><a href=\"literal-mark-quotient-mf.html\">literal-mark-quotient-mf</a></code>: MF of the quotient is a hypothesis of the useful direction, not a conclusion.  It is <strong>not</strong> an obstruction to either claim.</p>\n<p>The contrast with the tracial world is the point.  Thom's Remark 3.4 (<code><a href=\"thom-central-corner-criterion.html\">thom-central-corner-criterion</a></code>) gives descent \u2014 a central quotient of a hyperlinear group is hyperlinear \u2014 so the analogous questions there are automatic.  MF has no descent (<code><a href=\"mf-quotient-nonclosure.html\">mf-quotient-nonclosure</a></code>), and that missing descent is exactly the content of the two open quotient claims.</p>"}, {"id": "central-sign-corona-obstruction", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Central-sign obstruction to norm-matrix-corona embeddings", "impact": 2, "frontier": false, "lock": null, "html": "<p>Under one-sided compression of a property-(T) subgroup, if a central involution is the square of the commutator of a displaced centralizer element with the Kazhdan subgroup, then every homomorphism to a norm matrix corona kills that involution.  If it is nontrivial, the ambient group is not MF.</p>"}, {"id": "clifford-bernoulli-central-summands", "status": "ESTABLISHED", "root": false, "goal": false, "title": "The Bernoulli and Clifford crossed products are the two central summands of one lamp group", "impact": 0, "frontier": false, "lock": null, "html": "<p>Let <code>X</code> be a <code>G</code>-set and let the <strong>Clifford lamp group</strong> be</p>\n<pre>\nC(X) = \u27e8 c_x (x \u2208 X), z | z\u00b2 = 1, z central, c_x\u00b2 = 1, c_x c_y = z c_y c_x (x \u2260 y) \u27e9,\n</pre>\n<p>a central <code>\u2124/2</code>-extension of <code>\u2295_X \u2124/2</code> on which <code>G</code> acts by <code>g\u00b7c_x = c_(gx)</code>, <code>g\u00b7z = z</code>. Put <code>W\u0303 = C(X) \u22ca G</code>, so <code>W\u0303/\u27e8z\u27e9 = W</code>. Then <code>p_\u00b1 = (1 \u00b1 z)/2</code> are <code>G</code>-fixed central projections of trace <code>1/2</code> and</p>\n<pre>\nL(W\u0303) = ( L^\u221e({\u00b11}^X) \u22ca G ) \u2295 ( Cl(X) \u22ca G ).\n</pre>\n<p>Consequences:</p>\n<p>1. <code>W\u0303</code> is hyperlinear <strong>iff both</strong> <code>L(W) = M_KT</code> and <code>Cl(X) \u22ca G</code> are Connes embeddable, so jointly they are hyperlinearity of the single group <code>W\u0303</code>. They are <strong>not</strong> independent, however, and an earlier version of this line said they were: <code><a href=\"clifford-ce-implies-bernoulli-ce.html\">clifford-ce-implies-bernoulli-ce</a></code> proves that Connes embeddability of <code>Cl(X) \u22ca G</code> implies Connes embeddability of <code>M_KT</code>, by diagonal doubling <code>c_x \u2297 c_x</code> inside a tensor square (<code>TRUE_DOUBLE_CLIFFORD_KUN_THOM_REDUCTION.md</code>, <code>(DCK11)</code>\u2013<code>(DCK14)</code>) \u2014 a cross-summand argument the direct-sum picture does not see. Hence <code><a href=\"kun-thom-clifford-crossed-product-ce.html\">kun-thom-clifford-crossed-product-ce</a></code> is by itself equivalent to hyperlinearity of <code>W\u0303</code>, and it implies <code><a href=\"hyperlinear-wreath-model.html\">hyperlinear-wreath-model</a></code>. No converse is known. 2. <code>W</code> is hyperlinear as soon as <code>W\u0303</code> is, although <code>W</code> is a <strong>quotient</strong> of <code>W\u0303</code>. Hyperlinearity does not pass to quotients in general; it does here because a central <code>\u2124/2</code> makes the quotient's group algebra a direct summand rather than a quotient algebra. 3. <code><a href=\"diagonal-normalizer-rigidity.html\">diagonal-normalizer-rigidity</a></code> and <code><a href=\"invariant-cartan-completion.html\">invariant-cartan-completion</a></code> apply to the Bernoulli summand <strong>only</strong>. Their engine is the abelian diagonalization lemma, and <code>Cl(X)</code> is a <code>II\u2081</code> factor, so no conjugation puts it in a diagonal ultraproduct. Kun\u2013Thom Definition 2.2 and Corollary D are statements about p.m.p. actions and have no purchase on the Clifford summand; it is obstructed only through the repository's own radical-phase detector. 4. Conversely Kun\u2013Thom Theorem A's endgame transcribes verbatim to <code>W\u0303</code>, since <code>\u0393</code> fixes the base coset and distinct Majoranas are distinct: <code>W\u0303</code> is nonsofic for the same reason <code>W</code> is.</p>"}, {"id": "clifford-ce-implies-bernoulli-ce", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Clifford embeddability implies Bernoulli embeddability, so the Clifford corner decides the cover", "impact": 0, "frontier": false, "lock": null, "html": "<p>Write <code>N=Cl(X) crossed_product G</code> and <code>M_KT=L^infinity({-1,1}^X) crossed_product G</code> for the two central summands of <code>L(Wtilde)</code>, <code>X=G/Gamma</code>.  Then</p>\n<pre>\nN Connes embeddable ==&gt; M_KT Connes embeddable.\n</pre>\n<p>Proof: inside <code>N tensorBar N</code> the elements <code>D_x=c_x tensor c_x</code> and <code>V_g=u_g tensor u_g</code> are commuting self-adjoint unitaries permuted by <code>G</code> with <code>tau(D_(x_1)...D_(x_k) V_g)=tau(c_(x_1)...c_(x_k) u_g)^2</code>, which is the canonical trace of <code>M_KT</code>; so <code>M_KT</code> sits trace-preservingly in a tensor square of <code>N</code>.  The two Clifford signs cancel.  This is <code>(DCK11)--(DCK14)</code>.</p>\n<p>No converse is known: the twisted corner is a square root of the untwisted one in the cocycle sense, and <code>sigma tensor sigma</code> is trivial while <code>sigma</code> is not.</p>\n<p>Consequences.</p>\n<p>1. With <code><a href=\"clifford-bernoulli-central-summands.html\">clifford-bernoulli-central-summands</a></code> (both summands embeddable iff <code>Wtilde</code> hyperlinear): <code>N</code> Connes embeddable <strong>iff</strong> <code>Wtilde</code> is hyperlinear.  The Clifford corner alone decides the whole cover. 2. The lanes are ordered, not independent: refuting <code>M_KT</code> embeddability refutes <code><a href=\"kun-thom-clifford-crossed-product-ce.html\">kun-thom-clifford-crossed-product-ce</a></code> as well, while establishing the Clifford corner establishes the Bernoulli one.  Whoever refutes the weaker target closes both. 3. A second, independent derivation of the same implication runs through <code><a href=\"thom-central-corner-criterion.html\">thom-central-corner-criterion</a></code>: <code>Wtilde</code> embeds faithfully in <code>U(N)</code>, so <code>N</code> embeddable makes <code>Wtilde</code> hyperlinear, and Thom's Lemma 3.3 then gives embeddability of every twisted corner, <code>M_KT</code> included.</p>"}, {"id": "clifford-ce-targets-are-equivalent", "status": "ESTABLISHED", "root": false, "goal": false, "title": "The full, even-core, and one-character Clifford CE targets are the same problem", "impact": 0, "frontier": false, "lock": null, "html": "<p>Write <code>M_full = Cl(X) crossed_product G</code> for the negative full Clifford crossed product over <code>X = G/Gamma</code>, <code>A_CAR crossed_product G</code> for its even subalgebra crossed with <code>G</code>, <code>E_(Cl,0)</code> for the perfect even Clifford cover, and <code>tau_can</code> for the canonical trace on <code>A_CAR crossed_product G</code>. Then:</p>\n<pre>\nM_full Connes embeddable\n  &lt;=&gt; A_CAR crossed_product G Connes embeddable            (Prop 4)\n</pre>\n<p>and the following are equivalent (Theorem 6, \"no character shortcut\"):</p>\n<p>1. <code>E_(Cl,0)</code> has a Connes-embeddable character <code>chi</code> with <code>chi(z) != 1</code>; 2. it has a Connes-embeddable character <code>chi_-</code> with <code>chi_-(z) = -1</code>; 3. the canonical trace <code>tau_can</code> is Connes-embeddable.</p>\n<h3>Why this belongs in the graph</h3>\n<p>Three formulations of the Clifford CE problem look like independent attack surfaces and are not. The corpus states the hazard directly:</p>\n<p>&gt; Thus the full-Majorana formulation and the perfect even-core formulation &gt; are two presentations of the same CE problem.  The full formulation makes &gt; the relative wall \\(C_o\\in\\pi(\\Gamma)'\\) visible; the even formulation keeps &gt; the nonsofic witness perfect and exposes the canonical CAR trace.  <strong>They &gt; must not be counted as independent construction routes.</strong></p>\n<p>Theorem 6 closes the third apparent surface: one might hope that producing <em>some</em> Connes-embeddable character merely nontrivial on <code>z</code> is cheaper than producing the canonical trace, since the former asks only for a nonzero negative corner rather than a specific trace value. It is not \u2014 compressing to the negative central corner and renormalizing upgrades any such character to one with <code>chi_-(z) = -1</code>, and Lemma 5 then pins it to <code>tau_can</code>.</p>\n<h3>What each formulation is still good for</h3>\n<p>The equivalences are about difficulty, not about usefulness. Each presentation exposes something different and is worth keeping as a <em>view</em>:</p>\n<ul>\n<li><code>M_full</code> makes the relative wall <code>C_o in pi(Gamma)'</code> visible, which is what</li>\n<p>connects to <code><a href=\"kun-thom-clifford-relative-wall.html\">kun-thom-clifford-relative-wall</a></code>;</p>\n<li>the even core keeps the nonsofic witness perfect, which matters for the</li>\n<p>simple/perfect envelope consequences;</p>\n<li><code>tau_can</code> is the concrete object a construction would actually have to embed.</li>\n</ul>\n<p>What is not allowed is to treat progress on one as independent evidence about another, or to open three routes and count them as three chances.</p>"}, {"id": "clifford-compressor-site-growth", "status": "ESTABLISHED", "root": false, "goal": false, "title": "The Clifford compressor index is infinite at every strict positive compressor", "impact": 0, "frontier": false, "lock": null, "html": "<p>For the monomial-cone Kun--Thom pair <code>Gamma=E_r(A[Lambda_+])</code>, <code>G=E_r(A[Lambda]) semidirect SL_3(Z)</code>, <code>X=G/Gamma</code>, in the Clifford crossed product <code>M_Cl=Cl(X) crossed_product G</code> with <code>N=M_Cl intersect pi(Gamma)'</code>, the growth index of every element of the positive monoid <code>L_+=SL_3(Z) intersect M_3(N)</code> is</p>\n<pre>\nlambda(s)=[Ad pi(s)(N):N]=1 if s is a permutation matrix,\n                          =infinity otherwise.\n</pre>\n<p>The <code>Gamma</code>-fixed site set contains an injective copy of <code>L_+</code> via <code>p |-&gt; p^(-1)Gamma</code>, the compressor acts on it by right division, and the new Clifford modes are indexed by <code>L_+ minus L_+ s</code> \u2014 infinite unless <code>s^(-1)</code> is again nonnegative, i.e. unless <code>s</code> is a unit.  Each new site has infinite <code>Gamma</code>-orbit, so the Kazhdan average kills its Clifford monomials and a Pimsner--Popa test projection of trace <code>2^(-k)</code> gives index at least <code>2^k</code>.</p>\n<p>This settles Section 7 item 3 of <code>docs/TRUE_RELATIVE_WALL_IS_COMMUTANT_ GROWTH.md</code> and strengthens its Corollary 7 from a disjunction to a determination.</p>\n<p>The relative commutant is computed alongside, as far as the external cosets go.  <code>N intersect Cl(X)=Cl(X)^Gamma=Cl(X_fin)^Gamma</code> where <code>X_fin</code> is the finite-orbit locus, and on the external cosets <code>ell Gamma</code> the orbit is a single point if <code>ell</code> is a permutation matrix and infinite otherwise \u2014 no middle ground \u2014 so that part of the fixed algebra is exactly <code>Cl(iota(L_+))</code>.  Under <code>p |-&gt; p^(-1)Gamma</code> the tower becomes right division by <code>s</code> on the compression monoid, adjoining the modes <code>L_+ minus L_+ s</code> at each step.  That system alone is the one-sided Clifford shift and is Connes embeddable inside <code>R</code>; the difficulty is the coupling to the higher Fourier degrees and to the rest of <code>G</code>, not the tower.  General cosets <code>(u,ell)Gamma</code> and the higher-degree part of <code>N</code> are not computed.</p>\n<p><strong>Scope, for reuse across the invariant-graph family.</strong>  The site count is graph independent \u2014 <code>X^Gamma</code> and its translates depend only on the <code>G</code>-set. The <em>index</em> statement is not: the test projection pairs new sites into factors <code>(1+i c c')/2</code>, which is a projection only when the two Majoranas anticommute, i.e. only when the two sites are adjacent in the graph.  In the complete graph every distinct pair is adjacent; for a general invariant graph <code>S</code> one needs <code>k</code> disjoint <code>S</code>-edges inside <code>s X^Gamma minus X^Gamma</code>, or a pairing of each new site with an <code>S</code>-adjacent old site, which also works because <code>E_N</code> is an <code>N</code>-bimodule map and old-site Majoranas lie in <code>N</code>. Neither has been checked for the sparse members.  It does not bear on Connes embeddability: the same infinite-index tower shape is realized by the one-sided Clifford shift inside the hyperfinite II_1 factor.</p>"}, {"id": "clifford-diagonal-lamp-subspace", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Block-monomial Clifford models must diagonalize a nonzero invariant lamp subspace", "impact": 0, "frontier": false, "lock": null, "html": "<p>Let <code>H_Cl = C(X) \u22ca G</code> be the Clifford cover of the Kun\u2013Thom wreath, <code>X = G/\u0393</code>. Call <code>\u0398 : L(H_Cl) \u2192 \u220f_\ud835\udcb0 M_{d_n}</code> a <em>block-monomial Clifford model</em> if <code>d_n = |Y_n|\u00b7m_n</code>, <code>\u0398(z) = \u22121</code>, and every <code>\u0398(a_x)</code> and <code>\u0398(u_g)</code> is block-monomial over <code>Y_n</code>. Put</p>\n<p>\ud835\udcae = { S \u2286 X finite : \u220f_{x\u2208S} \u0398(a_x) is diagonal } \u2286 \u2295_{G/\u0393} \ud835\udd3d\u2082.</p>\n<p>Then <code>\ud835\udcae</code> is a <code>G</code>-submodule of <code>\ud835\udd3d\u2082[G/\u0393]</code>, and <strong><code>\ud835\udcae \u2260 0</code></strong>.</p>\n<h3>Answer to the cross-lane question</h3>\n<p>cairn-wall asked whether <code><a href=\"block-monomial-coordinate-collapse.html\">block-monomial-coordinate-collapse</a></code> extends from abelian lamps in a coarse diagonal to Clifford lamps. Half of it does, and the half that fails is the informative one.</p>\n<p>What survives is the machinery: Lemma 1 of the companion note (<code>\u2016A \u2212 B\u2016\u2082\u00b2 \u2265 2 d_H(\u03c0(A),\u03c0(B))</code>, uniform in the fiber dimension) never uses that the lamps commute, so permutation parts still form a homomorphism, and since <code>\u0398(z) = \u22121</code> is scalar it factors through <code>H_Cl/\u27e8z\u27e9 = W</code>. Wall's guess that \"the site action is recoverable from the permutation\" is right that far.</p>\n<p>What fails is faithfulness on the lamps, which in the abelian case was free because the lamps <em>were</em> diagonal and their permutation parts were trivial. Clifford lamps are monomial with nontrivial permutation parts, and the permutation-part map can kill lamp words \u2014 so there is no pair of separated lamps left to derive a contradiction from. The theorem above is what remains: if <code>\ud835\udcae</code> were <code>0</code>, tensoring with a sofic representation of <code>G</code> would embed <code>W</code> into a permutation ultraproduct and make it sofic, contradicting Kun\u2013Thom Theorem A.</p>\n<p><strong>The hypothesis is violated by the standard model, not by a bad choice.</strong> Under Jordan\u2013Wigner, <code>\u03b3_{2j\u22121} = Z^{\u2297(j\u22121)} \u2297 X</code> and <code>\u03b3_{2j} = Z^{\u2297(j\u22121)} \u2297 Y</code> have the <em>same</em> permutation part \u2014 the flip of bit <code>j</code> \u2014 because <code>X</code> and <code>Y</code> are both monomial with that flip while <code>Z</code> is diagonal. So <code>\u03c0(\u03b3_{2j\u22121}\u03b3_{2j}) = 1</code> although <code>\u03b3_{2j\u22121}\u03b3_{2j} = \u00b1i Z_j</code> is not central. Every Jordan\u2013Wigner ordering pairs sites, so <code>\ud835\udcae \u2260 0</code> there by construction. This is a feature of Majoranas.</p>\n<h3>Why the constraint has teeth</h3>\n<p><code>G</code> acts transitively on <code>X</code>, so if <code>\ud835\udcae</code> contains a singleton it is everything and the permutation part retains no lamp information at all. At the other end <code>docs/PERFECT_CORE_KUN_THOM_WREATH.md</code> Theorem 1 gives <code>[A,G] = I_X</code>, so the augmentation kernel is the natural proper candidate; if <code>\ud835\udcae \u2287 I_X</code> then the induced map factors through <code>(A/I_X) \u22ca G \u2245 C\u2082 \u00d7 G</code> and is again lamp-blind. Both structurally available options make the permutation part useless, which means any hyperlinearity such a model witnesses is carried entirely by the fiber unitaries \u2014 returning the question to <code><a href=\"fiber-masa-free-cocycle.html\">fiber-masa-free-cocycle</a></code> one level up.</p>\n<p>The shape is the same as <code><a href=\"finite-quotient-blindness.html\">finite-quotient-blindness</a></code>, which forces <code>\u0393</code>'s image normal in every finite quotient and collapses the lamps to <code>G/\u27e8\u27e8\u0393\u27e9\u27e9</code>. Whether that is more than a coincidence of shape is not settled here and is not asserted.</p>\n<h3>Acceptance test</h3>\n<p>For any proposed block-monomial Clifford model, compute <code>\ud835\udcae</code>. If <code>\ud835\udcae = 0</code> the model does not exist. If <code>\ud835\udcae</code> is everything, the model may exist but proves nothing through its permutation part. Recorded for <code><a href=\"compressed-commutant-majorana.html\">compressed-commutant-majorana</a></code> and <code><a href=\"kun-thom-clifford-crossed-product-ce.html\">kun-thom-clifford-crossed-product-ce</a></code>, whose lane this constrains.</p>"}, {"id": "clopen-non-mf-cylinder", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Nonempty clopen cylinder of non-MF marked groups", "impact": 0, "frontier": false, "lock": null, "html": "<p>In the space of eight-generated marked groups, the locus satisfying the forty-one literal relators and the inequation <code>w != 1</code> is a nonempty clopen set, and every group in it is non-MF.</p>"}, {"id": "common-quotient-onto-normal-subgroup", "status": "ESTABLISHED", "root": false, "goal": false, "title": "A common quotient of two acylindrically hyperbolic groups onto a prescribed normal subgroup", "impact": 0, "frontier": false, "lock": null, "html": "<p>Let <code>G_1, G_2</code> be finitely generated acylindrically hyperbolic groups with trivial finite radical, let <code>D</code> be an <strong>infinite normal subgroup of <code>G_2</code></strong>, and let <code>F_i subset G_i</code> be finite.  Then there are <code>Q in AH_0</code> and surjections <code>alpha_i : G_i -&gt;&gt; Q</code> with</p>\n<p>1. <code>alpha_i|_{F_i}</code> injective; 2. <strong><code>alpha_2(D) = Q</code></strong> \u2014 the prescribed normal subgroup already surjects; 3. every finite-order element of <code>Q</code> lifts to one of the same order in <code>G_1 * G_2</code>, so <code>Q</code> is torsion-free when <code>G_1, G_2</code> are; 4. <code>Q</code> finitely presented when <code>G_1, G_2</code> are.</p>\n<p>Clause 2 is the whole content; without it this is [Hul16, Corollary 7.4]. The proof is Hull's, with the two elements generating his suitable subgroup drawn from <code>D</code> instead of from <code>G_2</code> \u2014 legitimate because an infinite normal subgroup of a torsion-free acylindrically hyperbolic group is suitable, which follows from [Osi16, Lemma 7.1] on s-normal subgroups.</p>\n<p>The reusable content: <strong>in Hull's machinery, the reservoir of small-cancellation target words may be confined to any prescribed infinite normal subgroup, at no cost.</strong>  Any construction that needs a common quotient to be normally generated by the image of a designated subgroup can take it from here, by feeding <code>D</code> the normal closure of that subgroup.</p>"}, {"id": "common-self-map-law", "status": "OPEN", "root": false, "goal": false, "title": "Common self-map law for the paired label spaces", "impact": 1, "frontier": false, "lock": null, "html": "<p>Extract from any admissible microstate a common classical mixture of whole equivariant self-maps on ONE source-sized paired label space, against which the Leavitt multiplication table can be tested. This is the gate the <code>1/36</code> (or <code>2\u2212\u221a3</code>) endpoint consumes.</p>\n<p>The rectangular escape (<a href=\"rectangular-escape.html\">rectangular-escape</a>) shows source-only measurability plus equivariance is insufficient: deterministic fully-equivariant maps evade the <code>1/36</code> theorem by enlarging their codomains.</p>"}, {"id": "commutant-density-trace-blind", "status": "ESTABLISHED", "root": false, "goal": false, "title": "The normalized commutant density is a character invariant, and vanishes on regular-character models", "impact": 0, "frontier": false, "lock": null, "html": "<p>Let <code>Gamma</code> be finitely generated, infinite, with property <code>(T)</code>, and let <code>(mu_j)</code> be a Kazhdan sequence.  For <code>rho:Gamma-&gt;U(d)</code> put</p>\n<pre>\nD_j(rho)=sum_gamma mu_j(gamma)|tr_d(rho(gamma))|^2.\n</pre>\n<p>For a genuine representation <code>lim_j D_j(rho)=dim(rho(Gamma)')/d^2</code>, because <code>Tr(Ad rho(gamma))=|Tr rho(gamma)|^2</code>.  For normalized-Hilbert--Schmidt asymptotic representations the densities of <code>Gamma</code> and of <code>t Gamma t^(-1)</code> differ by at most twice the multiplicative defect on the window, hence agree in the limit; and if the limit character is supported at the identity \u2014 the canonical trace of <code>Cl(X) crossed_product G</code>, of <code>L(W)</code>, or of any free-lamp model over the regular character \u2014 the density is <code>0</code>, since <code>mu_j(1)-&gt;0</code> for infinite <code>Gamma</code>.</p>\n<p>So the isotropy/orbit counting behind Kun--Thom Theorem 4.1 and its exact-representation form <code><a href=\"commutant-no-growth.html\">commutant-no-growth</a></code> degenerate in the tracial ultraproduct to <code>0=0</code>.  The surviving II_1 substitute is the Pimsner--Popa index, which is not normalized.</p>\n<p>Two qualifications, since this is a negative statement about a method and should be read weakly.  The conjugation-invariance half is unconditional; the <strong>vanishing half is conditional</strong> on the character being supported at the identity, which is why the title says so.  And the limit computed is the <strong>iterated</strong> one, <code>lim_j lim_n</code>, with no uniformity in <code>j</code> claimed: enough to deny the counting method its comparison, not enough to use the density as an invariant in its own right.</p>"}, {"id": "commutant-no-growth", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Commutants do not grow under genuine f.d. representations", "impact": 0, "frontier": false, "lock": null, "html": "<p><code>commutant_no_growth</code> (formalized). For a genuine finite-dimensional representation, an endomorphism commuting with <code>\u03c0(t\u0393t\u207b\u00b9)</code> already commutes with <code>\u03c0(\u0393)</code> \u2014 the fixed-space collapse applied to the adjoint representation, since <code>\u03c0(\u0393)\u2032 = Fix(Ad \u03c0|_\u0393)</code>. The load-bearing algebraic step of the flexible-stability reduction <a href=\"rigidity-route.html\">rigidity-route</a>.</p>"}, {"id": "commutant-projection-extraction", "status": "OPEN", "root": false, "goal": false, "title": "Corner-invisible central unitaries in a matrix corona are trivial", "impact": 1, "frontier": true, "lock": null, "html": "<p>Let <code>Q</code> be a norm matrix corona, <code>H</code> a countable group, <code>Theta: H -&gt; U(Q)</code> a homomorphism, <code>B = Theta(H)' cap Q</code> the relative commutant, and <code>eps in Z(H)</code>.  Suppose</p>\n<p>\u2016q Theta(eps) q - q\u2016_2 = 0   for every nonzero projection q in B,</p>\n<p>each corner being given its own normalized trace.  Then <code>Theta(eps) = 1</code>.</p>\n<p>Equivalently (contrapositive, after a bump function): if <code>\u2016Theta(eps) - 1\u2016 &gt;= delta &gt; 0</code>, then there are a nonzero projection <code>q in B</code> and <code>lambda in sp(Theta(eps))</code> with <code>|lambda - 1| &gt;= delta</code> and <code>\u2016(Theta(eps) - lambda) q\u2016</code> as small as one wishes.</p>\n<p>This is the decisive sub-claim for a torsion-free mechanism.  Granting it, <code><a href=\"corona-corner-detection-criterion.html\">corona-corner-detection-criterion</a></code> clause 3 kills a central defect square of <strong>any</strong> order, and the Kazhdan--Clifford architecture needs only a torsion-free group carrying an infinite-order central mark (<code><a href=\"infinite-order-central-mark-group.html\">infinite-order-central-mark-group</a></code>).</p>\n<h3>Ideas</h3>\n<p><strong>Known cases.</strong>  True when <code>Theta(eps)</code> has finite spectrum \u2014 in particular when <code>eps</code> has finite order, which is the existing theorem \u2014 and more generally whenever <code>sp(Theta(eps))</code> is disconnected, since then the separating projection already lies in <code>C*(Theta(eps)) &lt;= B</code>.  True also, with no spectral hypothesis whatever, when <code>eps</code> lies in a <strong>normal property-(T) subgroup</strong> of the ambient group: the Kazhdan fixed-space projection of that subgroup is the required commutant projection, and normality is exactly what makes it invariant under the ambient image (<code><a href=\"normal-kazhdan-defect-non-mf.html\">normal-kazhdan-defect-non-mf</a></code>, machine-checked).  That case does not cover a central mark on its own, since the cyclic group it generates is amenable and never Kazhdan \u2014 but it does cover a mark sitting inside a larger normal Kazhdan subgroup, and it is why the root's primary route no longer runs through this claim at all.  By <code><a href=\"corona-corner-detection-criterion.html\">corona-corner-detection-criterion</a></code> clause 2 the only surviving configuration is <code>sp(Theta(eps))</code> a connected arc through <code>1</code>, or the whole circle, with all trace mass at <code>1</code>.  So the question is exactly: <em>can a central unitary carry an operator-norm defect on a set of vanishing normalized rank whose phase varies continuously down to <code>1</code>?</em></p>\n<p><strong>Why the naive models do not settle it.</strong>  Two families must be beaten, and each is beaten by a different projection.</p>\n<ul>\n<li><em>Block model.</em>  <code>eps_n = 1_{d_n - m_n} oplus C_{m_n}</code> with <code>C_m</code> the</li>\n<p>clock unitary of order <code>m</code>, <code>m_n -&gt; infinity</code>, <code>m_n / d_n -&gt; 0</code>.  Here <code>eps</code> has infinite order, is at operator distance <code>2</code> from <code>1</code>, and is HS-invisible; the spectrum is a dense subset of the circle, so no spectral cut exists inside <code>C*(Theta(eps))</code>.  But the block projection <code>1_{m_n}</code> commutes with everything that commutes with <code>eps_n</code> blockwise and detects <code>eps</code> (its corner distribution is the uniform measure on <code>mu_{m_n}</code>).  So this model is not a counterexample \u2014 it shows only that the projection must be sought in <code>B</code>, not in <code>C*(Theta(eps))</code>.</p>\n<li><em>Continuous-phase model.</em>  <code>eps_n = diag(e^{i theta_j})</code> with</li>\n<p><code>theta_j = f_n(j/d_n)</code>, <code>f_n</code> vanishing on <code>[0, 1 - delta_n]</code> and rising to <code>pi</code>, with <code>delta_n -&gt; 0</code> and <code>delta_n d_n -&gt; infinity</code>; pair it with the cyclic shift <code>S_n</code>, which commutes with <code>eps_n</code> asymptotically because consecutive phase increments are <code>O(1/(delta_n d_n))</code>.  This is HS-invisible, at operator distance <code>2</code> from <code>1</code>, and every arc cut of <code>eps_n</code> fails to commute with <code>S_n</code> (a hard cut of an interval of positions has commutator norm <code>1</code> with the shift).  <strong>This model has now been resolved, and it is not a counterexample.</strong>  Take <code>d_n = n^2</code>, <code>delta_n = 1/n</code>, so the phase rises from <code>0</code> to <code>pi</code> across the last <code>n</code> positions in increments <code>pi/n</code>.  Fix <code>lambda = e^{i pi / 2}</code>, let <code>j_0</code> be a position where the phase is <code>pi/2</code>, and let <code>psi_n</code> be a smooth <code>l^2</code>- normalized bump of width <code>L_n = sqrt(n)</code> centred at <code>j_0</code>.  Then the phase varies by <code>L_n \u00b7 pi/n = pi/sqrt(n)</code> across the bump, so <code>\u2016(eps_n - lambda) psi_n\u2016 -&gt; 0</code>; and a smooth bump of width <code>L</code> satisfies <code>\u2016S_n psi_n - psi_n\u2016 = O(1/L_n) -&gt; 0</code>, so the rank-one projection <code>q_n = |psi_n&gt;&lt;psi_n|</code> satisfies <code>\u2016[q_n, S_n]\u2016 -&gt; 0</code>.  In the ultraproduct <code>q</code> is a nonzero projection of the relative commutant with <code>eps q = lambda q</code> and <code>lambda != 1</code>: the corner exists.  So the sharpest test case falls on the side of the claim.</p>\n</ul>\n<p><strong>But the technique that resolved it is unavailable here.</strong>  The wave packet is an approximate joint eigenvector, and the projection onto it has rank one.  By <code><a href=\"bounded-rank-corners-excluded.html\">bounded-rank-corners-excluded</a></code>, a rank-one corner detecting the mark forces a one-dimensional representation of the Kazhdan source, so it cannot exist when that source is perfect; and no bounded-rank corner exists when the source is minimally almost periodic, as the repository's <code>St_5(L)</code> is.  The shift model escapes only because its group is abelian and has characters to spare.  So a witness for this claim must have unbounded rank while carrying no Kazhdan-invariant vectors and, by transport, zero trace \u2014 which is a demanding combination, and is the sharpest current reason to suspect the claim may fail for Kazhdan sources.  Anyone attacking it should decide first whether to look for such a corner or for a counterexample, because the two searches now have different shapes.</p>\n<p><strong>Reduction to real rank zero of a relative commutant.</strong>  This is the sharpest form of the question, and the recommended next work unit.  Fix a free ultrafilter and work in <code>A_omega = prod_omega M_{d_n}</code>, a quotient of <code>Q</code>; corners of <code>A_omega</code> by projections are again norm ultraproducts of matrix algebras, so the manuscript's transport applies in them verbatim. Put <code>B_omega = tilde U(H)' cap A_omega</code>, which contains <code>tilde U(eps)</code>. Then it suffices that</p>\n<p>her_{B_omega}(f(tilde U(eps)))  contains a nonzero projection</p>\n<p>for a continuous bump <code>f</code> supported on an arc around a spectral point <code>lambda != 1</code>: if <code>q</code> is such a projection and <code>g</code> is continuous with <code>g f = f</code>, then <code>g(tilde U(eps)) q = q</code>, so <code>\u2016(tilde U(eps) - lambda) q\u2016</code> is at most the width of the arc, and clause 3 of <code><a href=\"corona-corner-detection-criterion.html\">corona-corner-detection-criterion</a></code> fires in the corner <code>q A_omega q</code>. In particular <strong>real rank zero of the relative commutant <code>B_omega</code> implies the claim</strong>.  Two remarks on the shape of an answer:</p>\n<ul>\n<li><code>A_omega</code> itself has real rank zero \u2014 invertible self-adjoint</li>\n<p>approximation in <code>M_d</code> has a modulus independent of <code>d</code>, so the property passes to norm ultraproducts \u2014 and it is countably saturated, as is <code>B_omega</code> for countable <code>H</code>.  Countable saturation alone does not give real rank zero (ultrapowers of <code>C([0,1])</code> are countably saturated and projectionless in the relevant sense), so the question is genuinely about what a relative commutant inside a matrix ultraproduct can look like.</p>\n<li>Alternatively, a maximal abelian subalgebra <code>M</code> of <code>B_omega</code> containing</li>\n<p><code>tilde U(eps)</code> suffices if <code>M</code> is a commutative AW*-algebra: then <code>M = C(X)</code> with <code>X</code> extremally disconnected, the closure of <code>{|eps - lambda| &lt; eta}</code> is clopen, and its characteristic function is the required projection.  Whether masas of a matrix norm ultraproduct are AW* is the question to settle first; it is elementary to state and does not mention groups.</p>\n</ul>\n<p>The (T) input is <em>not</em> what is missing here: the existing transport theorem already produces an exact projection <code>P = V P V^*</code> in a finite ultraproduct, but of the <em>adjoint</em> representation on Hilbert--Schmidt vectors, which is why it controls only the <code>2</code>-norm.  See <code><a href=\"coordinate-ultraproduct-transport.html\">coordinate-ultraproduct-transport</a></code> for what the same argument gives on the coordinate ultraproduct.</p>\n<p><strong>What must not be assumed.</strong>  Voiculescu's almost-commuting unitaries show that asymptotically commuting families need not admit any almost-invariant spectral cut; the pair <code>(clock, shift)</code> has nonzero Bott index and no nearby commuting pair.  Any proof must therefore use either the vanishing of the trace mass off <code>1</code> or the (T) input, not general position. <code><a href=\"matrix-corona-k1-vanishes.html\">matrix-corona-k1-vanishes</a></code> rules out an index-theoretic invariant of the mark alone.</p>"}, {"id": "commutator-compressor-carries-no-wall", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Commutator compressors carry no wall unless a factor has infinite growth", "impact": 0, "frontier": false, "lock": null, "html": "<p>If <code>a,b</code> and <code>s=[a,b]</code> all lie in <code>P_Gamma</code> and <code>lambda(a),lambda(b)</code> are finite, then <code>lambda(s)=1</code> and there is no relative wall for the compressor <code>s</code>.  Reason: <code>ab=s b a</code> is one element with two factorizations inside <code>P_Gamma</code>, and a multiplicative invariant with values in an abelian monoid cannot survive the cancellation.</p>\n<p>For the explicit Kun--Thom Theorem E pair <code>Gamma=EL_r(F_q[x_1..x_d]) &lt; G=EL_r(F_q[x^(+-1)]) semidirect SL_d(Z)</code> (<code>r,d&gt;=3</code>), every nonnegative matrix in <code>SL_d(Z)</code> is a compressor, so the positive elementary transvections <code>u_(ij)(c)=I+c e_(ij)</code> lie in <code>P_Gamma</code> and satisfy <code>[u_(ik)(a),u_(kj)(b)]=u_(ij)(ab)</code>.  This repository's explicit compressor is <code>t=t_(u_12)</code> with ring image <code>F_q[x_1,x_1x_2,x_3,...,x_d]</code>, and <code>u_12=[u_13,u_32]</code>.  Hence a wall there forces <code>lambda(u_13)=infinity</code> or <code>lambda(u_32)=infinity</code>; and if every positive elementary transvection has finite growth index then all have index <code>1</code> and no compressor in the monoid they generate carries a wall.</p>\n<p>This is the substitute for the Ore argument refuted by <code>FALSE_COMPRESSION_SEMIGROUP_ORE_NO_GO.md</code>: the compressor semigroup has no fractions, but it does have commutators.</p>"}, {"id": "commuting-lamp-defect-survives", "status": "ESTABLISHED", "root": false, "goal": false, "title": "The unsquared compression defect survives the commuting-lamp quotient", "impact": 4, "frontier": false, "lock": null, "html": "<p>Under the composite <code>E -&gt; W -&gt; W/&lt;zeta&gt;</code>, the element <code>u = [t c t^-1, v_1]</code> has nontrivial image.</p>"}, {"id": "commuting-lamp-quotient-finite-residual", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Exact finite residual of the commuting-lamp quotient", "impact": 1, "frontier": false, "lock": null, "html": "<p>The finite residual of <code>W/&lt;zeta&gt; = F_2[X] semidirect V</code> is exactly</p>\n<pre>\nL_0 = { lamp configurations with an even number of lamps on each level },\n</pre>\n<p>the kernel of the level-parity map <code>F_2[X] -&gt; sum_{n in Z} F_2</code>.  The quotient <code>(W/&lt;zeta&gt;)/L_0 = (sum_{n in Z} F_2) semidirect V</code>, with <code>V</code> acting through its level homomorphism, is residually finite, hence LEF, hence MF.</p>\n<p>So the entire failure of residual finiteness is a locally finite elementary abelian <code>2</code>-group inside the lamp kernel, and the surviving defect <code>ubar</code> lies in it.</p>"}, {"id": "commuting-lamp-quotient-mf", "status": "OPEN", "root": false, "goal": false, "title": "MF property of the commuting-lamp witness quotient", "impact": 1, "frontier": true, "lock": "cairn-quotient-mf", "html": "<p>For the Clifford witness <code>W</code> and its central sign <code>zeta</code>, the quotient <code>W/&lt;zeta&gt;</code> is MF in the norm-matrix-corona sense.</p>\n<h3>Ideas</h3>\n<p><strong>What the group is.</strong>  <code><a href=\"commuting-lamp-quotient-structure.html\">commuting-lamp-quotient-structure</a></code>: <code>W/&lt;zeta&gt; = F_2[X] semidirect V</code> is the permutational wreath product <code>F_2 wr_{V/Gbar} V</code>, with site set <code>X = Z x (Z[1/2]/Z)^3</code>, the shift <code>tau</code> translating the level coordinate, and the affine group acting <code>2^n</code> times finer at level <code>n</code>.  The surviving defect is the two-lamp configuration <code>ubar = e_{(1,0)} + e_{(1,e_1/2)}</code>, a single element of the lamp kernel.</p>\n<p><strong>Routes that are closed.</strong></p>\n<ul>\n<li><em>Residual finiteness and LEF.</em>  Dead, <code><a href=\"marked-quotients-not-lef.html\">marked-quotients-not-lef</a></code>: a local</li>\n<p>embedding into a finite group uncompresses the represented base and kills <code>ubar</code>.  This is the <code>Nat.card</code> instance of <code><a href=\"invariant-size-collapse.html\">invariant-size-collapse</a></code>, and it also closes local finiteness and every consequence of <code>isWeakMF_of_isLEF</code>.</p>\n<li><em>Partial finite separation.</em>  Dead in the strongest form,</li>\n<p><code><a href=\"commuting-lamp-quotient-finite-residual.html\">commuting-lamp-quotient-finite-residual</a></code>: the finite residual is exactly the level-even lamp subgroup <code>L_0</code>, so finite quotients see nothing of it. What they do see is everything else \u2014 <code>(W/&lt;zeta&gt;)/L_0</code> is residually finite \u2014 so the entire problem is the module <code>L_0</code>, and <code>Rad_MF(W/&lt;zeta&gt;)</code> is a <code>V</code>-submodule of it.</p>\n<li><em>Amenability plus Tikuisis--White--Winter.</em>  Unavailable: <code>Gbar</code> has (T).</li>\n<p>This is exactly what separates the present claim from <code><a href=\"cyclic-base-sharpness.html\">cyclic-base-sharpness</a></code>, where the corresponding quotient is neither residually finite nor LEF and is MF anyway, by amenability.</p>\n<li><em>Permanence for <code>Z</code>-extensions.</em>  Dead,</li>\n<p><code><a href=\"mf-not-closed-under-integer-extensions.html\">mf-not-closed-under-integer-extensions</a></code>: <code>W/&lt;zeta&gt;</code> and <code>W</code> are both <code>Z</code>-extensions of LEF groups (<code><a href=\"lamp-telescope-base-is-lef.html\">lamp-telescope-base-is-lef</a></code>), and <code>W</code> is not MF.  So the operator-norm analogue of Elek--Szabo is false and no permanence theorem that cannot see the central sign can prove this claim.</p>\n</ul>\n<p><strong>What a proof must produce.</strong>  By <code><a href=\"corona-hs-radical-is-finite-residual.html\">corona-hs-radical-is-finite-residual</a></code>, every corona representation of <code>W/&lt;zeta&gt;</code> is Hilbert--Schmidt blind on all of <code>L_0</code>.  So a faithful model must send each element of <code>L_0</code> to a symmetry <code>1 - 2p</code> with <code>p</code> a nonzero projection of vanishing normalized rank, and must represent the compression relations to operator-norm <code>o(1)</code> while <em>not</em> normalizing the represented base.  Equivalently, <code><a href=\"corona-commutant-no-growth.html\">corona-commutant-no-growth</a></code> must fail.</p>\n<p><strong>Direction of belief.</strong>  Undecided, and the note records no evidence strong enough to guess.  The one structural hint on the positive side: the central sign is exactly the obstruction to closing the expanding level tower, and it is trivial here; the one hint on the negative side is that all three categories where the question can currently be asked give collapse.</p>\n<p><strong>The hinge is exact.</strong>  <code><a href=\"marked-quotient-mf-forces-commutant-growth.html\">marked-quotient-mf-forces-commutant-growth</a></code>: an injective corona representation of this group puts the lamp <code>Theta(c_{tau o})</code> in <code>Theta(abar(Gbar))' cap Q</code> but not in <code>Theta(Gbar)' cap Q</code>, so MF here <em>requires</em> operator-norm commutant growth at the compressor, and <code><a href=\"corona-commutant-no-growth.html\">corona-commutant-no-growth</a></code> refutes it.  The two directions together make that claim an exact hinge.  It also covers the Kun--Thom commuting-lamp wreath (<code><a href=\"kun-thom-wreath-weak-mf.html\">kun-thom-wreath-weak-mf</a></code>), which is this same question for a different Kazhdan pair.</p>\n<p><strong>Best next unit.</strong>  <code><a href=\"corona-commutant-no-growth.html\">corona-commutant-no-growth</a></code> \u2014 decide whether the operator-norm relative commutant of a corona-represented Kazhdan group can grow under a compression implemented inside the represented group.  A proof refutes this claim, <code><a href=\"literal-mark-quotient-mf.html\">literal-mark-quotient-mf</a></code> and <code><a href=\"kun-thom-wreath-weak-mf.html\">kun-thom-wreath-weak-mf</a></code> at once; a counterexample is very close to proving this one.</p>"}, {"id": "commuting-lamp-quotient-structure", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Structure of the commuting-lamp quotient", "impact": 2, "frontier": false, "lock": null, "html": "<p><code>W/&lt;zeta&gt;</code> is the permutational wreath product <code>F_2 wr_{V/Gbar} V</code>, that is <code>F_2[X] semidirect V</code> with <code>V</code> permuting the basis <code>X = V/Gbar</code>.  As a <code>V</code>-set,</p>\n<pre>\nX = Z x (Z[1/2]/Z)^3,\ntau . (n,y) = (n+1, y),\n(v,A) . (n,y) = (n, 2^{-n} v + A y)   for (v,A) in T = Z[1/2]^3 sd SL_3(Z),\n</pre>\n<p>with root <code>o = (0,0)</code>, <code>tau o = (1,0)</code>, <code>v_1 tau o = (1, e_1/2)</code>, and the level map <code>X -&gt; Z</code> equal to the <code>tau</code>-exponent.  The <code>T</code>-orbits on <code>X</code> are exactly the levels; every <code>Gbar_k</code>-orbit is finite.  The surviving defect is the two-lamp configuration <code>ubar = e_{(1,0)} + e_{(1,e_1/2)}</code>.</p>"}, {"id": "compressed-commutant-majorana", "status": "OPEN", "root": false, "goal": false, "title": "A Majorana in the compressed relative commutant moved anticommutingly by Gamma", "impact": 1, "frontier": false, "lock": null, "html": "<p>Find a Connes-embeddable finite tracial von Neumann algebra <code>M</code>, a homomorphism <code>pi:G-&gt;U(M)</code>, an element <code>gamma in Gamma</code>, and a self-adjoint involution</p>\n<pre>\nw in M cap pi(t Gamma t^(-1))&#x27;\n</pre>\n<p>such that <code>w</code> anticommutes with <code>pi(gamma) w pi(gamma)^*</code>.</p>\n<p>The compressor <code>t</code> enters only through the subgroup <code>Gamma_1=t Gamma t^(-1)</code>, whose <code>Gamma</code>-coset space is the orbit <code>Gamma/Gamma_1</code> of the distinguished site.  By <code><a href=\"commutator-compressor-carries-no-wall.html\">commutator-compressor-carries-no-wall</a></code> the resulting commutant growth must have infinite index at some positive elementary transvection compressor, so <code>w</code> cannot be a finite lamp over a finite orbit.  The model-side mechanism is available: <code><a href=\"compressor-fixed-site-growth-infinite.html\">compressor-fixed-site-growth-infinite</a></code> shows both candidate compressors gain infinitely many <code>Gamma</code>-fixed sites, for every invariant graph.</p>\n<
