 Theorem 4.1: the scout's PDF read, a 2026-08-08 fetch recorded in <code>docs/NOTEPAD.md</code>, and a 2026-08-14 fetch of the abstract page together with <code>arxiv.org/html/2608.06222v1</code>. Full verbatim transcription, with provenance and trust surface, is in the artifact.</p>\n<h3>The wreath candidate, pinned</h3>\n<p>The scout's two gaps were both gaps of <em>identification</em>, and identification was impossible because the graph had never given the candidate a formula: no <code>research/*.md</code> file and no section of <code>docs/OBSTRUCTIONS.md</code> defines it. It is fixed here, in the form the rest of the corpus already uses (<code>docs/COMMUTING_WREATH_SOFIC_RADICAL.md</code>, <code>docs/PERFECT_CORE_KUN_THOM_WREATH.md</code>, <code>docs/UNIQUE_TRACE_KUN_THOM_DOUBLE.md</code>), which is Kun--Thom's Theorem E pair verbatim. Let <code>q</code> be a prime power and <code>r, d \u2265 3</code>; put</p>\n<p>R\u208a = \ud835\udd3d_q[x\u2081,\u2026,x_d],   R = \ud835\udd3d_q[x\u2081^{\u00b11},\u2026,x_d^{\u00b11}],</p>\n<p>with <code>SL_d(\u2124)</code> acting on <code>R</code> by monomial substitutions, and set</p>\n<p>\u0393 = EL_r(R\u208a),    G = EL_r(R) \u22ca SL_d(\u2124).</p>\n<p>The <strong>wreath candidate</strong> is</p>\n<p>W = (\u2295_{G/\u0393} \u2124/2\u2124) \u22ca G = (\u2124/2\u2124) \u2240_{G/\u0393} G,</p>\n<p>the generalized (permutational) wreath product of <code>\u2124/2\u2124</code> over the coset space <code>G/\u0393</code>. The corpus's running instance is <code>q = 2</code>. The explicit compressor is <code>t = u\u2081\u2082 \u2208 SL_d(\u2124)</code>, i.e. the substitution <code>x\u2082 \u21a6 x\u2081x\u2082</code>, with <code>t\u0393t\u207b\u00b9 = EL_r(\ud835\udd3d_q[x\u2081, x\u2081x\u2082, x\u2083,\u2026,x_d]) \u228a \u0393</code> of infinite index.</p>\n<p>With that definition both gaps close by inspection rather than by argument: the lamp is <code>\u2124/2\u2124</code>, and the pair is Theorem E's pair, so Theorem E supplies infranormality, non-normality and (T) on both sides. The scout's caution about <code>\u2124</code> lamps is correct and is preserved below as a scope boundary \u2014 it applies to a <em>different</em> node, not to this one.</p>\n<p><strong>Notation discipline.</strong> Throughout this graph <code>G</code> is the <em>acting</em> group above and <code>W</code> is the wreath product. <code>docs/OBSTRUCTIONS.md</code> \u00a75 uses <code>G</code> in that sense (\"If <code>G</code> is flexibly HS-stable then the wreath candidate is not hyperlinear\"). <code>research/<a href=\"wreath-flexible-hs-stability.html\">wreath-flexible-hs-stability</a>.md</code> currently reuses the letter <code>G</code> for the wreath itself; that node is owned elsewhere, but the two readings are not interchangeable and the rigidity route needs the acting-group reading.</p>\n<h3>Variants that are NOT this group</h3>\n<p>Four neighbours in the corpus are close enough to be confused with <code>W</code> and are <strong>not</strong> covered by the citation:</p>\n<ul>\n<li>the perfect index-two core <code>P\u2082 = I_X \u22ca G</code>, <code>I_X = ker(\u03b5 : \u2295_X \ud835\udd3d\u2082 \u2192 \ud835\udd3d\u2082)</code>,</li>\n<p>which is <code>[W,W]</code> (<code>docs/PERFECT_CORE_KUN_THOM_WREATH.md</code>);</p>\n<li>the Clifford central cover <code>H_Cl = C(X) \u22ca G</code> with anticommuting lamps, whose</li>\n<p>central quotient is <code>W</code>;</p>\n<li>the <strong>split integral wreath candidate</strong> <code>W_Y = \u2124^{(Y)} \u22ca Q</code> with</li>\n<p><code>Q = G *_N G</code>, <code>N = \u27e8\u27e8\u0393\u27e9\u27e9_G</code>, <code>Y = Q/\u0393</code> \u2014 a different lamp (<code>\u2124</code>, not <code>\u2124/2</code>) over a different index set (<code>Q/\u0393</code>, not <code>G/\u0393</code>). This is the group the scout's first gap is about, and nonsoficity for it does <strong>not</strong> follow from Theorem A: soficity does not pass to quotients in the needed direction, so the lamp surjection <code>\u2124 \u21a0 \u2124/2</code> transports nothing;</p>\n<li>the free-lamp group <code>H_K = G *_\u0393 (\u0393 \u00d7 K)</code>, an amalgam, not a wreath product.</li>\n</ul>\n<h3>Why the claim is not a rewrite of the compression no-gos</h3>\n<p>Nonsoficity of <code>W</code> is <em>not</em> derived from the compression\u2013centralizer criterion formalized in this repository. That criterion (<code>Criterion/CriterionAssembly.not_isSofic_of_not_isLEF</code>, which requires a <code>CompressionSetup G \u0393 J</code>, property (T) at both <code>G</code> and <code>\u0393</code>, and a non-LEF commuting witness <code>J</code>) is instantiated only at elementary/GL/unit groups over Leavitt algebras \u2014 its universal witness is <code>EL\u2084(L_{\ud835\udd3d\u2082}(1,2))</code> = <code>UniversalRankFour.Ambient</code>, and its general form is <code>Leavitt/GeneralCornerTheorem.corner_not_isSofic</code> for <code>EL_{m+1}(R)</code>. No wreath product, lamplighter, free-lamp amalgam or Kun--Thom candidate is proved nonsofic anywhere under <code>GroupApproximation/</code>; the wreath material there (<code>Sofic/MonomialModel.wreathPerm</code> and friends) is finite-model gadgetry plus explicit no-gos about proof routes. The mechanism is the same family; the theorem is not, and the substitution would have been exactly the kind of group-mismatch the doctrine exists to prevent.</p>"}], "links": [{"route": "bounded-rank-corners-excluded-proof", "target": "bounded-rank-corners-excluded", "title": "A bounded-rank corner is a genuine finite-dimensional representation", "dead": false, "source": "coordinate-ultraproduct-transport"}, {"route": "central-sign-from-kazhdan-transport", "target": "central-sign-corona-obstruction", "title": "Derive the central-sign obstruction from Kazhdan transport", "dead": false, "source": "kazhdan-asymptotic-commutant-transport"}, {"route": "clifford-ce-gives-bare-wall", "target": "bare-relative-wall-exists", "title": "The Clifford crossed product already contains the bare wall", "dead": false, "source": "kun-thom-clifford-crossed-product-ce"}, {"route": "clifford-diagonal-lamp-subspace-proof", "target": "clifford-diagonal-lamp-subspace", "title": "A trivial diagonal lamp subspace would embed W in a permutation ultraproduct", "dead": false, "source": "wreath-not-sofic"}, {"route": "clopen-cylinder-from-horn-obstruction", "target": "clopen-non-mf-cylinder", "title": "Turn the finite Horn obstruction into a marked-group cylinder", "dead": false, "source": "mf-universal-horn-obstruction"}, {"route": "cocycle-stability-nonsofic-route", "target": "nonsofic-hyperbolic-group", "title": "Build a nonsofic hyperbolic group from cocycle stability of random complexes", "dead": false, "source": "random-complex-linear-cocycle-stability"}, {"route": "corner-visibility-gives-rate-profile", "target": "mf-trace-gap-defect-ratio-models", "title": "Bounded trace gap makes the rate profile automatic", "dead": false, "source": "mf-invariant-corner-visibility"}, {"route": "corona-corner-detection-criterion-proof", "target": "corona-corner-detection-criterion", "title": "Run transport inside an arbitrary commutant corner and cut the spectrum", "dead": false, "source": "kazhdan-asymptotic-commutant-transport"}, {"route": "exact-group-algebra-from-witness", "target": "exact-stably-finite-non-mf-reduced-group-algebra", "title": "Combine exact extension permanence with the non-MF witness", "dead": false, "source": "sofic-non-mf-witness"}, {"route": "finite-normal-compression-obstruction-proof", "target": "finite-normal-compression-obstruction", "title": "Transport all compressors and cancel in a finite normal subgroup", "dead": false, "source": "kazhdan-asymptotic-commutant-transport"}, {"route": "finite-traced-kazhdan-transport-proof", "target": "finite-traced-kazhdan-transport", "title": "Kazhdan projection in the conjugation algebra of the tracial ultraproduct", "dead": false, "source": "faithfully-traced-uni n-hs"}, {"route": "kt-pair-non-hyperlinear-rigidity", "target": "non-hyperlinear-group", "title": "Refute hyperlinearity of the Kun\u2013Thom wreath group by a rigidity theorem", "dead": false, "source": "invariant-cartan-completion"}, {"route": "kun-thom-clifford-extension-not-weak-mf-via-central-sign", "target": "kun-thom-clifford-extension-not-weak-mf", "title": "Recognize the Clifford sign as a displaced-lamp commutator square", "dead": false, "source": "central-sign-corona-obstruction"}, {"route": "lamp-character-orbit-separation-proof", "target": "lamp-character-orbit-separation", "title": "Split the cone along the lamp kernel and apply Clifford's theorem", "dead": false, "source": "hilbert-embeddable-is-representation-realized"}, {"route": "lef-implies-operator-mf-proof", "target": "lef-implies-operator-mf", "title": "Run the locally-finite MF argument on local embeddings", "dead": false, "source": "countable-group-mf-conventions"}, {"route": "literal-lamp-kernel-clifford-block-amalgam-proof", "target": "literal-lamp-kernel-clifford-block-amalgam", "title": "Compute the orbital graph of the marked pair and read off the amalgam", "dead": false, "source": "literal-telescope-split-normal-form"}, {"route": "literal-no-faithful-corona-subalgebra-representation-proof", "target": "literal-no-faithful-corona-subalgebra-representation", "title": "Complement-correct a nonunital corona inclusion", "dead": false, "source": "literal-central-mark-corona-invisible"}, {"route": "literal-reduced-group-algebra-proof", "target": "literal-stably-finite-non-mf-reduced-group-algebra", "title": "Pass the literal group obstruction to its reduced C-star algebra", "dead": false, "source": "literal-central-mark-corona-invisible"}, {"route": "literal-sofic-via-block-tower", "target": "literal-group-sofic", "title": "Sofic core plus amenable stable letter proves the literal group sofic", "dead": false, "source": "literal-telescope-core-lef"}, {"route": "literal-telescope-split-normal-for const panel=document.getElementById('panel');
const pbody=document.getElementById('panelbody');
const esc=t=>{const d=document.createElement('i');d.textContent=t;return d.innerHTML};
const openPanel=()=>panel.classList.add('open');
const closePanel=()=>panel.classList.remove('open');
document.getElementById('closepanel').onclick=closePanel;
function frontierHome(){
 let h='';
 const goals=DATA.claims.filter(c=>c.goal);
 if(goals.length){
  h+='<h3 class="sec">Goals</h3><ul class="fr">';
  for(const c of goals)
   h+=`<li data-id="${c.id}"><span class="chip ${c.status}">${c.status}</span> ${esc(c.title)}<br><span class="imp">${c.id}</span></li>`;
  h+='</ul>';
 }
 h+='<h3 class="sec">Frontier</h3><ul class="fr">';
 for(const c of DATA.claims.filter(c=>c.frontier).sort((a,b)=>b.impact-a.impact))
  h+=`<li data-id="${c.id}">${esc(c.title)}<br><span class="imp">${c.id} &middot; ${c.impact} live route(s)${c.lock?' &middot; locked by '+esc(c.lock):''}</span></li>`;
 h+='</ul>';
 const lib=DATA.claims.filter(c=>c.status==='ESTABLISHED').sort((a,b)=>a.title.localeCompare(b.title));
 h+=`<details><summary>Library &mdash; ${lib.length} established</summary><ul class="fr">`;
 for(const c of lib)h+=`<li data-id="${c.id}">${esc(c.title)}<br><span class="imp">${c.id}</span></li>`;
 h+='</ul></details>';
 pbody.innerHTML=h;
 pbody.querySelectorAll('li').forEach(li=>li.onclick=()=>selectById(li.dataset.id));
 openPanel();
}
document.getElementById('frontierbtn').onclick=frontierHome;
let selectById=id=>{};
if(typeof d3==='undefined'){
 document.getElementById('view').outerHTML='<div style="padding:2em">d3 CDN unreachable &mdash; use <a href="nodes.html">all nodes</a>.</div>';
 frontierHome();
}else{
const nodes=[],links=[],byId={};
for(const c of DATA.claims){c.type='claim';nodes.push(c);byId[c.id]=c}
for(const l of DATA.links)links.push({source:l.source,target:l.target,kind:'arrow',route:l.route,dead:l.dead});
for(const j of DATA.junctions){
 const jn={id:'j:'+j.route,type:'junction',route:j.route,rtitle:j.title,
  requires:j.requires,tgt:j.target,dead:j.dead};
 nodes.push(jn);byId[jn.id]=jn;
 for(const q of j.requires)links.push({source:q,target:jn.id,kind:'in',dead:j.dead});
 links.push({source:jn.id,target:j.target,kind:'arrow',dead:j.dead});
}
for(const d of DATA.dead){
 const st={id:'x:'+d.route,type:'stub',route:d.route,rtitle:d.title,
  tgt:d.target,killers:d.killers,dead:true};
 nodes.push(st);byId[st.id]=st;
 links.push({source:st.id,target:d.target,kind:'arrow',dead:true});
 for(const k of d.killers)if(byId[k])links.push({source:k,target:st.id,kind:'kill',dead:true});
}
for(const a of DATA.affinity)links.push({source:a.a,target:a.b,kind:'aff',w:a.w});
const real=l=>l.kind!=='aff';
const svg=d3.select('#view'),W=svg.node().clientWidth,H=svg.node().clientHeight;
svg.append('defs').html('<marker id="m" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="7.5" markerHeight="7.5" orient="auto"><path d="M0,0L8,4L0,8z" fill="#7c8377"/></marker><marker id="mr" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="7.5" markerHeight="7.5" orient="auto"><path d="M0,0L8,4L0,8z" fill="#c0392b"/></marker>');
const g=svg.append('g');
svg.call(d3.zoom().scaleExtent([.25,3]).on('zoom',e=>g.attr('transform',e.transform)))
   .on('dblclick.zoom',null);
const linkForce=d3.forceLink(links).id(d=>d.id)
 .distance(l=>l.kind==='aff'?150:(l.kind==='in'?60:115))
 .strength(l=>l.kind==='aff'?.03+.1*l.w:.55);
const sim=d3.forceSimulation(nodes)
 .force('link',linkForce)
 .force('charge',d3.forceManyBody().strength(-430))
 .force('x',d3.forceX(W/2).strength(.06))
 .force('y',d3.forceY(H/2).strength(.09))
 .force('collide',d3.forceCollide(d=>d.type==='claim'?(d.goal?48:38):13));
const line=g.selectAll('line').data(links.filter(real)).join('line')
 .attr('class',l=>'lk'+(l.kind==='kill'?' kill':'')+(l.dead?' dead':''))
 .attr('marker-end',l=>l.kind==='in'?null:(l.dead||l.kind==='kill'?'url(#mr)':'url(#m)'));
const node=g.selectAll('g.n').data(nodes).join('g')
 .attr('class',d=>'n'+(d.dead?' deadbit':''))
 .style('cursor','pointer')
 .call(d3.drag()
   .on('start',(e,d)=>{if(!e.active)sim.alphaTarget(.25).restart();d.fx=d.x;d.fy=d.y})
   .on('drag',(e,d)=>{d.fx=e.x;d.fy=e.y})
   .on('end',(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null}));
node.filter(d=>d.type==='claim'&&d.goal).append('circle')
 .attr('r',23).attr('fill','none').attr('stroke','var(--goal)').attr('stroke-width',2.2);
node.filter(d=>d.type==='claim').append('circle')
 .attr('r',d=>d.goal?15:10+Math.min(d.impact*1.5,4))
 .attr('fill',d=>d.status==='ESTABLISHED'?'var(--est)':'#fff')
 .attr('stroke',d=>d.status==='ESTABLISHED'?'#0f6b47':'var(--open)')
 .attr('stroke-width',2.2);
node.filter(d=>d.type==='claim'&&d.goal).append('text')
 .attr('text-anchor','middle').attr('dy',-31)
 .style('fill','var(--goal)').style('font-weight','700')
 .style('letter-spacing','.2em').text('GOAL');
node.filter(d=>d.type==='junction').append('rect')
 .attr('x',-6).attr('y',-6).attr('width',12).attr('height',12)
 .attr('fill',d=>d.dead?'var(--dead)':'#9a9e94');
node.filter(d=>d.type==='junction').append('text')
 .attr('text-anchor','middle').attr('dy',3.5)
 .style('fill','#fff').style('font-size','9px').text('∧');
node.filter(d=>d.type==='stub').append('circle')
 .attr('r',6.5).attr('fill','#fff').attr('stroke','var(--dead)')
 .attr('stroke-width',1.7).attr('stroke-dasharray','3 2');
node.filter(d=>d.type==='claim').each(function(d){
 let l1='',l2='';
 for(const w of d.title.split(' ')){
  if(!l2&&(l1+' '+w).trim().length<=26)l1=(l1+' '+w).trim();
  else l2=(l2+' '+w).trim();
 }
 if(l2.length>28)l2=l2.slice(0,27)+'\u2026';
 const txt=d3.select(this).append('text').attr('text-anchor','middle');
 txt.append('tspan').attr('x',0).attr('dy',d.goal?36:27).text(l1);
 if(l2)txt.append('tspan').attr('x',0).attr('dy',11).text(l2);
});
node.append('title').text(d=>d.type==='claim'?`${d.id} [${d.status}]`:(d.rtitle||d.route));
function neighbors(d){
 const keep=new Set([d.id]);
 links.filter(real).forEach(l=>{if(l.source.id===d.id)keep.add(l.target.id);
   if(l.target.id===d.id)keep.add(l.source.id)});
 node.classed('dim',n=>!keep.has(n.id));
 line.classed('dim',l=>l.source.id!==d.id&&l.target.id!==d.id);
}
node.on('mouseenter',(e,d)=>neighbors(d))
 .on('mouseleave',()=>{node.classed('dim',false);line.classed('dim',false)});
function show(d){
 if(d.type==='claim'){
  pbody.innerHTML=`${d.goal?'<span class="chip goal">GOAL</span> ':''}<span class="chip ${d.status}">${d.status}</span>
   <h2>${esc(d.title)}</h2><code>${d.id}</code>
   ${d.lock?`<p class="hint">locked by ${esc(d.lock)}</p>`:''}
   <div class="stmt">${d.html||'(no statement)'}</div>
   <p><a class="open-page" href="${d.id}.html">open page &#8594;</a></p>`;
 }else{
  const imp=(d.requires&&d.requires.length?d.requires.join(' \u2227 '):'\u22a4')+' \u27f9 '+d.tgt;
  pbody.innerHTML=`<span class="chip route">route${d.dead?' &middot; failed':''}</span>
   <h2>${esc(d.rtitle||d.route)}</h2><code>${esc(imp)}</code>
   ${d.killers&&d.killers.length?`<p class="hint">invalidated by ${d.killers.join(', ')}</p>`:''}
   <p><a class="open-page" href="${d.route}.html">open page &#8594;</a></p>`;
 }
 openPanel();
 if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise([pbody]);
}
selectById=id=>{const d=byId[id];if(d){show(d);if(!d.orphan){neighbors(d);
 setTimeout(()=>{node.classed('dim',false);line.classed('dim',false)},1600)}}};
node.on('click',(e,d)=>{e.stopPropagation();show(d)});
svg.on('click',closePanel);
function refreshVis(){
 const sd=document.getElementById('showdead').checked;
 const deg={};
 links.forEach(l=>{if(real(l)&&(!l.dead||sd)){
  const a=l.source.id||l.source,b=l.target.id||l.target;
  deg[a]=(deg[a]||0)+1;deg[b]=(deg[b]||0)+1}});
 nodes.forEach(d=>{d.orphan=d.type==='claim'&&!d.root&&!d.goal&&!d.frontier&&!(deg[d.id]>0)});
 node.classed('orphan',d=>d.orphan);
 g.classed('showdead',sd);
 sim.force('charge',d3.forceManyBody().strength(d=>d.orphan?-10:-430));
 linkForce.strength(l=>l.kind==='aff'
  ?((l.source.orphan||l.target.orphan)?0:.03+.1*l.w):.55);
 sim.alpha(.5).restart();
}
document.getElementById('showdead').onchange=refreshVis;
sim.on('tick',()=>{
 line.attr('x1',l=>l.source.x).attr('y1',l=>l.source.y)
     .attr('x2',l=>l.target.x).attr('y2',l=>l.target.y);
 node.attr('transform',d=>`translate(${d.x},${d.y})`);
});
refreshVis();
}
</script>
