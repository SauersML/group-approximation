.  <code>G</code> is amenable, hence sofic and hyperlinear, and the conclusion of the criterion holds harmlessly because <code>J = Z</code> is LEF. So no argument that uses only the compression data can obstruct hyperlinearity: property <code>(T)</code> of <code>Gamma</code> and <code>G</code>, together with failure of LEF for <code>J</code>, carries the entire theorem.</p>\n<p><strong>The escape is proved sharp elsewhere in this graph.</strong>  At every finite level a compression is an equality by counting -- <code><a href=\"invariant-size-collapse.html\">invariant-size-collapse</a></code> formalizes exactly this for cardinality, finrank, <code>Nat.card</code> and Haar measure -- and the <code>II_1</code> branch survives only because the trace is refinement-blind, which <code><a href=\"trace-blindness-sharpness.html\">trace-blindness-sharpness</a></code> establishes is not repairable.  Strictness of a compressed relative commutant is therefore a purely ultraproduct phenomenon.  That is precisely the room a hyperlinear model needs, and it is the room a permutation model does not have.</p>\n<p><strong>The honest counterweight.</strong>  The permutation analogue of this fork, for this same group, has already been decided -- on the stable side.  <code>U</code> is <code>P</code>-stable: its only genuine finite permutation representations are trivial (a nontrivial one would give a nontrivial finite quotient, contradicting minimal almost periodicity), so <code>P</code>-stability is equivalent to nonsoficity, which is proved.  The prior \"no such exotic group has ever been produced\" was therefore already wrong once, for this exact group, in the neighbouring metric.  Anyone weighing the two branches should apply that discount.</p>\n<p><strong>The reframing that still tilts the balance.</strong>  By <code><a href=\"steinberg-hs-stability-equals-nonhyperlinearity.html\">steinberg-hs-stability-equals-nonhyperlinearity</a></code>, the fork is an equivalence: <code>U</code> is HS-stable if and only if <code>U</code> has no nontrivial hyperlinear quotient, if and only if <code>Q</code> is nonhyperlinear.  Consequently the opposite branch is not a stepping stone toward a nonhyperlinear group -- on it, <code>Q</code> <em>is</em> one -- so no route to <code><a href=\"leavitt-steinberg-hs-stable.html\">leavitt-steinberg-hs-stable</a></code> can be cheaper than producing the first nonhyperlinear group known, and <code>U</code> would be the first infinite Kazhdan group known to be HS-stable, every Kazhdan group of settled status being residually finite, hence sofic, hence hyperlinear, hence unstable by Becker--Lubotzky Theorem 1.3(ii).  This branch, by contrast, asks for a construction in a category where constructions of this shape routinely exist.  Net assessment as of 2026-08-14: this branch is favoured, but weakly, and the discount above is real.</p>\n<p><strong>Correction to the assessment (<code>cairn-fork</code>, rescued from their transcript by the coordinator \u2014 the agent locked this node intending to write it and the session limit hit first; the reasoning is theirs verbatim in substance, and it is UNREVIEWED).</strong>  The \"every settled Kazhdan group is unstable\" prior above is weaker than it looks, because the mechanism behind every known instability is structurally unavailable for <code>U</code>.  For <code>SL_3(Z)</code>, genuine finite-dimensional unitary representations factor through congruence quotients (Margulis), so HS-stability would mean correcting almost-representations into the finite-quotient lattice, and Becker--Lubotzky's instability exploits the RICHNESS of that lattice \u2014 (T) + HS-stable forces finitely many finite-index subgroups, which <code>SL_3(Z)</code>'s congruence tower violates.  <code>U</code> has exactly one finite-index subgroup: the obstruction theorem is vacuous for it AND the known machinery for building instability witnesses (mismatched families of finite-quotient representations) has nothing to work with.  So the known cases achieve instability through a mechanism <code>U</code> structurally lacks, and the pattern they form is not evidence about <code>U</code>.  Fork's own caveat: they had not read Becker--Lubotzky's construction directly at the time.  Net: the branch preference should be read as closer to even than \"favoured, weakly\" until someone re-derives the assessment with this discount in.</p>\n<p>One phrasing trap, since the equivalence is easy to overstate.  Condition 3 is nonhyperlinearity of <code>Q</code>, not of <code>U</code>.  \"<code>U</code> nonhyperlinear\" forbids only an injective homomorphism into a tracial matrix ultraproduct, whereas stability forbids every nontrivial one; the gap between them is exactly the noninjective homomorphism this branch is trying to construct, whose central kernel makes a proper central quotient of <code>U</code> hyperlinear while leaving <code>U</code> itself possibly nonhyperlinear.</p>\n<p><strong>Neighbouring stability results, for calibration.</strong>  Two 2026 data points bound how much the flexible/strict distinction can be worth. Lubotzky--Salomon (arXiv:2607.17578) exhibit <code>Z^2</code> as flexibly stable but not stable in the operator norm, the first such group -- so the gap is genuinely crossable, and a flexible variant of this claim is a strictly weaker target, which <code>docs/NOTEPAD.md:22593-22596</code> already notes would suffice. Becker--Chapman proved uniform flexible stability <strong>in permutations</strong> for all amenable groups (recorded in Kun--Thom arXiv:1901.03963v3 \u00a75); that is the state of the art on the flexible side and it does not reach this fork, because <code>U</code> is as far from amenable as a group gets.</p>"}, {"id": "lef-implies-operator-mf", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Local embeddability into finite groups implies operator MF", "impact": 2, "frontier": false, "lock": null, "html": "<p>Every countable LEF group is operator MF, in the norm-matrix-corona sense of <code><a href=\"countable-group-mf-conventions.html\">countable-group-mf-conventions</a></code> \u2014 hence in every formulation equivalent to it there (weak, actual-corona, unitary-sequence, local, increasing-dimension, ultraproduct, finite-set, group-theoretic, ambient-unitary).</p>\n<p>This is the manuscript's <code>lem:rfmf</code>/<code>lem:lfmf</code> argument with its hypothesis weakened to exactly what that argument uses.  At coordinate <code>n</code>, take a local embedding of the <code>n</code>-th window into a finite group <code>Q_n</code> and use the left regular representation of <code>Q_n</code>.  Multiplicativity is exact for every pair in the window, because the local embedding is a partial homomorphism there; separation is the same <code>sqrt 3</code> bound, because left translation by a nonidentity element of a finite group is a fixed-point-free permutation.  An exhausting sequence of windows then makes the induced corona map injective.</p>\n<p>Reusable corollary chain: <em>locally residually finite</em> implies LEF (each finite window sits in a finitely generated subgroup, which is residually finite, so a finite quotient of it embeds the window), hence sofic and MF.  That is the form used by <code><a href=\"literal-telescope-core-lef.html\">literal-telescope-core-lef</a></code> and available to any other lamp-by-telescope argument, including <code><a href=\"lamp-telescope-base-is-lef.html\">lamp-telescope-base-is-lef</a></code>.</p>"}, {"id": "level-shift-obstruction", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Level-shift towers lose \u0398(1) uniformly in height", "impact": 0, "frontier": false, "lock": null, "html": "<p><code>Sofic/LevelShiftObstruction</code> (formalized). A permutation shifting a graded set up one level is never compatible on the top level, missing at least <code>|S_m|</code> points; for level growth <code>k \u2265 2</code> the top level carries more than <code>(k\u22121)/k</code> of the mass uniformly in the height. Fatal against exponential amplification. Calibration: the count applies to <code>BS(1,2)</code> (<code>k = 2</code>) where the wreath product IS sofic via F\u00f8lner sets \u2014 the obstruction is in the architecture, not the group.</p>"}, {"id": "literal-central-mark-corona-invisible", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Literal finitely presented group has a universal invisible central mark", "impact": 9, "frontier": false, "lock": null, "html": "<p>The literal forty-one-relator group <code>E</code> has a nontrivial central involution <code>w</code> that every homomorphism from <code>E</code> to every norm matrix corona kills. Consequently <code>E</code> is finitely presented, generated by six elements after Tietze elimination, and is not MF; neither its maximal nor its reduced group C-star algebra is MF.</p>"}, {"id": "literal-clifford-ce-model", "status": "ESTABLISHED", "root": false, "goal": false, "title": "The literal non-MF mark survives a Connes-embeddable Clifford model", "impact": 1, "frontier": false, "lock": null, "html": "<p>For the literal finitely presented group <code>E</code> and its central involution <code>w</code>, there is a homomorphism into the unitary group of a Connes-embeddable finite tracial von Neumann algebra which sends <code>w</code> to <code>-1</code>.  Equivalently, <code>w</code> does not belong to the hyperlinear residual of <code>E</code>.</p>\n<p>The model is the finite-coset Clifford tower, followed by its automorphic dilation and crossing with <code>Z</code>.  It also realizes the exact <code>Cl_8(C) = M_16(C)</code> packet in the negative sector.  Therefore the fixed spin block is valid structural information but cannot support a universal tracial theorem killing <code>w</code>.</p>"}, {"id": "literal-group-fails-mf-conventions", "status": "ESTABLISHED", "root": false, "goal": false, "title": "The literal finitely presented group fails every formalized MF convention", "impact": 3, "frontier": false, "lock": null, "html": "<p>The explicit eight-generator finitely presented group <code>E</code> has a nontrivial central involution <code>w</code> that every homomorphism from <code>E</code> to the unitary group of every positive natural-dimension norm-matrix C-star corona sends to the identity.  Consequently <code>E</code> is not MF in any of the equivalent weak, actual-corona, unitary-sequence, local, increasing-dimension, ultraproduct, finite-set, group-theoretic, or ambient-unitary formulations. It also fails PMatF, trace-free PPermF, trace-PMF, PFF, PPF, strong, trace-preserving, trace-regular, and reduced-group-C-star MF, and neither its universe-relative maximal model nor its concrete reduced group C-star algebra admits an MF embedding.</p>"}, {"id": "literal-group-not-sofic", "status": "OPEN", "root": true, "goal": false, "title": "The literal finitely presented non-MF group is not sofic", "impact": 0, "frontier": true, "lock": null, "html": "<p>The literal finitely presented group <code>E</code> is not sofic; equivalently, it would be a finitely presented non-sofic group.</p>\n<p><strong>REFUTED the same day it was posed (2026-08-14).</strong>  <code><a href=\"literal-group-sofic.html\">literal-group-sofic</a></code> is established: <code>E</code> IS sofic, by the block-tower argument of <code>docs/LITERAL_GROUP_IS_SOFIC_2026-08-14.md</code>.  The node is kept so that the invalidation of <code><a href=\"literal-nonsofic-via-stable-central-quotient.html\">literal-nonsofic-via-stable-central-quotient</a></code> has a named victim, and because the reasoning that motivated it is still informative:</p>\n<p><code>E</code> is a central extension <code>1 -&gt; Z/2 = &lt;w&gt; -&gt; E -&gt; E/&lt;w&gt; -&gt; 1</code> of a finitely presented group whose central involution dies in every finite quotient \u2014 the configuration of <code><a href=\"gohla-thom-stable-base-nonsofic-extension.html\">gohla-thom-stable-base-nonsofic-extension</a></code> and of the Deligne extensions used as non-soficity candidates.  Since <code>E</code> is sofic, the contrapositive says that <code>E/&lt;w&gt;</code> fails at least one of that theorem's three base hypotheses: residual finiteness of finite type, the dimension-2 cosystolic inequality, or stability in finite actions.  Which one fails is open, and the first is exactly the input <code><a href=\"literal-mark-quotient-mf.html\">literal-mark-quotient-mf</a></code> needs.</p>"}, {"id": "literal-group-not-stable-in-finite-actions", "status": "ESTABLISHED", "root": false, "goal": false, "title": "The literal group is sofic but not stable in permutations, in any standard sense", "impact": 0, "frontier": false, "lock": null, "html": "<p>The literal forty-one-relator group <code>E</code> is <strong>not stable in finite actions</strong> (Gohla--Thom Definition 3.7), hence not stable in any stronger permutation sense: not <code>rho</code>-stable, not flexibly stable, not weakly flexibly stable.</p>\n<p><em>Trust surface, split by conclusion.</em>  The first statement is internal end to end.  The strengthening to \"any stronger sense\" uses Gohla--Thom Lemma 3.6 \u2014 each standard notion implies stability in finite actions \u2014 which is external, source-verified from the PDF and recorded in <code><a href=\"gohla-thom-stable-base-nonsofic-extension.html\">gohla-thom-stable-base-nonsofic-extension</a></code>.</p>\n<p><code>E</code> is sofic (<code><a href=\"literal-group-sofic.html\">literal-group-sofic</a></code>) and not residually finite: the marked involution <code>w != 1</code> is killed by every finite quotient, since a finite quotient supplies an exact finite-dimensional unitary representation and <code><a href=\"literal-central-mark-corona-invisible.html\">literal-central-mark-corona-invisible</a></code> kills <code>w</code> in all of those.  A sofic group stable in finite actions would be residually finite (<code><a href=\"sofic-stable-implies-residually-finite.html\">sofic-stable-implies-residually-finite</a></code>).</p>\n<p><strong>Two independent supports.</strong>  (1) The general principle above, proved in <code>docs/SOFIC_STABLE_IMPLIES_RESIDUALLY_FINITE_2026-08-14.md</code>, gives failure of the weakest notion, hence of all of them.  (2) Independently, Glebsky--Rivera's Theorem 2 (primary read by <code>cairn-scout</code>) says a sofic non-residually-finite group has a defining system that is unstable in permutations in their strict sense; <code>E</code> is finitely presented, so its forty-one-relator system is unstable in that sense, on a primary citation alone.  The two routes share only the inputs \"sofic\" and \"not residually finite\", both in-repo.</p>\n<p>So <code>E</code> is an explicit finitely presented group that is sofic and provably non-stable.  Contrast with the literature route this reverses: Gohla--Thom use stability of a base to force non-soficity of a central extension, and here soficity of the extension is proved first and forces non-stability instead.</p>"}, {"id": "literal-group-sofic", "status": "ESTABLISHED", "root": true, "goal": false, "title": "Soficity of the literal finitely presented non-MF group", "impact": 2, "frontier": false, "lock": null, "html": "<p>The literal finitely presented group <code>E</code> is sofic.</p>\n<p>PROVED 2026-08-14 via <code><a href=\"literal-sofic-via-block-tower.html\">literal-sofic-via-block-tower</a></code> (<code>docs/LITERAL_GROUP_IS_SOFIC_2026-08-14.md</code>).  The proof is the finite-stage tower that proves the witness <code>W</code> sofic, with the finite invariant Clifford subgroup replaced by a finitely generated virtually free invariant block sub-amalgam: a finite window of <code>E_T = N_E semidirect T</code> lies in one telescope level and finitely many blocks, level orbits on blocks are finite, and the resulting <code>M_J semidirect Gamma_n</code> is residually finite; then <code>E = E_T x| Z</code> is sofic by sofic-kernel/amenable-quotient permanence.</p>\n<p>Consequences and dead ends recorded here so they are not retried:</p>\n<ul>\n<li><code>E</code> is a finitely presented sofic non-MF (hence hyperlinear non-MF) group \u2014</li>\n<p><code><a href=\"finitely-presented-sofic-non-mf.html\">finitely-presented-sofic-non-mf</a></code>, strengthening Theorem E from the finitely generated witness to the finitely presented source.</p>\n<li>The amenable-kernel route died twice over: <code>ker(E -&gt; W)</code> is free of infinite</li>\n<p>rank (<code><a href=\"literal-witness-kernel-free.html\">literal-witness-kernel-free</a></code>), and its permanence direction (amenable kernel, sofic quotient) is not a theorem \u2014 see the warning in <code>docs/TRUE_LITERAL_NONMF_MARK_IS_CE_VISIBLE.md</code> \u00a73.</p>\n<li>The opposite claim <code><a href=\"literal-group-not-sofic.html\">literal-group-not-sofic</a></code> is refuted, and with it the</li>\n<p>stability route through <code>E/&lt;w&gt;</code>; by contraposition, modulo the Gohla--Thom citation, <code>E/&lt;w&gt;</code> is not flexibly permutation-stable.</p>\n<li>The Kun--Thom non-soficity mechanism cannot reach here: `Ehat = V *_B</li>\n<p>(B x Z/2)<code> has its free-lamp shape with </code>B<code> Kazhdan and infranormal in </code>V<code>, and the element it would kill is the unsquared defect </code>u<code> with </code>w = u^2<code>, but </code>V<code> is not Kazhdan \u2014 the stable-letter exponent maps it onto </code>Z`.  That failing hypothesis is exactly what the soficity proof consumes.</p>\n</ul>"}, {"id": "literal-group-structural-normal-form", "status": "ESTABLISHED", "root": true, "goal": false, "title": "Structural normal form and kernel description for the literal group", "impact": 0, "frontier": false, "lock": null, "html": "<p>Give a usable normal form for <code>E</code>, describe <code>ker(E -&gt; W)</code>, and deduce a solution of the word problem for the literal finite presentation.</p>"}, {"id": "literal-kazhdan-clifford-inputs", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Literal affine base supplies the Kazhdan--Clifford inputs", "impact": 2, "frontier": false, "lock": null, "html": "<p>The six-generator affine base displayed in the manuscript has property (T), its doubling endomorphism is injective, and the marked translation <code>v_1</code> is outside the image.  These statements concern the literal displayed relators, not merely an abstract isomorphic presentation.</p>"}, {"id": "literal-lamp-kernel-clifford-block-amalgam", "status": "ESTABLISHED", "root": false, "goal": false, "title": "The literal lamp kernel is a central amalgam of order-512 Clifford blocks", "impact": 8, "frontier": false, "lock": null, "html": "<p>Coordinatize the site set of the literal group as <code>X = V/B = disjoint_union_{n in Z} Z[1/2]^3 / 2^n Z^3</code>, the class of <code>t tau^n B</code> being <code>(n, [u] mod 2^n Z^3)</code>.  The <code>V</code>-orbit of the marked pair <code>{tau o, v_1 tau o} = {(1,[0]), (1,[e_1])}</code> is the edge set of a 7-regular graph whose connected components (\"blocks\") are the cosets of <code>2^(n-1) Z^3 / 2^n Z^3</code>, each a complete graph on eight sites; the block set is <code>V</code>-isomorphic to <code>X</code> itself, with block stabilizers the telescope levels.</p>\n<p>Consequently the lamp kernel of the literal group is</p>\n<p>N_E = free product over i in I of ClLamp(8), amalgamated over the common central involution &lt;w&gt; = Z/2,</p>\n<p>with <code>I</code> countably infinite, each block group of order <code>2^9 = 512</code>, and</p>\n<p>E = (V x &lt;w&gt;) *_{B_1 x &lt;w&gt;} (ClLamp(8) semidirect_product B_1), E/&lt;w&gt; = (*_{i in I} (Z/2)^8) semidirect_product V,</p>\n<p>where <code>B_1</code> is the level containing <code>B</code> with index eight and acts on the eight block sites through the finite affine group <code>AGL_3(F_2)</code>.</p>"}, {"id": "literal-mark-quotient-corona-blindness", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Corona trace-invisibility in the literal marked quotient is exactly the finite residual", "impact": 0, "frontier": false, "lock": null, "html": "<p>For every corona representation <code>Theta</code> of <code>E/&lt;w&gt;</code>, the induced tracial representation into the tracial ultraproduct kills the level-collapse kernel <code>R</code>; and every element outside <code>R</code> is detected in normalized Hilbert--Schmidt norm by some corona representation.  Hence the corona Hilbert--Schmidt radical of <code>E/&lt;w&gt;</code> equals its finite residual <code>R</code>.</p>\n<p>Consequently <code>Rad_MF(E/&lt;w&gt;)</code> is a normal subgroup of <code>R</code>, and a faithful MF model of <code>E/&lt;w&gt;</code> must separate elements of <code>R</code> on corners of vanishing normalized rank.  The same statement with the same proof holds for <code>W/&lt;zeta&gt;</code> (<code><a href=\"corona-hs-radical-is-finite-residual.html\">corona-hs-radical-is-finite-residual</a></code>), so both open quotient-MF claims have the same shape: separate a trace-invisible level collapse in operator norm.</p>"}, {"id": "literal-mark-quotient-finite-residual", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Exact finite residual of the literal marked quotient", "impact": 2, "frontier": false, "lock": null, "html": "<p>Every homomorphism from <code>E/&lt;w&gt;</code> to a finite group gives all lamps of a common telescope level the same image.  The finite residual of <code>E/&lt;w&gt;</code> is exactly</p>\n<pre>\nR = normal closure of { c_x c_{x&#x27;} : level(x) = level(x&#x27;) } ,\n</pre>\n<p>and the level-collapse quotient is</p>\n<pre>\n(E/&lt;w&gt;) / R  =  ( *_{n in Z} Z/2 ) semidirect V ,\n</pre>\n<p>with <code>V</code> acting through <code>level : V -&gt; Z</code>; that group is residually finite, hence LEF, hence MF.</p>\n<p><code>R</code> is not locally finite: two same-level lamps in different blocks generate an infinite dihedral group whose generator product lies in <code>R</code>.  This is the one structural asymmetry with the commuting-lamp quotient, where the corresponding subgroup is elementary abelian.</p>"}, {"id": "literal-mark-quotient-flexibly-stable", "status": "OPEN", "root": false, "goal": false, "title": "Flexible permutation stability of the literal marked quotient", "impact": 0, "frontier": false, "lock": null, "html": "<p>The finitely presented group</p>\n<p>E/&lt;w&gt; = (*_{i in I} (Z/2)^8) semidirect_product V = V *_{B_1} ((Z/2)^8 semidirect_product B_1)</p>\n<p>is flexibly stable in permutations: there is a rate function <code>rho</code> such that every <code>eps</code>-almost action on a finite set <code>Omega</code> is <code>rho(eps)</code>-close, after enlarging <code>Omega</code> to a finite superset, to a genuine action.</p>\n<h3>Status: REFUTED (2026-08-14)</h3>\n<p>This claim is FALSE.  <code><a href=\"literal-mark-quotient-not-stable-in-finite-actions.html\">literal-mark-quotient-not-stable-in-finite-actions</a></code> establishes that <code>E/&lt;w&gt;</code> is sofic (<code><a href=\"literal-mark-quotient-sofic.html\">literal-mark-quotient-sofic</a></code>) with nontrivial finite residual (<code><a href=\"literal-mark-quotient-finite-residual.html\">literal-mark-quotient-finite-residual</a></code>), hence not stable in finite actions \u2014 the weakest notion in use \u2014 and a fortiori not flexibly stable.  Nothing further should be attempted here; the correct target is the negation, which is already established.</p>\n<p><em>(Any \"open but unreachable from any root\" warning on this node is expected and should be read as \"refuted by <code><a href=\"literal-mark-quotient-not-stable-in-finite-actions.html\">literal-mark-quotient-not-stable-in-finite-actions</a></code>\", not as \"unattempted\": the node's only consumer route was invalidated and a refuted claim has nowhere to hang.  Do not re-hang it.)</em></p>\n<h3>History, all superseded \u2014 kept because two of the reversals are instructive</h3>\n<p>Read nothing below as a current status; each entry was overturned by the next.</p>\n<p>1. <strong>First status, WRONG.</strong>  The node was marked \"expected false\" on the ground that soficity of <code>E</code> plus Gohla--Thom refuted flexible stability of <code>E/&lt;w&gt;</code> directly.  That used the secondary rendering of the theorem (<code>arXiv:2410.02913</code> \"Theorem 1.5\") and dropped hypotheses. 2. <strong>Second status, also superseded.</strong>  After <code>cairn-scout</code> read the primary (<code>arXiv:2403.09582v2</code> Theorem 3.13, recorded in <code><a href=\"gohla-thom-stable-base-nonsofic-extension.html\">gohla-thom-stable-base-nonsofic-extension</a></code>), the correct reading was that the theorem also needs the base residually finite of finite type and satisfying a dimension-2 cosystolic inequality, so soficity of <code>E</code> yielded only a three-way disjunction: <code>E/&lt;w&gt;</code> fails residual finiteness of finite type, or fails the cosystolic inequality, or is not stable in finite actions.  At that point the claim was genuinely open. 3. <strong>Third status, superseded by the refutation above.</strong>  Soficity of <code>E/&lt;w&gt;</code> collapsed the disjunction to two, since a sofic group stable in finite actions is residually finite (<code><a href=\"sofic-stable-implies-residually-finite.html\">sofic-stable-implies-residually-finite</a></code>), so the stability disjunct was not independent of the residual-finiteness one. 4. <strong>Resolution.</strong>  The finite-residual computation showed the residual-finiteness disjunct is the one that fails, which both resolves the disjunction and, with soficity, refutes this claim outright.  Gohla--Thom hypothesis (i) fails for <code>E/&lt;w&gt;</code>, so their theorem never applied to the pair <code>(E/&lt;w&gt;, E)</code> at all.</p>\n<p>The cosystolic disjunct was therefore never reached and is moot for this group. The heuristic recorded while it was live \u2014 that <code>E/&lt;w&gt; = V *_{B_1} ((Z/2)^8 semidirect B_1)</code> is a nontrivial amalgam acting on a Bass-Serre tree, with nothing resembling the Bruhat-Tits geometry behind the known cosystolic inequalities (Kaufman-Kazhdan-Lubotzky, Evra-Kaufman) \u2014 was never more than a heuristic and is not load-bearing anywhere.</p>"}, {"id": "literal-mark-quotient-mf", "status": "OPEN", "root": false, "goal": false, "title": "MF property of the literal marked quotient", "impact": 2, "frontier": false, "lock": "cairn-quotient-mf", "html": "<p>The quotient <code>E / &lt;w&gt;</code> of the literal finitely presented non-MF group by its marked central involution is MF in the norm-matrix-corona sense.</p>\n<h3>Ideas</h3>\n<p><strong>What the group is.</strong>  By <code><a href=\"literal-lamp-kernel-clifford-block-amalgam.html\">literal-lamp-kernel-clifford-block-amalgam</a></code>,</p>\n<pre>\nE/&lt;w&gt; = ( *_{i in I} (Z/2)^8 ) semidirect V ,\n</pre>\n<p>a free product of elementary abelian blocks over the block set <code>I</code>, which is <code>V</code>-isomorphic to the site set <code>X</code>.  Collapsing each block to a single elementary abelian lamp group over <code>X</code> \u2014 equivalently, making all sites commute rather than only those in a common block \u2014 gives <code>W/&lt;zeta&gt;</code> of <code><a href=\"commuting-lamp-quotient-structure.html\">commuting-lamp-quotient-structure</a></code>.  So <code>E/&lt;w&gt;</code> surjects onto <code>W/&lt;zeta&gt;</code>, and <code>w</code> is not in that kernel.</p>\n<p><strong>Position relative to the companion claim.</strong>  This claim carries two burdens: the one analyzed in <code><a href=\"commuting-lamp-quotient-mf.html\">commuting-lamp-quotient-mf</a></code>, and the free-product structure of the lamp kernel, which is not locally finite \u2014 it contains infinite dihedral subgroups generated by two same-level lamps in different blocks, so the finite residual computed for <code>W/&lt;zeta&gt;</code> has here an infinite-order analogue.  MF does not pass to quotients (<code><a href=\"mf-quotient-nonclosure.html\">mf-quotient-nonclosure</a></code>), so this claim does not formally imply the companion one; but a single negative answer to <code><a href=\"corona-commutant-no-growth.html\">corona-commutant-no-growth</a></code> refutes both.</p>\n<p><strong>New route out.</strong>  <code><a href=\"literal-mark-quotient-detects-defect.html\">literal-mark-quotient-detects-defect</a></code>: because <code>u</code> is not in <code>{1,w}</code>, this claim implies <code><a href=\"unsquared-defect-mf-visible.html\">unsquared-defect-mf-visible</a></code> on its own, independently of <code><a href=\"commuting-lamp-quotient-mf.html\">commuting-lamp-quotient-mf</a></code>.  That makes <code><a href=\"unsquared-defect-mf-visible.html\">unsquared-defect-mf-visible</a></code> the common consequence of both open quotient claims and the right place to look for a refutation.</p>\n<p><strong>Routes that are closed.</strong>  <code><a href=\"marked-quotients-not-lef.html\">marked-quotients-not-lef</a></code> applies verbatim to <code>E/&lt;w&gt;</code>: the compression and centralizer relators survive in the quotient and <code>u</code> does not die there, so no exact finite model separates it, and <code>E/&lt;w&gt;</code> is neither residually finite nor LEF.  As for the companion claim, amenability is unavailable and no <code>Z</code>-extension permanence theorem can help (<code><a href=\"mf-not-closed-under-integer-extensions.html\">mf-not-closed-under-integer-extensions</a></code>).  Note especially that <code><a href=\"literal-telescope-core-lef.html\">literal-telescope-core-lef</a></code> makes <code>E/&lt;w&gt;</code> a <code>Z</code>-extension of an LEF, hence MF, core \u2014 but so is <code>E</code> itself, and <code>E</code> is not MF.  So \"the core is already MF, only the stable letter remains\" is not a partial proof of this claim: by <code><a href=\"mf-not-closed-under-integer-extensions.html\">mf-not-closed-under-integer-extensions</a></code> the stable-letter step is the entire difficulty, and it is exactly where the two known negative answers live.</p>\n<p><strong>What is now proved about this group.</strong> <code><a href=\"literal-mark-quotient-finite-residual.html\">literal-mark-quotient-finite-residual</a></code>: every finite quotient identifies all lamps of a common telescope level, the finite residual is exactly the level-collapse kernel <code>R</code>, and <code>(E/&lt;w&gt;)/R = (*_{n in Z} Z/2) semidirect V</code> is residually finite.  <code><a href=\"literal-mark-quotient-corona-blindness.html\">literal-mark-quotient-corona-blindness</a></code>: every corona representation is trace-blind on <code>R</code> and on nothing else.  So this claim is now the same shape as its companion \u2014 separate a trace-invisible level collapse in operator norm \u2014 with <code>R</code> non-locally-finite here and elementary abelian there.</p>\n<p><strong>Central-extension criterion.</strong>  <code><a href=\"central-extension-twisted-sector-criterion.html\">central-extension-twisted-sector-criterion</a></code> imports the unused criterion of <code>docs/NOTEPAD.md:39199-39232</code>.  Applied to <code>(E,&lt;w&gt;)</code> it restates Theorem A as emptiness of the twisted sector over this group, and imposes no constraint on the present claim.  It should not be mistaken for an obstruction.</p>\n<p><strong>Side effect on the stability question.</strong>  <code><a href=\"marked-quotients-not-lef.html\">marked-quotients-not-lef</a></code> resolves the first disjunct of the trichotomy recorded in <code><a href=\"literal-mark-quotient-flexibly-stable.html\">literal-mark-quotient-flexibly-stable</a></code>: <code>E/&lt;w&gt;</code> is not residually finite, so soficity of <code>E</code> plus the Gohla--Thom theorem gives no information about its permutation stability.</p>\n<p><strong>Order of work.</strong>  Work on <code><a href=\"commuting-lamp-quotient-mf.html\">commuting-lamp-quotient-mf</a></code> first.  It is the same analytic problem with the group-theoretic unknowns removed, and a positive answer there is a prerequisite in spirit \u2014 a faithful corona model of <code>E/&lt;w&gt;</code> restricts to one of every subgroup and pushes no information through the unknown kernel, so nothing about <code>E/&lt;w&gt;</code> is easier.</p>\n<p><strong>A second, non-exact-model route.</strong>  <code><a href=\"literal-mark-quotient-via-shulman-amalgam.html\">literal-mark-quotient-via-shulman-amalgam</a></code>: Shulman's Theorem 20 (<code><a href=\"shulman-amalgam-mf-criterion.html\">shulman-amalgam-mf-criterion</a></code>, source-verified) makes <code>A *_C B</code> MF exactly when the two vertex algebras admit corona embeddings agreeing on <code>C</code>.  Applied to <code>V *_{B_1} ((Z/2)^8 sd B_1)</code> this asks for <code><a href=\"amalgam-edge-compatible-corona-embeddings.html\">amalgam-edge-compatible-corona-embeddings</a></code>.  That datum implies commutant growth as well, so the two routes meet at the same hinge; it also costs more than the group claim needs, since Theorem 20 requires both vertex algebras to be MF and both contain a property-(T) group.</p>\n<p><strong>The hinge is exact.</strong>  <code><a href=\"marked-quotient-mf-forces-commutant-growth.html\">marked-quotient-mf-forces-commutant-growth</a></code>: MF of this group forces operator-norm commutant growth at the compressor, witnessed by a single lamp.  So <code><a href=\"corona-commutant-no-growth.html\">corona-commutant-no-growth</a></code> decides this claim, <code><a href=\"commuting-lamp-quotient-mf.html\">commuting-lamp-quotient-mf</a></code> and <code><a href=\"kun-thom-wreath-weak-mf.html\">kun-thom-wreath-weak-mf</a></code> together.</p>\n<p><strong>Best next unit.</strong>  <code><a href=\"corona-commutant-no-growth.html\">corona-commutant-no-growth</a></code>, then, if that fails, the edge-compatibility datum of the amalgam route.</p>"}, {"id": "literal-mark-quotient-not-stable-in-finite-actions", "status": "ESTABLISHED", "root": false, "goal": false, "title": "The literal marked quotient is sofic but not stable in permutations", "impact": 0, "frontier": false, "lock": null, "html": "<p><code>E/&lt;w&gt; = (*_{i in I} (Z/2)^8) semidirect V</code> is <strong>not stable in finite actions</strong> (Gohla--Thom Definition 3.7), hence not stable in any stronger permutation sense.  In particular <code><a href=\"literal-mark-quotient-flexibly-stable.html\">literal-mark-quotient-flexibly-stable</a></code> is FALSE.</p>\n<p><em>Trust surface, split by conclusion.</em>  \"Not stable in finite actions\" is internal end to end.  The strengthening to any stronger notion, which is what refutes the flexible-stability claim, uses Gohla--Thom Lemma 3.6 \u2014 external, source-verified, recorded in <code><a href=\"gohla-thom-stable-base-nonsofic-extension.html\">gohla-thom-stable-base-nonsofic-extension</a></code>.</p>\n<p>Both inputs are now in-repo: <code>E/&lt;w&gt;</code> is sofic (<code><a href=\"literal-mark-quotient-sofic.html\">literal-mark-quotient-sofic</a></code>), and it is not residually finite, because <code><a href=\"literal-mark-quotient-finite-residual.html\">literal-mark-quotient-finite-residual</a></code> computes its finite residual to be the nontrivial level-collapse kernel <code>R</code> \u2014 which even contains elements of infinite order.  A sofic group stable in finite actions is residually finite (<code><a href=\"sofic-stable-implies-residually-finite.html\">sofic-stable-implies-residually-finite</a></code>).</p>\n<p>Consequence for the Gohla--Thom line: hypothesis (i) of their Theorem 3.13 fails outright for <code>E/&lt;w&gt;</code>, so that theorem never applied to the pair <code>(E/&lt;w&gt;, E)</code> and says nothing here about the cosystolic inequality.  The three-way disjunction previously recorded is resolved, and it is resolved on the residual-finiteness disjunct.  The stability conclusion above is independent of it.</p>"}, {"id": "literal-mark-quotient-sofic", "status": "ESTABLISHED", "root": false, "goal": false, "title": "The literal marked quotient is sofic", "impact": 1, "frontier": false, "lock": null, "html": "<p><code>E/&lt;w&gt; = (*_{i in I} (Z/2)^8) semidirect V</code> is sofic.</p>\n<p>Soficity does not pass to quotients, so this does not follow from <code><a href=\"literal-group-sofic.html\">literal-group-sofic</a></code>; it follows from the same block-tower argument with the Clifford blocks replaced by their central quotients <code>(Z/2)^8</code> and the amalgamation deleted.  The finitely generated invariant lamp subgroups <code>M'_J = *_{i in J} (Z/2)^8</code> are still free products of finitely many finite groups, hence virtually free and residually finite, and the level still acts on them through a finite permutation group of the <code>8|J|</code> sites.</p>\n<p><strong>The dichotomy this created, and how it resolved.</strong>  Either <code>E/&lt;w&gt;</code> is residually finite \u2014 then it is MF by <code>lem:rfmf</code>, settling <code><a href=\"literal-mark-quotient-mf.html\">literal-mark-quotient-mf</a></code> and <code><a href=\"literal-mf-radical-exact.html\">literal-mf-radical-exact</a></code> \u2014 or it is not, in which case, being sofic, it is not stable in finite actions by <code><a href=\"sofic-stable-implies-residually-finite.html\">sofic-stable-implies-residually-finite</a></code>.</p>\n<p>The second branch is the true one.  <code><a href=\"literal-mark-quotient-finite-residual.html\">literal-mark-quotient-finite-residual</a></code> computes the finite residual of <code>E/&lt;w&gt;</code> to be the nontrivial level-collapse kernel, and <code><a href=\"marked-quotients-not-lef.html\">marked-quotients-not-lef</a></code> shows <code>E/&lt;w&gt;</code> is not even LEF.  So both exact-finite-model routes to <code><a href=\"literal-mark-quotient-mf.html\">literal-mark-quotient-mf</a></code> are closed, and the stability conclusion is <code><a href=\"literal-mark-quotient-not-stable-in-finite-actions.html\">literal-mark-quotient-not-stable-in-finite-actions</a></code>. Soficity and MF have parted company here in the sharpest available way: <code>E/&lt;w&gt;</code> has permutation microstates but no exact finite local models at all.</p>"}, {"id": "literal-mf-radical-exact", "status": "OPEN", "root": true, "goal": false, "title": "Exact MF radical of the literal non-MF group", "impact": 0, "frontier": false, "lock": null, "html": "<p>For the literal finitely presented group <code>E</code> and its marked central involution <code>w</code>,</p>\n<p>\\[ \\operatorname{Rad}_{\\mathrm{MF}}(E)=\\{1,w\\}. \\]</p>"}, {"id": "literal-no-faithful-corona-subalgebra-representation", "status": "ESTABLISHED", "root": false, "goal": false, "title": "No faithful literal-group representation inside a norm-matrix corona", "impact": 0, "frontier": false, "lock": null, "html": "<p>Let <code>A</code> be a unital C-star algebra admitting an injective, possibly nonunital, star homomorphism into a positive natural-dimension norm-matrix C-star corona.  Then every homomorphism <code>E -&gt; U(A)</code> from the literal group is noninjective.  In particular, neither the development's universe-relative maximal group-C-star model of <code>E</code> nor its concrete reduced group C-star algebra admits an MF embedding.</p>"}, {"id": "literal-stably-finite-non-mf-reduced-group-algebra", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Literal reduced group algebra is stably finite but not MF", "impact": 0, "frontier": false, "lock": null, "html": "<p>The concrete reduced group C-star algebra of the literal finitely presented group <code>E</code> is separable, carries its canonical faithful tracial state, is stably finite in every nonempty finite matrix amplification, and is not MF.</p>"}, {"id": "literal-telescope-core-lef", "status": "ESTABLISHED", "root": false, "goal": false, "title": "The telescope core of the literal group is locally residually finite", "impact": 3, "frontier": false, "lock": null, "html": "<p>Let <code>E_T = N_E semidirect T</code> be the kernel of the stable-letter exponent <code>E -&gt; Z</code>, i.e. the lamp group extended by the telescope <code>T = union of the levels Gamma_n</code>.  Every finitely generated subgroup of <code>E_T</code> is residually finite.  Consequently <code>E_T</code> is LEF, sofic, and MF.</p>\n<p><strong>\"Locally\" is load-bearing: <code>E_T</code> is LEF but NOT residually finite</strong> \u2014 <code><a href=\"telescope-core-not-residually-finite.html\">telescope-core-not-residually-finite</a></code>, with the argument written out as Theorem 4.1a of <code>docs/LITERAL_GROUP_IS_SOFIC_2026-08-14.md</code> (<code>cairn-verify2</code>): in any homomorphism from <code>E_T</code> to a finite group the image of <code>Z[1/2]^3</code> is 2-divisible and finite, hence of odd order, so 2 is invertible there and <code>phi(Z[1/2]^3) = phi(Z^3)</code>, giving <code>phi(T) = phi(B)</code> with no use of the stable letter; the level-collapse argument then identifies same-level lamps and kills <code>w</code>.  So a directed union of residually finite groups need not be residually finite, and this one is not \u2014 every window has finite models keeping <code>w</code>, while the union has none.</p>\n<p><strong>No conflict with <code><a href=\"marked-quotients-not-lef.html\">marked-quotients-not-lef</a></code>.</strong>  That claim shows <code>E</code>, <code>W</code>, <code>E/&lt;w&gt;</code> and <code>W/&lt;zeta&gt;</code> are all NOT LEF, by an argument that needs the stable letter <code>tau</code> inside the window: a local embedding into a finite group forces <code>phi(tau) Gamma^ phi(tau)^(-1) = Gamma^</code> by cardinality and hence kills the defect.  <code>E_T</code> is exactly the stable-letter-free part, so that argument does not apply to it, and LEF passing to subgroups is consistent with the ambient group failing LEF.  The whole content of the pair of statements is that local finite models exist for every window of <code>E_T</code> and cannot survive the addition of <code>tau</code> \u2014 which is also why soficity does survive it (the <code>Z</code>-extension step is only approximately multiplicative) while LEF and residual finiteness do not.</p>\n<p><strong>Which MF, and how to reuse the step.</strong>  The MF here is the operator-norm norm-matrix-corona property of <code><a href=\"countable-group-mf-conventions.html\">countable-group-mf-conventions</a></code>, hence every formulation equivalent to it there.  The implication is factored out as the reusable node <code><a href=\"lef-implies-operator-mf.html\">lef-implies-operator-mf</a></code>: locally residually finite implies LEF implies operator MF, by the manuscript's <code>lem:lfmf</code> argument run on local embeddings instead of finite subgroups.  Nothing in that step is specific to the literal group, so <code><a href=\"lamp-telescope-base-is-lef.html\">lamp-telescope-base-is-lef</a></code> and any other lamp-by-telescope argument can cite it directly rather than re-deriving MF.</p>\n<p>The mechanism: a finite window lies in one level <code>Gamma_n</code> and touches finitely many blocks; the level has finite orbits on the block set, so the blocks it touches generate a finitely generated, level-invariant sub-amalgam <code>M_J</code> of finitely many copies of <code>ClLamp(8)</code> over the common centre.  <code>M_J</code> is virtually free, and the level acts on it through a finite permutation group of the <code>8|J|</code> sites, so <code>M_J semidirect Gamma_n</code> contains <code>M_J x Lambda</code> with finite index for a finite-index <code>Lambda &lt;= Gamma_n</code> acting trivially.</p>"}, {"id": "literal-telescope-split-normal-form", "status": "ESTABLISHED", "root": false, "goal": false, "title": "The literal group splits as lamp-by-telescope over an explicit linear quotient", "impact": 4, "frontier": false, "lock": null, "html": "<p>Let <code>E</code> be the literal forty-one-relator group and <code>N = &lt;&lt;c&gt;&gt;</code> the normal closure of the lamp generator.  Then the assignment <code>c -&gt; 1</code> is a retraction <code>E -&gt; V</code> onto the telescope group of the manuscript, so</p>\n<p>E = N_E semidirect_product V,</p>\n<p>where <code>V = (Z[1/2]^3 semidirect_product SL_3(Z)) semidirect_product Z</code> is the ascending HNN extension of the literal base <code>B = Z^3 semidirect_product SL_3(Z)</code> along the doubling endomorphism, realized faithfully as <code>&lt;Gammabar, diag(2,2,2,1)&gt; &lt;= GL_4(Q)</code>.  Every element of <code>E</code> is uniquely a product <code>p g</code> with <code>p</code> in the lamp kernel and <code>g</code> in <code>V</code>.</p>\n<p>Deleting the eight centrality relators gives the free lamp group <code>Ehat = V *_B (B x Z/2) = (*_X Z/2) semidirect_product V</code> with <code>X = V/B</code>, and <code>E</code> is its largest quotient in which the marked word <code>w = [c_a, c_b]</code> (<code>a = tau o</code>, <code>b = v_1 tau o</code>) becomes central.</p>"}, {"id": "literal-witness-kernel-amenable", "status": "OPEN", "root": false, "goal": false, "title": "Amenability of the kernel from the literal group to its Clifford witness", "impact": 0, "frontier": false, "lock": null, "html": "<p>The kernel of the canonical surjection from the literal group <code>E</code> to the Clifford witness <code>W</code> is amenable.</p>\n<p><strong>REFUTED by <code><a href=\"literal-witness-kernel-free.html\">literal-witness-kernel-free</a></code> \u2014 this is not a live hole.</strong>  Any \"open but unreachable from any root\" warning on this node is expected and should be read as \"refuted\", not as \"unattempted\": the claim is false, and its only consumer route <code><a href=\"literal-sofic-via-amenable-kernel.html\">literal-sofic-via-amenable-kernel</a></code> was invalidated by the refuter.  Do not re-hang it and do not attempt it.</p>\n<p><strong>Detail (2026-08-14).</strong>  <code><a href=\"literal-witness-kernel-free.html\">literal-witness-kernel-free</a></code> computes that kernel: it is a free group of countably infinite rank, so it contains <code>F_2</code> and is not amenable.  See <code>docs/LITERAL_GROUP_BLOCK_AMALGAM_STRUCTURE_2026-08-14.md</code>, Theorem 6.1.  The node is kept only so that the invalidation of <code><a href=\"literal-sofic-via-amenable-kernel.html\">literal-sofic-via-amenable-kernel</a></code> has a named victim; do not attempt it.</p>"}, {"id": "literal-witness-kernel-free", "status": "ESTABLISHED", "root": false, "goal": false, "title": "The kernel to the Clifford witness is free of infinite rank, hence non-amenable", "impact": 1, "frontier": false, "lock": null, "html": "<p>The kernel of the canonical surjection <code>E -&gt; W = ClLamp(X) x| V</code> from the literal finitely presented group to its Clifford witness is a <strong>free group of countably infinite rank</strong>.  It is therefore not amenable, and <code><a href=\"literal-witness-kernel-amenable.html\">literal-witness-kernel-amenable</a></code> is FALSE.</p>\n<p>The map is an isomorphism on the telescope quotients, so the kernel equals <code>ker(N_E -&gt; ClLamp(X))</code>, the kernel of the collapse of the block amalgam onto the group in which all distinct sites anticommute.  Every block and the centre inject, so the kernel acts freely on the Bass-Serre tree of the amalgam; it is nontrivial and non-finitely-generated because <code>[c_x, c_y] w</code> lies in it for sites <code>x, y</code> in different blocks.  Equivalently: <code>E</code> is <em>free-by-sofic</em>.</p>\n<p>The refuted route also used extension permanence in the direction \"amenable kernel and sofic quotient imply sofic\".  Elek--Szabo prove the opposite direction (sofic kernel, amenable quotient); the direction used there is an instance of the open extension problem for sofic groups, so the route was unsound independently of this computation.</p>"}, {"id": "literal-word-problem-solvable", "status": "ESTABLISHED", "root": false, "goal": false, "title": "The literal forty-one-relator presentation has solvable word problem", "impact": 1, "frontier": false, "lock": null, "html": "<p>There is an algorithm deciding whether a word in the eight literal generators is trivial in <code>E</code>.  Push the lamp letters left, recording each as a site of <code>X = disjoint_union_n Z[1/2]^3/2^n Z^3</code> computed by rational matrix arithmetic in <code>GL_4(Q)</code>; site equality and block membership are finite rational tests. Reduce the resulting lamp word inside the block amalgam by multiplying maximal same-block runs in the explicit group of order 512 and moving the central sign to the front.  The word is trivial iff the telescope part is the identity matrix with zero stable-letter exponent and the reduced lamp word is empty with trivial sign.</p>\n<p>So the literal group has solvable word problem although it is neither residually finite nor MF: the Theorem A obstruction is analytic, not algorithmic.</p>"}, {"id": "map-matricial-stability-non-mf", "status": "ESTABLISHED", "root": false, "goal": false, "title": "A minimally almost periodic matricially stable group is not MF", "impact": 1, "frontier": false, "lock": null, "html": "<p>Let <code>G</code> be an infinite countable group that is <strong>minimally almost periodic</strong> \u2014 every finite-dimensional unitary representation is trivial \u2014 and <strong>matricially stable</strong> in Dadarlat's sense: for every asymptotic homomorphism <code>phi_n : G -&gt; U(k_n)</code>, not necessarily separating, there are homomorphisms <code>pi_n : G -&gt; U(k_n)</code> with <code>\u2016phi_n(s) - pi_n(s)\u2016 -&gt; 0</code> for each <code>s in G</code>.  Then <code>G</code> is not MF.</p>\n<p>The argument is two lines and is written out in the proof route.  What makes it worth a node is its shape: <strong>no torsion, no mark, no central element, no compression data</strong>.  It is the cleanest torsion-free-compatible non-MF criterion available, and its group-theoretic hypothesis is one this program is already forced into from two other directions (<code><a href=\"bounded-rank-corners-excluded.html\">bounded-rank-corners-excluded</a></code>, <code><a href=\"finite-dimensional-models-break-coordinate-generation.html\">finite-dimensional-models-break-coordinate-generation</a></code>).</p>\n<p>The price is the stability hypothesis, which is unproved for every candidate here and is the same wall the repository already records for its Steinberg group: proving operator-norm stability for <code>St_5(L)</code> would close the weak-MF lane negatively, while proving weak MF would exhibit an explicit failure of that stability.  This node states the implication cleanly so that the wall has a name in the graph.</p>\n<h3>Ideas</h3>\n<p><strong>A chain that would prove too much \u2014 FLAGGED, NOT ASSERTED.</strong>  Two statements reported from Dadarlat, arXiv:2007.12655, sit next to each other in a way that deserves checking before anyone relies on either:</p>\n<ul>\n<li>MF implies weak quasidiagonality;</li>\n<li>Proposition 3.19, attributed to Ozawa--Thom: an infinite property-(T)</li>\n<p>group that is weakly quasidiagonal has an infinite residually finite quotient.</p>\n</ul>\n<p>Chained, these give: <em>an infinite Kazhdan group with no infinite residually finite quotient is not MF</em> \u2014 a published, torsion-free-compatible, entirely unconditional non-MF criterion, needing no mark, no stability, and no compression data.</p>\n<p><strong>Treat this as probably wrong until checked.</strong>  If it were right, non-MF groups would have been available since the Ozawa--Thom result, whereas the manuscript records that no countable group was known whose group C-star algebra fails to be MF, and Bachner--Dogon--Lubotzky still called the MF question open in April 2026.  The likely failure points, in order of suspicion: the first statement may be false as summarized, or carry extra hypotheses (a <code>gamma</code>-element, or a reduced-algebra qualifier); Proposition 3.19 may carry hypotheses lost in transcription; or infinite Kazhdan groups with no infinite residually finite quotient may not be known to exist, which would make the criterion vacuous rather than false.  The question is out to cairn-scout, who has the primary text.  <strong>Nothing in this repository should depend on the chain until it comes back</strong>, and if it does come back valid it is a priority matter for the manuscript, not merely a new route.</p>"}, {"id": "marked-double-coset-infinite-degree", "status": "ESTABLISHED", "root": false, "goal": false, "title": "The marked double coset of the Laurent Kun--Thom pair has infinite degree", "impact": 0, "frontier": false, "lock": null, "html": "<p>Let <code>r,d&gt;=3</code>, <code>R_+=F_q[x_1,...,x_d]</code>, <code>R=F_q[x_1^(\u00b11),...,x_d^(\u00b11)]</code>, <code>Gamma=EL_r(R_+)</code> and <code>G=EL_r(R) semidirect SL_d(Z)</code> be the Kun--Thom Theorem E pair, and <code>X=G/Gamma</code>.</p>\n<p>1. <strong>Necessary condition for a finite double coset.</strong>  For <code>h in GL_r(R)</code>, if <code>[Gamma : Gamma cap h Gamma h^(-1)]</code> is finite then</p>\n<pre>\n   (h^(-1))_(p i) h_(j q) in R_+   for all p,q and all i != j.\n</pre>\n<p>2. <strong>The marked element fails it.</strong>  For <code>h=e_12(x^m)</code> with <code>m</code> not in <code>N^d</code> \u2014 in particular for the recorded marked element <code>h=e_12((x_1...x_d)^(-1))</code> of docs/COMMUTING_WREATH_SOFIC_RADICAL.md, Corollary 2 \u2014 one has <code>(h^(-1))_(12) h_(11) = -x^m</code> outside <code>R_+</code>. Hence</p>\n<pre>\n   [Gamma : Gamma cap h Gamma h^(-1)] = infinity,\n</pre>\n<p>so the <code>Gamma</code>-orbit of the marked coset <code>h Gamma</code> in <code>X</code> is infinite and the orbital graph of <code>Gamma h Gamma</code> has infinite degree at every vertex. 3. <strong>Consequence for the invariant-graph family.</strong>  A <code>G</code>-invariant graph on <code>X</code> that contains the marked edge contains the whole orbital graph of <code>Gamma h Gamma</code>, so <strong>no finite-degree <code>G</code>-invariant graph on <code>X</code> keeps the marked word alive</strong>.  The finite-degree, bounded-anticommutation regime of <code><a href=\"invariant-graph-crossed-product-ce.html\">invariant-graph-crossed-product-ce</a></code> is therefore empty, and the freedom in that family is not freedom in the direction of locality. 4. <strong>The fixed set is nevertheless infinite, and its compressor translates are computable.</strong>  <code>X^Gamma = {y Gamma : y^(-1) Gamma y &lt;= Gamma}</code> is exactly <code>P_Gamma^(-1) Gamma / Gamma</code>, the coset set of the inverse compression semigroup, and it contains the whole ray <code>t^(-n) Gamma</code> because a strict compressor has no power in <code>Gamma</code> (the formalized <code><a href=\"ray-injectivity.html\">ray-injectivity</a></code>).  More generally, for every <code>s in G</code>,</p>\n<pre>\n   X^(s Gamma s^(-1)) = s * X^Gamma,\n</pre>\n<p>and for <code>s=t</code> a compressor this contains <code>X^Gamma</code> and contains <code>t Gamma</code>, which is not in <code>X^Gamma</code>.  So the <code>Gamma</code>-fixed structure of <code>X</code> is infinite and grows strictly along the compressor, while the marked orbit is infinite: the model has no finite <code>Gamma</code>-invariant coordinates anywhere near the mark.</p>"}, {"id": "marked-quotient-mf-forces-commutant-growth", "status": "ESTABLISHED", "root": false, "goal": false, "title": "MF of either marked quotient forces operator-norm commutant growth", "impact": 0, "frontier": false, "lock": null, "html": "<p>Let <code>Theta</code> be a corona representation of <code>W/&lt;zeta&gt;</code> or of <code>E/&lt;w&gt;</code> that is injective, and put <code>C = Theta(Gbar)' cap Q</code>.  Then</p>\n<pre>\nC  strictly contained in  Theta(tau) C Theta(tau)^*  =  Theta(abar(Gbar))&#x27; cap Q ,\n</pre>\n<p>witnessed by the single lamp <code>Theta(c_{tau o})</code>.</p>\n<p>So <code><a href=\"corona-commutant-no-growth.html\">corona-commutant-no-growth</a></code> is not merely sufficient to refute the two open quotient claims: its negation is <em>necessary</em> for either of them.  Any proof that either quotient is MF must exhibit a corona representation whose relative commutant grows under the compression, and the growth is realized by a lamp, not by an exotic operator.</p>"}, {"id": "marked-quotients-not-lef", "status": "ESTABLISHED", "root": false, "goal": false, "title": "The marked quotients admit no exact finite models", "impact": 1, "frontier": false, "lock": null, "html": "<p>None of <code>E</code>, <code>W</code>, <code>E/&lt;w&gt;</code>, <code>W/&lt;zeta&gt;</code> is locally embeddable into finite groups; in particular none is residually finite.  Any group in which the six compression relations <code>tau s tau^{-1} = abar(s)</code>, the centralizer relations <code>[c,s] = 1</code>, and <code>u = [tau c tau^{-1}, s_1] != 1</code> all hold fails LEF.</p>\n<p>Consequently every MF route for the two marked quotients that factors through residual finiteness, local finiteness, or local embeddability into finite groups is closed.  It also settles the residual-finiteness disjunct of <code><a href=\"literal-mark-quotient-flexibly-stable.html\">literal-mark-quotient-flexibly-stable</a></code>: <code>E/&lt;w&gt;</code> is not residually finite, so the Gohla--Thom disjunction there is satisfied without constraining permutation stability.</p>"}, {"id": "matrix-corona-k0-index-survives", "status": "ESTABLISHED", "root": false, "goal": false, "title": "K-zero of a matrix corona is the product modulo the sum", "impact": 0, "frontier": false, "lock": null, "html": "<p>For any sequence <code>(d_n)</code> of positive integers,</p>\n<p>K_0( prod_n M_{d_n} / oplus_n M_{d_n} )  ==  prod_n Z / oplus_n Z.</p>\n<p>Together with <code><a href=\"matrix-corona-k1-vanishes.html\">matrix-corona-k1-vanishes</a></code> this delimits index arguments in the non-MF program exactly.  A single marked unitary carries a <code>K_1</code> class and <code>K_1</code> of the corona is zero, so nothing survives.  A commuting <strong>pair</strong> in the corona is a homomorphism from <code>C(T^2)</code>, and the image of the Bott generator lands in <code>K_0</code>, which is large: concretely, the sequence of Bott indices of any lift, read modulo eventual agreement.  Different lifts of the same corona pair differ by a sequence tending to zero in norm, and the Bott index is stable under small perturbations, so the class is an invariant of the corona representation and not of the chosen lift.</p>\n<p>So relative index arguments are not formally dead, and the group has to supply the second operator.  This is the corona-side half of the programme recorded in <code><a href=\"exel-loring-mark-quantization.html\">exel-loring-mark-quantization</a></code>.</p>"}, {"id": "matrix-corona-k1-vanishes", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Every norm matrix corona has vanishing K-one", "impact": 0, "frontier": false, "lock": null, "html": "<p>For any sequence <code>(d_n)</code> of positive integers, <code>K_1(prod_n M_{d_n} / oplus_n M_{d_n}) = 0</code>.</p>\n<p>Consequence for the non-MF program: no winding-number or Bott-type index of the marked unitary alone can obstruct a corona representation.  A central mark of infinite order, forced near the scalars, carries no <code>K_1</code> class to be contradicted, so the \"unwind the sign into a circle and count turns\" route into <code><a href=\"torsion-free-finitely-presented-non-mf.html\">torsion-free-finitely-presented-non-mf</a></code> is void.  Any surviving index argument must be relative \u2014 an invariant of the mark <strong>together with</strong> another almost-commuting operator, as in the Bott index of an almost commuting pair \u2014 and not of the mark by itself.</p>\n<h3>Priority check (2026-08-14 literature scout)</h3>\n<p><strong>No prior source located, and none is needed.</strong> A targeted sweep \u2014 arXiv full-text for corona algebras with K-theory, and for MF/matricial-field and quasidiagonality work 2008--2026 \u2014 turned up nothing computing <code>K_1</code> or <code>K_0</code> of <code>prod_n M_(d_n) / oplus_n M_(d_n)</code>. The nearby literature is about coronas of <em>stable</em> or non-simple C-star algebras (multiplier/corona real rank, projection lifting), which is a different object.</p>\n<p>Treat the statement as folklore and prove it in place; it is three lines from the six-term exact sequence of</p>\n<pre>\n0 -&gt; oplus_n M_(d_n) -&gt; prod_n M_(d_n) -&gt; corona -&gt; 0,\n</pre>\n<p>using <code>K_1(prod_n M_(d_n)) = 0</code> (each <code>U(d_n)</code> is connected, and <code>K_1</code> of a product of unital algebras is the product of the <code>K_1</code>s) together with injectivity of <code>K_0(oplus) = oplus Z -&gt; K_0(prod) = prod Z</code>. No novelty should be claimed for it.</p>\n<p>For the relative invariant this node calls for, see <code><a href=\"exel-loring-relative-quasirep-invariant.html\">exel-loring-relative-quasirep-invariant</a></code>: the Exel--Loring pairing of quasi-representations against <code>H_2</code> of the group is the developed form of \"Bott index of an almost commuting pair\" at group level.</p>"}, {"id": "maximal-fiber-variance", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Exact joint covariance can retain maximal fiber variance", "impact": 0, "frontier": false, "lock": null, "html": "<p>For every proper finite binary inclusion <code>\u03b1 : F \u2192 G</code>, represent <code>G</code> diagonally on <code>\u2113\u00b2(\u011c)</code>, restrict to <code>F</code>, take the compressor to be the identity: joint <code>\u03b1\u00d7\u03b1</code> covariance and every finite-depth path identity are exact, yet a branch bit balanced on each restriction fiber has <code>\u2016B \u2212 E_{A_F}(B)\u2016\u2082\u00b2 = 1/4</code>, the maximal binary conditional variance. Works along a whole chain; deeper windows do not remove the fresh Bernoulli directions. Forces the mixed-relator-energy route <a href=\"relator-energy-variance-bound.html\">relator-energy-variance-bound</a>.</p>"}, {"id": "mf-antipodal-sign-corner-visibility", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Antipodal elements are maximally visible in the sign corner of an MF group", "impact": 0, "frontier": false, "lock": null, "html": "<p>Let <code>G</code> be a countable MF group with a central involution <code>z != 1</code>, and let <code>g in G</code> admit some <code>s in G</code> with</p>\n<pre>\ns g s^(-1) = z g.                                                 (A1)\n</pre>\n<p>Then <code>g</code> is tracially visible with constant <code>1</code>: there are models with multiplicative defect as small as desired on any prescribed finite set whose normalized trace at <code>g</code> tends to <code>0</code>, i.e. <code>||model(g)-1||_(2,norm)^2 -&gt; 2</code>.</p>\n<p>The mechanism is that the sign corner of an MF model of <code>G</code> manufactures, for free, exactly the antipodal conjugacy <code>S U S^<em> = -U</code> whose local trace-extraction certificate <code>4|tr_d(U)|^2 &lt;= ||S U S^</em> + U||_2^2</code> is already formalized.  <code>docs/TRUE_ANTIPODAL_TRACE_EXTRACTION.md</code> states the open half as \"construct or recover, in compatible matrix coordinates, a unitary <code>S</code> and a marked unitary <code>U</code> whose antipodal defect tends to zero\"; for an MF group with a central involution, <code>(A1)</code> is a sufficient group-theoretic condition.</p>\n<p>Consequently an MF group with a central involution <code>z != 1</code> is hyperlinear as soon as every nontrivial element is <code>z</code>-antipodal in the sense of <code>(A1)</code>, or lies in a finite normal subgroup, or survives in some hyperlinear quotient.</p>"}, {"id": "mf-extension-nonclosure", "status": "ESTABLISHED", "root": false, "goal": false, "title": "MF groups are not closed under extensions", "impact": 0, "frontier": false, "lock": null, "html": "<p>There is a short exact sequence whose kernel and quotient are MF but whose middle group is not MF.  Concretely, <code>1 -&gt; ClLamp(X) -&gt; W -&gt; V -&gt; 1</code> has locally finite MF kernel, residually finite MF quotient, and non-MF total group.</p>"}, {"id": "mf-finite-normal-tracially-visible", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Finite normal subgroups of an MF group are tracially visible", "impact": 2, "frontier": false, "lock": null, "html": "<p>Let <code>G</code> be a countable MF group (weak norm-matrix-corona convention) and let <code>K</code> be a finite normal subgroup of <code>G</code>.  Then every <code>g != 1</code> in <code>K</code> is tracially visible in the sense of <code><a href=\"hyperlinear-elementwise-visibility.html\">hyperlinear-elementwise-visibility</a></code>, with the explicit constant</p>\n<pre>\nc_g &gt;= c(K)/|K|,\nc(K) = min{ 1-Re(chi_sigma(h)/sigma(1)) : sigma in dual(K), h in K,\n            sigma(h) != 1 } &gt; 0.\n</pre>\n<p>In particular no nontrivial element of a finite normal subgroup of an MF group lies in the hyperlinear residual: the torsion-central mechanism which produces non-MF groups can never produce a nonhyperlinear one.</p>"}, {"id": "mf-hyperlinear-of-finite-normal-quotient", "status": "ESTABLISHED", "root": false, "goal": false, "title": "MF plus a finite normal kernel with hyperlinear quotient gives hyperlinear", "impact": 1, "frontier": false, "lock": null, "html": "<p>Let <code>G</code> be a countable MF group with a finite normal subgroup <code>N</code> such that <code>G/N</code> is hyperlinear.  Then <code>G</code> is hyperlinear.</p>\n<p>This is the norm-to-trace converter of Bachner--Dogon--Lubotzky, <em>On L^1-approximation of groups</em>, arXiv:2508.17392v3, Proposition 1.6 (verified against the source: \"Let <code>Gamma</code> be a finitely generated group with a finite normal subgroup <code>N</code> such that <code>Gamma/N</code> is hyperlinear.  If <code>Gamma</code> is MF, then it is hyperlinear.\"); the route below is an independent in-repo proof which also drops finite generation.</p>"}, {"id": "mf-hyperlinear-radical-divergence", "status": "ESTABLISHED", "root": false, "goal": false, "title": "The MF and hyperlinear radicals diverge on one explicit marked group", "impact": 1, "frontier": false, "lock": null, "html": "<p>For the literal group <code>E</code>, its central involution <code>w</code> belongs to the operator-norm MF residual but not to the hyperlinear residual.  Thus</p>\n<pre>\nRad_MF(E) is not contained in Rad_hyp(E).\n</pre>\n<p>The same group and same word exhibit the operator-norm/tracial phase transition; no change of candidate or presentation is involved.</p>"}, {"id": "mf-implies-hyperlinear", "status": "OPEN", "root": true, "goal": false, "title": "MF implies hyperlinear under the weak norm-corona convention", "impact": 0, "frontier": false, "lock": null, "html": "<p>Every MF group in the Carri\u00f3n--Dadarlat--Eckhardt norm-matrix-corona sense is hyperlinear.</p>\n<p>Operator-norm multiplicativity controls normalized Hilbert--Schmidt defect, but the defining MF embedding alone does not ensure faithful coordinate traces, so the implication is not formal from the definitions.</p>\n<h3>Ideas</h3>\n<p><strong>What the gap is.</strong>  Operator-norm separation of <code>g</code> is a rank-one phenomenon: <code>||phi_n(g)-1||_op &gt;= 1</code> only forces the trace gap <code>1-Re tr(phi_n(g)) &gt;= 1/(2d_n)</code>.  Hyperlinearity needs that gap bounded below.  So the claim is exactly the assertion that operator-visible elements can always be made <em>macroscopically</em> visible.</p>\n<p><strong>No model-by-model proof can exist.</strong>  This is established, and formalized: <code><a href=\"weak-mf-embedding-not-reusable.html\">weak-mf-embedding-not-reusable</a></code>.  Identity-block padding preserves every operator-norm distance and dilutes every Hilbert--Schmidt quantity by the relative dimension (<code>NormTraceGap</code>), the irrational-rotation representations of <code>Z</code> do the same with no multiplicative defect at all, and amplification drives distance to the scalars rather than deviation rank.  So any proof must select models and any refutation must rule out all of them.</p>\n<p><strong>The reduction is formalized.</strong>  <code>NormTraceGap.isHyperlinear_of_traced_normModels</code> already converts operator-norm models with separating traces into hyperlinear models: the trace clause is the entire remaining content.  What <code><a href=\"hyperlinear-elementwise-visibility.html\">hyperlinear-elementwise-visibility</a></code> adds is that an arbitrarily small trace gap, one element at a time, suffices.</p>\n<p><strong>Elementwise reformulation.</strong>  By <code><a href=\"hyperlinear-elementwise-visibility.html\">hyperlinear-elementwise-visibility</a></code> the claim is equivalent to the elementwise inclusion of residuals <code>Rad_hyp(G) &lt;= Rad_MF(G)</code> for every group, i.e. every MF-visible element is tracially visible.  Note <code><a href=\"mf-hyperlinear-radical-divergence.html\">mf-hyperlinear-radical-divergence</a></code> establishes the <em>opposite</em> non-inclusion for one explicit word, which is consistent and shows the two radicals are genuinely different objects.</p>\n<p><strong>Established fragments.</strong>  <code><a href=\"mf-finite-normal-tracially-visible.html\">mf-finite-normal-tracially-visible</a></code> (finite normal subgroups), <code><a href=\"mf-hyperlinear-of-finite-normal-quotient.html\">mf-hyperlinear-of-finite-normal-quotient</a></code> (= arXiv:2508.17392v3, Proposition 1.6), and the structure of any counterexample in <code><a href=\"mf-nonhyperlinear-collapse-structure.html\">mf-nonhyperlinear-collapse-structure</a></code>: its hyperlinear residual is infinite and contains no finite normal subgroup.  The torsion-central mechanism which produces the non-MF theorems therefore cannot be recycled.</p>\n<p><strong>Two live mechanisms, one constant.</strong>  Amplification (<code><a href=\"mf-implies-hyperlinear-via-rank-profile.html\">mf-implies-hyperlinear-via-rank-profile</a></code>) and invariant corners (<code><a href=\"mf-implies-hyperlinear-via-invariant-corner.html\">mf-implies-hyperlinear-via-invariant-corner</a></code>).  By <code><a href=\"corner-renormalization-cost.html\">corner-renormalization-cost</a></code> both are governed by <code>sqrt(d/r)</code>; a functor pays it in the defect, a corner pays it structurally.</p>\n<p><strong>Dead ends already recorded.</strong>  Raw tensor powers accumulate a scalar phase and can return the trace to <code>1</code>; direct sums dilute one summand's visibility by the number of summands; and no continuous homomorphism <code>U(d)-&gt;U(N)</code> beats the <code>sqrt(d)</code> loss (<code>FALSE_FERMIONIC_AMPLIFICATION.md</code>, Theorem 5).  A proof must therefore use the group, not the matrices.</p>\n<p><strong>Cost of the negative branch.</strong>  <code><a href=\"mf-refutation-yields-nonhyperlinear-group.html\">mf-refutation-yields-nonhyperlinear-group</a></code>: a counterexample is a nonhyperlinear group, so refutation is at least as hard as the program's primary target.</p>\n<p><strong>The trace-level dictionary.</strong>  Four statements, only one of which is open:</p>\n<pre>\nMF trace  =&gt; hyperlinear trace          trivial (||.||_2 &lt;= ||.||)\nhyperlinear trace =&gt; MF trace           REFUTED: <a href=\"hyperlinear-trace-not-mf-trace.html\">hyperlinear-trace-not-mf-trace</a>\nhyperlinear group =&gt; MF group           REFUTED: <a href=\"hyperlinear-not-imply-mf.html\">hyperlinear-not-imply-mf</a>\nMF group  =&gt; hyperlinear group          THIS CLAIM\n</pre>\n<p>The asymmetry is instructive.  At trace level the easy direction is the norm-to-trace one, because a trace is given; at group level the easy direction is the reverse, because a group model carries separation but no trace.  What this root asks for is exactly the missing trace.</p>\n<p><strong>Literature status (swept 2026-08-14).</strong>  No general converter is recorded. Bachner--Dogon--Lubotzky, arXiv:2508.17392v3, prove only the finite-normal kernel converters (Propositions 1.6 and 1.7) and the Deligne-type stability statement (Proposition 1.5); their abstract still calls \"whether all groups are MF\" a longstanding open problem.  Quasidiagonality of the <em>reduced</em> group C-star algebra implies amenability (Rosenberg, appendix to Hadwin, <em>Strongly quasidiagonal C-star algebras</em>, J. Operator Theory 18 (1987) 3--18) and hence hyperlinearity, but that hypothesis is far stronger than the weak norm-corona convention used here and gives nothing for it.</p>"}, {"id": "mf-invariant-corner-visibility", "status": "OPEN", "root": false, "goal": false, "title": "Every MF-visible element is visible in an invariant corner", "impact": 2, "frontier": true, "lock": null, "html": "<p>Let <code>G</code> be a countable MF group, realized by a faithful homomorphism <code>u : G -&gt; U(Q)</code> into a matrix corona, and let <code>g != 1</code>.  Then there is such a realization together with a nonzero projection <code>P</code> in <code>Q</code> with</p>\n<pre>\nu(a) P u(a)^* = P for all a in G,                                 (I1)\nlimsup Re tr_(r_n)(P u(g)) &lt; 1,                                   (I2)\n</pre>\n<p>where <code>(I2)</code> is computed in the corner <code>PQP</code>, itself a matrix corona of the lifted ranks <code>r_n</code>, with its own normalized traces.</p>\n<h3>The corner is a device, not a hypothesis</h3>\n<p><code>(I1)</code>--<code>(I2)</code> are equivalent to the corner-free statement</p>\n<pre>\n(I&#x27;) for every finite F and every delta&gt;0 there is an operator-norm local\n     model of G on F with defect delta in which Re tr(g) &lt;= 1-c_g,\n</pre>\n<p>with <code>c_g&gt;0</code> independent of <code>F</code> and <code>delta</code>.  Indeed a corner compression of a corona realization is again carried by operator-norm local models, with the corner's own normalized trace (<code><a href=\"corner-renormalization-cost.html\">corner-renormalization-cost</a></code> <code>(C1)</code>: the compression costs nothing in operator norm), which is <code>(I')</code>; conversely, given <code>(I')</code>, amplify a faithful MF realization and an <code>(I')</code>-model by identity blocks to a common dimension and take their direct sum --- operator norm data and faithfulness come from the first summand, and the trace is the average, so <code>Re tr(g) &lt;= 1-c_g/2</code> --- and then <code>P=1</code> is an invariant corner satisfying <code>(I1)</code>--<code>(I2)</code>.</p>\n<p>So what this claim really asserts is <strong>elementwise trace-controlled MF</strong>: that the weak norm-corona property can always be upgraded, one element at a time, to a model whose trace also sees that element.  The corner is how one would build such a model, not an extra assumption.  That places it in the chain</p>\n<pre>\nregular character is an MF trace  =&gt;  this claim  =&gt;  <a href=\"mf-implies-hyperlinear.html\">mf-implies-hyperlinear</a>\n</pre>\n<p>--- the first implication because the proof of <code><a href=\"regular-character-mf-trace-implies-group-mf.html\">regular-character-mf-trace-implies-group-mf</a></code> manufactures exactly such models, the second by <code><a href=\"mf-implies-hyperlinear-via-invariant-corner.html\">mf-implies-hyperlinear-via-invariant-corner</a></code>.  Both implications are strict as far as anything known here: the weak Shulman/Carrion--Dadarlat--Eckhardt convention and Schafhauser's trace-controlled one are recorded as a priori different in <code>docs/NOTEPAD.md</code>, and no group is known to separate them.</p>\n<h3>Position among the open holes</h3>\n<p>This claim is strictly stronger than the other open hole of the cluster: <code><a href=\"corner-visibility-gives-rate-profile.html\">corner-visibility-gives-rate-profile</a></code> derives <code><a href=\"mf-trace-gap-defect-ratio-models.html\">mf-trace-gap-defect-ratio-models</a></code> from it, because a trace gap bounded below makes the rate <code>epsilon_n^2/kappa_n -&gt; 0</code> automatic.  Anyone choosing between the two should work the rate claim; this one is worth stating because it records the structural mechanism and because its known instances below are proved by construction rather than by rate control.</p>\n<h3>Known instances</h3>\n<p>The claim holds, for every nontrivial element at once, in four families.</p>\n<ul>\n<li><strong>Residually finite, and more generally LEF.</strong>  The regular representation</li>\n<p>of a finite quotient separating <code>g</code> is an exact model with <code>tr(g)=0</code>.</p>\n<li><strong>Amenable.</strong>  <code>C^*(Gamma)</code> is nuclear and satisfies the UCT, and its</li>\n<p>canonical trace is faithful, so by Tikuisis--White--Winter that trace is quasidiagonal, hence an MF trace, and the proof of <code><a href=\"regular-character-mf-trace-implies-group-mf.html\">regular-character-mf-trace-implies-group-mf</a></code> turns it into operator-norm models with <code>tr(g) -&gt; 0</code>.  This is the one instance where the conclusion is a deep theorem rather than a construction.</p>\n<li><strong>Elements of a finite normal subgroup</strong>, by</li>\n<p><code><a href=\"mf-finite-normal-tracially-visible.html\">mf-finite-normal-tracially-visible</a></code>.</p>\n<li><strong>Antipodal elements over a central involution</strong>, by</li>\n<p><code><a href=\"mf-antipodal-sign-corner-visibility.html\">mf-antipodal-sign-corner-visibility</a></code>.</p>\n</ul>\n<p>Every MF group the repository can currently name falls under one of these, so the claim is not near a counterexample; the honest reading is that it asks to extend \"the regular character is an MF trace\" from the amenable and LEF cases to all MF groups.</p>\n<h3>What the corner may look like</h3>\n<p>Over a Kazhdan source the shape of an admissible corner is already constrained: by <code><a href=\"bounded-rank-corners-excluded.html\">bounded-rank-corners-excluded</a></code> a detecting corner cannot have bounded rank once the Kazhdan image has no nontrivial representations in those dimensions, so the approximate-joint-eigenvector construction is unavailable there.  Nothing in that obstruction touches the corners which <em>are</em> known to work here --- the isotypic corners of a finite normal subgroup and the sign corner of a central involution both have rank a fixed fraction of the ambient dimension.  The two statements are compatible and complementary: admissible corners must be macroscopic, and the established constructions produce exactly macroscopic ones.</p>"}, {"id": "mf-nonhyperlinear-collapse-structure", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Structure forced on a counterexample to MF implies hyperlinear", "impact": 0, "frontier": false, "lock": null, "html": "<p>For a countable group <code>G</code>, <code>hyperlinearResidual G</code> is exactly the set of elements which are not tracially visible; consequently</p>\n<pre>\nG is hyperlinear  &lt;=&gt;  hyperlinearResidual G = 1,\n</pre>\n<p>both directions, not only the direction already formalized.</p>\n<p>If in addition <code>G</code> is MF and not hyperlinear, then <code>R = hyperlinearResidual G</code> satisfies:</p>\n<p>1. <code>R != 1</code> and <code>G/R</code> is hyperlinear; 2. <code>R</code> contains no nontrivial finite normal subgroup of <code>G</code>; in particular <code>R</code> is infinite and <code>G</code> has no nontrivial finite normal subgroup with hype
