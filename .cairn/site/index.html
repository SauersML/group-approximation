/code> and <code>x |-&gt; -1</code> exactly. 4. <strong>Minimal quotient = factorial model.</strong>  The following are equivalent: <code>b_S</code> is nondegenerate on <code>V</code>; <code>Z(Vtilde_S)=&lt;z&gt;</code>; <code>A_S</code> is a factor, and then <code>A_S</code> is the hyperfinite <code>II_1</code> factor.  If moreover <code>G</code> acts faithfully on <code>X</code>, they imply that <code>&lt;z&gt;</code> is the monolith of <code>Wtilde_S</code>, so <code>Wtilde_S</code> is a <em>minimal</em> quotient of <code>H</code> in which <code>x</code> survives.  If <code>b_S</code> is degenerate, <code>L(rad b_S)</code> is a nontrivial <code>G</code>-invariant abelian subalgebra of the centre of <code>A_S</code>: the model reacquires exactly the commuting coordinate that the Kun--Thom permutation-normalization argument acts on.  The complete graph is nondegenerate and gives <code>A_S=Cl(X)</code>, so the literal Clifford model is one instance of this family, not a canonical choice forced by anything. 5. <strong>Phase rigidity: only a sign is available.</strong>  Let <code>K</code> be abelian, let <code>H_K=G *_Gamma (Gamma x K) = (*_X K) semidirect G</code>, and let the lamp part of a homomorphism factor through any <code>G</code>-equivariant central extension of <code>directSum_X K</code> with commutator pairing <code>b</code>.  Then the marked word satisfies</p>\n<pre>\n   x |-&gt; b(e_o,e_y)^(-1).\n</pre>\n<p>If some element of <code>G</code> reverses the marked pair \u2014 equivalently <code>Gamma h Gamma = Gamma h^(-1) Gamma</code> \u2014 then <code>2 b(e_o,e_y)=0</code>.  Hence at a symmetric marked double coset the only nontrivial detector value is an involution: the Clifford sign is the <em>unique</em> phase, and no root-of-unity (anyonic or paraparticle) refinement of the lamp can exist.</p>"}, {"id": "invariant-graph-crossed-product-ce", "status": "OPEN", "root": false, "goal": false, "title": "Connes embeddability of one invariant-graph Clifford crossed product", "impact": 1, "frontier": true, "lock": null, "html": "<p>For the explicit residually finite nonnormal infranormal Kazhdan pair <code>Gamma&lt;G</code>, with <code>X=G/Gamma</code>, <code>o=Gamma</code> and <code>y=h Gamma</code> the marked pair, prove that there is a <code>G</code>-invariant graph <code>S</code> on <code>X</code> with</p>\n<pre>\n{o,y} in S,        b_S nondegenerate on directSum_X F_2,\n</pre>\n<p>for which the tracial crossed product</p>\n<pre>\nM_S = A_S crossed_product G\n</pre>\n<p>is Connes embeddable, where <code>A_S</code> is the twisted group von Neumann algebra of <code>(directSum_X F_2, b_S)</code> at the central character <code>z |-&gt; -1</code>.</p>\n<p>Every such <code>A_S</code> is the hyperfinite <code>II_1</code> factor, so the difficulty is the action, not the base \u2014 as for the complete graph.  The point of the existential form is that the anticommutation pattern is a free parameter and only one member of the family has to work.  Degenerate graphs are excluded because they reintroduce a <code>G</code>-invariant abelian direction in the centre of the base, which is the coordinate the Kun--Thom permutation normalization argument acts on.</p>\n<p><strong>Few orbits yes, finite degree no \u2014 the two are not the same thing.</strong>  The minimal member of the family is the single symmetrized marked double coset <code>Gamma h Gamma</code>, and it is available: the corpus already builds it, as the orbital target <code>E_orb = K_(X,E_*) semidirect G</code> at docs/NOTEPAD.md near line 9969, where the <code>z=-1</code> lamp algebra is identified as the AF twisted group algebra <code>C*_r(directSum_X F_2, (-1)^(B_*))</code> rather than the full CAR algebra \u2014 \"a strictly weaker analytic target than the complete Clifford system\". That is the concrete witness for this claim's existential, and it is where the attack should start.</p>\n<p>What is <em>not</em> available is finite degree.  It was natural to hope that the minimal member would also be locally finite, giving a Bogoliubov action touching finitely many Majorana modes per generator \u2014 the regime where the finite-mode permutation defects of docs/FALSE_FERMIONIC_KUN_THOM_ENDPOINT.md \u00a75 could be localized. <code><a href=\"marked-double-coset-infinite-degree.html\">marked-double-coset-infinite-degree</a></code> refutes that: the marked double coset of the Laurent pair is an infinite union of left cosets, so <strong>every</strong> invariant graph containing the marked edge, the minimal one included, has infinite degree at every vertex.  The remaining freedom is in the <em>shape</em> of an infinite-degree nondegenerate graph, not in its sparsity.</p>\n<p><strong>The open sub-question this leaves.</strong>  Is the minimal member nondegenerate? Its radical is the <code>G</code>-submodule <code>ker(A)</code> of <code>F_2[X]</code>, where <code>A</code> is the <code>F_2</code> adjacency operator of the orbital graph of <code>Gamma h Gamma</code>; by <code><a href=\"invariant-graph-clifford-phase.html\">invariant-graph-clifford-phase</a></code> item 4 this vanishing is equivalent to the quotient being monolithic and to the lamp algebra being a factor.  A nonempty finite <code>F</code> in the radical would need every vertex to have an even number of <code>S</code>-neighbours in <code>F</code>; for <code>|F|=2</code> this says the two vertices are twins, <code>g Gamma h Gamma = Gamma h Gamma</code>.  Settling this decides whether the cheapest member of the family carries a factorial model or reintroduces the Cartan direction.</p>"}, {"id": "invariant-size-collapse", "status": "ESTABLISHED", "root": false, "goal": false, "title": "No strict compression under a conjugation-invariant monotone size", "impact": 0, "frontier": false, "lock": null, "html": "<p><code>Criterion/FiniteQuotientBlindness.no_strict_compression_of_invariantSize</code> (formalized). If subgroups carry a size that conjugation preserves and that distinguishes proper inclusions, then a compression is an equality. Two hypotheses, three lines. Every collapse in the development is an instance: finite sets (cardinality), f.d. spaces (finrank), finite groups (Nat.card), compact groups (Haar). The <code>II\u2081</code> trace fails the OTHER hypothesis \u2014 it is refinement-blind \u2014 and that single failure is the whole open branch.</p>\n<p>Diagnostic use: before building a model, check its category for an invariant size. Four architectures died this way; the check is minutes, the constructions were sessions.</p>"}, {"id": "iwahori-outlier-repair", "status": "OPEN", "root": false, "goal": false, "title": "Iwahori endpoint: full-rank outlier repair", "impact": 1, "frontier": false, "lock": null, "html": "<p>In the only unresolved Dogon\u2013Vigdorovich sector: an <code>o(d_n\u00b2)</code> low-energy operator space contains a matrix near the full-rank identity; use its origin from two exact modular vertex representations to turn it into an exact invertible edge intertwiner after only <code>o(d_n)</code> padding (HIGHEST_YIELD 2026-08-14). Spectral sparsity alone is insufficient \u2014 even the scalar line contains invertible matrices.</p>"}, {"id": "kazhdan-asymptotic-commutant-transport", "status": "ESTABLISHED", "root": false, "goal": false, "title": "One-sided Kazhdan transport of asymptotic commutants", "impact": 6, "frontier": false, "lock": null, "html": "<p>Let a property-(T) group map into a group <code>H</code>, and suppose conjugation by <code>s in H</code> sends its image into itself.  In every operator-norm asymptotic unitary representation of <code>H</code>, conjugation by the matrices representing <code>s</code> sends every uniformly bounded Hilbert--Schmidt asymptotic commutant of the Kazhdan image to another such asymptotic commutant.</p>"}, {"id": "kazhdan-clifford-non-mf-construction", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Kazhdan--Clifford construction of finitely presented non-MF groups", "impact": 2, "frontier": false, "lock": null, "html": "<p>Every finitely presented property-(T) group with a proper injective self-embedding yields, from any element outside the image, a finitely presented group with a nontrivial central involution killed by every norm-matrix-corona representation.  In particular the constructed group is not MF.</p>"}, {"id": "kazhdan-coboundary-collapse", "status": "OPEN", "root": false, "goal": false, "title": "The rank-normalized coboundary step of the compression collapse", "impact": 1, "frontier": true, "lock": null, "html": "<p>Steps 3-5 of docs/COMPRESSION_COLLAPSE_MF_RADICAL.md section 2: the generator-normalized rank metric produces a nonzero cocycle for the rescaled adjoint ultraproduct representation, vanishing on the compressed copy; Delorme-Guichardet makes it a coboundary with an H-fixed primitive. Delorme's theorem is already in-repo (Delorme.exists_fixed_point_of_hasKazhdanPropertyT), as is Kazhdan finite generation; the only input beyond packaging is [[<a href=\"corona-commuting-torsion-lifts.html\">corona-commuting-torsion-lifts</a>]].</p>"}, {"id": "kazhdan-invariant-subspace-generates", "status": "OPEN", "root": false, "goal": false, "title": "The Kazhdan-invariant vectors generate the coordinate ultraproduct", "impact": 1, "frontier": true, "lock": null, "html": "<p>Let the transport data be as in <code><a href=\"coordinate-ultraproduct-transport.html\">coordinate-ultraproduct-transport</a></code>, let <code>Theta</code> be a corona representation of <code>H</code> with models <code>U_n</code> <strong>which detects the central mark</strong>, <code>Theta(z) != 1</code>, let <code>H_omega = prod_omega C^{d_n}</code>, and let <code>P</code> be the projection onto the <code>iota(Gamma)</code>-invariant vectors.  Then the closed <code>tilde U(H)</code>-invariant subspace generated by <code>ran P</code> is all of <code>H_omega</code>.</p>\n<p>The mark-detection hypothesis is not decoration: without it the statement is false, by <code><a href=\"finite-dimensional-models-break-coordinate-generation.html\">finite-dimensional-models-break-coordinate-generation</a></code>.  It is also harmless to the route, since a model that already kills the mark needs no argument.</p>\n<p>Granting this, the central mark dies with no spectral input whatever: <code>eps</code> is central, so <code>tilde U(eps)</code> commutes with <code>tilde U(H)</code>; by <code><a href=\"coordinate-ultraproduct-transport.html\">coordinate-ultraproduct-transport</a></code> clause 3 it acts as the identity on <code>ran P</code>; hence it acts as the identity on every <code>tilde U(h) ran P</code>, hence on their closed span, which is <code>H_omega</code>.  So <code>tilde U(eps) = 1</code>, and since the coordinate ultraproduct action carries the corona operator norm, <code>Theta(eps) = 1</code>.</p>\n<h3>Ideas</h3>\n<p><strong>Why this replaces the earlier formulation.</strong>  The node this supersedes, <code>coordinate-invariant-vector-detects-mark</code>, asked for a Kazhdan-invariant vector that the mark moves.  That is not a reduction: clause 3 of <code><a href=\"coordinate-ultraproduct-transport.html\">coordinate-ultraproduct-transport</a></code> says no Kazhdan-invariant vector is moved by the mark, so the earlier claim was, given clause 3, logically equivalent to the target rather than a step toward it.  A route built on it renamed the problem.  The present formulation has content because it can fail \u2014 see the next paragraph \u2014 and because it does not mention the mark at all.</p>\n<p><strong>How it fails, and what that costs.</strong>  <code>ran P</code> can be zero.  A property-(T) group has no almost-invariant vectors in a representation bounded away from the trivial one, and the finite-quotient models of a residually finite group typically give <code>P = 0</code>; inflating a single finite-dimensional representation with no invariant vectors makes this explicit (<code><a href=\"finite-dimensional-models-break-coordinate-generation.html\">finite-dimensional-models-break-coordinate-generation</a></code>).  So this claim is a demand on the architecture: mark-detecting models of <code>H</code> must be forced to contain the trivial representation of <code>iota(Gamma)</code> asymptotically.  The consequence for any future proof is sharp \u2014 it must use <code>Theta(z) != 1</code> from the start and manufacture the Kazhdan-invariant vectors <strong>from</strong> the survival of the mark, since no argument treating all corona models alike can work.  That is the honest price of the coordinate route.  Contrast the adjoint side, where the same demand is free: the unitary <code>U_n(c)</code> is itself a nonzero <code>iota(Gamma)</code>-invariant Hilbert--Schmidt vector, which is exactly why the manuscript's transport is unconditional and exactly why it concludes only in the <code>2</code>-norm.</p>\n<p><strong>A weaker sufficient form.</strong>  Generation is more than needed.  It suffices that the <code>tilde U(H)</code>-invariant subspace generated by <code>ran P</code> contain a vector on which <code>tilde U(eps)</code> acts nontrivially \u2014 or, since <code>eps</code> is central and its spectral projections exist in <code>B(H_omega)</code> and commute with <code>tilde U(H)</code>, that <code>ran P</code> meet every nonzero spectral subspace of <code>tilde U(eps)</code>.  Any of these forms would do; generation is the cleanest to state.</p>"}, {"id": "kazhdan-projection-not-in-l1", "status": "ESTABLISHED", "root": false, "goal": false, "title": "The Kazhdan projection is not integrable, so averaging cannot reach the operator norm", "impact": 0, "frontier": false, "lock": null, "html": "<p>Let <code>Gamma</code> be an infinite group with property (T) and <code>p</code> its Kazhdan projection in <code>C*_max(Gamma)</code>.  Then <code>p</code> is <strong>not</strong> in the image of <code>l^1(Gamma)</code>, and the random-walk averages <code>mu^{*n}</code>, which converge to <code>p</code> in the <code>C*_max</code> norm, are not <code>l^1</code>-Cauchy.</p>\n<p>Consequence.  An isometric action of <code>Gamma</code> on a Banach space <code>A</code> extends to <code>l^1(Gamma)</code> and, absent a Hilbertian structure, to nothing larger; so the fixed-point projection cannot be manufactured by averaging.  In the norm matrix corona <code>Q</code> with its operator norm \u2014 where <code>Ad Theta</code> is an isometric action and <code>Q</code> is not Hilbertian \u2014 the operator <code>Ad Theta(p)</code> is simply not defined.  This is why every property-(T) argument in this cluster first moves to the adjoint corona on Hilbert--Schmidt spaces, where the action <em>is</em> unitary and <code>p</code> does act, and why each such argument therefore terminates in the <code>2</code>-norm.</p>\n<p>Scope, stated plainly: this closes averaging as a route to <code><a href=\"corona-commutant-no-growth.html\">corona-commutant-no-growth</a></code>.  It says nothing against K-theoretic, saturation, or stability arguments, which do not use <code>p</code>.</p>"}, {"id": "kazhdan-projection-rounding", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Almost-invariant projections round into the relative commutant", "impact": 0, "frontier": false, "lock": null, "html": "<p>Let <code>Gamma</code> have property <code>(T)</code> with Kazhdan set <code>S</code> and constant <code>kappa</code>, let <code>pi:G-&gt;U(M)</code> with <code>M</code> finite tracial, and <code>N=M cap pi(Gamma)'</code>.  For every projection <code>p in M</code> there is a projection <code>q in N</code> with</p>\n<pre>\n||p-q||_2 &lt;= (1+sqrt2) kappa^(-1) max_(s in S) ||[pi(s),p]||_2.\n</pre>\n<p>The proof is three exact steps: property <code>(T)</code> applied to the trace-preserving action on <code>L^2(M)</code>, whose fixed space is <code>L^2(N)</code> and whose orthogonal projection is the conditional expectation <code>E_N</code>; the identity <code>||p-E_N(p)||_2^2 = tau(a(1-a))</code> for <code>a=E_N(p)</code>, which uses only that <code>E_N</code> is a trace-preserving <code>N</code>-bimodule map; and spectral rounding of <code>a</code> at <code>1/2</code>, using <code>(t-chi_([1/2,1])(t))^2 &lt;= 2t(1-t)</code> on <code>[0,1]</code>.</p>\n<p><strong>Scope, which is the point.</strong>  This is the conditional-expectation form of the gap, and it does <em>not</em> give a trace dichotomy.  Concluding that <code>tau(p)</code> is near <code>0</code> or <code>1</code> needs <code>N</code> to have no projection of intermediate trace, and a diffuse <code>N</code> carries projections of every trace in <code>[0,1]</code>.  So the obstacle in converting spectral gap into \"small commutator energy implies small trace on one side\" is not the vector-state form of <code>(T)</code> -- that upgrades cleanly -- but the structure of the relative commutant, which is the same missing input recorded by <code><a href=\"invariant-size-collapse.html\">invariant-size-collapse</a></code>.</p>"}, {"id": "kervaire-laudenbach-holds-for-hyperlinear", "status": "ESTABLISHED", "root": false, "goal": false, "title": "The Kervaire--Laudenbach conjecture holds for hyperlinear groups", "impact": 1, "frontier": false, "lock": null, "html": "<p><strong>Terminology.</strong> Nitsche--Thom, <em>Universal solvability of group equations</em>, J. Group Theory 25 (2022) 1--10, arXiv:1811.07737v2, define: \"a Connes-embeddable group is by definition a group which can be embedded into a certain metric ultraproduct of unitary groups\".  That is hyperlinearity; the two words are interchangeable below.</p>\n<p><strong>The Kervaire--Laudenbach conjecture</strong>, as they state it: for one equation in one variable, <code>w in Z * G</code>, the conjecture \"predicts that <code>w</code> can be solved in a group containing <code>G</code> if <code>epsilon(w) != 0 in Z</code>\", where <code>epsilon</code> is the augmentation killing <code>G</code>.</p>\n<p><strong>It is a theorem for hyperlinear groups.</strong>  Their Theorem 1.2, attributed to Gerstenhaber--Rothaus and Pestov: for <code>G</code> Connes-embeddable and <code>w_1,...,w_k in F_n * G</code>, if the presentation complex of <code>&lt;x_1,...,x_n | epsilon(w_1),...,epsilon(w_k)&gt;</code> has trivial second homology, the system is solvable in a group <code>H</code> containing <code>G</code>; if <code>G</code> is finite, <code>H</code> can be taken finite.  Their following sentence: \"This proves the original Kervaire--Laudenbach Conjecture for Connes-embeddable groups, a large class of groups which includes all sofic groups, and to which to date no counterexamples are known.\"</p>\n<p>Their own main result strengthens the hypothesis to a covering condition:</p>\n<p>&gt; <strong>Theorem 1.3.</strong> Let <code>G</code> be a Connes-embeddable group and let &gt; <code>w_1,...,w_k in F_n * G</code>.  If the presentation complex of &gt; <code>&lt;x_1,...,x_n | epsilon(w_1),...,epsilon(w_k)&gt;</code> admits a covering with &gt; trivial second homology, then the system of equations <code>w_1,...,w_k</code> is &gt; solvable in a group containing <code>G</code>.</p>\n<p>They note this \"proves the first part of Conjecture 1.1 for Connes-embeddable groups\" \u2014 Conjecture 1.1 being the <em>generalized</em> Kervaire--Laudenbach conjecture of Klyachko--Thom \u2014 and record (their item (2) in Section 2) that when <code>G</code> is Connes-embeddable the system can be solved inside a Connes-embeddable overgroup.</p>\n<h3>Citation correction</h3>\n<p>The OpenAI nonsofic chapter (see <code><a href=\"openai-leavitt-unit-nonsofic.html\">openai-leavitt-unit-nonsofic</a></code>) writes that Kervaire--Laudenbach \"holds for every hyperlinear group [NT22, Theorem 1.3]\". Theorem 1.3 does imply it, being strictly more general, but the <em>original</em> Kervaire--Laudenbach conjecture for hyperlinear groups is their <strong>Theorem 1.2</strong>, credited there to <strong>Gerstenhaber--Rothaus and Pestov</strong>.  Cite Theorem 1.2 (and Gerstenhaber--Rothaus/Pestov) for the plain statement, and Theorem 1.3 only when the generalized or multi-equation form is wanted.</p>"}, {"id": "kl-violating-equation-over-leavitt-unit-group", "status": "OPEN", "root": false, "goal": false, "title": "A Kervaire--Laudenbach-violating equation over the binary Leavitt unit group", "impact": 1, "frontier": true, "lock": null, "html": "<p>Exhibit a one-variable equation <code>w in Z * R^x</code>, where <code>R^x = L_(F_2)(1,2)^x</code> is the binary Leavitt unit group, with nonzero total exponent <code>epsilon(w) != 0</code>, that has <strong>no</strong> solution in any group containing <code>R^x</code>.</p>\n<p>By <code><a href=\"kervaire-laudenbach-holds-for-hyperlinear.html\">kervaire-laudenbach-holds-for-hyperlinear</a></code> such an equation cannot exist over a hyperlinear group, so producing one would prove <code>R^x</code> nonhyperlinear.</p>\n<p><strong>Explicitly conjectural, and hard for a reason that must be stated.</strong>  No Kervaire--Laudenbach-violating equation is known over <strong>any</strong> group at all. Nitsche--Thom record that the conjecture is one \"to which to date no counterexamples are known\".  So this claim does not merely ask for a computation over a particular group: it asks to refute the Kervaire--Laudenbach conjecture itself, and to do so over a group whose hyperlinearity is exactly what is in question.  Nobody should treat it as a tractable target.</p>\n<p><strong>Its real value is as an instrument, in two directions.</strong></p>\n<p>1. <em>Falsification.</em>  It is a cheap sanity check on any candidate: before investing in a nonhyperlinearity argument for a group, one may look for an obvious KL obstruction, and finding none costs little. 2. <em>Structural constraint.</em>  Contrapositively, any proof that a group is nonhyperlinear must be consistent with KL-solvability over it \u2014 every one-variable equation of nonzero total exponent must still be solvable in some overgroup, or else the argument has proved something far stronger than intended and should be suspected.  This is a standing consistency condition on the whole <code><a href=\"non-hyperlinear-group.html\">non-hyperlinear-group</a></code> programme, not only on this route.</p>\n<p>The binary Leavitt unit group is a reasonable place to look only because it is unusually concrete for equation-solving \u2014 explicit generators and relations, a prefix-code normal form \u2014 and because it is the one group now known to be nonsofic whose hyperlinearity is open.</p>"}, {"id": "kt-centralizer-normalization-hs", "status": "OPEN", "root": false, "goal": false, "title": "Hilbert\u2013Schmidt analogue of Kun\u2013Thom centralizer normalization", "impact": 1, "frontier": true, "lock": null, "html": "<p>Let <code>\u0393 &lt; G</code> be an infranormal, non-normal Kazhdan pair and let <code>\u03c3 : G \u2192 U(\u220f_\ud835\udcb0 M_(d_n))</code> be a trace-preserving (hyperlinear) representation. Is the relative commutant <code>\u03c3(\u0393)' \u2229 \u220f_\ud835\udcb0 M_(d_n)</code> normalized by <code>\u03c3(G)</code>?</p>\n<p>This is Kun\u2013Thom Theorem 4.1 with <code>\ud835\udcae_\ud835\udcb0</code> replaced by the unitary group of the tracial ultraproduct. <strong>A positive answer refutes hyperlinearity of <code>W</code></strong>, by transcribing their proof of Theorem A verbatim: <code>\u0393</code> fixes the coset <code>\u0393</code>, so <code>\u03c1(a_\u0393)</code> lies in the relative commutant; normalization puts every <code>\u03c1(a_(g\u0393)) = \u03c1(g)\u03c1(a_\u0393)\u03c1(g)\u207b\u00b9</code> there too; but for a strict compressor <code>t</code> and <code>\u03b3 \u2208 \u0393 \\ t\u0393t\u207b\u00b9</code> one has <code>\u03c3(\u03b3)\u03c1(a_(t\u0393))\u03c3(\u03b3)\u207b\u00b9 = \u03c1(a_(\u03b3t\u0393)) \u2260 \u03c1(a_(t\u0393))</code>, the two lamps being at <code>\u2016\u00b7\u2016\u2082</code>-distance <code>\u221a2</code>.</p>\n<h3>Why it is not a corollary of the permutation version</h3>\n<p>Kun\u2013Thom's proof of Theorem 4.1 runs on the finite cluster groupoid of almost equivariant partial bijections between the <code>\u0393</code>-expander components: two median arguments, one on the <strong>vertex mass</strong> of a connected groupoid component and one on the <strong>order of its isotropy group</strong>, force a transported functor to be full. Both invariants are counting invariants of a permutation action on a point set. In the Hilbert\u2013Schmidt category:</p>\n<ul>\n<li>property (T) still supplies the analogue of expansion for free \u2014 an action of</li>\n<p>a Kazhdan group on a tracial von Neumann algebra has a spectral gap on <code>L\u00b2(M) \u2296 L\u00b2(M^\u0393)</code> \u2014 so the <em>expansion</em> input is not the obstacle;</p>\n<li>what is missing is the <em>component structure</em>. Kun\u2013Thom's Lemma 2.3 identifies</li>\n<p><code>D_\ud835\udcb0^(\u03c3(\u0393))</code> with <code>\u220f_\ud835\udcb0 D(Q_n)</code>, an <strong>atomic</strong> partition algebra whose cells have sizes. The fixed algebra <code>\u03c3(\u0393)' \u2229 \u220f_\ud835\udcb0 M_(d_n)</code> of a hyperlinear approximation need not be atomic \u2014 for <code>\u03c3 \u2297 1</code> it contains a <code>II\u2081</code> factor \u2014 so there are no component sizes and no isotropy orders to run medians on.</p>\n</ul>\n<p>This is the decisive open sub-claim on the rigidity side. It is <em>a priori</em> independent of <code><a href=\"invariant-cartan-completion.html\">invariant-cartan-completion</a></code>: that one goes through Corollary D and an invariant masa, this one through Theorem A and a relative commutant, and neither is known to imply the other. Both, if established, refute <code><a href=\"hyperlinear-wreath-model.html\">hyperlinear-wreath-model</a></code>; both, if refuted, are consistent with either answer to Q3.4.</p>\n<p><code><a href=\"hs-expander-block-decomposition.html\">hs-expander-block-decomposition</a></code> is the natural first input \u2014 it is the HS transcription of Kun's decomposition, which is what Kun\u2013Thom feed into Theorem 4.1 \u2014 but it is not recorded as a <code>requires</code> here, because even with a decomposition in hand the two median arguments have no evident HS form: the quantities they compare are a component's vertex mass and its isotropy order, and neither survives when the blocks are matrix corners rather than orbits.</p>\n<h3>Position relative to Alekseev\u2013Thom Open Problem 6.2</h3>\n<p>Open Problem 6.2 of arXiv:2608.05362 \u2014 statement checked against the full text in <code>docs/CREDIT_AND_PRIORITY_AUDIT.md</code> \u2014 asks whether the commutant of a Kazhdan representation into a tracial matrix ultraproduct is an ultraproduct of finite-dimensional subalgebras, i.e. whether it admits a <strong>coordinate description</strong> by centralizers of lifts. This claim asks a different question about the same object: not how the commutant is described, but whether it is <strong>normalized</strong> by the ambient group.</p>\n<p>The two are adjacent and the dependence runs one way. A positive answer to OP 6.2 would supply, in the Hilbert\u2013Schmidt category, exactly the coordinate structure that Kun\u2013Thom's proof consumes \u2014 components with masses and isotropy groups on which medians can be run \u2014 and would therefore be the natural first input here. A negative answer would say the coordinate picture fails already at the description stage, which is where the flexible side expects the room to be. Nothing here resolves OP 6.2, and this node must not be read as a claim on it: OP 6.2 is a published open problem of Alekseev and Thom, and the repository's interest is the downstream invariance question.</p>\n<p>The same adjacency holds one metric class over. In any metric ultraproduct of finite groups the ultraproduct commutant strictly contains the ultraproduct of the coordinate centralizers, because the coordinate maps are approximate rather than genuine homomorphisms; so OP 6.2's difficulty is present in the bi-invariant category too and is not an artefact of unitaries.</p>\n<p>Adjacent, and worth reading before attacking: Alekseev\u2013Thom arXiv:2608.05362, whose conclusion is that the centralizer of a sofic embedding of a Kazhdan group is itself a metric ultraproduct of <strong>permutation</strong> groups. The permutation-specificity of that conclusion is exactly the point at issue here.</p>"}, {"id": "kun-thom-clifford-cover-weakly-sofic", "status": "ESTABLISHED", "root": false, "goal": false, "title": "The Kun--Thom Clifford cover is weakly sofic and not sofic", "impact": 1, "frontier": false, "lock": null, "html": "<p>Let <code>Gamma&lt;G</code> be the Kun--Thom Theorem E pair, <code>S</code> a <code>G</code>-invariant graph on <code>X=G/Gamma</code> with <code>b_S(o,y)=1</code>, <code>Vtilde_S</code> the central <code>F_2</code>-extension of <code>directSum_X F_2</code> with commutator form <code>b_S</code>, and <code>E_S=Vtilde_S semidirect G</code>. Then <code>E_S</code> is <strong>weakly sofic</strong> and <strong>not sofic</strong>.</p>\n<p><code>Vtilde_S</code> is locally finite, hence sofic; <code>E_S/Vtilde_S=G</code> is residually finite; Glebsky's permanence theorem applies.  Nonsoficity is the established radical phase: the marked word <code>x</code> lies in <code>Rad_sof(H)</code> and maps to <code>z!=1</code>.</p>\n<p><strong>Consequence for Question 3.4.</strong>  Composed with the established <code><a href=\"hilbert-embeddable-length-hyperlinearity.html\">hilbert-embeddable-length-hyperlinearity</a></code>, this makes the Clifford cover a proven member of the family targeted by <code><a href=\"hilbert-embeddable-witness-for-kun-thom-wreath.html\">hilbert-embeddable-witness-for-kun-thom-wreath</a></code>: if the Glebsky witnesses for <code>E_S</code> have conditionally negative definite lengths, then <code>E_S</code> is hyperlinear and nonsofic.  The composite models are HS-almost-multiplicative but need not be operator-norm almost multiplicative, since a unitary of trace near one may have eigenvalues near <code>-1</code> on a corner of vanishing rank; that is exactly the defect profile required by <code><a href=\"wall-models-avoid-norm-microstates.html\">wall-models-avoid-norm-microstates</a></code>, so the two routes are consistent.</p>\n<p><strong>Consequence for the wall.</strong>  Since the wall normal form (<code><a href=\"relative-wall-commutant-growth.html\">relative-wall-commutant-growth</a></code>) is a statement about an arbitrary target group, the full Clifford wall -- an involution centralizing <code>pi(t Gamma t^(-1))</code> whose <code>Gamma</code>-conjugate anticommutes with it -- is realized in a metric ultraproduct of finite groups with bi-invariant metrics, with the radical word surviving.  Hence <strong>no purely group-theoretic argument can refute the wall</strong>: every no-go must use the metric.  The growth index of <code><a href=\"compressor-growth-index-homomorphism.html\">compressor-growth-index-homomorphism</a></code> is such a tool, since it needs a trace and a Pimsner--Popa index that a metric ultraproduct of finite groups does not carry.</p>"}, {"id": "kun-thom-clifford-crossed-product-ce", "status": "OPEN", "root": false, "goal": false, "title": "Connes embeddability of the Kun--Thom Clifford crossed product", "impact": 2, "frontier": true, "lock": null, "html": "<p>For the explicit residually finite nonnormal infranormal Kazhdan pair <code>Gamma&lt;G</code>, prove that the canonical tracial algebra</p>\n<pre>\nCl(G/Gamma) crossed_product G\n</pre>\n<p>is Connes embeddable.  The Clifford base is hyperfinite, but arbitrary crossed-product permanence is unavailable and the coset action is the nonsofic action at the heart of the Kun--Thom theorem.</p>\n<h3>Ideas</h3>\n<p><strong>Position in the lane.</strong>  This claim is the <em>strongest</em> member of a chain whose weakest member already answers Q3.4:</p>\n<pre>\n<a href=\"kun-thom-clifford-crossed-product-ce.html\">kun-thom-clifford-crossed-product-ce</a>\n  =&gt; <a href=\"kun-thom-clifford-relative-wall.html\">kun-thom-clifford-relative-wall</a>   (anticommuting wall)\n  =&gt; <a href=\"bare-relative-wall-exists.html\">bare-relative-wall-exists</a>          (v != pi(h) v pi(h)^*)\n  =&gt; <a href=\"hyperlinear-nonsofic-group.html\">hyperlinear-nonsofic-group</a>\n</pre>\n<p>and, by the diagonal doubling <code>c_x tensor c_x</code> of <code>TRUE_DOUBLE_CLIFFORD_KUN_THOM_REDUCTION.md</code>, it also implies Connes embeddability of <code>L(W)=L^infinity({-1,1}^(G/Gamma)) crossed_product G</code>, i.e. hyperlinearity of the Kun--Thom wreath group itself.  No reduction runs backwards.  Effort spent here buys everything, but it is priced accordingly; <code><a href=\"bare-relative-wall-exists.html\">bare-relative-wall-exists</a></code> is the cheapest sufficient statement in the lane and is now a first-class node.</p>\n<p>Two of the apparent extra costs are now known to be illusory or real:</p>\n<ul>\n<li>the <em>trace energy</em> of the wall is free (<code><a href=\"wall-energy-amplification.html\">wall-energy-amplification</a></code>:</li>\n<p>diagonal tensor powers push any wall to squared energy <code>&gt;=2</code>);</p>\n<li>the <em>anticommutation</em> is not free.  Amplification gives</li>\n<p><code>v_k w_k=(vw)^(tensor k)</code>, so the Clifford sign is a genuine strengthening. The precise gap between <code><a href=\"bare-relative-wall-exists.html\">bare-relative-wall-exists</a></code> and the Clifford wall is: can a bare wall be \"Clifford-ified\"?  That is the one question whose answer would collapse this claim's lane onto the cheapest one.</p>\n</ul>\n<p><strong>Why the Clifford lane exists at all.</strong>  Kun--Thom Corollary D says the generalized Bernoulli p.m.p. action <code>G -&gt; (K,kappa)^(G/Gamma)</code> is not sofic, and the Cartan/chart reverse-transfer kills every coordinate model of <code>L(W)</code>. <code>Cl(X)</code> is a factor with no <code>G</code>-invariant Cartan, so there are no coordinates to pull the chart obstruction back along.  That is a constructive advantage only; logically the Clifford claim is above the Bernoulli one.</p>\n<p><strong>Status of the trace-blindness question.</strong>  Yes, trace-blindness works <em>for</em> this program, but only defensively and only so far:</p>\n<ul>\n<li>the finite-dimensional/profinite route is dead</li>\n<p>(<code><a href=\"infranormal-compact-closure-normal.html\">infranormal-compact-closure-normal</a></code>): in every compact image the closure of <code>Gamma</code> is normal, so the quasi-regular first chaos is not even a pointed weak limit of finite-dimensional representations;</p>\n<li>the mechanism that kills it is a cardinality count \u2014 isotropy orders and</li>\n<p>orbit cardinalities in Kun--Thom Theorem 4.1, linear dimension in <code><a href=\"commutant-no-growth.html\">commutant-no-growth</a></code> \u2014 and that count has <em>no informative normalized shadow</em> (<code><a href=\"commutant-density-trace-blind.html\">commutant-density-trace-blind</a></code>: the normalized commutant density is a character invariant, hence exactly equal for <code>Gamma</code> and <code>t Gamma t^(-1)</code>, and identically <code>0</code> for every model in play);</p>\n<li>the surviving II_1 substitute is the Pimsner--Popa index</li>\n<p>(<code><a href=\"relative-wall-commutant-growth.html\">relative-wall-commutant-growth</a></code>, Corollary 5), and <code><a href=\"clifford-compressor-site-growth.html\">clifford-compressor-site-growth</a></code> computes it inside <code>M_Cl</code>: infinite at every strict positive compressor, with the new Clifford modes indexed by <code>L_+ minus L_+ s</code>, the failure of right divisibility in the compression monoid.</p>\n</ul>\n<p>So no counting invariant can refute this claim; a refutation must come from flexible normalized-Hilbert--Schmidt stability of <code>G</code> (or already of the ascending HNN subgroup <code>&lt;Gamma,t&gt;</code>), which restores an exact representation and with it the exact count.  That is the fork, and it is genuinely open: the known 2-Kazhdan/cohomological results give <em>unnormalized Frobenius</em> stability, which is on the wrong side of the normalization firewall (<code>TRUE_CLIFFORD_HYPERLINEARITY_FORCES_AMBIENT_HS_INSTABILITY.md</code>, Section 4).</p>\n<p><strong>What the shape of the required model is.</strong>  The tower <code>N &lt; Ad pi(t)(N) &lt; Ad pi(t)^2(N) &lt; ...</code> demanded by Corollary 5 has infinite index at every step in <code>M_Cl</code>.  That shape is harmless on its own: the one-sided Clifford shift <code>c_n |-&gt; c_(n+1)</code> is an infinite-index endomorphism of the hyperfinite II_1 factor, so an infinite-index compressor tower already exists inside <code>R</code>.  What is missing is coherence of the tower with the whole property-<code>(T)</code> group, i.e. the coherent Bogoliubov-innerness problem <code>(DCK15)</code>.  Any construction attempt should start from a shift on a one-sided Clifford half-space carrying the <code>L_+</code>-indexed site set of <code><a href=\"clifford-compressor-site-growth.html\">clifford-compressor-site-growth</a></code>, and the difficulty should be located exactly at the elements of <code>L</code> that leave <code>L_+</code>.</p>\n<p><strong>Dead, do not redo:</strong> honest finite-dimensional/compact Bogoliubov models (<code><a href=\"infranormal-compact-closure-normal.html\">infranormal-compact-closure-normal</a></code>); Gaussian second quantization of <code>lambda_(G/Gamma)</code> (the Gaussian action <em>is</em> a generalized Bernoulli action, so Kun--Thom Corollary D plus the Hayes entropy computation excludes full Wick-moment models); Definition-4.23 chart models with any target class (<code><a href=\"lamp-charts-recover-set-action.html\">lamp-charts-recover-set-action</a></code>, route <code><a href=\"halo-chart-clifford-model.html\">halo-chart-clifford-model</a></code>); exact <code>G</code>-invariant AF/profinite filtrations (<code><a href=\"profinite-action-fixed-algebra-invariant.html\">profinite-action-fixed-algebra-invariant</a></code>, route <code><a href=\"profinite-clifford-filtration.html\">profinite-clifford-filtration</a></code>); operator-norm/weak-MF certificates (the central sign is invisible there \u2014 <code><a href=\"central-sign-corona-obstruction.html\">central-sign-corona-obstruction</a></code>, Proposition 8 of the perfect-core note); any model whose commutant growth is finite index at a positive elementary transvection (Corollary 7 of the wall note, and <code><a href=\"clifford-compressor-site-growth.html\">clifford-compressor-site-growth</a></code> for the values).</p>\n<p><strong>Do not re-open as separate routes:</strong> the full Majorana crossed product, the even CAR core, and a Connes-embeddable character seeing <code>z</code> are one problem (<code><a href=\"clifford-ce-targets-are-equivalent.html\">clifford-ce-targets-are-equivalent</a></code>), and an operator-norm certificate for them is impossible, not merely unavailable (<code><a href=\"kun-thom-clifford-extension-not-weak-mf.html\">kun-thom-clifford-extension-not-weak-mf</a></code>).  The Bernoulli corner is <em>implied</em> by this one (<code><a href=\"clifford-ce-implies-bernoulli-ce.html\">clifford-ce-implies-bernoulli-ce</a></code>), so this claim is equivalent to hyperlinearity of the whole cover <code>Wtilde</code>, and the deduction chain down to Q3.4 is <code><a href=\"thom-central-corner-criterion.html\">thom-central-corner-criterion</a></code> (Thom Lemma 3.3 and Remark 3.4, source-verified) or, more cheaply, the radical collision, which needs no central-quotient theorem at all.</p>\n<p><strong>Cheaper instances worth preferring.</strong>  <code><a href=\"invariant-graph-crossed-product-ce.html\">invariant-graph-crossed-product-ce</a></code> asks only for <em>some</em> nondegenerate <code>G</code>-invariant graph, not the complete one; <code>docs/NOTEPAD.md</code> (near line 9969) gives the concrete sparse instance, the orbital graph of one symmetric double coset, whose <code>z=-1</code> lamp algebra is the AF twisted algebra <code>C_r^<em>(directSum_X F_2,(-1)^(B_</em>))</code> and whose Bogoliubov action is far more local than the complete one.  If a construction is going to be attempted at all, attempt it there.</p>"}, {"id": "kun-thom-clifford-extension-not-weak-mf", "status": "ESTABLISHED", "root": false, "goal": false, "title": "The Kun--Thom Clifford extension is not weak MF", "impact": 1, "frontier": false, "lock": null, "html": "<p>Let <code>Gamma&lt;G</code> be a Kazhdan pair with a strict compressor <code>t</code>, so <code>t Gamma t^(-1) &lt; Gamma</code>.  Put <code>X=G/Gamma</code> and let</p>\n<pre>\nE = Vtilde semidirect G\n</pre>\n<p>be <strong>either</strong> the complete <strong>or</strong> the sparse Kun--Thom Clifford extension, whose lamp group is generated by a central involution <code>z</code> and involutions <code>c_x</code> with <code>c_x c_y = z c_y c_x</code> for <code>x != y</code>.  Then every homomorphism</p>\n<pre>\nTheta : E -&gt; U(product_n M_(d_n) / directSum_n M_(d_n))\n</pre>\n<p>sends <code>z</code> to <code>1</code>.  In particular <code>E</code> is <strong>not</strong> weak/operator-norm MF.</p>\n<h3>Consequence: the negative corner is not merely missing, it is forbidden</h3>\n<p>Cutting an MF model to the canonical <code>z=-1</code> corner is a legitimate rank-renormalization \u2014 it removes relative-rank blindness, and after cutting, operator-norm defect dominates normalized Hilbert--Schmidt defect with the Clifford wall at squared norm <code>2</code>.  But this theorem says the corner never exists.  From <code>docs/FALSE_CLIFFORD_NORM_MF_STERILITY.md</code>:</p>\n<p>&gt; 1. The theorem above says that a nonzero negative corner cannot occur in &gt;    any norm-matrix representation of the Kun--Thom Clifford group.  Thus &gt;    the desired MF hypothesis is not merely missing; it is false.</p>\n<p>A second, independent obstruction is recorded there: even without sterility, cutting a faithful norm-ultraproduct representation to one central sector need not stay faithful, so the corner homomorphism could fail to be injective. To get a hyperlinear nonsofic image from a nonfaithful corner one would need a surviving element known to lie in the full sofic radical.</p>\n<h3>Sibling result</h3>\n<p>The same conclusion holds for the perfect even cover: Proposition 8 of <code>docs/PERFECT_CORE_KUN_THOM_WREATH.md</code> proves that every homomorphism from <code>E_(Cl,0)</code> to a norm matrix ultraproduct kills <code>z</code>, so <code>E_(Cl,0)</code> is not weak MF either. That retires the conditional certificate of its Theorem 7, which would have derived Connes embeddability of the canonical CAR trace from weak MF of the even cover.</p>"}, {"id": "kun-thom-clifford-radical-phase", "status": "ESTABLISHED", "root": false, "goal": false, "title": "The Kun--Thom sofic-radical word has an exact Clifford phase detector", "impact": 5, "frontier": false, "lock": null, "html": "<p>For a nonnormal infranormal Kazhdan pair <code>Gamma&lt;G</code>, put</p>\n<pre>\nH = G *_Gamma (Gamma x C2) = &lt;G,k | k^2=1, [k,Gamma]=1&gt;.\n</pre>\n<p>Choose <code>h=t^(-1) gamma t</code> outside <code>Gamma</code>, set <code>r=[k,h]</code>, and <code>x=[k,r]</code>.  Kun--Thom centralizer normalization gives <code>x in Rad_sof(H)</code>.  In the Clifford crossed product <code>Cl(G/Gamma) crossed_product G</code>, the representation <code>k |-&gt; c_Gamma</code> satisfies <code>r |-&gt; c_Gamma c_(hGamma)</code> and therefore <code>x |-&gt; -1</code>.</p>"}, {"id": "kun-thom-clifford-relative-wall", "status": "OPEN", "root": false, "goal": false, "title": "Finite normalized-HS Clifford wall for the Kun--Thom pair", "impact": 2, "frontier": false, "lock": null, "html": "<p>Construct normalized-Hilbert--Schmidt almost-representations <code>rho_n:G-&gt;U(d_n)</code> and self-adjoint involutions <code>C_n</code> such that <code>C_n</code> asymptotically commutes with every fixed element of <code>Gamma</code>, while</p>\n<pre>\nC_(h,n)=rho_n(h) C_n rho_n(h)^*,\n||C_n C_(h,n)+C_(h,n) C_n||_2 -&gt; 0.\n</pre>\n<p>These two conditions extend the models to the free-lamp presentation and send the established sofic-radical word to <code>-1</code> with constant-one error.</p>\n<h3>Ideas and established structure (2026-08-14)</h3>\n<p><code>docs/TRUE_RELATIVE_WALL_IS_COMMUTANT_GROWTH.md</code> replaces the two displayed matrix conditions by exact algebra.  Write <code>N=M cap pi(Gamma)'</code> and <code>N_t=M cap pi(t Gamma t^(-1))'</code> for a homomorphism into any finite tracial <code>M</code>.</p>\n<ul>\n<li>The wall exists <strong>iff</strong> <code>N!=N_t</code> (<code><a href=\"relative-wall-commutant-growth.html\">relative-wall-commutant-growth</a></code>).  The</li>\n<p>marked predecessor <code>h</code> is not data, and the Clifford strengthening is a self-adjoint involution in <code>N_t</code> anticommuting with its <code>Gamma</code>-conjugate (<code><a href=\"compressed-commutant-majorana.html\">compressed-commutant-majorana</a></code>).  Passing to the tracial matrix ultraproduct makes the finite endpoint and this exact endpoint the same question, so there is no rate-sensitivity in <em>existence</em>; the rate criterion of <code>FALSE_ONE_NUMBER_RELATIVE_COMMUTANT_CRITERION.md</code> governs only construction from imperfect data.</p>\n<li>The growth index <code>lambda(s)=[Ad pi(s)(N):N]</code> is multiplicative on the</li>\n<p>compressor semigroup, so a wall forces <code>[M:N]=infinity</code> and an infinite strictly increasing compressor tower (<code><a href=\"compressor-growth-index-homomorphism.html\">compressor-growth-index-homomorphism</a></code>).</p>\n<li>Because <code>P_Gamma</code> contains the positive elementary transvections and the</li>\n<p>Steinberg identity is a relation inside it, a wall at a commutator compressor needs <strong>infinite</strong> index growth at a factor compressor (<code><a href=\"commutator-compressor-carries-no-wall.html\">commutator-compressor-carries-no-wall</a></code>).  This applies to the explicit Kun--Thom Theorem E pair and to this repository's explicit compressor <code>t=t_(u_12)</code>, since <code>u_12=[u_13,u_32]</code> with both factors nonnegative. Finite lamps over finite orbits are excluded.  The model-side mechanism is confirmed: <code><a href=\"compressor-fixed-site-growth-infinite.html\">compressor-fixed-site-growth-infinite</a></code> proves that both <code>u_13</code> and <code>u_32</code> gain infinitely many <code>Gamma</code>-fixed sites, for every invariant graph, since the fixed-site set depends on the <code>G</code>-set alone.</p>\n<li>Any wall family stays flexibly far from the entire operator-norm</li>\n<p>asymptotic sector, not merely from exact representations (<code><a href=\"wall-models-avoid-norm-microstates.html\">wall-models-avoid-norm-microstates</a></code>).</p>\n<li><strong>Calibration.</strong>  The normal form holds for an arbitrary target group, so</li>\n<p>it can be tested where the answer is known.  It is: <code><a href=\"kun-thom-clifford-cover-weakly-sofic.html\">kun-thom-clifford-cover-weakly-sofic</a></code> proves the Clifford cover weakly sofic and nonsofic, so the entire algebraic content of this claim -- involution, <code>Gamma_1</code>-centrality, anticommutation, surviving radical word -- is already realized in a metric ultraproduct of finite groups with bi-invariant metrics.  Hence no group-theoretic argument can refute this claim, and the only thing separating it from a solved problem is the metric.  The growth index is a genuinely tracial tool precisely because a metric ultraproduct of finite groups carries no Pimsner--Popa index.</p>\n<li>Under Alekseev--Thom Open Problem 6.2 the whole question becomes a demand</li>\n<p>on two nested exact coordinate centralizers (<code><a href=\"wall-coordinate-reduction-under-at-op62.html\">wall-coordinate-reduction-under-at-op62</a></code>).</p>\n</ul>\n<p>Dead ends recorded so they are not retried.</p>\n<p>1. <em>Ore/positivity.</em>  <code>P_Gamma</code> generates <code>G</code> as a group but its own semigroup relations never write <code>1</code> as a nontrivial positive product, so one-sided inclusions cannot be reversed by fractions.  Commutators, not fractions, are the usable relations.  See <code>FALSE_COMPRESSION_SEMIGROUP_ORE_NO_GO.md</code>. 2. <em>Site relaxation.</em>  The Clifford normal form only asks the involution to centralize the compressed group <code>Gamma_1</code>, which looks weaker than the <code>Gamma&lt;=K</code> condition of <code>FALSE_RELATIVE_BICOMMUTANT_ENDPOINT.md</code> <code>(RBE19)</code>.  It is not: conjugating the site subgroup by <code>t</code> returns the original condition, so the generalized-Bernoulli search space is unchanged. 3. <em>Semifinite comparison.</em>  In the tracial ultraproduct the Jones projection <code>e_N</code> and the compressor unitary <code>Ad pi(t)</code> do not lie in a common finite algebra -- <code>Ad pi(t)=u_t J u_t J</code> leaves the basic construction -- so the projection-comparison proof of the exact case has no direct analogue.  Only the index invariant survives, which is why <code>[M:N]=infinity</code> is the surviving necessary condition rather than a contradiction.</p>"}, {"id": "kun-thom-nonsofic-wreath", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Kun--Thom nonsofic generalized wreath products over infranormal Kazhdan pairs", "impact": 7, "frontier": false, "lock": null, "html": "<p>Kun--Thom, <em>Nonsofic wreath products of residually finite groups</em>, arXiv:2608.06222v1 (2026-08-06, 16 pp), prove unconditionally:</p>\n<p>&gt; <strong>Theorem A.</strong> Let <code>Gamma</code> be an infranormal but not normal subgroup of <code>G</code>, &gt; and suppose that both <code>Gamma</code> and <code>G</code> have Kazhdan's property (T).  Then &gt; <code>(Z/2Z) wr_(G/Gamma) G</code> is not sofic.</p>\n<p>Here <code>Gamma</code> is <strong>infranormal</strong> in <code>G</code> when its compression semigroup <code>P_Gamma={g in G : g Gamma g^(-1) &lt;= Gamma}</code> generates <code>G</code> as a group, and <code>(Z/2Z) wr_(G/Gamma) G</code> denotes <code>(directSum_(G/Gamma) Z/2Z) semidirect G</code> with <code>G</code> permuting coordinates through the coset action.</p>\n<p>The hypotheses are realized by an explicit pair:</p>\n<p>&gt; <strong>Theorem E.</strong> Let <code>q</code> be a prime power and let <code>r,d&gt;=3</code>.  Put &gt; <code>R_+=F_q[x_1,...,x_d]</code> and <code>R=F_q[x_1^(\u00b11),...,x_d^(\u00b11)]</code>, and let <code>SL_d(Z)</code> &gt; act on <code>R</code> by monomial substitutions.  Then <code>Gamma=EL_r(R_+)</code> and &gt; <code>G=EL_r(R) semidirect SL_d(Z)</code> are residually finite Kazhdan groups, &gt; <code>Gamma</code> is infranormal but not normal in <code>G</code>.</p>\n<p>Two further statements from the same paper are used elsewhere in this graph:</p>\n<p>&gt; <strong>Theorem C.</strong> <code>Gamma</code> infranormal in <code>G</code>, both Kazhdan, <code>G action (X,mu)</code> &gt; a sofic p.m.p. action; then the fixed-point algebra <code>L^infinity(X)^Gamma</code> &gt; is <code>G</code>-invariant.</p>\n<p>&gt; <strong>Corollary D.</strong> Under Theorem C's hypotheses with <code>Gamma</code> not normal, the &gt; generalized Bernoulli action <code>G action (K,kappa)^(G/Gamma)</code> is not sofic, &gt; for every nontrivial standard probability space <code>(K,kappa)</code>.</p>\n<p><strong>Trust surface.</strong> This is an arXiv preprint, not yet refereed.  It is nevertheless imported as established because it is a self-contained mathematical argument by named authors in their own area, verified here from the PDF (not the HTML render, which returned wrong content), and because its own dependency on the announced OpenAI result is only inspirational: Theorem A is proved from Kun's expander decomposition (arXiv:1606.04471) and Kun--Thom (arXiv:1901.03963), both of which predate the announcement.  Note that the paper contains <strong>no</strong> operator-norm, MF, or corona content, so it raises no priority conflict with the non-MF manuscript.</p>"}, {"id": "kun-thom-wreath-weak-mf", "status": "OPEN", "root": false, "goal": false, "title": "Weak MF status of the Kun--Thom commuting-lamp wreath", "impact": 1, "frontier": true, "lock": null, "html": "<p>Is the Kun--Thom commuting-lamp wreath</p>\n<pre>\nW = (directSum_(G/Gamma) C_2) semidirect G\n</pre>\n<p>weak MF, i.e. MF in the operator-norm norm-matrix-corona sense?</p>\n<p><strong>Open.</strong> The corpus is explicit that this is not settled, and warns against the natural mis-inference from the free-lamp case (<code>docs/NOTEPAD.md:30421-30423</code>):</p>\n<p>&gt; Correction: weak MF of W is not banked. The symmetric-double proof applies &gt; to the free-lamp amalgam, not to the commuting-lamp wreath product. Thus &gt; this finite certificate is valid but stronger than the already-open weak-MF &gt; problem for W.</p>\n<h3>Shared hinge with the marked-quotient cluster (cairn-quotient-mf, 2026-08-14)</h3>\n<p>This question and <code><a href=\"commuting-lamp-quotient-mf.html\">commuting-lamp-quotient-mf</a></code> are the same question for two different Kazhdan compressor pairs, and both are decided by <code><a href=\"corona-commutant-no-growth.html\">corona-commutant-no-growth</a></code>: if the operator-norm relative commutant <code>Theta(Gamma)' cap Q</code> never grows under the compressor, the lamp at the compressed site commutes with <code>Theta(Gamma)</code>, so every corona representation identifies two distinct lamps and none is injective.  Conversely <code><a href=\"marked-quotient-mf-forces-commutant-growth.html\">marked-quotient-mf-forces-commutant-growth</a></code> proves the necessity direction by the same one-lamp argument, which uses only the compression relation and injectivity: weak MF of <code>W</code> <em>forces</em> the growth.  So the hinge is exact here too, and a single theorem settles this claim together with both marked quotient claims.</p>\n<h3>Why the two settled neighbours do not decide it</h3>\n<p><code>W</code> sits between two groups whose weak MF status <em>is</em> known, and inherits neither answer:</p>\n<ul>\n<li><strong>Above it</strong>, the Clifford lamp extension has <code>E_Cl/&lt;z&gt; = W</code>, and</li>\n<p><code><a href=\"kun-thom-clifford-extension-not-weak-mf.html\">kun-thom-clifford-extension-not-weak-mf</a></code> says <code>E_Cl</code> is not weak MF. Weak MF does not pass from a group to its central quotients in the direction needed, and the whole point of that theorem is that the obstruction lives on the sign <code>z</code>, which is exactly what is killed in passing to <code>W</code>. So the negative result upstairs is consistent with either answer here.</p>\n<li><strong>Beside it</strong>, the free-lamp amalgam <code>G *_Gamma (Gamma x K)</code> is weak MF</li>\n<p>(<code><a href=\"symmetric-double-weak-mf.html\">symmetric-double-weak-mf</a></code>), but by an argument that consumes the amalgam structure \u2014 Shulman's theorem is about <code>A *_C A</code> \u2014 and <code>W</code> has no such decomposition.</p>\n</ul>\n<h3>What either answer would buy</h3>\n<p>A positive answer gives another weak-MF nonsofic group, strengthening the separation already obtained from the free-lamp family, and would be the cleanest possible entry in <code><a href=\"nonsofic-mechanism-mf-classification.html\">nonsofic-mechanism-mf-classification</a></code>: the same group nonsofic and weak MF, with the two lamp types on opposite sides.</p>\n<p>A negative answer is the more interesting one. It would make <code>W</code> a second non-MF group by a mechanism with no finite normal subgroup and no central mark, which is exactly the shape <code><a href=\"torsion-free-finitely-presented-non-mf.html\">torsion-free-finitely-presented-non-mf</a></code> needs and which the finite-normal criterion cannot reach.</p>\n<p>Note that neither answer bears directly on <code><a href=\"hyperlinear-wreath-model.html\">hyperlinear-wreath-model</a></code>: operator-norm models carry no trace, so weak MF of <code>W</code> would not make it hyperlinear (<code><a href=\"mf-implies-hyperlinear.html\">mf-implies-hyperlinear</a></code> is itself open, and <code><a href=\"weak-mf-embedding-not-reusable.html\">weak-mf-embedding-not-reusable</a></code> shows a given weak-MF embedding can never be re-metrized into a hyperlinear one).</p>"}, {"id": "lamp-character-orbit-separation", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Lamp separation by a Hilbert embeddable length is an orbit-counting number", "impact": 0, "frontier": false, "lock": null, "html": "<p>Let <code>K</code> be finite with <strong>abelian</strong> normal subgroup <code>L</code> (lamps) and quotient <code>A = K/L</code>. Split <code>Irr(K) \u2216 {triv}</code> into <code>Irr_I</code> (those containing <code>L</code> in the kernel, i.e. inflated from <code>A</code>) and <code>Irr_II</code>, and split every Hilbert embeddable length accordingly as <code>\u2113 = \u2113_I + \u2113_II</code>, both nonnegative and conditionally negative definite.</p>\n<p>1. <strong><code>\u2113_I|_L \u2261 0</code>.</strong> For <code>\u03c7 \u2208 Irr_I</code> and <code>h \u2208 L</code>, <code>\u03c7(h) = \u03c7(1)</code>, so <code>\u03c8_\u03c7(h) = 0</code>. All lamp separation is carried by <code>\u2113_II</code>, and any upper bound <code>\u2113 \u2264 \u03b5</code> is inherited by each summand. 2. <strong>Clifford theory computes the relative gap.</strong> For <code>\u03c7 \u2208 Irr_II</code>, <code>\u03c7|_L = e(\u03b8_1 + \u22ef + \u03b8_t)</code> with the <code>\u03b8_i</code> a single <code>K</code>-orbit of <strong>nontrivial linear</strong> characters of <code>L</code> (linear because <code>L</code> is abelian; nontrivial because a trivial constituent would put <code>\u03c7</code> in <code>Irr_I</code>), and <code>\u03c7(1) = et</code>. Hence for <code>h \u2208 L</code>, <code>\u03c8_\u03c7(h)/\u03c7(1) = 1 \u2212 (1/t)\u03a3_i \u03b8_i(h)</code> \u2014 the multiplicity <code>e</code> cancels. 3. <strong>For <code>L = (\u2124/2)^Sites</code></strong> characters are subsets and, for a lamp element <code>a</code>, <code>\u03c8_\u03c7(a)/\u03c7(1) = 2\u00b7|{S \u2208 orbit : |S \u2229 supp(a)| odd}|/t</code>. In particular the two-site mark <code>w = a_p a_q</code> has normalized separation <code>2\u00b7</code>(fraction of the orbit containing exactly one of <code>p</code>, <code>q</code>), and a single lamp <code>a_p</code> has <code>2\u00b7</code>(fraction of the orbit containing <code>p</code>).</p>\n<p><strong>Dilution is not the obstruction.</strong> A generic orbit of subsets separates two <em>distinct</em> sites on a fraction tending to <code>1/2</code>, so the mark gets separation bounded below by an absolute constant with no dependence on the number of sites. The <code>1/|A|</code> decay feared for the normalized support length comes from choosing the wrong cone generator, not from the problem.</p>\n<p><strong>The obstruction is relocated to site-distinctness.</strong> <code>(LC5)</code> needs the model to keep the two marked sites distinct. In a genuine finite quotient the compression becomes an equality and the two marked cosets are identified, so every orbit fraction is zero and the mark has length zero in <em>every</em> Hilbert embeddable length. The character theory therefore reproduces <code><a href=\"finite-quotient-blindness.html\">finite-quotient-blindness</a></code> exactly.</p>\n<p><strong>The character-gap route does not close.</strong> Even granting the full relative gap of item 1, it constrains <code>\u2113_II</code> only on <code>L</code>. The two-site rigidity theorem puts the entire defect on the acting part, off <code>L</code>, where the relative gap says nothing. \"A vanishing defect must vanish identically\" is then available only for lamp-supported defects, of which rigidity says there are none. The two results are consistent, not contradictory, and their combination yields no obstruction.</p>"}, {"id": "lamp-charts-recover-set-action", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Lamp charts recover the set action, for Clifford lamps as well as commuting ones", "impact": 0, "frontier": false, "lock": null, "html": "<p>Distinct also from the route <code><a href=\"sofic-action-permanence.html\">sofic-action-permanence</a></code>, which records the three permanence theorems and the refutation of their shared hypothesis: this claim proves the converse direction, which blocks the natural repair of relabelling the lamps. (<code>distinct_from</code> only accepts claims, so that disambiguation lives here rather than in the frontmatter.)</p>\n<p>Let <code>G</code> act on <code>X</code> and let <code>V</code> be any group generated by elements <code>a_x</code> indexed by <code>X</code> and permuted by <code>G</code> \u2014 the commuting lamp group <code>directSum_X C_2</code>, the Clifford lamp group <code>C(X)</code>, or any invariant-graph lamp group <code>Vtilde_S</code>.  If the automorphism action <code>G</code> on <code>V</code> is a sofic <code>C</code>-action in the sense of Alekseev--Bradford Definition 4.23, for any class <code>C</code> whatsoever, then the set action <code>G</code> on <code>X</code> is sofic.</p>\n<p>The proof uses only that the induced automorphism sends <code>a_z</code> to <code>a_(gz)</code>, that the partial homomorphisms are injective on the finite window, and that the finitely many labels <code>pi_s(a_z)</code> form a finite set: the covariance equation is then literally the orbit-approximation equation.  Commutativity, the order of <code>a_z</code>, and the presence of a central element play no role.</p>\n<p>With <code><a href=\"coordinate-action-not-sofic.html\">coordinate-action-not-sofic</a></code> (Kun--Thom Corollary D) this closes the halo/chart permanence route on the Clifford side exactly as on the Bernoulli side, and with the locally-sofic collapse theorem of <code>docs/FALSE_HALO_ACTION_AUDIT.md</code> it closes every repair that relabels the coset coordinates by finite, Clifford, Pauli, or finite-dimensional unitary data \u2014 all of those target classes are locally sofic.  A chart-based proof would need a target that is already a finitely generated hyperlinear nonsofic group.</p>"}, {"id": "lamp-telescope-base-is-lef", "status": "ESTABLISHED", "root": false, "goal": false, "title": "The lamp-by-telescope base is LEF", "impact": 1, "frontier": false, "lock": null, "html": "<p><code>ClLamp(X) semidirect T</code> and <code>F_2[X] semidirect T</code> are locally embeddable into finite groups, hence sofic and \u2014 by <code><a href=\"lef-implies-operator-mf.html\">lef-implies-operator-mf</a></code> \u2014 operator MF.  Each is the directed union of the residually finite groups <code>L' semidirect Gbar_k</code> with <code>L'</code> a finite <code>Gbar_k</code>-invariant lamp subgroup.</p>\n<p>Therefore both the witness and its commuting-lamp quotient are <code>Z</code>-extensions of LEF groups:</p>\n<pre>\nW        = (ClLamp(X) semidirect T) semidirect Z,\nW/&lt;zeta&gt; = (F_2[X]    semidirect T) semidirect Z.\n</pre>"}, {"id": "leavitt-multiplicative-trace-floor", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Dimension-free multiplicative Leavitt trace floor", "impact": 1, "frontier": false, "lock": null, "html": "<p>For contractions <code>T_0,S_0,T_1,S_1</code> in any nonzero finite matrix algebra,</p>\n<pre>\nmax(||T_0 S_0-1||_2, ||T_1 S_1-1||_2, ||T_0 S_1||_2)\n  &gt;= 2-sqrt(3) &gt; 1/4.\n</pre>\n<p>The bound is independent of matrix size.  On a corner of fixed trace <code>alpha</code>, the corresponding ambient normalized-HS floor is <code>sqrt(alpha)(2-sqrt(3))</code>.  Hence the terminal contradiction is complete once the three products are decoded on one positive-density coordinate corner.</p>"}, {"id": "leavitt-steinberg-hs-stability-fork", "status": "ESTABLISHED", "root": false, "goal": false, "title": "The Leavitt--Steinberg normalized-HS stability fork", "impact": 4, "frontier": false, "lock": null, "html": "<p>Put <code>L=L_(F_2)(1,2)</code>, <code>U=St_5(L)</code>, and <code>Q=EL_4(L)</code>.  Exactly one of the following branches holds:</p>\n<ul>\n<li>if <code>U</code> is normalized Hilbert--Schmidt stable, then <code>U</code> is nonhyperlinear;</li>\n<li>if <code>U</code> is not normalized Hilbert--Schmidt stable, then a central quotient</li>\n<p>of <code>U</code> is hyperlinear and nonsofic (and central-quotient permanence makes the already nonsofic group <code>Q</code> hyperlinear).</p>\n</ul>\n<p>The inputs are finite presentability and minimal almost periodicity of <code>U</code>, quasisimplicity of <code>U</code>, and nonsoficity of the relevant central quotients. The fork is unconditional, but it does not decide which branch occurs.</p>"}, {"id": "leavitt-steinberg-hs-stable", "status": "OPEN", "root": false, "goal": false, "title": "The binary Leavitt Steinberg cover is normalized-HS stable", "impact": 1, "frontier": false, "lock": null, "html": "<p>Prove normalized Hilbert--Schmidt stability of <code>St_5(L_(F_2)(1,2))</code>.  Hyperfinite HS stability is already known here, but is insufficient: a counterexample sequence may generate a nonamenable limiting von Neumann algebra.</p>\n<h3>Ideas</h3>\n<p><strong>External corroboration of the payoff, source-verified 2026-08-14.</strong> The implication this branch buys is a published theorem, not only the repository's <code><a href=\"leavitt-steinberg-hs-stability-fork.html\">leavitt-steinberg-hs-stability-fork</a></code>.  Becker--Lubotzky, <em>Group stability and Property (T)</em>, arXiv:1809.00632, J. Funct. Anal. 278 (2020) 108298, Theorem 1.3(ii): \"If <code>Gamma</code> is hyperlinear and has Property (T), then it is not HS-stable, unless it is finite.\"  Their <code>HS</code> is the <strong>strict, normalized</strong> metric <code>d_n(A,B)=\u2016A-B\u2016_HS</code> with <code>\u2016T\u2016_HS=((1/n)Tr(T^*T))^(1/2)</code> and no dimension padding, i.e. exactly the metric of this claim.  <code>U</code> is infinite and Kazhdan (Ershov--Jaikin-Zapirain, arXiv:0809.4095, Theorem 6.2, <code>St_n(R)</code> for every <code>n&gt;=3</code> and every finitely generated associative unital <code>R</code>), so their theorem contraposes to <code>U HS-stable ==&gt; U nonhyperlinear</code>.  The fork's own proof needs less -- minimal almost periodicity alone -- but the manuscript may now cite an external referee-visible statement for the branch payoff.</p>\n<p>**The strongest published <em>instability</em> theorems are vacuous for <code>U</code>.<strong> This is the important negative mapping, and it is why the branch cannot be decided by importing.  Becker--Lubotzky Theorem 1.4 and Theorem 4.1(ii) obstruct HS-stability of a Kazhdan (respectively <code>(T;FD)</code>) group by concluding that it has </strong>only finitely many finite-index subgroups**; a group with many finite-index subgroups is therefore not HS-stable.  <code>U</code> has exactly one.  If <code>H&lt;=U</code> had finite index its normal core would give a nontrivial finite quotient, hence a nontrivial finite-dimensional unitary representation of <code>U</code>, contradicting minimal almost periodicity.  So the conclusion of their obstruction holds trivially and carries no information. Every published route to \"not HS-stable\" runs through residual finiteness or a rich finite-quotient lattice, and <code>U</code> has neither.</p>\n<p><strong><code>2</code>-Kazhdan is the wrong norm, confirmed from the source.</strong> De Chiffre--Glebsky--Lubotzky--Thom, arXiv:1711.10238, Forum Math. Sigma 8 (2020) e18, Theorem 1.2 concludes <strong>Frobenius</strong> stability, and the authors name the obstruction themselves: \"When the norm is submultiplicative (as is the case of the Frobenius norm but not of the normalized Hilbert--Schmidt norm) the kernel of this splitting problem is abelian\", and again \"The operator norm and the Frobenius norm enjoy this property, but the normalized Hilbert--Schmidt norm does not.\"  Submultiplicativity is a hypothesis of their general engine (Theorem 3.6), not an artifact.  So the exact <code>2</code>-Kazhdan reduction recorded for <code>U</code> -- vanishing of <code>H^2(U,H_pi)</code> for every <code>pi</code> with <code>H_pi^U=0</code> -- would <strong>not</strong> select this branch even if proved.  The branch needs a <em>dimension-free</em> degree-two vanishing, which is a different theorem in a norm the DGLT machine does not accept.</p>\n<p><strong>Hyperfinite stability is automatic here, and says why.</strong>  The concession in the statement above is now a node with its proof imported from the corpus: <code><a href=\"steinberg-hyperfinite-hs-stable.html\">steinberg-hyperfinite-hs-stable</a></code>, from <code>docs/NOTEPAD.md:22220-22238</code>, with the correct attribution (Dogon--Vigdorovich arXiv:2506.20843 Thm 6.2, not Hadwin--Shulman) and the two citation traps recorded on its route.  It constrains only the amenable part of the trace simplex, so it fences the opposite branch without touching this one.</p>\n<p><strong>The <code>(TT)/T</code> route is refuted and explicitly forbidden.</strong>  Property <code>(TT)/T</code> of <code>E_n(L_(F_2)(1,2))</code> for <code>n&gt;=3</code>, and hence of <code>St_5(L)</code> by invariance under Kazhdan central extensions, is <strong>established</strong> in the corpus (<code>docs/LEAVITT_TT_T.md:203-241</code>).  It does not give this claim. <code>docs/FALSE_TT_T_IS_NOT_DIMENSION_FREE_HS_STABILITY.md</code> isolates two losses: normalized-HS control does not imply operator-norm control uniformly in the dimension (<code>\u2016A\u2016_op &lt;= sqrt(d)\u2016A\u2016_(2,d)</code>), and the Burger--Ozawa--Thom statement fixes <code>d</code> before compactness, so it cannot be diagonalized into a dimension-free modulus.  The same file's consistency check is the one I reconstruct above from Becker--Lubotzky, and its directive at <code>:96-100</code> is \"Do not route the current proof through abstract <code>(TT)/T -&gt; stability</code>.\" Its <code>:79-93</code> lists what would finish instead: a dimension-free stability modulus for the atlas relator packet, flexible normalized-HS stability with <code>o(d_n)</code> padding, or a direct word-kill inequality.</p>\n<p><strong>A constraint on the shape of any proof.</strong>  Fournier-Facio--Gerasimova--Spaas, arXiv:2307.13155: an infinite hyperlinear property-<code>(T)</code> group is never <em>locally</em> HS-stable.  This does not obstruct the fork, which is about ordinary normalized-HS stability, but it means a proof of this claim cannot proceed by first establishing a local version and globalizing -- the local version is unavailable on the hypothesis that would make globalizing interesting.</p>\n<p><strong>Where this claim sits in the formalization.</strong>  By <code><a href=\"pointwise-hs-stability-from-no-hyperlinear-quotient.html\">pointwise-hs-stability-from-no-hyperlinear-quotient</a></code>, this claim is exactly the missing hypothesis of a third instance of a pattern already proved twice in <code>GroupApproximation/Stability/MixedApproximation.lean</code>, for the Hamming and operator-norm metrics.  The mathematics of the implication is three lines; the only missing Lean ingredient is that the unitary group of a tracial matrix ultraproduct is hyperlinear.  All the difficulty is in the hypothesis, none of it in the deduction.</p>\n<p><strong>A cheap consistency test that has not been run.</strong>  By <code><a href=\"kervaire-laudenbach-holds-for-hyperlinear.html\">kervaire-laudenbach-holds-for-hyperlinear</a></code>, the Kervaire--Laudenbach property holds for every hyperlinear group -- Nitsche--Thom, <em>Universal solvability of group equations</em>, J. Group Theory 25 (2022) 1--10, <strong>Theorem 1.2</strong> (attributed by them to Gerstenhaber--Rothaus and Pestov); their Theorem 1.3 is the stronger covering result which implies it, and is the number the OpenAI chapter cites.  So if this claim is false, every one-variable equation over <code>Q</code> with nonzero total exponent is solvable in some overgroup.  The Leavitt unit group is concrete enough for equations over it to be testable, so positive KL evidence accumulates <em>against</em> this claim cheaply.  The converse use is the open node <code><a href=\"kl-violating-equation-over-leavitt-unit-group.html\">kl-violating-equation-over-leavitt-unit-group</a></code> with its route <code><a href=\"kl-violation-refutes-hyperlinearity-route.html\">kl-violation-refutes-hyperlinearity-route</a></code>; see that node's own difficulty paragraph before spending on it, since a KL-violating equation would also refute the Kervaire--Laudenbach conjecture and is therefore a red flag on any candidate rather than a plan.</p>\n<p><strong>Character rigidity cannot be the engine, for a structural reason.</strong> The higher-rank technology (Dogon--Vigdorovich Theorem 1.6; Lavi--Levit, arXiv:2007.15547, Adv. Math. 419 (2023) 108948) routes stability through character rigidity.  That is substantive for a lattice, which has many characters.  It is empty for <code>Q=EL_4(L_(F_2)(1,2))</code>, because simplicity already forces every nontrivial homomorphism into a tracial matrix ultraproduct to be faithful: nothing remains for a character classification to rule out.  Separately, Lavi--Levit assume <code>R</code> commutative Noetherian and <code>d</code> above the stable range, and a literature sweep on 2026-08-14 found <strong>no</strong> character-rigidity theorem for <code>EL_n</code> over a noncommutative ring; the binary Leavitt algebra is noncommutative, non-Noetherian and of infinite Bass stable rank.  So this lane is closed both by hypothesis mismatch and by vacuity.</p>\n<p><strong>Where the branch is actually decided.</strong>  The only mechanism that has ever closed a question of this shape for this group is the one that proved <code>Q</code> nonsofic: Kun's expander decomposition, a conservation identity, and a majority matching.  Transcribing it to the normalized-HS metric needs exactly one new input, <code><a href=\"hs-expander-block-decomposition.html\">hs-expander-block-decomposition</a></code>; the other two steps do transcribe, and the transcription is written out in <code><a href=\"hs-block-decomposition-to-steinberg-stable.html\">hs-block-decomposition-to-steinberg-stable</a></code>.  That route is currently the sharpest formulation of what proving this claim requires.</p>"}, {"id": "leavitt-steinberg-hs-unstable", "status": "OPEN", "root": false, "goal": false, "title": "The binary Leavitt Steinberg cover is normalized-HS unstable", "impact": 1, "frontier": true, "lock": "cairn-fork", "html": "<p>Construct a normalized-HS asymptotic representation of <code>St_5(L_(F_2)(1,2))</code> that cannot be corrected to genuine finite-dimensional representations.  Since every such genuine representation is trivial, it is enough to make the finite quotient relators tend to <code>1</code> in exact atlas representations while one fixed word stays a positive distance from <code>1</code>.</p>\n<h3>Ideas</h3>\n<p><strong>The \"one witness suffices\" reduction is this claim, not a decomposition of it.</strong>  Because <code>U</code> is minimally almost periodic, the only genuine finite-dimensional representation is trivial, so instability is <em>by definition</em> the existence of one almost-representation family bounded away from <code>1</code>.  Equivalently, one nontrivial homomorphism <code>U -&gt; U(R^omega)</code>, one nontrivial Connes-embeddable trace on <code>U</code>, or one exact-atlas sequence satisfying <code>(A)</code>--<code>(B)</code> of <code>docs/ATLAS_HS_CRITERION.md</code>.  These are already recorded as the content of <code><a href=\"leavitt-steinberg-hs-stability-fork.html\">leavitt-steinberg-hs-stability-fork</a></code>; restating them as a sub-claim buys nothing.  The genuine sub-problems are the constructions, and the ones that are closed are listed in the fork's artifacts: ring-first Leavitt microstates (<code>2-sqrt(3)</code> contraction floor, kernel-checked), hyperfinite and amenable-character models, monomial and block-monomial relative unitaries, Haar and asymptotically free ensembles, bounded internal complexity, and the entire additive-root/Hellinger program.</p>\n<p><strong>The construction is reduced to finite matrix feasibility, and the fences are sharp.</strong>  <code>docs/ATLAS_HS_CRITERION.md:196-217</code> proves the one-witness exact-atlas certificate and <code>:247-253</code> its converse; <code>:286-298</code> makes the variables finite -- integer multiplicity vectors per chart, finitely many relative unitaries <code>V_i</code>, and the common size <code>d</code> -- and <code>:357-407</code> upgrades this to a ratio criterion under which sparse seeds suffice provided relator defects vanish faster than the survivor.  <code>docs/EXPLICIT_LEAVITT_ATLAS.md:452-456</code> states the endgame as a sequence of compact one-unitary optimizations.  Two fences bound the search: <code><a href=\"steinberg-hyperfinite-hs-stable.html\">steinberg-hyperfinite-hs-stable</a></code> forbids any witness with hyperfinite, AF, amenable-factor or character-approximation limit, and <code><a href=\"leavitt-multiplicative-trace-floor.html\">leavitt-multiplicative-trace-floor</a></code> together with <code>docs/NOTEPAD.md:22096-22133</code> forbids every ring-first construction -- square-matrix Fock, Toeplitz, leaf-truncation, polar-correction, direct-sum -- in normalized HS and not merely in operator norm.  The same passage (<code>:22135</code>) declines to conclude stability from the floor, correctly.</p>\n<p><strong>Why the nonsoficity of <code>Q</code> is not evidence against this branch.</strong>  The source of the nonsoficity theorem says so itself, verbatim and identically in both released versions: \"Thus every sofic group is hyperlinear [Pes08, Theorem 3.3], but Theorem 1.1 does not determine whether <code>L_(F_2)(1,2)^x</code> is hyperlinear.\"  The structural reason is now pinned down precisely.  Of the three steps of the one-sided-compression argument, two transcribe to a finite tracial algebra unchanged -- see <code><a href=\"hs-block-decomposition-to-steinberg-stable.html\">hs-block-decomposition-to-steinberg-stable</a></code>, where the conservation identity becomes trace preservation under unitary conjugation and the majority matching becomes <code>sum_i tau(f e_i f) &lt;= tau(f)</code>.  The only step with no tracial analogue is Kun's expander decomposition, and its permutation input is not a <em>theorem</em> about Kazhdan groups but the ambient fact that a permutation model acts on a set, so its invariant algebra is atomic before any hypothesis is used.  A nonsoficity proof that leans on atomicity is exactly the kind that leaves hyperlinearity open.</p>\n<p><strong>The compression pattern alone is hyperlinear-compatible, explicitly.</strong> The full hypothesis pattern of the criterion, minus property <code>(T)</code>, is realized inside an amenable group.  In <code>G = Z wr Z = A semidirect &lt;t&gt;</code> with <code>A = directSum_(n in Z) Z</code> and <code>t</code> the shift, take <code>Gamma = directSum_(n&gt;=0) Z</code>, <code>J = &lt;e_(-1)&gt; = Z</code>.  Then <code>t Gamma t^(-1) = directSum_(n&gt;=1) Z</code> is a <strong>strict</strong> subgroup of <code>Gamma</code>, <code>G = &lt;Gamma,t&gt;</code>, <code>[Gamma,J]=1</code>, <code>Gamma cap J = 1</code>, and <code>t J t^(-1) = &lt;e_0&gt; &lt;= Gamma</code>
