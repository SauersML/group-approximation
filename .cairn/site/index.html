e missing assertion <code>(HSC7)</code> is in fact false for the particular solution &gt; group constructed in Slofstra, arXiv:1703.08618v2, Proposition 5.1.  The &gt; finite-coordinate constructions in that proof can be made with permutation &gt; matrices throughout.  Consequently its distinguished involution <code>J</code> survives &gt; in a metric ultraproduct of finite symmetric groups.</p>\n<h3>The trap it closes</h3>\n<p>The tempting inference was that <code>J</code>, being invisible in every <em>exact</em> finite-dimensional representation, must lie in the sofic radical. It does not. Exact finite-dimensional invisibility does not imply sofic invisibility \u2014 the corpus flags this directly (<em>\"exact finite-dimensional invisibility alone does not imply this\"</em>), and the same trap is already recorded for a different candidate in <code><a href=\"literal-clifford-ce-model.html\">literal-clifford-ce-model</a></code>.</p>\n<p>That makes two independent eliminations of the same shape. Both times a word that is invisible to exact finite-dimensional representations turned out to be visible in a sofic or Connes-embeddable model. Any future candidate for the sofic-radical half of a radical collision should be tested against a permutation-ultraproduct construction before effort is spent on the detector side.</p>\n<h3>Scope</h3>\n<p>This says nothing about whether <code>S</code> is sofic, and nothing about <code><a href=\"hyperlinear-nonsofic-group.html\">hyperlinear-nonsofic-group</a></code>. <code>Theta</code> is not asserted to be faithful \u2014 only <code>Theta(J) != 1</code> is needed and only that is proved. It removes one candidate.</p>"}, {"id": "sofic-implies-hyperlinear", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Soficity implies hyperlinearity", "impact": 2, "frontier": false, "lock": null, "html": "<p><code>Sofic/Hyperlinear.isHyperlinear_of_isSofic</code> (formalized), with <code>IsHyperlinear</code> defined by unitary matrices in the normalized Hilbert\u2013Schmidt metric. Proof: the metric identity <code>\u2016P_\u03c3 \u2212 P_\u03c4\u2016\u00b2_{HS,norm} = 2\u00b7d_H(\u03c3,\u03c4)</code> plus the fact that <code>\u03c3 \u21a6 P_{\u03c3\u207b\u00b9}</code> is a genuine homomorphism (the inverse matters \u2014 <code>permMatrix</code> itself is an anti-homomorphism). The converse is <a href=\"hyperlinear-nonsofic-group.html\">hyperlinear-nonsofic-group</a>.</p>"}, {"id": "sofic-non-mf-witness", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Six-generated sofic group that is not MF", "impact": 6, "frontier": false, "lock": null, "html": "<p>The concrete Clifford witness <code>W = ClLamp(X) semidirect_product V</code> is finitely generated, sofic, and not MF.  This is the premise-free Lean theorem <code>GroupApproximation.NonMFImpact.witness_sofic_nonMF</code>.</p>"}, {"id": "sofic-radical-hyperlinear-survivor", "status": "OPEN", "root": false, "goal": false, "title": "Make one explicit sofic-radical word survive a hyperlinear detector", "impact": 1, "frontier": false, "lock": null, "html": "<p>Find an explicit countable group <code>H</code>, a nonidentity element <code>x in Rad_sof(H)</code>, and one homomorphism from <code>H</code> to a hyperlinear group which does not kill <code>x</code>.</p>\n<p>The Kun--Thom compression constructions provide the sofic-radical side.  The open task is to make the same defect survive a tracial matrix model.  The literal Clifford sign cannot be used unchanged: <a href=\"literal-clifford-ce-model.html\">literal-clifford-ce-model</a> also supplies a sofic detector of that sign.</p>\n<h3>Ideas</h3>\n<p><strong>The supply side is not a separate problem.</strong>  By <a href=\"sofic-radical-soficization.html\">sofic-radical-soficization</a>, <code>Rad_sof(H)=1</code> if and only if <code>H</code> is sofic.  So \"find a nonidentity element of a sofic radical\" and \"find a nonsofic group\" are the <em>same</em> search, with the same two known instances and the same single <code>(T)</code>-compression mechanism behind both (docs/OBSTRUCTIONS.md \u00a75).  There is no separate technology for producing radical elements to be swept for, and a genuinely different source would in particular be a second nonsoficity mechanism.  Note the degenerate end of the range: a simple nonsofic group has <em>total</em> sofic radical, and there the criterion says nothing, since a nontrivial homomorphism out of it is injective.  The criterion has content only where the radical is a proper nontrivial subgroup.</p>\n<p><strong>The quotient lattice is fully constrained.</strong>  By <a href=\"radical-collision-reformulation.html\">radical-collision-reformulation</a>, any quotient of <code>H</code> retaining <code>x</code> is automatically nonsofic \u2014 which is what makes the criterion work, and equally what forbids every cheap certificate.  No LEF, LEA, residually amenable, linear, or sofic-by-amenable quotient retaining <code>x</code> exists, and the criterion as a whole is <em>equivalent</em> to Question 3.4 rather than a reduction of it.  The one asymmetry worth keeping is that the model may be non-faithful.</p>\n<p><strong>Which collapses of the base are even allowed.</strong>  For any homomorphism <code>q</code> on <code>H = G *_Gamma (Gamma x C_2)</code>, if <code>q(h) in q(Gamma)</code> then <code>q(r)=1</code> because <code>q(k)</code> commutes with <code>q(Gamma)</code>; and <code>q(h)=q(t)^(-1)q(gamma)q(t)</code>.  Hence</p>\n<pre>\nq(x)!=1  ==&gt;  q(t) q(Gamma) q(t)^(-1) is a STRICT subgroup of q(Gamma),\n</pre>\n<p>witnessed by <code>q(gamma)</code>.  Every collapse of <code>G</code> retaining <code>x</code> must therefore carry the strict compression intact, so by the formalized <code>no_strict_compression_of_invariantSize</code> no image with a conjugation-invariant strictly monotone size \u2014 finite, compact, or exhausted by finite fixed sets \u2014 is reachable.  There is no \"simplify the base pair first\" move.</p>\n<p><strong>Where the remaining freedom actually is.</strong>  <a href=\"invariant-graph-clifford-phase.html\">invariant-graph-clifford-phase</a> maps out the lamp side instead: the quotients of <code>H</code> retaining <code>x</code> that come from central lamp extensions are classified by <code>G</code>-invariant graphs on <code>G/Gamma</code> containing the marked edge, the minimal ones are exactly those with nondegenerate adjacency form, and those are exactly the ones whose model algebra is a factor rather than a base with an invariant abelian (Cartan) direction.  That is the structural reason the Clifford route escapes the permutation-normalization obstruction that kills the commuting wreath model, and it says the escape is not special to the complete graph.  It also closes the obvious variation: at a symmetric marked double coset no lamp of order <code>&gt;2</code> yields a finer phase, because a <code>G</code>-invariant alternating pairing whose marked pair is reversible takes a value of order two there.  The sign is all there is.</p>\n<p><strong>One trap, recorded.</strong>  Kun--Thom's own group <code>W=(directSum_(G/Gamma) Z/2) semidirect G</code> has <code>L(W)=L^infty(prod_(G/Gamma) Z/2) crossed_product G</code>, the crossed product of a <em>measure preserving</em> action of a residually finite, hence sofic, group; and <code>W</code> is hyperlinear iff that algebra is Connes embeddable.  It is tempting to finish by Elek--Lippner.  Their theorem, as transcribed in P\u0103unescu arXiv:1002.0605 Theorem 2.1 (numbering read off the arXiv HTML, re-verify before any manuscript use), covers equivalence relations generated by <em>Bernoulli shifts</em> of sofic groups \u2014 the regular action \u2014 and it is open whether every measure preserving action of a sofic group is sofic (loc. cit. Theorem 3.1 only reduces the general case to free actions).  The generalized Bernoulli action over <code>G/Gamma</code> is not covered, and Kun--Thom show the underlying action on the set <code>G/Gamma</code> is not sofic in the Gao--Kunnawalkam Elayavalli--Patchell sense, which is what a proof of the Bernoulli case would need.  The gap between an abstract trace-preserving embedding and a Cartan-preserving one is the whole problem (docs/NOTEPAD.md, \"Abstract versus Cartan-preserving embeddings\").</p>\n<p><strong>The lane that overtook this one (2026-08-14).</strong>  With <code><a href=\"weakly-sofic-not-sofic.html\">weakly-sofic-not-sofic</a></code> settled, the sharpest question is no longer about detectors at all: <code><a href=\"hilbert-embeddable-length-hyperlinearity.html\">hilbert-embeddable-length-hyperlinearity</a></code> shows that a weak-soficity witness upgrades to a hyperlinear one exactly when its invariant lengths are conditionally negative definite, a finite character-expansion test.  The Kun--Thom wreath already <em>has</em> weak-soficity witnesses, so Question 3.4 now has a route that needs no detector, no algebra and no control of the coset action \u2014 see <code><a href=\"hilbert-embeddable-witness-for-kun-thom-wreath.html\">hilbert-embeddable-witness-for-kun-thom-wreath</a></code>.  Anyone working this claim should check that route first; a survivor is only needed if the character test fails.</p>\n<p><strong>Supply, settled.</strong>  The literal cluster is closed as a source: <code>E</code> is sofic (<code><a href=\"literal-group-sofic.html\">literal-group-sofic</a></code>), so by <code><a href=\"sofic-radical-soficization.html\">sofic-radical-soficization</a></code> <code>Rad_sof(E)=1</code> and no element of <code>E</code> \u2014 including the infinite-rank free kernel of <code>E -&gt; W</code> \u2014 is a radical survivor.  The Kun--Thom groups remain the only supply, with four explicit words recorded in the corpus and two complete radical computations (docs/COMMUTING_WREATH_SOFIC_RADICAL.md, docs/CYCLIC_AUGMENTATION_SOFIC_RADICAL.md).  The cheapest concrete form of this hole is the first of those: <code>Rad_sof(W)=&lt;&lt;w&gt;&gt;_W</code> for the single involution <code>w=a_(h Gamma) a_Gamma</code>, so a detector is a single projection <code>(1-rho(w))/2</code> of positive trace.</p>\n<p><strong>A next unit that was tried and closed.</strong>  Looking for a nondegenerate <code>G</code>-invariant graph of <em>finite</em> degree \u2014 a symmetric double coset <code>Gamma h Gamma</code> with <code>[Gamma : Gamma cap h Gamma h^(-1)]</code> finite \u2014 is futile: <code><a href=\"marked-double-coset-infinite-degree.html\">marked-double-coset-infinite-degree</a></code> proves that index is infinite for the recorded marked element, so every invariant graph keeping the word alive has infinite degree.  The localization hope for the finite-mode defects of docs/FALSE_FERMIONIC_KUN_THOM_ENDPOINT.md \u00a75 is not available in this family.</p>"}, {"id": "sofic-radical-linear-action-criterion", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Linear finite-action criterion for sofic-radical membership", "impact": 0, "frontier": false, "lock": null, "html": "<p>Let <code>P = F / normalClosure(R)</code>, where <code>F</code> is finitely generated and <code>R</code> is finite, and let <code>w</code> be an element of <code>F</code>.  For a nonempty finite <code>F</code>-action <code>rho</code>, write <code>d_rho(g)</code> for the fraction of points moved by <code>g</code>.  The image of <code>w</code> belongs to <code>Rad_sof(P)</code> if and only if there is a finite constant <code>C &gt;= 0</code> such that every such action satisfies</p>\n<p>\\[ d_\\rho(w)\\leq C\\sum_{r\\in R}d_\\rho(r). \\]</p>\n<p>Equivalently, it is enough to require the inequality only for transitive finite actions.</p>"}, {"id": "sofic-radical-soficization", "status": "ESTABLISHED", "root": false, "goal": false, "title": "The sofic radical is the kernel of soficization", "impact": 3, "frontier": false, "lock": null, "html": "<p>Write <code>Rad_sof(H)</code> for the intersection of the kernels of all homomorphisms from a countable group <code>H</code> to sofic groups.  Then:</p>\n<p>1. <strong>Functoriality.</strong>  Every homomorphism <code>phi:H-&gt;Q</code> satisfies <code>phi(Rad_sof(H)) &lt;= Rad_sof(Q)</code>. 2. <strong>Sofic quotient.</strong>  <code>H/Rad_sof(H)</code> is sofic; equivalently <code>Rad_sof(H)</code> is the smallest normal subgroup of <code>H</code> with sofic quotient. 3. <strong>Detection of nonsoficity.</strong></p>\n<pre>\nH is sofic   &lt;==&gt;   Rad_sof(H)=1.\n</pre>\n<p>Consequently a nontrivial sofic radical is not a rarer or more special phenomenon than nonsoficity: they are the same phenomenon.  Every nonsofic group supplies sofic-radical elements, and no group outside that class supplies any.</p>"}, {"id": "sofic-stable-implies-residually-finite", "status": "ESTABLISHED", "root": false, "goal": false, "title": "A sofic group that is stable in finite actions is residually finite", "impact": 2, "frontier": false, "lock": null, "html": "<p>A group that is sofic and stable in finite actions is residually finite. \"Stable in finite actions\" is Gohla--Thom Definition 3.7: the limit action of any sofic approximation is weakly contained in the family of finite actions of the group.  Any group stable in a stronger sense \u2014 flexibly, weakly flexibly, or <code>rho</code>-stable in permutations \u2014 is stable in finite actions, so the implication applies to all of those notions.</p>\n<p><strong>PROVED IN REPO</strong> \u2014 <code>docs/SOFIC_STABLE_IMPLIES_RESIDUALLY_FINITE_2026-08-14.md</code>. The derivation is elementary and needs no ergodic machinery: inside any sofic approximation, choosing alternate points along each nontrivial cycle of <code>sigma_n(g)</code> gives <code>A_n</code> with <code>sigma_n(g)A_n</code> disjoint from <code>A_n</code> and <code>|A_n| &gt;= (|Omega_n| - |Fix|)/3</code>, so the limit action has a set <code>A</code> with <code>mu(A) &gt;= 1/3</code> and <code>mu(gA intersect A) = 0</code>.  Weak containment in finite actions then supplies a finite action and a set <code>B</code> with <code>nu(B) &gt; 1/4</code> and <code>nu(gB intersect B) &lt; 1/12</code>, so <code>g</code> moves a point of a finite <code>G</code>-set and survives the finite-index kernel of that action.  The cycle-parity step is what replaces a Rokhlin argument, and it sidesteps the fact that the ultraproduct space is not standard.</p>\n<p><strong>Citation, now corroboration rather than support.</strong>  The statement is asserted by Gohla--Thom, <code>arXiv:2403.09582v2</code> section 3.2 (\"any sofic group which is stable in finite actions must be residually finite\") and by Chapman--Dikstein--Lubotzky, <code>arXiv:2410.02913v2</code> (\"as sofic stable groups are residually finite [GR09]\"), both crediting Glebsky--Rivera, <em>Almost solutions of equations in permutations</em>, Taiwanese J. Math. 13 (2009) 493--500, <code>arXiv:0709.1134</code>.  Both secondary statements were read from the PDFs by <code>cairn-scout</code>.</p>\n<p><strong>Primary now read (2026-08-14 scout) \u2014 and the attribution is too generous.</strong> Glebsky--Rivera prove:</p>\n<p>&gt; <strong>Proposition 3.</strong> If <code>G = &lt;x_1,...,x_k | w_i(x_1,...,x_k) = u_i(x_1,...,x_k), &gt; i = 1,...,r&gt;</code> is sofic and System 2 is stable, then <code>G</code> is residually finite.</p>\n<p>with the contrapositive as the second bullet of their Theorem 2: \"If the group <code>G</code> is sofic but not residually finite, then the system (2) is unstable in permutations.\"</p>\n<p>Their \"stable\" is Definition 1.3: stability <em>of a system of equations</em>, with a rate <code>delta_eps -&gt; 0</code> independent of <code>n</code>, and the exact solution required to lie in the <strong>same</strong> <code>S_n</code>.  So it is <strong>strict</strong> permutation stability \u2014 no enlargement, hence not flexible \u2014 and it is a property of a <strong>finite presentation</strong>, not of an abstract countable group.  Glebsky--Rivera therefore do not prove the statement in this node's title; the Gohla--Thom form (weaker stability notion, arbitrary countable group) is strictly stronger, and they assert it in section 3.2 as their own observation, without proof and without a pinpoint into Glebsky--Rivera.</p>\n<p>This is now harmless, because the in-repo proof above discharges it.  Two things worth keeping from the primary anyway: for a finitely presented group, \"sofic and not residually finite implies the defining system is unstable in permutations (strict sense)\" is available with <strong>no</strong> second-hand step at all; and the worked example printed after their Theorem 2 calls a system \"unstable in permutations, because the corresponding group is finite\", contradicting their own first bullet \u2014 a typo in the source, so do not quote that sentence.</p>"}, {"id": "steinberg-hs-stability-equals-nonhyperlinearity", "status": "ESTABLISHED", "root": false, "goal": false, "title": "The Leavitt--Steinberg fork is an equivalence, not merely a dichotomy", "impact": 0, "frontier": false, "lock": null, "html": "<p>For <code>L=L_(F_2)(1,2)</code>, <code>U=St_5(L)</code> and <code>Q=EL_4(L)</code>, the following are equivalent.</p>\n<p>1. <code>U</code> is normalized-HS stable, in the strict same-dimension sense. 2. <code>U</code> has no nontrivial hyperlinear quotient. 3. <code>Q</code> is nonhyperlinear.</p>\n<p><strong>The statement to be careful about.</strong>  Condition 3 is <em>not</em> interchangeable with \"<code>U</code> is nonhyperlinear\".  Nonhyperlinearity of <code>U</code> forbids only an <strong>injective</strong> homomorphism into a tracial matrix ultraproduct, while condition 2 forbids every nontrivial one.  These differ exactly where the unstable branch lives: a nontrivial noninjective homomorphism has central kernel and makes a proper central quotient of <code>U</code> hyperlinear while leaving <code>U</code> itself possibly nonhyperlinear.  Condition 3 is the strong end -- <code>Q</code> nonhyperlinear implies <code>U</code> nonhyperlinear by central-quotient permanence, and not conversely -- so the equivalence must be stated with <code>Q</code>.</p>\n<p><strong>Why it matters.</strong>  The fork alone leaves it open whether the stable branch is a step toward a nonhyperlinear group or is one.  The equivalence settles that: on the stable branch <code>Q</code> is an explicit nonhyperlinear group, and <code>U</code> is another.  There is no intermediate saving to be had, and no route that proves <code><a href=\"leavitt-steinberg-hs-stable.html\">leavitt-steinberg-hs-stable</a></code> can be cheaper than producing the first nonhyperlinear group known.  Symmetrically, <code>U</code> would be the first infinite Kazhdan group known to be HS-stable, since every Kazhdan group whose status is settled is residually finite, hence sofic, hence hyperlinear, hence unstable by Becker--Lubotzky.</p>\n<p>Recorded in prose at <code>docs/NON_MF_TO_HYPERLINEAR_DIFFERENTIAL_AUDIT.md:78-103</code> as <code>(DHA5)</code>/<code>(DHA6)</code>; this node supplies the converses that turn the two implications there into one equivalence.</p>"}, {"id": "steinberg-hyperfinite-hs-stable", "status": "ESTABLISHED", "root": false, "goal": false, "title": "The binary Leavitt Steinberg cover is hyperfinitely HS-stable", "impact": 0, "frontier": false, "lock": null, "html": "<p>For <code>U=St_5(L_(F_2)(1,2))</code>, hyperfinite Hilbert--Schmidt stability holds unconditionally, in the sense of Dogon--Vigdorovich.  <code>docs/NOTEPAD.md:22220</code>:</p>\n<p>&gt; <strong>Theorem (unconditional hyperfinite HS stability).</strong>  The group <code>U</code> is &gt; hyperfinitely Hilbert--Schmidt stable in the sense of Dogon--Vigdorovich.</p>\n<p>The operative consequence, <code>docs/NOTEPAD.md:22234</code>:</p>\n<p>&gt; Consequently any witness to the unstable branch must generate a genuinely &gt; nonamenable limiting von Neumann algebra.  Hyperfinite, AF, &gt; amenable-factor, and character-approximation constructions are completely &gt; closed for this group.</p>\n<p>This is a <strong>restriction</strong>, not a branch selection: it constrains only the amenable part of the trace simplex, and the fork lives entirely outside it. Its value is as a fence.  Any proposed construction for <code><a href=\"leavitt-steinberg-hs-unstable.html\">leavitt-steinberg-hs-unstable</a></code> whose limit algebra is hyperfinite, AF, or an amenable factor, or which proceeds by approximating a character, is refuted before it is built.</p>"}, {"id": "symmetric-double-weak-mf", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Symmetric doubles of residually finite groups are weak MF", "impact": 1, "frontier": false, "lock": null, "html": "<p>Every symmetric double</p>\n<pre>\nD = G *_Gamma G\n</pre>\n<p>of a countable residually finite group <code>G</code> over an arbitrary subgroup <code>Gamma &lt;= G</code> is weak MF, i.e. MF in the operator-norm Carrion--Dadarlat--Eckhardt/Shulman norm-matrix-corona sense.</p>\n<p>There is a finite-lamp version: for <code>K != 1</code> finite,</p>\n<pre>\nH_K = G *_Gamma (Gamma x K)\n</pre>\n<p>is weak MF, by the Bass--Serre covering whose kernel is an amalgam of <code>|K|</code> copies of <code>G</code> over <code>Gamma</code>, plus closure of weak MF under finite extensions.</p>\n<h3>Why this is the load-bearing half of the lamp-type separation</h3>\n<p>Combined with <code><a href=\"kun-thom-nonsofic-wreath.html\">kun-thom-nonsofic-wreath</a></code> (nonsoficity, via the Kun--Thom centralizer-normalization theorem applied to <code>k</code> centralizing <code>Gamma</code>), this gives explicit groups that are <strong>weak MF and nonsofic</strong>. That separation is exactly what <code><a href=\"nonsofic-mechanism-mf-classification.html\">nonsofic-mechanism-mf-classification</a></code> asks for on the free-lamp side of the mechanism.</p>\n<p>Note the scope limit recorded in <code>docs/NOTEPAD.md:857-860</code>: this separates weak MF from sofic. It does <strong>not</strong> separate Schafhauser-MF or hyperlinear from sofic, because operator-norm separation can be supported on a subspace of vanishing normalized rank. The point is the same one that <code><a href=\"weak-mf-embedding-not-reusable.html\">weak-mf-embedding-not-reusable</a></code> makes in general.</p>\n<h3>What it does not cover</h3>\n<p>The argument is about the <strong>free-lamp amalgam</strong>, not the commuting-lamp wreath. <code>docs/NOTEPAD.md:30421-30423</code> is explicit about the boundary:</p>\n<p>&gt; Correction: weak MF of W is not banked. The symmetric-double proof applies &gt; to the free-lamp amalgam, not to the commuting-lamp wreath product. Thus &gt; this finite certificate is valid but stronger than the already-open weak-MF &gt; problem for W.</p>\n<p>So <code><a href=\"kun-thom-wreath-weak-mf.html\">kun-thom-wreath-weak-mf</a></code> remains open and is not a corollary of this.</p>"}, {"id": "target-packet-synchronization", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Commuting target packets synchronize transition PVMs", "impact": 0, "frontier": false, "lock": null, "html": "<p>For one common source projection <code>P</code> and two target PVMs <code>E, F</code>, the transition POVMs <code>P E\u1d62 P</code> and <code>P F\u2c7c P</code> satisfy a cardinality-free total commutator bound: its square root is at most <code>\u221a(target commutator energy) + \u221a(E leakage/2) + \u221a(F leakage/2)</code>. Individual de la Salle rounding preserves vanishing total commutator energy without an outcome-count loss. The multi-edge analytic gate closes whenever the raw/four-root packet routes the three required pairs to commuting target root packets on common source carriers.</p>"}, {"id": "telescope-core-not-residually-finite", "status": "ESTABLISHED", "root": false, "goal": false, "title": "The telescope core is LEF but not residually finite", "impact": 0, "frontier": false, "lock": null, "html": "<p>Let <code>E_T = N_E semidirect T</code> be the telescope core of the literal group, the kernel of the stable-letter exponent <code>E -&gt; Z</code>.  Then <code>E_T</code> is LEF \u2014 every finitely generated subgroup is residually finite (<code><a href=\"literal-telescope-core-lef.html\">literal-telescope-core-lef</a></code>) \u2014 but <code>E_T</code> is <strong>not</strong> residually finite: every homomorphism from <code>E_T</code> to a finite group kills the marked involution <code>w</code>, which is nontrivial by <code>prop:witness</code>.</p>\n<p>The mechanism needs no stable letter.  Level collapse in a finite quotient is usually derived from conjugation by <code>tau</code> (<code><a href=\"finite-quotient-blindness.html\">finite-quotient-blindness</a></code>), and <code>tau</code> is not in <code>E_T</code>; but <code>phi(T) = phi(Gbar)</code> already holds in every finite quotient of <code>T</code> alone, because <code>Z[1/2]^3</code> is 2-divisible.</p>\n<p>Two consequences worth stating.</p>\n<ul>\n<li>The word \"locally\" in <code><a href=\"literal-telescope-core-lef.html\">literal-telescope-core-lef</a></code> is necessary.  The</li>\n<p>positive half is optimal: one cannot strengthen it to residual finiteness of <code>E_T</code>.</p>\n<li>It makes the directed-union step of the soficity proof concrete rather than</li>\n<p>merely formally valid.  <code>w</code> is nontrivial in every block window <code>M_J</code>, and in every sufficiently fine finite quotient of every <code>M_J semidirect Gamma_n</code>, yet <code>w</code> dies in every finite quotient of the union <code>E_T</code>.  A directed union of residually finite groups need not be residually finite, and here it demonstrably is not \u2014 which is why the soficity argument approximates windows and never the whole core.</p>\n</ul>"}, {"id": "thom-central-corner-criterion", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Thom's central-corner criterion and central-quotient descent", "impact": 0, "frontier": false, "lock": null, "html": "<p>Thom, arXiv:0810.2180, <strong>Lemma 3.3</strong> (verified verbatim from the PDF, record in the artifact): for a group <code>G</code> with central subgroup <code>C</code> and classifying cocycle <code>alpha</code>,</p>\n<pre>\nG is hyperlinear  &lt;=&gt;  L_(beta o alpha)[G/C] embeds into R^omega\n                       for every character beta in hat(C).\n</pre>\n<p><strong>Remark 3.4</strong>: every quotient of a hyperlinear group by a central subgroup is again hyperlinear.</p>\n<p>Instantiated at <code>Wtilde=C(X) semidirect G</code> with <code>C=&lt;z&gt;</code>, the two characters give exactly <code>L(W)=M_KT</code> and <code>Cl(X) crossed_product G</code>, so the criterion reproduces <code><a href=\"clifford-bernoulli-central-summands.html\">clifford-bernoulli-central-summands</a></code> from the literature, and the descent step supplies the deduction chain</p>\n<pre>\nCl(X) crossed_product G embeddable\n  ==&gt; Wtilde hyperlinear (it embeds in U of that algebra)\n  ==&gt; W=Wtilde/&lt;z&gt; hyperlinear                    [Remark 3.4]\n  ==&gt; with Kun--Thom nonsoficity of W, Question 3.4 is answered.\n</pre>\n<p>Numbering note: the statements are Lemma 3.3 and Remark 3.4; a circulating \"Lemma 3.4 / Remark 3.5\" reference is off by one.  The proof of Lemma 3.3 also uses, as standard, that <code>G</code> is hyperlinear iff <code>L(G)</code> embeds into <code>R^omega</code>.</p>"}, {"id": "torsion-free-countable-non-mf", "status": "OPEN", "root": false, "goal": false, "title": "A torsion-free countable non-MF group", "impact": 1, "frontier": true, "lock": null, "html": "<p>There is a torsion-free countable \u2014 ideally recursively presented \u2014 group that is not MF.</p>\n<p>By <code><a href=\"mf-positive-controls.html\">mf-positive-controls</a></code> (subgroups of MF groups are MF), non-MF-ness passes <strong>up</strong> to every overgroup.  Hence the finite-presentation requirement in the root is not where the difficulty lies: any torsion-free countable non-MF group placed inside a torsion-free finitely presented group settles the root, and conversely every non-MF subgroup of a torsion-free group is itself a torsion-free countable non-MF group.  So this claim and the root are equivalent modulo <code><a href=\"torsion-free-higman-embedding.html\">torsion-free-higman-embedding</a></code>.</p>\n<p>The same heredity is what kills the naive repair strategies for the root, recorded there: covers do not work (non-MF does not pass down to a group that surjects onto a non-MF group \u2014 free groups are residually finite, hence MF, and surject onto everything), and embeddings of the existing witness do not work (it contains an involution, so no torsion-free group contains it).</p>"}, {"id": "torsion-free-finitely-presented-non-mf", "status": "ESTABLISHED", "root": true, "goal": false, "title": "Torsion-free finitely presented non-MF group", "impact": 0, "frontier": false, "lock": null, "html": "<p>There exists a torsion-free finitely presented group that is not MF in the norm-matrix-corona sense.</p>\n<p>The <em>finite-normal</em> mechanism cannot prove this directly: every finite subgroup of a torsion-free group is trivial, whereas its final obstruction is a nontrivial finite normal subgroup.  That statement is about one branch only, and the claim used to stop there.  It is not the state of the art in this repository.</p>\n<h3>Which branch is torsion-critical, and which is not</h3>\n<p>Every corona-transport proof faces the same wall.  Kazhdan transport concludes in the <strong>normalized Hilbert--Schmidt</strong> norm, while MF separates in <strong>operator</strong> norm, and by <code><a href=\"hs-invisibility-inflation-no-go.html\">hs-invisibility-inflation-no-go</a></code> the first can never by itself contradict the second: any corona model can be inflated by a trivial block until every element is HS-invisible without changing a single operator norm.  So every proof must renormalize the trace on a corner cut by a nonzero projection commuting with the image.  There are three known ways to get that projection, and only the first two need torsion.</p>\n<p>1. <strong>Finite normal subgroup</strong> \u2014 average over it (<code><a href=\"finite-normal-compression-obstruction.html\">finite-normal-compression-obstruction</a></code>). 2. <strong>Central mark of finite order</strong> \u2014 its spectrum is finite, so the projection is its own spectral projection (<code><a href=\"central-sign-corona-obstruction.html\">central-sign-corona-obstruction</a></code>). <code><a href=\"corona-corner-detection-criterion.html\">corona-corner-detection-criterion</a></code> restates this branch without the order hypothesis and shows torsion is consumed at exactly one step; the residual hole is <code><a href=\"commutant-projection-extraction.html\">commutant-projection-extraction</a></code>. 3. <strong>Normal subgroup with property (T) inside the defect</strong> \u2014 the projection is the Kazhdan fixed-space projection, and <em>normality</em> is what makes it invariant under the ambient group.  <strong>This branch needs no finiteness, no centrality and no torsion at all</strong>, and it is machine-checked: <code><a href=\"normal-kazhdan-defect-non-mf.html\">normal-kazhdan-defect-non-mf</a></code>.</p>\n<p>So the root has no remaining analytic obstacle.  What it needs is a torsion-free finitely presented group whose compression defect contains a nontrivial normal Kazhdan subgroup.</p>\n<h3>Ideas</h3>\n<p>The primary route is <code><a href=\"torsion-free-non-mf-from-normal-kazhdan-defect.html\">torsion-free-non-mf-from-normal-kazhdan-defect</a></code>: Fournier-Facio's published torsion-free finitely presented Kazhdan group (arXiv:2608.02025) already carries the compression core and already has a finitely presented simple group inside its compression defect (<code><a href=\"fournier-facio-torsion-free-skeleton.html\">fournier-facio-torsion-free-skeleton</a></code>).  The single gap is <code><a href=\"defect-normally-generates-torsion-free-quotient.html\">defect-normally-generates-torsion-free-quotient</a></code> \u2014 make the normal closure of that simple factor Kazhdan, most cheaply by making it of finite index. That gap is pure combinatorial group theory about a small-cancellation quotient; no operator algebra remains in it.</p>\n<p>Two secondary routes are recorded and are worth keeping because they need no small-cancellation machinery: <code><a href=\"torsion-free-non-mf-from-infinite-order-mark.html\">torsion-free-non-mf-from-infinite-order-mark</a></code> and <code><a href=\"torsion-free-non-mf-from-coordinate-invariants.html\">torsion-free-non-mf-from-coordinate-invariants</a></code> (replace the Clifford sign by a Heisenberg centre, then detect it either on a commutant corner or on the Kazhdan-invariant subspace of the coordinate ultraproduct), and <code><a href=\"torsion-free-fp-from-countable-witness.html\">torsion-free-fp-from-countable-witness</a></code> (shed finite presentation via subgroup heredity and a torsion-free Higman embedding).  Branch 3 does not subsume the central-mark branch: the cyclic group generated by a mark is amenable and never has property (T), so branch 3 bites only when the mark happens to sit inside a <em>larger</em> normal Kazhdan subgroup of the defect \u2014 which is possible (Kazhdan groups may have infinite centre, as Deligne's does) but is a different design.</p>\n<p>Analyzed dead space.</p>\n<ul>\n<li><strong>Covers.</strong>  Non-MF does not pass down along surjections: free groups are</li>\n<p>residually finite, hence MF, and surject onto every finitely generated group, including <code>E</code>.  A torsion-free group mapping onto <code>E</code> therefore carries no obstruction unless the mark itself lifts, which is the infinite-order central mark route and not a cover argument.</p>\n<li><strong>Embeddings of the existing witness.</strong>  Non-MF does pass <strong>up</strong>:</li>\n<p>subgroups of MF groups are MF (<code><a href=\"mf-positive-controls.html\">mf-positive-controls</a></code>).  But <code>E</code> and the Clifford witness contain an involution, so no torsion-free group contains either.  The useful residue is the reduction <code><a href=\"torsion-free-countable-non-mf.html\">torsion-free-countable-non-mf</a></code>: any torsion-free non-MF <strong>subgroup</strong> suffices, so finite presentation is not the difficulty.</p>\n<li><strong>Winding numbers.</strong>  <code><a href=\"matrix-corona-k1-vanishes.html\">matrix-corona-k1-vanishes</a></code>: <code>K_1</code> of every norm</li>\n<p>matrix corona is zero, so no Bott or index invariant of the mark alone can obstruct anything.  Relative indices of a <em>pair</em> do survive (<code><a href=\"matrix-corona-k0-index-survives.html\">matrix-corona-k0-index-survives</a></code>), and the developed form of that invariant exists \u2014 Dadarlat's Exel--Loring formula.  What it buys and what blocks it is <code><a href=\"exel-loring-mark-quantization.html\">exel-loring-mark-quantization</a></code>; note in particular that it is <strong>incompatible with the stability route</strong> on the same base group, since a base carrying a usable mark has nonvanishing even rational cohomology and hence fails point-norm matricial stability.</p>\n<li><strong>Roots of unity by relations.</strong>  Forcing <code>sigma eps sigma^-1 = eps^d</code></li>\n<p>makes <code>sp(Theta(eps))</code> invariant under <code>z -&gt; z^d</code>, which with clause 2 of <code><a href=\"corona-corner-detection-criterion.html\">corona-corner-detection-criterion</a></code> leaves only <code>{1}</code> and the full circle.  It does not close the full-circle case, and it costs centrality in the whole group (a central <code>eps</code> with <code>eps^{d-1} = 1</code> is torsion again), so <code>eps</code> may only be central in the transport subgroup.</p>\n</ul>\n<p>Literature boundary, source-verified this session.  Bachner--Dogon--Lubotzky, <em>On L^1-approximation of groups</em> (arXiv:2508.17392, revised April 2026), Definition 1.2 defines a group of <strong>Deligne type</strong> by the existence of a central element <code>J</code> <strong>of order 2</strong> with <code>J</code> trivial in every finite quotient; their Proposition 1.5 shows such a group is not MF <strong>if</strong> it is operator-HS-stable, and their Conjecture 1.8 would supply that stability from vanishing of <code>H^2</code> with unitary coefficients.  Their proof rounds <code>J</code> to an exact involution, cuts to its <code>-1</code> eigenspace, and compresses \u2014 the same corner step, torsion-critical in the same place.  The paper still records the MF question as open.  So <strong>both</strong> routes to non-MF known outside this repository are torsion-critical, and <code><a href=\"commutant-projection-extraction.html\">commutant-projection-extraction</a></code> is their shared bottleneck; branch 3 above, which is not torsion-critical, has no counterpart in the published literature.  The uniform-stability results for high-rank lattices in submultiplicative norms (Glebsky--Lubotzky--Monod--Rangarajan, <em>Asymptotic cohomology and uniform stability for lattices in semisimple groups</em>, arXiv:2301.00476; abstract read, theorem statements not) do not close it, and Bachner--Dogon--Lubotzky conjecture their stability input rather than cite them.  Two reasons, the first structural rather than cited: a Deligne centre that is infinite cyclic \u2014 the torsion-free case \u2014 requires a lattice in a group with infinite fundamental group, that is of Hermitian type, whereas the <code>SL_n</code> families are the ones stability is known for; and condition (<code>*</code>) is a <strong>mixed</strong>-norm statement (defect in operator norm, closeness in Hilbert--Schmidt), which is not uniform stability in one submultiplicative norm.</p>"}, {"id": "torsion-free-higman-embedding", "status": "OPEN", "root": false, "goal": false, "title": "Torsion-free Higman embedding", "impact": 1, "frontier": true, "lock": null, "html": "<p>Every recursively presented torsion-free group embeds into a finitely presented torsion-free group.</p>\n<p>A weaker statement is available and is enough for many purposes: there is a <strong>universal finitely presented torsion-free group</strong>, one that contains a copy of every finitely presented torsion-free group.  Fournier-Facio uses exactly this as the first input of arXiv:2608.02025 Section 2, citing Higman 1961, Belegradek--Szczepanski 2008, and Chiodo 2014; the repository carries <code>GroupApproximation/Monsters/UniversalFinitelyPresentedTorsionFreeGroup.lean</code> for the countable payload.  Verified at usage level (Fournier-Facio's text read in full this session), not at the level of the three cited sources. That form absorbs finitely presented torsion-free groups only, so it does not by itself discharge the claim below, which is about recursively presented ones.</p>\n<p>Status of the full statement: <strong>literature-plausible, not verified at theorem level in this repository.</strong>  The standard Higman construction proceeds by iterated HNN extensions and amalgamated free products over free groups, and torsion elements of an HNN extension are conjugate into the base while torsion elements of an amalgam are conjugate into a factor; so torsion-freeness is formally preserved by every step, provided the auxiliary groups are chosen torsion-free.  Verified at abstract level only: Chiodo--Hill, <em>Preserving torsion orders when embedding into groups with \"small\" finite presentations</em>, states that the Boone--Collins embedding of a <strong>finitely presented</strong> group into an 8-generator 26-relator group preserves the set of orders of torsion elements, and in particular torsion-freeness, and that there is a universal finitely presented torsion-free group.  That is the finitely-presented-to-finitely-presented statement, not the recursively presented one.  Belegradek is cited in the secondary literature for the torsion-free universal group; his theorem statement was <strong>not</strong> read in this session and must not be cited until it is.</p>\n<p>Do not treat this claim as established, and do not let a route depend on it silently: if it is only needed to shed finite presentation, say so.</p>"}, {"id": "trace-blindness-sharpness", "status": "ESTABLISHED", "root": false, "goal": false, "title": "The trace-blindness of II\u2081 factors is sharp", "impact": 0, "frontier": false, "lock": null, "html": "<p>Take <code>R = \u2297_{n\u2208\u2124} M\u2082</code> with the Bernoulli shift <code>\u03b8</code> and <code>N = \u2297_{n\u22650} M\u2082</code>: then <code>\u03b8(N) \u228a N</code>, <code>\u03b8</code> is properly outer, and <code>M = R \u22ca_\u03b8 \u2124</code> is a <code>II\u2081</code> factor whose implementing unitary satisfies <code>uNu* \u228a N</code>. So no conjugation-invariant strictly-monotone size exists in <code>II\u2081</code>, and NO invariant argument \u2014 index, entropy, or undiscovered \u2014 can settle the open branch. The obstruction, if there is one, can only be stability.</p>"}, {"id": "tracial-coordinate-transport-barrier", "status": "ESTABLISHED", "root": false, "goal": false, "title": "The traced coordinate class cannot be widened to tracial ultraproducts", "impact": 0, "frontier": false, "lock": null, "html": "<p>The coordinate class <code>C_ftr</code> of <code><a href=\"finite-tracial-cstar-transport.html\">finite-tracial-cstar-transport</a></code> cannot be widened to normalized-Hilbert--Schmidt (tracial-ultraproduct) coordinates: no tracial analogue of the central-sign conclusion is true, and the failure is localized at exactly one step.</p>\n<p>1. <em>Transport is not the obstruction.</em>  <code><a href=\"finite-traced-kazhdan-transport.html\">finite-traced-kazhdan-transport</a></code> holds with the asymptotic-commutant hypothesis taken in <code>||.||_2</code>, so the property-<code>(T)</code> fixed-space argument survives the passage to tracial coordinates unchanged. 2. <em>The corner is the obstruction.</em>  The architecture cuts to the negative spectral sector of the mark and renormalizes.  By <code><a href=\"corner-renormalization-cost.html\">corner-renormalization-cost</a></code> this costs <code>tau(p)^(-1/2)</code> in the tracial world and nothing in the operator-norm world, and <code>tau(p)</code> may be <code>0</code>. 3. <em>This is not a technical gap.</em>  The conclusion itself is false tracially: the mark of the literal group lies in the MF residual but not in the hyperlinear residual, so no theorem of the form \"every tracial matrix model kills the mark\" can hold.</p>\n<p>Hence within this architecture the only tracial freedom left is a corner of positive trace, i.e. a mark whose spectral sector has positive density --- the same quantity as the effective-rank profile of <code><a href=\"mf-trace-gap-defect-ratio-models.html\">mf-trace-gap-defect-ratio-models</a></code>.</p>"}, {"id": "tracial-median-concentration", "status": "OPEN", "root": false, "goal": false, "title": "Tracial median concentration of the block-size observable", "impact": 1, "frontier": false, "lock": null, "html": "<p>Given a nested pair of almost-invariant block algebras as in <code><a href=\"hs-expander-block-decomposition.html\">hs-expander-block-decomposition</a></code> -- coarse ambient blocks <code>q_A</code> almost invariant under <code>G</code>, fine blocks <code>p_i</code> almost invariant under <code>Gamma</code>, all inside one abelian algebra -- put</p>\n<pre>\nM = sum_i tau(p_i) p_i,\nf = sum_A q_A * M (M + m_A)^(-1) q_A,\n</pre>\n<p>where <code>m_A</code> is a median of the distribution of <code>M</code> in the corner <code>q_A</code> normalized by <code>tau(q_A)</code>.  Ask for: <code>\u2016f - 1/2\u2016_1 -&gt; 0</code>, hence a projection <code>e</code> of trace <code>-&gt; 1</code> such that any two fine blocks meeting <code>e</code> inside a common ambient block have traces differing by a factor tending to <code>1</code>.</p>\n<p>That last sentence is the operative output.  It says the fine blocks are <strong>asymptotically of equal trace</strong>, which is why this node exists: the unequal-trace case of the transcription is not a case to be handled separately, it is this statement.</p>\n<h3>Why this is the right unit</h3>\n<p>Reading <code>official/counterexample.tex:310-371</code> settles what the median device is for.  It is not a technique for coping with unequal component sizes; it is the proof that they are asymptotically equal.  The manuscript's <code>M(z)</code> is the size of the <code>Gamma</code>-component of <code>z</code>, and the paragraph at <code>:310</code> says plainly why raw sizes cannot be used -- \"The values of <code>M</code> need not be uniformly bounded, so these exceptional sets cannot control its total variation\" -- so <code>M</code> is renormalized to <code>f=M/(M+m_A)</code>, for which <code>1/2</code> is a median on every ambient component <code>A</code>.  Its conclusion <code>(8)</code> at <code>:365-370</code> is</p>\n<pre>\nrho_n^(-1) &lt;= M(w)/M(z) &lt;= rho_n,     rho_n -&gt; 1,\n</pre>\n<p>for <code>z,w</code> in the same <code>A</code> off a set of size <code>o(N)</code>, glossed at <code>:371</code> as \"the sizes of original components meeting the same set <code>A \\ E_n</code> differ by a factor tending uniformly to one\".  Step 3 then consumes exactly that: <code>(8)</code> gives <code>|P triangle Q(P)| = o(|P|)</code>, hence <code>|P cap Q(P)| &gt; |Q(P)|/2</code>, hence an injective matching.</p>\n<p>Tracially the boundedness worry is void -- <code>M &lt;= 1</code> by construction, since <code>tau(p_i) &lt;= 1</code> -- so the normalization is a continuous functional calculus of a bounded positive operator.  What survives as real content is the concentration, and the demand that <code>m_A</code> be a <strong>fiberwise</strong> median over the ambient blocks, which is why the pair must be nested.</p>\n<h3>The obstruction is inherited, not new</h3>\n<p>The manuscript proves concentration by coarea plus Cheeger (<code>:342-355</code>): the identity <code>integral_0^1 |bd_A{f&gt;t}| dt = sum_{edges in A} |f(z)-f(w)|</code>, then expansion applied to sublevel and superlevel sets -- each of which has at most <code>|A|/2</code> vertices on the relevant side precisely because <code>1/2</code> is a median of <code>f</code> on <code>A</code> -- giving <code>gamma_G sum_{z in A} |f(z)-1/2| &lt;= sum_{edges} |f(z)-f(w)|</code>.</p>\n<p>The two halves have very different status in the normalized-HS metric.</p>\n<ul>\n<li><strong>Coarea transcribes, and is already proved.</strong></li>\n<p><code>docs/TRUE_SPECTRAL_COAREA_INVARIANT_CUT.md</code> <code>(SCI2)</code>: <code>integral_0^1 \u2016[P_t,A]\u2016_2^2 dt &lt;= \u2016[H,A]\u2016_2 \u2016A\u2016_2</code> for the spectral projections <code>P_t</code> of a positive contraction <code>H</code>, with a common-threshold form <code>(SCI5)</code> for finitely many arrows.  This is the exact analogue of the finite coarea identity the manuscript uses.</p>\n<li><strong>Cheeger expansion does not, and is the same missing input.</strong>  The</li>\n<p>inequality <code>|bd_A U| &gt;= gamma_G min(|U|,|A \\ U|)</code> is uniform expansion of the ambient blocks, which is Kun's theorem and hence <code><a href=\"hs-expander-block-decomposition.html\">hs-expander-block-decomposition</a></code> again.</p>\n</ul>\n<p>So this node does not add a second independent obstruction.  It shows the one missing input is consumed <strong>twice</strong> -- once to produce the blocks, once to pin the size observable -- and that the other half of the pinning step is already available.  A proof that produced blocks without uniform gap would still stall here.</p>"}, {"id": "transition-equivariance", "status": "OPEN", "root": false, "goal": false, "title": "Raw/comb transition unitary is equivariant for the named middle-root translations", "impact": 1, "frontier": true, "lock": null, "html": "<p>Verify, for all four one-sided maps, that the raw/comb transition unitary carries each named middle-root translation to its transported translation (AGENDA 2026-08-14, \"equivariant transitions produce whole-map PVMs\"). This makes the transition PVM equivariant, which is the hypothesis of the whole-map coarsening theorem <a href=\"whole-map-coarsening.html\">whole-map-coarsening</a>.</p>"}, {"id": "two-point-orbit-approximation", "status": "OPEN", "root": false, "goal": false, "title": "The Kun\u2013Thom coset action admits a two-point approximation at the marked pair", "impact": 0, "frontier": false, "lock": null, "html": "<p>Let <code>\u0393 &lt; G</code> be the Kun\u2013Thom Theorem E pair, <code>X = G/\u0393</code>, and fix the marked pair <code>p = \u0393</code>, <code>q = t\u0393</code> with <code>t</code> a strict compressor, so <code>p \u2260 q</code>.</p>\n<p><strong>Definition (two-point approximation at <code>(p,q)</code>).</strong> For every finite <code>F \u2286 G</code> and <code>\u03b5 &gt; 0</code> there exist a finite set <code>A</code>, a unital <code>(F,\u03b5)</code>-multiplicative <code>\u03c6 : G \u2192 Sym(A)</code> in the normalized Hamming metric, a subset <code>S \u2286 A</code> with <code>|S| &gt; (1\u2212\u03b5)|A|</code>, a finite set <code>B</code>, and maps <code>j_s : {p,q} \u2192 B</code> for <code>s \u2208 S</code> with</p>\n<pre>\nj_s(p) \u2260 j_s(q),        and       j_{\u03c6(g)\u00b7s}(x) = j_s(g\u207b\u00b9\u00b7x)\n</pre>\n<p>for all <code>g \u2208 F</code>, <code>s \u2208 S</code> with <code>\u03c6(g)\u00b7s \u2208 S</code>, and <code>x \u2208 {p,q}</code> with <code>g\u207b\u00b9\u00b7x \u2208 {p,q}</code>.</p>\n<p>The claim asserts that such approximations exist.</p>\n<h3>Why this is not a restatement of the target</h3>\n<p>The sofic-action definition quantifies the same data over <strong>every</strong> finite window <code>E \u2286 X</code>, and demands <code>\u03c0_s : E \u21aa B</code> injective and equivariant for all of <code>E</code>. This asks for <code>E = {p,q}</code> only. The equivariance clause is therefore vacuous except for the <code>g \u2208 F</code> that map the pair into itself, and no compatibility across different windows is required. <code><a href=\"coordinate-action-not-sofic.html\">coordinate-action-not-sofic</a></code> refutes the universally quantified statement; it does not refute this one, and nothing in the graph derives one from the other. The claim also names no length, no character, no lamp group and no von Neumann algebra, so it is not <code><a href=\"hilbert-embeddable-witness-for-kun-thom-wreath.html\">hilbert-embeddable-witness-for-kun-thom-wreath</a></code> in different words: it is a statement purely about the <code>G</code>-set <code>G/\u0393</code>.</p>\n<h3>Quantifier check against a dumb model</h3>\n<p>The one-point model \u2014 <code>A = {\u2217}</code>, <code>S = A</code>, <code>\u03c6(g) = id</code>, <code>B = {0,1}</code>, <code>j_\u2217(p) = 0</code>, <code>j_\u2217(q) = 1</code> \u2014 satisfies multiplicativity and distinctness trivially. It <strong>fails</strong> the equivariance clause: the action is transitive, so some <code>g \u2208 G</code> has <code>g\u207b\u00b9\u00b7p = q</code>, and then <code>\u03c6(g)\u00b7\u2217 = \u2217 \u2208 S</code> forces <code>j_\u2217(p) = j_\u2217(q)</code>, contradicting distinctness. So the definition is not vacuous, and the content sits exactly where it should \u2014 in the interaction of approximate multiplicativity with the requirement that a compressor-related pair not be collapsed.</p>\n<p>The neighbouring degenerate reading is also excluded: dropping the density condition on <code>S</code> would let one take <code>S = \u2205</code>. The condition <code>|S| &gt; (1\u2212\u03b5)|A|</code> is what forbids that, and it is the same density condition the sofic-action definition uses.</p>\n<h3>Why it is the live question</h3>\n<p><code><a href=\"finite-quotient-blindness.html\">finite-quotient-blindness</a></code> shows every <strong>exact</strong> finite quotient of <code>G</code> identifies <code>p</code> and <code>q</code>, because the compression <code>t\u0393t\u207b\u00b9 \u2264 \u0393</code> becomes an equality. <code><a href=\"lamp-character-orbit-separation.html\">lamp-character-orbit-separation</a></code> shows that once a model keeps <code>p</code> and <code>q</code> distinct as sites, a generic character orbit separates the mark by an absolute constant, with no dilution \u2014 so the lamp side costs nothing. What remains between the graph and Question 3.4 on this route is precisely whether approximate multiplicativity buys what exact multiplicativity provably does not.</p>\n<p>A <strong>refutation</strong> of this claim would close the weak-soficity route to hyperlinearity of <code>W</code> and, by <code><a href=\"clifford-ce-implies-bernoulli-ce.html\">clifford-ce-implies-bernoulli-ce</a></code>, the Clifford lane with it.</p>\n<p><strong>On the reachability warning.</strong> <code>bin/cairn check</code> reports this claim as open but unreachable from a root, and that is correct rather than an oversight: it is a <strong>necessary</strong> condition for a witness, not a prerequisite of one. The only route touching it, <code><a href=\"witness-yields-two-point-approximation.html\">witness-yields-two-point-approximation</a></code>, runs <em>into</em> it from the witness claim. Nothing requires it, and nothing should until the converse \u2014 the resolution question of that route's final section \u2014 is settled. If the converse is proved, this claim becomes a genuine prerequisite and the warning resolves itself.</p>"}, {"id": "two-site-rigidity-of-lamp-witnesses", "status": "ESTABLISHED", "root": false, "goal": false, "title": "A lamp-to-lamp weak-soficity witness separating the mark must be exactly covariant", "impact": 0, "frontier": false, "lock": null, "html": "<p>Let <code>W = (directSum_(G/Gamma) Z/2Z) semidirect G</code>, let <code>w=a_o a_(h Gamma)</code> be the marked involution, and consider a weak-soficity witness <code>sigma:W-&gt;K_n</code> with bi-invariant length <code>ell_n</code>, defect tending to zero and <code>ell_n(sigma(w)) &gt;= c &gt; 0</code>.  Call the witness <strong>lamp-to-lamp</strong> if <code>K_n</code> has a normal subgroup <code>directSum_(Y_n) Z/2Z</code> with <code>sigma(a_u)=a_(j_n(u))</code> and the <code>sigma(g)</code> normalizing it by permuting sites.</p>\n<p>1. <strong>Two-site rigidity.</strong>  If the conjugation image of <code>K_n</code> on the site set <code>Y_n</code> is 2-transitive, then all elements <code>a_p a_q</code> with <code>p != q</code> are conjugate, so a bi-invariant length gives them <strong>one common value</strong>.  The mark and every covariance error are among them, so they cannot be separated from each other. 2. <strong>Forced exact covariance.</strong>  Consequently, under the hypotheses of 1, the witness must satisfy</p>\n<pre>\n   pi_n(g) j_n(u) = j_n(g u)\n</pre>\n<p>exactly for every <code>g,u</code> in the window \u2014 no covariance error is affordable at all.  The entire multiplicative defect must be carried off the lamp coordinates, by the acting part alone. 3. <strong>Corrected no-dilution bound.</strong>  <code>sqrt(ell_n)</code> is a conjugation-invariant pseudometric, because conditional negative definiteness writes <code>ell_n(a^(-1)b)=||f(a)-f(b)||^2</code>.  Since <code>w = a_o * g a_o g^(-1)</code>, the triangle inequality for <code>sqrt(ell_n)</code> gives <code>ell_n(a_o) &gt;= c/4</code>: every single lamp is expensive.</p>\n<p>So a witness of this shape must break 2-transitivity \u2014 the site sets must carry a nontrivial invariant relation distinguishing the marked pair from the error pairs.  That is the finite shadow of <code><a href=\"invariant-graph-clifford-phase.html\">invariant-graph-clifford-phase</a></code>: the invariant graph structure classified there on <code>G/Gamma</code> is not optional decoration, it is forced on the finite approximations too.</p>"}, {"id": "uniform-finite-mf-obstruction", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Dimension-independent finite operator-norm obstruction for the literal mark", "impact": 0, "frontier": false, "lock": null, "html": "<p>There are a finite subset <code>F_0</code> of the literal group and a number <code>delta &gt; 0</code>, independent of matrix dimension, such that every unitary map whose multiplicative defect is at most <code>delta</code> on <code>F_0</code> sends the marked word within operator norm <code>&lt; 1</code> of the identity.</p>"}, {"id": "universal-mf-quotient", "status": "ESTABLISHED", "root": false, "goal": false, "title": "The MF radical quotient is the universal MF quotient", "impact": 1, "frontier": false, "lock": null, "html": "<p>For every countable group <code>G</code>, let <code>Rad_MF(G)</code> be the intersection of the kernels of all homomorphisms to unitary groups of positive natural-dimension norm-matrix C-star coronas.  This radical is the kernel of one such representation, the quotient <code>G/Rad_MF(G)</code> is MF, and every homomorphism from <code>G</code> to a countable MF group factors through that quotient. Consequently <code>G</code> is MF exactly when <code>Rad_MF(G)</code> is trivial.</p>"}, {"id": "unsquared-defect-finite-model-invisible", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Finite-dimensional invisibility of the unsquared compression defect", "impact": 0, "frontier": false, "lock": null, "html": "<p>Every finite-dimensional linear representation of <code>E</code> kills <code>u = [t c t^-1, v_1]</code>; in particular every homomorphism from <code>E</code> to a finite group kills <code>u</code>.</p>"}, {"id": "unsquared-defect-mf-visible", "status": "OPEN", "root": true, "goal": false, "title": "MF visibility of the unsquared compression defect", "impact": 0, "frontier": false, "lock": null, "html": "<p>The unsquared defect <code>u = [t c t^-1, v_1]</code> does not belong to <code>Rad_MF(E)</code>; equivalently, some norm-matrix-corona representation of <code>E</code> detects <code>u</code>.</p>"}, {"id": "wall-coordinate-reduction-under-at-op62", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Under Alekseev--Thom Open Problem 6.2 the wall becomes a two-centralizer question", "impact": 0, "frontier": false, "lock": null, "html": "<p>Alekseev--Thom, arXiv:2608.05362, Open Problem 6.2 asks whether the commutant of a Kazhdan representation into a tracial matrix ultraproduct is the ultraproduct of the coordinate centralizers of lifts.</p>\n<p><strong>If</strong> that description holds for a wall model, so that <code>N=prod^omega A_n</code> and <code>N_t=prod^omega tilde A_n</code> with <code>A_n&lt;=tilde A_n</code> the exact centralizers in <code>M_(d_n)</code> of the lifted <code>Gamma</code>- and <code>Gamma_1</code>-windows, <strong>then</strong> the trace-preserving expectations are the ultraproduct of the coordinate ones, so <code>[N_t:N]&lt;=lim_omega [tilde A_n:A_n]</code>, and a wall forces</p>\n<pre>\nlim_omega [tilde A_n:A_n]&gt;1.\n</pre>\n<p>So a positive answer to Open Problem 6.2 puts the wall entirely into finite dimensions, as a demand on two nested exact centralizers.  Conversely, without it neither the infinite-index corollary nor the Steinberg cancellation has a coordinate form, because <code>N</code> may be strictly larger than <code>prod^omega A_n</code>.</p>\n<p>The implication is proved; the hypothesis is open and is not asserted.</p>"}, {"id": "wall-energy-amplification", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Wall energy is free \u2014 any wall amplifies to the maximal-energy wall", "impact": 0, "frontier": false, "lock": null, "html": "<p>Let <code>pi:G-&gt;U(M)</code> with <code>M</code> Connes-embeddable finite tracial, and let <code>v in M intersect pi(Gamma)'</code> be a unitary with <code>[v,pi(h)]!=1</code>.  Then the diagonal tensor powers <code>(M^(tensor k),pi^(tensor k),v^(tensor k))</code> are again walls in Connes-embeddable algebras, self-adjoint if <code>v</code> is, and</p>\n<pre>\nsup_k ||v^(tensor k)-pi_k(h)v^(tensor k)pi_k(h)^*||_2^2 &gt;= 2.\n</pre>\n<p>Hence the maximal-energy hypotheses <code>(CHI8)</code> and <code>(WFI4)</code> follow from the existence of any wall, and the flexible-Hilbert--Schmidt-instability conclusions drawn from them hold as soon as a wall exists at all.</p>\n<p>Scope: amplification does <strong>not</strong> produce the Clifford (anticommuting) wall of the Clifford normal form, since <code>v_k w_k=(vw)^(tensor k)</code>.  Anticommutation is a genuinely stronger demand; energy is not.</p>"}, {"id": "wall-models-avoid-norm-microstates", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Wall models stay flexibly far from the whole norm-microstate sector", "impact": 0, "frontier": false, "lock": null, "html": "<p>If <code>(pi_n,v_n)</code> is a relative wall, there is no operator-norm asymptotic representation <code>rho_n:G-&gt;U(D_n)</code> with <code>D_n/d_n-&gt;1</code> and <code>||p_n rho_n(g) p_n-pi_n(g)||_(2,d_n)-&gt;0</code> for every fixed <code>g</code>.</p>\n<p>Consequently a wall model must carry multiplicative defect of order one in <strong>operator</strong> norm on a corner of vanishing normalized trace, and must keep doing so under every flexible correction.</p>\n<p><strong>Independent confirmation.</strong>  <code><a href=\"kun-thom-clifford-extension-not-weak-mf.html\">kun-thom-clifford-extension-not-weak-mf</a></code> proves, by an unrelated route, that the Kun--Thom Clifford extension has no operator-norm microstates at all.  That is the strongest possible form of the present claim on that particular group: not merely that a wall model must avoid the norm sector, but that the sector is empty there.  The two results are in different categories and neither uses the other, so this is a genuine cross-check rather than a restatement -- and it coexists with <code><a href=\"kun-thom-clifford-cover-weakly-sofic.html\">kun-thom-clifford-cover-weakly-sofic</a></code>, since finite groups with bi-invariant metrics are not matrix microstates.  This strictly strengthens the conclusion of <code>docs/TRUE_CLIFFORD_HYPERLINEARITY_FORCES_AMBIENT_HS_INSTABILITY.md</code>, whose target class is only the exact finite-dimensional representations, i.e. the zero-defect members of the same sector.</p>"}, {"id": "weak-mf-embedding-not-reusable", "status": "ESTABLISHED", "root": false, "goal": false, "title": "A given weak-MF embedding can never be re-metrized into a hyperlinear one", "impact": 0, "frontier": false, "lock": null, "html": "<p>Three established facts, each formalized or witnessed explicitly, jointly close the \"reuse the given embedding\" family of strategies for <code><a href=\"mf-implies-hyperlinear.html\">mf-implies-hyperlinear</a></code>.</p>\n<p>1. <em>Padding dilutes.</em>  Identity-block padding preserves units, products, adjoints and every operator-norm distance exactly, while dividing every Hilbert--Schmidt quantity by the relative dimension of the original block: <code>NormTraceGap.l2_opNorm_cornerPad</code>, <code>NormTraceGap.hsDistSq_padMatrix</code>, <code>NormTraceGap.norm_normTrace_padMatrix_sub_one_le</code> (the padded unitary is trace-invisible at rate exactly the relative dimension).</p>\n<p>2. <em>Even exact representations do it.</em>  For irrational <code>theta</code>, the exact representations <code>1 |-&gt; diag(exp(i theta),1,...,1)</code> of <code>Z</code> in <code>U(n)</code> give an operator-norm faithful embedding of <code>Z</code> in the norm quotient which converges to the identity in normalized Hilbert--Schmidt norm (<code>docs/NOTEPAD.md</code>, entry of 2026-08-12).  <code>Z</code> is of course hyperlinear; what the witness shows is that hyperlinearity cannot be obtained by changing the metric on a given weak-MF embedding.</p>\n<p>3. <em>Amplification tracks distance to the scalars, not deviation rank.</em>  The unitary <code>i . 1</code> has invertible deviation <code>i . 1 - 1</code>, yet every tensor power has normalized character of modulus one: <code>NormTraceGap.phase_deviation_no_amplification</code>.  The invariant that amplification does drive is <code>1 - ||normTrace u||</code> (<code>NormTraceGap.norm_normTrace_tensorPow_le</code>).</p>\n<p>Consequently any proof of <code><a href=\"mf-implies-hyperlinear.html\">mf-implies-hyperlinear</a></code> must <em>select</em> models (equivalently, control a rate or find an invariant corner), and any refutation must rule out all of them.  This is also where the two MF conventions part: Schafhauser's trace-controlled/reduced-norm MF implies hyperlinearity by definition, while the Shulman/Carrion--Dadarlat--Eckhardt weak convention used here does not (<code>docs/NOTEPAD.md</code>, same entry).</p>"}, {"id": "weakly-sofic-not-sofic", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Weakly sofic does not imply sofic", "impact": 0, "frontier": false, "lock": null, "html": "<p>The class of weakly sofic groups strictly contains the class of sofic groups.  A witness is the Kun--Thom wreath product <code>W=(directSum_(G/Gamma) Z/2Z) semidirect G</code> for the explicit residually finite Kazhdan pair of <code><a href=\"kun-thom-nonsofic-wreath.html\">kun-thom-nonsofic-wreath</a></code> Theorem E.</p>\n<p>This answers the inclusion question that Glebsky recorded as open in 2023: \"It is an easy fact that all sofic groups are weakly sofic.  The other inclusion is an open question.\"</p>\n<h3>Why this belongs in this graph</h3>\n<p>It is the <strong>first separation of any metric approximation class from soficity</strong>, and it is the exact shape of the statement Question 3.4 asks for with <code>hyperlinear</code> in place of <code>weakly sofic</code>.  The permanence theorem that supplies it (Glebsky, below) has <strong>no hypothesis on the coset action</strong> \u2014 in contrast to every wreath-product permanence theorem available on the hyperlinear side, each of which requires the action to be modelled by permutations of a finite set:</p>\n<ul>\n<li>Hayes--Sale, arXiv:1608.02610 \u2014 standard wreath products, acting group</li>\n<p>must be sofic even when the conclusion is only hyperlinearity;</p>\n<li>Holt--Rees, Pacific J. Math. 287 (2017) 393--409, arXiv:1601.01836 \u2014</li>\n<p>wreath closure proved for weakly sofic and separately for sofic, explicitly <strong>not</strong> for hyperlinear;</p>\n<li>Gao--Kunnawalkam Elayavalli--Patchell, arXiv:2401.04945 \u2014 generalized</li>\n<p>wreath products, requires the underlying set action to be sofic;</p>\n<li>Alekseev--Bradford, arXiv:2601.18742, Definition 4.23 \u2014 even for the</li>\n<p>hyperlinear class the action is modelled by <code>phi:Gamma-&gt;Sym(A)</code>.</p>\n</ul>\n<p>So the live question for <code><a href=\"hyperlinear-nonsofic-group.html\">hyperlinear-nonsofic-group</a></code> is sharp: does Glebsky's residually-finite-by-weakly-sofic permanence have a normalized-Hilbert--Schmidt analogue?  If \"hyperlinear\" could replace \"weakly sofic\" in his Theorem 1.1, then <code>W</code> would be hyperlinear and nonsofic, and Question 3.4 would be answered.</p>"}, {"id": "whole-map-coarsening", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Equivariant transitions coarsen to whole-map PVMs", "impact": 0, "frontier": false, "lock": null, "html": "<p>On a free translation orbit, pull every source-conditioned response PVM to one base block; under exact equivariance they coincide, and orbit-summing gives a PVM indexed by whole equivariant response maps. With mean total squared equivariance error <code>\u03b5</code>, orbit averaging plus cardinality-free POVM rounding gives an exact whole-map PVM within <code>40\u03b5</code>, independently of orbit size, response alphabet, and matrix dimension.</p>"}, {"id": "wreath-amenable-near-representation", "status": "OPEN", "root": false, "goal": false, "title": "The wreath candidate admits an essentially free amenable near representation", "impact": 1, "frontier": true, "lock": null, "html": "<p>Construct an essentially free amenable near representation of <code>W = (\u2295_{G/\u0393} \u2124/2\u2124) \u22ca G</code> on a Hilbert space, in the sense of Kahl\u2013Schneider. By <code><a href=\"hyperlinear-near-representation-criterion.html\">hyperlinear-near-representation-criterion</a></code> this is equivalent to <code>W</code> being hyperlinear, so it is a reformulation of <code><a href=\"hyperlinear-wreath-model.html\">hyperlinear-wreath-model</a></code> rather than a strengthening \u2014 but it reformulates the <em>object to be built</em>, which is the point.</p>\n<h3>RESTATEMENT AUDIT (2026-08-14)</h3>\n<p>Re-derived after the team-wide \"restatement dressed as reduction\" warning. This claim is equivalent to the target modulo one established claim, and the node already said so in passing \u2014 \"a reformulation of <code><a href=\"hyperlinear-wreath-model.html\">hyperlinear-wreath-model</a></code> rather than a strengthening\" \u2014 without drawing the consequence.</p>\n<p><code><a href=\"hyperlinear-near-representation-criterion.html\">hyperlinear-near-representation-criterion</a></code> is established and is an <strong>iff</strong>: a group is hyperlinear exactly when it admits an essentially free amenable near representation. So \"W admits one\" is \"W is hyperlinear\" is <code><a href=\"hyperlinear-wreath-model.html\">hyperlinear-wreath-model</a></code>, and <code><a href=\"amenable-charge-route.html\">amenable-charge-route</a></code> is a translation, not a reduction.</p>\n<p>The translation is worth having \u2014 the witness type changes from a finite carrier to a finitely additive charge, the toolbox changes from finite construction to Hahn\u2013Banach and compactness, and the scale changes from trace to operator norm, which is exactly why this lane does not inherit the rigidity collapse. But a translation with an open hole looks like a second front and is not one. All three live routes into <code><a href=\"hyperlinear-wreath-model.html\">hyperlinear-wreath-model</a></code> fail this audit; see <code><a href=\"simultaneous-dilation-splice.html\">simultaneous-dilation-splice</a></code> and <code><a href=\"fiber-masa-free-cocycle.html\">fiber-masa-free-cocycle</a></code>.</p>\n<h3>The exact parallel, and where it breaks</h3>\n<p>The two criteria are the same statement in two categories, and both halves are source-verified.</p>\n<p>Elek\u2013Szab\u00f3 (arXiv:math/0408400, <em>Math. Ann.</em> 332 (2005)) define, verbatim:</p>\n<p>&gt; An amenable action of a group \u0393 on a set X is called <em>essentially free</em> if &gt; there exists a \u0393-invariant finitely additive measure \u03bc on X such that for any &gt; 1\u2260g\u2208\u0393, \u03bc(Fix(g))=0, where Fix(g)\u2286X denotes the fixed point set of g.</p>\n<p>and prove, verbatim, that <em>\"a group has an essentially free amenable almost-action if and only if it is sofic\"</em>. Kahl\u2013Schneider (arXiv:2504.10988, revised 2026-01-05) prove the Hilbert-space analogue, verbatim: <em>\"a group is hyperlinear if and only if it admits an essentially free amenable near representation\"</em>, with amenability in Bekka's sense, characterized by an orthonormal basis supporting an invariant probability charge.</p>\n<p>So soficity asks for a charge on a <strong>set</strong> that the group almost-permutes, and hyperlinearity asks for a charge on an <strong>orthonormal basis</strong> that the group merely has to preserve <em>as a state on <code>B(H)</code></em> \u2014 the basis itself need not be carried to itself. Kun\u2013Thom Theorem A says the first object does not exist for <code>W</code>. Whether the second does is open, and the gap between them is once again the non-Cartan gap: the basis is the coordinate system, and the criterion does not require it to be equivariant.</p>\n<h3>Why this is worth a separate node rather than a rephrasing</h3>\n<p>Because the witness is soft. Every architecture invalidated on <code><a href=\"hyperlinear-wreath-model.html\">hyperlinear-wreath-model</a></code> builds a finite carrier, and <code>docs/FALSE_HALO_ACTION_AUDIT.md</code> shows finite carriers with locally sofic labels are circular here \u2014 a finitely generated subgroup of <code>U(n)</code> is linear, hence residually finite, hence sofic. A finitely additive charge is not a finite carrier and is not produced by exhibiting one: charges come from Hahn\u2013Banach, from invariant means, from ultrafilter limits. That is a different toolbox from the one the nine dead routes exhausted, and it is the reason this lane is not a variation on them.</p>\n<p>It also composes with the established foothold. <code><a href=\"positive-core-bernoulli-ce.html\">positive-core-bernoulli-ce</a></code> gives an honest sofic action <code>\u0393 \u21b7 X\u2080</code>, hence by Elek\u2013Szab\u00f3 an essentially free amenable almost-action of <code>\u0393</code> on a set; the question is whether the charge extends over the compressors. That is a charge-level version of <code><a href=\"simultaneous-dilation-splice.html\">simultaneous-dilation-splice</a></code>, and extending a finitely additive measure is the kind of thing Hahn\u2013Banach does and a von Neumann algebra permanence theorem does not. Whether the two versions have the same difficulty is untested and is the first thing to check.</p>\n<h3>Resolved: the genuine shadow is rigid</h3>\n<p>The paragraph below was written when Bekka's statement was unread and therefore unusable. It is now settled, by proof rather than by citation, as <code><a href=\"amenable-rep-of-kazhdan-has-fd-subrep.html\">amenable-rep-of-kazhdan-has-fd-subrep</a></code>: an amenable representation of a Kazhdan group has a nonzero finite-dimensional subrepresentation. Restricting the invariant state to <code>G \u2264 W</code> makes <code>\u03c0|_G</code> amenable, and <code>G</code> is Kazhdan, so a <em>genuine</em> essentially free amenable representation of <code>W</code> would carry a finite-dimensional subrepresentation of <code>G</code> \u2014 precisely the regime where <code>commutant_no_growth</code> and the <code>finrank</code> instance of <code>no_strict_compression_of_invariantSize</code> bite.</p>\n<p>So the whole content of the criterion at <code>W</code> sits in the gap between <em>near</em> and <em>genuine</em>. The lane is not dead, but it is not independent of the rigidity branch either: it is independent exactly to the extent that flexibility is. Anyone building a charge here should know they are building an object with no genuine shadow, and that is the specification, not an accident.</p>\n<p>The first concrete attempt is also closed: <code><a href=\"induced-charge-extension.html\">induced-charge-extension</a></code> is invalidated by <code><a href=\"no-invariant-mean-on-coset-space.html\">no-invariant-mean-on-coset-space</a></code>, so the positive core's charge does not extend by induction.</p>\n<h3>Superseded \u2014 the original flag, kept for the record</h3>\n<p>There is a plausible sharp obstruction on this lane that I could not verify and am therefore not asserting. Bekka, <em>Amenable unitary representations of locally compact groups</em>, Invent. Math. 100 (1990) 383\u2013401, is reported to describe the amenable representations of property (T) groups via the Hulanicki\u2013Reiter theorem; the statement I expected is that for <code>G</code> with property (T) a unitary representation is amenable exactly when it has a finite-dimensional subrepresentation. <strong>I did not read it</strong> \u2014 the Springer full text is behind an authentication wall and two secondary sources did not restate it. If it is true in that form, then a <em>genuine</em> amenable representation of <code>W</code> would carry a finite-dimensional subrepresentation, which <code><a href=\"finite-quotient-blindness.html\">finite-quotient-blindness</a></code> would then attack, and the entire content of the criterion would sit in the gap between \"near\" and \"genuine\" \u2014 i.e. in flexible stability, the same fork as everything else. Verifying that sentence is cheap and would immediately tell us whether this lane is independent of the rigidity branch or secretly the same question. Until then it is a conjecture about the literature, not an input.</p>"}, {"id": "wreath-compression-mf-radical", "status": "ESTABLISHED", "root": true, "goal": false, "title": "Exact MF radicals of compression wreath products", "impact": 0, "frontier": false, "lock": null, "html": "<p>For the doubling family (and any Kazhdan compression pair with MF abelianized quotient), Rad_MF(K^(G/Gamma) x| G) is exactly the kernel of the fiberwise-abelianized product map onto K_ab^(G/Gamma-up) x| G.  For perfect finite K the radical is the entire lamp base; for K = C2 it is even parity on every height level.  Upgrades the non-MF criterion to a computation of the universal MF quotient.</p>"}, {"id": "wreath-flexible-hs-stability", "status": "OPEN", "root": false, "goal": false, "title": "The wreath candidate G is flexibly HS-stable", "impact": 1, "frontier": true, "lock": null, "html": "<p>Show that every almost-representation of the wreath candidate <code>G</code> in the normalized HS metric is close to a genuine finite-dimensional representation after padding (flexible HS-stability). This is the sole remaining hypothesis of the rigidity route <a href=\"rigidity-route.html\">rigidity-route</a>.</p>"}, {"id": "wreath-not-sofic", "status": "ESTABLISHED", "root": false, "goal": false, "title": "The wreath candidate is not sofic", "impact": 3, "frontier": false, "lock": null, "html": "<p>Nonsoficity of the wreath candidate. <strong>Now ESTABLISHED by source-verified citation</strong> via <code><a href=\"wreath-not-sofic-proof.html\">wreath-not-sofic-proof</a></code>, after the candidate was given a formula (below) and the two identification gaps recorded by the 2026-08-14 literature scout were discharged. The trust surface is one external unrefereed preprint and nothing else; it is stated in the route.</p>\n<h3>Available citation (2026-08-14 literature scout)</h3>\n<p>Kun--Thom, <em>Nonsofic wreath products of residually finite groups</em>, arXiv:2608.06222v1 (2026-08-06, 16 pp), read from the PDF, prove:</p>\n<p>&gt; <strong>Theorem A.</strong> Let <code>Gamma</code> be an infranormal but not normal subgroup of <code>G</code>, &gt; and suppose that both <code>Gamma</code> and <code>G</code> have Kazhdan's property (T).  Then &gt; <code>(Z/2Z) wr_(G/Gamma) G</code> is not sofic.</p>\n<p>with <code>Gamma</code> <em>infranormal</em> meaning that the compression semigroup <code>P_Gamma={g in G : g Gamma g^(-1) &lt;= Gamma}</code> generates <code>G</code>.  Their Theorem E supplies an explicit pair: for a prime power <code>q</code> and <code>r,d&gt;=3</code>, <code>R_+=F_q[x_1,...,x_d]</code>, <code>R=F_q[x_1^(\u00b11),...,x_d^(\u00b11)]</code> with <code>SL_d(Z)</code> acting by monomial substitutions, <code>Gamma=EL_r(R_+)</code> and <code>G=EL_r(R) semidirect SL_d(Z)</code> are residually finite Kazhdan groups with <code>Gamma</code> infranormal and not normal. Corollary D adds that the generalized Bernoulli action <code>G action (K,kappa)^(G/Gamma)</code> is not sofic.</p>\n<p>This is the same architecture as <code>docs/OBSTRUCTIONS.md</code> \u00a74 (compressors from <code>SL_d(Z)</code> monomial substitutions), and <code>docs/FALSE_HALO_ACTION_AUDIT.md</code> already writes the candidate as <code>W=(directSum_(G/Gamma) C_2) semidirect G</code> and calls it the Kun--Thom group.</p>\n<p>Three independent reads now agree word for word on Theorem A, Theorem E and
