rlinear quotient.</p>\n<p>So the torsion-critical architecture that produces non-MF groups --- a finite central mark killed by every model --- is provably unavailable for nonhyperlinearity of an MF group.</p>"}, {"id": "mf-not-closed-under-integer-extensions", "status": "ESTABLISHED", "root": false, "goal": false, "title": "MF fails for extensions of LEF groups by the integers", "impact": 0, "frontier": false, "lock": null, "html": "<p>There is a short exact sequence</p>\n<pre>\n1 -&gt; ClLamp(X) semidirect T -&gt; W -&gt; Z -&gt; 1\n</pre>\n<p>whose kernel is LEF (hence sofic and MF) and whose quotient is <code>Z</code>, while <code>W</code> is not MF.  So MF is not preserved by extensions with amenable quotient: the operator-norm analogue of the Elek--Szabo theorem for soficity is false.</p>\n<p>A second witness one level up, using <code><a href=\"literal-telescope-core-lef.html\">literal-telescope-core-lef</a></code>: the telescope core <code>E_T = N_E semidirect T</code> of the literal group is LEF, and <code>E = E_T semidirect Z</code> is not MF.  So the failure is not an artefact of the Clifford witness; it happens for the literal presented group itself.</p>\n<p>Consequence for the frontier: no permanence theorem about <code>Z</code>-extensions can decide <code><a href=\"commuting-lamp-quotient-mf.html\">commuting-lamp-quotient-mf</a></code> or <code><a href=\"literal-mark-quotient-mf.html\">literal-mark-quotient-mf</a></code>.  All four groups <code>E</code>, <code>W</code>, <code>E/&lt;w&gt;</code>, <code>W/&lt;zeta&gt;</code> are <code>Z</code>-extensions of LEF cores; the first two are not MF and the last two are open, and they differ from their non-MF partners only by the central mark.  In particular \"the core is MF, so only the stable letter is left\" is not a partial proof of anything \u2014 the stable-letter step is the entire difficulty, and it is where the two known negative answers live.</p>"}, {"id": "mf-positive-controls", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Basic positive controls for the MF property", "impact": 2, "frontier": false, "lock": null, "html": "<p>Subgroups of MF groups are MF, every countable residually finite group is MF, and every countable locally finite group is MF.</p>"}, {"id": "mf-quotient-nonclosure", "status": "ESTABLISHED", "root": false, "goal": false, "title": "MF groups are not closed under quotients", "impact": 0, "frontier": false, "lock": null, "html": "<p>The residually finite rank-eight free group <code>F_8</code> is MF and its canonical presentation map surjects onto the literal eight-generator finitely presented group <code>E</code>, but <code>E</code> is not MF.  Hence the class of MF groups is not closed under quotients.</p>"}, {"id": "mf-radical-functoriality", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Functorial portability of the MF radical", "impact": 0, "frontier": false, "lock": null, "html": "<p>For every homomorphism <code>f : G -&gt; H</code>, the image under <code>f</code> of <code>Rad_MF(G)</code> lies in <code>Rad_MF(H)</code>.  Equivalently, every homomorphism from <code>G</code> to an MF group kills <code>Rad_MF(G)</code>.</p>"}, {"id": "mf-refutation-yields-nonhyperlinear-group", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Refuting MF implies hyperlinear solves the nonhyperlinear target", "impact": 0, "frontier": false, "lock": null, "html": "<p>Any counterexample to <code><a href=\"mf-implies-hyperlinear.html\">mf-implies-hyperlinear</a></code> is by definition an MF group that is not hyperlinear, hence establishes <code><a href=\"non-hyperlinear-group.html\">non-hyperlinear-group</a></code>, the program's primary target.  Therefore the refutation branch of the bridge is at least as hard as the whole nonhyperlinearity program, and effort spent on the bridge should be spent on the positive branch: partial theorems, and identification of the exact analytic input.</p>\n<p>Symmetrically, <code><a href=\"mf-implies-hyperlinear.html\">mf-implies-hyperlinear</a></code> cannot be refuted \"cheaply\" by any argument that does not also produce a nonhyperlinear group; in particular no counting, index, or invariant argument can do it (<code><a href=\"invariant-size-collapse.html\">invariant-size-collapse</a></code>, <code><a href=\"trace-blindness-sharpness.html\">trace-blindness-sharpness</a></code>).</p>"}, {"id": "mf-trace-gap-defect-ratio-models", "status": "OPEN", "root": false, "goal": false, "title": "MF groups admit models whose squared defect beats their trace gap", "impact": 1, "frontier": false, "lock": null, "html": "<p>Let <code>G</code> be a countable MF group and <code>g != 1</code>.  Then there exist operator-norm local models <code>phi_n : G -&gt; U(d_n)</code> on exhausting multiplication windows, with defects <code>epsilon_n</code> and trace gaps</p>\n<pre>\nkappa_n = 1-Re tr_(d_n)(phi_n(g)),\n</pre>\n<p>such that</p>\n<pre>\nepsilon_n^2/kappa_n -&gt; 0.                                        (P1)\n</pre>\n<p>Two remarks fix the scale.  Operator separation with constant <code>1</code> forces <code>kappa_n &gt;= 1/(2 d_n)</code> for free, so <code>(P1)</code> is implied by <code>epsilon_n sqrt(d_n) -&gt; 0</code>; and if the deviation <code>phi_n(g)-1</code> has effective rank <code>Omega(d_n)</code> then <code>kappa_n = Omega(1)</code> and <code>(P1)</code> is implied by <code>epsilon_n -&gt; 0</code>, which is automatic.  <code>(P1)</code> interpolates between these: either the defect is small relative to the dimension, or the witness is spread over positive density, or any trade-off between the two.</p>\n<p>The gap is stated in terms of the <em>trace gap</em> <code>kappa_n</code> rather than the rank of <code>phi_n(g)-1</code> deliberately: <code>NormTraceGap.phase_deviation_no_amplification</code> shows a full-rank deviation (<code>i . 1</code>) can be amplification-invisible, so the rank is the wrong invariant and the trace gap is the right one.</p>\n<p><strong>This is the weaker of the cluster's two holes.</strong>  By <code><a href=\"corner-visibility-gives-rate-profile.html\">corner-visibility-gives-rate-profile</a></code> it is implied by <code><a href=\"mf-invariant-corner-visibility.html\">mf-invariant-corner-visibility</a></code>, which demands <code>kappa_n</code> bounded below, whereas <code>(P1)</code> tolerates <code>kappa_n -&gt; 0</code> provided <code>epsilon_n^2</code> decays faster. Attack this one.</p>\n<p><strong>Where it fails, and where it is free.</strong>  By <code><a href=\"sign-mark-rate-is-sector-density.html\">sign-mark-rate-is-sector-density</a></code>, for a central involution mark the statistic is <code>epsilon_n^2/(4 delta_n)</code> with <code>delta_n</code> the density of the negative sector, so the profile is free whenever the mark occupies positive density and is <em>refuted</em> whenever property <code>(T)</code> squeezes the mark onto a sector of density <code>O(epsilon_n^2)</code> --- which is exactly what happens with exact finite-dimensional ambient letters.  Any attempt on this claim should therefore target models whose ambient sector is genuinely approximate; a family with <code>(T)</code>-rigid exact ambients cannot satisfy it.</p>\n<p>Nothing in the MF property relates <code>epsilon_n</code> to <code>d_n</code>; this claim is the exact analytic content missing from <code><a href=\"mf-implies-hyperlinear.html\">mf-implies-hyperlinear</a></code> along the amplification route.  It is the repository's own stated subproblem: the square-root-profile entry of <code>docs/NOTEPAD.md</code> (2026-08-08) closes with \"extracting or disproving this profile is now a concrete quantitative subproblem\", after observing that Shulman's qualitative MF theorem states no such rate.  The special case <code>epsilon_n sqrt(d_n) -&gt; 0</code> for a group already known to be weak MF is that entry verbatim.</p>"}, {"id": "mf-universal-horn-obstruction", "status": "ESTABLISHED", "root": false, "goal": false, "title": "One finite universal Horn sentence excludes all MF groups", "impact": 1, "frontier": false, "lock": null, "html": "<p>Every MF group satisfies the finite quasi-identity saying that any eight-tuple satisfying the forty-one literal relators also satisfies the marked equation <code>w = 1</code>, while the canonical tuple of <code>E</code> satisfies the relators and violates that equation.</p>"}, {"id": "mixed-approximation-black-hole", "status": "OPEN", "root": false, "goal": false, "title": "A finitely presented mixed sofic/MF approximation black hole", "impact": 0, "frontier": false, "lock": null, "html": "<p>Credit: derived from Fournier-Facio's small-cancellation suggestion and the amplifier of his arXiv:2512.09180 Proposition B (session development, GPT-5.6-assisted, unrefereed).</p>\n<p>Claim: there is a 2-generated finitely presented property-(T) acylindrically hyperbolic group whose every nontrivial quotient is simultaneously nonsofic and non-MF; consequently it is pointwise Hamming-stable and operator-norm-stable while being neither sofic nor MF, and it can be arranged to contain every finitely generated recursively presented group.  Mixed-quotient plumbing exists in Stability/MixedApproximation.lean; the existence input is the same Hull/Osin program as [[<a href=\"defect-saturation-full-mf-radical.html\">defect-saturation-full-mf-radical</a>]].</p>"}, {"id": "near-representation-amenability-dichotomy", "status": "OPEN", "root": false, "goal": false, "title": "A near-representation analogue of the Bekka\u2013Valette dichotomy", "impact": 0, "frontier": false, "lock": null, "html": "<p><strong>Open.</strong> Does the Bekka\u2013Valette dichotomy have an analogue for near representations? Concretely, in the direction that matters: if <code>G</code> has property (T) and <code>\u03c0 : G \u2192 U(H)</code> is an <em>amenable near representation</em> in the sense of Kahl\u2013Schneider \u2014 multiplicativity holding only <code>\u03bc</code>-almost everywhere, to within every <code>\u03b5</code>, for the invariant charge <code>\u03bc</code> \u2014 must <code>\u03c0</code> admit some approximate substitute for a nonzero finite-dimensional subrepresentation?</p>\n<h3>Why this is the pivot</h3>\n<p><code><a href=\"amenable-charge-route.html\">amenable-charge-route</a></code> applies Kahl\u2013Schneider's equivalence: <code>W</code> is hyperlinear exactly when it admits an essentially free amenable near representation. The lane's value rests on that criterion being independent of the rigidity branch, and the independence rests entirely on this question being open.</p>\n<p>For <strong>genuine</strong> representations the collapse is complete and proved (<code><a href=\"amenable-rep-of-kazhdan-has-fd-subrep.html\">amenable-rep-of-kazhdan-has-fd-subrep</a></code>, and published as <code><a href=\"bekka-valette-amenable-t-dichotomy.html\">bekka-valette-amenable-t-dichotomy</a></code>): a Kazhdan group's amenable representations all contain finite-dimensional subrepresentations, which is where <code>commutant_no_growth</code> and the <code>finrank</code> invariant size bite. If any near-representation analogue held, the same collapse would reach the charge lane and it would die with the rest of the flexible side.</p>\n<h3>Two reasons it is not merely a technicality</h3>\n<p><strong>The topologies are incompatible, so no repair is available from stability.</strong> The obvious attempted bridge is to assume <code>G</code> flexibly HS-stable, replace the near representation by a genuine one, and apply the theorem. This fails, and not for a fixable reason: amenability is the existence of an invariant state on <code>B(H)</code>, states are continuous for the operator norm, and flexible HS-stability supplies only <code>\u2016\u00b7\u2016\u2082</code> closeness. Invariance of the state does not survive an HS-small perturbation. Amenability lives at the operator-norm scale and near-ness at the trace scale.</p>\n<p><strong>A calibration says the near-ness is load-bearing.</strong> Observed by <code>cairn-scout</code>, and recorded as their inference rather than a theorem. Were genuine amenable representations enough for the criterion, then for a Kazhdan group hyperlinearity would reduce to possessing a nonzero finite-dimensional subrepresentation \u2014 making every minimally almost periodic Kazhdan group non-hyperlinear. Infinite simple Kazhdan groups are minimally almost periodic, none is known to be non-hyperlinear, and such a conclusion would settle far more than is settled. So Kahl\u2013Schneider's use of near representations is forced, not stylistic, and the charge witness evades the rigidity collapse by construction.</p>\n<p>Neither reason is an argument that the analogue is false. They are reasons the question is not answerable by inspection, which is what makes it worth a node.</p>\n<h3>Where the genuine proof breaks, exactly</h3>\n<p>Owned by <code>cairn-wreath</code> per the team lead. The first useful thing is that the failure localizes to a single step, and naming it converts the question into a sharper one.</p>\n<p>The proof of <code><a href=\"amenable-rep-of-kazhdan-has-fd-subrep.html\">amenable-rep-of-kazhdan-has-fd-subrep</a></code> has three moves. Move 1 \u2014 invariant state on <code>B(H)</code>, then Day's trick and Powers\u2013St\u00f8rmer, producing unit vectors <code>\u03c1_i^{1/2} \u2208 HS(H)</code> almost invariant for <code>Ad \u03c0</code> \u2014 <strong>never uses multiplicativity of <code>\u03c0</code> at all</strong>. It goes through verbatim for a near representation. Move 3, extracting a finite-rank spectral projection from a nonzero invariant Hilbert\u2013Schmidt operator, is pure spectral theory and also survives.</p>\n<p>Everything turns on move 2: property (T) applied to <code>Ad \u03c0</code> on <code>HS(H)</code>. Property (T) is a statement about <strong>genuine</strong> unitary representations \u2014 every unitary representation with almost invariant vectors has a nonzero invariant vector \u2014 and for a near representation <code>Ad \u03c0</code> is only a near representation of <code>G</code> on <code>HS(H)</code>.</p>\n<p><strong>And its defect is measured in the wrong norm.</strong> Writing <code>u = \u03c0(gh)</code>, <code>v = \u03c0(g)\u03c0(h)</code>, for <code>T \u2208 HS(H)</code></p>\n<p>\u2016Ad \u03c0(gh)T \u2212 Ad \u03c0(g)Ad \u03c0(h)T\u2016\u2082 = \u2016uTu* \u2212 vTv*\u2016\u2082 \u2264 2\u2016u \u2212 v\u2016_op \u00b7 \u2016T\u2016\u2082,</p>\n<p>so the multiplicativity defect of <code>Ad \u03c0</code> on <code>HS(H)</code> is controlled by the <strong>operator-norm</strong> defect of <code>\u03c0</code>. Kahl\u2013Schneider's notion controls something else entirely: <code>\u2016\u03c0(gh)x \u2212 \u03c0(g)\u03c0(h)x\u2016 \u2264 \u03b5</code> for <code>\u03bc</code>-almost every basis vector <code>x</code>. A charge-null set of basis directions can carry an order-one operator-norm defect \u2014 finitely additive charges annihilate sets that are infinite, so \"<code>\u03bc</code>-null\" is very far from \"small\". Hence <code>Ad \u03c0</code> need not be close to any genuine representation of <code>G</code> on <code>HS(H)</code> in any sense property (T) can consume, and move 2 has nothing to stand on.</p>\n<p>This is the same operator-norm-versus-trace-scale mismatch recorded above, localized to the one line where it bites. It is not a gap in the write-up; it is where the mathematics actually differs.</p>\n<h3>The pivot, restated</h3>\n<p>So the question is not really about amenability. It is:</p>\n<p>&gt; Is there a property (T) for charge-almost-everywhere near representations \u2014 &gt; that is, does a Kazhdan group's near representation with almost invariant &gt; vectors have a genuine (or approximately genuine) invariant vector, when &gt; multiplicativity is only assumed <code>\u03bc</code>-a.e. pointwise?</p>\n<p>A positive answer at that level would give the dichotomy and evaporate the charge lane. A negative answer at a single Kazhdan group would prove the gap real. This is a question about property (T) itself rather than about <code>W</code>, which is what makes it worth owning: it can be attacked without touching the wreath candidate, and either answer is a theorem about Kazhdan groups.</p>\n<p><strong>A construction hazard, for whoever tries the negative direction.</strong> The tempting witness is a genuine representation perturbed on a charge-null set of basis directions. That will not refute anything by itself: if the amenability of the perturbed map is inherited from the genuine part, Bekka\u2013Valette applies to that part and returns the finite-dimensional structure. A refuting witness needs the <em>charge-null junk</em> to carry the amenability, not merely to exist. I have not found one and am not claiming it can be done.</p>\n<h3>Status</h3>\n<p>Nothing read on either side bears on it. <code>cairn-scout</code> reports finding no treatment of it in Li\u2013Ng, in Kahl\u2013Schneider, or in the surrounding literature, and states no evidence in either direction; this node inherits that. It is the single question whose resolution decides whether <code><a href=\"amenable-charge-route.html\">amenable-charge-route</a></code> is a genuinely separate attack on <code><a href=\"hyperlinear-wreath-model.html\">hyperlinear-wreath-model</a></code> or the rigidity fork wearing different notation.</p>"}, {"id": "nested-commutator-translations", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Nested commutators recover the paired translations", "impact": 0, "frontier": false, "lock": null, "html": "<p>On a long-root character sector <code>\u2113</code>, the named middle-root commutators <code>D_b = [x\u2082\u2083(1), x\u2083\u2084(b)]</code> and <code>C_a = [x\u2081\u2082(a), x\u2082\u2083(1)]</code> translate the two outer-root character PVMs by <code>a \u21a6 \u2113(ab)</code> and <code>b \u21a6 \u2113(ab)</code>; their kernels are exactly the radicals of <code>b_\u2113</code>. Unitarity makes character multiplicity constant along every translation orbit, and averaged approximate nested-commutator error is exactly twice the mass outside the required shift graph (Fourier Parseval). Removes arbitrary multiplicity-gauge recovery from the label-level paired-quotient route.</p>"}, {"id": "no-invariant-mean-on-coset-space", "status": "ESTABLISHED", "root": false, "goal": false, "title": "A Kazhdan group has no invariant mean on an infinite-index coset space", "impact": 0, "frontier": false, "lock": null, "html": "<p>Let <code>G</code> have property (T) and <code>\u0393 \u2264 G</code> have infinite index. Then there is no <code>G</code>-invariant finitely additive probability measure on <code>G/\u0393</code>: <code>\u0393</code> is not co-amenable in <code>G</code>.</p>\n<p>Proof (Proposition 1 of the artifact): a mean gives, via Day's trick, finitely supported probability densities <code>f_i</code> with <code>\u2016g\u00b7f_i \u2212 f_i\u2016\u2081 \u2192 0</code>; then <code>\u03be_i = f_i^{1/2}</code> are almost invariant unit vectors in <code>\u2113\u00b2(G/\u0393)</code> by <code>|\u221aa \u2212 \u221ab|\u00b2 \u2264 |a \u2212 b|</code>; property (T) produces a nonzero invariant vector, which by transitivity is a constant function, and a nonzero constant is square summable only if <code>G/\u0393</code> is finite.</p>\n<p>This is <code>docs/OBSTRUCTIONS.md</code> \u00a73's \"<code>G \u21b7 G/\u0393</code> has no F\u00f8lner sets\" in the form the charge language needs, and it is what kills <code><a href=\"induced-charge-extension.html\">induced-charge-extension</a></code>.</p>\n<h3>Why it matters beyond that route</h3>\n<p>It settles, negatively, the asymmetry that motivated the Kahl\u2013Schneider lane. The hope was that an invariant charge might extend over the compressors where Connes embeddability does not, since extending finitely additive measures is Hahn\u2013Banach's home ground while extending CE across an amalgamated free product over a nonamenable base is a named open problem (Gao\u2013Junge). The comparison was mis-drawn: Hahn\u2013Banach extends a charge from a smaller family of sets to a larger one <em>with the same invariance group</em>, and does not extend an invariant charge along a group inclusion. On this comparison the charge side is strictly worse off than the algebra side, because this claim is a theorem while Gao\u2013Junge Problem 1 is open.</p>"}, {"id": "non-hyperlinear-group", "status": "OPEN", "root": true, "goal": false, "title": "Exhibit an explicit non-hyperlinear group", "impact": 0, "frontier": false, "lock": null, "html": "<p>The primary target of the program (AGENDA.md header): an explicit group that is not hyperlinear, i.e. admits no asymptotic embedding into unitary matrices with the normalized Hilbert-Schmidt metric.</p>\n<p>The organizing mechanism is (T)-compression: <code>\u0393 \u2264 G</code> with a compressor <code>t</code> (<code>t\u0393t\u207b\u00b9 \u2a87 \u0393</code>). In every category with a conjugation-invariant strictly monotone size the compression collapses (<a href=\"invariant-size-collapse.html\">invariant-size-collapse</a>); the <code>II\u2081</code> branch survives because the trace is refinement-blind, and that failure is sharp (<a href=\"trace-blindness-sharpness.html\">trace-blindness-sharpness</a>). The obstruction, if there is one, can only be stability.</p>\n<h3>Ideas</h3>\n<p>Non-graph brainstorming for this goal goes here. Current periphery: free independence between branch algebras is NOT excluded by the cross-branch commutator identity (see docs/OBSTRUCTIONS.md \u00a73, \"No commuting branches\").</p>"}, {"id": "nonsofic-hyperbolic-group", "status": "OPEN", "root": true, "goal": false, "title": "A nonsofic hyperbolic group \u2014 the second nonsoficity mechanism", "impact": 0, "frontier": false, "lock": null, "html": "<p>Produce a hyperbolic group that is not sofic.  Equivalently \u2014 since a nonsofic hyperbolic group cannot be residually finite \u2014 this simultaneously answers whether non-residually-finite hyperbolic groups exist.</p>\n<h3>Why this sits in this program</h3>\n<p><code>docs/OBSTRUCTIONS.md</code> \u00a75 records the caution that Pestov's Question 3.4 \"may be inaccessible until a <em>second</em> nonsoficity mechanism exists\", because every known nonsofic group came from the same (T)-compression pattern that the eight no-gos attack.  As of 2026-08 that caution is still literally true: the unconditional nonsofic groups (OpenAI's <code>L_(F_2)(1,2)^x</code>, Kun--Thom's wreath products, Fournier-Facio's torsion-free example) are all one-sided-compression + property (T) + a non-LEF commuting subgroup.</p>\n<p>This node names the only <em>different</em> mechanism found in the 2023--2026 literature.  It matters here for one reason: the eight dead architectures are attacks on the (T)-compression pattern, and none of them evidently applies to a group whose nonsoficity comes from local-testability failure instead.  A nonsofic hyperbolic group would therefore be a genuinely fresh Q3.4 candidate rather than another instance of the blocked pattern.</p>\n<p>Conservatively modeled as OPEN and explicitly conjectural: no source claims such a group exists.  The one route recorded below is conditional on an unproved probabilistic estimate.</p>"}, {"id": "nonsofic-mechanism-mf-classification", "status": "OPEN", "root": true, "goal": false, "title": "MF classification of the existing one-sided-compression nonsofic groups", "impact": 0, "frontier": false, "lock": null, "html": "<p>Determine which of the known one-sided-compression nonsofic groups are MF and which are non-MF, thereby separating the shared group-theoretic input from the metric-specific Hamming and operator-norm obstructions.</p>"}, {"id": "normal-kazhdan-defect-non-mf", "status": "ESTABLISHED", "root": false, "goal": false, "title": "A normal Kazhdan subgroup in the compression defect kills every corona representation", "impact": 1, "frontier": false, "lock": null, "html": "<p>Let <code>C : KazhdanCompressionCore Gamma E</code> with <code>E</code> countable \u2014 that is, <code>iota : Gamma -&gt; E</code> with <code>Gamma</code> Kazhdan, <code>t</code> compressing <code>iota(Gamma)</code> into itself, and <code>c</code> centralizing <code>iota(Gamma)</code> \u2014 and put <code>defectNormal = normalClosure {[t c t^-1, iota gamma]}</code>.  If <code>K</code> is a <strong>nontrivial normal subgroup of <code>E</code> with property (T)</strong> and <code>K &lt;= defectNormal</code>, then every homomorphism from <code>E</code> to the unitary group of a norm matrix corona kills <code>K</code> elementwise.  Consequently <code>E</code> is not MF.</p>\n<p><strong>Finiteness, centrality and torsion are all unnecessary.</strong>  This is the second killing theorem in the repository, it is machine-checked, and it is the one that survives the passage to torsion-free groups.  The corner that the finite-normal branch obtains by averaging, and the central branch obtains from a two-point spectrum, is here the fixed-space projection of the Kazhdan projection of <code>K</code>; normality of <code>K</code> is exactly what makes that projection invariant under the ambient group, hence a legitimate corner.</p>\n<p>The root <code><a href=\"torsion-free-finitely-presented-non-mf.html\">torsion-free-finitely-presented-non-mf</a></code> therefore has no remaining analytic obstacle on this branch.  What it needs is a torsion-free finitely presented group whose compression defect contains a nontrivial normal Kazhdan subgroup \u2014 a question of combinatorial group theory.</p>"}, {"id": "one-variable-no-compressor", "status": "ESTABLISHED", "root": false, "goal": false, "title": "The one-variable Laurent model contains no strict compressor", "impact": 0, "frontier": false, "lock": null, "html": "<p><code>K\u2080 = SL_r(\ud835\udd3d_q[[t]])</code> is compact open in unimodular <code>G\u2080</code>, so Haar measure is a conjugation-invariant size and <code>uK\u2080u\u207b\u00b9 \u2286 K\u2080 \u27f9</code> equality: <code>\u0393\u2080 = M \u2229 K\u2080</code> has no strict compressor in <code>M = SL_r(\ud835\udd3d_q[t,t\u207b\u00b9])</code>. Confirmed from the other side: compressors come from <code>SL_d(\u2124)</code> monomial substitutions and <code>SL\u2081(\u2124)</code> is trivial.</p>"}, {"id": "openai-leavitt-unit-nonsofic", "status": "OPEN", "root": true, "goal": false, "title": "The binary Leavitt unit group is nonsofic (ANNOUNCED, unrefereed)", "impact": 0, "frontier": true, "lock": null, "html": "<p><em>Marked <code>root</code> only so that the graph does not report it as unreachable. It is a recorded external fact, not a program target: no route should be built toward it and nothing should depend on it. See the status note below.</em></p>\n<p><strong>Status: ANNOUNCED, not established at this repository's standard.</strong> <code>OPEN</code> here does not mean \"believed false\" or \"worth attacking\" \u2014 it means the source is unrefereed and carries a visible trust surface, per repository doctrine on conditional and unattested inputs.  Nothing in this graph should depend on it.</p>\n<p>The claim, as announced by OpenAI on 2026-08-01:</p>\n<p>&gt; <strong>Theorem 1.1.</strong> The unit group <code>L_(F_2)(1,2)^x</code> is not sofic.</p>\n<p>for the binary Leavitt algebra <code>R = L_(F_2)(1,2) = F_2&lt;s_0,s_1,t_0,t_1 | t_i s_j = delta_ij, s_0t_0+s_1t_1=1&gt;</code>. What is actually proved is that the finitely generated subgroup <code>G = EL_D(R) = Theta_D(EL_9(R)) &lt;= R^x</code> is nonsofic, for an explicit nine-word complete prefix code <code>D</code>; property (T) comes from Ershov--Jaikin-Zapirain (arXiv:0809.4095) and the non-LEF witness is Thompson's group <code>V</code>.  Soficity passes to subgroups.</p>\n<h3>Version trap</h3>\n<p>The chapter exists in two versions with the <strong>same proposition numbers and different hypotheses</strong>.  Always state which one is meant.</p>\n<p>| | original | current | |---|---|---| | URL | <code>cdn.openai.com/pdf/ten-proofs-oai-original.pdf</code> | <code>cdn.openai.com/pdf/ten-proofs-oai.pdf</code> | | Ch. 3 title | \"A Counterexample to the Soficity Conjecture\" | \"Nonsofic groups exist\" | | pages | 77--93 | 78--95 | | dated | announced 2026-08-01 | \"Updated August 6, 2026\" |</p>\n<p><strong>Proposition 2.3, original:</strong> <code>Gamma &lt;= G</code> infinite <strong>finitely generated groups with property (T)</strong>; <code>G=&lt;Gamma,t_1,...,t_m&gt;</code>, <code>t_i Gamma t_i^(-1)&lt;=Gamma</code>; <code>J&lt;=G</code> finitely generated with <code>[Gamma,J]=1</code>, <code>Gamma cap J={1}</code>, <code>t_1 J t_1^(-1)&lt;=Gamma</code>; then <strong>soficity of <code>G</code></strong> implies <code>J</code> is LEF.</p>\n<p><strong>Proposition 2.3, current:</strong> (T) is required <strong>only of <code>Gamma</code></strong>, and the conclusion is conditioned on an explicit hypothesis rather than on bare soficity \u2014 <code>G</code> must admit a sofic approximation whose generator graphs differ in <code>o(|Y_n|)</code> edges from uniformly bounded-degree graphs with a uniform positive expansion constant.  The current text adds: \"Property (T) is required only of <code>Gamma</code>.  In our application, property (T) for <code>G</code> serves only to obtain the expanding approximation assumed in the proposition.\"</p>\n<p>The revision therefore moved the passage from soficity to a <em>single</em> expanding approximation out of Proposition 2.3 and into the consequences of Theorem 2.1.  Read that as the repair of the delicate step, and cite the current version.</p>\n<h3>Independent expert engagement</h3>\n<p>Kun--Thom, arXiv:1901.03963v3 (2026-08-04), write in their added introduction: \"On August 1, 2026, we learned about the breakthrough result of OpenAI.  The proof of their key Proposition 2.3 in [20] is a creative and effective application of the results and techniques of this paper and the ones in [18].\"  Fournier-Facio (arXiv:2608.02025) and Kun--Thom (arXiv:2608.06222) both build on the criterion.  This is meaningful corroboration by the people whose theorems are being applied; it is not refereeing, and it does not move the status above.</p>\n<h3>The sentence this program cares about</h3>\n<p>Verbatim, and <strong>identical in both versions</strong>:</p>\n<p>&gt; \"Thus every sofic group is hyperlinear [Pes08, Theorem 3.3], but Theorem &gt; 1.1 does not determine whether <code>L_(F_2)(1,2)^x</code> is hyperlinear.\"</p>\n<p>The same passage records that Kervaire--Laudenbach holds for every hyperlinear group (Nitsche--Thom, J. Group Theory 25 (2022) 1--10, arXiv:1811.07737, Theorem 1.3), so a one-variable equation over <code>R^x</code> with nonzero total exponent and no solution in any overgroup would refute hyperlinearity of <code>R^x</code> \u2014 a cheap falsification test.</p>"}, {"id": "outer-pvm-synchronization", "status": "OPEN", "root": false, "goal": false, "title": "Synchronize the two outer transition PVMs on a common carrier", "impact": 1, "frontier": false, "lock": null, "html": "<p>Make the two commuting outer-root transition measurements exact coarsenings of one joint PVM on a common positive-density carrier, with dimension-free error control. Reduced by <a href=\"joint-outer-recovery.html\">joint-outer-recovery</a> (one comb compressor yields one joint extension-character PVM) to the finite-window endomorphism decoder <a href=\"finite-window-decoder.html\">finite-window-decoder</a>; no PVM-synchronization or marginal-matching gate remains.</p>"}, {"id": "outer-root-leavitt-table", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Commuting outer roots retain the Leavitt table", "impact": 0, "frontier": false, "lock": null, "html": "<p>The distant-root placement is exact: the packets <code>x\u2081\u2082(a t\u1d62)</code> and <code>x\u2083\u2084(s\u2c7c b)</code> commute, while the fixed middle root gives <code>[x\u2081\u2082(a t\u1d62), [x\u2082\u2083(1), x\u2083\u2084(s\u2c7c b)]] = x\u2081\u2084(\u03b4\u1d62\u2c7c a b)</code>. Removes the local Pauli noncommutation from the three path contexts without losing the two diagonal-one and two cross-zero identities. Stated source-first in <code>Leavitt/OuterRootLeavittRouting.lean</code>.</p>"}, {"id": "path-pvm-classicalization", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Path-shaped PVM classicalization has no outcome loss", "impact": 0, "frontier": false, "lock": null, "html": "<p>For finite PVMs <code>P, Q</code>: compress <code>Q_j</code> into every <code>P_i</code> corner and apply cardinality-free POVM orthogonalization there, keeping <code>P</code> fixed and producing a commuting PVM <code>Q\u2032</code> with <code>\u03a3\u2c7c \u2016Q\u2032\u2c7c \u2212 Q\u2c7c\u2016\u2082\u00b2 \u2264 5 \u03a3\u1d62\u2c7c \u2016[P\u1d62, Q\u2c7c]\u2016\u2082\u00b2</code>. Applied successively along <code>L\u2080\u2013R\u2080\u2013L\u2081\u2013R\u2081</code>, all three required edges commute exactly with universal error bounds even when map-outcome sets grow. For exact finite abelian root representations, total character-PVM commutator energy equals the subgroup-averaged unitary commutator defect (Parseval). Simultaneous PVM rounding is closed.</p>"}, {"id": "pauli-binary-algebra-gap", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Fixed Pauli carrier has a dimension-free binary-algebra distance gap", "impact": 1, "frontier": false, "lock": null, "html": "<p>If projections <code>E,F</code> satisfy <code>tau(E)=1/8</code> and <code>tau(F)=1/4</code>, then the squared normalized <code>L^2</code> distance from <code>F</code> to the binary algebra <code>W*(E)=span{E,1-E}</code> is at least <code>3/28</code>.  In the canonical Pauli packet the exact overlap improves the squared floor to <code>3/16</code>.</p>\n<p>Thus it is enough for a microstate decoder to force binary-algebra membership of the transported carrier; orientation and a full Leavitt family need not be recovered.</p>"}, {"id": "pauli-carrier-membership-decoder", "status": "OPEN", "root": false, "goal": false, "title": "Decode the transported Pauli carrier inside the raw binary algebra", "impact": 1, "frontier": true, "lock": null, "html": "<p>In every asymptotically multiplicative normalized-HS model of the fixed Leavitt atlas packet, recover the trace-<code>1/8</code> raw Pauli projection <code>E</code> and the trace-<code>1/4</code> transported projection <code>F</code> in common finite multiplicity coordinates and prove</p>\n<pre>\ndist_2(F, W*(E)) -&gt; 0.\n</pre>\n<p>This is the shortest remaining fixed-packet synchronization statement.  It must use the mixed compressor/root relations: finite subgroup moments alone admit exact Pauli countermodels.</p>"}, {"id": "pointwise-hs-stability-from-no-hyperlinear-quotient", "status": "ESTABLISHED", "root": false, "goal": false, "title": "The missing HS slot of the mixed-approximation stability trio", "impact": 1, "frontier": false, "lock": null, "html": "<p>If every hyperlinear quotient of <code>G</code> is trivial, then <code>G</code> is pointwise normalized-HS stable: every sequence of maps <code>phi_n:G -&gt; U(d_n)</code> whose multiplicative defects vanish pointwise in <code>\u2016.\u2016_(2,d_n)</code> converges pointwise to <code>1</code>, and the trivial representations witness stability.</p>\n<p>The point of stating it is architectural. <code>GroupApproximation/Stability/MixedApproximation.lean</code> already formalizes the same implication twice, in the other two metrics, by one three-line pattern:</p>\n<ul>\n<li><code>HasNoNontrivialMixedQuotient.isPointwisePStable</code> (<code>:300</code>), via</li>\n<p><code>hammingAlmostRepresentation_trivial</code>;</p>\n<li><code>HasNoNontrivialMixedQuotient.isPointwiseOperatorNormStable</code> (<code>:380</code>), via</li>\n<p><code>opAlmostRepresentation_trivial</code> and <code>normMatrixCoronaUnitary_isOperatorMF</code>.</p>\n</ul>\n<p>Both proofs read the almost-representation in the ultraproduct or corona, observe that <strong>the target itself belongs to the approximation class</strong>, and conclude that the induced homomorphism is trivial.  The file's class is <code>IsMixedApproximable G := IsSofic G \u2228 IsOperatorMF G</code> (<code>:38</code>); hyperlinearity is absent from it, and there is no <code>HSAlmostRepresentation</code>, no <code>IsPointwiseHSStable</code>, and no lemma asserting that the unitary group of a tracial matrix ultraproduct is hyperlinear.  That last lemma -- the analogue of <code>normMatrixCoronaUnitary_isOperatorMF</code> -- is the only missing ingredient; <code>GroupApproximation/Sofic/HyperlinearUltraproduct.lean</code> already carries <code>HyperlinearApproximation</code> (<code>:227</code>) and the bridge <code>isHyperlinear_of_hyperlinearUltraproductEmbedding</code>.</p>\n<p>Two consequences worth having explicit.</p>\n<p><strong>The HS slot is the hardest of the three by construction.</strong>  Soficity implies hyperlinearity, so \"no nontrivial hyperlinear quotient\" is strictly stronger than \"no nontrivial sofic quotient\".  The trio is not three comparable problems; the metric in which the hypothesis is hardest to satisfy is exactly the one left open.</p>\n<p><strong>For <code>U=St_5(L_(F_2)(1,2))</code> the hypothesis is the fork.</strong>  <code>U</code> is quasisimple, so a nontrivial hyperlinear quotient is a central quotient, and <code><a href=\"leavitt-steinberg-hs-stability-fork.html\">leavitt-steinberg-hs-stability-fork</a></code> makes the existence of one equivalent to hyperlinearity of <code>Q=EL_4(L_(F_2)(1,2))</code>.  So <code><a href=\"leavitt-steinberg-hs-stable.html\">leavitt-steinberg-hs-stable</a></code> is precisely the missing hypothesis of a third instance of an already-formalized pattern, and its formalization would be a copy of the two existing proofs -- which is a real statement about where the difficulty is not.</p>"}, {"id": "positive-core-bernoulli-ce", "status": "ESTABLISHED", "root": false, "goal": false, "title": "The positive core of the Bernoulli crossed product is Connes embeddable", "impact": 1, "frontier": false, "lock": null, "html": "<p>For the regular finite-field Kun\u2013Thom pair \u2014 <code>k = \ud835\udd3d_q</code>, <code>d, r \u2265 3</code>, <code>R\u208a = k[x\u2081,\u2026,x_d]</code>, <code>R = k[x\u2081^{\u00b11},\u2026,x_d^{\u00b11}]</code>, <code>\u0393 = E_r(R\u208a)</code>, <code>G = E_r(R) \u22ca SL_d(\u2124)</code> \u2014 put</p>\n<p>L\u208a = SL_d(\u2124) \u2229 M_d(\u2115),   T = \u0393 L\u208a \u2286 G,   X\u2080 = T\u0393/\u0393 \u2286 G/\u0393.</p>\n<p>Then <code>\u0393 \u21b7 X\u2080</code> is a <strong>sofic action</strong>, the generalized wreath product <code>W\u2080 = (\u2295_{X\u2080} C\u2082) \u22ca \u0393</code> is <strong>sofic</strong>, and therefore</p>\n<p>N\u2080 = L(W\u2080) = L^\u221e({\u00b11}^{X\u2080}) \u22ca \u0393</p>\n<p>is <strong>Connes embeddable</strong>.</p>\n<p>This is the flexible side's only positive foothold, and it has never been in the graph. Every other node on this branch either demands a model or refutes a way of getting one; this one exhibits genuine matrix microstates for a genuine piece of the target algebra.</p>\n<h3>Why the positive part escapes what the full action cannot</h3>\n<p><code><a href=\"coordinate-action-not-sofic.html\">coordinate-action-not-sofic</a></code> establishes that <code>G \u21b7 G/\u0393</code> is not a sofic action. The mechanism separating the two is stabilizer separability, and it is worth stating precisely because it is the sharpest structural fact known about this pair.</p>\n<p>For <code>\u2113 \u2208 L\u208a</code> the stabilizer of <code>\u2113\u0393 \u2208 X\u2080</code> in <code>\u0393</code> is <code>H_\u2113 = \u0393 \u2229 \u2113\u0393\u2113\u207b\u00b9 = \u2113\u0393\u2113\u207b\u00b9</code>. Since <code>\u2113</code> preserves <code>\u2115^d</code>, the monoid <code>\u2113\u2115^d</code> is freely generated by the columns of <code>\u2113</code>, so <code>R_\u2113 = k[\u2113\u2115^d]</code> is again a polynomial ring and Suslin stability gives <code>H_\u2113 = E_r(R_\u2113) = SL_r(R_\u2113)</code>. Truncating <code>R\u208a</code> by the monomial ideal of elements of degree <code>&gt; N</code> gives finite rings <code>Q_N</code>, and for <code>g \u2208 \u0393 \\ H_\u2113</code> some entry of <code>g</code> has a monomial whose exponent is outside <code>\u2113\u2115^d</code>, so <code>g</code> survives in <code>SL_r(Q_N)</code> outside the image of <code>H_\u2113</code>. Every positive stabilizer is therefore separable in <code>\u0393</code> by finite ring congruences.</p>\n<p>A transitive action of a residually finite group on <code>\u0393/H</code> with <code>H</code> separable has exact finite Schreier approximations, <code>X\u2080</code> is a countable union of such orbits, and any finite window meets finitely many \u2014 so <code>\u0393 \u21b7 X\u2080</code> is sofic. Soficity of <code>W\u2080</code> then follows from Gao\u2013Kunnawalkam Elayavalli\u2013Patchell Theorem A (<code>\u0393</code> sofic since residually finite, <code>C\u2082</code> finite, action sofic), the same theorem that <code><a href=\"coordinate-action-not-sofic.html\">coordinate-action-not-sofic</a></code> runs in contrapositive against the full action. One theorem, both directions, and the input that flips the sign is separability.</p>\n<p>This also fixes what the LERF observation does and does not buy. Since all actions of a LERF group on sets are sofic (arXiv:2402.17150), <code>G</code> is not LERF and <code>\u0393</code> is not separable in <code>G</code>. But LERF is far more than needed: only the <em>positive</em> stabilizers have to be separable, and they are.</p>\n<h3>What is not proved</h3>\n<p><code>W\u2080</code> is a proper subgroup of <code>W</code>, generated together with the positive external matrices <code>L\u208a</code>. Nothing here dilates those. The gap is <code><a href=\"simultaneous-dilation-splice.html\">simultaneous-dilation-splice</a></code>, and the route that would use this foothold is <code><a href=\"positive-core-dilation-splice.html\">positive-core-dilation-splice</a></code>.</p>"}, {"id": "profinite-action-fixed-algebra-invariant", "status": "ESTABLISHED", "root": false, "goal": false, "title": "A profinite action of a compressor-generated group has G-invariant Gamma-fixed algebra", "impact": 0, "frontier": false, "lock": null, "html": "<p>Let <code>Gamma&lt;G</code> with <code>G</code> generated by elements <code>t</code> satisfying <code>t Gamma t^(-1)&lt;=Gamma</code>.  If <code>G</code> acts trace preservingly and <strong>profinitely</strong> on a finite von Neumann algebra <code>A</code> \u2014 profinite meaning <code>A</code> is the weak closure of an increasing union of finite-dimensional <code>G</code>-invariant subalgebras \u2014 then <code>A^Gamma</code> is <code>G</code>-invariant.</p>\n<p>Finite-dimensional case: <code>Aut(B)</code> is a compact Lie group, the closure <code>K</code> of the image of <code>Gamma</code> satisfies <code>alpha(t) K alpha(t)^(-1) &lt;= K</code> with the left side conjugate to <code>K</code>, hence of equal dimension and equal component count, so the inclusion is an equality; and <code>B^Gamma=B^K</code>.  General case: the trace-preserving conditional expectations <code>E_n:A-&gt;B_n</code> are <code>G</code>-equivariant, being orthogonal projections onto <code>G</code>-invariant subspaces of <code>L^2(A)</code>, and <code>E_n(x)-&gt;x</code>.</p>\n<p>Consequence for this lane: no profinite action contains a unitary <code>q in A^Gamma</code> whose translate <code>alpha_g(q)</code> fails to commute with <code>Gamma</code>. So exact <code>G</code>-invariant AF or profinite filtrations cannot carry a relative wall, independently of property <code>(T)</code> and of soficity, and the Capraro--Paunescu profinite-action embeddability theorem cannot be applied to retain the Kun--Thom witness.  A positive construction must use finite-dimensional algebras that are only <strong>approximately</strong> <code>G</code>-invariant, with a coherent normalized-Hilbert--Schmidt defect.</p>"}, {"id": "q3-4-resolved", "status": "OPEN", "root": true, "goal": true, "title": "Pestov Question 3.4 resolved either way: decide whether every hyperlinear group is sofic", "impact": 0, "frontier": false, "lock": null, "html": "<p>The program goal, stated as the question rather than one of its answers: determine whether every hyperlinear group is sofic (Pestov, Question 3.4). Exactly two routes can establish this claim, one per answer:</p>\n<ul>\n<li><strong>No</strong> \u2014 <code><a href=\"hyperlinear-nonsofic-group.html\">hyperlinear-nonsofic-group</a></code>: exhibit a hyperlinear group that is</li>\n<p>not sofic (the separation).</p>\n<li><strong>Yes</strong> \u2014 <code><a href=\"hyperlinear-implies-sofic.html\">hyperlinear-implies-sofic</a></code>: prove that hyperlinearity implies</li>\n<p>soficity for groups.</p>\n</ul>\n<p>Either answer is a landmark, and the two payoffs converge on this program's targets: \"no\" is the separation itself, while \"yes\" combined with the unconditional nonsofic groups (<a href=\"kun-thom-nonsofic-wreath.html\">kun-thom-nonsofic-wreath</a>) immediately yields an explicit non-hyperlinear group \u2014 the other root target (<a href=\"non-hyperlinear-group.html\">non-hyperlinear-group</a>). So resolving Q3.4 in <em>either</em> direction closes a root of this graph.</p>\n<p><strong>Graph discipline.</strong> As a bare disjunction \"(\u2203 hyperlinear nonsofic group) \u2228 (hyperlinear \u27f9 sofic)\" this statement is a classical tautology; its content is knowing <em>which</em> disjunct holds. Therefore no <code>requires: []</code> direct route may ever be written for this claim \u2014 only the two answer routes above are admissible, and each becomes complete exactly when its answer is established.</p>\n<p><strong>Asymmetry caveat.</strong> The two sides are not equally actionable. Per docs/OBSTRUCTIONS.md \u00a75, candidate-by-candidate evidence that specific groups fail hyperlinearity can never accumulate to the \"yes\" side; that side needs a general conversion of hyperlinear approximations into sofic ones, for which no technique exists, and it is at least as strong as exhibiting a non-hyperlinear group. The \"no\" side is where all current routes in this graph live. This node records what counts as success, not a judgment that both directions are equally tractable.</p>"}, {"id": "quantized-scale-index", "status": "OPEN", "root": false, "goal": false, "title": "Quantized scale index synchronizing the two commutant exhaustion scales", "impact": 1, "frontier": true, "lock": null, "html": "<p>Separate elementwise coordinate-commutant recovery is closed (<a href=\"shifted-scale-recovery.html\">shifted-scale-recovery</a>), but the compressor shifts the exhaustion: <code>alpha(K_m) \u2264 K_{r(m)}</code> gives only <code>C_{r(m)} \u2264 D_m = U C_m U*</code>. Produce a quantized scale index, or a two-branch relation synchronizing the two scales in one multiplicity corner (AGENDA 2026-08-14, \"locally finite commutants recover at the wrong scale\").</p>"}, {"id": "radical-collision-criterion", "status": "ESTABLISHED", "root": false, "goal": false, "title": "A sofic-radical element with a hyperlinear detector yields a hyperlinear nonsofic group", "impact": 2, "frontier": false, "lock": null, "html": "<p>If a countable group <code>H</code> contains an element</p>\n<pre>\nx in Rad_sof(H) minus Rad_hyp(H),\n</pre>\n<p>then a hyperlinear nonsofic group exists.  Indeed, choose a hyperlinear detector of <code>x</code> and restrict its codomain to the image of <code>H</code>.  That image is hyperlinear.  It cannot be sofic, because the quotient map from <code>H</code> would then have to kill <code>x</code>.</p>"}, {"id": "radical-collision-reformulation", "status": "ESTABLISHED", "root": false, "goal": false, "title": "The radical collision is a reformulation of Question 3.4, not a reduction", "impact": 0, "frontier": false, "lock": null, "html": "<p>Let <code>H</code> be countable, <code>x in Rad_sof(H)</code> with <code>x!=1</code>.</p>\n<p>1. <strong>Automatic nonsoficity.</strong>  For every homomorphism <code>q:H-&gt;Q</code> with <code>q(x)!=1</code>, the image <code>q(H)</code> is <em>not</em> sofic, and <code>q(x) in Rad_sof(q(H))\\{1}</code>.  The nonsoficity of a detecting range is never an extra thing to prove \u2014 it is free \u2014 but neither can it be avoided. 2. <strong>Equivalence with the program target.</strong>  The following are equivalent.</p>\n<ul>\n<li>There is a countable hyperlinear nonsofic group.</li>\n<li>There are a countable <code>H</code>, an <code>x in Rad_sof(H)\\{1}</code>, and a</li>\n<p>homomorphism from <code>H</code> to a hyperlinear group not killing <code>x</code>.</p>\n</ul>\n<p>So the collision criterion is a restatement of Question 3.4 at full strength; it does not reduce it to a strictly easier problem. 3. <strong>No soficity-closure certificate.</strong>  Because of 1, the hyperlinearity of the detecting range can never be certified by placing it in a class built from sofic groups by operations that preserve soficity.  In particular no quotient of <code>H</code> in which <code>x</code> survives is LEF, LEA, residually finite, residually amenable, residually sofic, linear over any field, sofic-by- amenable, an amalgam of sofic groups over an amenable subgroup, a free product of sofic groups, a countable direct product or increasing union of sofic groups, or a generalized wreath product of sofic groups over a sofic underlying action.  Each such certificate would prove the target sofic and hence kill <code>x</code>. 4. <strong>What remains admissible.</strong>  The one certificate not of that shape: if <code>M</code> is a von Neumann algebra with a faithful normal tracial state, <code>Phi:H-&gt;U(M)</code> is a homomorphism with <code>Phi(x)!=1</code>, and the von Neumann subalgebra generated by <code>Phi(H)</code> is Connes embeddable, then <code>Phi(H)</code> is a countable hyperlinear group and <code>Phi</code> discharges the hypothesis of 2. Equivalently, in finite coordinates: normalized-Hilbert--Schmidt asymptotic representations <code>rho_n:H-&gt;U(d_n)</code> with <code>liminf ||rho_n(x)-1||_2 &gt; 0</code>.</p>\n<p>5. <strong>Where the criterion has leverage.</strong>  Its whole gain over \"prove the candidate hyperlinear\" is the freedom to pass to a proper quotient retaining <code>x</code>, i.e. the poset <code>{N normal in H : x notin N}</code>.  Its maximal elements give quotients that are monolithic with <code>x</code> in the monolith. The poset is trivial \u2014 only <code>N=1</code> \u2014 whenever <code>H</code> is just infinite, since then every nontrivial normal subgroup has finite index and every finite quotient is sofic; there the criterion says exactly \"<code>H</code> is hyperlinear\". If <code>H</code> is torsion-free hyperbolic, every nontrivial member of the poset is nonelementary and contains a free subgroup of rank two, so no finite or elementary collapse is available.  The leverage is therefore proportional to the richness of the normal subgroup lattice below the radical, which is exactly what the lamp constructions supply and what a hyperbolic candidate does not.</p>\n<p>The practical content of the criterion is therefore exactly one thing, and it is worth keeping: the model may be <strong>non-faithful</strong>.  One matrix-visible word is enough; no faithful hyperlinear representation of any nonsofic group has to be built.</p>"}, {"id": "random-complex-linear-cocycle-stability", "status": "OPEN", "root": false, "goal": false, "title": "Linear cocycle stability rate for random 2-dimensional Linial--Meshulam complexes", "impact": 1, "frontier": true, "lock": null, "html": "<p>Show that in a middle triangle-density range, random 2-dimensional Linial--Meshulam complexes typically have a <strong>linear cocycle stability rate</strong> in permutations.</p>\n<p>The cocycle stability rate measures how far a cochain with small coboundary must be from an actual cocycle.  \"Linear\" is the strongest possible rate, and it is the hypothesis that Chapman--Peled convert into a nonsofic hyperbolic group.</p>\n<p>Explicitly conjectural: this is a probabilistic estimate that Chapman--Peled propose and do not prove.  Their analogy is the known non-local-testability of Sipser--Spielman expander codes, which is what makes a <em>linear</em> rate plausible in the middle density regime rather than a weaker one.</p>\n<p>Source: Chapman--Peled, <em>Cocycle stability in permutations of random simplicial complexes</em>, arXiv:2509.21566 (2025-09-25, rev. 2025-12-04).</p>"}, {"id": "ray-injectivity", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Strict compressors have infinite rays", "impact": 0, "frontier": false, "lock": null, "html": "<p><code>ray_injective</code> (formalized). A strict compressor has no power in <code>\u0393</code>, so the ray <code>t\u207b\u207f\u0393</code> is infinite and the <code>\u0393</code>-fixed set is infinite. The complement of the collapse results: finite models fail because a finite fixed set equals its own image; the genuine action escapes because strictness forces infinitude.</p>"}, {"id": "rectangular-escape", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Equivariant whole maps admit rectangular escape", "impact": 0, "frontier": false, "lock": null, "html": "<p>For every finite perfect pairing <code>b : V \u00d7 W \u2192 F\u2082</code>, the direct-sum pairing on <code>V\u2032 = V\u2295V</code>, <code>W\u2032 = W\u2295W</code> with the four coordinate embeddings satisfies <code>b\u2032(R\u1d62v, L\u2c7cw) = \u03b4\u1d62\u2c7c b(v,w)</code> exactly, deterministically, and fully translation-equivariantly \u2014 evading the <code>1/36</code> theorem purely because the codomains are larger. Unitary covariance and trace balance do not close the escape. The live theorem this forces is same-orbit closure (<a href=\"same-orbit-closure.html\">same-orbit-closure</a>).</p>"}, {"id": "regular-character-mf-trace-implies-group-mf", "status": "ESTABLISHED", "root": false, "goal": false, "title": "An MF regular character forces the group to be operator MF", "impact": 1, "frontier": false, "lock": null, "html": "<p>Let <code>G</code> be a countable group, <code>A = C^*(G)</code> its full group C-star algebra and <code>tau</code> its canonical trace (<code>tau(u_g) = 1</code> if <code>g=1</code>, else <code>0</code>).  If <code>tau</code> is an <strong>MF trace</strong> in the sense of Shulman, arXiv:2507.22783v3 --- maps <code>phi_n : A -&gt; M_(k_n)</code> with</p>\n<pre>\n||phi_n(ab)-phi_n(a)phi_n(b)|| -&gt; 0,\n||phi_n(la+mb)-l phi_n(a)-m phi_n(b)|| -&gt; 0,\n||phi_n(a^*)-phi_n(a)^*|| -&gt; 0,\nsup_n ||phi_n(a)|| &lt; infinity,\n|tau(a)-tr(phi_n(a))| -&gt; 0,\n</pre>\n<p>all norms being the operator norm --- then <code>G</code> is operator MF in the weak Carrion--Dadarlat--Eckhardt sense.</p>\n<p>The point is that the trace normalization does all the work that the weak MF definition cannot do by itself: <code>tr(phi_n(1)) -&gt; 1</code> pins the unit corner at relative dimension <code>1</code>, and <code>tr(phi_n(u_g)) -&gt; 0</code> gives separation automatically, with constant <code>sqrt 2</code>.  Equivalently: an MF regular character is exactly a trace-controlled MF model in Schafhauser's sense, and those do give both the norm and the trace clause.</p>"}, {"id": "relative-wall-commutant-growth", "status": "ESTABLISHED", "root": false, "goal": false, "title": "A relative wall is exactly compressor growth of the relative commutant", "impact": 4, "frontier": false, "lock": null, "html": "<p>Let <code>Gamma&lt;G</code>, <code>t Gamma t^(-1)&lt;=Gamma</code>, and <code>pi:G-&gt;U</code> a homomorphism into an <strong>arbitrary group</strong> <code>U</code>.  Put</p>\n<pre>\nN=C_U(pi(Gamma)),     N_t=C_U(pi(t Gamma t^(-1))).\n</pre>\n<p>For <code>U=U(M)</code> with <code>M</code> finite tracial these are the relative commutants <code>M cap pi(Gamma)'</code> and <code>M cap pi(t Gamma t^(-1))'</code>.</p>\n<p>Then <code>Ad pi(t)(N)=N_t&gt;=N</code>, and a relative wall -- a unitary <code>v in N</code> with <code>[v,pi(t^(-1) gamma t)]!=0</code> for some <code>gamma in Gamma</code> -- exists <strong>iff</strong> <code>N!=N_t</code>.  The marked predecessor <code>h</code> is not data.</p>\n<p>Involutive form: a Clifford wall exists iff there are <code>gamma in Gamma</code> and a self-adjoint involution <code>w in N_t</code> with <code>w (pi(gamma) w pi(gamma)^<em>)+(pi(gamma) w pi(gamma)^</em>) w=0</code>.</p>\n<p><strong>Invariance form.</strong>  If <code>Gamma</code> is infranormal, a wall exists for <em>some</em> compressor iff <code>N</code> is not <code>Ad pi(G)</code>-invariant.  This is the exact noncommutative counterpart of Kun--Thom Theorem C, which asserts that <code>L^infinity(X)^Gamma</code> <em>is</em> <code>G</code>-invariant for sofic p.m.p. actions: the wall is precisely the failure of that theorem when \"sofic action\" is weakened to \"Connes-embeddable model\".  A construction that untwists the extension -- producing a <code>G</code>-invariant complement or an invariant lamp algebra -- makes <code>N</code> invariant and so destroys its own conclusion.</p>\n<p>Because the argument is purely group-theoretic, <code>N=N_t</code> -- hence no wall -- follows in every target carrying a conjugation-invariant strictly monotone size: finite groups by order, genuine finite-dimensional representations by linear dimension (<code><a href=\"commutant-no-growth.html\">commutant-no-growth</a></code>), compact targets by recurrence (<code><a href=\"infranormal-compact-closure-normal.html\">infranormal-compact-closure-normal</a></code>).  A II_1 target has no such size, and <code><a href=\"kun-thom-clifford-cover-weakly-sofic.html\">kun-thom-clifford-cover-weakly-sofic</a></code> shows the wall is genuinely realized in a metric ultraproduct of finite groups.</p>"}, {"id": "relator-energy-variance-bound", "status": "OPEN", "root": false, "goal": false, "title": "Size-uniform bound from mixed relator energy to outer conditional variances", "impact": 1, "frontier": true, "lock": null, "html": "<p>Prove a size-uniform quantitative bound: mixed middle-root multiplication-word energy controls the two outer conditional variances on the common long-root carrier (AGENDA 2026-08-14, \"exact joint covariance can retain maximal fiber variance\"). Covariance alone cannot do this \u2014 the balanced-fiber countermodel <a href=\"maximal-fiber-variance.html\">maximal-fiber-variance</a> keeps every finite-depth path identity exact while a branch bit retains conditional variance <code>1/4</code>. After this bound, the majority decoder and the <code>1/36</code> floor are already available.</p>"}, {"id": "same-orbit-closure", "status": "OPEN", "root": false, "goal": false, "title": "Same-orbit closure for the child translation images", "impact": 1, "frontier": true, "lock": null, "html": "<p>On positive total trace, the two child translation images must remain inside one source-sized paired orbit up to vanishing boundary leakage (AGENDA 2026-08-14, \"equivariant whole maps still admit rectangular escape\"). Without this closure the four-word covariance audit is insufficient; with it, equivariant orbit-summing supplies the common self-map law and <code>1/36</code> finishes.</p>"}, {"id": "scaled-kazhdan-transport", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Kazhdan transport of asymptotic commutants at every scale", "impact": 1, "frontier": false, "lock": null, "html": "<p>For every nonnegative weight sequence <code>w</code>, every one-sided compressor of a Kazhdan image acts in both directions on the <code>w</code>-mass-bounded, <code>w</code>-scaled Frobenius asymptotic commutant of every operator-norm almost representation.  The dimension weight recovers (and strictly strengthens) the normalized-HS transport theorem; rank weights give the arbitrary-rescaling matricial Mautner statement on the mass sector.</p>"}, {"id": "scaling-family-non-mf", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Infinite scaling family of finitely presented non-MF groups", "impact": 0, "frontier": false, "lock": null, "html": "<p>For every integer <code>m &gt;= 2</code>, replacing literal doubling by scaling by <code>m</code> produces a finitely presented group <code>E_m</code> with a nontrivial central involution killed by every norm-matrix-corona representation.  Hence every <code>E_m</code>, and both of its group C-star algebras, are non-MF.</p>"}, {"id": "scaling-family-pairwise-nonisomorphic", "status": "OPEN", "root": true, "goal": false, "title": "Pairwise non-isomorphism of the non-MF scaling family", "impact": 0, "frontier": true, "lock": null, "html": "<p>The finitely presented non-MF groups <code>E_m</code>, for integers <code>m &gt;= 2</code>, are pairwise non-isomorphic.</p>"}, {"id": "schatten-one-corner-detector", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Unnormalized Schatten-one models retaining a central radical involution give a detector", "impact": 1, "frontier": false, "lock": null, "html": "<p>Let <code>E</code> be countable with <code>z != 1</code>, <code>z^2=1</code>, <code>z</code> central and <code>z in Rad_sof(E)</code>.  Suppose there are maps <code>phi_n : E -&gt; U(d_n)</code> with</p>\n<pre>\n||phi_n(gh)-phi_n(g)phi_n(h)||_1 -&gt; 0   (g,h in E),\nliminf_n ||phi_n(z)-1||_1 &gt; 0,\n</pre>\n<p>in the <em>unnormalized</em> Schatten-one norm.  Then the image of <code>E</code> in a tracial matrix ultraproduct built from the negative spectral corner of <code>z</code> is hyperlinear, retains <code>z</code>, and is therefore nonsofic: a hyperlinear nonsofic group exists.</p>\n<p>Neither hyperlinearity of <code>E/&lt;z&gt;</code> nor a positive-density negative <code>z</code>-spectral sector is needed.  The reason is the scaling boundary of <code><a href=\"corner-renormalization-cost.html\">corner-renormalization-cost</a></code> read in the favourable direction: a nonzero corner has rank at least one, so an <em>unnormalized</em> trace-norm error becomes a normalized Hilbert--Schmidt error in the corner with no density loss (<code>||A||_(2,r)^2 &lt;= 2||A||_1/r &lt;= 2||A||_1</code>).  There is no analogue for a normalized Schatten-one or normalized Hilbert--Schmidt model, where the whole error may concentrate on the selected <code>o(d_n)</code> corner.</p>"}, {"id": "schatten-one-models-retaining-mark", "status": "OPEN", "root": false, "goal": false, "title": "A Kun--Thom candidate with unnormalized Schatten-one models retaining its mark", "impact": 1, "frontier": true, "lock": null, "html": "<p>Some explicit group <code>E</code> with a nontrivial central involution <code>z</code> in its sofic radical --- the Kun--Thom compression family being the only known supply --- admits maps <code>phi_n : E -&gt; U(d_n)</code> whose multiplicative defects tend to <code>0</code> in the <em>unnormalized</em> Schatten-one norm while <code>||phi_n(z)-1||_1</code> stays bounded below.</p>\n<p>This is open, and it is not vacuous in either direction: Bachner--Dogon--Lubotzky (arXiv:2508.17392) prove that <code>l</code>-adic Deligne-type central extensions are <em>not</em> Schatten-one approximated, which is what makes the hypothesis a genuine restriction; and their inapproximability does not prove nonhyperlinearity, because a normalized Hilbert--Schmidt microstate need not have unnormalized Schatten-one defect tending to zero.</p>"}, {"id": "shifted-scale-recovery", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Locally finite commutants recover at shifted scales", "impact": 0, "frontier": false, "lock": null, "html": "<p>Reynolds averaging over slowly-growing finite unitriangular envelopes puts every fixed finite family from the ultraproduct commutant within <code>o(1)</code> of exact coordinate commutants (the Reynolds identity is formalized in <code>PropertyT/FiniteGroupAverage.lean</code>). But the compressor shifts the exhaustion: <code>\u03b1(K_m) \u2264 K_{r(m)}</code> yields only <code>C_{r(m)} \u2264 D_m = U C_m U*</code>; for the unilateral binary shift, <code>dim(D_m) = 2\u00b7dim(C_{m+1})</code> exactly. Separate recovery is closed; the live gate is <a href=\"quantized-scale-index.html\">quantized-scale-index</a>.</p>"}, {"id": "shulman-amalgam-mf-criterion", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Shulman's necessary and sufficient condition for MF amalgams", "impact": 1, "frontier": false, "lock": null, "html": "<p>Shulman, <em>The MF property for amalgamated free products</em>, arXiv:2603.13564v2, <strong>Theorem 20</strong> (verbatim in the artifact): for separable C*-algebras <code>A, B, C</code> with inclusions <code>theta_A : C -&gt; A</code> and <code>theta_B : C -&gt; B</code>, the amalgam <code>A *_C B</code> is MF <strong>if and only if</strong> there are embeddings <code>phi_A : A -&gt; prod M_n / (+) M_n</code> and <code>phi_B : B -&gt; prod M_n / (+) M_n</code> with <code>phi_A o theta_A = phi_B o theta_B</code>.</p>\n<p><strong>Theorem 10</strong> is the symmetric case: <code>A <em>_C A</code> is MF whenever <code>A</code> is separable MF and <code>C &lt;= A</code> is any C</em>-subalgebra.</p>\n<p>Group bridge, also from the paper: <code>C*(G_1 <em>_H G_2) = C</em>(G_1) <em>_{C</em>(H)} C*(G_2)</code>, and if <code>C*(G)</code> or <code>C*_r(G)</code> is MF then the group <code>G</code> is MF.</p>\n<p><strong>Trust surface.</strong>  Source-verified from the PDF this session; the transcription is in the artifact.  Scope caution: Theorem 20 concerns C*-algebras, and MF of <code>C*(G)</code> is strictly stronger than group MF in the convention used here, so a route built on it must also carry MF of both vertex algebras.</p>"}, {"id": "sign-mark-rate-is-sector-density", "status": "ESTABLISHED", "root": false, "goal": false, "title": "For a sign mark the amplification rate is exactly the negative sector density", "impact": 0, "frontier": false, "lock": null, "html": "<p>Let <code>z</code> be a central involution and <code>phi_n</code> operator-norm models with defect <code>epsilon_n</code> in which <code>phi_n(z)</code> is (asymptotically) a self-adjoint involution with negative spectral sector of relative dimension</p>\n<pre>\ndelta_n = r_n/d_n.\n</pre>\n<p>Then the effective-rank stopping statistic <code>(ERP11)</code> of <code>FALSE_WEAK_MF_EFFECTIVE_RANK_PROFILE.md</code> is</p>\n<pre>\nepsilon_n^2 d_n / ||phi_n(z)-1||_F^2 = epsilon_n^2/(4 delta_n),   (SD1)\n</pre>\n<p>so the whole profile collapses to one number, the sector density, and:</p>\n<p>1. if <code>liminf delta_n &gt; 0</code> the mark is already Hilbert--Schmidt visible, <code>1-Re tr(phi_n(z)) = 2 delta_n</code>, and <strong>no amplification is needed at all</strong>; 2. otherwise the profile is exactly <code>epsilon_n = o(sqrt(delta_n))</code>, which is the corner-renormalization cost <code>tau(p_n)^(-1/2) = delta_n^(-1/2)</code> of <code><a href=\"corner-renormalization-cost.html\">corner-renormalization-cost</a></code> in rate form.</p>\n<p>Reading the two candidate families through <code>(SD1)</code>:</p>\n<ul>\n<li><strong>Clifford family.</strong>  The Connes-embeddable Clifford detector sends the mark</li>\n<p>to the scalar <code>-1</code>, so <code>delta_n = 1</code> and the statistic is <code>epsilon_n^2/4</code>. The rate is free; that family's difficulty was never the rate.</p>\n<li><strong>Cyclic-shear family.</strong>  <code>J(H,x) = (H x &lt;z&gt;) *_A K</code> amalgamates over the</li>\n<p>finite <code>A = &lt;x,z&gt; = C_2 x C_2</code>, and <code>alpha(x)=xz</code> makes the compressor swap the two characters with <code>chi(z) = -1</code>, so those two sectors have equal rank.  In any splice matching the vertex models along a multiple of the regular representation of <code>A</code> --- which is what an amalgam criterion asks for --- <code>delta_n = 1/2</code> and the statistic is <code>epsilon_n^2/2</code>.  The rate is free; the blocker is existence of the total-group model, the projective-sector splice.</p>\n<li><strong>Free-lamp family with exact ambient letters.</strong>  Here property <code>(T)</code></li>\n<p>rigidity forces <code>||phi_n(q)-1||_(2,d_n) &lt;= C epsilon_n</code>, i.e. <code>delta_n &lt;= C^2 epsilon_n^2/2</code>, and <code>(SD1)</code> is bounded below by <code>1/(2C^2)</code>. The rate provably fails.</p>\n</ul>\n<p>So the rate is not the blocker in either named candidate family; it is the blocker exactly where property <code>(T)</code> squeezes the mark onto a vanishing sector, and there it fails rather than being unknown.</p>"}, {"id": "simple-sofic-total-mf-radical", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Countable simple sofic group with total MF radical", "impact": 0, "frontier": false, "lock": null, "html": "<p>There exists a countable simple sofic group <code>S</code> with <code>Rad_MF(S) = S</code>; equivalently every homomorphism from <code>S</code> to an MF group is trivial.</p>"}, {"id": "simultaneous-dilation-splice", "status": "OPEN", "root": false, "goal": false, "title": "Simultaneous dilation of the positive compressors preserves Connes embeddability (RESTATEMENT of the target, not a reduction)", "impact": 1, "frontier": true, "lock": null, "html": "<p>Starting from the sofic microstates of <code>W\u2080 = (\u2295_{X\u2080} C\u2082) \u22ca \u0393</code> (<code><a href=\"positive-core-bernoulli-ce.html\">positive-core-bernoulli-ce</a></code>), implement the endomorphisms induced by <code>L\u208a = SL_d(\u2124) \u2229 M_d(\u2115)</code> by unitary dilators satisfying the finite relations of <code>SL_d(\u2124)</code>, without destroying Connes embeddability. Equivalently: the minimal simultaneous automorphic dilation <code>M = W*(N\u208a, u_s : s \u2208 S)</code> of the positive core by all the compressors at once is Connes embeddable.</p>\n<p>If it holds, <code>W = (\u2295_{G/\u0393} C\u2082) \u22ca G</code> is hyperlinear, and with <code><a href=\"wreath-not-sofic.html\">wreath-not-sofic</a></code> that answers Pestov's Question 3.4 negatively. The corpus states this consequence explicitly as <code>(FSD20)</code>.</p>\n<h3>RESTATEMENT AUDIT (2026-08-14) \u2014 this claim renames the target</h3>\n<p>Flagged by the team-wide \"restatement dressed as reduction\" warning and confirmed by re-derivation. This is the worst of the three cases: the equivalence needs no established claim at all, because <code>M</code> <strong>is</strong> the target algebra. <code>docs/FALSE_FULL_COMPRESSION_SEMIGROUP_DILATION.md</code> <code>(FSD5)</code> reads verbatim</p>\n<p>M = L^\u221e({\u00b11}^{G/\u0393}) \u22ca G = L((\u2295_{G/\u0393} C\u2082) \u22ca G),</p>\n<p>so \"<code>M</code> is Connes embeddable\" is \"<code>W</code> is hyperlinear\" is <code><a href=\"hyperlinear-wreath-model.html\">hyperlinear-wreath-model</a></code>. The same document says so in its own outline \u2014 \"the remaining obstruction is simultaneous dilation subject to the relations among different compressors, <strong>equivalently Connes embeddability of (FSD5)</strong>\" \u2014 and the node was written anyway. The corpus stated the equivalence and it was read as a decomposition.</p>\n<p><strong>The route <code><a href=\"positive-core-dilation-splice.html\">positive-core-dilation-splice</a></code> is therefore not a reduction.</strong> Its implication is true, the graph is not lying, but the open hole it displays is the target wearing different notation, and it should not be counted as a second front.</p>\n<p><strong>No repair is available, and that is worth knowing.</strong> The obvious fix is to replace this claim by the general permanence principle it instantiates \u2014 \"the minimal simultaneous automorphic dilation of a Connes-embeddable algebra along a family of trace-preserving endomorphisms with prescribed relations is Connes embeddable\". That principle is too strong to be useful: taking <code>N = \u2102</code> with trivial endomorphisms makes the dilation <code>L(G)</code> for an arbitrary group, so the principle implies every group is hyperlinear. Splitting it into the two steps the corpus names \u2014 amalgamated free product over <code>N\u208a</code>, then quotient by the relations \u2014 does not help either, since the second step's target is <code>M</code> itself, so the pair is again equivalent to the target.</p>\n<h3>What survives, and it is not nothing</h3>\n<p>The genuine content is <code><a href=\"positive-core-bernoulli-ce.html\">positive-core-bernoulli-ce</a></code>, which is established and is not a restatement: it exhibits real matrix microstates for a real subalgebra. What it buys is a <strong>localization of the difficulty</strong>, not a reduction of it \u2014 the core is discharged unconditionally, so nothing is left but the dilation. That is worth recording and is why these nodes are kept rather than deleted. It is not progress toward the target in the sense the kernel means by a route.</p>\n<h3>Why it is not routine, stated exactly</h3>\n<p>For a <strong>single</strong> compressor the dilation is an inductive limit followed by a crossed product by <code>\u2124</code>, and both operations preserve Connes embeddability. The construction does not iterate. Adjoining several free dilators produces amalgamated free products <strong>over the nonamenable core <code>N\u208a</code></strong>, and then imposing the actual <code>SL_d(\u2124)</code> relations among the dilators is a quotient. Neither operation is known to preserve Connes embeddability in this generality. The corpus calls this the simultaneous-coherence gate.</p>\n<h3>What the gate is, in the literature's own terms</h3>\n<p>The first half of the gate is a named open problem, and the identification does not appear to have been made in this corpus before. Brown\u2013Dykema\u2013Jung Corollary 4.5 gives <code>\u2133\u2081 <em>_B \u2133\u2082 \u21aa R^\u03c9</code> when the <code>\u2133\u1d62</code> are and <code>B</code> is <strong>hyperfinite</strong>. Gao\u2013Junge, arXiv:2012.07940, record the general case as open, verbatim: </em>\"the problem of given M and N embeddable, whether \u2217_N M is embeddable as well remains open\"<em>, and as their Problem 1 in the QWEP form, noting also that </em>\"the 'position' of N inside M is important.\"* Here <code>B = N\u208a</code> is nonamenable by construction, so the gate's free-product half <strong>is</strong> that open problem, at a specific and unusually structured base.</p>\n<p>That reframing cuts both ways and both are worth recording. It means the gate will not fall to a routine permanence lemma \u2014 if it did, it would settle a standing question in operator algebras. It also means the wreath candidate is now attached to a problem that has independent attention, with a concrete base algebra on which the general question can be tested, rather than sitting alone.</p>\n<h3>Routes that are already closed off</h3>\n<p>The Ore shortcut is dead: the full compressor semigroup is neither left nor right Ore and admits no cofinal Ore subsemigroup (<code>docs/FALSE_COMPRESSION_SEMIGROUP_ORE_NO_GO.md</code>, <code>docs/AGENDA.md</code>). So the several-compressor case cannot be reduced to the one-compressor case by directing the semigroup. <code>docs/FALSE_FULL_COMPRESSION_SEMIGROUP_DILATION.md</code> also records that the principal-bundle constructions solve the relation-imposing step only after forgetting the common nonamenable core, and that the one-compressor construction solves the first two steps only conditionally on embeddability of that core \u2014 which <code><a href=\"positive-core-bernoulli-ce.html\">positive-core-bernoulli-ce</a></code> now supplies unconditionally. <strong>The missing theorem is precisely their compatible splice</strong>, and with the core discharged it is the only thing missing.</p>"}, {"id": "single-lamps-recover-set-action", "status": "ESTABLISHED", "root": false, "goal": false, "title": "A sofic C-action on the C2 lamp group forces the underlying set action sofic", "impact": 0, "frontier": false, "lock": null, "html": "<p>Let a group <code>G</code> act on a set <code>X</code>, put</p>\n<pre>\nD = directSum_X C_2,\n</pre>\n<p>and let <code>G</code> act on <code>D</code> by permuting coordinates.  If this automorphism action is a <strong>sofic <code>C</code>-action</strong> in the sense of Alekseev--Bradford Definition 4.23, <strong>for any class <code>C</code> of groups whatsoever</strong>, then the original action <code>G action X</code> is a sofic action on a set.</p>\n<p>The quantifier over <code>C</code> is the whole point: nothing in the proof uses any property of the target class, so no enrichment of the targets \u2014 hyperlinear, weakly sofic, linear sofic, Clifford, unitary, or any class yet to be named \u2014 can make the lamp action satisfy the hypothesis while the set action fails it.</p>\n<h3>Why this matters here</h3>\n<p>Applied to the Kun--Thom pair it removes the last apparent escape from <code><a href=\"coordinate-action-not-sofic.html\">coordinate-action-not-sofic</a></code>.  Alekseev--Bradford Corollary 5.2 is stated for four classes (sofic, <code>K</code>-linear sofic, hyperlinear, weakly sofic), and its class (c) invites the hope that <code>G action G/Gamma</code> might be a sofic <em>hyperlinear</em> action even though it is not a sofic action, which would deliver hyperlinearity of <code>W</code> from the permanence theorem directly.  This lemma says that hope is empty for every class at once: a sofic <code>C</code>-action on the lamp group would produce a sofic set action, and <code><a href=\"coordinate-action-not-sofic.html\">coordinate-action-not-sofic</a></code> forbids that.</p>\n<p>Consequently the 2026 semidirect-product permanence theorem is inapplicable to the Kun--Thom lamp for <em>every</em> choice of target class, not merely for the sofic class.  Recorded as the invalidated route <code><a href=\"halo-target-class-enrichment.html\">halo-target-class-enrichment</a></code>.</p>\n<h3>Scope</h3>\n<p>The lemma constrains the hypothesis of a permanence theorem.  It says nothing about whether <code>W</code> is hyperlinear, and it is not an obstruction to <code><a href=\"hyperlinear-wreath-model.html\">hyperlinear-wreath-model</a></code>: it closes one family of <em>methods</em>, exactly as <code><a href=\"sofic-action-permanence.html\">sofic-action-permanence</a></code> does, and leaves abstract existence untouched.</p>"}, {"id": "slofstra-involution-not-sofic-radical", "status": "ESTABLISHED", "root": false, "goal": false, "title": "The Slofstra involution survives a sofic image", "impact": 0, "frontier": false, "lock": null, "html": "<p>Let <code>S</code> be the solution group produced in the proof of Slofstra, arXiv:1703.08618v2, Proposition 5.1, and let <code>J</code> be its distinguished central involution.  There is a homomorphism</p>\n<pre>\nTheta : S -&gt; product_omega (Sym(Omega_n), d_H)\n</pre>\n<p>with <code>Theta(J) != 1</code>.  Its image is a subgroup of a metric ultraproduct of finite symmetric groups, hence sofic.  Therefore</p>\n<pre>\nJ notin Rad_sof(S).\n</pre>\n<h3>What this refutes</h3>\n<p>It refutes the assertion isolated in the corpus as <code>(HSC7)</code>,</p>\n<p>&gt; <code>every homomorphism S -&gt; a sofic group kills J</code>,</p>\n<p>which was the missing input of a proposed dichotomy. The corpus is explicit that <code>(HSC7)</code> had been the precise gap and that this theorem closes it in the negative:</p>\n<p>&gt; Th
