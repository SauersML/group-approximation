ten down.</p>"}, {"id": "finite-dimensional-models-break-coordinate-generation", "status": "ESTABLISHED", "root": false, "goal": false, "title": "A finite-dimensional model with no Kazhdan-invariant vectors breaks coordinate generation", "impact": 0, "frontier": false, "lock": null, "html": "<p>Let <code>H</code> carry the transport data and suppose <code>H</code> has a finite-dimensional unitary representation <code>sigma</code> with no nonzero <code>iota(Gamma)</code>-invariant vector.  Then the corona model <code>V_n = sigma^{oplus n}</code> \u2014 dimensions increasing, multiplicative defect zero \u2014 has coordinate ultraproduct equal to the <code>sigma</code>-space, on which <code>iota(Gamma)</code> has no invariant vector at all. So its Kazhdan projection <code>P</code> is zero and the subspace generated by <code>ran P</code> is zero, not everything.</p>\n<p>Consequently <code><a href=\"kazhdan-invariant-subspace-generates.html\">kazhdan-invariant-subspace-generates</a></code> cannot be asked of every corona model.  It must be restricted to models that <strong>detect the mark</strong>, and even then it requires that no finite-dimensional unitary representation of <code>H</code> simultaneously detect the mark and kill the Kazhdan-invariant vectors.</p>\n<h3>Ideas</h3>\n<p><strong>The existing architecture supplies the restricted hypothesis, and for a strong reason.</strong>  By <code><a href=\"unsquared-defect-finite-model-invisible.html\">unsquared-defect-finite-model-invisible</a></code>, every finite-dimensional linear representation of the literal group kills the compression defect <code>u</code>, hence kills everything in its normal closure, hence the mark.  So no finite-dimensional representation detects the mark at all, and the counterexample above cannot be instantiated against a mark-detecting model.  This is the same finite-dimensional shadow that Theorem B of the manuscript records, appearing here as the thing that keeps the coordinate route coherent rather than as a limitation.</p>\n<p><strong>What it costs.</strong>  The restriction is not free: it means the coordinate route can never be established by an argument that treats all corona models alike.  Any proof must use the hypothesis <code>Theta(z) != 1</code> from the start, which is exactly the hypothesis one is trying to refute \u2014 so the argument has to be genuinely by contradiction, and the Kazhdan-invariant vectors have to be produced <em>from</em> the survival of the mark.  That is a much more specific demand than \"the models happen to contain the trivial representation\", and it is the honest shape of the remaining difficulty.</p>\n<p><strong>Necessary condition on the source.</strong>  Combining with <code><a href=\"bounded-rank-corners-excluded.html\">bounded-rank-corners-excluded</a></code>, both open analytic routes on the central-mark branch want the same unusual property of the Kazhdan source: absence of low-dimensional representations, minimal almost periodicity being the clean form.  The repository has such a source, <code>St_5(L)</code>, whose every finite-dimensional unitary representation is trivial.  That the same hypothesis is forced twice, by two unrelated arguments, is mild evidence that it is the right architecture to build the torsion-free mark on.</p>"}, {"id": "finite-infranormal-subgroup-is-normal", "status": "ESTABLISHED", "root": false, "goal": false, "title": "A finite infranormal subgroup is normal", "impact": 0, "frontier": false, "lock": null, "html": "<p>Let <code>K&lt;G</code> be finite and put <code>P_K={g in G : gKg^(-1) &lt;= K}</code>.  Then <code>P_K=N_G(K)</code>, because conjugation preserves the finite cardinality of <code>K</code> and turns the inclusion into equality.  Consequently, if <code>P_K</code> generates <code>G</code> (infranormality in the Kun--Thom sense), then <code>N_G(K)=G</code> and <code>K</code> is normal.</p>\n<p>In particular no finite subgroup can be both nonnormal and infranormal, so a fixed finite Pauli packet cannot replace the infinite nonnormal Kazhdan subgroup in the Kun--Thom sofic-radical theorem.</p>"}, {"id": "finite-normal-compression-obstruction", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Finite-normal obstruction from the compression radical", "impact": 0, "frontier": false, "lock": null, "html": "<p>For a property-(T) subgroup <code>L</code> of <code>H</code>, every finite normal subgroup of <code>H</code> contained in the normal closure of commutators <code>[g z g^-1, ell]</code>, where <code>g</code> one-sidedly compresses <code>L</code>, <code>z</code> centralizes <code>L</code>, and <code>ell in L</code>, is killed by every norm-matrix-corona representation of <code>H</code>.</p>"}, {"id": "finite-quotient-blindness", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Finite quotients are blind to the compression", "impact": 2, "frontier": false, "lock": null, "html": "<p><code>compressedImage_eq</code> (formalized). For any <code>\u03c6</code> into a finite group, <code>\u03c6(t)</code> normalizes <code>\u03c6(\u0393)</code>; since <code>\u0393</code> and the compressors generate, the image of <code>\u0393</code> is normal in every finite quotient. The compression data is quotiented away before any finite-quotient construction starts. Specializes to <code>\u27e8\u0101\u27e9 = \u27e8\u0101\u00b2\u27e9</code> in every finite quotient of <code>BS(1,2)</code>. Manuscript: <code>rem:finiteblind</code>.</p>"}, {"id": "finite-site-orbits-invariant-clifford-kernel", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Finite site orbits yield finite invariant Clifford-lamp kernels", "impact": 2, "frontier": false, "lock": null, "html": "<p>Let a group <code>H</code> act on a site set <code>X</code>.  If every <code>H</code>-orbit in <code>X</code> is finite, then every finite subset of the presented Clifford lamp group over <code>X</code> lies in a finite <code>H</code>-invariant subgroup.</p>"}, {"id": "finite-telescope-level-coset-orbits", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Telescope levels have finite orbits on the marked coset space", "impact": 4, "frontier": false, "lock": null, "html": "<p>Let <code>alpha : Gamma -&gt; Gamma</code> be injective with finite-index range.  In the mapping-telescope-by-shift group, every telescope level has finite orbits on the left-coset space of the level-zero copy of <code>Gamma</code>.</p>"}, {"id": "finite-traced-kazhdan-transport", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Kazhdan transport over arbitrary traced coordinates", "impact": 2, "frontier": false, "lock": null, "html": "<p>Let <code>(A_k,tau_k)</code> be unital C-star algebras with tracial states, let <code>H</code> be a group and <code>U_k : H -&gt; U(A_k)</code> an asymptotic representation --- with respect to the operator norm <em>or</em> to <code>||.||_(2,tau_k)</code>.  Let <code>Gamma</code> have property <code>(T)</code>, let <code>iota : Gamma -&gt; H</code>, and let <code>s in H</code> satisfy <code>s iota(Gamma) s^(-1) &lt;= iota(Gamma)</code>.  Then for every uniformly bounded sequence <code>x_k in A_k</code> with</p>\n<pre>\n||[x_k, U_k(iota gamma)]||_(2,tau_k) -&gt; 0   for every gamma in Gamma,\n</pre>\n<p>the conjugated sequence <code>U_k(s) x_k U_k(s)^*</code> has the same property.</p>\n<p>Only a tracial state on each coordinate is used; faithfulness, real rank zero, comparison, and finiteness of the coordinates are not.  Property <code>(T)</code> is used at exactly one point --- to place the fixed-space projection inside the algebra generated by the representation --- and cannot be dropped.</p>\n<p>Because the hypothesis may be taken in <code>||.||_2</code>, transport itself is norm-agnostic: it is not the step at which the norm-to-trace passage fails.</p>"}, {"id": "finite-tracial-cstar-transport", "status": "ESTABLISHED", "root": true, "goal": false, "title": "Kazhdan transport for norm ultraproducts of finite traced C-star algebras", "impact": 0, "frontier": false, "lock": null, "html": "<p>Formulate a natural class of finite tracial C-star algebras for which one-sided Kazhdan transport, finite-normal cancellation, and the central-sign obstruction remain valid in their norm ultraproducts, and prove the resulting target-general theorem.</p>\n<h3>Ideas</h3>\n<p>The proposed class is <code>C_ftr</code>: unital C-star algebras with a <em>faithful</em> tracial state (<code><a href=\"faithfully-traced-unital-coordinates.html\">faithfully-traced-unital-coordinates</a></code>).  It is the minimal natural class, in the sense that each axiom is consumed by exactly one step:</p>\n<pre>\ntracial state on each coordinate  -&gt; the ||.||_2 statements and transport\nfaithful                          -&gt; nonzero corners carry states\nfinite (implied by faithful)      -&gt; corona unitaries lift to unitaries\ncorner-closed (implied)           -&gt; the sign / isotypic compression\n</pre>\n<p>Nothing else about matrices is used.  In particular real rank zero, nuclearity, simplicity, strict comparison, cancellation and classification hypotheses are <em>not</em> needed if one argues in the ultraproduct rather than at finite stage; they reappear only if one wants the quantitative finite-stage form (spectral projections at an arbitrary threshold, a uniform comparison modulus), which is what the formalized matrix proof provides.</p>\n<p>Two structural findings from the decomposition are worth keeping separate from the target theorem:</p>\n<ul>\n<li>transport is norm-agnostic (<code><a href=\"finite-traced-kazhdan-transport.html\">finite-traced-kazhdan-transport</a></code> accepts the</li>\n<p>asymptotic-commutant hypothesis in <code>||.||_2</code>), so property <code>(T)</code> transport is <em>not</em> where the operator-norm/tracial dividing line lies;</p>\n<li>the dividing line is the corner: free in operator norm, cost</li>\n<p><code>tau(p)^(-1/2)</code> tracially (<code><a href=\"corner-renormalization-cost.html\">corner-renormalization-cost</a></code>), and the class cannot be widened past it (<code><a href=\"tracial-coordinate-transport-barrier.html\">tracial-coordinate-transport-barrier</a></code>).</p>\n</ul>\n<p>Property <code>(T)</code> enters at exactly one point of the general proof: it puts the fixed-space projection inside the algebra generated by the representation, so that Murray--von Neumann comparison happens in a finite algebra.  Without it the projection is only in <code>B(L^2)</code>, which is not finite --- the abstract counterpart of <code><a href=\"cyclic-base-sharpness.html\">cyclic-base-sharpness</a></code>.</p>\n<p><strong>Uniqueness is not among the axioms, and is not available anyway.</strong>  A natural guess is that transport needs the embeddings into the ultraproduct to be unique up to unitary conjugacy.  It does not: the proof compares two projections inside one finite algebra and never compares two embeddings. That is fortunate, because the available uniqueness theorem does not reach this setting.  Hua--White, <em>Uniqueness for embeddings of nuclear C-star algebras into type II_1 factors</em>, arXiv:2601.08779 (verified from the abstract), proves that unital, full, <strong>nuclear</strong> maps from a separable unital <strong>exact</strong> C-star algebra satisfying the <strong>UCT</strong> into an ultraproduct of finite von Neumann factors, agreeing on traces and total <code>K</code>-theory, are unitarily equivalent, with a quasidiagonal-approximation corollary for matrix sequences.  Every one of those hypotheses fails for the objects here: the group C-star algebra of a property-<code>(T)</code> group carrying the compression data is not nuclear, the quasi-representations that arise are not nuclear maps, and no UCT input is available.  So the theorem is a landmark for the classifiable world and is inapplicable to this architecture; nothing in this graph should be built on it.</p>"}, {"id": "finite-window-decoder", "status": "OPEN", "root": false, "goal": false, "title": "Finite-window endomorphism decoder", "impact": 1, "frontier": true, "lock": null, "html": "<p>Extract from the joint outer characters common finite paired-radical label spaces on which the four one-sided Leavitt maps act with vanishing boundary and pairing error (AGENDA 2026-08-14, \"one comb compressor gives one joint outer PVM\"). Caution: a common carrier alone is NOT a decoder \u2014 the finite <code>UT\u2084(F\u2082)</code> regular model realizes the carrier and the full nested table without one (<a href=\"carrier-not-decoder.html\">carrier-not-decoder</a>).</p>\n<p>It is sufficient to decode the three products consumed by <a href=\"leavitt-multiplicative-trace-floor.html\">leavitt-multiplicative-trace-floor</a> on the canonical trace-<code>1/8</code> Pauli corner; the additive Leavitt relation and an unspecified nonzero corner are not needed.  The fixed density converts ambient microstate errors to normalized corner errors with no vanishing-rank escape.</p>"}, {"id": "finitely-presented-sofic-non-mf", "status": "ESTABLISHED", "root": true, "goal": false, "title": "A finitely presented sofic and hyperlinear group that is not MF", "impact": 0, "frontier": false, "lock": null, "html": "<p>The literal forty-one-relator group <code>E</code> is finitely presented, sofic, and hyperlinear, and is not MF in any of the formalized operator-norm matrix-corona conventions.</p>\n<p>This strengthens Theorem E of the manuscript from the finitely generated witness <code>W = ClLamp(X) semidirect V</code> to the finitely presented source, and it separates the two approximation radicals on one finitely presented group:</p>\n<p>Rad_sof(E) = 1   while   {1,w} &lt;= Rad_MF(E),  w != 1.</p>"}, {"id": "fournier-facio-group-finite-dimensional-shadow", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Every finite-dimensional representation of the Fournier-Facio group kills the simple factor", "impact": 1, "frontier": false, "lock": null, "html": "<p>Let <code>G</code> be the Fournier-Facio group of <code><a href=\"fournier-facio-torsion-free-skeleton.html\">fournier-facio-torsion-free-skeleton</a></code> and <code>pi(S) &lt;= G</code> the injectively embedded finitely presented simple torsion-free group.  Then:</p>\n<p>1. every finite-dimensional unitary representation of <code>G</code> kills <code>pi(S)</code>, hence kills the normal closure <code>&lt;&lt;pi(S)&gt;&gt;</code>; 2. <code>G</code> is not residually finite; 3. if moreover <code>&lt;&lt;pi(S)&gt;&gt; = G</code>, then <code>G</code> is <strong>minimally almost periodic</strong> \u2014 every finite-dimensional unitary representation of <code>G</code> is trivial.</p>\n<p>Clause 3 matters out of proportion to its difficulty.  The hypothesis <code>&lt;&lt;pi(S)&gt;&gt; = G</code> is the strongest form of <code><a href=\"defect-normally-generates-torsion-free-quotient.html\">defect-normally-generates-torsion-free-quotient</a></code>, the single open prerequisite of the root's primary route.  So that one group-theoretic fact would buy <strong>two</strong> things at once: the normal Kazhdan subgroup that <code><a href=\"normal-kazhdan-defect-non-mf.html\">normal-kazhdan-defect-non-mf</a></code> consumes, and minimal almost periodicity of the source, which is exactly the hypothesis that both open analytic branches independently ask for (<code><a href=\"bounded-rank-corners-excluded.html\">bounded-rank-corners-excluded</a></code> and <code><a href=\"finite-dimensional-models-break-coordinate-generation.html\">finite-dimensional-models-break-coordinate-generation</a></code>).</p>\n<p>Clause 1 is unconditional, and it is the Fournier-Facio analogue of the manuscript's finite-dimensional shadow: no finite-dimensional model detects anything inside the normal closure of the simple factor, which contains the compression defect's simple part.</p>"}, {"id": "fournier-facio-group-matricially-stable", "status": "OPEN", "root": false, "goal": false, "title": "Matricial stability of the Fournier-Facio torsion-free group", "impact": 1, "frontier": true, "lock": null, "html": "<p>The Fournier-Facio group <code>G</code> of <code><a href=\"fournier-facio-torsion-free-skeleton.html\">fournier-facio-torsion-free-skeleton</a></code> is matricially stable: every asymptotic homomorphism <code>G -&gt; U(k_n)</code> is pointwise-norm close to a sequence of genuine homomorphisms.</p>\n<h3>Ideas</h3>\n<p>This is the analytic hypothesis of <code><a href=\"map-matricial-stability-non-mf.html\">map-matricial-stability-non-mf</a></code>, and it is the only one of the four analytic holes in this cluster that is a <em>named property with a literature</em> rather than a bespoke question.  What is known cuts both ways and should be held in view together.</p>\n<ul>\n<li><strong>For.</strong>  Higher-rank lattices are uniformly stable with respect to</li>\n<p>submultiplicative norms (Glebsky--Lubotzky--Monod--Rangarajan, arXiv:2301.00476), so Kazhdan groups are not automatically unstable, and the mechanism there is cohomological vanishing, which small-cancellation quotients of Kazhdan groups may well inherit.</p>\n<li><strong>Against.</strong>  Dadarlat, arXiv:2007.12655, Corollary 1.3: a countable</li>\n<p><strong>linear</strong> group with <code>H^{2k}(G;Q) != 0</code> for some <code>k &gt;= 1</code> is not weakly matricially stable.  <code>G</code> is not linear \u2014 it contains an infinite finitely presented simple group, hence is not residually finite (<code><a href=\"fournier-facio-group-finite-dimensional-shadow.html\">fournier-facio-group-finite-dimensional-shadow</a></code>) \u2014 so the corollary does not apply directly; but its Theorem 1.2 covers weakly quasidiagonal groups admitting a <code>gamma</code>-element, and whether <code>G</code> is in that class is unexamined.  Note the tension: if <code>G</code> were weakly quasidiagonal and had a <code>gamma</code>-element, stability would force <code>H^{2k}(G;Q) = 0</code> in all nonzero even degrees, which is a checkable consequence and a place to look for a refutation.</p>\n<li><strong>Coarse geometry unexamined.</strong>  A <code>gamma</code>-element follows from uniform</li>\n<p>embeddability in Hilbert space.  <code>G</code> is built by small cancellation over an acylindrically hyperbolic group; Gromov monsters show that small-cancellation constructions can fail coarse embeddability, but those are built from expanders and this one is not.  Nobody has checked.</p>\n</ul>\n<p>The honest summary is that this claim is neither supported nor refuted by anything currently in hand, and that it is the one hole in the cluster where a literature answer might already exist for a related group.</p>"}, {"id": "fournier-facio-torsion-free-skeleton", "status": "ESTABLISHED", "root": false, "goal": false, "title": "The Fournier-Facio torsion-free group has a simple group inside its compression defect", "impact": 2, "frontier": false, "lock": null, "html": "<p>Fournier-Facio, <em>A torsion-free non-sofic group</em> (arXiv:2608.02025, 3 August 2026), Theorem 1.3 and Section 2, constructs a <strong>finitely presented, torsion-free</strong> group <code>G</code> with property (T) together with:</p>\n<ul>\n<li><code>Gamma = pi(P) &lt;= G</code> with property (T), infinite, and</li>\n<p><code>G = &lt;Gamma, t_1, t_2&gt;</code> with <code>t_i Gamma t_i^-1 &lt;= Gamma</code>;</p>\n<li>a finitely presented simple torsion-free group <code>S</code> (Burger--Mozes or</li>\n<p>Hyde--Lodha) with <code>pi|_S</code> injective, and <code>J = t_1 pi(S) t_1^-1</code> satisfying <code>[Gamma, J] = 1</code>, <code>Gamma cap J = 1</code>, and <code>t_1 J t_1^-1 &lt;= Gamma</code>.</p>\n</ul>\n<p>Consequently <code>G</code> carries a <code>KazhdanCompressionCore</code> with <code>iota</code> the inclusion of <code>Gamma</code>, <code>t = t_1</code>, and <code>c</code> any element of <code>J</code>; and \u2014 this part is not in the paper \u2014 <strong>its compression defect contains a copy of <code>S</code></strong>:</p>\n<p>S' := t_1 J t_1^-1  is a copy of S inside Gamma, and S' &lt;= defectNormal.</p>\n<p>So the published torsion-free group already satisfies every hypothesis of <code><a href=\"normal-kazhdan-defect-non-mf.html\">normal-kazhdan-defect-non-mf</a></code> except one: the copy of <code>S</code> sitting in the defect must be enlarged to a <strong>normal</strong> subgroup of <code>G</code> with property (T). That single gap is isolated as <code><a href=\"defect-normally-generates-torsion-free-quotient.html\">defect-normally-generates-torsion-free-quotient</a></code>.</p>\n<p>The torsion-freeing device, for the record, is not one trick.  Every ingredient is chosen torsion-free from a menu that already exists \u2014 a universal finitely presented torsion-free group (Higman; Belegradek-- Szczepanski; Chiodo), a finitely presented simple torsion-free group, a torsion-free hyperbolic Kazhdan group (random groups at density) \u2014 and both gluing steps have published torsion-preservation clauses: Osin's small cancellation over relatively hyperbolic groups (Theorem 2.4.5) and Hull's common-quotient theorem (Theorem 7.1(e)).  What carried the torsion in the OpenAI example was the non-LEF witness, Thompson's <code>V</code>; Fournier-Facio replaces it by a torsion-free finitely presented simple group.</p>"}, {"id": "free-lamp-radical-is-free", "status": "ESTABLISHED", "root": false, "goal": false, "title": "The sofic radical of the free-lamp Kun--Thom group is a free group", "impact": 0, "frontier": false, "lock": null, "html": "<p>Let <code>Gamma&lt;G</code> be a Kun--Thom infranormal nonnormal Kazhdan pair, <code>K</code> a nontrivial countable residually finite group, <code>N=&lt;&lt;Gamma&gt;&gt;_G</code>, and</p>\n<pre>\nH_K = G *_Gamma (Gamma x K).\n</pre>\n<p>1. <strong>Normal form.</strong>  <code>H_K = (*_(G/Gamma) K) semidirect G</code>, the lamp at the coset <code>g Gamma</code> being <code>g k g^(-1)</code>. 2. <strong>The radical is the collapsing kernel.</strong>  <code>Rad_sof(H_K)</code> is the kernel of the natural surjection</p>\n<pre>\n   *_(G/Gamma) K  -&gt;&gt;  *_(G/N) K\n</pre>\n<p>induced by <code>G/Gamma -&gt; G/N</code>, and <code>H_K/Rad_sof(H_K) = G <em>_N (N x K)</code> embeds in <code>G x ((G/N) </em> K)</code>, which is residually finite. 3. <strong>It is free.</strong>  That kernel meets every conjugate of every free factor trivially, so it acts freely on the Bass--Serre tree of the free product and is therefore a free group.</p>\n<p>Consequently <code>H_K</code> is <strong>(free)-by-(residually finite) and not sofic</strong>: an extension with a free kernel and a residually finite quotient, whose whole failure of soficity is carried by the action of <code>G</code> on that free kernel, not by any pathology of the kernel itself.  The nonsoficity is immediate from <code><a href=\"sofic-radical-soficization.html\">sofic-radical-soficization</a></code> once the radical is nontrivial, which holds exactly when <code>Gamma</code> is not normal.</p>"}, {"id": "full-packet-bicommutant-synchronization", "status": "OPEN", "root": false, "goal": false, "title": "Synchronize every raw-packet commutant symmetry with the transported carrier", "impact": 1, "frontier": true, "lock": null, "html": "<p>For every trace-preserving finite matrix microstate of the fixed atlas presentation, after exactifying the raw finite packet <code>K</code>, prove uniformly for coordinate unitaries <code>V_n in Alg(rho_n(K))'</code> that</p>\n<pre>\n||[V_n,F_n]||_2 -&gt; 0,\n</pre>\n<p>where <code>F_n</code> is the comb-transported Pauli carrier.  The proof must use the cross-root multiplication and compressor synchronization relations; the regular representation shows that no abstract finite-von-Neumann-algebra bicommutant theorem can suffice.</p>"}, {"id": "full-raw-packet-commutant-witness", "status": "ESTABLISHED", "root": false, "goal": false, "title": "One full-raw-packet commutant unitary witnesses the Pauli gap", "impact": 1, "frontier": false, "lock": null, "html": "<p>Let <code>K=&lt;raw,z_11,z_001&gt;</code> be the sixteen-element raw Pauli packet, let <code>A_n=Alg(rho_n(K))</code> in a trace-preserving finite matrix microstate, and let <code>F_n</code> be the transported trace-<code>1/4</code> carrier.  Then</p>\n<pre>\ndist_2(F_n,A_n)^2 -&gt; 3/16.\n</pre>\n<p>Haar averaging over <code>U(A_n')</code> therefore supplies a coordinate unitary <code>V_n</code> with</p>\n<pre>\n[V_n,A_n]=0,\n||[V_n,F_n]||_2^2 &gt;= 3/8-o(1).\n</pre>\n<p>After doubling, <code>V_n</code> may be chosen as a self-adjoint involution without changing the energy.</p>"}, {"id": "glebsky-fin-case-instantiation", "status": "ESTABLISHED", "root": false, "goal": false, "title": "In the Fin case the separated sets are finite-window projections, and the generic length is forced", "impact": 0, "frontier": false, "lock": null, "html": "<p>Read from arXiv:1506.06940v2 (J. Algebra 477 (2017) 147--162) on 2026-08-14, answering <code>cairn-survivor</code>'s question whether the construction's freedom reaches into the finite sub-product where they have localized the problem.</p>\n<h3>The hypothesis of Corollary 19 is free for <code>Fin</code></h3>\n<p>Corollary 19 needs <code>K subset of Fin</code> with <code>K.approx = (prod K).approx</code>, where <code>prod K</code> adjoins finite direct products.  For <code>K = Fin</code> that is automatic: finite direct products of finite groups are finite, so <code>prod Fin = Fin</code>. Corollary 6 records the same conclusion from the compactness side (\"it is true for <code>K = Nil, Sol, Fin</code>, or class of all compact groups\"), and line 67 of the paper fixes the terminology: \"<code>Fin</code>-approximable groups are called weakly sofic\".</p>\n<h3>The two sets are finite-window projections</h3>\n<p>Proposition 5 is where the approximation is produced.  Let <code>X</code> be a closed subgroup of <code>prod_(i in N) H_i</code> with each <code>Pr_i(X) in K</code>, and <code>N</code> normal in <code>X</code>; then <code>X/N</code> is <code>prod K</code>-approximable.  Its proof, given finite <code>Phi</code> in <code>X</code> and <code>n</code>:</p>\n<pre>\nPhi_N = Phi \u2229 N,      Phi_0 = Phi \\ N,      C_n(Phi_N, X) \u2229 Phi_0 = \u2205\n</pre>\n<p>(the intersection is empty because <code>C_n(Phi_N,X)</code> lies in <code>N</code>, <code>N</code> being normal).  Compactness of <code>C_n(Phi_N,X)</code> gives an open <code>U</code> containing <code>Phi_0</code> disjoint from it, and hence some <code>k</code> with</p>\n<pre>\nC_n(Pr_1^k(Phi_N), Pr_1^k(X)) \u2229 Pr_1^k(Phi_0) = \u2205.\n</pre>\n<p>So the approximating homomorphism is the <strong>finite-window projection</strong> <code>Pr_1^k : X -&gt; Pr_1^k(X)</code>, and feeding this into Lemma 3:</p>\n<pre>\nH  =  Pr_1^k(X)              the finite window\nX  =  Pr_1^k(Phi \u2229 N)        the ERROR set   -&gt; length 1/n\nY  =  Pr_1^k(Phi \\ N)        the SEPARATED set -&gt; length 1\n</pre>\n<p><strong>The freedom reaches into the finite sub-product because the construction lives there.</strong>  What is <em>not</em> free: given <code>Phi</code> (forced by the test) and <code>n</code>, the error set is determined as <code>Pr_1^k(Phi \u2229 N)</code>, and the length is then the capped conjugate-word-length of <code><a href=\"glebsky-manufactured-invariant-length.html\">glebsky-manufactured-invariant-length</a></code> in that set.  The genuinely free parameters are <code>n</code> and <code>k</code> (<code>k</code> may always be enlarged).  So the design problem is not \"choose a length\" but \"compute the character expansion of a determined one, as <code>n,k</code> vary\".</p>\n<h3>Why <code>Fin</code> gets the generic length and soficity does not</h3>\n<p>For <code>K = Alt</code> or <code>Sym</code> the paper does <strong>not</strong> use Lemma 3's construction at all.  It uses the normalized Hamming length (Definition 8, <code>H</code> = the class of normalized Hamming length functions) together with two <code>Alt</code>-specific tools:</p>\n<p>&gt; <strong>Lemma 10.</strong> Let <code>A</code> be an alternating group, <code>X</code> in <code>A</code> and &gt; <code>y</code> not in <code>C_n(X,A)</code>.  Then <code>||y||/||x|| &gt;= (n-1)/16</code> for any <code>1 != x in X</code>.</p>\n<p>whose proof is \"a manifestation of the fact that in a finite simple group powers of a conjugacy class cover the group 'almost as fast as possible'\"; and <strong>Lemma 11</strong>, the amplification trick <code>h |-&gt; h^(\u2297r)</code> on <code>[m]^r</code> with <code>1 - ||h^(\u2297r)|| = (1 - ||h||)^r</code>, which boosts separation to <code>||psi(y)|| &gt;= 1/2</code> while keeping <code>||psi(x)|| &lt; 1 - (1/4)^(1/n)</code>.</p>\n<p><strong>Lemma 10 has no analogue for general finite groups</strong> \u2014 its proof consumes simplicity.  That is why weak soficity must fall back on the generic capped conjugate-word-length: the genericity is forced, not incidental.</p>\n<p><code>[MY INFERENCE]</code> This is a concrete form of the sofic/weakly-sofic gap, and it lines up with the Hilbert-embeddability criterion exactly:</p>\n<ul>\n<li><strong>sofic</strong>: the length is Hamming on <code>A_m</code>, which is Hilbert embeddable \u2014</li>\n<p>recovering <code>sofic implies hyperlinear</code>;</p>\n<li><strong>weakly sofic</strong>: the length is a capped conjugate-word-length on an</li>\n<p>arbitrary finite group, with no covering theorem available to convert it into Hamming-comparable data.</p>\n</ul>\n<p>Glebsky's own remark in the 2023 paper \u2014 \"not all bi-invariant metric on a finite group is a restriction of a corresponding Hamming metric\" \u2014 is the abstract shadow of this concrete asymmetry: Lemma 10 is precisely the tool that would perform such a conversion, and it exists only for simple groups.</p>\n<h3>Note on separation, correcting an earlier reading</h3>\n<p>In the <code>Alt</code> case separation <code>&gt;= 1/2</code> is achieved by <strong>amplification</strong> (Lemma 11), not by truncation.  The truncation-is-the-separation-mechanism observation on <code><a href=\"glebsky-manufactured-invariant-length.html\">glebsky-manufactured-invariant-length</a></code> is correct for the generic Lemma 3 construction, hence for <code>Fin</code>, but it is not how the sofic case gets its separation.  Both statements stand in their own case.</p>"}, {"id": "glebsky-hs-transport-step-classification", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Which steps of Glebsky's permanence proof survive normalized-HS transport", "impact": 0, "frontier": false, "lock": null, "html": "<p>Step classification of Glebsky, arXiv:1910.08631 (published as Rev. Mat. Iberoam. 39 (2023) 1097\u20131104), read in full from the PDF 2026-08-14. Type (a) = works for any approximation class closed under subgroups and residual limits; type (b) = needs the class to be <code>Fin</code>.</p>\n<p>1. <strong>(a) Kaluzhnin\u2013Krasner.</strong> <code>K</code> RF-by-RF <code>\u27f9 K \u2264 H \u2240 G</code>, the <strong>unrestricted</strong> wreath product <code>H^G \u22ca G</code>. Survives: hyperlinearity passes to subgroups. Worth noting on its own \u2014 for <code>H</code> finite and <code>G</code> infinite this group is <em>amenable-by-sofic</em>, which Elek\u2013Szab\u00f3's sofic-by-amenable theorem does not cover, and its soficity is the open question Glebsky's \u00a77 leaves open. 2. <strong>(a) Residual reduction.</strong> <code>H</code> RF <code>\u27f9 H \u2240 G</code> residually <code>{H_i \u2240 G}</code> with <code>H_i</code> finite; residually-\ud835\udc9e <code>\u27f9</code> \ud835\udc9e. Survives: approximability is a local property, so residually hyperlinear implies hyperlinear. 3. <strong>(b) The characterization</strong> <code>K</code> weakly sofic <code>\u27fa</code> every <code>w\u0304 \u2208 Sys(Fin)</code> solvable over <code>K</code>. This is Corollary 19 of arXiv:1506.06940, whose stated hypothesis is <code>K \u2286 Fin</code>, and whose engine is that paper's Lemma 3. 4. <strong>(b) The universal solution (Lemma 4).</strong> <code>X_N \u2260 \u2205</code> because <code>D_N \u22ca G_N</code> is a <strong>finite</strong> group in which <code>w\u0304 \u2208 Sys(Fin)</code> is solvable; then <code>X = lim_\u2190 X_N</code> is nonempty by compactness of an inverse limit of nonempty <strong>finite</strong> sets. 5. <strong>(a) Locality (Lemma 5).</strong> <code>\u03c8(x) = \u03c8\u0303(x_\u03b3)</code> whenever <code>x\u00b7Suf(p)(\u1fb1) \u2286 T_\u03b3</code>. Purely combinatorial; survives verbatim. 6. <strong>(a) Tychonov limit (Lemma 6).</strong> Survives verbatim; the only compactness used is that <code>H^\u0393</code> is compact for <code>H</code> finite.</p>\n<p><strong>Step 4 provably does not transport.</strong> For a hyperlinear analogue the system class is <code>Sys(\ud835\udcb0)</code> = systems solvable in every <code>U(n)</code>, and the step would need <code>w\u0304 \u2208 Sys(\ud835\udcb0) \u27f9 w\u0304</code> solvable in the finite group <code>D_N \u22ca G_N</code>. Take <code>w\u0304</code> to be <code>x\u00b2a\u207b\u00b9</code>: every unitary has a square root, so <code>w\u0304 \u2208 Sys(\ud835\udcb0)</code>, but <code>w\u0304</code> fails in <code>\u2124/2</code> with <code>a</code> the nontrivial element, and <code>\u2124/2</code> is a quotient of <code>D_N \u22ca G_N</code> when the lamp is <code>\u2124/2</code>. More generally Gerstenhaber\u2013Rothaus puts every system with nonsingular exponent matrix in <code>Sys(\ud835\udcb0)</code>, and such systems routinely fail in finite groups. The conclusion is about the <em>method</em>, not about <code>W</code>: the system <code>x\u00b2=a</code> is solvable over every group by Higman\u2013Neumann\u2013Neumann.</p>\n<p>This is the same failure, at the same step, that Glebsky records for the sofic case in his \u00a77: <em>\"The problem is that solvability in permutation groups is not enough to prove, say, the existence of universal solutions.\"</em> Soficity and hyperlinearity are blocked identically here, so nothing about the difficulty is special to unitaries.</p>\n<p><strong>Calibration: the neighbouring metric analogue is false.</strong> Glebsky's own reference [6] is De Chiffre\u2013Glebsky\u2013Lubotzky\u2013Thom arXiv:1711.10238, which exhibits a <strong>residually-finite-by-finite</strong> group that is not approximable by <code>U(n)</code> in the <strong>Frobenius</strong> (unnormalized Hilbert\u2013Schmidt) norm. They state verbatim: <em>\"Our techniques do not apply directly to the context of (iii) [the normalized Hilbert\u2013Schmidt norm], so we cannot say anything conclusive about Connes' Embedding Problem.\"</em> So Theorem 1 is false for the nearest neighbouring metric class and open for the normalized one; it is not metric-robust, and no argument may treat \"some invariant metric\" and \"the HS metric\" as interchangeable.</p>"}, {"id": "glebsky-manufactured-invariant-length", "status": "ESTABLISHED", "root": false, "goal": false, "title": "The invariant length Glebsky manufactures is a truncated rescaled conjugation-invariant word metric", "impact": 1, "frontier": false, "lock": null, "html": "<p>The last import debt on the weak-soficity thread.  <code><a href=\"weakly-sofic-not-sofic.html\">weakly-sofic-not-sofic</a></code> and <code><a href=\"glebsky-weak-soficity-is-metric-free.html\">glebsky-weak-soficity-is-metric-free</a></code> both bottom out in Glebsky, <em>Approximations of groups, characterizations of sofic groups, and equations over groups</em>, J. Algebra 477 (2017) 147--162, arXiv:1506.06940v2, Corollary 19.  Read from the PDF 2026-08-14.</p>\n<h3>The architecture is deliberately metric-free, with one bridge</h3>\n<p>Glebsky says so in his introduction: \"In the present article we investigate the notion of approximation based on products of conjugacy classes without direct use of length functions, see Definition 6.\"</p>\n<p><strong>Definition 6 (<code>K</code>-approximable, no metric).</strong>  <code>G</code> is <code>K</code>-approximable if for every finite <code>Phi</code> in <code>G</code> and every <code>n</code> there are <code>H in K</code> and <code>phi:Phi-&gt;H</code> with <code>phi(1)=1</code> such that <code>phi(Phi minus {1})</code> is <em><code>n</code>-separated</em> from <code>{phi(g)phi(h)(phi(gh))^(-1)}</code>, where <code>Y</code> is <code>n</code>-separated from <code>X</code> when <code>Y</code> misses the set of <code>n</code>-consequences of <code>X</code>.</p>\n<p><strong>Corollary 19.</strong>  \"Let <code>K</code> subset of <code>Fin</code> and <code>K.approx = (prod K).approx</code>. Then a group <code>G</code> is <code>K</code>-approximable if and only if any <code>K</code>-system is solvable over <code>G</code>.\"</p>\n<p>So the equation-solvability characterization is agnostic to metrics throughout.  Metrics enter only through:</p>\n<h3>Lemma 3 \u2014 the actual construction</h3>\n<p>Given <code>X,Y</code> in a group <code>H</code> with <code>Y</code> <code>n</code>-separated from <code>X</code>:</p>\n<pre>\nX^H := {x^h : x^(\u00b11) in X, h in H}          (conjugation closure of X \u222a X^-1)\nd    := shortest-path metric on the Cayley graph Gamma(H, X^H),\n        with d = infinity if no path exists\n||h|| := min{ (1/n) d(1,h), 1 }\n</pre>\n<p>Glebsky: this \"defines an invariant length function on <code>H</code> such that <code>||x||=1/n</code> for <code>x in X</code> and <code>||y||=1</code> for <code>y in Y</code>\", and \"one may convert a <code>K</code>-approximation into a <code>(K,L)</code>-approximation where <code>L</code> consists of the above constructed length functions\".</p>\n<p><strong>So the manufactured metric is a word metric with respect to a conjugation-invariant generating set, rescaled by <code>1/n</code> and truncated at 1.</strong> Nothing more exotic.  Invariance is exactly conjugation-invariance of the generating set <code>X^H</code>; the truncation is what keeps it bounded by 1 and what supplies the separation <code>||y||=1</code>.</p>\n<p>For orientation, his Definition 2 of invariant length is the pseudo-length of Thom (<em>About the metric approximation of Higman's group</em>): <code>||gh|| &lt;= ||g|| + ||h||</code> and <code>||h^(-1)gh|| = ||g||</code>; and Proposition 1 records the standard fact that <code>(K,L)</code>-approximability is embeddability in a metric ultraproduct of groups from <code>K</code> with lengths from <code>L</code>.</p>\n<h3>The length is a <em>capped conjugate-word-length in the error set</em></h3>\n<p>Definition 5 makes the Cayley-graph distance explicit:</p>\n<pre>\nC_n(X,G) = {x_1^(g_1) x_2^(g_2) ... x_n^(g_n) | x_i^(\u00b11) in X, g_i in G}\n</pre>\n<p>\u2014 the <em><code>n</code>-consequences</em> of <code>X</code> \u2014 and <code>Y</code> is <code>n</code>-separated from <code>X</code> when <code>Y \u2229 C_n(X,G)</code> is empty.  Since <code>X^H</code> generates by conjugates of <code>X^(\u00b11)</code>, the word length <code>|h|</code> in <code>Gamma(H,X^H)</code> is at most <code>k</code> exactly when <code>h in C_k(X,H)</code>.  So the manufactured length is</p>\n<pre>\n||h|| = min{ |h|_(X^H) / n , 1 },     |h|_(X^H) &lt;= k  &lt;=&gt;  h in C_k(X,H),\n</pre>\n<p>and <code>n</code>-separation of <code>Y</code> from <code>X</code> is <em>precisely</em> the statement that every <code>y in Y</code> has <code>|y| &gt; n</code>, hence <code>||y|| = 1</code>.</p>\n<p>Two structural consequences, both important:</p>\n<p>1. <strong>Separation is achieved by the truncation, and by nothing else.</strong>  The <code>(Phi,1/2,eps)</code> separation demanded by weak soficity (Definition 2.3 of the 2023 paper) is met with room to spare \u2014 the construction gives <code>||y|| = 1</code>, not <code>1/2</code> \u2014 and it is met <em>because</em> the cap at 1 converts \"far in the Cayley graph\" into \"length exactly 1\".  The truncation is not a technical convenience that could be dropped or smoothed; it is the separation mechanism. 2. <strong>Given the approximation, the length is canonical \u2014 the freedom is upstream.</strong>  In Definition 6 the two sets are not free-floating: <code>X</code> is the <em>error set</em> <code>{phi(g)phi(h)(phi(gh))^(-1)}</code> and <code>Y</code> is <code>phi(Phi minus {1})</code>, the images of the elements to be separated.  The length depends only on <code>(X,n)</code>; <code>Y</code> never enters its definition, and serves only to certify <code>||y||=1</code> through the <code>n</code>-separation hypothesis.  So one does not choose a length for a given approximation \u2014 one chooses the approximation <code>phi</code> and the parameter <code>n</code>, and the length follows as the capped conjugate-word-length in that approximation's error set.</p>\n<h3>What this hands to the Hilbert-embeddability test</h3>\n<p><code>[MY INFERENCE \u2014 flagged, not from the paper]</code></p>\n<p>1. <strong>The test is now concrete.</strong>  For a finite <code>H</code>, <code><a href=\"hilbert-embeddable-length-hyperlinearity.html\">hilbert-embeddable-length-hyperlinearity</a></code> asks whether <code>(a,b) |-&gt; ||a^(-1)b||</code> is conditionally negative definite, equivalently whether every nontrivial irreducible has a nonpositive coefficient in the character expansion of <code>||.||</code>.  The length to test is the one displayed above. 2. <strong>The truncation is a red herring \u2014 SUPERSEDED by <code>cairn-bernoulli</code>.</strong> I originally wrote that the cap is the separation mechanism and therefore cannot be dropped.  That is right about <em>Glebsky's</em> length but wrong as a constraint on the problem, because one is not obliged to use his length. <code>cairn-bernoulli</code> observed that</p>\n<pre>\n   l&#x27;(h) = 1 - exp( - d(1,h) / n )\n</pre>\n<p>has the same profile \u2014 about <code>1/n</code> on the defect set where <code>d=1</code>, and at least <code>1 - e^(-1) &gt; 0.63</code> on the <code>n</code>-separated targets where <code>d&gt;n</code>, with the separation constant uniform in <code>n</code> \u2014 and is conditionally negative definite whenever <code>d</code> is, by Schoenberg.  It is a legitimate invariant length: <code>t |-&gt; 1-e^(-t/n)</code> is concave, increasing and vanishes at 0, so it preserves subadditivity.  <strong>So nobody needs to test <code>min{.,1}</code>, and the real question is whether the untruncated conjugation-invariant word metric <code>d</code> is conditionally negative definite.</strong>  (Positive scalar multiples preserve the property, so <code>1/n</code> was never at issue.)</p>\n<p>Two refinements from <code>cairn-survivor</code> finish this off.  The cap cannot be <em>deleted</em> \u2014 that would leave an unbounded length \u2014 but <code>1-e^(-t)</code> is a Bernstein function where <code>min{t,1}</code> is not, the two profiles agree within absolute constants (<code>(1-e^(-1))min(t,1) &lt;= 1-e^(-t) &lt;= min(t,1)</code>), so the replacement transports conditional negative definiteness from <code>d</code>.  And their amplification theorem \u2014 <code>e^(-l) = tr(rho)</code> gives <code>e^(-r l) = tr(rho^(\u2297r))</code>, so <code>1-e^(-r l)</code> is the length of the <code>r</code>-th tensor power \u2014 makes any fixed positive separation amplify to <code>1-o(1)</code>. So the separation constant <code>1/2</code> carries no content in the Hilbert embeddable category, and Lemma 10's simplicity-based covering theorem (see <code><a href=\"glebsky-fin-case-instantiation.html\">glebsky-fin-case-instantiation</a></code>) does work that is not needed there. 3. <strong>The freedom is real but sits upstream of the length.</strong>  There is no such thing as \"<em>the</em> Glebsky length\", so the question \"is it Hilbert embeddable\" has no answer as posed.  But neither is the length freely choosable: it is determined by the approximation's error set <code>X</code> and the parameter <code>n</code>.  The well-posed question is therefore</p>\n<p>&gt; can the approximation <code>phi</code> and the parameter <code>n</code> be chosen so that the &gt; capped conjugate-word-length <code>min{|.|_(X^H)/n, 1}</code> in the resulting &gt; error set <code>X</code> is Hilbert embeddable, with defect tending to zero and &gt; separation bounded below uniformly along the sequence?</p>\n<p>This matches the shape <code>cairn-survivor</code> derived independently \u2014 small on the error set (<code>||x||=1/n</code>), at least <code>1/2</code> on the lifts (<code>||y||=1</code>) \u2014 so their design problem <em>is</em> Glebsky's construction, with <code>X</code> and <code>Y</code> constrained to lie inside the relevant preimage. 4. <strong>Glebsky's own framing supports looking at conjugacy classes.</strong>  He notes that \"the structure of the set of invariant length functions on a group depends on the algebra of the conjugacy classes of this group\" \u2014 which is precisely the character-theoretic setting the Hilbert-embeddability criterion works in.</p>\n<h3>Two findings from <code>cairn-bernoulli</code>, recorded here because they bear on this length</h3>\n<p><strong>Glebsky's length is pointwise maximal among admissible ones.</strong>  Any invariant length with <code>l &lt;= 1/n</code> on <code>X</code> satisfies <code>l(x_1^(g_1) ... x_k^(g_k)) &lt;= k/n</code> by subadditivity and conjugation-invariance, hence <code>l &lt;= d(1,.)/n</code> everywhere.  So he takes the best separator \u2014 which is also the one with the least reason to be conditionally negative definite.  Any repair must go strictly below it, and going below costs separation.  That tension, not the cap, is the real problem.</p>\n<p><strong>The graph's own calibrating counterexample already lives in this family, and I verified the computation independently.</strong>  <code><a href=\"hilbert-embeddable-length-hyperlinearity.html\">hilbert-embeddable-length-hyperlinearity</a></code> records that the <code>F_2</code>-rank length on <code>GL_2(F_2)</code> is not Hilbert embeddable. That length <em>is</em> a conjugation-invariant word metric: <code>GL_2(F_2) = S_3</code>, and <code>rank(g-1)/2</code> is half the word metric of the transposition class, so <code>d = 0</code> on the identity, <code>1</code> on the three transpositions, <code>2</code> on the two 3-cycles.  Writing <code>d = a + b\u00b7sgn + c\u00b7chi</code> with <code>chi</code> the 2-dimensional character (<code>chi(e)=2</code>, <code>chi(tau)=0</code>, <code>chi(sigma)=-1</code>) gives <code>a+b+2c=0</code>, <code>a-b=1</code>, <code>a+b-c=2</code>, hence <code>c=-2/3</code>, <code>a=7/6</code>, and</p>\n<pre>\nb = +1/6  &gt; 0   on the sign character.\n</pre>\n<p>So the smallest nonabelian instance of exactly this shape already fails. Cyclic groups are safe \u2014 <code>min{k, m-k}</code> on <code>Z/m</code> has nonpositive coefficients at every nontrivial character \u2014 so the failure is genuinely nonabelian. This is not fatal to the programme: by the maximality point above, the failing length is only the <em>endpoint</em> of the interval of admissible lengths, and <code>cairn-bernoulli</code> has reduced the search over that interval to a finite linear program (<code><a href=\"hilbert-embeddable-length-lp-feasibility.html\">hilbert-embeddable-length-lp-feasibility</a></code>), whose constraints \u2014 vanishing at 1, nonnegativity, subadditivity, the bounds on the defect and target sets, and nonpositivity of every nontrivial character coefficient \u2014 are all linear in the class function.</p>"}, {"id": "glebsky-weak-soficity-is-metric-free", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Glebsky's weak-soficity permanence produces no metric \u2014 the witness is algebraic", "impact": 0, "frontier": false, "lock": null, "html": "<p>Extraction requested by <code>cairn-survivor</code> and performed 2026-08-14 from the published PDF of Glebsky, <em>Extensions of a residually finite group by a weakly sofic group are weakly sofic</em>, Rev. Mat. Iberoam. 39 (2023), no. 3, 1097--1104, doi:10.4171/RMI/1368.</p>\n<p><strong>Finding: the proof of Theorem 1.1 never constructs a metric.</strong> There is no sequence of finite groups carrying bi-invariant metrics anywhere in it.  The argument runs entirely on the algebraic side of</p>\n<p>&gt; <strong>Lemma 1.2.</strong> Let <code>K</code> be a group.  The following are equivalent: &gt; 1) <code>K</code> is weakly sofic; &gt; 2) every system of equations solvable in all finite groups is solvable &gt;    over <code>K</code>; &gt; 3) <code>K</code> is a subgroup of a quotient of a direct product of finite groups. &gt;    (The direct product may be uncountable.)</p>\n<p>Theorem 1.1 is proved by: Krasner--Kaloujnine to embed the extension in the unrestricted wreath product <code>H wr G</code>; Lemma 1.2 to write <code>H &lt; H~/M</code> with <code>H~</code> a direct product of finite groups; Theorem 1.3 to solve <code>w(a~,y~)=1</code> in <code>H~ wr G^</code> (<code>G^</code> the profinite completion); then push the solution forward.  This shows every <code>w in Sys(Fin)</code> is solvable over <code>H wr G</code>, and weak soficity follows by Lemma 1.2 <strong>(2) implies (1)</strong>.</p>\n<p><strong>The metric-bearing step is quarantined and imported.</strong>  Direction (2) implies (1) is the only place a metric can enter, and it is black-boxed: \"by [6], every finitely generated subgroup of <code>K</code> is weakly sofic\", where [6] is Glebsky, <em>Approximations of groups, characterizations of sofic groups, and equations over groups</em>, J. Algebra 477 (2017), 147--162 (Corollary 19 there, specialized to the class of finite groups).  Anyone wanting an explicit metric must read that paper, not this one.</p>\n<p><strong>The definition prescribes nothing either.</strong>  Definition 2.3: <code>G</code> is weakly sofic if for every finite <code>Phi</code> containing 1 and every <code>eps&gt;0</code> there is a <code>(Phi,1/2,eps)</code>-homomorphism into <em>a finite group with a bi-invariant metric</em> \u2014 an arbitrary such metric, with separation constant <code>1/2</code>.  So even at the level of the definition there is no canonical length to expand in characters.</p>\n<p><strong>Glebsky states the sofic-versus-weakly-sofic crux in metric-distortion terms himself</strong>, immediately after Definition 2.3:</p>\n<p>&gt; \"The other inclusion is an open question: although all finite groups are &gt; embeddable into finite symmetric groups, not all bi-invariant metric on a &gt; finite group is a restriction of a corresponding Hamming metric.\"</p>\n<p>That is the exact shape of the hyperlinear question one class over: the obstruction is not the finite groups but which lengths on them are induced from the target geometry.</p>\n<h3>Consequences for the Kun--Thom wreath</h3>\n<p>1. <strong>The general witness simplifies.</strong>  For <code>W=(directSum_(G/Gamma) Z/2) semidirect G</code> the kernel <code>H=directSum_(G/Gamma) Z/2</code> is already a subgroup of the direct product <code>prod_(G/Gamma) Z/2</code> of finite groups, so <code>M=1</code> and <code>H~=prod_(G/Gamma) Z/2</code>.  The witness is <code>W &lt;= H wr G ,-&gt; (prod_(G/Gamma) Z/2) wr G</code>, with the work being solvability of <code>Sys(Fin)</code> over it. 2. <strong>The quotient in Lemma 1.2(3) is essential, and the source confirms it.</strong> A <em>subgroup</em> of a direct product of finite groups is residually finite, hence sofic; since <code>W</code> is not sofic, its witness must genuinely use the quotient.  This independently confirms the \"no finite-quotient witness\" constraint already recorded on <code><a href=\"hilbert-embeddable-witness-for-kun-thom-wreath.html\">hilbert-embeddable-witness-for-kun-thom-wreath</a></code>. 3. <strong>Only the \"some length\" form of the question is well posed.</strong>  Because no length is produced, one cannot ask whether <em>Glebsky's</em> length has nonpositive character coefficients.  The answerable question is whether the lengths on the finite factors can be <em>chosen</em> Hilbert embeddable so that the induced length on the quotient still separates the mark, with defect tending to zero and separation bounded below uniformly along the sequence.  That freedom is favourable, not an obstruction.</p>"}, {"id": "gohla-thom-stable-base-nonsofic-extension", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Gohla--Thom \u2014 cosystolic base stable in finite actions forces a nonsofic central extension", "impact": 0, "frontier": false, "lock": null, "html": "<p><strong>Primary source, read from the PDF (2026-08-14):</strong> Gohla--Thom, <em>High-dimensional expansion and soficity of groups</em>, arXiv:2403.09582v2. The main result is their <strong>Theorem 3.13</strong>, not \"Theorem 1.5\" (that number belongs to the secondary source Chapman--Dikstein--Lubotzky, arXiv:2410.02913, where it appears as a corollary specialized to the p-adic Deligne extension).</p>\n<p>&gt; <strong>Theorem 3.13.</strong> Let <code>Gamma</code> be a countable discrete group and <code>A</code> be a &gt; finite abelian group.  Assume the following conditions: &gt; (i) <code>Gamma</code> is residually finite and of finite type, &gt; (ii) <code>Gamma</code> satisfies a co-systolic inequality for all finite transitive &gt; actions with coefficients in <code>A</code> and dimension 2, &gt; (iii) there exists a central extension <code>Gamma~</code> of <code>Gamma</code> by <code>A</code> which is &gt; not residually finite. &gt; Then, the following implication holds: If <code>Gamma</code> is stable in finite &gt; actions, then the group <code>Gamma~</code> is not sofic.</p>\n<p><strong>The stability notion is their own and is very weak.</strong></p>\n<p>&gt; <strong>Definition 3.7.</strong> We say that a group <code>Gamma</code> is <em>stable in finite &gt; actions</em> if the limit action of any sofic approximation is weakly contained &gt; in the family of finite <code>Gamma</code>-actions.  Equivalently, the limit action of &gt; any sofic approximation of <code>Gamma</code> is contained in a metric ultraproduct of &gt; finite <code>Gamma</code>-actions.</p>\n<p>They note that any weakly flexibly stable group is stable in finite actions (Lemma 3.6 and the following remark), and describe the notion as \"much weaker than any other notion of stability that has been studied so far\".  It is a <strong>permutation/Hamming</strong> notion throughout \u2014 no Hilbert--Schmidt variant is involved anywhere in the paper.</p>\n<p><strong>Proof engine.</strong> Let <code>alpha in H^2(Gamma,A)</code> classify <code>Gamma~</code>.  If <code>Gamma~</code> is sofic with limit action <code>Q</code> and <code>P=Q^A</code> the induced limit <code>Gamma</code>-action, then <code>theta_*^P(alpha)=0</code> by their Theorem 3.4; if <code>Gamma</code> is stable in finite actions then <code>P</code> is weakly contained in finite actions and <code>theta_*^P(alpha)!=0</code> by their Theorem 2.16.  Contradiction.  <strong>Theorem 2.16 is where hypothesis (ii) is consumed</strong> \u2014 the cosystolic inequality is what makes the cohomological obstruction non-vanishing on finite actions.</p>\n<p><strong>Hypothesis (ii) is the whole content and is not generic.</strong> It is supplied for torsionfree lattices in <code>PSp_(2d)(Q_p)</code>, <code>d&gt;=4</code> and <code>p</code> large, by the high-dimensional expansion results of Kaufman--Kazhdan--Lubotzky and Evra--Kaufman for the quotient of the Bruhat--Tits building; hypothesis (iii) is Deligne's non-residually-finite central extension.  A group with no such geometry has no reason to satisfy (ii).</p>\n<h3>The tempting general statement is FALSE</h3>\n<p>Chapman--Dikstein--Lubotzky, arXiv:2410.02913, state and refute it directly:</p>\n<p>&gt; \"It is very tempting to try to prove that in a situation like (1.1), if &gt; <code>Gamma</code> is stable, then also its finite central extension <code>Gamma~</code>.  This &gt; would imply immediately that <code>Gamma~</code> is non-sofic, as sofic stable groups &gt; are residually finite [GR09].  In Section 4, we will show that this does not &gt; hold in general: We present an exact sequence similar to (1.1), where &gt; <code>Gamma</code> is replaced by some other group (the lamplighter group), which is &gt; stable [LL22], but the central extension there is non-stable.  The example &gt; there is finitely generated but infinitely presented \u2014 see Section 4.  We do &gt; not know if this is possible with finitely presented groups.\"</p>\n<p>So <strong>stability does not pass from a base to its central extension</strong>, and the finitely presented case is explicitly open.  That gap is precisely why Gohla--Thom need the cohomological machinery at all.</p>"}, {"id": "haagerup-t-exclusion", "status": "ESTABLISHED", "root": false, "goal": false, "title": "(T)-compatibility excludes Haagerup carriers", "impact": 0, "frontier": false, "lock": null, "html": "<p>A carrier must contain <code>L(\u0393)</code> for <code>\u0393</code> Kazhdan \u2014 a diffuse (T) factor. A von Neumann algebra with the Haagerup property contains no diffuse (T) subalgebra, so free group factors and free-probability carriers built from them are excluded, however Connes-embeddable they are. Three candidate witnesses in a row satisfied the compression requirement and failed a different one (no (T); wrong overlap structure; Haagerup).</p>"}, {"id": "half-space-tail-no-go", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Half-space tensor models die in the tail", "impact": 0, "frontier": false, "lock": null, "html": "<p><code>centralized_mem_iterate</code> (formalized) plus tail triviality. If the compressor centralizes <code>F \u2264 \u0393</code> then <code>F \u2264 \u03c6\u207f(\u0393)</code> for all <code>n</code>; for a half-space tensor construction any <code>\u03b3 \u2208 \u22c2\u2099 \u03c6\u207f(\u0393)</code> has <code>\u03c1(\u03b3)</code> in the tail <code>= \u2102</code>, contradicting <code>\u03c4(\u03c1(\u03b3)) = 0</code>.</p>\n<p>Scope, corrected: the half-space hypothesis is essential. Splitting off the constants puts them on the two-sided diagonal (shift-invariant, not in the tail) and leaves <code>\u22c2_w \u03c6_w(\u0393(\ud835\udd2a)) = 1</code> for two compressors. This rules out half-space towers, NOT all tensor models.</p>"}, {"id": "halo-locally-sofic-target-collapse", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Halo witnesses with locally sofic targets collapse to sofic-class witnesses", "impact": 0, "frontier": false, "lock": null, "html": "<p>If an automorphism action has Alekseev--Bradford witnesses whose target groups are <strong>locally sofic</strong>, then it is already a sofic sofic-action in their sense.</p>\n<p>Consequently, for the Kun--Thom coset action, no witness with locally sofic targets exists at all:</p>\n<pre>\nthe Kun--Thom action has no locally-sofic target witnesses.      (HAA5)\n</pre>\n<h3>Which targets this covers</h3>\n<p>Every alphabet one would naturally reach for when trying to enrich a halo witness:</p>\n<ul>\n<li><strong>finite-dimensional unitary labels.</strong> Every finitely generated subgroup of</li>\n<p><code>U(n)</code> is a finitely generated linear group, hence residually finite by Malcev, hence sofic. So <code>U(n)</code> is locally sofic.</p>\n<li><strong>Pauli and Clifford labels.</strong> Finite Clifford groups are finite.</li>\n<li><strong>direct products and matrix amplifications</strong> of the above, which do not</li>\n<p>change the conclusion at any fixed finite action test.</p>\n</ul>\n<p>So the \"richer labels\" idea is not merely blocked; the labels are not richer.</p>\n<h3>Consequence</h3>\n<p>Both factors of <code>W = (directSum_(G/Gamma) C_2) semidirect G</code> are sofic \u2014 the lamp group is locally finite and <code>G</code> is residually finite. If the Kun--Thom action admitted witnesses of this kind, Alekseev--Bradford's semidirect-product theorem for the sofic class would make <code>W</code> sofic, contradicting <code><a href=\"wreath-not-sofic.html\">wreath-not-sofic</a></code>. Hence <code>(HAA5)</code>.</p>\n<p>The audit draws the sharp conclusion: any genuine hyperlinear-action proof must have, at some finite test, a target <code>Lambda_0</code> that is itself a finitely generated hyperlinear nonsofic group \u2014 which is the main problem again. The halo framework is a good permanence result <em>after</em> a seed exists and cannot manufacture the first one.</p>"}, {"id": "hilbert-embeddable-amplification", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Separation is free in the Hilbert embeddable class, and Glebsky's cap is replaceable", "impact": 0, "frontier": false, "lock": null, "html": "<p>Let <code>ell</code> be a Hilbert embeddable invariant length on a finite group, <code>0 &lt;= ell &lt;= 1</code>, and for an integer <code>r&gt;=1</code> put</p>\n<pre>\nell_r = 1 - exp(-r ell).\n</pre>\n<p>1. <strong>Amplification.</strong>  <code>ell_r</code> is again a Hilbert embeddable invariant length bounded by <code>1</code>, with <code>ell_r &lt;= r ell</code> everywhere and <code>ell_r &gt;= 1 - exp(-rc)</code> wherever <code>ell &gt;= c</code>.  So a witness with defect <code>&lt;= delta</code> and separation <code>&gt;= c</code> becomes, on replacing <code>ell</code> by <code>ell_r</code> with <code>r = ceil(delta^(-1/2))</code>, a witness with defect <code>&lt;= sqrt(delta)</code> and separation <code>&gt;= 1 - exp(-c delta^(-1/2))</code>.  <strong>Any fixed positive separation amplifies to <code>1 - o(1)</code></strong>, so the separation constant in the definition of weak soficity carries no content for Hilbert embeddable witnesses; only <code>ell != 0</code> on the elements to be separated does. 2. <strong>This is exactly Glebsky's Lemma 11, transported.</strong>  If <code>exp(-ell) = tr rho</code> for a unitary representation <code>rho</code>, then <code>exp(-r ell) = tr(rho^(tensor r))</code>, so <code>ell_r</code> is the length of the <code>r</code>-th tensor power of the realizing representation.  Glebsky's amplification for the sofic case is the same identity for the permutation representation: <code>1 - ||h||_Hamming</code> is the normalized trace of the permutation matrix, and the product action on <code>[m]^r</code> multiplies it.  The trace here is real and positive by Schoenberg, so the phase collapse that defeats naive tensor amplification in the unitary group \u2014 equal powers for <code>1</code> and <code>i*1</code> \u2014 cannot occur. 3. <strong>The cap is replaceable.</strong>  Glebsky's manufactured length <code>min{d(1,h)/n, 1}</code> may be replaced throughout by</p>\n<pre>\n   1 - exp(-d(1,h)/n),\n</pre>\n<p>which is bounded by <code>1</code>, equals <code>1-exp(-1/n) ~ 1/n</code> on the error set, and is at least <code>1-exp(-1) &gt; 0.63</code> on the <code>n</code>-separated set \u2014 comfortably above the <code>1/2</code> the definition asks for.  Unlike <code>min{.,1}</code>, which is not a Bernstein function, <code>t |-&gt; 1-exp(-t)</code> is one, so this replacement <strong>preserves conditional negative definiteness</strong> from the underlying word metric. 4. <strong>Consequent reduction.</strong>  Glebsky's construction yields a Hilbert embeddable witness whenever the conjugation-invariant word metric <code>d_(Gamma(H,X^H))</code> is itself conditionally negative definite.  Neither the cap nor the separation constant obstructs; the whole question is the uncapped word metric.</p>\n<p>The cap is therefore not load bearing for separation and not load bearing for the diameter bound \u2014 only for the fact that it is not Bernstein.  What cannot be done is to <em>delete</em> it, leaving an unbounded length; what can be done is to replace it by a Bernstein cap with the same profile.</p>"}, {"id": "hilbert-embeddable-is-representation-realized", "status": "ESTABLISHED", "root": false, "goal": false, "title": "A Hilbert embeddable length is exactly the normalized-HS metric of a representation", "impact": 1, "frontier": false, "lock": null, "html": "<p>Let <code>H</code> be finite and <code>\u2113</code> a real conjugation-invariant function with <code>\u2113(1) = 0</code>, <code>\u2113 \u2265 0</code>. Put <code>\u03c8_i(h) = d_i \u2212 Re \u03c7_i(h) = \u00bd\u2016\u03c0_i(h) \u2212 1\u2016_F\u00b2</code>. Then <code>\u2113</code> is Hilbert embeddable <strong>iff</strong> <code>\u2113 = \u03a3_{i \u2260 triv} a_i \u03c8_i</code> with <code>a_i \u2265 0</code>, <strong>iff</strong> <code>\u2113(h) = \u00bd\u2016\u03c1(h) \u2212 1\u2016_F\u00b2</code> for a finite-dimensional unitary representation <code>\u03c1</code> without trivial subrepresentation (exactly for integer multiplicities; up to a positive scalar and arbitrarily small uniform error in general). Normalizing, <code>\u2113(a\u207b\u00b9b) \u221d \u2016\u03c1(a) \u2212 \u03c1(b)\u2016\u00b2_{2,norm}</code>.</p>\n<p><strong>Consequence A \u2014 corrected twice; read the second correction.</strong> The first version of this node claimed the identity removes the uniformity-of-constants exposure in <code><a href=\"hilbert-embeddable-length-hyperlinearity.html\">hilbert-embeddable-length-hyperlinearity</a></code> item 2, with no reason given. The correction that replaced it asserted the opposite \u2014 that <code>dim \u03c1</code> is \"unbounded\", so an exact realization gives normalized separation <code>2\u2113(w)/dim \u03c1 \u2192 0</code> along a family. <strong>That failure mode cannot occur</strong> (<code>cairn-verify</code>, audit 2026-08-14), and the corrected text is:</p>\n<ul>\n<li><code>mean_H(\u03c8_i) = d_i</code> for every nontrivial <code>i</code>, since <code>\u03a3_h \u03c7_i(h) = 0</code>.</li>\n<p>Hence in the trivial-free decomposition <strong><code>dim \u03c1 = mean_H(\u2113)</code></strong> \u2014 the dimension of the realizing representation <em>is</em> the average of the length, not a free parameter.</p>\n<li><code>\u03c8_i \u2264 2d_i</code> pointwise, hence <strong><code>max \u2113 \u2264 2\u00b7mean_H(\u2113)</code></strong> for every Hilbert</li>\n<p>embeddable <code>\u2113</code>.</p>\n</ul>\n<p>So for a witness normalized to <code>\u2113 \u2264 1</code> with separation <code>c</code>, <code>mean_H(\u2113)</code> is pinned into <code>[c/2, 1]</code>: the scalar <code>2/dim \u03c1</code> is bounded above and below by absolute functions of <code>c</code>, the normalized-HS defect is at most <code>4\u03b4/c</code> and the normalized-HS separation at least <code>2c</code>. Far from being unbounded, <code>dim \u03c1 \u2264 1</code> whenever <code>\u2113 \u2264 1</code>, which is exactly why exact integral realization of a normalized length essentially never exists and the theorem says \"up to a positive scalar\". The discrete-length calibration does not show otherwise: the regular representation realizes <code>|K|\u00b7\u2113</code>, not <code>\u2113</code>, and <code>mean(|K|\u00b7\u2113) = |K|\u22121 = dim(\u03bb \u2296 triv)</code>, consistent with the identity.</p>\n<p>Equivalently, in the <strong>normalized character</strong> <code>\u03c6 = \u03c7_\u03c1/dim \u03c1</code>: <code>\u00bd\u2016\u03c1(a) \u2212 \u03c1(b)\u2016\u00b2_{2,norm} = 1 \u2212 Re \u03c6(a\u207b\u00b9b)</code>, and <code>1 \u2212 Re \u03c6 = \u03a3_i \u03bb_i g_i</code> with <code>g_i = 1 \u2212 Re \u03c7_i/d_i</code> and <code>\u03bb</code> on the <strong>simplex</strong>. Since <code>mean_H(g_i) = 1</code>, the simplex constraint and <code>dim \u03c1 = mean_H(\u2113)</code> are the same fact.</p>\n<p><strong>Nevertheless item 2 of the criterion stands, for a different reason: scalar-freeness.</strong> The identity controls only <code>Re \u03c4(\u03c1(h)) = 1 \u2212 \u2113(h)/dim \u03c1</code> and leaves <code>|\u03c4|</code> free; <code>|\u03c4| = 1</code> exactly on scalars, where the upgrade to maximal separation (<code>HyperlinearAmplification.exists_conjDouble_separation</code>, and equally plain tensor powers) is unavailable at any number of copies. The obstruction is realized, not hypothetical: on <code>Z/N</code>, <code>\u2113(h) = \u00bd(1 \u2212 cos(2\u03c0h/N))</code> is a Hilbert embeddable invariant length (kernel test: conditionally negative definite, vanishing only at <code>0</code>) whose exact realizer is the one-dimensional character <code>\u03c7\u2081</code>, so every <code>\u03c1(h)</code> is a <strong>scalar</strong> and <code>|\u03c4(\u03c1(h))| = 1</code> for all <code>h \u2260 0</code>. On the same data the Schoenberg trace <code>exp(\u2212\u2113)</code> is real, positive and bounded away from <code>1</code>. So the identity and item 2 compose; the identity does not replace it.</p>\n<p>What survives, and is the reusable content, is the <strong>cone description</strong>: the Hilbert embeddable invariant lengths are exactly the nonnegative combinations of the <code>\u03c8_i</code>, equivalently of the <code>g_i</code>. Since <code>\u03c8_i = d_i g_i</code> with <code>d_i &gt; 0</code> the two generating sets span the same cone, so every ratio or feasibility statement over the cone is independent of the choice.</p>\n<p><strong>Consequence B \u2014 the design problem becomes a membership question.</strong> For a weak-soficity witness <code>\u03c6 : \u03a6 \u2192 H</code> with defect set <code>X</code> and target set <code>T</code>, asking for a Hilbert embeddable witnessing length is asking for a finite-dimensional unitary representation <code>\u03c1</code> of <code>H</code> with <code>\u2016\u03c1(x) \u2212 1\u2016\u2082</code> small on <code>X</code> and <code>\u2016\u03c1(y) \u2212 1\u2016\u2082 \u2265 c</code> on <code>T</code>; and then <code>\u03c1 \u2218 \u03c6</code> <strong>is</strong> the hyperlinear microstate, since <code>\u03c1</code> is a homomorphism and all defects of <code>\u03c1 \u2218 \u03c6</code> are <code>\u03c1(X)</code>. Hence for a countable group <code>K</code> the following coincide:</p>\n<ul>\n<li><code>K</code> is weakly sofic with Hilbert embeddable witnessing lengths;</li>\n<li><code>K</code> has hyperlinear microstates factoring as <code>\u03a6 \u2192 H \u2192 U(m)</code> with the second</li>\n<p>arrow a homomorphism;</p>\n<li><code>K</code> is approximable by <strong>finite subgroups of unitary groups</strong> in normalized</li>\n<p>Hilbert\u2013Schmidt. Call this class <code>\ud835\udc9e_FU</code>.</p>\n</ul>\n<p><code>sofic \u2286 \ud835\udc9e_FU \u2286 hyperlinear</code>, the first inclusion because permutation matrices give <code>\u2016\u03c3 \u2212 1\u2016\u00b2_{2,norm} = 2 d_H(\u03c3, 1)</code>.</p>\n<p>So <code><a href=\"hilbert-embeddable-witness-for-kun-thom-wreath.html\">hilbert-embeddable-witness-for-kun-thom-wreath</a></code> is exactly the membership question <code>W \u2208 \ud835\udc9e_FU</code>, with no metric left to design, and the linear program of <code><a href=\"hilbert-embeddable-length-lp-feasibility.html\">hilbert-embeddable-length-lp-feasibility</a></code> is a program in the multiplicity vector of <code>\u03c1</code>, readable off the character table. Whether <code>\ud835\udc9e_FU</code> equals the class of hyperlinear groups is a separate open question and is not needed: <code>W \u2208 \ud835\udc9e_FU</code> suffices for Question 3.4.</p>"}, {"id": "hilbert-embeddable-length-hyperlinearity", "status": "ESTABLISHED", "root": false, "goal": false, "title": "Weak soficity upgrades to hyperlinearity when the invariant lengths are Hilbert embeddable", "impact": 2, "frontier": false, "lock": null, "html": "<p>Call a conjugation-invariant length <code>ell</code> on a finite group <code>K</code> (real, symmetric, <code>ell(k)=0</code> iff <code>k=1</code>) <strong>Hilbert embeddable</strong> when the kernel <code>(a,b) |-&gt; ell(a^(-1)b)</code> is conditionally negative definite.</p>\n<p>1. <strong>Character criterion.</strong>  Expanding <code>ell</code> in irreducible characters, <code>ell = sum_i b_i chi_i</code>, the length is Hilbert embeddable if and only if</p>\n<pre>\n   b_i &lt;= 0   for every nontrivial irreducible chi_i.\n</pre>\n<p>2. <strong>Realization.</strong>  If <code>ell</code> is Hilbert embeddable then for every <code>t&gt;0</code> and <code>epsilon&gt;0</code> there is a unitary representation <code>rho</code> of <code>K</code> with <code>|tr rho(k) - exp(-t ell(k))| &lt; epsilon</code> for all <code>k</code>; consequently the normalized-Hilbert--Schmidt distance satisfies <code>||rho(a)-rho(b)||_2^2 = 2(1-exp(-t ell(a^(-1)b))) + O(epsilon)</code>, which for <code>ell</code> bounded by <code>1</code> is comparable to <code>ell(a^(-1)b)</code> with constants depending only on <code>t</code>. 3. <strong>Criterion.</strong>  A countable group which is weakly sofic <em>with Hilbert embeddable witnessing lengths</em> is hyperlinear.  The normalization is the one already in the definition of weak soficity (recorded, with its numbering, in <code><a href=\"glebsky-weak-soficity-is-metric-free.html\">glebsky-weak-soficity-is-metric-free</a></code>): lengths bounded by <code>1</code>, defect tending to zero, separation bounded below by a constant not depending on the defect.  All comparison constants in 2 are then absolute \u2014 they come from concavity of <code>s |-&gt; 2(1-e^(-s))</code> on <code>[0,1]</code> \u2014 so no uniformity is lost along the witness family.  What the normalization is doing is genuine and not bookkeeping: if the diameters were allowed to grow, rescaling to diameter <code>1</code> would drive the separation to zero.  The conclusion is hyperlinearity in the maximal-separation sense of <code>Sofic/Hyperlinear.HyperlinearModel</code>; the upgrade from constant to maximal separation is <em>not</em> free for unitary models (<code>HyperlinearAmplification.tensorPow_phase_collapse</code>), and it is available here only because the Schoenberg traces are approximately the real positive numbers <code>exp(-ell)</code>, which is exactly the scalar-freeness hypothesis of <code>exists_conjDouble_separation</code>. 4. <strong>Calibration.</strong>  Sufficiency has content on both sides:</p>\n<ul>\n<li>the normalized Hamming length on <code>Sym(n)</code> is Hilbert embeddable, and 3</li>\n<p>then reproduces the formalized <code><a href=\"sofic-implies-hyperlinear.html\">sofic-implies-hyperlinear</a></code>;</p>\n<li>the discrete length is Hilbert embeddable, reproducing</li>\n<p>\"residually finite (or LEF) implies hyperlinear\";</p>\n<li>on any family with a uniform character ratio bound</li>\n<p><code>|chi(x)|/chi(1)&lt;=c&lt;1</code> (Gluck, finite Lie type), <em>every</em> Hilbert embeddable invariant length is uniformly bi-Lipschitz to the discrete length, so witnesses through such groups collapse to LEF witnesses. This is where the asymptotic content lives, and it subsumes the recorded rank/Schoenberg no-go;</p>\n<li>the <code>F_2</code>-rank length on <code>GL_2(F_2)</code> is <strong>not</strong> Hilbert embeddable \u2014</li>\n<p>the sign character carries coefficient <code>1/6</code> \u2014 but this single-group computation has no asymptotic content on its own, since <code>rank^s</code> on the same group <em>is</em> Hilbert embeddable for every <code>s &lt;= log_2(3/2)</code>. Conditional negativity is parametrization-sensitive in both directions (<code>d_H</code> is, <code>d_H^2</code> is not), so any candidate-witness question must name the function that carries the defect and separation bookkeeping.</p>\n</ul>\n<p>5. <strong>Normalized-character form, and why the normalization must stay.</strong>  The cone of Hilbert embeddable invariant lengths is generated by the <code>psi_i(h)=d_i-Re chi_i(h)</code>, <code>i</code> nontrivial (cairn-bernoulli, <code><a href=\"hilbert-embeddable-is-representation-realized.html\">hilbert-embeddable-is-representation-realized</a></code>), equivalently by the normalized <code>1-Re chi_i/d_i</code>.  That gives the exact identity <code>psi_rho(h)=(1/2)||rho(h)-1||_F^2</code> for a representation <code>rho</code> with the matching multiplicities.  It does <strong>not</strong> replace item 2, because the conversion this criterion needs is to the <em>normalized</em> Hilbert--Schmidt metric, and</p>\n<pre>\n   ||rho(a)-rho(b)||_(2,norm)^2 = 2 psi_rho(a^(-1)b) / dim(rho),\n</pre>\n<p>whose scalar <code>1/dim(rho)</code> is not bounded below along a family \u2014 the Frobenius identity is exact but the separation it delivers can decay like <code>1/dim</code>.  What item 2 produces instead is a representation whose <em>normalized</em> trace realizes the length, which is dimension free.  So the right object to design is a <strong>normalized character</strong> <code>phi = sum_i lambda_i chi_i/d_i</code>, <code>lambda_i&gt;=0</code>, <code>sum_i lambda_i = 1</code>, with</p>\n<pre>\n   phi ~ 1 on the error set,     |phi| bounded away from 1 on the targets,\n</pre>\n<p>after which <code>rho o sigma</code> <em>is</em> the microstate, since <code>rho</code> is a genuine homomorphism.  The two formulations correspond by <code>ell = 1 - Re phi</code>.</p>\n<p><strong>Three descriptions, one object.</strong>  For a countable group the following coincide, and this is the canonical form the weak-soficity lanes compute against:</p>\n<ul>\n<li>it is weakly sofic with Hilbert embeddable witnessing lengths (this</li>\n<p>claim);</p>\n<li>it lies in cairn-bernoulli's class <code>C_FU</code> \u2014 approximable by *finite</li>\n<p>subgroups of unitary groups* in normalized Hilbert--Schmidt, equivalently its microstates factor as <code>Phi -&gt; K -&gt; U(m)</code> with the second arrow a homomorphism;</p>\n<li>the normalized-multiplicity linear program of</li>\n<p><code><a href=\"hilbert-embeddable-length-lp-feasibility.html\">hilbert-embeddable-length-lp-feasibility</a></code> is feasible along the family.</p>\n</ul>\n<p>The identification is <code>ell = 1 - Re phi</code> in one direction and item 2 in the other.  <strong>The normalization caveat travels with it</strong>: the LP must be run on the simplex <code>lambda_i &gt;= 0</code>, <code>sum_i lambda_i = 1</code> in the normalized generators <code>1 - Re chi_i/d_i</code>, not on an unconstrained multiplicity vector in the <code>psi_i</code>.  The two span the same cone, so ratios of linear functionals are unaffected, but the <em>conversion</em> to microstates is not: an exact unnormalized realization <code>psi_rho = ell</code> yields normalized separation <code>2c/dim(rho)</code>, which decays along a family. In these coordinates the collapse in item 4 is one line: if no nontrivial normalized character comes near <code>1</code> anywhere, then <code>phi ~ 1</code> on the error set forces <code>lambda_triv ~ 1</code>, hence <code>phi ~ 1</code> everywhere, hence no separation. 6. <strong>Calibration against Glebsky's own construction.</strong>  The lengths his Lemma 3 manufactures are conjugation-invariant word metrics, so the criterion can be run against them directly, and it cuts both ways.</p>\n<ul>\n<li><em>The smallest nonabelian instance fails.</em>  On <code>H=S_3</code> with the</li>\n<p>transposition class as generating set the word metric is <code>(0,1,1,1,2,2)</code>, which <strong>is</strong> the <code>F_2</code>-rank length on <code>GL_2(F_2)=S_3</code> of item 4 \u2014 so the recorded non-embeddable example is not merely analogous to that family, it is a member of it.</p>\n<li><em>The lamp direction passes.</em>  On <code>(Z/2)^A</code> with the coordinate</li>\n<p>generators the word metric is the Hamming weight <code>sum_alpha (1-epsilon_alpha)/2</code>, a nonnegative combination of <code>1 - character</code>, hence Hilbert embeddable outright.</p>\n</ul>\n<p>So generic parameter choices fail while the lamp direction is free: for a lamp-and-acti
