version: "v0.4"

# This file describes the submission Palomar/comparator-pestov91.json. The
# repository holds other Comparator configurations, checked by the same gate;
# each is described here when it is submitted, one configuration at a time.

project:
  name: >-
    An Infinite Simple Group with Property (T) That Is Sofic and Hyperlinear
  description: >-
    Ozawa asks in 2003, in About the QWEP conjecture (arXiv:math/0306067),
    whether a simple group with Kazhdan's property (T) can be hyperlinear,
    and Pestov prints the question, with the sofic form added, as Open
    question 9.1 of Hyperlinear and sofic groups: a brief guide
    (arXiv:0804.3968): can an infinite simple group with Kazhdan's property
    (T) be hyperlinear, or sofic? This project proves, in Lean 4 over
    Mathlib, that the answer is yes in both forms. The witness is EL₃(A),
    the group generated by the elementary matrices of size three over the
    ring A = LC(X, 𝔽₂) ⋊ ℤ, the algebraic crossed product of the locally
    constant 𝔽₂-valued functions on a binary Toeplitz subshift X by the
    shift. The ring is finitely generated and simple with center 𝔽₂; the
    group is infinite and simple, has property (T) by the theorem of Ershov
    and Jaikin-Zapirain, proved here, and is locally embeddable into finite
    groups by periodic models of the Toeplitz sequence, so it is sofic and
    hyperlinear. The two compared theorems state the existence of an
    infinite simple group with property (T) that is hyperlinear, and of one
    that is sofic, with property (T), soficity and hyperlinearity defined in
    the Challenge from the textbook sources; their axiom closure is propext,
    Classical.choice and Quot.sound.
  authors: [Sauers]
  responsible_maintainers: [SauersML]
  license: Apache-2.0

classification:
  arxiv: [math.GR, math.OA, math.DS]
  msc2020: ["20E32", "20F65", "22D55", "37B10", "20F69"]

sources:
  - title: An infinite simple group with property (T) that is sofic and hyperlinear
    type: original-proof
    relationship: other
    contributors:
      - name: Claude (Anthropic)
        role: >-
          solved the problem, using the custom proof tool Cairn; reviewed it
          in two separate agent sessions; wrote all the prose: this file's
          narrative fields and the Palomar Pestov91 docstrings
    note: >-
      The positive answer to Ozawa's question, the question checked by
      Palomar/comparator-pestov91.json, is first presented in this project.
      Ozawa asks it first, in 2003, without attributing it to anyone: "It is
      unknown whether there exists a simple property (T) group Γ which is
      hyperlinear" (About the QWEP conjecture, arXiv:math/0306067 v1,
      2003-06-03, unchanged in v2 of 2004-05-10). Pestov prints it, citing
      Ozawa and adding the sofic form, as Open question 8.1 of
      arXiv:0804.3968 v1 (2008-04-24), numbered 9.1 in v8 (2008-08-04): "Let
      G be an infinite simple group with Kazhdan's property (T). Can it be
      hyperlinear (sofic)?" Arzhantseva still lists the sofic form as unknown
      in 2014 (Trends in Mathematics 1, p. 11). The witness is
      EL_3(LC(X, F_q) ⋊ Z) modulo its center, for an infinite minimal subshift
      X; the Lean witness is the case q = 2 with X the Toeplitz subshift,
      where the center is trivial and no quotient is taken. The argument was
      committed to this public repository on 2026-09-13 at 03:18:24 UTC
      (f375478c7). It passed a review by a separate Claude Code agent at
      03:48:55 UTC (0efeac410), was recorded as answering the question at
      04:09:24 UTC (8b65f0932), and passed a second such review, written
      before its author read the first, at 05:56:33 UTC (badc66e2d). A Claude
      Code agent in a second session found the same group independently,
      three minutes after the first, and committed it at 04:06:49 UTC
      (5dfab98df). The Lean endpoint
      GroupApproximation.Pestov91.exists_infinite_simple_kazhdan_lef landed
      with the completed Palomar surface at 08:43:33 UTC (5f9c16b7b). All of
      this postdates the latest version of every source checked for an
      earlier answer. The newest is Alekseev and Thom's list of known
      examples (arXiv:2608.05362 v1, 2026-08-05), which names no simple one.
      No earlier or independent answer was found in print. The check was
      bounded: the LaTeX sources of more than twenty papers; the PDFs of
      Kirchberg (1994), Arzhantseva (2014) and Pisier (2020, Chapter 17); and
      the OpenAlex titles and abstracts of works citing Ozawa, Pestov and
      seven further sources. The arXiv API was rate-limited, and journal
      versions were not opened.

  # The question: its first printed form, the survey that numbers it, and
  # the literature that records it as open.

  - title: About the QWEP conjecture
    authors: [Narutaka Ozawa]
    year: 2004
    type: paper
    id: https://doi.org/10.1142/S0129167X04002417
    location: Section 7, after Theorem 7.4, p. 527
    relationship: background
    note: >-
      Internat. J. Math. 15(5):501-530; arXiv:math/0306067v2, p. 26. The
      first printed form of the question, from 2003, which Pestov cites as
      [64] at Open question 9.1: "It is unknown whether there exists a
      simple property (T) group Γ which is hyperlinear." Context only.

  - title: "Hyperlinear and sofic groups: a brief guide"
    authors: [Vladimir G. Pestov]
    year: 2008
    type: paper
    id: https://doi.org/10.2178/bsl/1231081461
    location: Theorems 3.5 and 3.6, Remark 3.7, and Open question 9.1, p. 21
    relationship: background
    note: >-
      Bull. Symbolic Logic 14(4):449-480; arXiv:0804.3968. Section 9, page 21
      of arXiv v8, prints the question checked by
      Palomar/comparator-pestov91.json, Ozawa's question of 2003 with the
      sofic form added: "Open question 9.1 (Cf. Ozawa [64]). Let G be an
      infinite simple group with Kazhdan's property (T). Can it be
      hyperlinear (sofic)?" Theorems 3.5 and 3.6 are the finite-set criteria
      for soficity and hyperlinearity that the challenge's IsSoficGroup and
      IsHyperlinearGroup imply; Example 2.3 and Example 2.7 are the
      normalized Hamming and Hilbert-Schmidt distances the challenge uses.

  - title: An introduction to hyperlinear and sofic groups
    authors: [Vladimir G. Pestov, Aleksandra Kwiatkowska]
    year: 2012
    type: paper
    id: https://doi.org/10.1017/CBO9781139208574.006
    location: Section 10
    relationship: background
    note: >-
      Appalachian Set Theory 2006-2012, Cambridge University Press, 145-186;
      arXiv:0911.4266v4, p. 28. Records the question as open: "it remains in
      particular unknown whether finitely generated simple Kazhdan groups can
      be hyperlinear/sofic." Context only.

  - title: >-
      Discrete groups with Kazhdan's property T and factorization property are
      residually finite
    authors: [Eberhard Kirchberg]
    year: 1994
    type: paper
    id: https://doi.org/10.1007/BF01459798
    location: Theorem 1.1
    relationship: background
    note: >-
      Math. Ann. 299:551-563. "A discrete group with property (F) and property
      T is residually finite" (p. 552), so an infinite simple Kazhdan group
      lacks property (F), the fact behind Ozawa's question. Context only.
      Corollary 1.2(v) is disproved by Thom (arXiv:0810.2180, Remark 1.6).

  - title: Examples of hyperlinear groups without factorization property
    authors: [Andreas Thom]
    year: 2010
    type: paper
    id: https://doi.org/10.4171/GGD/80
    location: Theorem 1.4
    relationship: background
    note: >-
      Groups Geom. Dyn. 4(1):195-208; arXiv:0810.2180v1, p. 4. The nearest
      earlier object: a finitely generated LEF Kazhdan group without the
      factorization property, non-hopfian and so not simple. Theorem 1.1
      recalls Kirchberg's theorem, and page 3 names the known sources of
      simple Kazhdan groups. Context only.

  - title: Centralizers of sofic approximations of Kazhdan groups
    authors: [Vadim Alekseev, Andreas Thom]
    year: 2026
    type: paper
    id: https://arxiv.org/abs/2608.05362
    location: Section 5 and Open problem 6.1
    relationship: background
    note: >-
      v1, 2026-08-05. Section 5 lists the known sofic Kazhdan groups that are
      not residually finite and names no simple one. Open problem 6.1 asks:
      "Are there examples of finitely presented sofic groups with Kazhdan's
      property (T) that are not residually finite?" The witness is not finitely
      presented, so it leaves 6.1 open. Context only.

  # The known infinite simple Kazhdan groups, and the nearest simple LEF groups.

  - title: Hyperbolic groups
    authors: [Misha Gromov]
    year: 1987
    type: paper
    id: https://doi.org/10.1007/978-1-4613-9586-7_3
    relationship: background
    note: >-
      Essays in Group Theory, MSRI Publications 8, Springer, 75-263. Infinite
      simple Kazhdan groups as quotients of hyperbolic Kazhdan groups, cited by
      Pestov at Question 9.1 ([37]) and by Ozawa. Context only.

  - title: Simplicity and superrigidity of twin building lattices
    authors: [Pierre-Emmanuel Caprace, Bertrand Rémy]
    year: 2009
    type: paper
    id: https://doi.org/10.1007/s00222-008-0162-6
    relationship: background
    note: >-
      Invent. Math. 176(1):169-221; arXiv:math/0607664v2. Simple twin building
      lattices, of which "many of them are finitely presented and enjoy
      property (T)": "the first infinite finitely presented discrete groups
      to be both simple and Kazhdan" (p. 2, a remark they credit to Shalom).
      The earlier infinite simple Kazhdan groups are Gromov's quotients of
      hyperbolic Kazhdan groups, which Ozawa and Pestov cite. A finitely
      presented LEF group is residually finite, so none of the finitely
      presented lattices is LEF. Context only.

  - title: From telescopes to frames and simple groups
    authors: [Steffen Kionke, Eduard Schesler]
    year: 2023
    type: paper
    id: https://arxiv.org/abs/2304.09307
    location: Theorem 1.2 (Theorem 9.14)
    relationship: background
    note: >-
      v1, 2023-04-18. Every finitely generated residually finite group embeds
      into a finitely generated residually finite group that projects onto
      an infinite simple LEF group, injectively on the embedded group. So
      finitely generated infinite simple LEF groups are abundant. Nothing
      there gives property (T), and the witness is not built that way; the
      point of the answer is the conjunction of infiniteness, simplicity,
      property (T) and the LEF property. Context only.

  # The definitions the challenge renders.

  - title: "Kazhdan's Property (T)"
    authors: [Bachir Bekka, Pierre de la Harpe, Alain Valette]
    year: 2008
    type: book
    id: https://doi.org/10.1017/CBO9780511542749
    location: Definitions 1.1.1 and 1.1.3
    relationship: background
    note: >-
      New Mathematical Monographs 11, Cambridge University Press. Definition
      1.1.3, the Kazhdan pair, is what Palomar/Pestov91Challenge.lean renders
      as IsKazhdanPair for a discrete group, with the strict inequality of
      Definition 1.1.1 and a finite Kazhdan set, the compact case for a
      discrete group.

  - title: Groups that are locally embeddable in the class of finite groups
    authors: [Anatoly M. Vershik, Evgenii I. Gordon]
    year: 1997
    type: paper
    id: https://www.mathnet.ru/eng/aa751
    relationship: background
    note: >-
      Algebra i Analiz 9(1):71-97; English translation St. Petersburg Math.
      J. 9(1):49-67 (1998). The origin of the LEF property, which the
      development proves for the witness and then turns into soficity and
      hyperlinearity. Context only.

  - title: Sofic groups and direct finiteness
    authors: [Gabor Elek, Endre Szabo]
    year: 2004
    type: paper
    id: https://doi.org/10.1016/j.jalgebra.2004.06.023
    relationship: background
    note: >-
      J. Algebra 280(2):426-434. The permutation form of soficity, with the
      normalized Hamming distance on a finite set, that the challenge renders
      as IsSoficGroup.

  - title: "Hyperlinearity, essentially free actions and L2-invariants. The sofic property"
    authors: [Gabor Elek, Endre Szabo]
    year: 2005
    type: paper
    id: https://doi.org/10.1007/s00208-005-0640-8
    location: Theorem 2
    relationship: other
    note: >-
      Math. Ann. 332(2):421-441. "We shall prove that countable sofic groups
      are hyperlinear (Theorem 2)" (p. 423). LEF groups are sofic "is known"
      (p. 422). The development proves LEF ⇒ sofic ⇒ hyperlinear for
      arbitrary groups (GroupApproximation.isSofic_of_isLEF,
      GroupApproximation.isHyperlinear_of_isSofic).

  # The theorems whose cases the witness needs. Rows marked "other" are
  # reproved in Lean, not assumed.

  - title: Property (T) for noncommutative universal lattices
    authors: [Mikhail Ershov, Andrei Jaikin-Zapirain]
    year: 2010
    type: paper
    id: https://doi.org/10.1007/s00222-009-0218-2
    location: Theorem 1.1
    relationship: other
    note: >-
      Invent. Math. 179(2):303-347. Property (T) for elementary groups of rank
      at least three over finitely generated rings (Theorem 1.1,
      arXiv:0809.4095v2, p. 1). It gives property (T) to EL_3 of the
      crossed-product ring of the witness. Proved in this development.

  - title: On algebraic properties of topological full groups
    authors: [Rostislav Grigorchuk, Konstantin Medynets]
    year: 2014
    type: paper
    id: https://doi.org/10.1070/SM2014v205n06ABEH004400
    location: Theorem 2.6
    relationship: background
    note: >-
      Sb. Math. 205(6):843-861; arXiv:1105.0719v4, p. 5. "The topological full
      group of any Cantor minimal system is an LEF group", by periodic
      approximation. The witness is made LEF by the same mechanism, applied to
      the crossed-product ring; the development proves that ring version and
      does not use this theorem.

  - title: 0-1-sequences of Toeplitz type
    authors: [Konrad Jacobs, Michael Keane]
    year: 1969
    type: paper
    id: https://doi.org/10.1007/BF00537017
    relationship: background
    note: >-
      Z. Wahrscheinlichkeitstheorie verw. Gebiete 13(2):123-131. The origin
      of Toeplitz sequences and their subshifts. The witness subshift is
      generated by the sequence n ↦ parity of the 2-adic valuation of 3n - 1
      (GroupApproximation/Pestov91/Toeplitz.lean), whose regularity and
      aperiodicity the development proves directly. Context only.

  - title: Simplicity of algebras associated to étale groupoids
    authors: [Jonathan H. Brown, Lisa Orloff Clark, Cynthia Farthing, Aidan Sims]
    year: 2014
    type: paper
    id: https://doi.org/10.1007/s00233-013-9546-z
    location: Theorem 4.1
    relationship: background
    note: >-
      Semigroup Forum 88(2):433-452; arXiv:1204.3127v2. The complex Steinberg
      algebra of an effective minimal ample groupoid is simple: the origin of
      the simplicity criterion. It is stated over the complex numbers, not over
      F_2, so the witness needs the field-general rows below. Context only.

  - title: Uniqueness theorems for Steinberg algebras
    authors: [Lisa Orloff Clark, Cain Edie-Michell]
    year: 2015
    type: paper
    id: https://doi.org/10.1007/s10468-015-9522-2
    location: Corollary 4.6 and Theorem 5.2(1)
    relationship: other
    note: >-
      Algebr. Represent. Theory 18(4):907-916; arXiv:1403.4684v1, p. 7. A_R(G)
      is simple if and only if G is effective and minimal and R is a field
      (Corollary 4.6), and for G effective and minimal with compact unit
      space the center of A_R(G) is R times the unit (Theorem 5.2(1)). The
      witness ring LC(X, F_2) ⋊ Z is the case of the shift groupoid of a
      free minimal system; the development proves both cases directly
      (GroupApproximation/Pestov91/RingSimple.lean and WitnessCentre.lean).

  - title: >-
      Simplicity, primitivity and semiprimitivity of étale groupoid algebras
      with applications to inverse semigroup algebras
    authors: [Benjamin Steinberg]
    year: 2016
    type: paper
    id: https://doi.org/10.1016/j.jpaa.2015.08.006
    location: Corollary 3.6
    relationship: other
    note: >-
      J. Pure Appl. Algebra 220(3):1035-1054; arXiv:1408.6014v2, p. 10. The
      same criterion over any field k, proved independently. The development
      proves directly the case that the witness ring needs.

  - title: Obstructions to matricial stability of discrete groups and almost flat K-theory
    authors: [Marius Dadarlat]
    year: 2021
    type: paper
    id: https://doi.org/10.1016/j.aim.2021.107722
    location: Proposition 3.19
    relationship: background
    note: >-
      Adv. Math. 384:107722; arXiv:2007.12655v2. By Proposition 3.19
      (Ozawa-Thom), infinite simple Kazhdan groups are not weakly
      quasidiagonal. So the witness, which is LEF and hence MF (LEF groups
      are MF: Carrión, Dadarlat and Eckhardt, J. Funct. Anal. 265 (2013),
      arXiv:1210.4050), contradicts the introduction's "It is clear from
      definitions that MF ⇒ weak quasidiagonality" (p. 2), not Proposition
      3.19 itself. Context only; not formalized; the journal version was not
      compared.

