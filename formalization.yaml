sources:
  - title: Boone-Higman embeddings and related printed questions
    type: original-proof
    relationship: other
    contributors:
      - name: Claude (Anthropic)
        role: developed the arguments, the Lean development and the prose of this submission under the user's direction
    note: >-
      The answers collected here were found and written up in this repository under the
      user's direction. Their proofs are internal and have not had external expert
      review; bounded literature searches found no earlier answers, which is not a
      certification of priority. They rest throughout on the work of others, notably
      Suslin's stability theorems for elementary linear groups, Leavitt algebras, the
      Higman-Thompson groups, and Kohl's theory of residue-class-wise affine groups. The
      Lean development is in progress, and the solution module records exactly which
      propositions each theorem still assumes.

  - title: Progress around the Boone-Higman Conjecture
    authors: [James Belk, Collin Bleak, Francesco Matucci, Matthew C. B. Zaremsky]
    year: 2023
    type: paper
    id: https://arxiv.org/abs/2306.16356
    location: Problem 2.7 and Problem 5.3(7) (version 3)
    relationship: background
    note: >-
      States the Boone-Higman conjecture and poses the questions answered by
      explicit_fp_overgroup_of_all_gl_n_q and by the two metabelian theorems.

  - title: "Unsolved Problems in Group Theory. The Kourovka Notebook"
    authors: [E. I. Khukhro, V. D. Mazurov]
    year: 2026
    type: paper
    id: https://arxiv.org/abs/1401.0300
    location: Problems 14.10(c) (P. de la Harpe), 17.59 and 21.75 (S. Kohl)
    relationship: background
    note: >-
      Records Problem 14.10(c), an explicit finitely presented group containing GL_n(Q);
      Problem 17.59, whether CT(Z) is the group of residue-class-wise affine permutations
      fixing the nonnegative integers setwise; and Problem 21.75, whether CT_P1(Z) and
      CT_P2(Z) generate a proper subgroup of CT_(P1 u P2)(Z) when neither set contains the
      other.

  - title: "RCWA: Residue-Class-Wise Affine Groups (GAP package manual)"
    authors: [Stefan Kohl]
    type: other
    id: https://docs.gap-system.org/pkg/rcwa/doc/chap2.html
    location: Chapter 2
    relationship: background
    note: >-
      States the conjecture that every residue-class-wise affine permutation of Z factors
      into class shifts, class reflections and class transpositions, and defines the three
      series.

  - title: Infinitely presented simple groups separated by homological finiteness properties
    authors: [Claudio Llosa Isenrich, Eduard Schesler, Xiaolei Wu]
    year: 2025
    type: paper
    id: https://arxiv.org/abs/2510.01952
    location: Question 1.11
    relationship: background
    note: >-
      Asks whether every finitely generated linear group embeds in a finitely generated
      self-similar group.

  - title: "Boone-Higman embeddings of Aut(F_n) and mapping class groups of punctured surfaces"
    authors: [James Belk, Francesco Fournier-Facio, James Hyde, Matthew C. B. Zaremsky]
    year: 2025
    type: paper
    id: https://arxiv.org/abs/2503.21882
    location: Question 3.3
    relationship: background
    note: >-
      Asks whether, for every finitely presented simple group G, the mixed identities
      J_G(G * F_n) are finitely normally generated in G * F_n.

