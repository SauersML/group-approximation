# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: >-
    A Surjunctive Group That Is Not Sofic, and a Simple C*-Algebra That Is Not
    K1-Injective
  description: >-
    This project formalizes, in Lean 4 over Mathlib, negative answers to two
    open questions, one on finite approximation of groups and one on nonstable
    K-theory.

    Gromov and Weiss proved that every sofic group is surjunctive. The converse
    is asked in print by Ceccherini-Silberstein and Coornaert in 2010, as open
    problem (OP-11) of Cellular Automata and Groups, is recorded as open by
    Arzhantseva and Gal in 2013, and is printed as Problem 1.1 by Bowen and
    Chapman in 2025 (arXiv:2511.06586): are all surjunctive groups sofic? The
    answer is no, already for a finitely generated group. The witness is the
    symmetric double of the pair
    Γ = EL₃(𝔽₂[x₁, x₂, x₃]) ≤ G = EL₃(𝔽₂[x₁^±¹, x₂^±¹, x₃^±¹]) ⋊ EL₃(ℤ), the
    q = 2, r = d = 3 member of the family in Kun and Thom's Theorem E, with
    EL₃(ℤ) = SL₃(ℤ) acting by monomial substitution.
    Reducing exponents modulo n makes G residually finite, so G is surjunctive,
    and the development proves that the double G *_Γ G of a surjunctive group
    is surjunctive over every subgroup (isSurjunctive_symmetricDouble in
    GroupApproximation/Dynamics/DoubleFinitarySite.lean). With Γ trivial this
    is the free product G * G
    (GroupApproximation.Surjunctivity.isSurjunctive_coprodI_double, for
    Monoid.CoprodI of two copies of G), a case of the product question that
    Arzhantseva and Gal record as open, citing Weiss (2000); Doucha and
    Gismatullin still
    state the free-product case ℤ * G as a conjecture (Groups Geom. Dyn. 16
    (2022), Conjecture 3.12), and we have found no later resolution. Both G and
    Γ have property (T), and Γ is infranormal in G without being normal; for
    such a pair Kun and Thom's Theorem A makes the double nonsofic, and their
    centralizer normalization theorem (arXiv:2608.06222, Theorem 4.1) is proved
    here in a general sequential form rather than assumed.

    Blackadar's K-Theory for Operator Algebras (1998) records as open whether
    every unital simple C*-algebra is K1-injective, and Schafhauser, Tikuisis
    and White pose the question as Problem LIX of "Nuclear C*-algebras: 99
    problems" (arXiv:2506.10902). The counterexample is a separable simple
    unital C*-algebra A, an inductive limit of corner algebras of matrices over
    C(X), with a unitary u that is not in the connected component of 1 in U(A)
    although diag(u, 1) is in the connected component of 1 in U(M2(A)). So the
    class of u vanishes already at the first stabilisation.
  authors: [Sauers]
  responsible_maintainers: [SauersML]
  license: Apache-2.0

