  scope: >-
    Palomar/LIXChallenge.lean states that not every nontrivial simple unital
    C*-algebra is K1-injective, that the counterexample can be taken separable,
    and that it can be taken to fail K1-injectivity at the first
    stabilisation; Palomar/LIXSolution.lean proves these.
    Palomar/BowenChapmanChallenge.lean states that not every surjunctive group
    is sofic, and that some finitely generated group is surjunctive and not
    sofic; Palomar/BowenChapmanSolution.lean proves both from
    GroupApproximation.BowenChapman.exists_fg_surjunctive_not_isSofic.
    Palomar/Pestov91Challenge.lean states that some infinite simple group with
    Kazhdan's property (T) is hyperlinear, and that some such group is sofic;
    Palomar/Pestov91Solution.lean proves both from
    GroupApproximation.Pestov91.exists_infinite_simple_kazhdan_lef.
    Palomar/TypeA2Challenge.lean states that some group action of type [A2]
    has a quotient by its kernel that is not finitely presented;
    Palomar/TypeA2Solution.lean proves it from
    GroupApproximation.TypeA2.question58.
    Palomar/GubaThompsonChallenge.lean states that for every field K and every
    b in the group ring K[F] of Thompson's group F the equation
    (1 - x1) u = b v has a non-zero solution, and that for non-zero b the
    common multiple b v can be taken non-zero;
    Palomar/GubaThompsonSolution.lean proves both from
    GroupApproximation.ThompsonOre.one_sub_x1_solution.
    Palomar/GKPCommutingActionsChallenge.lean states that commuting sofic
    actions of countable groups on a countable set need not combine to a sofic
    action, both as the negation of the biconditional over finite index sets
    and as two commuting sofic actions of one countable sofic group whose
    combined action is not sofic; Palomar/GKPCommutingActionsSolution.lean
    proves both from
    GroupApproximation.CommutingSoficActions.exists_commuting_sofic_actions_not_sofic.
    Palomar/STWProblemX1Challenge.lean states that some separable unital
    C*-algebra carries a tracial state that is amenable and not quasidiagonal,
    and that not every amenable tracial state on a separable unital
    C*-algebra is quasidiagonal; Palomar/STWProblemX1Solution.lean proves both
    from GroupApproximation.PalomarBridges.X1.amenableNonQuasidiagonalTrace_zero.
    Palomar/STWProblemXXIIChallenge.lean states two theorems. First, some
    separable C*-algebra with a non-empty compact trace space has a uniform
    tracial completion (M, X) whose ||.||_{2,X}-continuous traces are exactly
    the members of X, some trace on M is not ||.||_{2,X}-continuous, and X is
    not all of T(M). Second, some factorial tracially complete C*-algebra has
    the same properties. Palomar/STWProblemXXIISolution.lean proves both from
    GroupApproximation.STW22.antipodalFactorialNegativeSolutionToProblemXXII.
    Palomar/BlanchardToeplitzChallenge.lean states that the Toeplitz algebra
    of the Dixmier-Douady module E_DD of Blanchard contains two isometries with
    mutually orthogonal range projections, that is, that it is properly
    infinite; Palomar/BlanchardToeplitzSolution.lean proves it from
    GroupApproximation.Toeplitz.exists_properlyInfinite_of_coeff.
