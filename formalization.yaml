fidelity:
  divergences: >-
    Kazhdan's property (T) is the Kazhdan pair of Bekka-de la Harpe-Valette,
    Definition 1.1.3, over complex Hilbert spaces in Type 0 with no
    separability assumption, with a finite Kazhdan set, which is the compact
    case for a discrete group; the development's real-Hilbert-space form is
    bridged by realification and complexification
    (hasKazhdanPropertyT_iff_complex). Soficity is the finite-set
    normalized-Hamming form: for every finite F and every eps > 0 a map from
    the group to the permutations of a nonempty finite set that is
    eps-multiplicative on F and separates distinct elements of F by
    normalized Hamming distance at least 1 - eps. Hyperlinearity is its
    unitary-matrix analogue with the squared normalized Hilbert-Schmidt
    distance, with separation 2 - eps because permutation matrices at
    Hamming distance 1 are at squared Hilbert-Schmidt distance 2. These
    thresholds are stronger than the fixed 1/4 of Pestov's Theorems 3.5 and
    3.6, so the challenge's notions imply his criteria (derived, with the
    identity clauses, in Palomar/Pestov91ModelTests.lean); the converse for
    hyperlinearity, Pestov's Remark 3.7 by tensor-power amplification, is
    not formalized and not needed. Ozawa's sentence omits "infinite"; the
    theorems ask it, as Pestov's wording does. The compared theorems are
    existence statements through one witness, EL3(LC(X, F2) ⋊ Z) for the
    binary Toeplitz subshift X, whose center is trivial; they do not
    register the more general statement, over every finite field and every
    infinite minimal subshift, that the informal argument treats. The
    formalized route is finite generation of the ring, its simplicity and
    trivial center for a free minimal action, simplicity of EL3 by split
    annihilators and root extraction, infiniteness of EL3 from the infinite
    ring, property (T) by the Ershov-Jaikin-Zapirain theorem proved in the
    development, and the LEF property by periodic models of the Toeplitz
    sequence, then LEF to sofic to hyperlinear. All groups and Hilbert
    spaces range over Type 0, where the witness lives.

