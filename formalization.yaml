fidelity:
  divergences: >-
    Groups and finite palettes range over Type 0, which contains the
    concrete witness. Cellular automata are given by finite lists of
    memory elements and an arbitrary local rule; repetitions and empty
    memory are allowed. This is the standard full-shift notion. The
    development uses continuous shift-equivariant maps; the solution
    explicitly converts every challenge automaton to such a map.
    Soficity is the finite-set normalized-Hamming criterion, with models
    on nonempty finite carriers, multiplicative error at most epsilon,
    and pairwise separation at least 1 - epsilon. These are exactly the
    development's conditions, as proved by isSoficGroup_iff_isSofic.
    Finite generation is an explicit finite generating subset. This
    submission asserts finite generation only. It does not assert finite
    presentation, simplicity, or nonhyperlinearity, and does not settle
    Gottschalk's conjecture that all groups are surjunctive.

alignment:
  statements:
    - source: Not every surjunctive group is sofic, answering Bowen-Chapman Problem 1.1 negatively.
      lean: BowenChapman.not_all_surjunctive_groups_sofic
