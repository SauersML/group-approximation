  # Background for the LIX result, in four groups: the problem and its
  # history; the positive results the counterexample had to avoid; the
  # construction's ancestry and the barrier it evades; the topology the
  # obstruction rests on.  None is formalized here and none proves the
  # result; the formal proof rebuilds every topological input over Mathlib.

  - title: "Nuclear C*-algebras: 99 problems"
    authors: [Christopher Schafhauser, Aaron Tikuisis, Stuart White]
    year: 2025
    type: paper
    id: https://arxiv.org/abs/2506.10902
    relationship: background
    note: >-
      Prints the question as Problem LIX.

