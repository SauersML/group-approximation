version: "v0.4"

project:
  name: "Non-MF Groups and a Simple C*-Algebra That Is Not K1-Injective"
  description: >-
    The project formalizes the one-sided Kazhdan compression criterion, its
    normal property-(T) MF-radical consequence, the rank-four Leavitt
    compression, the resulting non-MF group, and exact pullback formulas for
    MF radicals and MF quotients in the Carrión-Dadarlat-Eckhardt
    operator-norm sense. It also answers Problem LIX of Schafhauser, Tikuisis
    and White, "Nuclear C*-algebras: 99 problems" (arXiv:2506.10902) --- "Are
    all unital simple C*-algebras K1-injective?" --- negatively. The
    counterexample is a separable simple unital C*-algebra, an inductive limit
    of corner algebras of matrices over C(X, ℂ), carrying a unitary u that is
    not connected to 1 inside its unitary group while diag(u, 1) is already
    connected to 1 inside the unitary group of M2 over the algebra; so the
    class of u dies at the first stabilisation step, which is more than
    failure of injectivity of U(A)/U0(A) -> K1(A) requires.
  authors: [Sauers]
  responsible_maintainers: [SauersML]
  license: Apache-2.0

classification:
  arxiv: [math.OA, math.GR]
  msc2020: ["46L05", "46L80", "19K56"]

