  # push by .github/workflows/palomar-check.yml (first green: runs 34285122501
  # and 34457861307); `sorry_count: 0` means the closure contains no `sorryAx`.
  scope: >-
    A Lean 4 development over Mathlib with two Comparator submission surfaces.
    Palomar/Challenge.lean states, in a Mathlib-only module with its own
    definitions of normalized Hamming distance, soficity and the MF property,
    that one explicitly presented eight-generator group is sofic in normalized
    Hamming distance and not MF in the sequential operator-norm sense;
    Palomar/Solution.lean proves this from the development.
    Palomar/LIXChallenge.lean states, in a second Mathlib-only module with its
    own definitions of the corner matrix diag(a, 1, ..., 1) and of
    K1-injectivity, that not every nontrivial simple unital C*-algebra is
    K1-injective, that the counterexample can be taken separable, and that it
    can be taken to fail K1-injectivity at the first stabilisation;
    Palomar/LIXSolution.lean proves these from the development. Each
    configuration is one submission. Nothing else in the repository is
    certified by these entries.
  main_results:
    - declaration: ExplicitNonMF.explicit_sofic_not_MF
      file: Palomar/Solution.lean
      sorry_count: 0
      axioms: [propext, Classical.choice, Quot.sound]
      comparator_config: Palomar/comparator.json

    - declaration: ProblemLIX.not_all_simple_unital_k1Injective
