fidelity:
  divergences: >-
    Groups range over Type 0. The metabelian and linear theorems state only the
    embedding into a finitely presented simple group, not the word-problem half of the
    Boone-Higman biconditional, which is Kuznetsov's classical direction. The linear
    self-similar theorem asks for a finitely presented self-similar group, which is
    stronger than the finitely generated one in the printed question; self-similarity
    is rendered as a subgroup of permutations of the rooted d-ary tree List (Fin d)
    that preserve lengths and contain every state of every element. The Steinberg
    group is given by generators x_ij(r) with the standard relations, with x_ii(r)
    set to 1. Residue-class-wise affine permutations are rendered as permutations g of
    Z with a modulus m such that c g(n) = a n + b on each residue class, with c nonzero.
    Kourovka 17.57 is stated without a quotient group: conjugation by the reflection
    preserves CT(Z), every automorphism of CT(Z) is conjugation by a permutation of Z in
    CT(Z) or in its coset through the reflection, and conjugation by the reflection is
    not inner; together these say that Out(CT(Z)) is cyclic of order two, generated by
    that class. In Kourovka 17.60, 17.61 and 21.75 a set P of odd primes is a Set of
    natural numbers (with P.Finite in 17.61), and CT_P(Z) is generated by the class
    transpositions whose two moduli have only prime factors in P together with 2. Kourovka
    21.75 is stated for all pairs of sets, which contains the pairs of the printed question.
    Kohl's factorization conjecture is stated as the equality of the set of
    residue-class-wise affine permutations with the subgroup generated by the three series;
    the subgroup and the monoid they generate coincide, since the inverse of a class shift
    is its conjugate by the class reflection of the same class. For BFFHZ Question 3.1, a
    group satisfying the permutational Boone-Higman conjecture is rendered as a group that
    embeds in a group admitting an action of type (A), as in BFFHZ Section 1; the solvable word
    problem that their terminology also carries is not stated, and the vertex groups are
    not required to be finitely generated. The graph product is the free product of the
    vertex groups modulo the normal closure of the commutators of elements of adjacent
    vertex groups, over a SimpleGraph on a finite vertex type. The Question 3.3 theorem
    asserts the negative answer, the existence of a finitely presented simple group
    whose mixed identities are not finitely normally generated.

