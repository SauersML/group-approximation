status:
  scope: >-
    This no-`sorry` Comparator selection verifies the explicit presentation,
    the marked word's nontrivial central involution properties, six-generation,
    soficity, hyperlinearity, uniform and asymptotic operator-norm
    invisibility, failure of MF, and invisibility in all finite-dimensional
    linear representations and finite quotients.  It excludes the repository's
    C*-algebraic, quotient, general obstruction and undecidability results.
    Exactness of the reduced group C*-algebra is not formalized or claimed.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

