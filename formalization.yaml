  # Axiom closures computed by scripts/PalomarAxioms.lean,
  # scripts/PalomarLIXAxioms.lean, scripts/PalomarBowenChapmanAxioms.lean,
  # scripts/PalomarPestov91Axioms.lean, scripts/PalomarTypeA2Axioms.lean,
