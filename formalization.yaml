version: v0.4
project:
  name: A Counterexample to the Trace Problem for Uniform Tracial Completions
  description: >-
    We formalize a negative answer to Problem XXII of Schafhauser, Tikuisis and White.
    There is a separable unital C*-algebra A with nonempty compact tracial state space
    such that its uniform tracial completion M has a tracial state that is discontinuous
    in the uniform 2-norm. Thus the canonical extensions of the traces of A form a proper
    subset X of the traces of M. A second theorem gives a factorial tracially complete
    pair (M, X) with the same failure, answering Question 1.1 of Carrion, Castillejos,
    Evington, Gabe, Schafhauser, Tikuisis and White negatively. In both statements, X is
    exactly the set of uniform-2-norm-continuous traces. The proof uses a unitized c0-sum
    of antipodally covariant matrix-function algebras of growing rank and dimension. Borsuk-Ulam
    supplies finite coordinate-state constraints; weak-star compactness produces a corona
    trace detecting a sequence whose uniform 2-norm tends to zero. Both selected Lean theorems
    are unconditional. The completion is characterized by tracial completeness, unique
    restriction of designated traces to all base traces, and density in the uniform 2-norm.
  authors:
  - Sauers
  responsible_maintainers:
  - SauersML
  license: Apache-2.0
classification:
