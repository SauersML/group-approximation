# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

# This metadata describes Palomar/comparator-boone-higman.json only: stage 1 of the
# Boone-Higman megasubmission, whose three theorems are proved outright.
project:
  name: "Printed Questions around the Boone-Higman Conjecture, Stage 1"
  description: >-
    Answers to three printed open questions, stated in Mathlib's vocabulary and proved
    outright. First, an explicit finitely presented group containing every GL_n(Q): the
    Steinberg group St_10(R_L) of a six-generator, nine-relation ring R_L (Kourovka
    Notebook 14.10(c); Belk, Bleak, Matucci and Zaremsky, Problem 2.7). Second, Kohl's
    class transposition group CT(Z) is exactly the group of residue-class-wise affine
    permutations of Z that fix the nonnegative integers setwise (Kourovka Notebook 17.59).
    Third, Kohl's factorization conjecture: every residue-class-wise affine permutation of
    Z is a product of class shifts, class reflections and class transpositions (RCWA
    package manual, chapter 2).
  authors: [Sauers]
  responsible_maintainers: [SauersML]
  license: Apache-2.0

classification:
  arxiv: [math.GR, math.RA, math.KT]
  msc2020: ["20F05", "19C09", "20B07", "20H20"]

sources:
  - title: Explicit finitely presented overgroups and class transposition groups
    type: original-proof
    relationship: other
    contributors:
      - name: Claude (Anthropic)
        role: developed the arguments, the Lean development and the prose of this submission under the user's direction
    note: >-
      The answers were found and written up in this repository under the user's direction.
      Their proofs are internal and have not had external expert review; bounded literature
      searches found no earlier answers, which is not a certification of priority. They rest
      on the work of others, notably the theory of Steinberg groups and Leavitt algebras and
      Kohl's theory of residue-class-wise affine groups.

  - title: Progress around the Boone-Higman Conjecture
    authors: [James Belk, Collin Bleak, Francesco Matucci, Matthew C. B. Zaremsky]
    year: 2023
    type: paper
    id: https://arxiv.org/abs/2306.16356
    location: Problem 2.7 (version 3)
    relationship: background
    note: >-
      Asks for an explicit finitely presented group containing GL_n(Q), the question
      answered by explicit_fp_overgroup_of_all_gl_n_q.

  - title: "Unsolved Problems in Group Theory. The Kourovka Notebook"
    authors: [E. I. Khukhro, V. D. Mazurov]
    year: 2026
    type: paper
    id: https://arxiv.org/abs/1401.0300
    location: Problems 14.10(c) (P. de la Harpe) and 17.59 (S. Kohl)
    relationship: background
    note: >-
      Records Problem 14.10(c), an explicit finitely presented group containing GL_n(Q), and
      Problem 17.59, whether CT(Z) is the group of residue-class-wise affine permutations
      fixing the nonnegative integers setwise.

  - title: "RCWA: Residue-Class-Wise Affine Groups (GAP package manual)"
    authors: [Stefan Kohl]
    type: other
    id: https://docs.gap-system.org/pkg/rcwa/doc/chap2.html
    location: Chapter 2
    relationship: background
    note: >-
      States the conjecture that every residue-class-wise affine permutation of Z factors
      into class shifts, class reflections and class transpositions, and defines the three
      series.

