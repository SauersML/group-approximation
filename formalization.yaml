# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Non-MF Groups and a Simple C*-Algebra That Is Not K1-Injective"
  description: >-
    The project formalizes the one-sided Kazhdan compression criterion, its
    normal property-(T) MF-radical consequence, the rank-four Leavitt
    compression, the resulting non-MF group, and exact pullback formulas for
    MF radicals and MF quotients in the Carrión-Dadarlat-Eckhardt
    operator-norm sense. It also answers Problem LIX of Schafhauser, Tikuisis
    and White, "Nuclear C*-algebras: 99 problems" (arXiv:2506.10902) --- "Are
    all unital simple C*-algebras K1-injective?" --- negatively. The
    counterexample is a separable simple unital C*-algebra, an inductive limit
    of corner algebras of matrices over C(X, ℂ), carrying a unitary u that is
    not connected to 1 inside its unitary group while diag(u, 1) is already
    connected to 1 inside the unitary group of M2 over the algebra; so the
    class of u dies at the first stabilisation step, which is more than
    failure of injectivity of U(A)/U0(A) -> K1(A) requires.
  authors: [Sauers]
  responsible_maintainers: [SauersML]
  license: Apache-2.0

classification:
  arxiv: [math.OA, math.GR]
  msc2020: ["46L05", "46L80", "19K56"]

sources:
  - title: A simple C*-algebra that is not K1-injective
    type: original-proof
    relationship: other
    note: >-
      The negative answer to STW Problem LIX of Palomar/comparator-lix.json is
      first presented in this project. The argument was committed to this
      public repository on 2026-09-05 04:40 UTC (fb38f13ad), posted publicly
      on 2026-09-07 (https://x.com/Sauers_/status/2096961149770043897), and
      its Lean endpoint not_problemLIX landed on 2026-09-07 (aa9ba0148).

  - title: Non-MF Groups
    type: original-proof
    relationship: other
    note: >-
      The sofic-not-MF group of Palomar/comparator.json is first presented in
      this project.

  # Background for the LIX result, in four groups: the problem and its
  # history; the positive results the counterexample had to avoid; the
  # construction's ancestry and the barrier it evades; the topology the
  # obstruction rests on.  None is formalized here and none proves the
  # result; the formal proof rebuilds every topological input over Mathlib.

  - title: "Nuclear C*-algebras: 99 problems"
    authors: [Christopher Schafhauser, Aaron Tikuisis, Stuart White]
    year: 2025
    type: paper
    id: https://arxiv.org/abs/2506.10902
    relationship: background
    note: >-
      Problem LIX, "Are all unital simple C*-algebras K1-injective?", printed
      as open; the LIX result of this project answers it negatively.

  - title: K-Theory for Operator Algebras
    authors: [Bruce Blackadar]
    year: 1998
    type: book
    id: https://doi.org/10.1017/9781009701907
    relationship: background
    note: >-
      Second edition, MSRI Publications 5, Cambridge University Press. Example
      8.1.2(d) is the classical nonsimple failure, after Araki-James-Thomas:
      uv and vu in different components of U1(A) while diag(uv,1) and
      diag(vu,1) share a component of U2(A). Following 8.1.3 the book records
      that for simple unital A the map U1(A)/U1(A)0 -> K1(A) being an
      isomorphism "remains an open problem"; that is the question STW later
      printed as Problem LIX.

  - title: Homotopy-abelian Lie groups
    authors: [S. Araki, I. M. James, Emery Thomas]
    year: 1960
    type: paper
    id: https://doi.org/10.1090/s0002-9904-1960-10487-9
    relationship: background
    note: >-
      Bull. Amer. Math. Soc. 66:324-326. The homotopy fact behind Blackadar's
      Example 8.1.2(d): the first instance of a unitary class killed by one
      stabilisation, in a nonsimple algebra.

  - title: K-theory for certain C*-algebras
    authors: [Joachim Cuntz]
    year: 1981
    type: paper
    id: https://doi.org/10.2307/1971137
    relationship: background
    note: >-
      Ann. of Math. (2) 113:181-197. Purely infinite simple C*-algebras are
      K1-bijective, so the counterexample cannot be purely infinite.

  - title: The homotopy groups of the unitary groups of noncommutative tori
    authors: [Marc A. Rieffel]
    year: 1987
    type: paper
    relationship: background
    note: >-
      J. Operator Theory 17(2):237-254. STW cite its Theorem 2.10 for stable
      rank one implying K1-injectivity, so the counterexample cannot have
      stable rank one. Rieffel's earlier "Dimension and stable rank in the
      K-theory of C*-algebras" (Proc. London Math. Soc. (3) 46(2):301-333,
      1983) introduced stable rank and is what STW cite for cancellation; the
      K1-injectivity theorem number they give belongs to the 1987 paper.

  - title: >-
      Approximation by normal elements with finite spectra in C*-algebras of
      real rank zero
    authors: [Huaxin Lin]
    year: 1996
    type: paper
    id: https://doi.org/10.2140/pjm.1996.173.443
    relationship: background
    note: >-
      Pacific J. Math. 173(2):443-489. STW cite its Lemma 2.1 for
      K1-injectivity at real rank zero, so the counterexample cannot have real
      rank zero either.

  - title: Nonstable K-theory for Z-stable C*-algebras
    authors: [Xinhui Jiang]
    year: 1997
    type: paper
    id: https://arxiv.org/abs/math/9707228
    relationship: background
    note: >-
      Z-stable C*-algebras are K-stable, in particular K1-injective, so the
      counterexample is not Z-stable and lies outside the classifiable
      regime.

  - title: Nonstable K-theory for operator algebras
    authors: [Klaus Thomsen]
    year: 1991
    type: paper
    id: https://doi.org/10.1007/bf00569449
    relationship: background
    note: >-
      K-Theory 4:245-267. Introduces K-stability, the stabilisation of the
      groups pi_k(U(Mn(A))); the stage-two witness here is the sharpest
      failure of it, at n = 1 and k = 0.

  - title: Comparison of projections and unitary elements in simple C*-algebras
    authors: [Jesper Villadsen]
    year: 2002
    type: paper
    id: https://doi.org/10.1515/crll.2002.065
    relationship: background
    note: >-
      J. Reine Angew. Math. 549:23-45. Its Theorem 12 gives simple separable
      unital nuclear algebras that are not K1-surjective, which is the
      surjectivity analogue; STW record injectivity as the open direction, and
      that is the direction this project settles.

  - title: Simple C*-algebras with perforation
    authors: [Jesper Villadsen]
    year: 1998
    type: paper
    id: https://doi.org/10.1006/jfan.1997.3168
    relationship: background
    note: >-
      J. Funct. Anal. 154:110-116. The first simple inductive limit built to
      keep a topological obstruction alive through the limit; with the 1999
      paper, the architecture the construction here follows.

  - title: On the stable rank of simple C*-algebras
    authors: [Jesper Villadsen]
    year: 1999
    type: paper
    id: https://doi.org/10.1090/S0894-0347-99-00314-8
    relationship: background
    note: >-
      J. Amer. Math. Soc. 12(4):1091-1102. Simple inductive limits over
      products of projective spaces with point-evaluation summands; the
      template of the tower here, though no result of it is used.

  - title: A class of simple C*-algebras with stable rank one
    authors: [George A. Elliott, Toan M. Ho, Andrew S. Toms]
    year: 2009
    type: paper
    id: https://doi.org/10.1016/j.jfa.2008.08.001
    relationship: background
    note: >-
      J. Funct. Anal. 256:307-322. Simple diagonal AH limits have stable rank
      one, hence are K1-injective by Rieffel; this is the barrier that forces
      the point-evaluation blocks here to be twisted by a line bundle.

  - title: Tensorial permanence of K-stability for diagonal AH-algebras
    authors: [Apurva Seth]
    year: 2026
    type: paper
    id: https://doi.org/10.1112/blms.70398
    relationship: background
    note: >-
      Bull. London Math. Soc. 58 (arXiv:2512.04780). Simple infinite-dimensional
      unital diagonal AH algebras are K-stable; the same barrier as
      Elliott-Ho-Toms, sharpened to all of nonstable K-theory.

  - title: The stable homotopy of the classical groups
    authors: [Raoul Bott]
    year: 1959
    type: paper
    id: https://doi.org/10.2307/1970106
    relationship: background
    note: >-
      Ann. of Math. (2) 70:313-337. pi_4(U(2)) = Z/2 and pi_4(U(3)) = 0, the
      unstable class the witness is built from. The formal proof exhibits the
      clutching map directly and never computes a homotopy group.

  - title: Vector Bundles and K-Theory
    authors: [Allen Hatcher]
    year: 2017
    type: book
    id: https://pi.math.cornell.edu/~hatcher/VBKT/VB.pdf
    relationship: background
    note: >-
      Version 2.2. Clutching functions (1.2), projective-space K-theory (2.3)
      and the Euler/top-Chern identity (Prop. 3.13), as used by the integral
      argument of the source manuscript.

  - title: Characteristic Classes
    authors: [John W. Milnor, James D. Stasheff]
    year: 1974
    type: book
    id: https://doi.org/10.1515/9781400881826
    relationship: background
    note: >-
      Annals of Mathematics Studies 76. Thom class, mod-2 characteristic
      classes and the Wu formula for Steenrod squares, the three tools of the
      formalised mod-2 route; each is rebuilt from scratch in the development.

  - title: Cohomology Operations
    authors: [N. E. Steenrod, D. B. A. Epstein]
    year: 1962
    type: book
    id: https://doi.org/10.1515/9781400881673
    relationship: background
    note: >-
      Annals of Mathematics Studies 50. The Steenrod squares and their axioms;
      the development constructs them by cup-i products on singular cochains
      and proves naturality, the Cartan formula and instability itself.

  - title: Les i-carrés dans une variété grassmannienne
    authors: [Wen-Tsün Wu]
    year: 1950
    type: paper
    id: https://doi.org/10.1142/9789812791085_0003
    relationship: background
    note: >-
      C. R. Acad. Sci. Paris 230 (1950); the identifier is the reprint in
