# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: >-
    Answers to Nine Open Questions on Groups and C*-Algebras
  description: >-
    This project formalizes, in Lean 4 over Mathlib, answers to nine open
    questions on groups, group actions, group rings and C*-algebras. Each
    answer has its own Comparator configuration in Palomar/, and all of them
    share one Lean development.

    Gromov and Weiss proved that every sofic group is surjunctive.
    Ceccherini-Silberstein and Coornaert ask for the converse in 2010, as open
    problem (OP-11) of Cellular Automata and Groups, and Bowen and Chapman
    print it as Problem 1.1 of arXiv:2511.06586. The answer is no, already
    for a finitely generated group: the symmetric double of the pair
    Γ = EL₃(𝔽₂[x₁, x₂, x₃]) ≤ G = EL₃(𝔽₂[x₁^±¹, x₂^±¹, x₃^±¹]) ⋊ EL₃(ℤ) is
    surjunctive, and by Kun and Thom's Theorem A, whose inputs are proved
    here rather than assumed, it is not sofic
    (Palomar/comparator-bowen-chapman.json).

    Blackadar's K-Theory for Operator Algebras (1998) records as open whether
    every unital simple C*-algebra is K1-injective, and Schafhauser, Tikuisis
    and White pose the question as Problem LIX of "Nuclear C*-algebras: 99
    problems" (arXiv:2506.10902). The answer is no: a separable simple unital
    C*-algebra A has a unitary u outside the connected component of 1 in U(A)
    with diag(u, 1) in the connected component of 1 in U(M2(A))
    (Palomar/comparator-lix.json).

    Ozawa asks in 2003, in About the QWEP conjecture (arXiv:math/0306067),
    whether a simple group with Kazhdan's property (T) can be hyperlinear,
    and Pestov prints the question, with the sofic form added, as Open
    question 9.1 of arXiv:0804.3968. The answer is yes, in both forms:
    EL₃(A), for the ring
    A = LC(X, 𝔽₂) ⋊ ℤ of a Toeplitz subshift X, is infinite, simple, has
    property (T) and is LEF, so it is sofic and hyperlinear
    (Palomar/comparator-pestov91.json).

    Fournier-Facio, Wu and Zaremsky ask, as Question 5.8 of arXiv:2603.24687,
    whether some action G ↷ S of type [A₂] has a quotient G/ker(G ↷ S) that
    is not finitely presented. The answer is yes, for a cover of Thompson's
    group F acting on the positive dyadic rationals
    (Palomar/comparator-type-a2.json).

    Guba asks, as Question 3.20 of arXiv:2305.07113, whether for a field K
    and every b in K[F], with F Thompson's group, the equation
    (1 − x₁) u = b v has a non-zero solution in K[F]. The answer is yes
    (Palomar/comparator-guba-thompson.json).

    Gao, Kunnawalkam Elayavalli and Patchell ask, as Question 4.2 of
    arXiv:2401.04945, whether commuting actions of countable groups on a
    countable set combine to a sofic action exactly when each of them is
    sofic. The answer is no: for a Kun-Thom pair Γ ≤ G, the two commuting
    actions of G on (G × G)/ΔΓ are sofic and the action of G × G they give is
    not (Palomar/comparator-gkp-commuting-actions.json).

    Schafhauser, Tikuisis and White ask, as Problem X(1) of the same list and
    after N. P. Brown, whether amenable traces on C*-algebras are necessarily
    quasidiagonal. The answer is no: the canonical trace of the maximal group
    C*-algebra of a group built in the development is amenable and not
    quasidiagonal (Palomar/comparator-stw-x1.json).

    Schafhauser, Tikuisis and White ask, as Problem XXII of the same list,
    whether for a C*-algebra A with non-empty compact trace space every trace
    on the uniform tracial completion of A is automatically continuous for the
    uniform 2-norm over T(A). Question 1.1 of Carrión, Castillejos, Evington,
    Gabe, Schafhauser, Tikuisis and White (arXiv:2310.20594) asks the same for
    every factorial tracially complete C*-algebra, and Problem XXII is its
    instance for the uniform tracial completion. The answer is no, in both
    forms: the development builds a separable C*-algebra whose uniform tracial
    completion is factorial tracially complete and carries a trace that is not
    continuous for the uniform 2-norm (Palomar/comparator-stw-xxii.json).

    Blanchard asks, as Question 5.4 of arXiv:1507.02535 (also arXiv:1312.7722),
    whether the Toeplitz algebra T(E_DD) of the Dixmier-Douady Hilbert module
    E_DD over the complex Hilbert cube is properly infinite. The answer is yes:
    T(E_DD) contains two isometries with mutually orthogonal range projections
    (Palomar/comparator-blanchard-toeplitz.json).
  authors: [Sauers]
  responsible_maintainers: [SauersML]
  license: Apache-2.0

classification:
  arxiv: [math.GR, math.DS, math.OA, math.KT]
  msc2020: ["20E06", "20E22", "20F65", "22D55", "37B15",
            "46L05", "46L80", "55R40"]

