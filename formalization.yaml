repository:
  role: substantive-development

status:
  scope: >-
    A Lean 4 development over Mathlib, with a Comparator submission surface for the three
    theorems of Palomar/comparator-boone-higman.json. Palomar/BooneHigmanChallenge.lean
    states them in a Mathlib-only module carrying its own copies of the definitions they
    mention; Palomar/BooneHigmanSolution.lean proves them from the development. The rest of
    the repository is not offered as certified by this entry.
  main_results:
    - declaration: BooneHigman.explicit_fp_overgroup_of_all_gl_n_q
      file: Palomar/BooneHigmanSolution.lean
      comparator_config: Palomar/comparator-boone-higman.json
    - declaration: BooneHigman.kourovka_17_59
      file: Palomar/BooneHigmanSolution.lean
