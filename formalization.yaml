version: "v0.4"

project:
  name: "MF radicals: saturation, total invisibility, and universal visible quotients"
  description: >-
    A calculus for what MF approximation forgets.  The MF radical of a group is
    the intersection of the kernels of its matrix-corona representations, and
    quotient by it is the universal MF-visible quotient.  The binary Leavitt
    Hilbert hotel gives an explicit Kazhdan elementary group equal to its own
    MF radical.  Total-radical groups are invisible normal absorbers: inserting
    one into an ambient presentation leaves exactly the quotient's MF-visible
    information, so arbitrary MF groups can be prescribed as visible
    quotients.  Their reduced group C-star algebras are MF black holes: every
    map to an MF C-star algebra is zero, and this persists through every
    unital over-algebra.  Its reduced algebra is moreover prime, primitive,
    and stably finite, while every nonzero quotient remains non-MF.  Total
    radical is also equivalent to pointwise
    collapse of all operator-norm asymptotic representations, yielding
    matricial stability, finite uniform collapse challenges, and strong
    compact and ergodic rigidity.  The explicit Hilbert-hotel group itself is
    infinite, simple, ICC, and Kazhdan, while finite presentations are
    characterized by a dimension-independent relator gap away from the
    trivial unitary tuple.  A cyclic amalgam with a singly normally generating
    invisible defect realizes any prescribed finitely presented MF group as
    the complete MF reflection of a finitely presented non-MF group.  Its
    semantic-closure formula controls every quotient, and a cyclic
    specialization makes one word decide MF throughout the whole quotient
    lattice.  Stable corona projections and finite projective modules are
    classified by eventual rank germs, giving exact Hilbert-hotel
    cancellation and vanishing of every finite projective corona module with
    a binary Leavitt action.  Finite root and Heisenberg windows retain exact
    additive and multiplicative multiplicity germs.  Faithful tracial
    dimension gives the parallel finite-projective Hilbert-hotel
    cancellation theorem.  The tracial self-copy theorem then identifies the
    macroscopic adjoint fixed sectors of a parent and its conjugate child.
    Two precise coherence goals remain: a finite-projective corona decoder
    that removes the Kazhdan hypotheses, and a positive-density tracial
    decoder that would close the nonhyperlinearity route.
  authors: [Sauers]
  responsible_maintainers: [SauersML]
  license: Apache-2.0

