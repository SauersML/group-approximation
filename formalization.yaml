fidelity:
  divergences: >-
    The certified statement concerns one explicitly presented group, not the
    general theorem of the manuscript. The registry recompiles the challenge
    against a frozen Mathlib and rejects project-local imports, so
    Palomar/Challenge.lean defines normalized Hamming distance, soficity and
    the MF property itself; these definitions are copies, not the
    development's. Soficity is approximation by permutations of finite sets in
    normalized Hamming distance. The MF property is stated in the sequential
    operator-norm form and negated; the manuscript uses the norm-matrix-corona
    form, and the equivalence of the two forms is proved in the development
    but is not part of the compared statement. The result certifies no
    quantitative defect bound and nothing about any other group.

    The LIX challenge has four divergences of the same kind. Simplicity is
    Mathlib's IsSimpleRing, which asks that the only two-sided ideals be zero
    and the whole algebra, while C*-simplicity asks this of closed ideals only;
    for a nontrivial unital C*-algebra the two agree, because a proper
    two-sided ideal of a unital Banach algebra misses a neighbourhood of the
    unit and so has proper closure, and the development proves this agreement
    (isSimpleCStar_iff_isSimpleRing). K1-injectivity is stated elementwise:
    every unitary whose stabilisation diag(u, 1, ..., 1) is null-homotopic in
    some Mn(A) is null-homotopic in A. This is the direct-limit description of
    the kernel of U(A)/U0(A) -> K1(A); no K1 group is constructed, so nothing
    about the value of K1(A) is certified. Mathlib's C*-structure on Mn(A)
    needs a partial order on A making it a star-ordered ring, and the
    challenge fixes this order to the spectral order. Such an order is
    determined by the star operation, so there is only one, but the compared
    statement fixes it instead of proving that. All algebras range over
    Type 0. K1-injectivity is universe-polymorphic, so quantifying over Type 0
    is weaker as a universal statement and stronger as its negation, and the
    counterexample is a separable algebra in Type 0.

