#
# Provenance metadata in the mathlib-initiative self-reporting format (v0.4),
# under the additional rules the Palomar registry applies to it.
#
# This file is the machine-readable version of what
# notes/CREDIT_AND_PRIORITY_AUDIT.md establishes at length: what is claimed,
# what is not, and where the trust surface ends.  Nothing here is a stronger
# claim than that document supports; where the two disagree, that document is
# the source of truth and this file is the bug.

version: "v0.4"

project:
  name: "An explicit finitely presented sofic group that is not MF"
  description: >-
    A countable discrete group is MF, in the sense of
    Carrion-Dadarlat-Eckhardt, if it embeds in the unitary group of a matrix
    quotient prod_n M_{d_n}(C) / oplus_n M_{d_n}(C); equivalently, if it
    admits finite-dimensional approximate unitary representations whose
    multiplicative defects vanish in OPERATOR norm and which separate distinct
    elements.  Some recent work uses the name MF for a stronger condition
    involving strong convergence, and the purely matricial field property is
    stronger again; this development concerns the operator-norm notion and
    does not address those.

    The verified theorem exhibits an explicit counterexample.  Let E be the
    group on the eight generators v1, v2, v3, x, y, z, t, c with the
    forty-one relators displayed in the challenge file -- twenty presenting
    the affine group Z^3 semidirect SL_3(Z), six making t conjugate that base
    onto its doubling image, seven making c an involution centralising it, and
    eight making the word w = [tct^-1, v1(tct^-1)v1^-1] central.  Machine
    checked: E is finitely presented and generated by six elements; w is a
    nontrivial central involution, its involutivity being derived rather than
    imposed; E is sofic and hyperlinear, so it has finite-dimensional models
    in the normalized Hamming and normalized Hilbert-Schmidt metrics; every
    operator-norm asymptotic unitary representation of E sends w to the
    identity, uniformly in the dimension for one fixed defect budget on one
    fixed finite test set; E is therefore not MF; and every finite-dimensional
    linear representation of E over every field, and every homomorphism from E
    to a finite group, also kills w, so E has no faithful finite-dimensional
    representation and is not residually finite.  Soficity and hyperlinearity
    therefore do not imply the MF property.

    The obstruction comes from property (T) of the base.  In an operator-norm
    asymptotic representation, one-sided conjugation by t preserves the
    asymptotic commutant of the base in normalized Hilbert-Schmidt norm, and w
    is the square of a commutator that this invariance forces to converge to
    1; compressing to the (-1)-spectral corner of a surviving w contradicts
    that.

    The repository and the accompanying manuscript carry further results that
    this Comparator configuration does NOT verify and that would each be a
    separate entry: the reduced group C*-algebra of E is separable, stably
    finite and not MF; the canonical trace on its maximal group C*-algebra is
    hyperlinear but not MF; the quotient of E by the subgroup generated by w
    is again not MF; the general obstruction criteria of which E is an
    instance; and the undecidability of MF recognition for finite
    presentations.

  authors:
    - SauersML
  responsible_maintainers:
    - SauersML
  license: Apache-2.0

classification:
  # The subject classes of the accompanying manuscript, restricted to those
  # the selected theorem actually touches.  Decision problems are deliberately
  # not among them: the undecidability corollary is not part of this
  # configuration.
  arxiv: [math.OA, math.GR]
  msc2020: ["46L05", "20F05", "22D25", "20E26"]

sources:
  # Result origin.  The theorem is first presented by this work, so exactly
  # one entry carries `type: original-proof` and every other source is
  # context rather than the recorded result.
  - title: >-
      An explicit finitely presented sofic group that is not MF, and the
      central-involution obstruction behind it
    type: original-proof
    relationship: other
    note: >-
      First presentation of the result.  A literature search was carried out
      on 2026-08-19 over arXiv and the published record for a group known not
      to be MF in the operator-norm sense of Carrion-Dadarlat-Eckhardt.  It
      found the question recorded as open rather than answered: Shulman
      (arXiv:2603.13564, March 2026) states that no group C*-algebra was then
      known to fail the MF property, and Bachner-Dogon-Lubotzky (2026)
      describe whether every group is MF as a longstanding open problem.  No
      counterexample was found.  That search is not exhaustive and confers no
      priority; the novelty of the formalization itself is unknown.

      What is claimed as new is narrow and is stated as such in
      notes/CREDIT_AND_PRIORITY_AUDIT.md: the stably finite Kazhdan pinning of
      the conjugation representation inside a norm matrix corona, and the
      central-corner marked-word device that turns that pinning into a group
      element killed by every MF representation.  The surrounding compression
      and lamp architecture is NOT claimed; see the OpenAI and Kun-Thom
      entries below.

  - title: On groups with quasidiagonal C*-algebras
    authors: [José R. Carrión, Marius Dadarlat, Caleb Eckhardt]
    year: 2013
    type: paper
    id: https://arxiv.org/abs/1210.4050
    relationship: background
    note: >-
      Supplies the group-MF definition formalized here, and the fact that
      groups locally embeddable into finite groups are MF, which is what makes
      the failure of that property a consequence of the theorem rather than an
      extra hypothesis.

  - title: Generalized inductive limits of finite-dimensional C*-algebras
    authors: [Bruce Blackadar, Eberhard Kirchberg]
    year: 1997
    type: paper
    id: https://doi.org/10.1007/s002080050039
    relationship: background
    note: >-
      Introduces MF algebras, the C*-algebraic notion the group property is
      named after.

  - title: The MF property for amalgamated free products
    authors: [Tatiana Shulman]
    year: 2026
    type: paper
    id: https://arxiv.org/abs/2603.13564
    relationship: background
    note: >-
      Uses exactly the MF definition formalized here, and records in March
      2026 that no group C*-algebra was known not to be MF.  It is the
      contemporaneous evidence for the state of the question, cited above in
      the literature search.

  - title: On L^1-approximation of groups
    authors: [Ben Bachner, Alon Dogon, Alexander Lubotzky]
    year: 2026
    type: paper
    id: https://doi.org/10.1016/j.jalgebra.2026.04.041
    relationship: background
    note: >-
      Supplies the operator-norm rounding, compression and polar-correction
      procedure that the obstruction reuses, and describes whether every group
      is MF as a longstanding open problem.  It also proposes groups of
      Deligne type -- those in which a central element dies in every finite
      quotient -- as the natural candidates for the remaining approximation
      problems, and the group here is one.

  - title: >-
      Nonsofic groups exist, in "Ten advances in mathematics and theoretical
      computer science", Chapter 3, 78-95
    authors: [OpenAI]
    year: 2026
    type: other
    id: https://cdn.openai.com/pdf/ten-proofs-oai.pdf
    relationship: background
    note: >-
      The first nonsofic group, 2026-08-01, and the origin of the compression
      and lamp architecture that the present construction shares one
      ingredient with: a property-(T) subgroup conjugated into itself.  That
      architecture is NOT claimed here.  The analytic mechanism differs, since
      in the operator-norm setting what is exploited is preservation of the
      asymptotic commutant in normalized Hilbert-Schmidt norm.

  - title: Nonsofic wreath products of residually finite groups
    authors: [Gábor Kun, Andreas Thom]
    year: 2026
    type: paper
    id: https://arxiv.org/abs/2608.06222
    relationship: background
    note: >-
      Builds on the OpenAI chapter.  The compression-semigroup formulation
      used by the intrinsic form of the obstruction in this repository follows
      its terminology.

  - title: On sofic groups
    authors: [Gábor Elek, Endre Szabó]
    year: 2006
    type: paper
    id: https://arxiv.org/abs/math/0305352
    relationship: background
    note: >-
      The permanence theorem for extensions with amenable quotient, behind the
      soficity clause.  It is proved in this repository rather than assumed.

  - title: >-
      Presentations for 3-dimensional special linear groups over integer rings
    authors: [Marston D. E. Conder, Edmund F. Robertson, Peter Williams]
    year: 1992
    type: paper
    id: https://doi.org/10.2307/2159559
    relationship: background
    note: >-
      The eight-relator presentation of SL_3(Z) used by the first eight of the
      twenty base relators.  The identification of the base with
      Z^3 semidirect SL_3(Z) rests on this citation; the soficity argument is
      deliberately independent of it, and the corresponding formal proof is
      likewise free of that input.

  - title: Kazhdan's property (T)
    authors: [Bachir Bekka, Pierre de la Harpe, Alain Valette]
    year: 2008
    type: book
    relationship: background
    note: >-
      Property (T) of the affine group Z^3 semidirect SL_3(Z)
      (Example 1.7.4(i)), which is the hypothesis the whole obstruction runs
      on, and the Delorme-Guichardet theorem used elsewhere in the
      development.

related_formalizations: []

status:
  scope: >-
    Verified by this Comparator configuration, unconditionally and with no
    `sorry`: the explicit forty-one-relator presentation; nontriviality,
    centrality and involutivity of the marked word; a generating set of size
    at most six; soficity and hyperlinearity; triviality of the marked word in
    every operator-norm asymptotic unitary representation, and its uniform
    finite form; failure of the MF property; and triviality of the marked word
    under every finite-dimensional representation over every field and every
    homomorphism to a finite group.

    Proved in the repository but NOT part of this configuration: the
    C*-algebraic consequences for the reduced and maximal group C*-algebras
    and for the canonical trace, the non-MF quotient by the marked word, the
    general one-sided-conjugation transport theorem and the finite-normal,
    normal-Kazhdan and commuting-orbit obstruction criteria, and the
    Markov/Adian-Rabin undecidability corollary.

    Neither formalized nor claimed: exactness of the reduced group C*-algebra,
    which the manuscript deduces from a block normal form using permanence
    results (Dykema, Kirchberg-Wassermann, Guentner-Higson-Weinberger) that
    are literature inputs rather than machine-checked statements.  The
    manuscript marks that deduction as such.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: agent
      framework: Claude Code (Anthropic)
      tool_setup: >-
        AI-assisted throughout, and materially so.  Agent sessions authored
        the Lean against a remote build: the construction, the statements, the
        proofs, the supporting library, the manuscript prose, and this
        metadata were all produced that way, then gated by the checks
        described under `review`.  The mathematical route was developed in the
        same sessions rather than transcribed from an existing human proof.
  notes: >-
    Per-declaration attribution is in the git history.  The repository's own
    audit trail under notes/, research/ and metadata/ is more detailed than
    this field can be; notes/CREDIT_AND_PRIORITY_AUDIT.md is the account of
    what is claimed and what is inherited.

review:
  status: self-assessed
  reviewers: []
  notes: >-
    No independent human review of the mathematics, and no peer review.  The
    author is not claiming that a mathematician has checked this result.

    What is mechanical is exactly this: `lake build` with warnings as errors;
    a source scan forbidding sorry, admit, hand-declared axioms,
    compiler-backed decision procedures, unsafe escape hatches and proof
    budget overrides; `#audit_axioms` on the cited endpoints inside the build,
    which fails compilation unless the axiom closure is classical; a
    whole-corpus transitive axiom sweep over every declaration defined in the
    library; signature pinning of every manuscript-mapped declaration; an
    audit-surface measurement; a fresh-kernel `leanchecker` replay, with a
    weekly independent re-check through `lean4export` and the `nanoda` kernel;
    and, for this submission specifically, a gate comparing the challenge and
    solution as text and a second gate comparing the compared statement as
    elaborated in the two modules.

    None of that is a check on whether the informal argument is correct or
    whether the formal statements are the right formalizations of the printed
    ones.  That correspondence is carried by the claim map, the signature
    snapshots and the proof ledger, all of which are gated but all of which
    are ultimately human judgements.

fidelity:
  divergences: >-
    The compared statement expresses the MF property in its equivalent local
    operator-norm form -- approximate unitary representations with separation
    constant 1 -- rather than as an embedding into a matrix quotient, because
    the challenge file may import Mathlib only and Mathlib has no C*-algebra
    quotients.  Fixing the separation constant is not a weakening: for
    countable groups the local form is equivalent to the embedding form by
    tensor-power amplification.  Both equivalences are proved in this
    repository and packaged as
    `GroupApproximation.ManuscriptExactWrappers.manuscriptMFDefinitionEquivalences`;
    the embedding form of the endpoint is
    `GroupApproximation.LiteralNonMFEndpoint.manuscriptTheoremA`.

    The manuscript's proof of the commuting-orbit collapse theorem
    deliberately diverges from the Lean route, and the proof ledger records
    those steps as MISSING-by-design: the printed argument is a single-stage
    quantitative route chosen for readability, while the formalization takes a
    different decomposition.  Both are complete; neither is a transcription of
    the other, and metadata/NON_MF_PROOF_LEDGER.md says which rows are which.
    That theorem is not on the proof path of this configuration.

    The repository contains no `sorry` and no hand-declared axiom outside two
    pinned exceptions: the single planted defect in scripts/Audit/Plants.lean,
    which exists to calibrate the scans, and the deliberate hole in
    Palomar/Challenge.lean, which the comparator protocol requires the
    challenge statement to carry.  Both are pinned by exact path, line and
    source text in scripts/check.py.

