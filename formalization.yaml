  # Background for the Bowen-Chapman result: where the question was first
  # recorded and where it is printed as Problem 1.1, the two definitions the
  # challenge renders, the nonsofic mechanism and the explicit pair it is run
  # at, and the other nonsofic constructions.  The rows marked "other" are
  # inputs this development reproves in Lean rather than assumes; nothing is
  # imported from any of them.

  - title: Surjunctivity does not characterize cosoficity of invariant random subgroups
    authors: [Lewis Bowen, Michael Chapman]
    year: 2025
    type: paper
    id: https://arxiv.org/abs/2511.06586
    location: Problem 1.1
    relationship: background
    note: >-
      Prints the question answered here as Problem 1.1 ([Gro99, Wei00]), "Are
      all surjunctive groups sofic? Namely, does surjunctivity characterize
      soficity?", presenting it as a problem arising from the work of Gromov
      and Weiss, for finitely generated groups and finite sets of colours
      (section 1, footnote 1), which is the setting of
      BowenChapman.exists_finitelyGenerated_surjunctive_not_sofic. The paper's
      own Theorem 1.2 answers the analogous question for invariant random
      subgroups of a finitely generated free group, which leaves the question
      for groups untouched.

  - title: On approximation properties of semidirect products of groups
    authors: [Goulnara Arzhantseva, Światosław R. Gal]
    year: 2020
    type: paper
    id: https://doi.org/10.5802/ambp.386
    location: p. 127
    relationship: background
    note: >-
      Ann. Math. Blaise Pascal 27(1):125-130; arXiv:1312.7682, v1 2013-12-30.
      Page 127 records the question answered here as open: "It is still
      unknown whether every group is surjunctive and whether there exists a
      non-sofic surjunctive group." The paper proves that a
      split extension with a finitely generated residually finite kernel and a
      surjunctive quotient is surjunctive, which settles the direct product of
      a surjunctive group with the integers, and records on page 128 (v1 page
      4), attributing the question to Weiss 2000, that the product of two arbitrary
      surjunctive groups remains open for direct and free products alike, the
      free product with the integers included. The free-product case was still
      stated as a conjecture by Doucha and Gismatullin in Groups Geom. Dyn. 16
      (2022), Conjecture 3.12, and we have found no later resolution. Their
      split-extension theorem is an alternative route to surjunctivity of the
      ambient group and is not the route taken here: this development proves
      the ambient group residually finite outright.

  - title: On dual surjunctivity and applications
    authors: [Michal Doucha, Jakub Gismatullin]
    year: 2022
    type: paper
    id: https://doi.org/10.4171/GGD/681
    location: Conjecture 3.12
    relationship: background
    note: >-
      Groups Geom. Dyn. 16 (2022), 943-961; arXiv:2008.10565, where the
      conjecture is numbered 3.10. Conjectures that the free product of the
      integers with a surjunctive group is surjunctive, and likewise for dual
      surjunctivity, which is the free-product case Arzhantseva and Gal record
      as open.

  - title: Some general dynamical notions
    authors: [Walter Gottschalk]
    year: 1973
    type: paper
    id: https://doi.org/10.1007/BFb0061728
    location: pages 120-125
    relationship: background
    note: >-
      Recent Advances in Topological Dynamics, Lecture Notes in Mathematics
      318, 120-125. Introduces surjunctivity and the surjunctivity conjecture,
      and is the published record of Lawton's theorem that residually finite
      groups are surjunctive.

  - title: Note on symbolic transformation groups
    authors: [Wayne Lawton]
    year: 1972
    type: other
    id: Notices of the American Mathematical Society 19 (1972), A-375
    relationship: background
    note: >-
      The abstract to which Gottschalk and, after him, Ceccherini-Silberstein
      and Coornaert credit the theorem that residually finite groups are
      surjunctive. That theorem is what makes the witness surjunctive, and it
      is proved in this development as
      Surjunctivity.isSurjunctive_of_residuallyFinite: the ambient group is
      residually finite, hence surjunctive, and surjunctivity passes to the
      symmetric double. The 1972 abstract is not available online, and the
      attribution here is taken from those two sources.

  - title: Endomorphisms of symbolic algebraic varieties
    authors: [Misha Gromov]
    year: 1999
    type: paper
    id: https://doi.org/10.1007/PL00011162
    relationship: background
    note: >-
      J. Eur. Math. Soc. 1(2):109-197. Sofic groups are surjunctive, the
      implication whose converse Problem 1.1 asks about. Bowen and Chapman
      present Problem 1.1 as arising from this paper and Weiss's.

  - title: Sofic groups and dynamical systems
    authors: [Benjamin Weiss]
    year: 2000
    type: paper
    relationship: background
    note: >-
      Sankhya Ser. A 62(3):350-359. Names sofic groups and proves that they are
      surjunctive. Bowen and Chapman present Problem 1.1 as arising from this
      paper and Gromov's, and Arzhantseva and Gal cite it for the question
      whether a product of two surjunctive groups is surjunctive.

  - title: Sofic groups and direct finiteness
    authors: [Gabor Elek, Endre Szabo]
    year: 2004
    type: paper
    id: https://doi.org/10.1016/j.jalgebra.2004.06.023
    relationship: background
    note: >-
      J. Algebra 280(2):426-434. The permutation form of soficity, with the
      normalized Hamming distance on a finite set, that the Bowen-Chapman
      challenge renders as IsSoficGroup. The Pestov 9.1 challenge uses the same
      IsSoficGroup block.

  - title: "Hyperlinear and sofic groups: a brief guide"
    authors: [Vladimir G. Pestov]
    year: 2008
    type: paper
    id: https://doi.org/10.2178/bsl/1231081461
    location: Theorem 3.5 and Open question 9.1, p. 21
    relationship: background
    note: >-
      Bull. Symbolic Logic 14(4):449-480; arXiv:0804.3968. Theorem 3.5 is the
      textbook permutation definition of soficity, and section 6 surveys
      Gottschalk's surjunctivity conjecture and Gromov's theorem. The survey
      records only the forward implication of Gromov's theorem and does not
      pose the converse. Section 9, page 21 of arXiv v8, prints the question
      checked by Palomar/comparator-pestov91.json, Ozawa's question of 2003
      with the sofic form added: "Open question 9.1 (Cf. Ozawa [64]). Let G
      be an infinite simple group with Kazhdan's property (T). Can it be
      hyperlinear (sofic)?"; Theorems 3.5 and 3.6 are the
      finite-set criteria that the challenge's IsSoficGroup and
      IsHyperlinearGroup imply.

  - title: Cellular Automata and Groups
    authors: [Tullio Ceccherini-Silberstein, Michel Coornaert]
    year: 2010
    type: book
    id: https://doi.org/10.1007/978-3-642-14034-1
    location: Open Problems, p. 417
    relationship: background
    note: >-
      Springer Monographs in Mathematics. The notes to Chapter 3 (p. 68) are
      the reference for the attribution to Lawton, and Theorem 7.8.1 (p. 272)
      for the theorem of Gromov and Weiss that every sofic group is
      surjunctive. The
      Curtis-Hedlund-Lyndon theorem and the textbook facts on surjunctivity
      used here are proved in this development rather than imported, the
      bridge between the two descriptions of a cellular automaton as
      Surjunctivity.isFiniteMemory_of_continuous_equivariant. Its list of open
      problems asks the question this project answers, on page 417: "(OP-11)
      Does there exist a surjunctive group which is non-sofic?", fifteen years
      before Bowen and Chapman print it as Problem 1.1. The second edition
      (2023, doi:10.1007/978-3-031-43328-3) reprints it on page 527, still
      marked open.

  - title: On sofic approximations of Property (T) groups
    authors: [Gabor Kun]
    year: 2019
    type: paper
    id: https://arxiv.org/abs/1606.04471
    location: Theorem 1
    relationship: other
    note: >-
      Bowen's conjecture: every sofic approximation of a countable property (T)
      group is, after a negligible modification, a disjoint union of expanders.
      Kun and Thom cite it as their [13, Theorem 1] and the OpenAI chapter
      builds on it. It is the expander decomposition the whole mechanism rests
      on, and it is proved in this development, in GroupApproximation/Kun.

  - title: Inapproximability of actions and Kazhdan's property (T)
    authors: [Gabor Kun, Andreas Thom]
    year: 2019
    type: paper
    id: https://arxiv.org/abs/1901.03963
    relationship: other
    note: >-
      Rigidity of almost automorphisms of expander sofic approximations of
      property (T) groups: soficity forces the centralizing subgroup to be
      locally embeddable into finite groups. Proved in this development.

  - title: Nonsofic wreath products of residually finite groups
    authors: [Gabor Kun, Andreas Thom]
    year: 2026
    type: paper
    id: https://arxiv.org/abs/2608.06222
    location: Theorem A, Theorem E, Theorem 4.1
    relationship: other
    note: >-
      Defines infranormality, that the compression semigroup of the subgroup
      generates the ambient group. Theorem A (v3, 2026-08-20) gives that for an
      infranormal, non-normal subgroup with both groups Kazhdan the generalized
      wreath product and the group double are nonsofic; the double first
      appears in v2 (2026-08-19), as Theorem B. Theorem E supplies the explicit
      residually finite Kazhdan pairs Γ = EL_r(F_q[x_1, ..., x_d]) inside
      G = EL_r(F_q[x_1^±1, ..., x_d^±1]) ⋊ SL_d(Z), for q a prime power and
      r, d at least 3, and the witness used here is the q = 2, r = d = 3
      member, with the acting group SL_3 of the integers, which is EL_3.
      Theorem 4.1, the permutation centralizer normalization
      theorem behind Theorem A, is proved in this development in a general
      sequential form, for an arbitrary countable Kazhdan group with a Kazhdan
      infranormal subgroup, and the nonsoficity of the double is derived from
      it here. Kun and Thom mention surjunctivity only in recalling Gromov's
      theorem, cite neither Gottschalk nor Bowen and Chapman, and do not
      observe that these doubles are surjunctive.

  - title: Property (T) for noncommutative universal lattices
    authors: [Mikhail Ershov, Andrei Jaikin-Zapirain]
    year: 2010
    type: paper
    id: https://doi.org/10.1007/s00222-009-0218-2
    location: Theorem 1.1
    relationship: other
    note: >-
      Invent. Math. 179(2):303-347. Property (T) for elementary groups of rank
      at least three over finitely generated rings, which is what gives both
      groups of the pair property (T). For Pestov 9.1 it gives property (T)
      to EL_3 of the crossed-product ring of the witness, and so to its
      quotients (Theorem 1.1, arXiv:0809.4095v2, p. 1). Proved in this
      development.

  - title: "Kazhdan's Property (T)"
    authors: [Bachir Bekka, Pierre de la Harpe, Alain Valette]
    year: 2008
    type: book
    id: https://doi.org/10.1017/CBO9780511542749
    location: Definition 1.1.3, Example 1.7.4 and Proposition 1.7.6
    relationship: background
    note: >-
      New Mathematical Monographs 11, Cambridge University Press. Property (T)
      for SL_d of the integers and its stability under extensions, which is
      what Kun and Thom use to make the semidirect product Kazhdan. This
      development proves its own semidirect-product theorem instead.
      Definition 1.1.3, the Kazhdan pair, is what Palomar/Pestov91Challenge.lean
      renders as IsKazhdanPair for a discrete group, with the strict inequality
      of Definition 1.1.1.

  - title: Ten Advances in Mathematics and Theoretical Computer Science
    authors: [OpenAI]
    year: 2026
    type: other
    id: https://cdn.openai.com/pdf/ten-proofs-oai.pdf
    location: Chapter 3, "Nonsofic groups exist"
    relationship: background
    note: >-
      Pages 78-95, updated 6 August 2026 at a stable URL. Chapter 3 gives the
      first nonsofic group, the unit group R× of the binary Leavitt algebra,
      built from Kun's expander decomposition and the Kun-Thom centralizer
      obstruction, and its mechanism is what Kun and Thom analyze. The same
      chapter, page 80, records the question answered here as open as of that
      date: "We do not know whether R× is surjunctive. A positive answer would
      produce a surjunctive nonsofic group", and it observes that the
      Bowen-Chapman example for invariant random subgroups "does not produce a
      surjunctive nonsofic group".

  - title: A torsion-free non-sofic group
    authors: [Francesco Fournier-Facio]
    year: 2026
    type: paper
    id: https://arxiv.org/abs/2608.02025
    relationship: background
    note: >-
      A second source of nonsofic groups from the same technical criterion,
      including torsion-free ones. It is not an input to the witness here, and
      it makes no surjunctivity claim.

  # Background for the Pestov 9.1 result: the origin of the question, the
  # nearest earlier object, the literature that records the question as open,
  # the known infinite simple Kazhdan groups, and the theorems whose cases the
  # witness needs. Rows marked "other" are reproved in Lean, not assumed.

  - title: About the QWEP conjecture
    authors: [Narutaka Ozawa]
    year: 2004
    type: paper
    id: https://doi.org/10.1142/S0129167X04002417
    location: Section 7, after Theorem 7.4, p. 527
    relationship: background
    note: >-
      Internat. J. Math. 15(5):501-530; arXiv:math/0306067v2, p. 26. The
      first printed form of the question, from 2003, which Pestov cites as
      [64] at Open question 9.1: "It is unknown whether there exists a
      simple property (T) group Γ which is hyperlinear." Context only.

  - title: >-
      Discrete groups with Kazhdan's property T and factorization property are
      residually finite
    authors: [Eberhard Kirchberg]
    year: 1994
    type: paper
    id: https://doi.org/10.1007/BF01459798
    location: Theorem 1.1
    relationship: background
    note: >-
      Math. Ann. 299:551-563. "A discrete group with property (F) and property
      T is residually finite" (p. 552), so an infinite simple Kazhdan group
      lacks property (F), the fact behind Ozawa's question. Context only.
      Corollary 1.2(v) is disproved by Thom (arXiv:0810.2180, Remark 1.6).

  - title: Examples of hyperlinear groups without factorization property
    authors: [Andreas Thom]
    year: 2010
    type: paper
    id: https://doi.org/10.4171/GGD/80
    location: Theorem 1.4
    relationship: background
    note: >-
      Groups Geom. Dyn. 4(1):195-208; arXiv:0810.2180v1, p. 4. The nearest
      earlier object: a finitely generated LEF Kazhdan group without the
      factorization property, non-hopfian and so not simple. Theorem 1.1
      recalls Kirchberg's theorem, and page 3 names the known sources of
      simple Kazhdan groups. Context only.

  - title: An introduction to hyperlinear and sofic groups
    authors: [Vladimir G. Pestov, Aleksandra Kwiatkowska]
    year: 2012
    type: paper
    id: https://doi.org/10.1017/CBO9781139208574.006
    location: Section 10
    relationship: background
    note: >-
      Appalachian Set Theory 2006-2012, Cambridge University Press, 145-186;
      arXiv:0911.4266v4, p. 28. Records the question as open: "it remains in
      particular unknown whether finitely generated simple Kazhdan groups can
      be hyperlinear/sofic." Context only.

  - title: Centralizers of sofic approximations of Kazhdan groups
    authors: [Vadim Alekseev, Andreas Thom]
    year: 2026
    type: paper
    id: https://arxiv.org/abs/2608.05362
    location: Section 5 and Open problem 6.1
    relationship: background
    note: >-
      v1, 2026-08-05. Section 5 lists the known sofic Kazhdan groups that are
      not residually finite and names no simple one. Open problem 6.1 asks:
      "Are there examples of finitely presented sofic groups with Kazhdan's
      property (T) that are not residually finite?" The witness is not finitely
      presented, so it leaves 6.1 open. Context only.

  - title: Simplicity and superrigidity of twin building lattices
    authors: [Pierre-Emmanuel Caprace, Bertrand Rémy]
    year: 2009
    type: paper
    id: https://doi.org/10.1007/s00222-008-0162-6
    relationship: background
    note: >-
      Invent. Math. 176(1):169-221; arXiv:math/0607664v2. Simple twin building
      lattices, of which "many of them are finitely presented and enjoy
      property (T)": the first known source of infinite simple Kazhdan groups.
      A finitely presented LEF group is residually finite, so none of the
      finitely presented ones is LEF. Context only.

  - title: Hyperbolic groups
    authors: [Misha Gromov]
    year: 1987
    type: paper
    id: https://doi.org/10.1007/978-1-4613-9586-7_3
    relationship: background
    note: >-
      Essays in Group Theory, MSRI Publications 8, Springer, 75-263. Infinite
      simple Kazhdan groups as quotients of hyperbolic Kazhdan groups, cited by
      Pestov at Question 9.1 ([37]) and by Ozawa. Context only.

  - title: On algebraic properties of topological full groups
    authors: [Rostislav Grigorchuk, Konstantin Medynets]
    year: 2014
    type: paper
    id: https://doi.org/10.1070/SM2014v205n06ABEH004400
    location: Theorem 2.6
    relationship: background
    note: >-
      Sb. Math. 205(6):843-861; arXiv:1105.0719v4, p. 5. "The topological full
      group of any Cantor minimal system is an LEF group", by periodic
      approximation. The witness is made LEF by the same mechanism, applied to
      the crossed-product ring; this theorem itself is not used.

  - title: Simplicity of algebras associated to étale groupoids
    authors: [Jonathan H. Brown, Lisa Orloff Clark, Cynthia Farthing, Aidan Sims]
    year: 2014
    type: paper
    id: https://doi.org/10.1007/s00233-013-9546-z
    location: Theorem 4.1
    relationship: background
    note: >-
      Semigroup Forum 88(2):433-452; arXiv:1204.3127v2. The complex Steinberg
      algebra of an effective minimal ample groupoid is simple: the origin of
      the simplicity criterion. It is stated over the complex numbers, not over
      F_2, so the witness needs the field-general rows below. Context only.

  - title: Uniqueness theorems for Steinberg algebras
    authors: [Lisa Orloff Clark, Cain Edie-Michell]
    year: 2015
    type: paper
    id: https://doi.org/10.1007/s10468-015-9522-2
    location: Corollary 4.6
    relationship: other
    note: >-
      Algebr. Represent. Theory 18(4):907-916; arXiv:1403.4684v1, p. 7. A_R(G)
      is simple if and only if G is effective and minimal and R is a field.
      The witness ring LC(X, F_2) ⋊ Z is the case of the shift groupoid of a
      free minimal system, which the development proves directly
      (GroupApproximation/Pestov91/RingSimple.lean).

  - title: >-
      Simplicity, primitivity and semiprimitivity of étale groupoid algebras
      with applications to inverse semigroup algebras
    authors: [Benjamin Steinberg]
    year: 2016
    type: paper
    id: https://doi.org/10.1016/j.jpaa.2015.08.006
    location: Corollary 3.6
    relationship: other
    note: >-
      J. Pure Appl. Algebra 220(3):1035-1054; arXiv:1408.6014v2, p. 10. The
      same criterion over any field k, proved independently. The development
      proves directly the case that the witness ring needs.

  - title: "Hyperlinearity, essentially free actions and L2-invariants. The sofic property"
    authors: [Gabor Elek, Endre Szabo]
    year: 2005
    type: paper
    id: https://doi.org/10.1007/s00208-005-0640-8
    location: Theorem 2
    relationship: other
    note: >-
      Math. Ann. 332(2):421-441. "We shall prove that countable sofic groups
      are hyperlinear (Theorem 2)" (p. 423). LEF groups are sofic "is known"
      (p. 422). The development proves LEF ⇒ sofic ⇒ hyperlinear for
      arbitrary groups (GroupApproximation.isSofic_of_isLEF,
      GroupApproximation.isHyperlinear_of_isSofic).

  - title: Obstructions to matricial stability of discrete groups and almost flat K-theory
    authors: [Marius Dadarlat]
    year: 2021
    type: paper
    id: https://doi.org/10.1016/j.aim.2021.107722
    location: Proposition 3.19
    relationship: background
    note: >-
      Adv. Math. 384:107722; arXiv:2007.12655v2. By Proposition 3.19
      (Ozawa-Thom), infinite simple Kazhdan groups are not weakly
      quasidiagonal. So the witness, which is LEF and hence MF, refutes the
      introduction's "It is clear from definitions that MF ⇒ weak
      quasidiagonality" (p. 2). Context only; not formalized.

automation:
  methods:
    - method: agent
      models: [GPT-5.6 Sol, Claude Fable 5.1, Claude Opus 5, Claude Sonnet 5]
      framework: Codex and Claude Code
      tool_setup: >-
