  note: >-
    The counterexample argument and its formal development are presented in this repository.
    An earlier informal account used complex-projective bundles and a character. The selected
    Lean proof instead uses real-projective antipodal blocks and a tracial state constructed
    from finite self-commutator constraints. The proof account below describes the actual
    Lean route. The homogeneous-block and common-zero obstruction has close precedents
    in Pedersen-Petersen, Bice-Farah, and Robert, credited below. The originality claim
    concerns its application, with growing ranks, to an additional trace on a uniform tracial
    completion, not the invention of these classical methods. A literature and priority
    search found no earlier solution of this exact question as of September 14, 2026 UTC;
    this is a bounded search result, not a certification of absolute priority.
