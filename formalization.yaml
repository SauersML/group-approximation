      - name: Claude (Anthropic)
        role: >-
          wrote all the prose: the narrative fields of this file for this
          result and the docstrings of the Palomar Bowen-Chapman modules
    note: >-
      The negative answer to Problem 1.1, the question checked by
      Palomar/comparator-bowen-chapman.json, is first presented in this project.
      Ceccherini-Silberstein and Coornaert ask the question in 2010, fifteen
      years before Bowen and Chapman print it as Problem 1.1: "(OP-11) Does
      there exist a surjunctive group which is non-sofic?" (Cellular Automata
      and Groups, p. 417; still marked open on p. 527 of the 2023 second
      edition). Arzhantseva and Gal record it as open in 2013 (Ann. Math.
      Blaise Pascal 27 (2020), p. 127; arXiv:1312.7682 v1, 2013-12-30). Kun and
      Thom supply the nonsoficity
      mechanism, which is reproved here down to their centralizer normalization
      theorem rather than assumed; the new ingredient is the surjunctivity
      half, GroupApproximation.Surjunctivity.isSurjunctive_symmetricDouble,
      that the symmetric double of a surjunctive group is surjunctive over every
      subgroup, whose trivial-subgroup case gives that G * G is surjunctive
      whenever G is. The argument was committed to this public repository on
      2026-09-12 03:24:37 UTC (05a8aff7a), through the permutational wreath
      product (Z/2) wr_{G/Γ} G, with the group double recorded as a second
      witness the same day at 04:43 UTC (dd87a6b2b); the Lean endpoint
      GroupApproximation.BowenChapman.exists_fg_surjunctive_not_isSofic landed
      at 22:43:16 UTC (92ad0059d) and the Palomar surface at 22:48:48 UTC
      (c1e3df1ef). That postdates the latest versions of both sources, Kun and
      Thom's v3 of 2026-08-20 and Bowen and Chapman's v1 of 2025-11-10, and no
      earlier or independent answer was found.

  # Background for the LIX result: the problem and its history, the positive
  # results the counterexample had to avoid, the construction's ancestry and
  # the barrier it evades, the topology the obstruction rests on, and the
  # independent solution.  None is used in the proof.

  - title: "Nuclear C*-algebras: 99 problems"
    authors: [Christopher Schafhauser, Aaron Tikuisis, Stuart White]
    year: 2025
    type: paper
    id: https://arxiv.org/abs/2506.10902
    relationship: background
    note: >-
      Prints the question as Problem LIX.

  - title: K-Theory for Operator Algebras
    authors: [Bruce Blackadar]
    year: 1998
    type: book
    id: https://doi.org/10.1017/9781009701907
    relationship: background
    note: >-
      Second edition, MSRI Publications 5, Cambridge University Press. Example
      8.1.2(d): the nonsimple failure of injectivity, with a class killed by
      one stabilisation. After 8.1.3: whether U(A)/U0(A) -> K1(A) is an
      isomorphism for simple unital A "remains an open problem", the earliest
      reference we found for the question answered here.

  - title: Homotopy-abelian Lie groups
    authors: [S. Araki, I. M. James, Emery Thomas]
    year: 1960
    type: paper
    id: https://doi.org/10.1090/s0002-9904-1960-10487-9
    relationship: background
    note: >-
      Bull. Amer. Math. Soc. 66:324-326. The homotopy fact behind Blackadar's
      Example 8.1.2(d).

  - title: K-theory for certain C*-algebras
    authors: [Joachim Cuntz]
    year: 1981
    type: paper
    id: https://doi.org/10.2307/1971137
    relationship: background
    note: >-
      Ann. of Math. (2) 113:181-197. Purely infinite simple C*-algebras are
      K1-bijective, so the counterexample cannot be purely infinite.

  - title: The homotopy groups of the unitary groups of noncommutative tori
    authors: [Marc A. Rieffel]
    year: 1987
    type: paper
    relationship: background
    note: >-
      J. Operator Theory 17(2):237-254. Theorem 2.10: stable rank one implies
      K1-injectivity, so the counterexample has stable rank at least two.

  - title: >-
      Approximation by normal elements with finite spectra in C*-algebras of
      real rank zero
    authors: [Huaxin Lin]
    year: 1996
    type: paper
    id: https://doi.org/10.2140/pjm.1996.173.443
    relationship: background
    note: >-
      Pacific J. Math. 173(2):443-489. Lemma 2.1: real rank zero implies
      K1-injectivity, so the counterexample has real rank at least one.

  - title: Nonstable K-theory for Z-stable C*-algebras
    authors: [Xinhui Jiang]
    year: 1997
    type: paper
    id: https://arxiv.org/abs/math/9707228
    relationship: background
    note: >-
      Z-stable C*-algebras are K-stable, in particular K1-injective, so the
      counterexample is not Z-stable.

  - title: Nonstable K-theory for operator algebras
    authors: [Klaus Thomsen]
    year: 1991
    type: paper
    id: https://doi.org/10.1007/bf00569449
    relationship: background
    note: >-
      K-Theory 4:245-267. Introduces K-stability; the stage-two witness here
      is a failure of it at n = 1, k = 0.

  - title: Comparison of projections and unitary elements in simple C*-algebras
    authors: [Jesper Villadsen]
    year: 2002
    type: paper
    id: https://doi.org/10.1515/crll.2002.065
    relationship: background
    note: >-
      J. Reine Angew. Math. 549:23-45. Theorem 12: simple separable unital
      nuclear algebras that are not K1-surjective, the surjectivity analogue
      of the question settled here.

  - title: Simple C*-algebras with perforation
    authors: [Jesper Villadsen]
    year: 1998
    type: paper
    id: https://doi.org/10.1006/jfan.1997.3168
    relationship: background
    note: >-
      J. Funct. Anal. 154:110-116. With the 1999 paper, the architecture of
      the construction here: simple inductive limits in which a topological
      obstruction survives the limit.

  - title: On the stable rank of simple C*-algebras
    authors: [Jesper Villadsen]
    year: 1999
    type: paper
    id: https://doi.org/10.1090/S0894-0347-99-00314-8
    relationship: background
    note: >-
      J. Amer. Math. Soc. 12(4):1091-1102. Simple inductive limits over
      products of projective spaces with point-evaluation summands, the
      template of the tower here.

  - title: A class of simple C*-algebras with stable rank one
    authors: [George A. Elliott, Toan M. Ho, Andrew S. Toms]
    year: 2009
    type: paper
    id: https://doi.org/10.1016/j.jfa.2008.08.001
    relationship: background
    note: >-
      J. Funct. Anal. 256:307-322. Simple diagonal AH limits have stable rank
      one, so are K1-injective; this is why the point evaluations here are
      twisted by a line bundle.

  - title: Tensorial permanence of K-stability for diagonal AH-algebras
    authors: [Apurva Seth]
    year: 2026
    type: paper
    id: https://doi.org/10.1112/blms.70398
    relationship: background
    note: >-
      Bull. London Math. Soc. 58 (arXiv:2512.04780). Simple infinite-dimensional
      unital diagonal AH algebras are K-stable; the same barrier as
      Elliott-Ho-Toms.

  - title: The stable homotopy of the classical groups
    authors: [Raoul Bott]
