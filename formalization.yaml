fidelity:
  divergences: >-
    The ring R_L is the quotient of the free Z-algebra on six generators by the nine
    relations, as a RingQuot of FreeAlgebra. The Steinberg group is given by generators
    x_ij(r) with the standard relations, with x_ii(r) set to 1. Residue-class-wise affine
    permutations are rendered as permutations g of Z with a modulus m such that
    c g(n) = a n + b on each residue class, with c nonzero. Class transpositions, class
    shifts and class reflections are rendered by their action on the residue classes
    r + mZ with 0 <= r < m. In Kourovka 21.75 a set P of odd primes is a Set of natural
    numbers, CT_P(Z) is generated by the class transpositions whose two moduli have only
    prime factors in P together with 2, and the statement is for all pairs of sets, which
    contains the pairs of the printed question. Kohl's factorization conjecture is stated as
    the equality of the set of residue-class-wise affine permutations with the subgroup
    generated by the three series; the subgroup and the monoid they generate coincide,
    since the inverse of a class shift is its conjugate by the class reflection of the same
    class.

