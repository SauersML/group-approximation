fidelity:
  divergences: >-
    Simplicity is Mathlib's IsSimpleRing, which asks
    that the only two-sided ideals be zero and the whole algebra, while
    C*-simplicity asks this of closed ideals only; for a unital C*-algebra the
    two agree, because a proper two-sided ideal of a unital Banach algebra
    misses a neighbourhood of the unit and so has proper closure, and the
    development proves this (isSimpleCStar_iff_isSimpleRing). K1-injectivity
    is stated elementwise: every unitary whose stabilisation diag(u, 1, ..., 1)
    is null-homotopic in some Mn(A) is null-homotopic in A. This is the
    direct-limit description of the kernel of U(A)/U0(A) -> K1(A); the group
    K1(A) itself is not constructed. Mathlib's C*-structure on Mn(A) needs a
    partial order on A making it a star-ordered ring, and the challenge fixes
    this order to the spectral order; there is only one such order, but the
    statement fixes it and does not prove uniqueness. All algebras range over
    Type 0, and the counterexample is in Type 0.

    For Bowen-Chapman Problem 1.1, a cellular automaton is Bowen and Chapman's
    own local rule, Phi(c)(x) = phi(c(x gamma_1), ..., c(x gamma_n)), with a
    finite memory tuple and a colour palette ranging over the finite types in
    Type 0; a group is surjunctive when every injective such automaton is
    surjective. That is the paper's primary definition in section 1. Its
    equivalent description of a cellular automaton as a continuous equivariant
    recoloring map is Curtis-Hedlund-Lyndon, and the development proves that
    bridge (Surjunctivity.isFiniteMemory_of_continuous_equivariant). Soficity
    is stated in the finite-set normalized-Hamming form: for every finite F and
    every eps > 0 a map from the group to the permutations of a nonempty finite
    set that is eps-multiplicative on F and separates distinct elements of F by
    at least 1 - eps. This is equivalent to the textbook form, in which
    multiplicativity is required only when the tested product stays in F and
    the separation is a fixed constant such as 1/4: the development proves both
    reductions for an arbitrary group with no countability hypothesis
    (isSofic_iff_productRestricted, isSofic_iff_weak_quarter), and the textbook
    condition d(sigma(1), Id) <= eps follows from multiplicativity at
    g = h = 1 by left invariance of the Hamming distance. So the negation is
    nonsoficity in the sense of Gromov and Weiss. Bowen and Chapman's own
    Definition 1.4 instead calls a finitely generated group sofic when the
    Dirac IRS 1_N of a presentation is cosofic, and states without proof that
    the two agree. Finite generation is the existence of a finite subset
    generating the whole group, which is Mathlib's Group.FG with its two class
    layers unfolded. The nonsoficity of the witness follows Kun and Thom's
    argument, reproved here rather than assumed; its surjunctivity is proved
    here. The statement extends Arzhantseva and Gal's split-extension theorem,
    which needs a finitely generated residually finite kernel, to a kernel
    carrying a finitary site: the kernel of a symmetric double is free of
    infinite rank, so their hypothesis fails and a stratified peeling argument
    replaces it. The Lean theorem is about SymmetricDouble G Γ; at the trivial
    subgroup that group is the free product G * G, an identification the
    development carries out as GroupApproximation.Surjunctivity.doubleBotEquiv,
    with the free product taken as Monoid.CoprodI of two copies of G, which
    gives GroupApproximation.Surjunctivity.isSurjunctive_coprodI_double. All
    groups range over Type 0, and the counterexample is in Type 0.

    For Problem X(1) of Schafhauser, Tikuisis and White, a tracial state is a
    linear functional tau with tau(1) = 1, tau(x* x) >= 0 and tau(xy) = tau(yx).
    A trace is amenable when there are unital completely positive maps phi_n
    into matrix algebras with ||phi_n(ab) - phi_n(a) phi_n(b)||_2 -> 0 in the
    normalized Hilbert-Schmidt norm and tr(phi_n(a)) -> tau(a) for the
    normalized trace; this is condition (2) of Brown's Theorem 3.1.6, an
    equivalent form of Brown's definition, taken as the definition. A trace is
    quasidiagonal when there are such maps asymptotically multiplicative in
    operator norm, which is Brown's Definition 3.3.1. Complete positivity is
    stated as nonnegativity of every form sum_ij <xi_i, phi(a_i* a_j) xi_j>,
    that is, positivity of every block matrix [phi(a_i* a_j)]. The algebras
    are unital, as Mathlib's CStarAlgebra is, and separable, as in Brown;
    STW note that X(1) reduces to the separable case. The matrix sizes are not
    required to be positive, since the trace clause at a = 1 already makes all
    but finitely many of them positive. All algebras range over Type 0. The
    development's witness, the maximal group C*-algebra of its MarkedGroup
    with the canonical trace, lives in Type 1, and
    GroupApproximation.PalomarBridges.X1 moves it to Type 0 through Shrink,
    using separability.

    For Problem XXII of Schafhauser, Tikuisis and White, the definitions follow
    Carrión, Castillejos, Evington, Gabe, Schafhauser, Tikuisis and White,
    Tracially complete C*-algebras (CCEGSTW, arXiv:2310.20594v6): tracially
    complete C*-algebras are Definition 3.4, factoriality is Definition 3.13,
    and the uniform tracial completion is Definition 3.19, characterised
    through Corollary 3.29(i). A fidelity review,
    research/artifacts/fz-stw-xxii-review-2026-09-13.md, passed the statement
    against both sources. The challenge does not construct the completion of
    A. It characterises it by a presentation alpha : A -> M, a unital
    *-homomorphism such that (M, X) is tracially complete, every tracial state
    of A is sigma o alpha for exactly one sigma in X, and alpha(A) is
    ||.||_{2,X}-dense in M. The weak* topology on tracial states is the
    topology induced by the evaluations. Continuity of a trace for
    ||.||_{2,X} and completeness of the unit ball are stated with sequences.
    CCEGSTW leave the non-emptiness of X implicit, and the challenge makes it
    an explicit field. All algebras range over Type 0.

    The Blanchard challenge realises a Hilbert C(B_inf)-module of sections of
    a field of Hilbert spaces inside the bounded maps from the complex Hilbert
    cube B_inf to a Hilbert space, with the supremum norm, which is the module
    norm ||<xi, xi>||^{1/2}. The fibre of E_DD is l^2(Option N), the sum of
    l^2(N) and C, and its Fock space is l^2(List (Option N)). The topology on
    B_inf is generated by the open balls of Blanchard's metric
    d((x_p), (y_p)) = sum_p 2^{-p-2} |x_p - y_p|. The Fock module F(E) is the
    closed linear span of the sections x -> zeta_1(x) tensor ... tensor
    zeta_m(x) f(x); since C(B_inf) is commutative and acts by multiplication,
    the interior tensor products are these pointwise tensor products. T(E) is
    the intersection of all sets of linear endomorphisms of F(E) that contain
    1 and the creation operators and are closed under sums, scalar multiples,
    products, pointwise adjoints and operator-norm limits. Inner products are
    conjugate-linear in the first variable, as in Blanchard and in Mathlib.
    Proper infiniteness is stated as two isometries s_1, s_2 with pointwise
    adjoints t_1, t_2, t_1 s_1 = t_2 s_2 = 1 and (s_1 t_1)(s_2 t_2) = 0. The
    review research/artifacts/fz-blanchard-q54-review-2026-09-13.md checks the
    answer and the definitions it uses against arXiv:1507.02535v1 and
    arXiv:1312.7722v7.


alignment:
  statements:
    - source: >-
        Problem LIX (are all unital simple C*-algebras K1-injective?): no,
        not every nontrivial simple unital C*-algebra is K1-injective.
      lean: ProblemLIX.not_all_simple_unital_k1Injective
      module: Palomar.LIXChallenge
      status: proved

    - source: >-
        Problem LIX with the counterexample separable: there is a separable
        simple unital C*-algebra that is not K1-injective.
      lean: ProblemLIX.exists_separable_simple_not_k1Injective
      module: Palomar.LIXChallenge
      status: proved

    - source: >-
        Problem LIX, sharp form: there is a separable simple unital
        C*-algebra A with a unitary u not connected to 1 in U(A) although
        diag(u, 1) is connected to 1 in U(M2(A)), so the class of u vanishes
        at the first stabilisation.
      lean: ProblemLIX.exists_separable_simple_stage_two_witness
      module: Palomar.LIXChallenge
      status: proved

    - source: >-
        Bowen-Chapman Problem 1.1 (are all surjunctive groups sofic?), in their
        setting of finitely generated groups and finite palettes: no, some
        finitely generated group is surjunctive and not sofic.
      lean: BowenChapman.exists_finitelyGenerated_surjunctive_not_sofic
      module: Palomar.BowenChapmanChallenge
      status: proved

    - source: >-
        Bowen-Chapman Problem 1.1 without finite generation: not every
        surjunctive group is sofic.
      lean: BowenChapman.not_all_surjunctive_groups_sofic
      module: Palomar.BowenChapmanChallenge
      status: proved

    - source: >-
        Problem X(1) of Schafhauser, Tikuisis and White (are amenable traces on
        C*-algebras necessarily quasidiagonal?): no, some separable unital
        C*-algebra carries a tracial state that is amenable and not
        quasidiagonal.
