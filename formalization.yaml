version: "v0.4"

# This submission selects Palomar/comparator-bowen-chapman.json only.
project:
  name: A Surjunctive Group That Is Not Sofic
  description: >-
    We formalize the existence of a finitely generated surjunctive group
    that is not sofic. This answers negatively the converse to the
    Gromov-Weiss surjunctivity theorem, recorded as open problem OP-11 by
    Ceccherini-Silberstein and Coornaert and as Problem 1.1 by Bowen and
    Chapman. The witness is the symmetric double G *_Gamma G, where
    Gamma = EL_3(F_2[x_1,x_2,x_3]) and
    G = EL_3(F_2[x_1^+-1,x_2^+-1,x_3^+-1]) semidirect EL_3(Z), with the
    action given by monomial substitution. Kun and Thom constructed this
    pair and proved the double nonsofic. The new ingredient here is a
    surjunctivity theorem for symmetric doubles of surjunctive groups.
    The Lean development proves both halves for this witness, including
    the required permutation centralizer normalization theorem. The
    challenge states surjunctivity through finite-memory cellular
    automata and soficity through finite normalized-Hamming models.
    The two selected declarations assert the finitely generated
    counterexample and the failure of the universal converse.
  authors: [Sauers]
  responsible_maintainers: [SauersML]
  license: Apache-2.0

classification:
