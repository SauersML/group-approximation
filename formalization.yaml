proof_account: >-
  For s = n + 1 and d = 4s^2, the block D_n consists of continuous (s+1)-by-(s+1) complex
  matrix functions on S^d satisfying f(-x) = u f(x) u, with u = diag(1,-1,...,-1). These
  represent endomorphisms of the trivial line plus s copies of the complexified real tautological
  line over real projective d-space. The base A is the unitized c0-sum of these blocks.
  The diagonal witness h_n has entries 1,-1/s,...,-1/s; its trace is zero and every block
  tracial two-norm is sqrt(1/s). For a packet of m at most s elements, their distinguished
  off-diagonal rows and columns give an odd map into complex dimension 2ms. Borsuk-Ulam
  forces a common zero because 4ms is at most d. Evaluation in the distinguished coordinate
  detects h_n and annihilates all self-commutators in the packet. Choosing arbitrarily
  late coordinates makes finitely many c0 constraints small. Weak-star compactness then
  gives a tracial state on the product/c0 corona with value 1 on h. The formal completion
  is realized as scalars plus the uniform-two-null ideal in the bounded product. Pulling
  back the corona trace gives a trace on this completion. Tail truncations of h retain
  value 1 under it while their uniform two-norms tend to zero. Canonical extensions are
  uniform-two continuous, so this trace is additional. Closed-face and completeness arguments
  yield the factorial pair and characterize its continuous traces. The common-zero and
  corner obstruction follows a classical line of ideas credited to Pedersen-Petersen, Bice-Farah,
  and Robert. The Palomar bridge transfers these results to the Challenge's independently
  defined vocabulary and proves the restriction, density, and separability clauses. No
  character or Chern-class calculation is required by this Lean route.
