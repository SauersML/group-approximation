status:
  # Scope note.  This repository is a large development with open work in it;
  # the single result offered for mechanical verification is the Palomar
  # challenge theorem, and that is what `main_results` describes.
  #
  # The axiom list below is not asserted from reading a file.  It is the
  # closure `Lean.collectAxioms` reports for the declaration, computed by
  # `scripts/PalomarAxioms.lean` under `lake env lean` and gated on every push
  # to the Palomar surface by `.github/workflows/palomar-check.yml`, which
  # fails if the closure leaves the set `Palomar/comparator.json` permits.
  # First green at run 34285122501 on af75d7783.  `sorry_count` is 0 for the
  # same reason and not because Palomar/Solution.lean has no `sorry` lexically:
  # the field asks about the closure of the proved declaration, which reaches
  # into the development, and a closure containing no `sorryAx` is what settles
  # it.  `leanprover/comparator` checks the same thing at submission.
  scope: >-
    A Lean 4 development over Mathlib of the one-sided Kazhdan compression
    criterion and its MF-radical consequences, together with a self-contained
    Comparator submission surface. Palomar/Challenge.lean states, in a
    Mathlib-only module carrying its own copies of the three approximation
    notions it mentions, that one explicitly presented eight-generator group is
    sofic in normalized Hamming distance and not MF in the sequential
    operator-norm sense; Palomar/Solution.lean proves that statement from the
    development. The rest of the repository is not offered as certified by this
    entry.
  main_results:
    - declaration: ExplicitNonMF.explicit_sofic_not_MF
      file: Palomar/Solution.lean
      sorry_count: 0
      axioms: [propext, Classical.choice, Quot.sound]
      comparator_config: Palomar/comparator.json

fidelity:
  divergences: >-
    The certified proposition is about one explicitly presented group, not the
    general theorem the manuscript states, and both approximation notions in it
    are rendered rather than imported. The registry recompiles the challenge
    against a frozen canonical Mathlib and rejects any project-local source in
    its import closure, so Palomar/Challenge.lean carries its own definitions of
    normalized Hamming distance, of soficity, and of the MF property; those
    definitions are copied into the module and are not the development's own.
    Soficity is rendered as approximation by permutations of finite carriers in
    normalized Hamming distance. The MF side is rendered in the sequential
    operator-norm form and negated, rather than in the norm-matrix-corona form
    the manuscript uses; the equivalence of the formulations is proved inside
    the development and is not part of the compared statement. No quantitative
    defect bound, and no statement about any other group, is certified by this
    result.

alignment:
  statements:
    - source: >-
        There is an explicitly presented finitely generated group which is
        sofic and not MF.
      lean: ExplicitNonMF.explicit_sofic_not_MF
      module: Palomar.Challenge
      status: proved

acknowledgements: "Built on Lean 4 and Mathlib."
