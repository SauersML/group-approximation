version: "v0.4"

project:
  name: "A Simple C*-Algebra That Is Not K1-Injective, and Non-MF Groups"
  description: >-
    This project formalizes two results in Lean 4 over Mathlib. The first is
    a negative answer to the question whether every unital simple C*-algebra
    is K1-injective, which Blackadar's K-Theory for Operator Algebras (1998)
    records as open and which Schafhauser, Tikuisis and White pose as Problem
    LIX of "Nuclear C*-algebras: 99 problems" (arXiv:2506.10902). The
    counterexample is a separable simple unital C*-algebra A, an inductive
    limit of corner algebras of matrices over C(X), with a unitary u that is
    not in the connected component of 1 in U(A) although diag(u, 1) is in the
    connected component of 1 in U(M2(A)). So the class of u vanishes already
    at the first stabilisation. The second is an explicitly presented finitely
    generated group that is sofic and not MF, obtained from a one-sided
    Kazhdan compression criterion, its consequence for the MF radical of a
    group with normal property (T), and a rank-four Leavitt compression.
  authors: [Sauers]
  responsible_maintainers: [SauersML]
  license: Apache-2.0

classification:
  arxiv: [math.OA, math.GR]
  msc2020: ["46L05", "46L80", "19K56"]

