# This metadata describes the current four-declaration Comparator checkpoint.
# The selected final combined scope, including the supplied manuscript results,
# is recorded in notes/BOONE_HIGMAN_PALOMAR_SELECTED_SCOPE.md. Update the theorem
# list here together with the final challenge/solution and Comparator manifest
# only when the corresponding closed Lean declarations exist.
project:
  name: "Printed Questions around the Boone-Higman Conjecture, Stage 1"
  description: >-
    Answers to four printed open questions, stated in Mathlib's vocabulary and proved
    outright. First, an explicit finitely presented group containing every GL_n(Q): the
    Steinberg group St_10(R_L) of a six-generator, nine-relation ring R_L (Kourovka
    Notebook 14.10(c); Belk, Bleak, Matucci and Zaremsky, Problem 2.7). Second, Kohl's
    class transposition group CT(Z) is exactly the group of residue-class-wise affine
    permutations of Z that fix the nonnegative integers setwise (Kourovka Notebook 17.59).
    Third, for any two sets P1 and P2 of odd primes, Kohl's groups CT_P1(Z) and CT_P2(Z)
    generate CT_(P1 u P2)(Z), a negative answer to Kourovka Notebook 21.75. Fourth, Kohl's
    factorization conjecture: every residue-class-wise affine permutation of Z is a product
    of class shifts, class reflections and class transpositions (RCWA package manual,
    chapter 2).
  authors: [Sauers]
  responsible_maintainers: [SauersML]
  license: Apache-2.0

classification:
  arxiv: [math.GR, math.RA, math.KT]
  msc2020: ["20F05", "19C09", "20B07", "20H20"]

