version: "v0.4"

project:
  name: "An explicit finitely presented sofic group that is not MF"
  description: >-
    MF means the Carrion-Dadarlat-Eckhardt operator-norm property: embedding
    in the unitary group of a matrix quotient, equivalently admitting
    separating finite-dimensional approximate unitary representations with
    operator-norm defects tending to zero.  Strong-convergence and purely
    matricial field notions sometimes also called MF are not addressed.

    For an explicit group E on eight generators and forty-one relators, Lean
    proves that E is finitely presented, six-generated, sofic and hyperlinear
    but not MF.  The displayed word w is a nontrivial central involution
    killed by every operator-norm asymptotic unitary representation, uniformly
    on one fixed finite test set, by every finite-dimensional linear
    representation over every field, and by every finite quotient.  Thus E
    has no faithful finite-dimensional representation, is not residually
    finite, and shows that soficity and hyperlinearity do not imply MF.  This
    Comparator entry excludes the repository's C*-algebraic consequences,
    quotient result, general obstruction criteria and undecidability results.

  authors:
    - SauersML
  responsible_maintainers:
    - SauersML
  license: Apache-2.0

classification:
  arxiv: [math.OA, math.GR]
  msc2020: ["46L05", "20F05", "22D25", "20E26"]

