# WORK IN PROGRESS. This metadata describes Palomar/comparator-boone-higman.json only.
# That configuration is pending: its solution still proves most selected theorems from a
# proposition the development has not yet discharged, so nothing is published in
# status.main_results and this record is not a submission.
project:
  name: "Boone-Higman Embeddings and Related Printed Questions (work in progress)"
  description: >-
    Work in progress. This configuration collects printed open questions around the
    Boone-Higman conjecture that were answered in this repository, stated in Mathlib's
    vocabulary. First, an explicit finitely presented group containing every GL_n(Q):
    the Steinberg group St_10(R_L) of a six-generator, nine-relation ring R_L (Kourovka
    Notebook 14.10(c); Belk, Bleak, Matucci and Zaremsky, Problem 2.7). Second,
    embeddings of every finitely presented, and every finitely generated, metabelian
    group into finitely presented simple groups (Problem 5.3(7) of the same survey),
    together with every finitely generated linear group over any field, and the
    intermediate embedding of those linear groups into finitely presented self-similar
    groups (Llosa Isenrich, Schesler and Wu, Question 1.11). Third, six of Kohl's questions
    on the class transposition group CT(Z) and its subgroups CT_P(Z): the outer automorphism
    group of CT(Z) is cyclic of order two, generated by the reflection n to -n-1 (Kourovka
    17.57); CT(Z) equals the group of residue-class-wise affine permutations fixing the
    nonnegative integers setwise (17.59); the CT_P(Z) are pairwise non-isomorphic (17.60)
    and finitely presented for finite P (17.61); CT_P1(Z) and CT_P2(Z) always generate
    CT_(P1 u P2)(Z) (21.75, answered negatively); and every residue-class-wise affine
    permutation of Z is a product of class shifts, class reflections and class
    transpositions (Kohl's factorization conjecture). Fourth, two questions of Belk,
    Fournier-Facio, Hyde and Zaremsky: graph products of groups satisfying the
    permutational Boone-Higman conjecture satisfy it too (Question 3.1), and some
    finitely presented simple group has mixed identities that are not finitely normally
    generated (Question 3.3). The explicit overgroup of every GL_n(Q) is proved outright in
    Lean; every other theorem is proved in the solution only from an explicit hypothesis
    that the development is still discharging.
  authors: [Sauers]
  responsible_maintainers: [SauersML]
  license: Apache-2.0

