  - title: A finitely generated surjunctive group that is not sofic
    type: original-proof
    relationship: other
    contributors:
      - name: Astra
        role: solved the problem, using a custom proof tool
      - name: Claude (Anthropic)
        role: >-
          wrote all the prose: the narrative fields of this file for this
          result and the docstrings of the Palomar Bowen-Chapman modules
    note: >-
      The negative answer to Problem 1.1, the question checked by
      Palomar/comparator-bowen-chapman.json, is first presented in this project.
      Ceccherini-Silberstein and Coornaert ask the question in 2010, fifteen
      years before Bowen and Chapman print it as Problem 1.1: "(OP-11) Does
      there exist a surjunctive group which is non-sofic?" (Cellular Automata
      and Groups, p. 417; still marked open on p. 527 of the 2023 second
      edition). Arzhantseva and Gal record it as open in 2013 (Ann. Math.
      Blaise Pascal 27 (2020), p. 127; arXiv:1312.7682 v1, 2013-12-30). Kun and
      Thom supply the nonsoficity
      mechanism, which is reproved here down to their centralizer normalization
      theorem rather than assumed; the new ingredient is the surjunctivity
      half, GroupApproximation.Surjunctivity.isSurjunctive_symmetricDouble,
      that the symmetric double of a surjunctive group is surjunctive over every
      subgroup, whose trivial-subgroup case gives that G * G is surjunctive
      whenever G is. The argument was committed to this public repository on
      2026-09-12 03:24:37 UTC (05a8aff7a), through the permutational wreath
      product (Z/2) wr_{G/Γ} G, with the group double recorded as a second
      witness the same day at 04:43 UTC (dd87a6b2b); the Lean endpoint
      GroupApproximation.BowenChapman.exists_fg_surjunctive_not_isSofic landed
      at 22:43:16 UTC (92ad0059d) and the Palomar surface at 22:48:48 UTC
      (c1e3df1ef). That postdates the latest versions of both sources, Kun and
      Thom's v3 of 2026-08-20 and Bowen and Chapman's v1 of 2025-11-10, and no
      earlier or independent answer was found.

  - title: An infinite simple group with property (T) that is sofic and hyperlinear
    type: original-proof
    relationship: other
    contributors:
      - name: Astra
        role: solved the problem, using a custom proof tool
      - name: Claude (Anthropic)
        role: >-
          wrote all the prose: the narrative fields of this file for this
          result and the docstrings of the Palomar Pestov91 modules
    note: >-
      The positive answer to Ozawa's question, the question checked by
      Palomar/comparator-pestov91.json, is first presented in this project.
      Ozawa asks it first, in 2003, without attributing it to anyone: "It is
      unknown whether there exists a simple property (T) group Γ which is
      hyperlinear" (About the QWEP conjecture, arXiv:math/0306067 v1,
      2003-06-03, unchanged in v2 of 2004-05-10). Pestov prints it, citing
      Ozawa and adding the sofic form, as Open question 8.1 of
      arXiv:0804.3968 v1 (2008-04-24), numbered 9.1 in v8 (2008-08-04): "Let
      G be an infinite simple group with Kazhdan's property (T). Can it be
      hyperlinear (sofic)?" Arzhantseva still lists the sofic form as unknown
      in 2014 (Trends in Mathematics 1, p. 11). The witness is
      EL_3(LC(X, F_q) ⋊ Z) modulo its centre, for an infinite minimal subshift
      X; the Lean witness is the case q = 2 with X the Toeplitz subshift,
      where the centre is trivial and no quotient is taken. The argument was
      committed to this public repository on 2026-09-13
      at 03:18:24 UTC (f375478c7). It passed independent review at 03:48:55
      UTC (0efeac410), was recorded in the research graph as answering the
      question at 04:09:24 UTC (8b65f0932), and passed a second independent
      review at 05:56:33 UTC (badc66e2d). An agent in a second session found
      the same group independently three minutes after the first and
      published it at 04:06:49 UTC (5dfab98df). This postdates the latest
      version of every source checked for an earlier answer. The newest is
      Alekseev and Thom's list of known examples (arXiv:2608.05362 v1,
      2026-08-05), which names no simple one. No earlier or independent answer
      was found in print. The check was bounded: the LaTeX sources of more
      than twenty papers; the PDFs of Kirchberg (1994), Arzhantseva (2014) and
      Pisier (2020, Chapter 17); and the OpenAlex titles and abstracts of works
      citing Ozawa, Pestov and seven further sources. The arXiv API was
      rate-limited, and journal versions were not opened.

  - title: A type [A₂] action with a non-finitely-presented image
    type: original-proof
    relationship: other
    contributors:
      - name: Astra
        role: solved the problem, using a custom proof tool
      - name: Claude (Anthropic)
        role: >-
          wrote all the prose: the narrative fields of this file for this
          result and the docstrings of its Palomar modules
    note: >-
      The positive answer to Question 5.8 of Fournier-Facio, Wu and Zaremsky,
      "Abstract twisted Brin-Thompson groups" (arXiv:2603.24687 v2, p. 27),
      the question checked by Palomar/comparator-type-a2.json, is first
      presented in this project. They ask for an action G ↷ S of type [A_2]
      "such that G/ker(G ↷ S) is not finitely presented?", and write on p. 25
      that they know no explicit example. The argument was committed to this
      public repository on 2026-09-12 at 21:26:19 UTC (ec590bbea) and
      recorded in the research graph at 21:54:57 UTC (12bd1722d): the
      twisted Brin-Thompson group SV_V acting on clopen sets, extended by a
      free group acting through its normalizer. The Lean development extends
      Thompson's group F, acting on the positive dyadic rationals, in the
      same way. On 2026-09-13 the Palomar challenge was committed at 06:49:35
      UTC (398373fe3) and the witness at 08:36:52 UTC (2dc6529ed), and the
      Lean endpoint GroupApproximation.TypeA2.question58 landed with the
      completed Palomar surface at 08:59:23 UTC (e8abf9a00). That postdates
      the latest version of the source, v2 of 2026-04-02.
      research/artifacts/review-swarm5-2026-09-12.md checks the question
      against the v2 PDF and screens the later arXiv listings of
      Fournier-Facio and Zaremsky; none addresses Question 5.8, and no earlier
      or independent answer was found. The search was bounded, since the
      arXiv API search failed, and
      research/artifacts/bh-type-a-actions-2026-09-12.md notes that the
      construction is elementary and may be folklore.

  - title: The equation (1 − x₁) u = b v in the group ring of Thompson's group F
    type: original-proof
    relationship: other
    contributors:
      - name: Astra
        role: solved the problem, using a custom proof tool
      - name: Claude (Anthropic)
        role: >-
          wrote all the prose: the narrative fields of this file for this
          result and the docstrings of its Palomar modules
    note: >-
      The positive answer to Question 3.20 of Guba's "Amenability problem for
      Thompson's group F: state of the art" (Groups Complexity Cryptology 15
      (2023), p. 3:18; arXiv:2305.07113 v4), which is also Question 1 of
      arXiv:2201.02308, the question checked by
      Palomar/comparator-guba-thompson.json, is first presented in this
      project. Guba asks whether, for every b in R = K[F], "the equation
      (1−x1)u = bv has a non-zero solution in R?" The argument was committed
      to this public repository on 2026-09-12 at 21:55:41 UTC (4f3e5243a). On
      2026-09-13 the Palomar challenge was committed at 06:59:10 UTC
      (24ed18bcf), the Lean endpoint
      GroupApproximation.ThompsonOre.one_sub_x1_solution landed at 09:07:49
      UTC (6d9e32987), and the Palomar solution became unconditional at
      09:20:00 UTC (6b308147b). That postdates the latest versions of both
      sources, v4 of the survey of 2023-10-19 and v1 of arXiv:2201.02308 of
      2022-01-07. research/artifacts/guba-q1-novelty-2026-09-12.md reads the
      citing record an earlier review could not open, Nishinaka's 2022 RIMS
      Kôkyûroku note, and screens Guba's later papers, the records citing Guba's
      2021-2023 papers, the RIMS Kôkyûroku volumes to 2354, and arXiv and
      Crossref searches. No earlier or independent answer was found. The check
      was bounded: zbMATH, Google Scholar and the arXiv API were unreachable,
      and a paper answering the question without citing Guba would be missed.

  - title: Commuting sofic actions that do not combine to a sofic action
    type: original-proof
    relationship: other
    contributors:
      - name: Astra
        role: solved the problem, using a custom proof tool
      - name: Claude (Anthropic)
        role: >-
          wrote all the prose: the narrative fields of this file for this
          result and the docstrings of its Palomar modules
    note: >-
      The negative answer to Question 4.2 of Gao, Kunnawalkam Elayavalli and
      Patchell, "Soficity for group actions on sets and applications"
      (arXiv:2401.04945 v3, p. 14; Res. Math. Sci. 12 (2025), article 48), the
      question checked by Palomar/comparator-gkp-commuting-actions.json, is
      first presented in this project. For commuting actions α_i of groups G_i
      on one set, combining to an action α of their direct sum, they ask: "α
      is sofic iff all α_i are sofic?" The forward direction is their
      Proposition 2.15(3); the converse fails. The witness is G × G acting on
      (G × G)/ΔΓ for a Kun-Thom pair Γ ≤ G. The nonsoficity of the coset
      action of G on G/Γ is Kun and Thom's (arXiv:2608.06222); the new step is
      that both coordinate actions are sofic while the diagonal orbit of the
      base coset is that coset action. The argument was committed to this
      public repository on 2026-08-18 at 02:48:35 UTC (393a096b6). On
      2026-09-13 the Lean endpoint
      GroupApproximation.CommutingSoficActions.exists_commuting_sofic_actions_not_sofic
      landed at 08:06:59 UTC (29e593abf) and the Palomar surface at 08:48:32
      UTC (3f1af7161). The argument postdates the latest version of the
      question's source, v3 of 2025-08-27, and v1 of Kun and Thom of
      2026-08-06; the Lean endpoint also postdates their v3 of 2026-08-20,
      which, like v1, never mentions commuting actions or Question 4.2.
      research/artifacts/fz-gkp-q42-review-2026-09-13.md screens the seven
      works that Semantic Scholar lists as citing the source, arXiv searches
      and web searches. No earlier or independent answer was found as of
      2026-09-13. The search was bounded: journal-side citing records could
      not be opened.

  - title: An amenable trace that is not quasidiagonal
    type: original-proof
    relationship: other
    contributors:
      - name: Astra
        role: solved the problem, using a custom proof tool
      - name: Claude (Anthropic)
        role: >-
          wrote all the prose: the narrative fields of this file for this
          result and the docstrings of its Palomar modules
    note: >-
      The negative answer to Problem X(1) of Schafhauser, Tikuisis and White,
      "Nuclear C*-algebras: 99 problems" (arXiv:2506.10902 v2, p. 15), the
      question checked by Palomar/comparator-stw-x1.json, is first presented
      in this project. Ozawa's preprint arXiv:2609.08892 v1 (2026-09-08
      15:31:26 UTC) independently implies the same answer later: it answers
      Problem X(2), and the trace of the hyperfinite II1 factor is amenable
      and, by Ozawa's theorem, not quasidiagonal, although the preprint states
      no result on X(1). The question, which is N. P. Brown's (Mem. Amer. Math.
      Soc. 184 (2006), no. 865), reads: "Are amenable traces on C*-algebras
      necessarily quasidiagonal?" The problem was stated in Lean on 2026-08-27
      between 06:49:06 and 07:07:05 UTC (2dbea8f73,
      f2e177871, 8a4268878), and the counterexample was proved in this public
      repository on 2026-08-31 at 06:19:37 UTC (4830b808c). On 2026-09-13 the
      fidelity review research/artifacts/fz-stw-x1-review-2026-09-13.md passed
      at 08:21:45 UTC (304a14bad), and the Palomar pair landed at 09:53:23 UTC
      (0badf535c), with GroupApproximation/PalomarBridges/X1.lean moving the
      witness to Type 0. The argument postdates the latest version of the
      source, v2 of 2026-05-08. The review's priority search, refreshed to
      2026-09-13, was a bounded web and arXiv search. Eckhardt's
      arXiv:2608.28772 v1 (2026-08-28) makes no claim about amenable traces or
      X(1), none of the other works it screened answers X(1), and no earlier
      answer was found.

  - title: A tracial completion with a discontinuous trace
    type: original-proof
    relationship: other
    contributors:
      - name: Astra
        role: solved the problem, using a custom proof tool
      - name: Claude (Anthropic)
        role: >-
          wrote all the prose: the narrative fields of this file for this
          result and the docstrings of its Palomar modules
    note: >-
      The negative answer to Problem XXII of Schafhauser, Tikuisis and White,
      "Nuclear C*-algebras: 99 problems" (arXiv:2506.10902 v2, p. 24), and to
      its general form, Question 1.1 of Carrión, Castillejos, Evington, Gabe,
      Schafhauser, Tikuisis and White (arXiv:2310.20594), the questions
      checked by Palomar/comparator-stw-xxii.json, is first presented in this
      project. For a C*-algebra A with non-empty compact trace space they ask:
      "Are all traces on Ā^{T(A)} automatically ‖·‖_{2,T(A)}-continuous?"
      Research notes isolating the obstruction were committed to this public
      repository from 2026-08-30 at 15:52:28 UTC (dbdccafe0). The
      counterexample node and its audit,
      research/artifacts/stw22-trace-problem-counterexample-audit-2026-08-31.md,
      were recorded on 2026-08-31 at 04:12:46 and 04:13:38 UTC (8c45e6587,
      0cdbec5e0), and the first Lean development followed at 05:31:45 UTC
      (40d02e604). The Lean endpoint
      GroupApproximation.STW22.antipodalFactorialNegativeSolutionToProblemXXII
      was proved from a Borsuk-Ulam hypothesis on 2026-09-05 at
      20:22:52 UTC (2962b1f4f) and without it on 2026-09-07 at 06:54:44 UTC
      (7e2ef9cde). On 2026-09-13 the
      fidelity review research/artifacts/fz-stw-xxii-review-2026-09-13.md
      passed at 08:38:10 UTC (31da2ecfd), and the Palomar pair, with
      GroupApproximation/PalomarBridges/XXII.lean, landed at 10:53:27 UTC
      (8444aeb6c). That postdates the latest versions of both sources, v2 of
      arXiv:2506.10902 of 2026-05-08 and v6 of arXiv:2310.20594 of 2026-08-07.
      The review's novelty refresh of 2026-09-13 finds both still posing the
      question, and Toms (arXiv:2606.12188 v2), Evington and Tikuisis
      (arXiv:2604.24206), Moradi and Amini (arXiv:2606.13924) and web searches
      give no answer. No earlier or independent answer was found; the review
      records this as a search result, not a proof of absence.

  - title: A properly infinite Toeplitz algebra
    type: original-proof
    relationship: other
    contributors:
      - name: Astra
        role: solved the problem, using a custom proof tool
      - name: Claude (Anthropic)
        role: >-
          wrote all the prose: the narrative fields of this file for this
          result and the docstrings of its Palomar modules
    note: >-
      The positive answer to Question 5.4 of Blanchard, "Continuous families
      of properly infinite C*-algebras" (arXiv:1507.02535 v1, p. 9; also
      arXiv:1312.7722 v7, p. 8), the question checked by
      Palomar/comparator-blanchard-toeplitz.json, is first presented in this
      project. Blanchard asks: "But is T(E_DD) properly infinite?" The argument
      was committed to this public repository on 2026-09-13 at 03:25:16 UTC
      (412dd7632): the isometries are creation operators of two orthonormal
      sections of E_DD ⊗ E_DD. The review
      research/artifacts/fz-blanchard-q54-review-2026-09-13.md passed it at
      07:01:26 UTC (03e45cd5a). The Lean development and the Palomar pair
      landed at 11:46:08 UTC (4caf6aea2), with a docstring citation fix at
      12:44:30 UTC (77c9de1d2). That postdates the latest versions of both
      sources, v1 of arXiv:1507.02535 of 2015-07-09 and v7 of arXiv:1312.7722
      of 2015-04-15. The review screens both arXiv listings, the one citing
      paper that Semantic Scholar lists (Blanchard, arXiv:1606.04773, whose
      abstract page and ar5iv text do not mention E_DD), the HAL record of
      arXiv:1312.7722, arXiv:2607.20361 and six web searches; one search
      engine's generated summary claimed an answer that the pages it linked do
      not contain. No earlier or independent answer was found. The search was
      bounded: MathSciNet, zbMATH, Google Scholar and Blanchard's post-2016
      arXiv listing were not checked.

  # Background for the LIX result: the problem and its history, the positive
  # results the counterexample had to avoid, the construction's ancestry and
  # the barrier it evades, the topology the obstruction rests on, and the
  # independent solution.  None is used in the proof.

  - title: "Nuclear C*-algebras: 99 problems"
    authors: [Christopher Schafhauser, Aaron Tikuisis, Stuart White]
    year: 2025
    type: paper
    id: https://arxiv.org/abs/2506.10902
    relationship: background
    note: >-
      Prints the question as Problem LIX.

  - title: K-Theory for Operator Algebras
    authors: [Bruce Blackadar]
    year: 1998
    type: book
    id: https://doi.org/10.1017/9781009701907
    relationship: background
    note: >-
      Second edition, MSRI Publications 5, Cambridge University Press. Example
      8.1.2(d): the nonsimple failure of injectivity, with a class killed by
      one stabilisation. After 8.1.3: whether U(A)/U0(A) -> K1(A) is an
      isomorphism for simple unital A "remains an open problem", the earliest
      reference we found for the question answered here.

  - title: Homotopy-abelian Lie groups
    authors: [S. Araki, I. M. James, Emery Thomas]
    year: 1960
    type: paper
    id: https://doi.org/10.1090/s0002-9904-1960-10487-9
    relationship: background
    note: >-
      Bull. Amer. Math. Soc. 66:324-326. The homotopy fact behind Blackadar's
      Example 8.1.2(d).

  - title: K-theory for certain C*-algebras
    authors: [Joachim Cuntz]
    year: 1981
    type: paper
    id: https://doi.org/10.2307/1971137
    relationship: background
    note: >-
      Ann. of Math. (2) 113:181-197. Purely infinite simple C*-algebras are
      K1-bijective, so the counterexample cannot be purely infinite.

  - title: The homotopy groups of the unitary groups of noncommutative tori
    authors: [Marc A. Rieffel]
    year: 1987
    type: paper
    relationship: background
    note: >-
      J. Operator Theory 17(2):237-254. Theorem 2.10: stable rank one implies
      K1-injectivity, so the counterexample has stable rank at least two.

  - title: >-
      Approximation by normal elements with finite spectra in C*-algebras of
      real rank zero
    authors: [Huaxin Lin]
    year: 1996
    type: paper
    id: https://doi.org/10.2140/pjm.1996.173.443
    relationship: background
    note: >-
      Pacific J. Math. 173(2):443-489. Lemma 2.1: real rank zero implies
      K1-injectivity, so the counterexample has real rank at least one.

  - title: Nonstable K-theory for Z-stable C*-algebras
    authors: [Xinhui Jiang]
    year: 1997
    type: paper
    id: https://arxiv.org/abs/math/9707228
    relationship: background
    note: >-
      Z-stable C*-algebras are K-stable, in particular K1-injective, so the
      counterexample is not Z-stable.

  - title: Nonstable K-theory for operator algebras
    authors: [Klaus Thomsen]
