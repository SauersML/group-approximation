  - title: Cellular Automata and Groups
    authors: [Tullio Ceccherini-Silberstein, Michel Coornaert]
    year: 2010
    type: book
    id: https://doi.org/10.1007/978-3-642-14034-1
    location: Open problem OP-11
    relationship: background
    note: >-
      An earlier formulation of the question whether there exists a
      surjunctive group that is not sofic. Also supplies the standard
      finite-memory formulation of cellular automata on a full shift.

  - title: Surjunctivity does not characterize cosoficity of invariant random subgroups
    authors: [Lewis Bowen, Michael Chapman]
    year: 2025
    type: paper
    id: https://arxiv.org/abs/2511.06586
    location: Problem 1.1 and Theorem 1.2
    relationship: background
    note: >-
      Problem 1.1 asks whether all surjunctive groups are sofic. Their
      Theorem 1.2 answers the analogous question for invariant random
      subgroups; it does not supply a surjunctive nonsofic group. The
      challenge uses their finite-list definition of a cellular automaton.

  - title: On approximation properties of semidirect products of groups
    authors: [Goulnara Arzhantseva, Swiatomir R. Gal]
    year: 2014
    type: paper
    id: https://arxiv.org/abs/1312.7682
    location: Page 127
    relationship: background
    note: >-
      Records the surjunctive nonsofic-group question and discusses known
      permanence properties of surjunctivity. First posted in 2013.

  - title: Endomorphisms of symbolic algebraic varieties
    authors: [Mikhail Gromov]
    year: 1999
    type: paper
    id: https://doi.org/10.1007/PL00011162
    relationship: background
    note: The implication from soficity to surjunctivity whose converse is answered here.

  - title: Sofic groups and dynamical systems
    authors: [Benjamin Weiss]
    year: 2000
    type: paper
    relationship: background
    note: >-
      Sankhya Series A 62, 350-359. Develops soficity and proves
      surjunctivity of sofic groups. The present result concerns the converse.

  - title: Nonsofic wreath products of residually finite groups
    authors: [Gabor Kun, Andreas Thom]
    year: 2026
    type: paper
    id: https://arxiv.org/abs/2608.06222v3
    location: Theorems A, E, and 4.1
    relationship: other
    note: >-
      Supplies the existing nonsofic double and its polynomial/Laurent
      polynomial pair. Our witness is q = 2 and r = d = 3 in Theorem E;
      EL_3(Z) equals SL_3(Z). Theorem A supplies the nonsoficity argument,
      and Theorem 4.1 is its centralizer normalization input. The required
      results are proved in the Lean development, not added as axioms.
      This is credit for an ingredient of the new separation theorem,
      not a claim to have originated their construction or nonsoficity proof.

  - title: Centralizers of sofic approximations of Kazhdan groups
    authors: [Vadim Alekseev, Andreas Thom]
    year: 2026
    type: paper
    id: https://arxiv.org/abs/2608.05362
    relationship: other
    note: >-
      The component and almost-automorphism machinery used in the
      Kun-Thom normalization argument. Its needed estimates are developed
      in the formal proof.

  - title: Property (T) for noncommutative universal lattices
    authors: [Mikhail Ershov, Andrei Jaikin-Zapirain]
    year: 2010
    type: paper
    id: https://doi.org/10.1007/s00222-009-0218-2
    location: Theorem 1.1
    relationship: other
    note: >-
      Supplies property (T) for elementary groups over finitely generated
      unital rings. The instances used by the witness are proved in Lean.

