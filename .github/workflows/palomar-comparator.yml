name: Palomar XXII verification
permissions:
  contents: read
concurrency:
  group: palomar-comparator-${{ github.ref }}
  cancel-in-progress: false
jobs:
  comparator:
    name: 'STW XXII: source, Lean, Comparator, and NanoDa'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
    - name: Check out repository
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
    - name: Cache Lean toolchain
      id: elan-cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ~/.elan
        key: ${{ runner.os }}-elan-comparator-${{ hashFiles('lean-toolchain') }}
    - name: Install elan
      if: steps.elan-cache.outputs.cache-hit != 'true'
      run: curl https://raw.githubusercontent.com/leanprover/elan/464c9d28395000a2a0128e07081e4956d50eced2/elan-init.sh -sSf | sh -s -- -y
    - name: Add elan to PATH
      run: echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
    - name: Restore Lake dependencies
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: .lake/packages
        key: ${{ runner.os }}-lake-deps-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
        restore-keys: |
          ${{ runner.os }}-lake-deps-
    - name: Restore compiled project
      id: build-restore
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: .lake/build
        key: ${{ runner.os }}-nonsofic-build-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml', 'GroupApproximation.lean', 'GroupApproximation/**/*.lean',
          'Palomar/**/*.lean') }}
        restore-keys: |
          ${{ runner.os }}-nonsofic-build-
    - name: Restore Mathlib olean archives
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ~/.cache/mathlib
        key: ${{ runner.os }}-mathlib-archives-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
    - name: Install metadata validators
      run: python3 -m pip install PyYAML==6.0.3 jsonschema==4.25.1
    - name: Validate the complete source snapshot
      run: |-
        curl -fsSL https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/99c678e569c7c4c0772db297c5ddd5e4c9b6322e/schema/formalization.schema.json -o "$RUNNER_TEMP/schema.json"
        python3 scripts/check_submission.py "$RUNNER_TEMP/schema.json"
    - name: Fetch precompiled Mathlib
      run: lake exe cache get
    - name: Build the Palomar modules
      run: lake build PalomarSTWProblemXXIIChallenge PalomarSTWProblemXXIISolution PalomarSTWProblemXXIIModelTests
    - name: Compare elaborated statements and definitions
      run: |-
        lake env lean scripts/PalomarSTWProblemXXIIChallengeType.lean > "$RUNNER_TEMP/challenge-types.txt"
        lake env lean scripts/PalomarSTWProblemXXIISolutionType.lean > "$RUNNER_TEMP/solution-types.txt"
        diff -u "$RUNNER_TEMP/challenge-types.txt" "$RUNNER_TEMP/solution-types.txt"
    - name: Audit selected theorem axioms
      run: lake env lean scripts/PalomarSTWProblemXXIIAxioms.lean
    - name: Build landrun
      run: |-
        go install github.com/zouuup/landrun/cmd/landrun@811cfff51ceaf3d9843708aa6d22e9b84ccac8b4
        echo "$HOME/go/bin" >> "$GITHUB_PATH"
        test -x "$HOME/go/bin/landrun"
    - name: Build lean4export at the submitted toolchain
      run: |
        tag="$(sed 's|^leanprover/lean4:||' lean-toolchain)"
        echo "lean4export tag: $tag"
        git clone --depth 1 --branch "$tag" https://github.com/leanprover/lean4export.git "$RUNNER_TEMP/lean4export"
        ( cd "$RUNNER_TEMP/lean4export" && lake build )
        echo "COMPARATOR_LEAN4EXPORT=$RUNNER_TEMP/lean4export/.lake/build/bin/lean4export" >> "$GITHUB_ENV"
    - name: Build comparator
      run: |-
        mkdir "$RUNNER_TEMP/comparator"
        curl -fsSL https://github.com/leanprover/comparator/archive/2312244ac716564a61cc0bf4e107d9abf1757a61.tar.gz | tar -xz --strip-components=1 -C "$RUNNER_TEMP/comparator"
        ( cd "$RUNNER_TEMP/comparator" && lake build comparator )
        echo "COMPARATOR_BIN=$RUNNER_TEMP/comparator/.lake/build/bin/comparator" >> "$GITHUB_ENV"
    - name: Build the NanoDa kernel
      run: |-
        mkdir "$RUNNER_TEMP/nanoda"
        curl -fsSL https://github.com/ammkrn/nanoda_lib/archive/4c544ed4099c8227f07d5de77ad1e69fb0740a27.tar.gz | tar -xz --strip-components=1 -C "$RUNNER_TEMP/nanoda"
        ( cd "$RUNNER_TEMP/nanoda" && cargo build --release )
        echo "$RUNNER_TEMP/nanoda/target/release" >> "$GITHUB_PATH"
    - name: Write the protected configuration
      run: |-
        python3 - "$RUNNER_TEMP/protected.json" <<'PYCONFIG'
        import json, sys
        cfg = json.load(open("Palomar/comparator-stw-xxii.json"))
        cfg["enable_nanoda"] = True
        with open(sys.argv[1], "w") as output:
            json.dump(cfg, output)
        print(json.dumps(cfg, indent=2))
        PYCONFIG
    - name: Run Comparator
      run: |
        set -o pipefail
        lake env "$COMPARATOR_BIN" "$RUNNER_TEMP/protected.json" 2>&1 | tee "$RUNNER_TEMP/comparator.log"
    - name: Reject a green run that reported a failure
      run: |-
        python3 - "$RUNNER_TEMP/comparator.log" <<'PYCHECK'
        import re, sys
        log = open(sys.argv[1]).read()
        assert not re.search(r"uncaught exception|error:|error\]|failed", log, re.I), log[-5000:]
        for marker in ["nanoda kernel accepts the solution", "Lean default kernel accepts the solution", "Your solution is okay!"]:
            assert marker in log, "Missing success marker: " + marker
        print("Both independent kernel checks and Comparator accepted the selected solution.")
        PYCHECK
    - name: Upload the Comparator log
      if: always()
      uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
      with:
        name: comparator-log
        path: ${{ runner.temp }}/comparator.log
        if-no-files-found: warn
'on':
  workflow_dispatch: {}
