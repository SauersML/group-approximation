name: STW problems Lean compile

on:
  push:
    branches: [main]
    paths:
      - STWProblems.lean
      - lakefile.toml
      - lake-manifest.json
      - lean-toolchain
      - .github/workflows/stw-problems-lean.yml
  pull_request:
    branches: [main]
    paths:
      - STWProblems.lean
      - lakefile.toml
      - lake-manifest.json
      - lean-toolchain
      - .github/workflows/stw-problems-lean.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stw-problems-lean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile STWProblems.lean
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Cache Lean toolchain
        id: elan-cache
        continue-on-error: true
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.elan
          key: ${{ runner.os }}-elan-${{ hashFiles('lean-toolchain') }}

      - name: Install elan on a cold toolchain cache
        if: steps.elan-cache.outputs.cache-hit != 'true'
        shell: bash
        run: curl https://raw.githubusercontent.com/leanprover/elan/464c9d28395000a2a0128e07081e4956d50eced2/elan-init.sh -sSf | sh -s -- -y

      - name: Put Lean on PATH
        run: echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache Lake packages and precompiled dependencies
        id: lake-packages-cache
        continue-on-error: true
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .lake/packages
          key: ${{ runner.os }}-lake-deps-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            ${{ runner.os }}-lake-deps-

      - name: Fetch precompiled Mathlib when dependencies are cold or stale
        if: steps.lake-packages-cache.outputs.cache-hit != 'true'
        run: lake exe cache get

      - name: Compile unconditional STW kernels
        run: lake lean STWProblems.lean
