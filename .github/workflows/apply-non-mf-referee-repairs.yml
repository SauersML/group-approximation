name: Apply non-MF referee repairs

on:
  push:
    branches:
      - agent/non-mf-referee-repair

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: agent/non-mf-referee-repair
          fetch-depth: 0
          persist-credentials: true

      - name: Apply referee repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          tex = Path("non_mf_groups_exist.tex")
          s = tex.read_text()

          def replace_one(old: str, new: str, label: str):
              global s
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f"{label}: expected exactly one target, found {n}")
              s = s.replace(old, new, 1)

          replace_one(
              r'''The group $E$ is sofic, and hence hyperlinear, but is not MF.  Thus
          even sofic groups --- and therefore hyperlinear groups --- need not be
          MF.  Its reduced $C^*$-algebra $\Cred(E)$ is separable, exact, and
          stably finite but not MF\@.  The canonical trace on $\Cmax(E)$ is
          hyperlinear but not MF, giving a negative answer to a question of
          Shulman.  The quotient $E/\langle w\rangle$ is also non-MF\@.''',
              r'''The group $E$ is sofic, and hence hyperlinear, but is not MF.  Thus
          even sofic groups --- and therefore hyperlinear groups --- need not be
          MF.  Its reduced $C^*$-algebra $\Cred(E)$ is separable and stably
          finite but not MF; standard exactness results, applied to the block
          normal form proved here, show in addition that $\Cred(E)$ is exact.
          The canonical trace on $\Cmax(E)$ is hyperlinear but not MF, giving a
          negative answer to a question of Shulman.  The quotient
          $E/\langle w\rangle$ is also non-MF\@.''',
              "abstract exactness packaging",
          )

          replace_one(
              r'''The algebra is also exact, by the block normal form of $E$ and
          permanence for free products and extensions
          (Section~\ref{sec:algebras-sofic}).
          The algebra is not nuclear: the canonical map
          $\mathcal B\to E$ is injective (Section~\ref{sec:witness}), so $E$
          contains an infinite Kazhdan group and is nonamenable, whence
          $\Cred(E)$ is not nuclear \cite{Lance}.  The nuclear form of the
          Blackadar--Kirchberg problem --- whether every stably finite separable
          nuclear $C^*$-algebra is quasidiagonal --- therefore remains open.
          \leanverified{Analysis/NuclearityAmenability}{GroupApproximation.NuclearityAmenability.manuscriptNotAmenableOfBaseEmbeds}''',
              r'''Exactness is a separate literature consequence of the block normal
          form, rather than part of the formally verified statement of
          Theorem~\ref{thm:reduced}; the precise permanence inputs are recorded
          in Section~\ref{sec:algebras-sofic}.
          The canonical map $\mathcal B\to E$ is injective
          (Section~\ref{sec:witness}), so $E$ contains an infinite Kazhdan group
          and is nonamenable.
          \leanverified{Analysis/NuclearityAmenability}{GroupApproximation.NuclearityAmenability.manuscriptNotAmenableOfBaseEmbeds}
          By Lance's theorem, nonamenability of a discrete group is equivalent
          to nonnuclearity of its reduced group $C^*$-algebra, so
          $\Cred(E)$ is not nuclear \cite{Lance}.  Thus the nuclear form of the
          Blackadar--Kirchberg problem --- whether every stably finite separable
          nuclear $C^*$-algebra is quasidiagonal --- is not addressed here.''',
              "reduced algebra exactness/nuclearity scope",
          )

          replace_one(
              r'''\emph{The corner-supported ideal.}  Let $\mathcal I_q$ be the set of finite sums
          $\sum_{j\le r}x_jqy_j$ with $x_j,y_j\in\mathcal Q$, a two-sided ideal
          of $\mathcal Q$ invariant under inner automorphisms.''',
              r'''\emph{The corner-supported ideal.}  Let $\mathcal I_q$ be the
          algebraic two-sided ideal generated by $q$, namely the set of finite
          sums $\sum_{j\le r}x_jqy_j$ with $x_j,y_j\in\mathcal Q$.  It is
          invariant under inner automorphisms.  We deliberately use the
          algebraic ideal here, not its norm closure: the finite-sum description
          is what supplies the rank bound below.''',
              "algebraic ideal clarification",
          )

          replace_one(
              r'''The same decomposition also proves that $E$ is exact.  The quotient of
          $C(\mathcal G)$ by $\langle\zeta\rangle$ is the free product of the
          elementary abelian $2$-groups of the blocks, each of order at most
          $2^{8}$, and free
          products, directed unions and extensions of exact groups are exact
          \cite{KWPermanence}; so that free product is exact, and $C(\mathcal G)$,
          a central extension of it by $\langle\zeta\rangle$, is exact as well.
          The group $\Sigma$ is a subgroup of $\GL_4(\mathbb Q)$ and therefore
          exact \cite{GHW}, and $E\cong C(\mathcal G)\rtimes\Sigma$.  For a
          discrete group exactness is equivalent to exactness of the reduced
          group algebra \cite{KWExact}, so $\Cred(E)$ is exact.  The same
          applies to $W$, whose Clifford kernel is locally finite and hence
          amenable.''',
              r'''\paragraph{Exactness.}
          The same decomposition also proves that $E$ is exact.  The quotient
          $C(\mathcal G)/\langle\zeta\rangle$ is the free product of the
          elementary abelian $2$-groups attached to the blocks, each of order at
          most $2^{8}$.  Every finite sub-free-product is exact by Dykema's
          free-product theorem \cite{DykemaExact}; the full free product is the
          increasing union of these finite sub-free-products, so it is exact by
          the increasing-union permanence theorem of Kirchberg--Wassermann
          \cite{KWExact}.  Since $\langle\zeta\rangle$ is finite, extension
          permanence \cite{KWPermanence} then gives exactness of
          $C(\mathcal G)$.  The group $\Sigma\le\GL_4(\mathbb Q)$ is exact by
          Guentner--Higson--Weinberger \cite{GHW}.  Finally
          $E\cong C(\mathcal G)\rtimes\Sigma$ is an extension, hence is exact by
          \cite{KWPermanence}.  For a discrete group, group exactness is
          equivalent to exactness of its reduced group $C^*$-algebra
          \cite{KWExact}; therefore $\Cred(E)$ is exact.''',
              "exactness citation chain",
          )

          replace_one(
              r'''Stable finiteness and faithful traces on the coordinate algebras do
          not suffice for Theorem~\ref{thm:kazhdan-transport}.  For a faithfully
          traced unital $C^*$-algebra $A$, the left and right actions on
          $L^2(A,\tau)$ can generate an infinite von Neumann algebra; for an
          infinite-dimensional $\mathrm{II}_1$ factor in standard form they
          generate all of $B(L^2(A,\tau))$.  Constant coordinates''',
              r'''Stable finiteness and faithful traces on the coordinate algebras do
          not suffice for Theorem~\ref{thm:kazhdan-transport}.  For a finite
          factor $M$ in its standard representation on $L^2(M,\tau)$, the right
          action is the commutant of the left action.  Hence the von Neumann
          algebra generated by the two actions is
          $(M\cup M')''=Z(M)'=B(L^2(M,\tau))$; in infinite dimension this is not
          a finite $C^*$-algebra.  Constant coordinates''',
              "standard-form self-contained justification",
          )

          replace_one(
              r'''\leanverified{Analysis/MaximalGroupCStar}{GroupApproximation.manuscriptUniverseRelativeMaximalGroupCStar}''',
              r'''\leanverified{Analysis/MaximalCStarAllUniverses}{GroupApproximation.manuscriptMaximalGroupCStarUniversalProperty}''',
              "maximal universal-property badge",
          )

          replace_one(
              r'''\leanverified{Analysis/MaximalCStarParagraphEndpoint}{GroupApproximation.MaximalCStarParagraphEndpoint.manuscriptMaximalCStarStrictCompressionRemark}''',
              r'''\leanverified{Analysis/StrictCompressionFromPrinted}{GroupApproximation.MaximalCStarPrintedHypotheses.manuscriptMaximalCStarRemarkFromPrintedHypotheses}''',
              "strict-compression badge",
          )

          replace_one(
              r'''\bibitem[DGLT]{DGLT}
          M.~De~Chiffre, L.~Glebsky, A.~Lubotzky, and A.~Thom,
          \emph{Stability, cohomology vanishing, and nonapproximable groups},
          Forum Math. Sigma \textbf{8} (2020), Paper No.~e18,
          \doi{10.1017/fms.2020.5}.

          \bibitem[ES05]{ElekSzaboHyper}''',
              r'''\bibitem[DGLT]{DGLT}
          M.~De~Chiffre, L.~Glebsky, A.~Lubotzky, and A.~Thom,
          \emph{Stability, cohomology vanishing, and nonapproximable groups},
          Forum Math. Sigma \textbf{8} (2020), Paper No.~e18,
          \doi{10.1017/fms.2020.5}.

          \bibitem[Dy]{DykemaExact}
          K.~J. Dykema,
          \emph{Free products of exact groups},
          in \emph{$C^*$-algebras (M\"unster, 1999)},
          Springer, Berlin, 2000, 61--70,
          \doi{10.1007/978-3-642-57288-3_4}, \arxiv{math/9911048}.

          \bibitem[ES05]{ElekSzaboHyper}''',
              "Dykema bibliography",
          )

          replace_one(
              r'''\bibitem[LuO]{LuO}
          A.~Lubotzky and I.~Oppenheim,
          \emph{Non $p$-norm approximated groups},
          preprint, 2018, \arxiv{1807.06790}.''',
              r'''\bibitem[LuO]{LuO}
          A.~Lubotzky and I.~Oppenheim,
          \emph{Non $p$-norm approximated groups},
          J. Anal. Math. \textbf{141} (2020), no.~1, 305--321,
          \doi{10.1007/s11854-020-0119-2}, \arxiv{1807.06790}.''',
              "Lubotzky--Oppenheim bibliography",
          )

          replace_one(
              r'''\bibitem[Sc]{Schafhauser}
          C.~Schafhauser,
          \emph{Finite dimensional approximations of certain amalgamated free
          products of groups},
          preprint, 2023, \arxiv{2306.02498}.''',
              r'''\bibitem[Sc]{Schafhauser}
          C.~Schafhauser,
          \emph{Finite-dimensional approximations of certain amalgamated free
          products of groups},
          Groups Geom. Dyn. \textbf{20} (2026), no.~2, 607--615,
          \doi{10.4171/GGD/826}, \arxiv{2306.02498}.''',
              "Schafhauser bibliography",
          )

          tex.write_text(s)

          # Retarget the independent claim map to the theorem that actually has
          # the target-universe quantifier printed in the manuscript.
          p = Path("scripts/regenerate_non_mf_claim_manifest.py")
          t = p.read_text()
          old = '''    "prop:maximal-cstar": (\n        "Analysis/MaximalGroupCStar",\n        "GroupApproximation.manuscriptUniverseRelativeMaximalGroupCStar"),'''
          new = '''    "prop:maximal-cstar": (\n        "Analysis/MaximalCStarAllUniverses",\n        "GroupApproximation.manuscriptMaximalGroupCStarUniversalProperty"),'''
          if t.count(old) != 1:
              raise SystemExit("claim target: expected one old maximal-C* mapping")
          p.write_text(t.replace(old, new, 1))

          # The declaration roster mirrors the manuscript badges.
          p = Path("metadata/NON_MF_CLAIM_DECLS.txt")
          t = p.read_text()
          swaps = {
              "GroupApproximation.manuscriptUniverseRelativeMaximalGroupCStar":
                  "GroupApproximation.manuscriptMaximalGroupCStarUniversalProperty",
              "GroupApproximation.MaximalCStarParagraphEndpoint.manuscriptMaximalCStarStrictCompressionRemark":
                  "GroupApproximation.MaximalCStarPrintedHypotheses.manuscriptMaximalCStarRemarkFromPrintedHypotheses",
          }
          for old, new in swaps.items():
              if t.count(old) != 1:
                  raise SystemExit(f"roster: expected one {old}")
              t = t.replace(old, new, 1)
          p.write_text(t)

          # Regrade the two ledger rows whose own notes already record that the
          # stronger declarations have landed and passed the repository's green
          # Build-and-audit certificate.
          p = Path("metadata/NON_MF_PROOF_LEDGER.md")
          lines = p.read_text().splitlines()
          seen = set()
          out = []
          for line in lines:
              if line.startswith("| MC.02 |"):
                  seen.add("MC.02")
                  line = line.replace(
                      "`manuscriptUniverseRelativeMaximalGroupCStar`",
                      "`manuscriptMaximalGroupCStarUniversalProperty`", 1)
                  line = line.replace(
                      "| MISMATCH | EXACT | literal |",
                      "| EXACT | EXACT | literal |", 1)
                  line += "  **RETARGETED 2026-08-18:** the manuscript and independent claim map now cite the all-universe theorem the row already recorded as certified."
              elif line.startswith("| PRE.19 |"):
                  seen.add("PRE.19")
                  line = line.replace(
                      "`manuscriptUniverseRelativeMaximalGroupCStar`",
                      "`manuscriptPrintedMaximalGroupCStar`; `manuscriptMaximalGroupCStarUniversalProperty`", 1)
                  line = line.replace(
                      "| MISMATCH | MISMATCH | substituted |",
                      "| EXACT | EXACT | literal |", 1)
                  line += "  **CLOSED 2026-08-18:** `MaximalCStarPrintedCompletion.manuscriptPrintedMaximalGroupCStar` identifies the printed supremum-norm completion with the development's model, and the all-universe wrapper supplies the unrestricted universal property."
              out.append(line)
          if seen != {"MC.02", "PRE.19"}:
              raise SystemExit(f"ledger rows not found: {seen}")
          p.write_text("\n".join(out) + "\n")
          PY

      - name: Regenerate manuscript metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/regenerate_non_mf_claim_manifest.py
          python3 scripts/check_non_mf_proof_ledger.py \
            --tex non_mf_groups_exist.tex \
            --ledger metadata/NON_MF_PROOF_LEDGER.md \
            --repin-header

      - name: Cache Lean toolchain
        id: elan-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.elan
          key: ${{ runner.os }}-elan-${{ hashFiles('lean-toolchain') }}

      - name: Install elan
        if: steps.elan-cache.outputs.cache-hit != 'true'
        run: curl https://raw.githubusercontent.com/leanprover/elan/464c9d28395000a2a0128e07081e4956d50eced2/elan-init.sh -sSf | sh -s -- -y

      - name: Add elan to PATH
        run: echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Restore Lake dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .lake/packages
          key: ${{ runner.os }}-lake-deps-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            ${{ runner.os }}-lake-deps-

      - name: Restore compiled project
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .lake/build
          key: ${{ runner.os }}-non-mf-referee-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml', 'GroupApproximation.lean', 'GroupApproximation/**/*.lean') }}
          restore-keys: |
            ${{ runner.os }}-nonsofic-build-
            ${{ runner.os }}-non-mf-

      - name: Fetch precompiled Mathlib
        run: lake exe cache get

      - name: Build formal development and regenerate exact signatures
        shell: bash
        run: |
          set -euo pipefail
          lake build
          lake env lean scripts/Signatures.lean

      - name: Run manuscript and source gates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/referee-repair
          python3 scripts/check_non_mf_zero_input.py --tex non_mf_groups_exist.tex
          python3 scripts/regenerate_non_mf_claim_manifest.py \
            --output build/referee-repair/NON_MF_NUMBERED_CLAIMS.generated.json
          diff -u metadata/NON_MF_NUMBERED_CLAIMS.json \
            build/referee-repair/NON_MF_NUMBERED_CLAIMS.generated.json
          python3 scripts/check_non_mf_refs.py \
            --tex non_mf_groups_exist.tex \
            --check-decls \
            --extra-declarations-from metadata/NON_MF_NUMBERED_CLAIMS.json
          python3 scripts/check_non_mf_claim_manifest.py \
            --tex non_mf_groups_exist.tex \
            --manifest metadata/NON_MF_NUMBERED_CLAIMS.json \
            --signature-roster metadata/NON_MF_CLAIM_DECLS.txt
          python3 scripts/check_non_mf_unconditional.py \
            --tex non_mf_groups_exist.tex \
            --baseline metadata/NON_MF_UNCONDITIONAL_BASELINE.txt
          python3 scripts/check_non_mf_proof_ledger.py \
            --tex non_mf_groups_exist.tex \
            --ledger metadata/NON_MF_PROOF_LEDGER.md
          python3 scripts/check_manuscript_claims.py \
            --tex non_mf_groups_exist.tex --strict
          python3 scripts/check_prose_decl_names.py --repo . --quiet
          python3 scripts/check.py

      - name: Commit repairs and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-non-mf-referee-repairs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add non_mf_groups_exist.tex \
            scripts/regenerate_non_mf_claim_manifest.py \
            metadata/NON_MF_CLAIM_DECLS.txt \
            metadata/NON_MF_CLAIM_SIGNATURES.md \
            metadata/NON_MF_NUMBERED_CLAIMS.json \
            metadata/NON_MF_PROOF_LEDGER.md \
            .github/workflows/apply-non-mf-referee-repairs.yml
          git diff --cached --check
          git commit -m "Polish non-MF manuscript after referee audit"
          git push origin HEAD:agent/non-mf-referee-repair
