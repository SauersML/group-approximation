name: Unique Games research replay

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unique-games-research.yml'
      - 'scripts/check_unique_games_noisy_direction.py'
      - 'research/artifacts/unique-games-noisy-direction-*'
      - 'research/noisy-affine-selector-*.md'
      - 'research/affine-orientation-*.md'
      - 'research/glue-lemma-*.md'
      - 'research/triangle-defect-*.md'
      - 'research/rich-2to1-*.md'
      - 'research/unique-games-conjecture.md'
      - 'research/ugc-*.md'
      - 'tools/cairn.py'
      - 'bin/cairn'
  pull_request:
    paths:
      - '.github/workflows/unique-games-research.yml'
      - 'scripts/check_unique_games_noisy_direction.py'
      - 'research/artifacts/unique-games-noisy-direction-*'
      - 'research/noisy-affine-selector-*.md'
      - 'research/affine-orientation-*.md'
      - 'research/glue-lemma-*.md'
      - 'research/triangle-defect-*.md'
      - 'research/rich-2to1-*.md'
      - 'research/unique-games-conjecture.md'
      - 'research/ugc-*.md'
      - 'tools/cairn.py'
      - 'bin/cairn'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unique-games-replay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CAIRN_STATE: ${{ github.workspace }}/.cairn/state
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Cairn validates historical artifact pins throughout the graph.
          fetch-depth: 0
      - name: Compile and validate the research graph
        run: bin/cairn check
      - name: Replay exact arithmetic and verify the UGC dependency state
        run: python3 scripts/check_unique_games_noisy_direction.py --check --graph .cairn/cache/graph.json
