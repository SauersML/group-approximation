name: Palomar XXII final package
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
    - name: Check out the final package
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        fetch-depth: 2
    - name: Install metadata validators
      run: python3 -m pip install PyYAML==6.0.3 jsonschema==4.25.1
    - name: Validate all submitted files
      run: |-
        curl -fsSL https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/99c678e569c7c4c0772db297c5ddd5e4c9b6322e/schema/formalization.schema.json -o "$RUNNER_TEMP/schema.json"
        python3 scripts/check_submission.py "$RUNNER_TEMP/schema.json"
    - name: Require the full verification result and identical proof inputs
      run: |-
        git diff --exit-code 2a0aa5c952325f633690c0d0531cbc81f3b5456b HEAD -- '*.lean' lean-toolchain lakefile.toml lake-manifest.json Palomar/comparator-stw-xxii.json scripts/check_submission.py .github/workflows/palomar-comparator.yml
        curl -fsSL https://api.github.com/repos/SauersML/group-approximation/actions/runs/34806058250 -o "$RUNNER_TEMP/full-verification.json"
        python3 - "$RUNNER_TEMP/full-verification.json" <<'PYCHECK'
        import json, sys
        run = json.load(open(sys.argv[1]))
        assert run['head_sha'] == '2a0aa5c952325f633690c0d0531cbc81f3b5456b'
        assert run['status'] == 'completed' and run['conclusion'] == 'success'
        print('PASS: the verified Lean sources, build environment, configuration, and verification workflow are byte-identical.')
        PYCHECK
