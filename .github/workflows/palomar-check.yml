name: Palomar XXII final package
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
    - name: Check out the final package
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        fetch-depth: 3
    - name: Install metadata validators
      run: python3 -m pip install PyYAML==6.0.3 jsonschema==4.25.1
    - name: Validate all submitted files
      run: |-
        curl -fsSL https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/99c678e569c7c4c0772db297c5ddd5e4c9b6322e/schema/formalization.schema.json -o "$RUNNER_TEMP/schema.json"
        python3 scripts/check_submission.py "$RUNNER_TEMP/schema.json"
    - name: Require the full verification result and identical proof inputs
      run: |-
        git diff --exit-code 2a0aa5c952325f633690c0d0531cbc81f3b5456b HEAD -- lean-toolchain lakefile.toml lake-manifest.json Palomar/comparator-stw-xxii.json scripts/check_submission.py .github/workflows/palomar-comparator.yml
        curl -fsSL https://api.github.com/repos/SauersML/group-approximation/actions/runs/34806058250 -o "$RUNNER_TEMP/full-verification.json"
        python3 - "$RUNNER_TEMP/full-verification.json" <<'PYCHECK'
        from pathlib import Path
        import json, subprocess, sys
        baseline = '2a0aa5c952325f633690c0d0531cbc81f3b5456b'
        run = json.load(open(sys.argv[1]))
        assert run['head_sha'] == baseline
        assert run['status'] == 'completed' and run['conclusion'] == 'success'
        banner = '/-\nLocal adaptation of the HamSandwich development at\nhttps://github.com/akopjan/HamSandwich/tree/76202dbbb6610ffcebbccfbf7a56f833a4c2a376\nChanged for this repository: namespace isolation, Lean 4.32 porting,\nand local proof integration. The original license is retained in this tree.\n-/\n'
        old_paths = subprocess.check_output(['git', 'ls-tree', '-r', '--name-only', baseline], text=True).splitlines()
        new_paths = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
        old_lean = {p for p in old_paths if p.endswith('.lean')}
        new_lean = {p for p in new_paths if p.endswith('.lean')}
        assert old_lean == new_lean
        for path in sorted(old_lean):
            old = subprocess.check_output(['git', 'show', baseline + ':' + path])
            prefix = banner.encode() if path.startswith('GroupApproximation/ThirdParty/HamSandwich/') else b''
            assert Path(path).read_bytes() == prefix + old, path
        print('PASS: only the fixed provenance comment was added to copied topology files; every proof body and all other Lean sources are byte-identical to the verified revision.')
        PYCHECK
