name: Palomar check

# The fast half of the Palomar gate: minutes, not hours, and independent of
# the prover workflow.
#
# WHY SEPARATE.  `prover.yml` is the certificate path and takes hours, and
# every run is cancelled the moment a newer commit lands -- with several
# agents pushing continuously, a completed verdict on the Palomar surface can
# be a long time coming, and it is coupled to breakage in modules that have
# nothing to do with the submission.  This job restores the build cache the
# prover workflow saves, builds ONLY the Palomar libraries and whatever of
# the development they pull in, and runs the checks that decide whether the
# submissions are coherent.
#
# SEVERAL CONFIGURATIONS.  A Palomar submission is exactly one Comparator
# configuration, and this repository offers one per result:
# `Palomar/comparator.json` for the sofic-not-MF group,
# `Palomar/comparator-lix.json` for the three STW Problem LIX theorems,
# `Palomar/comparator-lix-strong.json` for the three strengthened ones,
# `Palomar/comparator-bowen-chapman.json` for Bowen-Chapman Problem 1.1,
# `Palomar/comparator-pestov91.json` for Pestov's Open Question 9.1, and
# `Palomar/comparator-type-a2.json` for Question 5.8 of Fournier-Facio, Wu and
# Zaremsky.  So there are two libraries, one axiom driver and one
# statement-match pair per configuration, and every check below runs for all of
# them.  A step that covered only some would leave a surface ungated while
# looking exactly like a green gate.
#
# Three are PENDING -- the strengthened LIX pair, Pestov 9.1 and FFWZ 5.8: each
# solution proves each selected statement from a proposition the development
# still owes, so its theorems carry a hypothesis the challenge's do not.  Two
# consequences, both deliberate.  The statement-match script gates those pairs
# on the SHARED BLOCK only, which is the part that can hold and is the part that
# failed here on 2026-09-10; and their axiom-closure drivers gate in full,
# because the `_of` forms are sorry-free and their closure is already the
# closure the finished theorems will have.
# `scripts/check_palomar_submission.py` is where the pending list lives.
#
# WHAT IT DOES NOT DO.  It does not run Comparator; that is
# `palomar-comparator.yml`, manual, and slow because it exports and
# kernel-replays the whole proof closure.  What runs here is the check that
# reproduces Comparator's COMPARISON: the compared declaration's transitive
# constant closure, with the type and value hash of every constant, dumped
# from each module's own environment and diffed.  That is what catches the
# defect Comparator catches -- an instance resolved differently on the two
# sides -- and it takes seconds.

on:
  push:
    paths:
      - 'Palomar/**'
      - 'scripts/check_palomar_submission.py'
      - 'scripts/check_palomar_statement_match.sh'
      - 'scripts/PalomarChallengeType.lean'
      - 'scripts/PalomarSolutionType.lean'
      - 'scripts/PalomarAxioms.lean'
      - 'scripts/PalomarLIXChallengeType.lean'
      - 'scripts/PalomarLIXSolutionType.lean'
      - 'scripts/PalomarLIXAxioms.lean'
      - 'scripts/PalomarLIXStrongChallengeType.lean'
      - 'scripts/PalomarLIXStrongSolutionType.lean'
      - 'scripts/PalomarLIXStrongAxioms.lean'
      - 'scripts/PalomarBowenChapmanChallengeType.lean'
      - 'scripts/PalomarBowenChapmanSolutionType.lean'
      - 'scripts/PalomarBowenChapmanAxioms.lean'
      - 'scripts/PalomarPestov91ChallengeType.lean'
      - 'scripts/PalomarPestov91SolutionType.lean'
      - 'scripts/PalomarPestov91Axioms.lean'
      - 'scripts/PalomarTypeA2ChallengeType.lean'
      - 'scripts/PalomarTypeA2SolutionType.lean'
      - 'scripts/PalomarTypeA2Axioms.lean'
      - 'formalization.yaml'
      - 'lakefile.toml'
      - 'lean-toolchain'
      - 'lake-manifest.json'
      - '.github/workflows/palomar-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: palomar-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Palomar surface
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # The source-level half needs no Lean at all, so it runs first and fails
      # fast.  PyYAML is installed if absent: in CI the metadata check refuses
      # to skip, because a check that quietly does not run reads exactly like
      # one that passed.
      - name: Calibrate and run the submission gate
        run: |
          python3 -c 'import yaml' 2>/dev/null \
            || python3 -m pip install --disable-pip-version-check --no-deps PyYAML==6.0.3
          python3 scripts/check_palomar_submission.py --self-test
          python3 scripts/check_palomar_submission.py

      - name: Cache Lean toolchain
        id: elan-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.elan
          key: ${{ runner.os }}-elan-${{ hashFiles('lean-toolchain') }}

      - name: Install elan
        if: steps.elan-cache.outputs.cache-hit != 'true'
        run: curl https://raw.githubusercontent.com/leanprover/elan/464c9d28395000a2a0128e07081e4956d50eced2/elan-init.sh -sSf | sh -s -- -y

      - name: Add elan to PATH
        run: echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # Read-only.  The prover workflow owns these caches; this job borrows
      # them and saves nothing, so it can never displace the entry the
      # certificate path depends on.
      - name: Restore Lake dependencies
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .lake/packages
          key: ${{ runner.os }}-lake-deps-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            ${{ runner.os }}-lake-deps-

      - name: Restore compiled project
        id: build-restore
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .lake/build
          key: ${{ runner.os }}-nonsofic-build-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml', 'GroupApproximation.lean', 'GroupApproximation/**/*.lean', 'Palomar/**/*.lean') }}
          restore-keys: |
            ${{ runner.os }}-nonsofic-build-

      - name: Restore Mathlib olean archives
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/mathlib
          key: ${{ runner.os }}-mathlib-archives-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - name: Report the warm-start state
        run: |
          if [ -z "${{ steps.build-restore.outputs.cache-matched-key }}" ]; then
            echo "::warning::no compiled-project cache was found; this build"
            echo "::warning::starts from Mathlib and may exceed the timeout."
          else
            echo "restored ${{ steps.build-restore.outputs.cache-matched-key }}"
          fi

      - name: Fetch precompiled Mathlib
        run: lake exe cache get

      - name: Build the Palomar modules
        run: |
          lake build PalomarChallenge PalomarSolution \
                     PalomarLIXChallenge PalomarLIXSolution \
                     PalomarLIXStrongChallenge PalomarLIXStrongSolution \
                     PalomarBowenChapmanChallenge PalomarBowenChapmanSolution \
                     PalomarPestov91Challenge PalomarPestov91Solution \
                     PalomarTypeA2Challenge PalomarTypeA2Solution

      # The check that reproduces Comparator's comparison, for every pair;
      # the script loops over the configurations and fails if a
      # submittable pair's statements differ or a pending pair's shared block
      # does.
      - name: Palomar statement match
        run: bash scripts/check_palomar_statement_match.sh

      # The third of Comparator's three verdicts, and the only one nothing
      # else here reproduced: the axiom closure of the solution's proof.  The
      # drivers are not library roots, so a failure stops this step and not
      # anyone's `lake build`.
      #
      # Every driver runs even if an earlier one fails, so that one
      # dispatch tells the whole story: `lake env lean` exits nonzero on a
      # `logError`, and without the `if: always()` a bad closure on the non-MF
      # side would hide whatever the others do.  The final step turns any failure into
      # the job's verdict, because a step that is allowed to fail and is never
      # read is a step that certifies nothing.
      - name: Palomar axiom closure (non-MF)
        id: axioms-nonmf
        continue-on-error: true
        if: always()
        run: lake env lean scripts/PalomarAxioms.lean

      - name: Palomar axiom closure (LIX)
        id: axioms-lix
        continue-on-error: true
        if: always()
        run: lake env lean scripts/PalomarLIXAxioms.lean

      # The strengthened surface is a pending SUBMISSION and not a pending
      # PROOF: its `_of` theorems are sorry-free, so a `sorryAx` reaching them
      # through the development is a real defect today.  This step gates like
      # the other two.
      - name: Palomar axiom closure (LIX, strengthened)
        id: axioms-lix-strong
        continue-on-error: true
        if: always()
        run: lake env lean scripts/PalomarLIXStrongAxioms.lean

      # The Bowen-Chapman surface: the two compared theorems, from the endpoint.
      - name: Palomar axiom closure (Bowen-Chapman)
        id: axioms-bowen-chapman
        continue-on-error: true
        if: always()
        run: lake env lean scripts/PalomarBowenChapmanAxioms.lean

      # The Pestov 9.1 and FFWZ Question 5.8 surfaces are pending too, and gate
      # in full for the reason given for the strengthened LIX surface.
      - name: Palomar axiom closure (Pestov 9.1)
        id: axioms-pestov91
        continue-on-error: true
        if: always()
        run: lake env lean scripts/PalomarPestov91Axioms.lean

      - name: Palomar axiom closure (FFWZ 5.8)
        id: axioms-type-a2
        continue-on-error: true
        if: always()
        run: lake env lean scripts/PalomarTypeA2Axioms.lean

      - name: Reject a run whose axiom closures were not all clean
        if: always()
        run: |
          nonmf='${{ steps.axioms-nonmf.outcome }}'
          lix='${{ steps.axioms-lix.outcome }}'
          strong='${{ steps.axioms-lix-strong.outcome }}'
          bc='${{ steps.axioms-bowen-chapman.outcome }}'
          p91='${{ steps.axioms-pestov91.outcome }}'
          a2='${{ steps.axioms-type-a2.outcome }}'
          echo "non-MF closure: $nonmf"
          echo "LIX closure: $lix"
          echo "LIX strengthened closure: $strong"
          echo "Bowen-Chapman closure: $bc"
          echo "Pestov 9.1 closure: $p91"
          echo "FFWZ 5.8 closure: $a2"
          # `skipped` counts as a failure: the closure was not computed, and a
          # check that did not run must not read like one that passed.
          if [ "$nonmf" != success ] || [ "$lix" != success ] \
             || [ "$strong" != success ] || [ "$bc" != success ] \
             || [ "$p91" != success ] || [ "$a2" != success ]; then
            echo "::error::an axiom-closure driver did not report success"
            exit 1
          fi
