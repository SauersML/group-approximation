name: Canonical P13 sharded build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  foundation:
    name: Build shared P13 foundation
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate the P13 shard roster
        run: python3 scripts/p13_build_shards.py self-test

      - name: Restore exact-revision foundation archive
        id: foundation-archive-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/p13-artifacts/p13-foundation.tar.gz
          key: ${{ runner.os }}-p13-foundation-v1-${{ github.sha }}

      - name: Cache Lean toolchain
        if: steps.foundation-archive-cache.outputs.cache-hit != 'true'
        id: elan-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.elan
          key: ${{ runner.os }}-elan-${{ hashFiles('lean-toolchain') }}

      - name: Install elan
        if: >-
          steps.foundation-archive-cache.outputs.cache-hit != 'true' &&
          steps.elan-cache.outputs.cache-hit != 'true'
        run: curl https://raw.githubusercontent.com/leanprover/elan/464c9d28395000a2a0128e07081e4956d50eced2/elan-init.sh -sSf | sh -s -- -y

      - name: Add elan to PATH
        if: steps.foundation-archive-cache.outputs.cache-hit != 'true'
        run: echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache Lake dependencies
        if: steps.foundation-archive-cache.outputs.cache-hit != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .lake/packages
          key: ${{ runner.os }}-lake-deps-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            ${{ runner.os }}-lake-deps-

      - name: Cache Mathlib olean archives
        if: steps.foundation-archive-cache.outputs.cache-hit != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/mathlib
          key: ${{ runner.os }}-mathlib-archives-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - name: Fetch precompiled Mathlib
        if: steps.foundation-archive-cache.outputs.cache-hit != 'true'
        run: lake exe cache get

      - name: Build and archive the P13 foundation
        if: steps.foundation-archive-cache.outputs.cache-hit != 'true'
        run: >-
          python3 scripts/p13_build_shards.py build-foundation
          --archive build/p13-artifacts/p13-foundation.tar.gz

      - name: Upload the P13 foundation
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: p13-foundation-${{ github.sha }}
          path: build/p13-artifacts/p13-foundation.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 2

  shard:
    name: Build P13 shard ${{ matrix.shard }}
    needs: foundation
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: [0, 1, 2, 3, 4, 5]

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Restore exact-revision shard archive
        id: shard-archive-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/p13-artifacts/p13-shard-${{ matrix.shard }}.tar.gz
          key: ${{ runner.os }}-p13-shard-v1-${{ github.sha }}-${{ matrix.shard }}

      - name: Cache Lean toolchain
        if: steps.shard-archive-cache.outputs.cache-hit != 'true'
        id: elan-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.elan
          key: ${{ runner.os }}-elan-${{ hashFiles('lean-toolchain') }}

      - name: Install elan
        if: >-
          steps.shard-archive-cache.outputs.cache-hit != 'true' &&
          steps.elan-cache.outputs.cache-hit != 'true'
        run: curl https://raw.githubusercontent.com/leanprover/elan/464c9d28395000a2a0128e07081e4956d50eced2/elan-init.sh -sSf | sh -s -- -y

      - name: Add elan to PATH
        if: steps.shard-archive-cache.outputs.cache-hit != 'true'
        run: echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache Lake dependencies
        if: steps.shard-archive-cache.outputs.cache-hit != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .lake/packages
          key: ${{ runner.os }}-lake-deps-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            ${{ runner.os }}-lake-deps-

      - name: Cache Mathlib olean archives
        if: steps.shard-archive-cache.outputs.cache-hit != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/mathlib
          key: ${{ runner.os }}-mathlib-archives-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - name: Fetch precompiled Mathlib
        if: steps.shard-archive-cache.outputs.cache-hit != 'true'
        run: lake exe cache get

      - name: Download the shared P13 foundation
        if: steps.shard-archive-cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: p13-foundation-${{ github.sha }}
          path: build/p13-input

      - name: Restore the shared P13 foundation
        if: steps.shard-archive-cache.outputs.cache-hit != 'true'
        run: >-
          python3 scripts/p13_build_shards.py restore-foundation
          --archive build/p13-input/p13-foundation.tar.gz

      - name: Build and archive this bounded P13 shard
        if: steps.shard-archive-cache.outputs.cache-hit != 'true'
        run: >-
          python3 scripts/p13_build_shards.py build-shard
          --shard ${{ matrix.shard }}
          --archive build/p13-artifacts/p13-shard-${{ matrix.shard }}.tar.gz

      - name: Upload this P13 shard
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: p13-shard-${{ matrix.shard }}-${{ github.sha }}
          path: build/p13-artifacts/p13-shard-${{ matrix.shard }}.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 2
