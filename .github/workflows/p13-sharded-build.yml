name: Canonical P13 sharded build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  foundation:
    name: Build shared P13 foundation
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate the P13 shard roster
        run: python3 scripts/p13_build_shards.py self-test

      - name: Compute the P13 foundation content cache key
        id: p13-foundation-cache-key
        shell: bash
        run: |
          digest=$(python3 scripts/p13_build_shards.py cache-key foundation)
          if [[ ! "$digest" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::invalid P13 foundation content cache key: $digest"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Restore content-identical foundation archive
        id: foundation-archive-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/p13-artifacts/p13-foundation.tar.gz
          key: ${{ runner.os }}-${{ runner.arch }}-p13-foundation-v3-${{ steps.p13-foundation-cache-key.outputs.digest }}

      - name: Cache Lean toolchain
        if: steps.foundation-archive-cache.outputs.cache-hit != 'true'
        id: elan-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.elan
          key: ${{ runner.os }}-elan-${{ hashFiles('lean-toolchain') }}

      - name: Install elan
        if: >-
          steps.foundation-archive-cache.outputs.cache-hit != 'true' &&
          steps.elan-cache.outputs.cache-hit != 'true'
        run: curl https://raw.githubusercontent.com/leanprover/elan/464c9d28395000a2a0128e07081e4956d50eced2/elan-init.sh -sSf | sh -s -- -y

      - name: Add elan to PATH
        if: steps.foundation-archive-cache.outputs.cache-hit != 'true'
        run: echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache Lake dependencies
        if: steps.foundation-archive-cache.outputs.cache-hit != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .lake/packages
          key: ${{ runner.os }}-lake-deps-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            ${{ runner.os }}-lake-deps-

      - name: Cache Mathlib olean archives
        if: steps.foundation-archive-cache.outputs.cache-hit != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/mathlib
          key: ${{ runner.os }}-mathlib-archives-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - name: Fetch precompiled Mathlib
        if: steps.foundation-archive-cache.outputs.cache-hit != 'true'
        run: lake exe cache get

      - name: Build and archive the P13 foundation
        if: steps.foundation-archive-cache.outputs.cache-hit != 'true'
        run: >-
          python3 scripts/p13_build_shards.py build-foundation
          --archive build/p13-artifacts/p13-foundation.tar.gz

      - name: Upload the P13 foundation
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: p13-foundation-${{ github.sha }}
          path: build/p13-artifacts/p13-foundation.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  shard:
    name: Build P13 shard ${{ matrix.shard }}
    needs: foundation
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # Three direct blocks (twelve large kernel computations) per runner.
      # Seven shards cover the 21 diagonal/upper-triangular blocks; four at a
      # time leaves capacity when another pipeline overlaps.
      max-parallel: 4
      matrix:
        shard:
          - 0
          - 1
          - 2
          - 3
          - 4
          - 5
          - 6

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Compute this P13 shard content cache key
        id: p13-shard-cache-key
        shell: bash
        run: |
          digest=$(python3 scripts/p13_build_shards.py cache-key shard --shard "${{ matrix.shard }}")
          if [[ ! "$digest" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::invalid P13 shard content cache key: $digest"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Restore content-identical shard archive
        id: shard-archive-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/p13-artifacts/p13-shard-${{ matrix.shard }}.tar.gz
          key: ${{ runner.os }}-${{ runner.arch }}-p13-shard-v3-${{ steps.p13-shard-cache-key.outputs.digest }}

      - name: Cache Lean toolchain
        if: steps.shard-archive-cache.outputs.cache-hit != 'true'
        id: elan-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.elan
          key: ${{ runner.os }}-elan-${{ hashFiles('lean-toolchain') }}

      - name: Install elan
        if: >-
          steps.shard-archive-cache.outputs.cache-hit != 'true' &&
          steps.elan-cache.outputs.cache-hit != 'true'
        run: curl https://raw.githubusercontent.com/leanprover/elan/464c9d28395000a2a0128e07081e4956d50eced2/elan-init.sh -sSf | sh -s -- -y

      - name: Add elan to PATH
        if: steps.shard-archive-cache.outputs.cache-hit != 'true'
        run: echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache Lake dependencies
        if: steps.shard-archive-cache.outputs.cache-hit != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .lake/packages
          key: ${{ runner.os }}-lake-deps-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            ${{ runner.os }}-lake-deps-

      - name: Cache Mathlib olean archives
        if: steps.shard-archive-cache.outputs.cache-hit != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/mathlib
          key: ${{ runner.os }}-mathlib-archives-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - name: Fetch precompiled Mathlib
        if: steps.shard-archive-cache.outputs.cache-hit != 'true'
        run: lake exe cache get

      - name: Download the shared P13 foundation
        if: steps.shard-archive-cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: p13-foundation-${{ github.sha }}
          path: build/p13-input

      - name: Restore the shared P13 foundation
        if: steps.shard-archive-cache.outputs.cache-hit != 'true'
        run: >-
          python3 scripts/p13_build_shards.py restore-foundation
          --archive build/p13-input/p13-foundation.tar.gz

      - name: Build and archive this bounded P13 shard
        if: steps.shard-archive-cache.outputs.cache-hit != 'true'
        run: >-
          python3 scripts/p13_build_shards.py build-shard
          --shard ${{ matrix.shard }}
          --archive build/p13-artifacts/p13-shard-${{ matrix.shard }}.tar.gz

      - name: Upload this P13 shard
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: p13-shard-${{ matrix.shard }}-${{ github.sha }}
          path: build/p13-artifacts/p13-shard-${{ matrix.shard }}.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
