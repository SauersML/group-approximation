name: Apply non-MF referee repairs in PR

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: non-mf-referee-repair-pr
  cancel-in-progress: true

jobs:
  repair:
    if: github.head_ref == 'agent/non-mf-referee-repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: agent/non-mf-referee-repair
          fetch-depth: 0
          persist-credentials: true

      - name: Apply deterministic repairs
        run: |
          python3 scripts/apply_non_mf_referee_repairs.py
          python3 scripts/fix_non_mf_referee_ledger.py

      - name: Regenerate manuscript metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/regenerate_non_mf_claim_manifest.py
          python3 scripts/check_non_mf_refs.py --write-decls
          python3 scripts/check_non_mf_proof_ledger.py \
            --tex non_mf_groups_exist.tex \
            --ledger metadata/NON_MF_PROOF_LEDGER.md \
            --repin-header

      - name: Run source-level manuscript gates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/referee-repair
          python3 scripts/check_non_mf_zero_input.py --tex non_mf_groups_exist.tex
          python3 scripts/regenerate_non_mf_claim_manifest.py \
            --output build/referee-repair/NON_MF_NUMBERED_CLAIMS.generated.json
          diff -u metadata/NON_MF_NUMBERED_CLAIMS.json \
            build/referee-repair/NON_MF_NUMBERED_CLAIMS.generated.json
          python3 scripts/check_non_mf_refs.py \
            --tex non_mf_groups_exist.tex \
            --check-decls \
            --extra-declarations-from metadata/NON_MF_NUMBERED_CLAIMS.json
          python3 scripts/check_non_mf_claim_manifest.py \
            --tex non_mf_groups_exist.tex \
            --manifest metadata/NON_MF_NUMBERED_CLAIMS.json \
            --signature-roster metadata/NON_MF_CLAIM_DECLS.txt
          python3 scripts/check_non_mf_unconditional.py \
            --tex non_mf_groups_exist.tex \
            --baseline metadata/NON_MF_UNCONDITIONAL_BASELINE.txt
          python3 scripts/check_non_mf_proof_ledger.py \
            --tex non_mf_groups_exist.tex \
            --ledger metadata/NON_MF_PROOF_LEDGER.md
          python3 scripts/check_manuscript_claims.py \
            --tex non_mf_groups_exist.tex --strict
          python3 scripts/check_prose_decl_names.py --repo . --quiet

      - name: Commit repairs and remove temporary machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/apply-non-mf-referee-repairs.yml \
            .github/workflows/apply-non-mf-referee-repairs-pr.yml \
            scripts/apply_non_mf_referee_repairs.py \
            scripts/fix_non_mf_referee_ledger.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Polish non-MF manuscript after referee audit"
          git push origin HEAD:agent/non-mf-referee-repair
