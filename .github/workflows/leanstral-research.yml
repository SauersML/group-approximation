name: Leanstral research agent

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      focus:
        description: Optional theorem, module, paper claim, or Cairn node to prioritize
        required: false
        type: string
      check_ledger_write:
        description: >-
          Prove the Actions token can create and move refs/leanstral/* against a
          throwaway ref, without selecting or reserving a real target.
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - '.github/workflows/leanstral-research.yml'
      - 'scripts/leanstral_novelty.py'
      - 'scripts/leanstral_ledger.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/leanstral-research.yml'
      - 'scripts/leanstral_novelty.py'
      - 'scripts/leanstral_ledger.py'

# Every actual model run reserves a unique (file, declaration) before inference, so
# failed/no-change runs and unmerged/closed PRs still consume their target. The
# ledger lives at the git ref refs/leanstral/ledger: real objects in this repo,
# permanent, but outside refs/heads and refs/tags, so it is neither a branch nor a
# tag. This concurrency group serialises appends; see scripts/leanstral_ledger.py.
concurrency:
  group: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && format('leanstral-research-smoke-{0}', github.event.pull_request.number || github.ref) || 'leanstral-research-agent' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'
  VIBE_VERSION: '2.23.1'
  LEAN_LSP_MCP_VERSION: '0.28.1'
  # Must match the [[models]] name written into the Vibe config below; the
  # Configure step asserts they have not drifted apart.
  LEANSTRAL_MODEL: 'labs-leanstral-1-5'

jobs:
  smoke:
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Test novelty selector
        run: python scripts/leanstral_novelty.py --self-test
      - name: Test ledger encoding
        run: python scripts/leanstral_ledger.py self-test
      - name: Ledger chain holds every row ever reserved
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/leanstral_ledger.py verify
      - name: Dry-run live target selection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ledger="$RUNNER_TEMP/ledger.tsv"; blocked="$RUNNER_TEMP/blocked.txt"; ids="$RUNNER_TEMP/ids.txt"
          : > "$blocked"
          python scripts/leanstral_ledger.py read > "$ledger"
          awk -F '\t' 'NF>=4 {print $1}' "$ledger" | sort -u > "$ids"
          gh pr list --repo "$GITHUB_REPOSITORY" --state all --limit 1000 --json number,headRefName \
            | jq -r '.[]|select(.headRefName|test("^automation/leanstral-[0-9]+$"))|[.number,.headRefName]|@tsv' \
            | while IFS=$'\t' read -r pr branch; do
                rid="${branch##*-}"
                if ! grep -Fxq "$rid" "$ids"; then
                  gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$pr/files?per_page=100" --jq '.[].filename' >> "$blocked"
                fi
              done
          sort -u -o "$blocked" "$blocked"
          python scripts/leanstral_novelty.py --ledger "$ledger" --bootstrap-blocked "$blocked" --focus "${{ inputs.focus }}"

  # The reservation write path is exercised on a throwaway ref, because the real
  # one only gets written when a model run actually starts -- so a permission
  # problem would otherwise surface for the first time mid-reservation.
  ledger-write-check:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.check_ledger_write }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          import leanstral_ledger as L

          L.REF = 'refs/leanstral/write-check'
          L._api(f'repos/{L._repo()}/git/refs/{L.REF[5:]}', 'DELETE')
          assert L.tip() is None, 'stale write-check ref could not be removed'
          L.append('1', 'check/a.lean', 'first')     # creates the ref
          L.append('2', 'check/b.lean', 'second')    # moves the ref
          rows = L.read_at(L.tip())
          assert [r[0] for r in rows] == ['1', '2'], rows
          try:
              L.append('3', 'check/a.lean', 'first')
              raise SystemExit('duplicate reservation was not refused')
          except L.LedgerError:
              pass
          L._api(f'repos/{L._repo()}/git/refs/{L.REF[5:]}', 'DELETE')
          assert L.tip() is None, 'write-check ref outlived the check'
          print('ledger write path OK: create, append, refuse duplicate, delete')
          PY

  auth:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      configured: ${{ steps.a.outputs.configured }}
    steps:
      - id: a
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          set -uo pipefail
          if [[ -z "${MISTRAL_API_KEY:-}" ]]; then
            echo '::notice::MISTRAL_API_KEY is not configured; no target is consumed.'
            echo 'configured=false' >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Reservations are permanent, so a target must never be consumed by a run
          # that cannot reach the model at all. Probe the real completions endpoint
          # (a key can be valid while the Labs model stays disabled org-wide) for one
          # token before anything is reserved.
          body="$RUNNER_TEMP/probe.json"
          code="$(curl -sS -o "$body" -w '%{http_code}' --max-time 60 \
            https://api.mistral.ai/v1/chat/completions \
            -H "Authorization: Bearer $MISTRAL_API_KEY" \
            -H 'Content-Type: application/json' \
            -d "{\"model\":\"$LEANSTRAL_MODEL\",\"messages\":[{\"role\":\"user\",\"content\":\"ping\"}],\"max_tokens\":1}" || echo 000)"
          if [[ "$code" == 2* ]]; then
            echo "::notice::$LEANSTRAL_MODEL reachable (HTTP $code)."
            echo 'configured=true' >> "$GITHUB_OUTPUT"; exit 0
          fi
          msg="$(jq -r '.message // .error.message // empty' "$body" 2>/dev/null | head -c 400)"
          echo "::warning::$LEANSTRAL_MODEL unreachable (HTTP $code): ${msg:-no message}. No target is consumed."
          echo 'configured=false' >> "$GITHUB_OUTPUT"

  select:
    needs: auth
    if: ${{ needs.auth.outputs.configured == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: read
    outputs:
      found: ${{ steps.pick.outputs.found }}
      target: ${{ steps.pick.outputs.target }}
      anchor: ${{ steps.pick.outputs.anchor }}
      line: ${{ steps.pick.outputs.line }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Selection and generation must see the exact same immutable proof tree.
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Build attempt history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ledger="$RUNNER_TEMP/ledger.tsv"; blocked="$RUNNER_TEMP/blocked.txt"; ids="$RUNNER_TEMP/ids.txt"
          : > "$blocked"
          python scripts/leanstral_ledger.py read > "$ledger"
          awk -F '\t' 'NF>=4 {print $1}' "$ledger" | sort -u > "$ids"
          gh pr list --repo "$GITHUB_REPOSITORY" --state all --limit 1000 --json number,headRefName \
            | jq -r '.[]|select(.headRefName|test("^automation/leanstral-[0-9]+$"))|[.number,.headRefName]|@tsv' \
            | while IFS=$'\t' read -r pr branch; do
                rid="${branch##*-}"
                if ! grep -Fxq "$rid" "$ids"; then
                  gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$pr/files?per_page=100" --jq '.[].filename' >> "$blocked"
                fi
              done
          sort -u -o "$blocked" "$blocked"
          echo "LEDGER=$ledger" >> "$GITHUB_ENV"
          echo "BLOCKED=$blocked" >> "$GITHUB_ENV"
      - id: pick
        name: Pick never-before-reserved declaration
        env:
          FOCUS: ${{ inputs.focus }}
        run: >-
          python scripts/leanstral_novelty.py
          --ledger "$LEDGER"
          --bootstrap-blocked "$BLOCKED"
          --focus "${FOCUS:-}"
          --github-output "$GITHUB_OUTPUT"
      - name: Reserve before inference
        if: steps.pick.outputs.found == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET: ${{ steps.pick.outputs.target }}
          ANCHOR: ${{ steps.pick.outputs.anchor }}
        run: >-
          python scripts/leanstral_ledger.py append
          --run-id "$GITHUB_RUN_ID" --target "$TARGET" --anchor "$ANCHOR"

  generate:
    needs: [auth, select]
    if: ${{ needs.auth.outputs.configured == 'true' && needs.select.outputs.found == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
      pull-requests: read
    outputs:
      has_changes: ${{ steps.patch.outputs.has_changes }}
      base_sha: ${{ steps.base.outputs.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Never silently move the reserved target onto a later main revision.
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: base
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git remote set-url --push origin https://example.invalid/leanstral-no-push
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - id: elan
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.elan
          key: ${{ runner.os }}-elan-${{ hashFiles('lean-toolchain') }}
          restore-keys: ${{ runner.os }}-elan-
      - if: steps.elan.outputs.cache-hit != 'true'
        run: curl https://raw.githubusercontent.com/leanprover/elan/464c9d28395000a2a0128e07081e4956d50eced2/elan-init.sh -sSf | sh -s -- -y
      - run: echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - id: deps
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .lake/packages
          key: ${{ runner.os }}-lake-deps-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
          restore-keys: ${{ runner.os }}-lake-deps-
      - if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/mathlib
          key: ${{ runner.os }}-mathlib-archives-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - if: steps.deps.outputs.cache-hit != 'true'
        run: lake exe cache get
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .lake/build
          key: ${{ runner.os }}-${{ runner.arch }}-leanstral-build-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-groupapprox-dev-build-v3-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
            ${{ runner.os }}-nonsofic-build-
      - name: Install Vibe and Lean LSP MCP
        run: |
          python -m venv "$RUNNER_TEMP/leanstral-venv"
          "$RUNNER_TEMP/leanstral-venv/bin/python" -m pip install --disable-pip-version-check "mistral-vibe==$VIBE_VERSION" "lean-lsp-mcp==$LEAN_LSP_MCP_VERSION"
          echo "$RUNNER_TEMP/leanstral-venv/bin" >> "$GITHUB_PATH"
      - name: Configure Leanstral
        run: |
          VIBE_HOME="$RUNNER_TEMP/vibe-home"; mkdir -p "$VIBE_HOME"
          cat > "$VIBE_HOME/config.toml" <<'TOML'
          installed_agents = ["lean"]
          bypass_tool_permissions = true
          active_model = "leanstral"
          [[providers]]
          name = "mistral-testing"
          api_base = "https://api.mistral.ai/v1"
          api_key_env_var = "MISTRAL_API_KEY"
          backend = "mistral"
          [[models]]
          name = "labs-leanstral-1-5"
          provider = "mistral-testing"
          alias = "leanstral"
          input_price = 0.0
          output_price = 0.0
          thinking = "high"
          temperature = 1.0
          auto_compact_threshold = 200000
          [[mcp_servers]]
          name = "lean-lsp"
          transport = "stdio"
          command = "lean-lsp-mcp"
          tool_timeout_sec = 600
          TOML
          grep -qF "name = \"$LEANSTRAL_MODEL\"" "$VIBE_HOME/config.toml" \
            || { echo "::error::LEANSTRAL_MODEL ($LEANSTRAL_MODEL) does not match the Vibe config"; exit 1; }
          echo "VIBE_HOME=$VIBE_HOME" >> "$GITHUB_ENV"
      - name: Load avoid-list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          h="$RUNNER_TEMP/history.tsv"
          python scripts/leanstral_ledger.py read > "$h"
          echo "HISTORY=$h" >> "$GITHUB_ENV"
      - name: Run Leanstral on reserved declaration
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          TARGET: ${{ needs.select.outputs.target }}
          ANCHOR: ${{ needs.select.outputs.anchor }}
          LINE: ${{ needs.select.outputs.line }}
          FOCUS: ${{ inputs.focus }}
        run: |
          set -euo pipefail
          recent="$(tail -n 200 "$HISTORY" || true)"
          prompt="You are Leanstral 1.5 in SauersML/group-approximation. Make one mathematically meaningful compiling Lean improvement near the permanently reserved declaration below. Prefer paper/Cairn research progress. NOVELTY IS HARD: every run reserves a different declaration before inference, even failed/no-change runs and unmerged PRs. Edit EXACTLY the assigned file; do not switch to another theorem. Do not semantically duplicate concepts in the reservation history. Never use sorry, admit, a new axiom, unsafe, or native_decide; do not weaken statements; do not use git commit/push/branch/PR. Use lean-lsp-mcp and Lean compilation aggressively. If this target has no worthwhile improvement, leave the tree unchanged; the next run will move elsewhere."
          prompt="$prompt"$'\n\n'"Assigned file: $TARGET"$'\n'"Assigned declaration: $ANCHOR near line $LINE"$'\n'"Human focus: ${FOCUS:-none}"$'\n\n'"Recent reservation avoid-list:"$'\n'"$recent"
          vibe -p "$prompt" --agent lean --output streaming --trust --workdir "$GITHUB_WORKSPACE" --max-turns 120
      - id: validate
        name: Enforce reserved target and proof hygiene
        env:
          BASE: ${{ steps.base.outputs.sha }}
          TARGET: ${{ needs.select.outputs.target }}
          ANCHOR: ${{ needs.select.outputs.anchor }}
          LINE: ${{ needs.select.outputs.line }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$BASE" ]] || git reset --mixed "$BASE"
          mapfile -t u < <(git ls-files --others --exclude-standard); (( ${#u[@]} == 0 )) || git add -N -- "${u[@]}"
          mapfile -t changed < <(git diff --name-only "$BASE" | sort -u)
          if (( ${#changed[@]} == 0 )); then echo 'has_changes=false' >> "$GITHUB_OUTPUT"; exit 0; fi
          if (( ${#changed[@]} != 1 )) || [[ "${changed[0]}" != "$TARGET" ]]; then echo "::error::Only reserved file $TARGET may change"; exit 1; fi
          git diff --name-only --diff-filter=D "$BASE" | grep -q . && { echo '::error::File deletion rejected'; exit 1; } || true
          python - <<'PY'
          import os, re, subprocess

          base = os.environ['BASE']
          target = os.environ['TARGET']
          anchor = os.environ['ANCHOR']
          anchor_line = int(os.environ['LINE'])
          diff = subprocess.check_output(
              ['git', 'diff', '--unified=0', base, '--', target], text=True
          )

          # Every hunk must stay local to the declaration selected before inference.
          # This makes "different declaration" mechanically meaningful even when a
          # large Lean module contains many unrelated theorems.
          hunks = re.findall(
              r'^@@ -(\d+)(?:,(\d+))? \+(\d+)(?:,(\d+))? @@', diff, re.M
          )
          if not hunks:
              raise SystemExit('no diff hunks found')
          lo, hi = max(1, anchor_line - 250), anchor_line + 250
          for old_start, old_len, new_start, new_len in hunks:
              old_start, new_start = int(old_start), int(new_start)
              old_len, new_len = int(old_len or '1'), int(new_len or '1')
              old_end = old_start + max(old_len, 1) - 1
              new_end = new_start + max(new_len, 1) - 1
              near_old = old_end >= lo and old_start <= hi
              near_new = new_end >= lo and new_start <= hi
              if not (near_old or near_new):
                  raise SystemExit(
                      f'diff hunk {old_start}:{old_end}/{new_start}:{new_end} '
                      f'is outside reserved declaration window {lo}:{hi} ({anchor})'
                  )

          bad = []
          for line in diff.splitlines():
              if not line.startswith('+') or line.startswith('+++'):
                  continue
              text = line[1:]
              if re.search(r'\b(?:sorry|admit|unsafe|native_decide)\b', text):
                  bad.append(text)
              if re.match(r'\s*axiom\b', text):
                  bad.append(text)
          if bad:
              print('Forbidden additions:')
              print('\n'.join(bad[:20]))
              raise SystemExit(1)
          PY
          git diff --check "$BASE"
          n="$(git diff --numstat "$BASE" -- "$TARGET" | awk '{print $1+$2}')"; [[ "${n:-0}" -le 1500 ]] || { echo '::error::Patch too broad'; exit 1; }
          echo 'has_changes=true' >> "$GITHUB_OUTPUT"
      - if: steps.validate.outputs.has_changes == 'true'
        name: Compile reserved module
        env:
          TARGET: ${{ needs.select.outputs.target }}
        run: |
          m="${TARGET%.lean}"; m="${m//\//.}"; time lake build "$m"
      - id: patch
        env:
          BASE: ${{ steps.base.outputs.sha }}
          TARGET: ${{ needs.select.outputs.target }}
          HAS: ${{ steps.validate.outputs.has_changes }}
        run: |
          if [[ "$HAS" != true ]]; then echo 'has_changes=false' >> "$GITHUB_OUTPUT"; exit 0; fi
          git diff --binary "$BASE" -- "$TARGET" > "$RUNNER_TEMP/leanstral.patch"; test -s "$RUNNER_TEMP/leanstral.patch"; echo 'has_changes=true' >> "$GITHUB_OUTPUT"
      - if: steps.patch.outputs.has_changes == 'true'
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: leanstral-patch-${{ github.run_id }}
          path: ${{ runner.temp }}/leanstral.patch
          retention-days: 1

  publish:
    needs: [select, generate]
    if: ${{ needs.generate.outputs.has_changes == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.generate.outputs.base_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: leanstral-patch-${{ github.run_id }}
          path: ${{ runner.temp }}/p
      - env:
          TARGET: ${{ needs.select.outputs.target }}
          ANCHOR: ${{ needs.select.outputs.anchor }}
        run: |
          set -euo pipefail
          git apply --check "$RUNNER_TEMP/p/leanstral.patch"; git apply "$RUNNER_TEMP/p/leanstral.patch"; git diff --check
          mapfile -t c < <(git diff --name-only); (( ${#c[@]} == 1 )) && [[ "${c[0]}" == "$TARGET" ]] || exit 1
          git diff --unified=120 -- "$TARGET" | grep -F -- "$ANCHOR" >/dev/null
      - id: b
        env:
          TARGET: ${{ needs.select.outputs.target }}
          ANCHOR: ${{ needs.select.outputs.anchor }}
        run: |
          branch="automation/leanstral-${GITHUB_RUN_ID}"; git switch -c "$branch"
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$TARGET"; git commit -m "lean: Leanstral improvement near $ANCHOR"; echo "branch=$branch" >> "$GITHUB_OUTPUT"
      - env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.b.outputs.branch }}
        run: |
          gh auth setup-git; git remote set-url --push origin "https://github.com/$GITHUB_REPOSITORY.git"; git push origin "HEAD:refs/heads/$BRANCH"
      - env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.b.outputs.branch }}
          TARGET: ${{ needs.select.outputs.target }}
          ANCHOR: ${{ needs.select.outputs.anchor }}
          BASE: ${{ needs.generate.outputs.base_sha }}
        run: |
          cat > "$RUNNER_TEMP/body" <<EOF
          Reserved target: \`$TARGET\` near \`$ANCHOR\`.

          This target was persisted on the reservation ledger (\`refs/leanstral/ledger\`) before inference. It remains consumed even if this PR never merges, closes, or the run produced no subsequent merge. Later runs therefore move to another declaration.

          The model had read-only GitHub access; only the reserved file was accepted, proof shortcuts were rejected, and the module compiled before publication.

          Base: \`$BASE\`  
          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" --draft --title "Leanstral: $ANCHOR" --body-file "$RUNNER_TEMP/body"
