# Produce reviewable Lean-generated snapshots independently of the long
# repository-wide audit. This read-only job does not certify the manuscript
# or replace any signature-comparison, kernel, or publication gate.
name: Manuscript signature snapshots

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/manuscript-signatures.yml'
      - 'scripts/Signatures.lean'
      - 'scripts/StatementClosure.lean'
      - 'metadata/*CLAIM_DECLS.txt'
      - 'metadata/*CLAIM_SIGNATURES.md'
      - 'metadata/AUDIT_SURFACE.md'
      - 'non_mf_groups_exist.tex'
  push:
    branches: [main]
    paths:
      - '.github/workflows/manuscript-signatures.yml'
      - 'scripts/Signatures.lean'
      - 'scripts/StatementClosure.lean'
      - 'metadata/*CLAIM_DECLS.txt'
      - 'metadata/*CLAIM_SIGNATURES.md'
      - 'metadata/AUDIT_SURFACE.md'
      - 'non_mf_groups_exist.tex'

permissions:
  contents: read

concurrency:
  group: manuscript-signatures-${{ github.ref }}
  cancel-in-progress: false

jobs:
  snapshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Restore Lean toolchain
        id: elan
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.elan
          key: ${{ runner.os }}-elan-${{ hashFiles('lean-toolchain') }}

      - name: Install pinned elan when needed
        if: steps.elan.outputs.cache-hit != 'true'
        run: curl https://raw.githubusercontent.com/leanprover/elan/464c9d28395000a2a0128e07081e4956d50eced2/elan-init.sh -sSf | sh -s -- -y

      - name: Add Lean to PATH
        run: echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Restore Lake dependencies
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .lake/packages
          key: ${{ runner.os }}-lake-deps-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            ${{ runner.os }}-lake-deps-

      - name: Restore compiled project
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .lake/build
          key: ${{ runner.os }}-nonsofic-build-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml', 'GroupApproximation.lean', 'GroupApproximation/**/*.lean', 'Palomar/**/*.lean') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-nonsofic-build-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml', 'GroupApproximation.lean', 'GroupApproximation/**/*.lean', 'Palomar/**/*.lean') }}-
            ${{ runner.os }}-nonsofic-build-

      - name: Fetch precompiled Mathlib
        run: lake exe cache get

      - name: Build the actual signature environment
        run: lake build GroupApproximation Audit

      - name: Generate snapshots and source provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p signature-snapshots
          git rev-parse HEAD > signature-snapshots/SOURCE_COMMIT
          lake env lean scripts/Signatures.lean
          lake env lean scripts/StatementClosure.lean
          cp metadata/CLAIM_SIGNATURES.md metadata/NON_MF_CLAIM_SIGNATURES.md \
            metadata/AUDIT_SURFACE.md signature-snapshots/
          sha256sum non_mf_groups_exist.tex scripts/Signatures.lean \
            scripts/StatementClosure.lean metadata/CLAIM_DECLS.txt \
            metadata/NON_MF_CLAIM_DECLS.txt \
            > signature-snapshots/SOURCE_SHA256SUMS
          git diff --binary -- metadata/CLAIM_SIGNATURES.md \
            metadata/NON_MF_CLAIM_SIGNATURES.md metadata/AUDIT_SURFACE.md \
            > signature-snapshots/snapshots.patch

      - name: Upload snapshots for review
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: manuscript-signatures-${{ github.sha }}
          path: signature-snapshots/
          if-no-files-found: error
          retention-days: 14
