name: Apply non-MF manuscript audit fixes
# Second push intentionally triggers this already-present one-shot workflow.

on:
  push:
    branches:
      - fix/non-mf-manuscript-audit

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: fix/non-mf-manuscript-audit
          fetch-depth: 0

      - name: Apply audited fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_one(path, old, new, label):
              p = Path(path)
              s = p.read_text()
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one target, found {count}")
              p.write_text(s.replace(old, new, 1))

          replace_one(
              "non_mf_groups_exist.tex",
              r'''% Hidden link from a numbered statement to the declaration of the
          % accompanying Lean~4 development that proves it.  Not typeset; the
          % audit tooling that reads these records is documented in the repository.
          ''',
              r'''% Hidden link from a numbered statement to an accompanying Lean~4
          % declaration whose proposition checks the stated claim.  This record does
          % not assert that the surrounding prose proof is a line-by-line transcription;
          % route-level correspondence is tracked separately by the audit metadata.
          ''',
              "verification macro comment",
          )

          replace_one(
              "non_mf_groups_exist.tex",
              r'''    \thanks{The numbered statements of this paper are machine-checked in an
                accompanying Lean~4 development, at
                \href{\coderepository}{\nolinkurl{\coderepositoryname}}.}%''',
              r'''    \thanks{Numbered statements carrying verification records are linked to
                accompanying Lean~4 declarations checking their stated claims, at
                \href{\coderepository}{\nolinkurl{\coderepositoryname}}.  These
                records certify statements, not line-by-line transcriptions of the prose
                proofs; the repository's verification metadata records route-level
                correspondence separately.}%''',
              "verification wording",
          )

          replace_one(
              "non_mf_groups_exist.tex",
              r'''For $\nu_n>0$, equip the $n$th coordinate space with the inner
          product $\langle x,y\rangle=\operatorname{Tr}(y^*x)/\nu_n$; an index
          with $\nu_n=0$ forces $x_n=0$.  Conjugation by a unitary remains
          unitary for this inner product.  The bound
          $\operatorname{Tr}(x_n^*x_n)\le C\nu_n$ makes $(x_n)$ a bounded
          ultraproduct vector, and the adjoint actions remain operator-norm
          almost multiplicative because the weight does not enter the operator
          norm.  Thus the ultraproduct proof of
          Theorem~\ref{thm:kazhdan-transport} applies with $\tr_{d_n}$ replaced
          by $\operatorname{Tr}(\,\cdot\,)/\nu_n$.  Finiteness of the norm
          ultraproduct again turns $P\le VPV^{*}$ into $P=VPV^{*}$, which gives
          both conjugation directions.''',
              r'''Equip the $n$th coordinate space with the inner product
          \[
           \langle x,y\rangle_n=
           \begin{cases}
            \operatorname{Tr}(y^*x)/\nu_n,&\nu_n>0,\\
            \operatorname{Tr}(y^*x),&\nu_n=0.
           \end{cases}
          \]
          If $\nu_n=0$, the bound $\operatorname{Tr}(x_n^*x_n)\le C\nu_n$
          forces $x_n=0$, so the harmless choice of the ordinary Hilbert--Schmidt
          inner product on that coordinate does not affect the distinguished
          vector.  Conjugation by a unitary is unitary for every one of these
          inner products.  The bound makes $(x_n)$ a bounded ultraproduct vector,
          and the adjoint actions remain operator-norm almost multiplicative
          because the scalar normalization of the Hilbert norm does not enter
          the operator norm.  Thus the ultraproduct proof of
          Theorem~\ref{thm:kazhdan-transport} applies with these weighted
          coordinate Hilbert spaces.  Finiteness of the norm ultraproduct again
          turns $P\le VPV^{*}$ into $P=VPV^{*}$, which gives both conjugation
          directions.''',
              "zero-weight Hilbert spaces",
          )

          replace_one(
              "non_mf_groups_exist.tex",
              r'''For a one-sided conjugator $s$, Theorem~\ref{thm:kazhdan-transport}
          gives the conclusion for $V_{g,n}x_nV_{g,n}^*$, and the equality
          $P=VPV^*$ established in its proof gives $V^*PV=P$, hence
          $V^*\operatorname{Fix}=\operatorname{Fix}$ and the conclusion for
          $V_{g,n}^*x_nV_{g,n}$.  The set of $g\in H$ for which conjugation by
          $V_{g,n}$ and by $V_{g,n}^*$ both preserve the asymptotic commutant is
          a subgroup, and it contains every one-sided conjugator; hence it
          contains $G^{+}(L)$.''',
              r'''For a one-sided conjugator $s$, Theorem~\ref{thm:kazhdan-transport}
          gives the conclusion for $V_{s,n}x_nV_{s,n}^*$.  The equality of the
          fixed-space projection with its conjugate established in that proof
          also gives invariance under the inverse conjugation, hence the
          conclusion for $V_{s,n}^*x_nV_{s,n}$.  The set of $g\in H$ for which
          conjugation by $V_{g,n}$ and by $V_{g,n}^*$ both preserve the
          asymptotic commutant is a subgroup, and it contains every one-sided
          conjugator; hence it contains $G^{+}(L)$.''',
              "transport variable typo",
          )

          replace_one(
              "non_mf_groups_exist.tex",
              r'''Suppose a homomorphism $\Theta$ to $\U(\mathcal Q)$ is nontrivial on
          $K$.  Its image $\bar H=\Theta(H)$ is countable, hence MF, and
          Proposition~\ref{prop:mf-equivalences}, applied along an exhaustion of
          $\bar H$, gives an operator-norm asymptotic representation''',
              r'''Suppose a homomorphism $\Theta$ to $\U(\mathcal Q)$ is nontrivial on
          $K$.  Its image $\bar H=\Theta(H)$ is countable and, as a subgroup of
          $\U(\mathcal Q)$, is MF by definition.  Proposition~\ref{prop:mf-equivalences},
          applied along an exhaustion of $\bar H$, gives an operator-norm
          asymptotic representation''',
              "countable-implies-MF error",
          )

          replace_one(
              "non_mf_groups_exist.tex",
              r'''\emph{The $q$-normalized Hilbert space.}  Take a self-adjoint bounded
          lift $(x_n)$ of $q$.  Then $\opnorm{x_n^{2}-x_n}\to0$, so the spectrum
          of $x_n$ clusters at $\{0,1\}$ and continuous functional calculus makes
          $Q_n=\chi_{[1/2,\infty)}(x_n)$ a projection with
          $\opnorm{Q_n-x_n}\to0$; the sequence $(Q_n)$ again lifts $q$.  Since
          $q\ne0$, $Q_n\ne0$ for infinitely many $n$; discard the remaining
          coordinates, relabel by $\N$, and put
          $k_n=\operatorname{rank}Q_n\ge1$.''',
              r'''\emph{The $q$-normalized Hilbert space.}  Take a self-adjoint bounded
          lift $(x_n)$ of $q$.  Since $\opnorm{x_n^{2}-x_n}\to0$, for all
          sufficiently large $n$ the spectrum of $x_n$ avoids $[1/4,3/4]$.
          Choose a continuous function $f\colon\mathbb R\to[0,1]$ with
          $f=0$ on $(-\infty,1/4]$ and $f=1$ on $[3/4,\infty)$.  Continuous
          functional calculus then gives, for all sufficiently large $n$, a
          projection $Q_n=f(x_n)$ with $\opnorm{Q_n-x_n}\to0$; define $Q_n=0$
          on the finitely many remaining coordinates.  Thus $(Q_n)$ is a
          projection lift of $q$.

          Let $J=\{n:Q_n\ne0\}$.  Because $q\ne0$, the set $J$ is infinite.
          Restriction of coordinates induces a $*$-homomorphism
          \[
           \rho_J\colon
           \prod_nM_{d_n}(\mathbb C)/\bigoplus_nM_{d_n}(\mathbb C)
           \longrightarrow
           \prod_{n\in J}M_{d_n}(\mathbb C)/\bigoplus_{n\in J}M_{d_n}(\mathbb C).
          \]
          Replace $\Theta$ by $\rho_J\circ\Theta$ and every element introduced
          above by its image under $\rho_J$.  All projection, commutation and
          cocycle identities are preserved, while the new image of $q$ is still
          nonzero because its lift consists of nonzero projections and therefore
          has norm $1$ at every coordinate of $J$.  Relabel $J$ by $\mathbb N$;
          then, without changing notation, we have
          $k_n=\operatorname{rank}Q_n\ge1$ for every $n$.''',
              "projection functional calculus and subsequence restriction",
          )

          replace_one(
              "non_mf_groups_exist.tex",
              r'''Hence
          $\pi(g)y=y$ and
          $\beta(g)=0$ for every $g\in L$, contradicting the previous paragraph.
          So $d_g=0$, that is, $p$ commutes with $\Theta(g)$, for every $g\in L$.''',
              r'''Hence
          $\pi(g)y=y$ and
          $\beta(g)=0$ for every $g\in L$, contradicting the previous paragraph.
          This contradiction shows that the original assumption $d_{g_0}\ne0$ was
          impossible.  Thus, in the original corona, $d_g=0$ for every $g\in L$;
          equivalently, $p$ commutes with $\Theta(g)$ for every $g\in L$.''',
              "projection-collapse conclusion scope",
          )

          replace_one(
              "non_mf_groups_exist.tex",
              r'''By Lemma~\ref{lem:permanence}(3), the Clifford group is locally
          finite, hence MF\@.  The group $\Sigma$ identifies with the subgroup of''',
              r'''The Clifford group $\Cl(X)$ is locally finite: every finitely
          generated subgroup involves only finitely many sites, hence is contained
          in the corresponding finite Clifford group.  Therefore $\Cl(X)$ is MF
          by Lemma~\ref{lem:permanence}(3).  The group $\Sigma$ identifies with
          the subgroup of''',
              "Clifford local-finiteness attribution",
          )

          replace_one(
              "GroupApproximation/Sofic/LiteralAffineCosetTransitivity.lean",
              "**UNBUILT — this module has never been compiled.**\n\n",
              "**Build status.**  This module is imported by `GroupApproximation.lean` and is\ntherefore part of the repository's root build/audit closure.\n\n",
              "stale UNBUILT marker",
          )

          replace_one(
              "GroupApproximation/Analysis/NuclearityAmenability.lean",
              "`GroupApproximation.Analysis.NuclearityBaseEmbedding.baseMap_injective`",
              "`GroupApproximation.NuclearityBaseEmbedding.baseMap_injective`",
              "stale NuclearityBaseEmbedding declaration name",
          )

          replace_one(
              "GroupApproximation/Computability/BooneGroupBase.lean",
              "`GroupApproximation.PermutationalWreath.lampActionHom`",
              "`GroupApproximation.lampActionHom`",
              "stale lampActionHom declaration name",
          )
          PY

          python3 scripts/check_non_mf_proof_ledger.py \
            --tex non_mf_groups_exist.tex \
            --ledger metadata/NON_MF_PROOF_LEDGER.md \
            --repin-header

      - name: Run manuscript and source gates
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_non_mf_refs.py --tex non_mf_groups_exist.tex \
            --decls metadata/NON_MF_CLAIM_DECLS.txt --check-decls
          python3 scripts/check_non_mf_zero_input.py --tex non_mf_groups_exist.tex --root .
          python3 scripts/check_non_mf_claim_manifest.py --tex non_mf_groups_exist.tex \
            --manifest metadata/NON_MF_NUMBERED_CLAIMS.json \
            --signature-roster metadata/NON_MF_CLAIM_DECLS.txt
          python3 scripts/check_non_mf_unconditional.py --tex non_mf_groups_exist.tex \
            --baseline metadata/NON_MF_UNCONDITIONAL_BASELINE.txt
          python3 scripts/check_non_mf_proof_ledger.py --tex non_mf_groups_exist.tex \
            --ledger metadata/NON_MF_PROOF_LEDGER.md
          python3 scripts/check_manuscript_claims.py --tex non_mf_groups_exist.tex --strict
          python3 scripts/check_prose_decl_names.py --repo . --quiet
          python3 scripts/check.py

      - name: Commit fixes and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-non-mf-audit-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix audited non-MF manuscript issues"
          git push origin HEAD:fix/non-mf-manuscript-audit
