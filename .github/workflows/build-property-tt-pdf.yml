# Publish the property-(TT)/T manuscript only after the complete formal
# development passes the same source, kernel, and signature gates as the main
# manuscript, followed by TeX and rendered-page validation.
name: Build and commit property TT PDF

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-property-tt-pdf-main
  cancel-in-progress: true

env:
  TEX_FILE: property_tt_leavitt.tex
  PDF_FILE: property_tt_leavitt.pdf

jobs:
  build-pdf:
    name: Build and validate PDF
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Assert a clean source checkout
        run: test -z "$(git status --porcelain)"

      - name: Cache Lean toolchain
        id: elan-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.elan
          key: ${{ runner.os }}-elan-${{ hashFiles('lean-toolchain') }}

      - name: Install elan
        if: steps.elan-cache.outputs.cache-hit != 'true'
        run: curl https://raw.githubusercontent.com/leanprover/elan/464c9d28395000a2a0128e07081e4956d50eced2/elan-init.sh -sSf | sh -s -- -y

      - name: Add elan to PATH
        run: echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Restore Lake dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .lake/packages
          key: ${{ runner.os }}-lake-deps-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            ${{ runner.os }}-lake-deps-

      - name: Restore compiled project
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .lake/build
          key: ${{ runner.os }}-property-tt-build-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml', 'GroupApproximation.lean', 'GroupApproximation/**/*.lean') }}
          restore-keys: |
            ${{ runner.os }}-nonsofic-build-

      - name: Fetch precompiled Mathlib
        run: lake exe cache get

      - name: Cache apt package downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/texdebs
          key: ${{ runner.os }}-property-tt-texdebs-${{ hashFiles('.github/workflows/build-property-tt-pdf.yml') }}

      - name: Install TeX and PDF validation tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          retry='-o Acquire::Retries=5 -o Acquire::http::Timeout=30'
          keep='-o APT::Keep-Downloaded-Packages=true'
          if [ -d "$HOME/texdebs" ]; then
            sudo cp "$HOME"/texdebs/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          fi
          sudo apt-get $retry update
          sudo apt-get $retry $keep install --yes --no-install-recommends \
            chktex latexmk lmodern poppler-utils qpdf \
            texlive-fonts-recommended texlive-latex-base texlive-latex-extra \
            texlive-latex-recommended texlive-science
          mkdir -p "$HOME/texdebs"
          sudo cp /var/cache/apt/archives/*.deb "$HOME/texdebs/" 2>/dev/null || true
          sudo chown -R "$USER" "$HOME/texdebs"

      - name: Calibrate and check visible Lean counterpart links
        run: |
          python3 scripts/check_property_tt_refs.py --self-test
          python3 scripts/check_property_tt_refs.py --tex "$TEX_FILE"

      - name: Check figure text boxes do not overlap
        run: python3 scripts/check_fig_overlap.py --tex "$TEX_FILE"

      - name: Calibrate repository source audits
        run: |
          python3 scripts/check.py --self-test
          python3 scripts/test_claim_map.py
          python3 scripts/check.py

      - name: Build the complete formal development
        run: lake build

      - name: Build and calibrate the audit library
        run: |
          lake build Audit
          lake env lean scripts/Calibrate.lean

      - name: Kernel audit and endpoint axiom closures
        run: lake env lean scripts/Audit.lean

      - name: Regenerate and compare exact signatures
        run: |
          cp docs/CLAIM_SIGNATURES.md /tmp/CLAIM_SIGNATURES.expected.md
          cp docs/NON_MF_CLAIM_SIGNATURES.md /tmp/NON_MF_CLAIM_SIGNATURES.expected.md
          lake env lean scripts/Signatures.lean
          cmp -s /tmp/CLAIM_SIGNATURES.expected.md docs/CLAIM_SIGNATURES.md
          cmp -s /tmp/NON_MF_CLAIM_SIGNATURES.expected.md \
            docs/NON_MF_CLAIM_SIGNATURES.md
          mv /tmp/CLAIM_SIGNATURES.expected.md docs/CLAIM_SIGNATURES.md
          mv /tmp/NON_MF_CLAIM_SIGNATURES.expected.md \
            docs/NON_MF_CLAIM_SIGNATURES.md

      - name: Fresh kernel replay
        run: lake env leanchecker --fresh GroupApproximation

      - name: Compile, lint, normalize, and validate PDF
        shell: bash
        run: |
          set -euo pipefail
          base_name="${TEX_FILE%.tex}"
          raw_pdf="build/${base_name}.pdf"
          log_file="build/${base_name}.log"
          temporary_pdf="${PDF_FILE}.tmp"

          rm -rf build pdf-render-check
          rm -f "$temporary_pdf"
          mkdir -p build pdf-render-check

          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct -- "$TEX_FILE")"
          export FORCE_SOURCE_DATE=1
          export TZ=UTC

          chktex -q -n1 -n3 -n8 -n24 -n36 "$TEX_FILE"
          latexmk -pdf -outdir=build -interaction=nonstopmode \
            -halt-on-error -file-line-error "$TEX_FILE"

          test -s "$raw_pdf"
          test -s "$log_file"
          if grep -Eq \
            'LaTeX Warning: (Citation .* undefined|Reference .* undefined|There were undefined references|Label\(s\) may have changed)|Rerun to get cross-references right' \
            "$log_file"; then
            echo "The final LaTeX pass still has unresolved references or citations." >&2
            exit 1
          fi
          if grep -Eq \
            'Overfull \\[hv]box|[Ll]ost marginpar|Marginpar on page [0-9]+ moved' \
            "$log_file"; then
            echo "Overflowing or colliding material in the final LaTeX pass:" >&2
            grep -E 'Overfull \\[hv]box|[Ll]ost marginpar|Marginpar on page [0-9]+ moved' "$log_file" >&2
            exit 1
          fi

          qpdf --linearize --object-streams=disable --force-version=1.4 \
            --deterministic-id "$raw_pdf" "$temporary_pdf"
          mv -- "$temporary_pdf" "$PDF_FILE"
          qpdf --check "$PDF_FILE"
          pdfinfo "$PDF_FILE"
          test "$(head -c 8 "$PDF_FILE")" = '%PDF-1.4'

          pdftoppm -png -r 72 "$PDF_FILE" pdf-render-check/page
          page_count="$(pdfinfo "$PDF_FILE" | awk '/^Pages:/ {print $2}')"
          rendered_count="$(find pdf-render-check -name 'page-*.png' -type f | wc -l)"
          test "$rendered_count" -eq "$page_count"
          find pdf-render-check -name 'page-*.png' -type f -size 0 -print -quit \
            | (! grep -q .)

      - name: Build and verify the anonymous variant
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-anon
          sed 's/\\anonymousfalse/\\anonymoustrue/' "$TEX_FILE" > build-anon/anon.tex
          latexmk -pdf -outdir=build-anon -interaction=nonstopmode \
            -halt-on-error -file-line-error build-anon/anon.tex
          test -s build-anon/anon.pdf
          qpdf --qdf --object-streams=disable build-anon/anon.pdf build-anon/anon-qdf.pdf
          if pdftotext build-anon/anon.pdf - | grep -q 'github.com/' \
             || grep -aq 'github.com/' build-anon/anon-qdf.pdf; then
            echo "The anonymous build leaks the repository URL." >&2
            exit 1
          fi

      - name: Commit and push updated PDF
        env:
          START_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if [[ "$(git rev-parse origin/main)" != "$START_SHA" ]]; then
            echo "main advanced during the build; its own run will publish its PDF."
            exit 0
          fi

          git add -- "$PDF_FILE"
          if git diff --cached --quiet -- "$PDF_FILE"; then
            echo "The committed PDF is already current."
            exit 0
          fi
          git commit -m "build: update property TT PDF [skip ci]"
          if git push origin HEAD:main; then
            exit 0
          fi

          git fetch origin main
          if [[ "$(git rev-parse origin/main)" != "$START_SHA" ]]; then
            echo "main advanced before the push; its own run will publish its PDF."
            exit 0
          fi
          echo "Could not push the updated PDF." >&2
          exit 1
