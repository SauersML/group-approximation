name: Refresh non-MF referee signatures

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: non-mf-referee-signatures
  cancel-in-progress: true

jobs:
  refresh:
    if: github.head_ref == 'agent/non-mf-referee-repair'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: agent/non-mf-referee-repair
          fetch-depth: 0
          persist-credentials: true

      - name: Remove generated scratch artifact
        run: rm -rf build/referee-repair

      - name: Cache Lean toolchain
        id: elan-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.elan
          key: ${{ runner.os }}-elan-${{ hashFiles('lean-toolchain') }}

      - name: Install elan
        if: steps.elan-cache.outputs.cache-hit != 'true'
        run: curl https://raw.githubusercontent.com/leanprover/elan/464c9d28395000a2a0128e07081e4956d50eced2/elan-init.sh -sSf | sh -s -- -y

      - name: Add elan to PATH
        run: echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Restore Lake dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .lake/packages
          key: ${{ runner.os }}-lake-deps-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            ${{ runner.os }}-lake-deps-

      - name: Restore compiled project
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .lake/build
          key: ${{ runner.os }}-nonsofic-build-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml', 'GroupApproximation.lean', 'GroupApproximation/**/*.lean') }}
          restore-keys: |
            ${{ runner.os }}-nonsofic-build-

      - name: Fetch precompiled Mathlib
        run: lake exe cache get

      - name: Build and regenerate signature snapshots
        shell: bash
        run: |
          set -euo pipefail
          lake build
          lake env lean scripts/Signatures.lean

      - name: Recheck manuscript synchronization
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_non_mf_refs.py \
            --tex non_mf_groups_exist.tex --check-decls \
            --extra-declarations-from metadata/NON_MF_NUMBERED_CLAIMS.json
          python3 scripts/check_non_mf_claim_manifest.py \
            --tex non_mf_groups_exist.tex \
            --manifest metadata/NON_MF_NUMBERED_CLAIMS.json \
            --signature-roster metadata/NON_MF_CLAIM_DECLS.txt
          python3 scripts/check_non_mf_proof_ledger.py \
            --tex non_mf_groups_exist.tex \
            --ledger metadata/NON_MF_PROOF_LEDGER.md

      - name: Commit generated signatures and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/refresh-non-mf-referee-signatures.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Refresh non-MF claim signatures"
          git push origin HEAD:agent/non-mf-referee-repair
