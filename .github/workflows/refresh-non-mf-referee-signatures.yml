name: Refresh non-MF referee signatures

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: non-mf-referee-signatures
  cancel-in-progress: true

jobs:
  refresh:
    if: github.head_ref == 'agent/non-mf-referee-repair'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: agent/non-mf-referee-repair
          fetch-depth: 0
          persist-credentials: true

      - name: Normalize final referee metadata
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/referee-repair
          python3 - <<'PY'
          from pathlib import Path
          p = Path('metadata/NON_MF_PROOF_LEDGER.md')
          s = p.read_text()
          old = 'Kirchberg--Wassermann, for a discrete group `W` exact iff `Cred(W)` exact'
          new = 'Kirchberg--Wassermann, for a discrete group `E` exact iff `Cred(E)` exact'
          if s.count(old) != 1:
              raise SystemExit(f'expected one stale SO.16 object, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Cache Lean toolchain
        id: elan-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.elan
          key: ${{ runner.os }}-elan-${{ hashFiles('lean-toolchain') }}

      - name: Install elan
        if: steps.elan-cache.outputs.cache-hit != 'true'
        run: curl https://raw.githubusercontent.com/leanprover/elan/464c9d28395000a2a0128e07081e4956d50eced2/elan-init.sh -sSf | sh -s -- -y

      - name: Add elan to PATH
        run: echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Restore Lake dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .lake/packages
          key: ${{ runner.os }}-lake-deps-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            ${{ runner.os }}-lake-deps-

      - name: Restore compiled project
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .lake/build
          key: ${{ runner.os }}-nonsofic-build-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml', 'GroupApproximation.lean', 'GroupApproximation/**/*.lean') }}
          restore-keys: |
            ${{ runner.os }}-nonsofic-build-

      - name: Fetch precompiled Mathlib
        run: lake exe cache get

      - name: Build the exact retargeted badge modules
        shell: bash
        run: |
          set -euo pipefail
          lake build \
            GroupApproximation.Analysis.MaximalCStarAllUniverses \
            GroupApproximation.Analysis.StrictCompressionFromPrinted \
            GroupApproximation.Analysis.MaximalCStarPrintedCompletion

      - name: Generate exact types for the two retargeted declarations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/referee-signatures
          cat > build/referee-signatures/RefereeSignatures.lean <<'LEAN'
          import GroupApproximation.Analysis.MaximalCStarAllUniverses
          import GroupApproximation.Analysis.StrictCompressionFromPrinted
          import Lean.Elab.Command

          open Lean Elab Command

          namespace GroupApproximation.RefereeSignatures

          def writeOne (env : Environment) (decl : Name) (outPath : System.FilePath) : CommandElabM Unit := do
            let some info := env.find? decl
              | throwError "missing declaration {decl}"
            let fmt ← liftTermElabM <| Lean.Meta.ppExpr info.type
            IO.FS.writeFile outPath (fmt.pretty 96)

          run_cmd do
            let env ← getEnv
            writeOne env ``GroupApproximation.manuscriptMaximalGroupCStarUniversalProperty
              ("build" / "referee-signatures" / "maximal-universal.txt")
            writeOne env
              ``GroupApproximation.MaximalCStarPrintedHypotheses.manuscriptMaximalCStarRemarkFromPrintedHypotheses
              ("build" / "referee-signatures" / "strict-compression.txt")

          end GroupApproximation.RefereeSignatures
          LEAN
          lake env lean build/referee-signatures/RefereeSignatures.lean

      - name: Patch only the two retargeted signature sections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path('metadata/NON_MF_CLAIM_SIGNATURES.md')
          text = path.read_text()

          changes = [
              (
                  'GroupApproximation.manuscriptUniverseRelativeMaximalGroupCStar',
                  'GroupApproximation.manuscriptMaximalGroupCStarUniversalProperty',
                  Path('build/referee-signatures/maximal-universal.txt').read_text().rstrip(),
              ),
              (
                  'GroupApproximation.MaximalCStarParagraphEndpoint.manuscriptMaximalCStarStrictCompressionRemark',
                  'GroupApproximation.MaximalCStarPrintedHypotheses.manuscriptMaximalCStarRemarkFromPrintedHypotheses',
                  Path('build/referee-signatures/strict-compression.txt').read_text().rstrip(),
              ),
          ]

          for old, new, typ in changes:
              pattern = rf'\n## `{re.escape(old)}`\n\n```lean\n.*?\n```\n'
              repl = f'\n## `{new}`\n\n```lean\n{typ}\n```\n'
              text, count = re.subn(pattern, lambda _: repl, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'expected one signature section for {old}, found {count}')

          path.write_text(text)
          PY
          rm -rf build/referee-signatures

      - name: Recheck manuscript synchronization
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_non_mf_refs.py \
            --tex non_mf_groups_exist.tex --check-decls \
            --extra-declarations-from metadata/NON_MF_NUMBERED_CLAIMS.json
          python3 scripts/check_non_mf_claim_manifest.py \
            --tex non_mf_groups_exist.tex \
            --manifest metadata/NON_MF_NUMBERED_CLAIMS.json \
            --signature-roster metadata/NON_MF_CLAIM_DECLS.txt
          python3 scripts/check_non_mf_proof_ledger.py \
            --tex non_mf_groups_exist.tex \
            --ledger metadata/NON_MF_PROOF_LEDGER.md
          python3 scripts/check_manuscript_claims.py --tex non_mf_groups_exist.tex --strict
          python3 scripts/check_prose_decl_names.py --repo . --quiet

      - name: Commit final signature repairs and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/refresh-non-mf-referee-signatures.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Refresh retargeted non-MF claim signatures"
          git push origin HEAD:agent/non-mf-referee-repair
