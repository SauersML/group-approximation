# Group Approximation research-graph site.  Rebuilds and republishes the public site
# whenever the research state or the generator changes.  Fast (seconds,
# no toolchain): the site is compiled from research/*.md by the cairn CLI,
# which lives in the tools/cairn submodule (github.com/SauersML/Cairn).
#
# Coexistence with docs.yml (doc-gen4, weekly): Pages serves one tree per
# repo, so this workflow also folds the latest API docs under /api/ when a
# branch named `api-docs` exists.  Until docs.yml publishes that branch, a
# Sunday docs deploy will temporarily replace this site (and the next
# research push replaces it back).
name: Group Approximation site

on:
  push:
    branches: [main]
    paths:
      - 'research/**'
      - 'tools/cairn'
      - '.gitmodules'
      - 'bin/cairn'
      - '.github/workflows/cairn-site.yml'
  workflow_dispatch:

# Never cancel a site run.  `cancel-in-progress: false` only protects a run
# that is already executing -- GitHub still cancels a *pending* run when a
# newer one joins the group, so on a busy repo with a backed-up runner queue
# the site can starve indefinitely: on 2026-08-16 five consecutive runs were
# cancelled without ever publishing, leaving Pages several commits stale.
# A per-run group means nothing supersedes anything; the job takes seconds,
# and the last deploy to finish wins, which is the state we want anyway.
concurrency:
  group: cairn-site-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Compile the research graph
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: true

      - name: Build the site
        run: bin/cairn site

      - name: Title the site
        # `bin/cairn` passes the project name to the generator, but generators
        # older than that hook title their pages after the tool.  Rewrite those.
        # A no-op once the pinned generator honours CAIRN_SITE_TITLE.
        run: |
          python3 - <<'PY'
          import pathlib
          for f in pathlib.Path('.cairn/site').glob('*.html'):
              t = f.read_text(encoding='utf-8')
              if '<title>Cairn' in t:
                  f.write_text(t.replace('<title>Cairn', '<title>Group Approximation'),
                               encoding='utf-8')
          PY

      - name: Fold in the latest API docs, if published
        run: |
          if git fetch --depth 1 origin api-docs 2>/dev/null; then
            mkdir -p .cairn/site/api
            git --work-tree=.cairn/site/api checkout FETCH_HEAD -- .
          else
            echo "no api-docs branch yet; publishing the research site alone"
          fi

      - name: Upload the site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: .cairn/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
