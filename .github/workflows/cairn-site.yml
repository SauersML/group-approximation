# Group Approximation research-graph site.  Rebuilds and republishes the public site
# whenever the research state or the generator changes.  Fast (seconds,
# no toolchain): the site is compiled from research/*.md by the cairn CLI
# (github.com/SauersML/Cairn), committed at tools/cairn.py.
#
# Coexistence with docs.yml (doc-gen4, weekly): Pages serves one tree per
# repo, so this workflow also folds the latest API docs under /api/ when a
# branch named `api-docs` exists.  Until docs.yml publishes that branch, a
# Sunday docs deploy will temporarily replace this site (and the next
# research push replaces it back).
name: Group Approximation site

on:
  push:
    branches: [main]
    paths:
      - 'research/**'
      - 'tools/cairn.py'
      - 'bin/cairn'
      - 'non_mf_groups_exist.tex'
      - 'metadata/NON_MF_NUMBERED_CLAIMS.json'
      - 'tools/paper_site/**'
      # the paper edition embeds Lean sources, so Lean-only pushes must
      # republish it too
      - 'GroupApproximation/**'
      - 'GroupApproximation.lean'
      - '.github/workflows/cairn-site.yml'
  workflow_dispatch:

# One site build at a time, plus at most one waiting.
#
# This was `cairn-site-${{ github.run_id }}` -- a per-run group, so nothing
# superseded anything -- against the 2026-08-16 observation that five
# consecutive runs were cancelled while pending and Pages went stale.  The
# diagnosis was right and the remedy inverted it: undeduplicated runs are
# created here on every push touching `research/**` or `GroupApproximation/**`,
# which is nearly every push this fleet makes, and they do not wait politely.
# Measured 2026-08-19: 39 of the 65 queued runs in the repository were site
# builds, 60% of the backlog, against a twenty-job account pool shared with
# another repository.  What they were crowding out is the point -- four
# `Promote successful Lean gate to verified` runs had been queued since 04:09
# and could not get a runner, so the branch this whole pipeline exists to
# advance sat 710 commits behind main.  The starvation the old group was meant
# to prevent was being *caused* by the flood the old group created.
#
# "The last deploy to finish wins" was also not the state we wanted: 39 runs
# racing means completion order is not creation order, so an older tree can
# publish after a newer one and stay there until the next push.
#
# Keying the group to the branch bounds it at one running plus one pending.
# `cancel-in-progress: false` is what makes that safe, and it is doing real
# work here: a run that has STARTED always finishes and publishes, so no
# deploy is ever abandoned half-way.  Only a *pending* duplicate is collected,
# and a pending duplicate is by construction superseded content -- the newer
# one that replaces it builds from a newer tip and publishes strictly fresher
# state.  The job takes seconds, so the pending slot turns over quickly.
concurrency:
  group: cairn-site-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Compile the research graph
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # `fetch-depth: 0` is required by the validation step below, not by the
      # site build.  A node may pin an artifact as `<rev>:<path>` for a file
      # that deliberately left the working tree, and cairn resolves that with
      # `git cat-file -e`, which a depth-1 clone cannot answer -- so every pin
      # would read as a missing artifact and the check would invent findings.
      # The prove job in prover.yml needed the same thing for the same reason.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      # Validate before publishing, and fail loudly.
      #
      # This is the same `bin/cairn check` the prover's Source scan runs, so it
      # is an early warning for the exact condition that stops certification:
      # under `bash -e` there any nonzero exit fails `Build and audit`, which
      # stops `verified` for every session.  Nothing was giving that signal
      # quickly.  `bin/cairn site` exits 0 on an invalid graph -- verified
      # against 679b4536, whose 67-character route id put the graph over
      # cairn's 64-char cap: `check` exits 4 there and `site` exits 0, so the
      # site cheerfully published a graph with the node silently dropped while
      # every certificate went red.  That defect reached main twice on
      # 2026-08-19 and one instance sat there overnight.
      #
      # This workflow already triggers on `research/**`, `tools/cairn.py` and
      # `bin/cairn`, which is exactly the set that can break the graph, and it
      # needs no toolchain -- so it answers in seconds where the prover answers
      # in minutes and only once it wins a runner.  Publishing a graph that has
      # not been validated is also just wrong on its own terms.
      - name: Validate the research graph
        run: bin/cairn check

      - name: Build the site
        run: bin/cairn site

      # The web edition of the manuscript, at /paper/.  Non-fatal by design:
      # a broken paper build must not stop the research site from
      # publishing, so failure degrades to a site without /paper plus a
      # warning annotation on the run.
      - name: Build the paper edition
        run: |
          if python3 tools/paper_site/build.py --out .cairn/site/paper/index.html; then
            echo "paper edition built"
            # Cross-link: a "paper" entry in the graph header.  This edits the
            # generated page only -- bin/cairn and tools/cairn.py stay untouched.
            sed -i 's|<header><span class="stats">|<header><a href="paper/">paper</a><span class="stats">|' .cairn/site/index.html
          else
            echo "::warning::paper edition build failed; publishing without /paper"
          fi

      - name: Fold in the latest API docs, if published
        run: |
          if git fetch --depth 1 origin api-docs 2>/dev/null; then
            mkdir -p .cairn/site/api
            git --work-tree=.cairn/site/api checkout FETCH_HEAD -- .
          else
            echo "no api-docs branch yet; publishing the research site alone"
          fi

      - name: Upload the site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: .cairn/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
