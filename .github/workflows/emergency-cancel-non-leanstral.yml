name: Emergency cancel non-Leanstral runs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/emergency-cancel-non-leanstral.yml'

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    name: Cancel every active run except Leanstral
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel queued, pending, waiting, and in-progress non-Leanstral runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          self="$GITHUB_RUN_ID"

          sweep() {
            local pass="$1"
            echo "Cancellation sweep $pass"
            while IFS=$'\t' read -r id name path status; do
              [ -n "${id:-}" ] || continue
              if [ "$id" = "$self" ]; then
                echo "  keep $id (this cleanup run)"
                continue
              fi
              if [[ "${path,,}" == *"leanstral-research.yml"* ]] || [[ "${name,,}" == *"leanstral"* ]]; then
                echo "  keep $id [$status] $name ($path)"
                continue
              fi

              echo "  cancel $id [$status] $name ($path)"
              if gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/cancel" --silent 2>/dev/null; then
                continue
              fi

              echo "    normal cancel refused; forcing"
              if ! gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/force-cancel" --silent 2>/dev/null; then
                echo "    force-cancel refused for $id" >&2
              fi
            done < <(
              gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" \
                --jq '.workflow_runs[]
                      | select(.status != "completed")
                      | [.id, .name, .path, .status]
                      | @tsv'
            )
          }

          sweep 1
          sleep 3
          sweep 2
          sleep 3
          sweep 3
