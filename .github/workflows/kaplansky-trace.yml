name: Kaplansky trace certificates

on:
  push:
    branches: [main]
    paths:
      - 'experiments/kaplansky_trace_certificate.py'
      - 'experiments/test_kaplansky_trace_certificate.py'
      - 'research/artifacts/kaplansky-trace-certificates.json'
      - 'research/artifacts/kaplansky-finite-precision-trace-2026-09-07.md'
      - 'research/finite-precision-lifted-trace-*.md'
      - 'research/no-fixed-trace-precision-*.md'
      - 'research/leavitt-balanced-corners-finite-trace-proof.md'
      - '.github/workflows/kaplansky-trace.yml'
  pull_request:
    paths:
      - 'experiments/kaplansky_trace_certificate.py'
      - 'experiments/test_kaplansky_trace_certificate.py'
      - 'research/artifacts/kaplansky-trace-certificates.json'
      - 'research/artifacts/kaplansky-finite-precision-trace-2026-09-07.md'
      - 'research/finite-precision-lifted-trace-*.md'
      - 'research/no-fixed-trace-precision-*.md'
      - 'research/leavitt-balanced-corners-finite-trace-proof.md'
      - '.github/workflows/kaplansky-trace.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kaplansky-trace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Test exact arithmetic and inconclusive outcomes
        run: python3 -m unittest discover -s experiments -p 'test_kaplansky_trace_certificate.py' -v
      - name: Replay the committed witnesses
        run: python3 experiments/kaplansky_trace_certificate.py --verify research/artifacts/kaplansky-trace-certificates.json
      - name: Check that the complete example suite is reproducible
        run: |
          python3 experiments/kaplansky_trace_certificate.py --examples --output research/artifacts/kaplansky-trace-certificates.json
          git diff --exit-code -- research/artifacts/kaplansky-trace-certificates.json
