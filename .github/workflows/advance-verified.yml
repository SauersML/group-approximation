# Fast lane for the `verified` pointer.
#
# The prover workflow advances `verified` after a fully green run, but a full
# build takes minutes to hours, and it only triggers on its own path filter.
# Most pushes to main (manuscripts, docs, experiments, PDFs) leave every one
# of those trigger paths untouched: the verification surface of the new
# commit is byte-identical to one that already passed the full gate, and
# re-verifying it would prove nothing new.  This workflow advances the
# pointer within about a minute for exactly those pushes, by diffing the
# prover trigger surface of HEAD against the current `verified` commit and
# fast-forwarding only when the two are identical.  The invariant is
# preserved: the verification surface at `verified` always equals one that
# passed the full prover gate.  Any surface change leaves the pointer to the
# full prover run.
#
# The path list below must mirror the `push.paths` filter of prover.yml; a
# path added there should be added here, or fast advances may skip a commit
# the prover would have re-checked.
name: Advance verified pointer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: advance-verified
  cancel-in-progress: false

jobs:
  advance:
    name: Advance if the verification surface is unchanged
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1

      - name: Compare surface and advance
        shell: bash
        run: |
          set -euo pipefail
          if ! git fetch --depth=1 origin refs/heads/verified; then
            echo "No verified branch yet; the full prover run creates it."
            exit 0
          fi
          base=$(git rev-parse FETCH_HEAD)
          head=$(git rev-parse HEAD)
          if [ "$base" = "$head" ]; then
            echo "verified already points at ${head}."
            exit 0
          fi
          surface=('*.lean' 'scripts' \
            'docs/CLAIM_DECLS.txt' 'docs/NON_MF_CLAIM_DECLS.txt' \
            'docs/CLAIM_SIGNATURES.md' 'docs/NON_MF_CLAIM_SIGNATURES.md' \
            'lakefile.toml' 'lean-toolchain' 'lake-manifest.json' \
            '.github/workflows/prover.yml')
          if git diff --quiet "$base" "$head" -- "${surface[@]}"; then
            echo "Surface identical to verified commit ${base}; advancing."
            git push --force origin "${head}:refs/heads/verified"
          else
            echo "Surface changed since ${base}; the full prover gate decides."
          fi
