# Keep the non-MF manuscript under the same publication gates as the other
# papers: source-to-Lean links, TeX convergence, overflow checks, conservative
# PDF normalization, full-page rendering, anonymous-build leak detection, and
# a versioned PDF on main.
name: Build and commit non-MF PDF

on:
  push:
    branches: [main]
    paths:
      - non_mf_groups_exist.tex
      - docs/NON_MF_CLAIM_DECLS.txt
      # Visible counterpart links range across the library.  Any Lean source
      # change can rename or move a mapped declaration, so the lexical gate
      # must run on the whole source tree rather than one historical module.
      - GroupApproximation/**
      - lakefile.toml
      # All publication and source-audit helpers are part of the gate.  Watching
      # the directory prevents a shared helper change from silently bypassing it.
      - scripts/**
      - .github/workflows/build-non-mf-pdf.yml
  workflow_dispatch:

permissions:
  contents: write
  # Needed to query the prover workflow's run history for the Lean gate.
  actions: read
  id-token: write
  attestations: write

concurrency:
  group: build-non-mf-pdf-main
  # Publication inputs change frequently while the proof and paper move
  # together.  Keep only the newest validation run; the publish step below
  # independently fingerprints every input before it pushes the artifact.
  cancel-in-progress: true

env:
  TEX_FILE: non_mf_groups_exist.tex
  PDF_FILE: non_mf_groups_exist.pdf

jobs:
  build-pdf:
    name: Build and validate PDF
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Assert a clean source checkout
        run: |
          test -z "$(git status --porcelain)" || {
            echo "The release checkout is dirty before generation." >&2
            git status --short >&2
            exit 1
          }

      - name: Cache apt package downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/texdebs
          key: ${{ runner.os }}-non-mf-texdebs-${{ hashFiles('.github/workflows/build-non-mf-pdf.yml') }}

      - name: Install TeX and PDF validation tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          retry='-o Acquire::Retries=5 -o Acquire::http::Timeout=30'
          keep='-o APT::Keep-Downloaded-Packages=true'
          if [ -d "$HOME/texdebs" ]; then
            sudo cp "$HOME"/texdebs/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          fi
          sudo apt-get $retry update
          sudo apt-get $retry $keep install --yes --no-install-recommends \
            chktex latexmk lmodern poppler-utils qpdf \
            texlive-fonts-recommended texlive-latex-base texlive-latex-extra \
            texlive-latex-recommended texlive-science
          mkdir -p "$HOME/texdebs"
          sudo cp /var/cache/apt/archives/*.deb "$HOME/texdebs/" 2>/dev/null || true
          sudo chown -R "$USER" "$HOME/texdebs"

      - name: Calibrate and check visible Lean counterpart links
        run: |
          python3 scripts/check_non_mf_refs.py --self-test
          # Pin the CDE predicate reformulation and the finite-type-indexed
          # canonical target isomorphism at their honest `equiv` status, and
          # the finite-normal kernel theorem at `exact`.  The
          # literal E endpoint is deliberately not required: it is not a Lean
          # theorem, and the manuscript says so explicitly.
          python3 scripts/check_non_mf_refs.py \
            --tex "$TEX_FILE" \
            --check-decls \
            --require-status equivalent \
              Sofic/CDEOperatorMF \
              GroupApproximation.isCDEOperatorMF_iff_isOperatorMF \
            --require-status equivalent \
              Analysis/NormMatrixCoronaUnitary \
              GroupApproximation.normMatrixCoronaUnitaryEquiv \
            --require-verified \
              Sofic/FiniteNormalCoronaObstruction \
              GroupApproximation.KazhdanCompressionCore.finiteNormal_le_normMatrixCStarCoronaKernel

      - name: Check figure text boxes do not overlap
        run: python3 scripts/check_fig_overlap.py --tex "$TEX_FILE"

      # The repository-wide Lean source audits run in the prover workflow.
      # The publish step below refuses to push a PDF unless some successful
      # prover run covers the exact Lean tree this manuscript cites, so a PDF
      # can no longer publish against a Lean tree that has never passed the
      # kernel audit.
      - name: Pin the repository revision into the manuscript links
        run: |
          python3 - "$TEX_FILE" "$GITHUB_SHA" <<'EOF'
          import sys, pathlib
          path, sha = pathlib.Path(sys.argv[1]), sys.argv[2]
          text = path.read_text()
          pinned = text.replace(
              r"\newcommand{\leancommit}{main}",
              r"\newcommand{\leancommit}{%s}" % sha)
          if pinned == text:
              raise SystemExit("leancommit macro not found; refusing to build unpinned links")
          path.write_text(pinned)
          EOF

      - name: Write exact release provenance into the manuscript
        run: |
          python3 - "$TEX_FILE" "$GITHUB_SHA" <<'EOF'
          import json, pathlib, sys
          path, sha = pathlib.Path(sys.argv[1]), sys.argv[2]
          manifest = json.loads(pathlib.Path("lake-manifest.json").read_text())
          mathlib = next(p["rev"] for p in manifest["packages"] if p["name"] == "mathlib")
          lean = pathlib.Path("lean-toolchain").read_text().strip()
          text = path.read_text()
          replacements = {
              r"\newcommand{\leanversion}{unbuilt}": rf"\newcommand{{\leanversion}}{{{lean}}}",
              r"\newcommand{\mathlibcommit}{unbuilt}": rf"\newcommand{{\mathlibcommit}}{{{mathlib}}}",
              r"\newcommand{\formalizationrevision}{unbuilt}": rf"\newcommand{{\formalizationrevision}}{{{sha}}}",
          }
          for old, new in replacements.items():
              updated = text.replace(old, new)
              if updated == text:
                  raise SystemExit(f"provenance macro missing: {old}")
              text = updated
          path.write_text(text)
          EOF

      - name: Compile, lint, normalize, and validate PDF
        shell: bash
        run: |
          set -euo pipefail
          base_name="${TEX_FILE%.tex}"
          raw_pdf="build/${base_name}.pdf"
          log_file="build/${base_name}.log"
          temporary_pdf="${PDF_FILE}.tmp"

          rm -rf build pdf-render-check
          rm -f "$temporary_pdf"
          mkdir -p build pdf-render-check

          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct -- "$TEX_FILE")"
          export FORCE_SOURCE_DATE=1
          export TZ=UTC

          # ChkTeX's warnings 9, 12, 13, 25, and 38 are not reliable for this
          # mathematical manuscript: they flag half-open interval notation,
          # adjacent math atoms, abbreviations such as "MF.", and the paper's
          # TeX-style closing quotes.  Keep ChkTeX as a gate for its remaining
          # diagnostics while leaving compilation, references, overflows,
          # rendering, and PDF integrity to the dedicated checks below.
          chktex -q -n1 -n2 -n3 -n8 -n9 -n12 -n13 -n24 -n25 -n36 -n38 \
            "$TEX_FILE"
          latexmk -pdf -outdir=build -interaction=nonstopmode \
            -halt-on-error -file-line-error "$TEX_FILE"

          test -s "$raw_pdf"
          test -s "$log_file"
          if grep -Eq \
            'LaTeX Warning: (Citation .* undefined|Reference .* undefined|There were undefined references|Label\(s\) may have changed)|Rerun to get cross-references right' \
            "$log_file"; then
            echo "The final LaTeX pass still has unresolved references or citations." >&2
            exit 1
          fi
          if grep -Eq \
            'Overfull \\[hv]box|[Ll]ost marginpar|Marginpar on page [0-9]+ moved' \
            "$log_file"; then
            echo "Overflowing or colliding material in the final LaTeX pass:" >&2
            grep -E 'Overfull \\[hv]box|[Ll]ost marginpar|Marginpar on page [0-9]+ moved' "$log_file" >&2
            exit 1
          fi

          qpdf --linearize --object-streams=disable --force-version=2.0 \
            --deterministic-id "$raw_pdf" "$temporary_pdf"
          mv -- "$temporary_pdf" "$PDF_FILE"
          qpdf --check "$PDF_FILE"
          pdfinfo "$PDF_FILE"
          test "$(head -c 8 "$PDF_FILE")" = '%PDF-2.0'

          pdfinfo -meta "$PDF_FILE" > build/pdf-metadata.xml
          grep -Eq 'xml:lang="en-US"|dc:language[^>]*>en-US<' build/pdf-metadata.xml

          pdftoppm -png -r 72 "$PDF_FILE" pdf-render-check/page
          page_count="$(pdfinfo "$PDF_FILE" | awk '/^Pages:/ {print $2}')"
          rendered_count="$(find pdf-render-check -name 'page-*.png' -type f | wc -l)"
          test "$rendered_count" -eq "$page_count"
          find pdf-render-check -name 'page-*.png' -type f -size 0 -print -quit \
            | (! grep -q .)

      - name: Build and verify the anonymous variant
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-anon
          sed 's/\\anonymousfalse/\\anonymoustrue/' "$TEX_FILE" > build-anon/anon.tex
          latexmk -pdf -outdir=build-anon -interaction=nonstopmode \
            -halt-on-error -file-line-error build-anon/anon.tex
          test -s build-anon/anon.pdf
          qpdf --qdf --object-streams=disable build-anon/anon.pdf build-anon/anon-qdf.pdf
          if pdftotext build-anon/anon.pdf - | grep -q 'github.com/SauersML' \
             || grep -aq 'github.com/SauersML' build-anon/anon-qdf.pdf; then
            echo "The anonymous build leaks the repository URL." >&2
            exit 1
          fi

      - name: Require a successful kernel audit of this exact revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Poll for a successful prover run whose head SHA is literally this
          # SHA.  Digest-equivalent but different commits are rejected: the
          # PDF, source links, signatures, and kernel audit name one revision.
          for attempt in $(seq 1 12); do
            run_id="$(gh run list --workflow=prover.yml --commit "$GITHUB_SHA" \
              --status=success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
            if [ -n "$run_id" ]; then
              echo "$run_id" > build/prover-run-id.txt
              echo "Exact revision $GITHUB_SHA passed prover run $run_id."
              break
            fi
            echo "No successful prover run for $GITHUB_SHA yet (attempt $attempt); waiting."
            sleep 120
          done
          test -s build/prover-run-id.txt || {
            echo "No successful Lean kernel audit exists for exact revision $GITHUB_SHA; refusing to publish." >&2
            exit 1
          }

      - name: Create source and artifact manifest
        run: |
          git archive --format=tar.gz \
            --output="build/non-mf-source-${GITHUB_SHA}.tar.gz" "$GITHUB_SHA"
          python3 scripts/release_manifest.py \
            --commit "$GITHUB_SHA" \
            --prover-run-id "$(cat build/prover-run-id.txt)" \
            --source-checkout-clean \
            --pdf "$PDF_FILE" \
            --output build/NON_MF_RELEASE_MANIFEST.json
          sha256sum "$PDF_FILE" \
            "build/non-mf-source-${GITHUB_SHA}.tar.gz" \
            build/NON_MF_RELEASE_MANIFEST.json \
            > build/SHA256SUMS

      - name: Upload immutable review bundle
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: non-mf-release-${{ github.sha }}
          if-no-files-found: error
          retention-days: 90
          path: |
            non_mf_groups_exist.tex
            non_mf_groups_exist.pdf
            build/non-mf-source-${{ github.sha }}.tar.gz
            build/NON_MF_RELEASE_MANIFEST.json
            build/SHA256SUMS
            build/non_mf_groups_exist.log

      - name: Attest the PDF and manifest
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: |
            non_mf_groups_exist.pdf
            build/non-mf-source-${{ github.sha }}.tar.gz
            build/NON_MF_RELEASE_MANIFEST.json

      - name: Commit and push updated PDF
        env:
          START_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          publication_inputs_digest() {
            git ls-tree -r "$1" -- \
              "$TEX_FILE" \
              docs/NON_MF_CLAIM_DECLS.txt \
              GroupApproximation \
              lakefile.toml \
              scripts \
              .github/workflows/build-non-mf-pdf.yml \
              | sha256sum | awk '{print $1}'
          }

          built_inputs="$(publication_inputs_digest "$START_SHA")"
          pdf_holding="${RUNNER_TEMP}/${PDF_FILE}"
          cp -- "$PDF_FILE" "$pdf_holding"
          git fetch origin main

          for attempt in 1 2 3; do
            remote_main="$(git rev-parse origin/main)"
            if [[ "$(publication_inputs_digest "$remote_main")" != "$built_inputs" ]]; then
              echo "main carries newer publication inputs; that push will build its PDF."
              exit 0
            fi
            git reset --hard "$remote_main"
            cp -- "$pdf_holding" "$PDF_FILE"
            git add -- "$PDF_FILE"
            if git diff --cached --quiet -- "$PDF_FILE"; then
              echo "The committed PDF is already current."
              exit 0
            fi
            git commit -m "build: update non-MF PDF [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejected on attempt ${attempt}; retrying."
            git fetch origin main
          done
          echo "Could not push the updated PDF after 3 attempts." >&2
          exit 1
