# Keep the non-MF manuscript under the same publication gates as the other
# papers: source-to-Lean links, TeX convergence, overflow checks, conservative
# PDF normalization, full-page rendering, provenance attestation, and an
# immutable manual release for a fully verified revision.
name: Build and attest non-MF PDF

on:
  push:
    branches: [main]
    paths:
      - non_mf_groups_exist.tex
      - docs/NON_MF_CLAIM_DECLS.txt
      - docs/NON_MF_CLAIM_SIGNATURES.md
      - docs/NON_MF_NUMBERED_CLAIMS.json
      # Visible counterpart links range across the library.  Any Lean source
      # change can rename or move a mapped declaration, so the lexical gate
      # must run on the whole source tree rather than one historical module.
      - GroupApproximation/**
      - GroupApproximation.lean
      - experiments/sl3-p13-reductions-complete.json
      - experiments/sl3-sos-radius0-certificate.json
      - experiments/sl3-sos-radius0-certificate.npz
      - experiments/sl3_p13_certificate_lean_generator.py
      - experiments/sl3_p13_hodge_lean_generator.py
      - experiments/sl3_p13_pair_table_generator.py
      - experiments/sl3_p13_relator_replay.py
      - experiments/sl3_p13_replay_lean_generator.py
      - lakefile.toml
      - lean-toolchain
      - lake-manifest.json
      # All publication and source-audit helpers are part of the gate.  Watching
      # the directory prevents a shared helper change from silently bypassing it.
      - scripts/**
      - .github/workflows/build-non-mf-pdf.yml
      - .github/workflows/prover.yml
      - .github/workflows/advance-verified.yml
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: build-non-mf-pdf-main
  # A build already used as a release gate must run to completion.  New pushes
  # replace only the queued run, not an in-flight validation of another SHA.
  cancel-in-progress: false

env:
  TEX_FILE: non_mf_groups_exist.tex
  PDF_FILE: non_mf_groups_exist.pdf
  # A complete rolling TeX Live 2026 image, pinned by its linux/amd64 OCI
  # manifest.  Pinning the image makes the accessibility/tagging toolchain an
  # immutable part of the release provenance.
  TEXLIVE_IMAGE: ghcr.io/xu-cheng/texlive-alpine@sha256:d9bfb267e3e3f5e0820ca86e867ee59ebb133fc29561bb28677d9b5a1a9e84ff

jobs:
  build-pdf:
    name: Build, kernel-audit, and validate PDF
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Assert a clean source checkout
        run: |
          test -z "$(git status --porcelain)" || {
            echo "The release checkout is dirty before generation." >&2
            git status --short >&2
            exit 1
          }

      - name: Cache Lean toolchain
        id: elan-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.elan
          key: ${{ runner.os }}-elan-${{ hashFiles('lean-toolchain') }}

      - name: Install elan
        if: steps.elan-cache.outputs.cache-hit != 'true'
        run: curl https://raw.githubusercontent.com/leanprover/elan/464c9d28395000a2a0128e07081e4956d50eced2/elan-init.sh -sSf | sh -s -- -y

      - name: Add elan to PATH
        run: echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Restore Lake dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .lake/packages
          key: ${{ runner.os }}-lake-deps-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            ${{ runner.os }}-lake-deps-

      - name: Restore compiled project
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .lake/build
          key: ${{ runner.os }}-nonsofic-release-build-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml', 'GroupApproximation.lean', 'GroupApproximation/**/*.lean') }}
          restore-keys: |
            ${{ runner.os }}-nonsofic-build-

      - name: Fetch precompiled Mathlib
        run: lake exe cache get

      - name: Install PDF validation tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          retry='-o Acquire::Retries=5 -o Acquire::http::Timeout=30'
          sudo apt-get $retry update
          sudo apt-get $retry install --yes --no-install-recommends \
            poppler-utils qpdf
          docker pull "$TEXLIVE_IMAGE"

      - name: Calibrate and check exact declaration links
        run: |
          mkdir -p build
          python3 scripts/check.py --self-test
          python3 scripts/test_claim_map.py
          python3 scripts/check_non_mf_refs.py --self-test
          python3 scripts/check_non_mf_claim_manifest.py --self-test
          python3 scripts/regenerate_non_mf_claim_manifest.py \
            --output build/NON_MF_NUMBERED_CLAIMS.generated.json
          diff -u docs/NON_MF_NUMBERED_CLAIMS.json \
            build/NON_MF_NUMBERED_CLAIMS.generated.json
          python3 scripts/check_non_mf_refs.py \
            --tex "$TEX_FILE" \
            --check-decls \
            --extra-declarations-from docs/NON_MF_NUMBERED_CLAIMS.json \
            --require-verified \
              Sofic/LiteralNonMFEndpoint \
              GroupApproximation.LiteralNonMFEndpoint.manuscriptTheoremA \
            --require-verified \
              Sofic/LiteralBaseP13PropertyTBridge \
              GroupApproximation.LiteralBaseP13PropertyTBridge.manuscriptBaseHasKazhdanPropertyT \
            --require-verified \
              Sofic/LiteralP13HodgeCertificate \
              GroupApproximation.LiteralP13HodgeCertificate.manuscriptP13HodgeCertificate
          python3 scripts/check_non_mf_claim_manifest.py \
            --tex "$TEX_FILE" \
            --manifest docs/NON_MF_NUMBERED_CLAIMS.json \
            --signature-roster docs/NON_MF_CLAIM_DECLS.txt

      - name: Source scan
        run: python3 scripts/check.py

      - name: Build the complete formal development
        run: lake build

      - name: Build and calibrate the audit library
        run: |
          lake build Audit
          lake env lean scripts/Calibrate.lean

      - name: Kernel audit and endpoint axiom closures
        run: lake env lean scripts/Audit.lean | tee kernel-audit.log

      - name: Regenerate and compare exact signatures
        run: |
          cp docs/CLAIM_SIGNATURES.md /tmp/CLAIM_SIGNATURES.expected.md
          cp docs/NON_MF_CLAIM_SIGNATURES.md /tmp/NON_MF_CLAIM_SIGNATURES.expected.md
          lake env lean scripts/Signatures.lean | tee signatures.log
          cmp -s /tmp/CLAIM_SIGNATURES.expected.md docs/CLAIM_SIGNATURES.md
          cmp -s /tmp/NON_MF_CLAIM_SIGNATURES.expected.md \
            docs/NON_MF_CLAIM_SIGNATURES.md
          mv /tmp/CLAIM_SIGNATURES.expected.md docs/CLAIM_SIGNATURES.md
          mv /tmp/NON_MF_CLAIM_SIGNATURES.expected.md \
            docs/NON_MF_CLAIM_SIGNATURES.md

      - name: Fresh kernel replay
        run: lake env leanchecker --fresh GroupApproximation | tee leanchecker.log

      - name: Check figure text boxes do not overlap
        run: |
          python3 scripts/check_fig_overlap.py --tex "$TEX_FILE" \
            --tex-image "$TEXLIVE_IMAGE"

      - name: Pin the repository revision into the manuscript links
        run: |
          python3 - "$TEX_FILE" "$GITHUB_SHA" <<'EOF'
          import sys, pathlib
          path, sha = pathlib.Path(sys.argv[1]), sys.argv[2]
          text = path.read_text()
          pinned = text.replace(
              r"\newcommand{\leancommit}{main}",
              r"\newcommand{\leancommit}{%s}" % sha)
          if pinned == text:
              raise SystemExit("leancommit macro not found; refusing to build unpinned links")
          path.write_text(pinned)
          EOF

      - name: Write exact release provenance into the manuscript
        run: |
          python3 - "$TEX_FILE" "$GITHUB_SHA" <<'EOF'
          import json, pathlib, sys
          path, sha = pathlib.Path(sys.argv[1]), sys.argv[2]
          manifest = json.loads(pathlib.Path("lake-manifest.json").read_text())
          mathlib = next(p["rev"] for p in manifest["packages"] if p["name"] == "mathlib")
          lean = pathlib.Path("lean-toolchain").read_text().strip()
          claim_manifest = pathlib.Path("docs/NON_MF_NUMBERED_CLAIMS.json").read_bytes()
          import hashlib
          claim_hash = hashlib.sha256(claim_manifest).hexdigest()
          text = path.read_text()
          replacements = {
              r"\newcommand{\leanversion}{unbuilt}": rf"\newcommand{{\leanversion}}{{{lean}}}",
              r"\newcommand{\mathlibcommit}{unbuilt}": rf"\newcommand{{\mathlibcommit}}{{{mathlib}}}",
              r"\newcommand{\formalizationrevision}{unbuilt}": rf"\newcommand{{\formalizationrevision}}{{{sha}}}",
              r"\newcommand{\claimmanifesthash}{unbuilt}": rf"\newcommand{{\claimmanifesthash}}{{{claim_hash}}}",
              r"\newcommand{\publicationrun}{unbuilt}": r"\newcommand{\publicationrun}{${{ github.run_id }}}",
          }
          for old, new in replacements.items():
              updated = text.replace(old, new)
              if updated == text:
                  raise SystemExit(f"provenance macro missing: {old}")
              text = updated
          path.write_text(text)
          EOF

      - name: Compile and lint in pinned TeX Live
        run: |
          rm -rf build
          mkdir -p build
          source_epoch="$(git log -1 --format=%ct -- "$TEX_FILE")"
          docker run --rm \
            -e SOURCE_DATE_EPOCH="$source_epoch" \
            -e FORCE_SOURCE_DATE=1 -e TZ=UTC \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            "$TEXLIVE_IMAGE" \
            bash -euo pipefail -c '
              chktex -q -n1 -n2 -n3 -n8 -n9 -n12 -n13 -n24 -n25 -n36 -n38 \
                "$1"
              latexmk -lualatex -outdir=build -interaction=nonstopmode \
                -halt-on-error -file-line-error "$1"
            ' _ "$TEX_FILE"

      - name: Normalize and validate PDF
        shell: bash
        run: |
          set -euo pipefail
          base_name="${TEX_FILE%.tex}"
          raw_pdf="build/${base_name}.pdf"
          log_file="build/${base_name}.log"
          temporary_pdf="${PDF_FILE}.tmp"

          rm -rf pdf-render-check
          rm -f "$temporary_pdf"
          mkdir -p pdf-render-check

          # ChkTeX's warnings 9, 12, 13, 25, and 38 are not reliable for this
          # mathematical manuscript: they flag half-open interval notation,
          # adjacent math atoms, abbreviations such as "MF.", and the paper's
          # TeX-style closing quotes.  Keep ChkTeX as a gate for its remaining
          # diagnostics while leaving compilation, references, overflows,
          # rendering, and PDF integrity to the dedicated checks below.
          test -s "$raw_pdf"
          test -s "$log_file"
          if grep -Eq \
            'LaTeX Warning: (Citation .* undefined|Reference .* undefined|There were undefined references|Label\(s\) may have changed)|Rerun to get cross-references right' \
            "$log_file"; then
            echo "The final LaTeX pass still has unresolved references or citations." >&2
            exit 1
          fi
          if grep -Eq \
            'Overfull \\[hv]box|[Ll]ost marginpar|Marginpar on page [0-9]+ moved' \
            "$log_file"; then
            echo "Overflowing or colliding material in the final LaTeX pass:" >&2
            grep -E 'Overfull \\[hv]box|[Ll]ost marginpar|Marginpar on page [0-9]+ moved' "$log_file" >&2
            exit 1
          fi

          qpdf --linearize --object-streams=disable --force-version=2.0 \
            --deterministic-id "$raw_pdf" "$temporary_pdf"
          mv -- "$temporary_pdf" "$PDF_FILE"
          qpdf --check "$PDF_FILE"
          pdfinfo "$PDF_FILE"
          test "$(head -c 8 "$PDF_FILE")" = '%PDF-2.0'
          test "$(pdfinfo "$PDF_FILE" | awk -F: '/^Tagged:/ {gsub(/^[[:space:]]+/, "", $2); print $2}')" = 'yes'

          pdfinfo -meta "$PDF_FILE" > build/pdf-metadata.xml
          grep -Eq 'xml:lang="en-US"|dc:language[^>]*>en-US<' build/pdf-metadata.xml

          pdftoppm -png -r 72 "$PDF_FILE" pdf-render-check/page
          page_count="$(pdfinfo "$PDF_FILE" | awk '/^Pages:/ {print $2}')"
          rendered_count="$(find pdf-render-check -name 'page-*.png' -type f | wc -l)"
          test "$rendered_count" -eq "$page_count"
          find pdf-render-check -name 'page-*.png' -type f -size 0 -print -quit \
            | (! grep -q .)

      - name: Upload PDF validation preview
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: non-mf-preview-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            non_mf_groups_exist.pdf
            build/non_mf_groups_exist.log

      - name: Create source and artifact manifest
        run: |
          git archive --format=tar.gz \
            --output="build/non-mf-source-${GITHUB_SHA}.tar.gz" "$GITHUB_SHA"
          python3 scripts/release_manifest.py \
            --commit "$GITHUB_SHA" \
            --kernel-audit-run-id "$GITHUB_RUN_ID" \
            --publication-run-id "$GITHUB_RUN_ID" \
            --texlive-image "$TEXLIVE_IMAGE" \
            --source-checkout-clean \
            --pdf "$PDF_FILE" \
            --output build/NON_MF_RELEASE_MANIFEST.json
          sha256sum "$PDF_FILE" \
            "build/non-mf-source-${GITHUB_SHA}.tar.gz" \
            build/NON_MF_RELEASE_MANIFEST.json \
            > build/SHA256SUMS

      - name: Upload immutable review bundle
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: non-mf-release-${{ github.sha }}
          if-no-files-found: error
          retention-days: 90
          path: |
            non_mf_groups_exist.tex
            non_mf_groups_exist.pdf
            build/non-mf-source-${{ github.sha }}.tar.gz
            build/NON_MF_RELEASE_MANIFEST.json
            build/SHA256SUMS
            build/non_mf_groups_exist.log
            kernel-audit.log
            signatures.log
            leanchecker.log

      - name: Assert generation changed only release artifacts
        run: |
          allowed='^( M non_mf_groups_exist\.tex| M non_mf_groups_exist\.pdf|\?\? build/|\?\? leanchecker\.log$|\?\? kernel-audit\.log$|\?\? signatures\.log$|\?\? non_mf_groups_exist\.pdf$|\?\? pdf-render-check/)$'
          unexpected="$(git status --porcelain | grep -Ev "$allowed" || true)"
          test -z "$unexpected" || {
            echo "Unexpected source change during release generation:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          }

      - name: Attest the PDF and manifest
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: |
            non_mf_groups_exist.pdf
            build/non-mf-source-${{ github.sha }}.tar.gz
            build/NON_MF_RELEASE_MANIFEST.json

      - name: Publish immutable tagged release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:12}"
          tag="non-mf-${short_sha}"
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --verify-tag=false \
            --title "Non-MF formalization ${short_sha}" \
            --notes "Kernel-audited source, tagged PDF, claim manifest, hashes, and provenance attestation for ${GITHUB_SHA}." \
            "$PDF_FILE" \
            "build/non-mf-source-${GITHUB_SHA}.tar.gz" \
            build/NON_MF_RELEASE_MANIFEST.json \
            build/SHA256SUMS \
            build/non_mf_groups_exist.log \
            kernel-audit.log \
            signatures.log \
            leanchecker.log
