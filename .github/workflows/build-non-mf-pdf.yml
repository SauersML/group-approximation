# Keep the non-MF manuscript under the same publication gates as the other
# papers: source-to-Lean links, TeX convergence, overflow checks, conservative
# PDF normalization, full-page rendering, provenance attestation, and an
# immutable manual release for a fully verified revision.
name: Build and attest non-MF PDF

on:
  # The Prover workflow is the sole producer of the memory-intensive P13
  # archive.  Publication starts only after that exact source revision has
  # passed, rather than launching a competing six-runner copy of the proof.
  workflow_run:
    workflows: ["Lean Prover CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full main-branch commit already accepted by Lean Prover CI
        required: true
        type: string
      prover_run_id:
        description: Successful Lean Prover CI run for source_sha
        required: true
        type: string

permissions:
  actions: read
  contents: write
  id-token: write
  attestations: write

env:
  TEX_FILE: non_mf_groups_exist.tex
  PDF_FILE: non_mf_groups_exist.pdf
  # TeX Live 2025, pinned by its linux/amd64 OCI manifest.  Pinning the image
  # makes the accessibility/tagging toolchain an immutable part of the release
  # provenance.
  #
  # This used to pin a 2026 image.  It must not: on this source the 2026
  # tagpdf aborts at \tableofcontents and garbles the contents page, which is
  # exactly why draft-non-mf-pdf.yml and refresh-non-mf-pdf.yml pin 2025.  The
  # attested release path is the one place that failure would be worst, so all
  # three workflows now share the same pin.  Re-pin to a newer image only
  # after a green run of the draft workflow on that image.
  TEXLIVE_IMAGE: ghcr.io/xu-cheng/texlive-alpine@sha256:556e2e2caa7d489ce155de0eb3f43e324e6502ed4e9871aa400662b156cf00ad

jobs:
  build-pdf:
    name: Build, kernel-audit, and validate PDF
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    concurrency:
      group: publish-pdfs-main
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || inputs.source_sha }}
      PROVER_RUN_ID: ${{ github.event.workflow_run.id || inputs.prover_run_id }}

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind publication to the exact successful Prover run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${PROVER_RUN_ID}")"
          test "$(jq -r .path <<<"$run_json")" = '.github/workflows/prover.yml'
          test "$(jq -r .status <<<"$run_json")" = completed
          test "$(jq -r .conclusion <<<"$run_json")" = success
          test "$(jq -r .event <<<"$run_json")" = push
          test "$(jq -r .head_branch <<<"$run_json")" = main
          test "$(jq -r .head_repository.full_name <<<"$run_json")" = "$GITHUB_REPOSITORY"
          test "$(jq -r .head_sha <<<"$run_json")" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Assert a clean source checkout
        run: |
          test -z "$(git status --porcelain)" || {
            echo "The release checkout is dirty before generation." >&2
            git status --short >&2
            exit 1
          }

      - name: Cache Lean toolchain
        id: elan-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.elan
          key: ${{ runner.os }}-elan-${{ hashFiles('lean-toolchain') }}

      - name: Install elan
        if: steps.elan-cache.outputs.cache-hit != 'true'
        run: curl https://raw.githubusercontent.com/leanprover/elan/464c9d28395000a2a0128e07081e4956d50eced2/elan-init.sh -sSf | sh -s -- -y

      - name: Add elan to PATH
        run: echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Restore Lake dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .lake/packages
          key: ${{ runner.os }}-lake-deps-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            ${{ runner.os }}-lake-deps-

      - name: Restore compiled project
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .lake/build
          key: ${{ runner.os }}-nonsofic-release-build-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml', 'GroupApproximation.lean', 'GroupApproximation/**/*.lean') }}
          restore-keys: |
            ${{ runner.os }}-nonsofic-build-

      - name: Fetch precompiled Mathlib
        run: lake exe cache get

      - name: Download the bounded P13 build
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: p13-*-${{ env.SOURCE_SHA }}
          path: build/p13-prebuild
          run-id: ${{ env.PROVER_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Restore and seal the P13 build
        run: |
          python3 scripts/p13_build_shards.py restore-all \
            --directory build/p13-prebuild
          python3 scripts/p13_build_shards.py seal

      - name: Install PDF validation tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          retry='-o Acquire::Retries=5 -o Acquire::http::Timeout=30'
          sudo apt-get $retry update
          sudo apt-get $retry install --yes --no-install-recommends \
            poppler-utils qpdf
          docker pull "$TEXLIVE_IMAGE"

      - name: Calibrate and check exact declaration links
        run: |
          mkdir -p build
          python3 scripts/check.py --self-test
          python3 scripts/test_claim_map.py
          python3 scripts/check_non_mf_refs.py --self-test
          python3 scripts/check_non_mf_claim_manifest.py --self-test
          python3 scripts/check_non_mf_unconditional.py --self-test
          python3 scripts/check_manuscript_claims.py --self-test
          python3 scripts/check_non_mf_proof_ledger.py --self-test
          python3 scripts/check_non_mf_zero_input.py \
            --tex "$TEX_FILE"
          python3 scripts/regenerate_non_mf_claim_manifest.py \
            --output build/NON_MF_NUMBERED_CLAIMS.generated.json
          diff -u docs/NON_MF_NUMBERED_CLAIMS.json \
            build/NON_MF_NUMBERED_CLAIMS.generated.json
          python3 scripts/check_non_mf_refs.py \
            --tex "$TEX_FILE" \
            --check-decls \
            --extra-declarations-from docs/NON_MF_NUMBERED_CLAIMS.json \
            --require-verified \
              Sofic/LiteralNonMFEndpoint \
              GroupApproximation.LiteralNonMFEndpoint.manuscriptTheoremA \
            --require-verified \
              Sofic/LiteralNonMFEndpoint \
              GroupApproximation.LiteralNonMFEndpoint.manuscriptTheoremD \
            --require-verified \
              Sofic/LiteralBaseP13PropertyTBridge \
              GroupApproximation.LiteralBaseP13PropertyTBridge.manuscriptBaseHasKazhdanPropertyT
          python3 scripts/check_non_mf_claim_manifest.py \
            --tex "$TEX_FILE" \
            --manifest docs/NON_MF_NUMBERED_CLAIMS.json \
            --signature-roster docs/NON_MF_CLAIM_DECLS.txt
          # The two synchronization checkers close the drift the steps above
          # cannot see: Lean docstrings citing manuscript labels that no
          # longer exist (or locating text by line numbers that have moved),
          # and a `\leanverified` badge with no row in the step-level proof
          # ledger.  An external audit found both classes coexisting with a
          # green release build because neither checker was gated here.
          python3 scripts/check_manuscript_claims.py \
            --tex "$TEX_FILE" \
            --strict
          python3 scripts/check_non_mf_proof_ledger.py \
            --tex "$TEX_FILE" \
            --ledger docs/NON_MF_PROOF_LEDGER.md

      # The step above certifies that every cited declaration is SOURCE-CLOSED:
      # its printed header ends at the colon.  That is a fact about where the
      # binders are typed, not about what the proposition assumes -- and this
      # is the workflow that renders the badges into the published PDF, so it
      # is the last place the difference can be caught.  This step reads the
      # proposition: a premise whose type is a corpus-defined name the corpus
      # never discharges is a conditional badge, however the header is
      # punctuated.
      #
      # It fails on any finding absent from docs/NON_MF_UNCONDITIONAL_BASELINE.txt
      # and on any baseline entry whose finding has gone, so the register can
      # only shrink.  There is no count in the mechanism.
      #
      # ARMED 2026-08-16.  The register has now met the real corpus: the
      # self-test passes (it has moved up into the calibration step, where the
      # other self-tests live) and the real run reports 102 cited declarations
      # with no new findings and three entries accepted by the baseline.  The
      # arming condition written here when the step was report-only has
      # therefore been met, so this step gates the attested build like the
      # others.
      - name: Non-MF unconditionality
        run: |
          python3 scripts/check_non_mf_unconditional.py \
            --tex "$TEX_FILE" \
            --baseline docs/NON_MF_UNCONDITIONAL_BASELINE.txt

      - name: Install the pinned P13 generator runtime
        run: python3 -m pip install --disable-pip-version-check --no-deps numpy==2.3.2

      - name: Replay the exact P13 source generators
        run: >-
          python3 scripts/check_p13_generated.py
          --temporary-root "$RUNNER_TEMP/p13-generated"

      - name: Source scan
        run: |
          python3 scripts/check.py
          bin/cairn check
          git diff --exit-code -- research/FRONTIER.md

      - name: Build the complete formal development
        # The memory-intensive P13 leaves are already present and sealed.
        run: lake build

      - name: Build and calibrate the audit library
        run: |
          lake build Audit
          lake env lean scripts/Calibrate.lean

      # `pipefail` is the whole point of the shell override: the default
      # `run:` shell is `bash -e`, under which a pipeline exits with the
      # status of its LAST command.  Piping the audit into `tee` therefore
      # reported `tee`'s success and a failing kernel audit could not fail
      # this job -- the gate that certifies the paper's badges was passing
      # unconditionally.
      - name: Kernel audit and endpoint axiom closures
        shell: bash
        run: |
          set -euo pipefail
          lake env lean scripts/Audit.lean | tee kernel-audit.log

      - name: Regenerate and compare exact signatures
        shell: bash
        run: |
          set -euo pipefail
          cp docs/CLAIM_SIGNATURES.md /tmp/CLAIM_SIGNATURES.expected.md
          cp docs/NON_MF_CLAIM_SIGNATURES.md /tmp/NON_MF_CLAIM_SIGNATURES.expected.md
          lake env lean scripts/Signatures.lean | tee signatures.log
          cmp -s /tmp/CLAIM_SIGNATURES.expected.md docs/CLAIM_SIGNATURES.md
          cmp -s /tmp/NON_MF_CLAIM_SIGNATURES.expected.md \
            docs/NON_MF_CLAIM_SIGNATURES.md
          mv /tmp/CLAIM_SIGNATURES.expected.md docs/CLAIM_SIGNATURES.md
          mv /tmp/NON_MF_CLAIM_SIGNATURES.expected.md \
            docs/NON_MF_CLAIM_SIGNATURES.md

      - name: Fresh kernel replay
        shell: bash
        run: |
          set -euo pipefail
          lake env leanchecker --fresh GroupApproximation | tee leanchecker.log

      - name: Assert the checked manuscript source is unchanged
        run: git diff --exit-code -- "$TEX_FILE"

      - name: Check figure text boxes do not overlap
        run: |
          python3 scripts/check_fig_overlap.py --tex "$TEX_FILE" \
            --tex-image "$TEXLIVE_IMAGE"

      - name: Compile and lint in pinned TeX Live
        run: |
          rm -rf build
          mkdir -p build
          source_epoch="$(git log -1 --format=%ct -- "$TEX_FILE")"
          docker run --rm \
            -e SOURCE_DATE_EPOCH="$source_epoch" \
            -e FORCE_SOURCE_DATE=1 -e TZ=UTC \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            "$TEXLIVE_IMAGE" \
            bash -euo pipefail -c '
              chktex -q -n1 -n2 -n3 -n8 -n9 -n12 -n13 -n24 -n25 -n36 -n38 \
                "$1"
              latexmk -lualatex -outdir=build -interaction=nonstopmode \
                -halt-on-error -file-line-error "$1"
            ' _ "$TEX_FILE"

      - name: Normalize and validate PDF
        shell: bash
        run: |
          set -euo pipefail
          base_name="${TEX_FILE%.tex}"
          raw_pdf="build/${base_name}.pdf"
          log_file="build/${base_name}.log"
          temporary_pdf="${PDF_FILE}.tmp"

          rm -rf pdf-render-check
          rm -f "$temporary_pdf"
          mkdir -p pdf-render-check

          # ChkTeX's warnings 9, 12, 13, 25, and 38 are not reliable for this
          # mathematical manuscript: they flag half-open interval notation,
          # adjacent math atoms, abbreviations such as "MF.", and the paper's
          # TeX-style closing quotes.  Keep ChkTeX as a gate for its remaining
          # diagnostics while leaving compilation, references, overflows,
          # rendering, and PDF integrity to the dedicated checks below.
          test -s "$raw_pdf"
          test -s "$log_file"
          if grep -Eq \
            'LaTeX Warning: (Citation .* undefined|Reference .* undefined|There were undefined references|Label\(s\) may have changed)|Rerun to get cross-references right' \
            "$log_file"; then
            echo "The final LaTeX pass still has unresolved references or citations." >&2
            exit 1
          fi
          if grep -Eq \
            'Overfull \\[hv]box|[Ll]ost marginpar|Marginpar on page [0-9]+ moved' \
            "$log_file"; then
            echo "Overflowing or colliding material in the final LaTeX pass:" >&2
            grep -E 'Overfull \\[hv]box|[Ll]ost marginpar|Marginpar on page [0-9]+ moved' "$log_file" >&2
            exit 1
          fi

          qpdf --linearize --object-streams=disable --force-version=2.0 \
            --deterministic-id "$raw_pdf" "$temporary_pdf"
          mv -- "$temporary_pdf" "$PDF_FILE"
          qpdf --check "$PDF_FILE"
          pdfinfo "$PDF_FILE"
          test "$(head -c 8 "$PDF_FILE")" = '%PDF-2.0'
          test "$(pdfinfo "$PDF_FILE" | awk -F: '/^Tagged:/ {gsub(/^[[:space:]]+/, "", $2); print $2}')" = 'yes'

          pdfinfo -meta "$PDF_FILE" > build/pdf-metadata.xml
          grep -Eq 'xml:lang="en-US"|dc:language[^>]*>en-US<' build/pdf-metadata.xml

          pdftoppm -png -r 72 "$PDF_FILE" pdf-render-check/page
          page_count="$(pdfinfo "$PDF_FILE" | awk '/^Pages:/ {print $2}')"
          rendered_count="$(find pdf-render-check -name 'page-*.png' -type f | wc -l)"
          test "$rendered_count" -eq "$page_count"
          find pdf-render-check -name 'page-*.png' -type f -size 0 -print -quit \
            | (! grep -q .)

      - name: Assert proof and manuscript sources stayed committed
        run: |
          allowed='^( M non_mf_groups_exist\.pdf|\?\? build/|\?\? leanchecker\.log$|\?\? kernel-audit\.log$|\?\? signatures\.log$|\?\? non_mf_groups_exist\.pdf$|\?\? pdf-render-check/)$'
          unexpected="$(git status --porcelain | grep -Ev "$allowed" || true)"
          test -z "$unexpected" || {
            echo "A tracked source changed during validation:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          }

      - name: Upload PDF validation preview
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: non-mf-preview-${{ env.SOURCE_SHA }}
          if-no-files-found: error
          retention-days: 14
          path: |
            non_mf_groups_exist.pdf
            build/non_mf_groups_exist.log

      - name: Create source and artifact manifest
        run: |
          git archive --format=tar.gz \
            --output="build/non-mf-source-${SOURCE_SHA}.tar.gz" "$SOURCE_SHA"
          python3 scripts/release_manifest.py \
            --commit "$SOURCE_SHA" \
            --kernel-audit-run-id "$PROVER_RUN_ID" \
            --publication-run-id "$GITHUB_RUN_ID" \
            --texlive-image "$TEXLIVE_IMAGE" \
            --source-checkout-clean \
            --pdf "$PDF_FILE" \
            --output build/NON_MF_RELEASE_MANIFEST.json
          sha256sum "$PDF_FILE" \
            "build/non-mf-source-${SOURCE_SHA}.tar.gz" \
            build/NON_MF_RELEASE_MANIFEST.json \
            > build/SHA256SUMS

      - name: Assert manifest generation preserved tracked sources
        run: |
          allowed='^( M non_mf_groups_exist\.pdf|\?\? build/|\?\? leanchecker\.log$|\?\? kernel-audit\.log$|\?\? signatures\.log$|\?\? non_mf_groups_exist\.pdf$|\?\? pdf-render-check/)$'
          unexpected="$(git status --porcelain | grep -Ev "$allowed" || true)"
          test -z "$unexpected" || {
            echo "A tracked source changed during manifest generation:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          }

      - name: Upload immutable review bundle
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: non-mf-release-${{ env.SOURCE_SHA }}
          if-no-files-found: error
          retention-days: 90
          path: |
            non_mf_groups_exist.tex
            non_mf_groups_exist.pdf
            build/non-mf-source-${{ env.SOURCE_SHA }}.tar.gz
            build/NON_MF_RELEASE_MANIFEST.json
            build/SHA256SUMS
            build/non_mf_groups_exist.log
            kernel-audit.log
            signatures.log
            leanchecker.log

      - name: Attest the PDF and manifest
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: |
            non_mf_groups_exist.pdf
            build/non-mf-source-${{ env.SOURCE_SHA }}.tar.gz
            build/NON_MF_RELEASE_MANIFEST.json

      - name: Commit and push the current tagged PDF without clobbering publication descendants
        env:
          START_SHA: ${{ env.SOURCE_SHA }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 scripts/publish_pdf_commit.py self-test
          python3 scripts/publish_pdf_commit.py publish \
            --source-sha "$START_SHA" \
            --pdf "$PDF_FILE" \
            --message "build: update non-MF PDF"

      - name: Publish immutable tagged release idempotently
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${SOURCE_SHA:0:12}"
          tag="non-mf-${short_sha}"
          title="Non-MF formalization ${short_sha}"
          notes="Kernel-audited source, tagged PDF, claim manifest, hashes, and provenance attestation for ${SOURCE_SHA}."
          release_files=(
            "$PDF_FILE"
            "build/non-mf-source-${SOURCE_SHA}.tar.gz"
            build/NON_MF_RELEASE_MANIFEST.json
            build/SHA256SUMS
            build/non_mf_groups_exist.log
            kernel-audit.log
            signatures.log
            leanchecker.log
          )

          declare -A expected_assets=()
          for file in "${release_files[@]}"; do
            test -f "$file"
            expected_assets["$(basename -- "$file")"]="$file"
          done
          test "${#expected_assets[@]}" -eq "${#release_files[@]}"

          verify_release() {
            local release_json="$1"
            jq -e \
              --arg tag "$tag" \
              --arg title "$title" \
              --arg notes "$notes" \
              '.tag_name == $tag and .name == $title and
               .body == $notes and
               .draft == false and .prerelease == false' \
              <<<"$release_json" >/dev/null

            local expected_names actual_names
            expected_names="$(printf '%s\n' "${!expected_assets[@]}" | LC_ALL=C sort)"
            actual_names="$(jq -r '.assets[].name' <<<"$release_json" | LC_ALL=C sort)"
            diff -u <(printf '%s\n' "$expected_names") \
              <(printf '%s\n' "$actual_names")

            local name file local_digest remote_digest
            for name in "${!expected_assets[@]}"; do
              file="${expected_assets[$name]}"
              local_digest="sha256:$(sha256sum -- "$file" | awk '{print $1}')"
              remote_digest="$(
                jq -er --arg name "$name" '
                  [.assets[] | select(.name == $name and .state == "uploaded")] |
                  if length == 1 and .[0].digest != null
                  then .[0].digest
                  else error("release asset is missing, duplicated, incomplete, or undigested")
                  end
                ' <<<"$release_json"
              )"
              test "$remote_digest" = "$local_digest"
            done

            local tag_record tag_sha tag_ref
            tag_record="$(git ls-remote --refs origin "refs/tags/${tag}")"
            read -r tag_sha tag_ref <<<"$tag_record"
            test -n "$tag_sha"
            test "$tag_ref" = "refs/tags/${tag}"
            test "$tag_sha" = "$SOURCE_SHA"
          }

          release_pages="$(
            gh api --paginate --slurp \
              "/repos/${GITHUB_REPOSITORY}/releases?per_page=100"
          )"
          release_matches="$(
            jq -c --arg tag "$tag" \
              '[.[][] | select(.tag_name == $tag)]' \
              <<<"$release_pages"
          )"
          release_count="$(jq 'length' <<<"$release_matches")"
          if [[ "$release_count" -eq 0 ]]; then
            existing_tag="$(git ls-remote --refs origin "refs/tags/${tag}")"
            if [[ -n "$existing_tag" ]]; then
              read -r existing_tag_sha existing_tag_ref <<<"$existing_tag"
              test "$existing_tag_ref" = "refs/tags/${tag}"
              test "$existing_tag_sha" = "$SOURCE_SHA"
            fi
            gh release create "$tag" \
              --target "$SOURCE_SHA" \
              --verify-tag=false \
              --title "$title" \
              --notes "$notes" \
              "${release_files[@]}"
          elif [[ "$release_count" -eq 1 ]]; then
            release_json="$(jq -c '.[0]' <<<"$release_matches")"
            jq -e \
              --arg tag "$tag" \
              --arg title "$title" \
              --arg notes "$notes" \
              '.tag_name == $tag and .name == $title and
               .body == $notes and
               .draft == false and .prerelease == false' \
              <<<"$release_json" >/dev/null
            while IFS= read -r existing_name; do
              if [[ -z "${expected_assets[$existing_name]+present}" ]]; then
                echo "Unexpected immutable release asset ${existing_name}." >&2
                exit 1
              fi
            done < <(jq -r '.assets[].name' <<<"$release_json")
            for name in "${!expected_assets[@]}"; do
              asset_count="$(
                jq --arg name "$name" \
                  '[.assets[] | select(.name == $name)] | length' \
                  <<<"$release_json"
              )"
              if [[ "$asset_count" -eq 0 ]]; then
                gh release upload "$tag" "${expected_assets[$name]}"
              elif [[ "$asset_count" -ne 1 ]]; then
                echo "Release asset ${name} is duplicated." >&2
                exit 1
              fi
            done
          else
            echo "More than one release has tag ${tag}." >&2
            exit 1
          fi

          release_json="$(
            gh api "/repos/${GITHUB_REPOSITORY}/releases/tags/${tag}"
          )"
          verify_release "$release_json"
          echo "Release ${tag} exists with the exact immutable asset set."
