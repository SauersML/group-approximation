# API documentation.  This workflow does not block a merge, but it publishes
# only source that passes the repository source gate and compiles under the
# exact committed documentation dependency graph.
name: API documentation

on:
  schedule:
    # Weekly, after the independent-kernel run: doc-gen4 is expensive and
    # deliberately non-gating, and rebuilding the API reference on every push
    # spent more runner time than the prover gate itself -- usually to be
    # cancelled by the next push.  Sundays, 06:00 UTC.
    - cron: '0 6 * * 0'
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build and publish doc-gen4 output
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Reject forbidden source constructs
        run: |
          python3 scripts/check.py --self-test
          python3 scripts/check.py

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/464c9d28395000a2a0128e07081e4956d50eced2/elan-init.sh -sSf \
            | sh -s -- -y --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch the Mathlib build cache
        run: lake exe cache get

      - name: Restore pinned documentation dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: docbuild/.lake/packages
          key: ${{ runner.os }}-docbuild-deps-${{ hashFiles('docbuild/lean-toolchain', 'docbuild/lake-manifest.json') }}
          restore-keys: |
            ${{ runner.os }}-docbuild-deps-

      - name: Build the documentation
        working-directory: docbuild
        run: |
          lake build GroupApproximation:docs
          printf '%s\n' "$GITHUB_SHA" > .lake/build/doc/source-revision.txt

      - name: Upload the site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docbuild/.lake/build/doc

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
