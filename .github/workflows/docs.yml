# API documentation.  This workflow does not block a merge, but it publishes
# only source that passes the repository source gate and compiles under the
# exact committed documentation dependency graph.
name: API documentation

on:
  schedule:
    # Weekly, after the independent-kernel run: doc-gen4 is expensive and
    # deliberately non-gating, and rebuilding the API reference on every push
    # spent more runner time than the prover gate itself -- usually to be
    # cancelled by the next push.  Sundays, 06:00 UTC.
    - cron: '0 6 * * 0'
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  build:
    name: Build and publish doc-gen4 output
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Reject forbidden source constructs
        run: |
          python3 scripts/check.py --self-test
          python3 scripts/check.py

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/464c9d28395000a2a0128e07081e4956d50eced2/elan-init.sh -sSf \
            | sh -s -- -y --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch the Mathlib build cache
        run: lake exe cache get

      - name: Restore pinned documentation dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: docbuild/.lake/packages
          key: ${{ runner.os }}-docbuild-deps-${{ hashFiles('docbuild/lean-toolchain', 'docbuild/lake-manifest.json') }}
          restore-keys: |
            ${{ runner.os }}-docbuild-deps-

      - name: Build the documentation
        working-directory: docbuild
        run: |
          lake build GroupApproximation:docs
          printf '%s\n' "$GITHUB_SHA" > .lake/build/doc/source-revision.txt

      # Pages now hosts the Cairn research site at / (cairn-site.yml), which
      # folds these API docs in under /api/ from the api-docs branch.  A
      # direct deploy-pages here would replace that whole tree, so publish to
      # the branch and let cairn-site recompose the combined site.
      - name: Publish to the api-docs branch
        run: |
          cd docbuild/.lake/build/doc
          git init -q -b api-docs
          git add -A
          git -c user.name=github-actions -c user.email=actions@github.com \
            commit -q -m "API docs for $GITHUB_SHA"
          git push -q --force \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            api-docs

      - name: Refresh the combined Pages site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run cairn-site.yml
