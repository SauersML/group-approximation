name: Promote successful Lean gate to verified

on:
  workflow_run:
    workflows: ["Lean Prover CI"]
    types: [completed]

# Promotion is deliberately a separate, short workflow.  A stale queued push
# can finish successfully after the Prover workflow skips its expensive jobs,
# so workflow-level success is not by itself a certificate.  This workflow
# first requires the triggering run's unique `Build and audit` job to have
# succeeded, then checks out exactly that certified SHA.
concurrency:
  group: verified-certified-promotion
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  advance:
    name: Fast-forward the certified revision
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require the exact Lean build job to have succeeded
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PROVER_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          jobs_json=$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${PROVER_RUN_ID}/jobs?filter=latest&per_page=100")
          total=$(jq -r '.total_count' <<<"$jobs_json")
          if ! [[ "$total" =~ ^[0-9]+$ ]] || [ "$total" -gt 100 ]; then
            echo "Refusing an incomplete or unexpectedly large job listing: $total" >&2
            exit 1
          fi
          named=$(jq '[.jobs[] | select(.name == "Build and audit")] | length' \
            <<<"$jobs_json")
          passed=$(jq '[.jobs[] | select(.name == "Build and audit" and .conclusion == "success")] | length' \
            <<<"$jobs_json")
          if [ "$named" -ne 1 ] || [ "$passed" -ne 1 ]; then
            echo "The triggering run has no unique successful Build and audit job." >&2
            jq -r '.jobs[] | [.name, .status, (.conclusion // "")] | @tsv' \
              <<<"$jobs_json" >&2
            exit 1
          fi

      - name: Check out the exact certified commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Refresh main and verified
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/heads/verified:refs/remotes/origin/verified'

      - name: Calibrate and advance
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/advance_verified_branch.py self-test
          python3 scripts/advance_verified_branch.py advance \
            --certified-ref '${{ github.event.workflow_run.head_sha }}' \
            --main-ref refs/remotes/origin/main \
            --verified-ref refs/remotes/origin/verified \
            --remote origin
