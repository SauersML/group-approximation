name: Promote successful Lean gate to verified

on:
  workflow_run:
    workflows: ["Lean Prover CI"]
    types: [completed]

# Promotion is deliberately a separate, short workflow.  A stale queued push
# can finish successfully after the Prover workflow skips its expensive jobs,
# so workflow-level success is not by itself a certificate.  This workflow
# first requires the triggering run's unique `Build and audit` job to have
# succeeded, then checks out exactly that certified SHA.
# ONE GROUP PER PROMOTION, so a wedged run cannot block the next one.
#
# This was a single global group, `verified-certified-promotion`, which
# serialized every promotion the repository would ever run through one queue.
# That is fine until a run gets stuck in it, and on 2026-08-19 four did: promote
# runs created at 04:09, 04:26, 04:52 and 04:56 sat `queued` for over five hours
# without ever starting, and both `POST .../cancel` and `POST
# .../force-cancel` answered HTTP 500 -- they were wedged in GitHub's control
# plane and could not be cleared from here at all.  Every later promotion
# queued behind them, so a green certificate took twenty minutes or a hand on
# the queue to reach `verified`, three times in one session.
#
# Serializing was never load-bearing.  `scripts/advance_verified_branch.py`
# is race-safe by construction and says so: it checks ancestry, refuses a
# non-fast-forward update, pushes WITHOUT `--force`, and treats a rejected push
# as a benign race when the new remote tip already contains what it was going
# to write.  Two promotions racing therefore cannot corrupt `verified`; the
# loser no-ops.  So the group buys tidiness and costs availability, which is
# the wrong trade for the branch this pipeline exists to advance.
#
# Keying on the triggering run makes each promotion independent: nothing can
# collect it and nothing can head-block it.  `github.run_id` is the fallback
# for a dispatch, where there is no triggering run.
#
# (`queue: max` went with the old group.  It is not a key GitHub Actions
# defines -- the documented ones are `group` and `cancel-in-progress` -- so it
# never did anything.)
concurrency:
  group: verified-certified-promotion-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  advance:
    name: Fast-forward the certified revision
    # `workflow_dispatch` belongs in this allowlist, and its absence removed the
    # only escape hatch on a day that needed one.  A dispatched Prover run takes
    # the gate's "runs at its requested SHA" branch, so it computes the FULL
    # certificate -- same jobs, same kernel replay, same audit -- and then could
    # not promote it, which meant no manual action could ever advance `verified`
    # when the automatic paths were stuck.  They were stuck all of 2026-08-17.
    #
    # Nothing about the trust argument changes.  Promotion still requires the
    # triggering run to be a success with exactly one successful certifying lane
    # (checked below, fail-closed), to come from this repository rather than a
    # fork, and to be on `main`; dispatching requires write access; and the
    # checkout below pins the exact certified SHA rather than a moving ref.  A
    # dispatch on any other ref fails the `head_branch` test as before.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' ||
       github.event.workflow_run.event == 'schedule' ||
       github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require the exact Lean build job to have succeeded
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PROVER_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          jobs_json=$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${PROVER_RUN_ID}/jobs?filter=latest&per_page=100")
          total=$(jq -r '.total_count' <<<"$jobs_json")
          if ! [[ "$total" =~ ^[0-9]+$ ]] || [ "$total" -gt 100 ]; then
            echo "Refusing an incomplete or unexpectedly large job listing: $total" >&2
            exit 1
          fi
          # A run certifies through exactly one of two mutually exclusive
          # lanes: the full "Build and audit" job when the Lean-relevant
          # tree changed, or the pure-Python "Build and audit (publication
          # layer)" job when it is byte-identical to the certified revision
          # and the standing Lean verdicts apply.  Exactly one of the two
          # must have run and succeeded; a lane that ran and failed blocks
          # promotion regardless of the other (run-level success already
          # guarantees this, but the check is repeated here fail-closed).
          passed=$(jq '[.jobs[] | select((.name == "Build and audit" or .name == "Build and audit (publication layer)") and .conclusion == "success")] | length' \
            <<<"$jobs_json")
          failed=$(jq '[.jobs[] | select((.name == "Build and audit" or .name == "Build and audit (publication layer)") and (.conclusion != "success" and .conclusion != "skipped" and .conclusion != null))] | length' \
            <<<"$jobs_json")
          if [ "$passed" -ne 1 ] || [ "$failed" -ne 0 ]; then
            echo "The triggering run has no unique successful certifying lane." >&2
            jq -r '.jobs[] | [.name, .status, (.conclusion // "")] | @tsv' \
              <<<"$jobs_json" >&2
            exit 1
          fi

      - name: Check out the exact certified commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Refresh main and verified
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/heads/verified:refs/remotes/origin/verified'

      - name: Calibrate and advance
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/advance_verified_branch.py self-test
          python3 scripts/advance_verified_branch.py advance \
            --certified-ref '${{ github.event.workflow_run.head_sha }}' \
            --main-ref refs/remotes/origin/main \
            --verified-ref refs/remotes/origin/verified \
            --remote origin
