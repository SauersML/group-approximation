# Why this workflow exists at all.
#
# `prover.yml` keys its concurrency group on `github.run_id`, so every group is
# a singleton and GitHub never supersedes anything.  That is deliberate and
# must stay: GitHub retains at most one *pending* run per group, a
# reusable-workflow caller flaps back to `queued` between its foundation and
# shard jobs, and on 2026-08-15 that combination cancelled a push run
# mid-kernel-re-check.  A half-computed certificate must never be collectable
# by the control plane.
#
# The cost of that choice is that the queue is never deduplicated either.
# Superseded runs are dismissed by the `gate` job instead -- but a job needs a
# runner to say "cancel me", and GitHub's canceller needs none.  Measured
# 2026-08-17: pushes landing every ~45s against a twenty-job account pool
# shared with the `gam` repository left 37 queued prover runs and 29 queued
# root-import runs; a ten-second job waited 37 minutes for a slot, so the
# newest-wins decision arrived roughly thirty pushes late and the queue grew
# faster than the gate could drain it.  `verified` sat 93 commits and four
# hours behind main.
#
# So the reaping is hoisted here, into a workflow that CAN be superseded for
# free, and that makes the decision once for the whole backlog instead of once
# per queued run.  This does not replace the gate's own newest-wins logic --
# that stays as the fail-closed path -- it just arrives on time.
name: Reap superseded prover runs

# Three ways in, because a push-only reaper is silent exactly when it is needed.
#
# `push` is the original trigger and stays. Its weakness is structural: GitHub
# keeps at most one PENDING run per concurrency group, so during the bursts that
# create the backlog most reapers are collected before reaching a runner --
# measured 2026-08-19, 27 of the last 30 reaper runs `cancelled`, one executed.
#
# `workflow_run` is the targeted one. The backlog only ever HURTS at one moment:
# when a certificate goes green and `verified-promote` needs a runner to promote
# it. Measured that day: promotion sat `queued` 17 minutes behind the prover
# backlog and again 9 minutes on the next certificate, both times landing only
# after the queue was reaped by hand. Firing a reaper on Prover CI completion
# puts the cleanup exactly there. The job's `if` below keeps it to genuinely
# green runs, and a skipped job costs no runner, so the other completions -- the
# cancelled ones, which are the majority -- are free.
#
# `schedule` is the floor, so a quiet period still drains a backlog that the
# last burst left behind, with no push to carry it.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Lean Prover CI"]
    types: [completed]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

# One reaper at a time, and it must be allowed to FINISH.
#
# `cancel-in-progress: true` looks right here -- a reaper holds no certificate,
# so killing one costs nothing -- and it is wrong for one reason: runner
# acquisition on this account takes minutes while pushes arrive every ~45s, so
# every reaper was superseded before it ever reached a runner.  Measured on the
# first deploy of this workflow: eleven consecutive reapers cancelled, zero
# executions.  It was starved by precisely the pathology it exists to fix.
#
# `false` keeps at most one running plus one pending -- still bounded, still
# deduplicated by the control plane -- but the running one is never collected,
# so the reaping actually happens.  A slightly stale reaper costs nothing
# because it recomputes the newest queued run itself when it starts.
#
# THE GROUP IS SPLIT BY EVENT, and one shared group was not enough.  Adding the
# `workflow_run` trigger above was not sufficient on its own: measured
# 2026-08-19, the reaper fired on a genuinely green certificate and was
# `cancelled` before reaching a runner, because a shared group retains only one
# PENDING run and the push reapers arriving every ~45s kept displacing it.  The
# rare high-value reaper lost its slot to the frequent low-value ones, and
# promotion sat `queued` behind the backlog it was meant to clear.
#
# So the two classes get different treatment, which is the whole point:
#
#   `workflow_run` / `workflow_dispatch` -- rare and deliberate.  A green
#   certificate happens a few times an hour at most, and a dispatch is someone
#   asking for this specific thing.  Keying on `github.run_id` makes each one a
#   singleton nothing can collect, so it always gets its runner.  Bounded by how
#   rarely certificates go green, not by how often anyone pushes.
#
#   `push` / `schedule` -- frequent and interchangeable.  These keep sharing one
#   group and stay deduplicated exactly as before; a burst must not translate
#   into a burst of reapers, and a stale one costs nothing.
concurrency:
  group: prover-reaper-${{ (github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch') && github.run_id || 'burst' }}
  cancel-in-progress: false

permissions:
  actions: write

jobs:
  reap:
    name: Dismiss prover runs parked at the gate
    # On `workflow_run`, reap only behind a run that actually certified
    # something: that is the moment `verified-promote` is about to need a
    # runner. Every other completion -- overwhelmingly cancellations -- skips
    # here, and a skipped job never takes a runner, so the extra trigger adds
    # queue pressure only when it is buying something. Other events are
    # unaffected and reap as before.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel queued push runs that a newer commit has superseded
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          runs=$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/prover.yml/runs" \
            -f per_page=100 -f status=queued \
            --jq '[.workflow_runs[]
                    | select(.event == "push")
                    | {id, sha: .head_sha, created: .created_at}]
                  | sort_by(.created) | reverse')

          total=$(jq 'length' <<<"$runs")
          echo "queued push runs: $total"
          if [ "$total" -le 1 ]; then
            echo "Nothing is superseded; leaving the queue alone."
            exit 0
          fi

          # The newest queued run is the one that should verify the tip, so it
          # is never a candidate.  The hourly `schedule` tick is load-bearing
          # for commits that no push run of their own ever certifies, so
          # scheduled runs are excluded above and never reaped.
          newest=$(jq -r '.[0].id' <<<"$runs")
          echo "keeping newest queued run: $newest"

          reaped=0
          for id in $(jq -r '.[1:][].id' <<<"$runs"); do
            # THE SAFETY PREDICATE.  Reap only a run in which nothing has
            # happened yet: every job still `queued`, none started, none
            # concluded.  Such a run is parked at the gate having computed
            # nothing, and its own gate would dismiss it anyway on reaching a
            # runner.
            #
            # This is what keeps the reaper away from a run that HOLDS THE
            # BUILD MUTEX.  A reusable-workflow caller reports `queued` at the
            # run level while its expensive jobs are between stages, so
            # "queued" alone does not mean idle -- but such a run always has
            # at least one concluded job (its gate, at minimum).  Requiring
            # every job to be untouched excludes it, and with it every
            # partially computed certificate.
            #
            # Fail closed: any API error, empty listing, or unreadable state
            # leaves the run alone.  Skipping a reapable run costs one runner
            # slot; reaping a builder costs a dozen runner-hours and a
            # certificate.
            jobs_json=$(gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/jobs" \
              -f per_page=100 2>/dev/null || echo '')
            if [ -z "$jobs_json" ]; then
              echo "  $id: job listing unavailable; leaving it alone"
              continue
            fi
            # Judge by `status` and `conclusion` only.  `started_at` is NOT a
            # usable signal: GitHub stamps it on a job that is merely queued
            # (observed 2026-08-17, a gate job reporting
            # `queued` with `started_at` equal to its run's creation time), so
            # testing it would make this predicate false for every run and the
            # reaper a silent no-op.
            idle=$(jq '(.jobs | length) > 0
                       and ([.jobs[]
                             | select(.status != "queued"
                                      or .conclusion != null)] | length) == 0' \
              <<<"$jobs_json" 2>/dev/null || echo false)
            if [ "$idle" != "true" ]; then
              echo "  $id: has started work; leaving it alone"
              continue
            fi
            if gh api -X POST \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/cancel" \
              --silent 2>/dev/null; then
              echo "  $id: reaped"
              reaped=$((reaped+1))
            else
              echo "  $id: cancel refused; leaving it alone"
            fi
          done
          echo "reaped $reaped of $((total-1)) superseded runs"
