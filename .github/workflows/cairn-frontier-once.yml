name: Cairn frontier one-shot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cairn-frontier-once.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Validate and regenerate Cairn
        run: bin/cairn check
      - name: Commit generated frontier and remove this one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/FRONTIER.md
          git rm .github/workflows/cairn-frontier-once.yml
          git commit -m 'Cairn: regenerate frontier after radical renormalization'
          git push origin HEAD:main
