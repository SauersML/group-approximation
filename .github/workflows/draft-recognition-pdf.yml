# Fast, ungated freshness path for the recognition-paper PDF, mirroring
# draft-non-mf-pdf.yml: every tex push recompiles and commits the PDF as a
# DRAFT, and a quarter-hour catch-up rebuilds whenever the committed PDF
# predates the tex.  The compile refuses undefined references, so a broken
# tex never replaces a working PDF.
#
# This paper carries a TikZ figure under DocumentMetadata tagging; the
# pinned image's lualatex is untested on that combination, while pdflatex
# passes the maintainers' compile probe, so this workflow compiles with
# pdflatex and lets qpdf set the PDF version.
name: Draft recognition PDF

on:
  push:
    branches: [main]
    paths:
      - 'mf_recognition_complexity.tex'
      - '.github/workflows/draft-recognition-pdf.yml'
      - 'scripts/publish_pdf_commit.py'
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

concurrency:
  group: draft-recognition-pdf
  cancel-in-progress: false

permissions:
  contents: write

env:
  TEX_FILE: mf_recognition_complexity.tex
  PDF_FILE: mf_recognition_complexity.pdf
  TEXLIVE_IMAGE: ghcr.io/xu-cheng/texlive-alpine@sha256:556e2e2caa7d489ce155de0eb3f43e324e6502ed4e9871aa400662b156cf00ad

jobs:
  draft:
    name: Compile and publish the recognition PDF
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Decide whether the PDF is stale
        id: gate
        run: |
          set -euo pipefail
          tex_commit="$(git rev-list -1 HEAD -- "$TEX_FILE")"
          pdf_commit="$(git rev-list -1 HEAD -- "$PDF_FILE" || true)"
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$pdf_commit" ] && \
               git merge-base --is-ancestor "$tex_commit" "$pdf_commit"; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install PDF tools
        if: steps.gate.outputs.build == 'true'
        run: |
          retry='-o Acquire::Retries=5 -o Acquire::http::Timeout=30'
          sudo apt-get $retry update
          sudo apt-get $retry install --yes --no-install-recommends qpdf
          docker pull "$TEXLIVE_IMAGE"

      - name: Compile in pinned TeX Live
        if: steps.gate.outputs.build == 'true'
        run: |
          mkdir -p build
          source_epoch="$(git log -1 --format=%ct -- "$TEX_FILE")"
          docker run --rm \
            -e SOURCE_DATE_EPOCH="$source_epoch" \
            -e FORCE_SOURCE_DATE=1 -e TZ=UTC \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            "$TEXLIVE_IMAGE" \
            latexmk -pdf -outdir=build -interaction=nonstopmode \
              -halt-on-error -file-line-error "$TEX_FILE"

      - name: Refuse unresolved references
        if: steps.gate.outputs.build == 'true'
        run: |
          log_file="build/${TEX_FILE%.tex}.log"
          test -s "$log_file"
          if grep -Eq \
            'LaTeX Warning: (Citation .* undefined|Reference .* undefined|There were undefined references|Label\(s\) may have changed)|Rerun to get cross-references right' \
            "$log_file"; then
            echo "Unresolved references or citations; keeping the previous PDF." >&2
            exit 1
          fi

      - name: Normalize the PDF
        if: steps.gate.outputs.build == 'true'
        run: |
          qpdf --linearize --object-streams=disable --force-version=2.0 \
            --deterministic-id "build/${TEX_FILE%.tex}.pdf" "${PDF_FILE}.tmp"
          mv -- "${PDF_FILE}.tmp" "$PDF_FILE"
          qpdf --check "$PDF_FILE"

      - name: Commit and push the recognition PDF
        if: steps.gate.outputs.build == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 scripts/publish_pdf_commit.py self-test
          python3 scripts/publish_pdf_commit.py publish-draft \
            --source-sha "$(git rev-parse HEAD)" \
            --source-file "$TEX_FILE" \
            --pdf "$PDF_FILE" \
            --message "build: update recognition PDF (draft; unattested)"
