name: Lean Prover CI

on:
  schedule:
    # Hourly, off-minute: pushes already run the full pipeline, so the
    # schedule exists to catch cache eviction, environment drift, and any
    # certification gap left by a superseded or red push run.  The same-SHA
    # dedupe gate makes an already-certified tick cost seconds, so hourly
    # keeps verified fresh without adding runner contention.
    #
    # LOAD-BEARING under the gate's build mutex: commits pushed while a
    # build holds the mutex are certified by no push run of their own --
    # their gates yield.  This tick is what guarantees they are eventually
    # certified rather than merely overtaken.  Do not remove or slow it.
    - cron: '43 * * * *'
  push:
    branches: [ "main" ]
    # Fail closed like advance_verified_branch.py: every unknown path runs the
    # prover.  Only the classifier's narrow publication-only surface is
    # excluded, with verification-sensitive Markdown files re-included last.
    paths:
      - '**'
      - '!.gitignore'
      - '!CITATION.cff'
      - '!LICENSE'
      - '!README.md'
      - '!docbuild/lake-manifest.json'
      - '!docbuild/lakefile.toml'
      - '!docbuild/lean-toolchain'
      - '!non_mf_groups_exist.pdf'
      - '!official/README.md'
      - '!property_tt_leavitt.pdf'
      - '!docs/**/*.md'
      - 'metadata/CLAIM_MAP.md'
      - 'metadata/CLAIM_SIGNATURES.md'
      - 'metadata/NON_MF_CLAIM_SIGNATURES.md'
      - 'metadata/PROPERTY_TT_CLAIM_MAP.md'
      - 'metadata/PROPERTY_TT_PROVENANCE.md'
  pull_request:
    branches: [ "main" ]
    paths:
      - '**'
      - '!.gitignore'
      - '!CITATION.cff'
      - '!LICENSE'
      - '!README.md'
      - '!docbuild/lake-manifest.json'
      - '!docbuild/lakefile.toml'
      - '!docbuild/lean-toolchain'
      - '!non_mf_groups_exist.pdf'
      - '!official/README.md'
      - '!property_tt_leavitt.pdf'
      - '!docs/**/*.md'
      - 'metadata/CLAIM_MAP.md'
      - 'metadata/CLAIM_SIGNATURES.md'
      - 'metadata/NON_MF_CLAIM_SIGNATURES.md'
      - 'metadata/PROPERTY_TT_CLAIM_MAP.md'
      - 'metadata/PROPERTY_TT_PROVENANCE.md'
  workflow_dispatch:

concurrency:
  # GitHub retains at most ONE pending run per concurrency group, and a
  # reusable-workflow caller flaps back to the queued state between its
  # foundation and shard jobs.  Two same-SHA runs sharing a group therefore
  # cancel each other even with cancel-in-progress disabled (observed
  # 2026-08-15: a scheduled run silently cancelled the same-SHA push run
  # mid-kernel-re-check, in-progress jobs included).  Groups are unique per
  # run so GitHub can never cancel a partially completed certificate;
  # redundant same-SHA work is deduplicated by the fail-closed gate below.
  group: lean-prover-${{ github.sha }}-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    name: Decide whether the exact proof tree needs verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Listing in-flight runs for the same-SHA schedule dedupe below, and
      # self-cancelling superseded push runs in the newest-wins check.
      actions: write
    outputs:
      run: ${{ steps.check.outputs.run }}
      lean: ${{ steps.check.outputs.lean }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "push" ] && \
             [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Event ${{ github.event_name }} runs at its requested SHA."
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "lean=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "schedule" ]; then
            # The schedule exists to catch cache eviction and drift, not to
            # duplicate a certificate another run is already computing.  With
            # per-run concurrency groups nothing can cancel that run, so
            # skipping is safe: if it fails, the next push or cron tick
            # retries this tree.  Fail closed: an API error keeps run=true.
            #
            # It must yield only to a run that is ACTUALLY COMPUTING the
            # certificate -- one whose gate has already concluded success --
            # and never to a merely queued run.  This is the same livelock the
            # push branch below was fixed for, and until now the schedule
            # branch still had it: a queued same-SHA push run made this tick
            # cancel, and that push run's own gate then yielded to the build
            # mutex in turn, so neither certified anything.  Measured
            # 2026-08-17: six consecutive scheduled runs cancelled, every one
            # of them, back to 07:36 -- the hourly tick that this file calls
            # load-bearing had not certified a tree all day, which is exactly
            # the gap it exists to close for commits overtaken by the mutex.
            inflight=0
            for rid in $(gh api \
              "repos/${{ github.repository }}/actions/workflows/prover.yml/runs?head_sha=${{ github.sha }}&per_page=100" \
              --jq '.workflow_runs[]
                      | select(.id != ${{ github.run_id }})
                      | select(.status == "queued" or .status == "in_progress")
                      | .id' 2>/dev/null || true); do
              if [ "$(gh api \
                "repos/${{ github.repository }}/actions/runs/${rid}/jobs?per_page=50" \
                --jq '[.jobs[]
                        | select(.name | startswith("Decide whether"))
                        | select(.conclusion == "success")] | length' \
                2>/dev/null || echo 0)" -gt 0 ]; then
                # Note the direction on failure: an unreadable job listing
                # counts as NOT a builder, so this tick proceeds and builds.
                # That is the file's existing fail-closed choice -- duplicating
                # a certificate wastes compute, while declining to compute one
                # is how a tree ends up certified by nothing.
                echo "Run $rid is already computing this exact tree."
                inflight=$((inflight+1))
              fi
            done
            if [ "${inflight:-0}" -gt 0 ]; then
              # Cancel rather than skip.  A run that certifies nothing must
              # not conclude `success`: the promotion workflow triggers on
              # every successful run of this workflow, and a success with
              # both certifying lanes skipped makes it fail its
              # certifying-lane check.  For two days every `success` on this
              # workflow was a scheduled run that took this branch, which is
              # why a red kernel audit could sit behind a wall of green run
              # badges.  A cancelled run is ignored by promotion and says
              # what actually happened.
              echo "Another run is already verifying this exact proof tree; cancelling."
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "lean=false" >> "$GITHUB_OUTPUT"
              gh api -X POST \
                "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel" \
                || true
              exit 0
            fi
          fi

          git fetch --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/heads/verified:refs/remotes/origin/verified'

          target='${{ github.sha }}'
          main=$(git rev-parse refs/remotes/origin/main)
          verified=$(git rev-parse refs/remotes/origin/verified)

          # Build mutex.  A prover run "holds the mutex" once its gate job
          # has concluded success while the run itself is still queued or in
          # progress: its expensive certifying jobs are under way (callers of
          # reusable workflows flap back to `queued` between jobs, so queued
          # runs count too).  A superseded gate yields ONLY to a mutex
          # holder -- never to a merely queued run, whose own gate may yield
          # in turn.  Yielding to queued runs is the livelock that starved
          # certification: under sustained pushes every gate that finally
          # reached a runner found a newer queued run and cancelled itself,
          # so at any push cadence faster than gate latency NOTHING ever
          # built.  With the mutex, whichever gate reaches a runner first
          # while nothing is building proceeds -- even if superseded -- and
          # every completed build promotes its own head_sha; promotion treats
          # an older certified SHA as a no-op, never a rewind
          # (advance_verified_branch.choose_target), so building a superseded
          # ancestor of main can only help.  Two gates racing an empty mutex
          # can both build; that wastes compute, not soundness.  API failures
          # count as zero builders: that direction at worst duplicates work,
          # while the other direction starves certification.
          # A builder must also be building something that MATTERS.  A run whose
          # head_sha `verified` already contains cannot advance anything --
          # choose_target treats an already-certified ancestor as a no-op -- so
          # holding the mutex is all it can still do, and it does that for as
          # long as its shards run.  Observed 2026-08-17: two runs launched at
          # 05:29 and 06:24 were still replaying kernel shards at 12:40, both on
          # commits that a later run had already certified and promoted past.
          # They were nine hours from their own timeouts, they could promote
          # nothing, and every push run in that window dismissed itself in their
          # favour, so 93 commits and 11k lines of new Lean had no certificate in
          # flight at all.  A worthless certificate must not be able to starve a
          # needed one.
          #
          # Fail closed in the direction that preserves the mutex: only a
          # SUCCESSFUL ancestry test disqualifies a builder.  A missing commit or
          # a git error leaves the run counted, which is the behaviour that has
          # always been safe here.
          count_builders() {
            local n=0 entry rid sha gate_ok
            # The window matters, and it used to be 50.  Run creation here can
            # exceed sixty an hour under a push burst, so a builder three hours
            # into its shards falls off the first page and stops counting --
            # after which fresh gates see an empty mutex and start rival full
            # builds that compete with it for the same twenty-job pool.  That is
            # how a needed certificate loses its runners to duplicates of
            # itself.  Widening the window is only safe together with the
            # ancestry test below, which is what keeps long-dead runs from
            # holding the mutex once they are visible again.
            for entry in $(gh api \
              "repos/${{ github.repository }}/actions/workflows/prover.yml/runs?per_page=100" \
              --jq '.workflow_runs[]
                      | select(.id != ${{ github.run_id }})
                      | select(.event == "push" or .event == "schedule"
                               or .event == "workflow_dispatch")
                      | select(.status == "queued" or .status == "in_progress")
                      | "\(.id):\(.head_sha)"' 2>/dev/null || true); do
              rid="${entry%%:*}"
              sha="${entry#*:}"
              if git merge-base --is-ancestor "$sha" "$verified" 2>/dev/null; then
                echo "Run $rid is certifying $sha, which verified already contains; it is not a builder."
                continue
              fi
              gate_ok=$(gh api \
                "repos/${{ github.repository }}/actions/runs/${rid}/jobs?per_page=50" \
                --jq '[.jobs[]
                        | select(.name | startswith("Decide whether"))
                        | select(.conclusion == "success")] | length' \
                2>/dev/null || echo 0)
              if [ "${gate_ok:-0}" -gt 0 ]; then n=$((n+1)); fi
            done
            echo "$n"
          }

          # Superseded push.  A full certificate run costs a dozen
          # runner-hours, so a superseded push should not START one while a
          # certificate is already being computed, and need not run at all if
          # the newer head is already green.  But a superseded push whose
          # gate finds the mutex EMPTY must build: its certificate advances
          # verified to its own commit, and cancelling it in favour of a
          # merely queued newer run is the livelock described above.  A run
          # that has started its expensive jobs is never touched by any of
          # this -- per-run concurrency groups see to that.
          if [ "${{ github.event_name }}" = "push" ] && [ "$target" != "$main" ]; then
            newer_green=$(gh api \
              "repos/${{ github.repository }}/actions/workflows/prover.yml/runs?head_sha=${main}&per_page=100" \
              --jq '[.workflow_runs[]
                      | select(.conclusion == "success")
                    ] | length' || echo 0)
            if [ "${newer_green:-0}" -gt 0 ]; then
              echo "Superseded by $main, which already has a green prover run; cancelling."
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "lean=false" >> "$GITHUB_OUTPUT"
              gh api -X POST \
                "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel" \
                || true
              exit 0
            fi
            if [ "$(count_builders)" -gt 0 ]; then
              echo "Superseded by $main and a certificate is already being computed; yielding to the build mutex (the hourly tick covers anything overtaken)."
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "lean=false" >> "$GITHUB_OUTPUT"
              gh api -X POST \
                "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel" \
                || true
              exit 0
            fi
            echo "Superseded by $main, but no certificate is in flight; verifying this tree anyway (an older certified SHA is a promotion no-op, so this can only advance verified)."
          fi

          # Current-tip push.  The mutex above is reached only by a SUPERSEDED
          # push, so a push that is still the tip used to start a full
          # certificate unconditionally -- and since a certificate takes ~3.5h
          # while pushes here arrive minutes apart, every push that cleared its
          # gate while still the tip added another concurrent certificate.
          # Observed 2026-08-17: two full certificates building at once, each
          # wanting eight P13 shards and then five kernel shards out of an
          # account pool of twenty that another repository routinely holds
          # thirteen of.  They do not run faster together; they interleave and
          # BOTH finish late, which delays the promotion of verified rather than
          # advancing it.  Fixing the queue made this worse, not better: gates
          # now reach runners promptly, so more of them get far enough to start
          # a rival build.
          #
          # One certificate at a time is therefore the faster policy, not the
          # more cautious one.  Throughput is unchanged -- the pool is the
          # bottleneck either way -- but the in-flight certificate finishes in
          # its true wall time and promotes, instead of two finishing at twice
          # that.
          #
          # The cost is bounded and paid by design: a tip push that yields is
          # certified by the hourly tick once the mutex clears, which is the
          # mechanism that already covers every commit overtaken by a build, and
          # which now yields only to real builders.  Yielding is still only ever
          # to a run whose gate has CONCLUDED -- never to a merely queued run,
          # which is the livelock documented above -- and a zombie certifying an
          # ancestor of verified is not a builder, so neither can park the queue.
          if [ "${{ github.event_name }}" = "push" ] && [ "$target" = "$main" ]; then
            if [ "$(count_builders)" -gt 0 ]; then
              echo "This tree is the tip, but a certificate is already being computed; yielding to the build mutex so it finishes on time (the hourly tick certifies this tip once the mutex clears)."
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "lean=false" >> "$GITHUB_OUTPUT"
              gh api -X POST \
                "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel" \
                || true
              exit 0
            fi
          fi

          # Lane classifier.  The fresh kernel verdict, the compiled tree,
          # and every Lean-side gate are functions of the paths below.  A
          # push that leaves all of them byte-identical to the certified
          # revision inherits the standing Lean verdict and is certified by
          # the pure publication-layer job; anything else -- including any
          # change to control code or to the committed signature and roster
          # artifacts -- takes the full lane.  Unknown states fail closed.
          if git diff --quiet "$verified" "$target" -- \
              GroupApproximation.lean GroupApproximation \
              lakefile.toml lake-manifest.json lean-toolchain \
              scripts .github bin \
              metadata/CLAIM_DECLS.txt metadata/CLAIM_MAP.md \
              metadata/CLAIM_SIGNATURES.md metadata/NON_MF_CLAIM_DECLS.txt \
              metadata/NON_MF_CLAIM_SIGNATURES.md \
              metadata/PROPERTY_TT_CLAIM_MAP.md \
              metadata/PROPERTY_TT_PROVENANCE.md 2>/dev/null; then
            echo "lean=false" >> "$GITHUB_OUTPUT"
            echo "Lean-relevant tree identical to verified; publication lane."
          else
            echo "lean=true" >> "$GITHUB_OUTPUT"
          fi

          # Every remaining `run=false` below cancels for the reason spelled
          # out at the schedule dedupe above: a run that certifies nothing must
          # not conclude `success`.  The dedupe branch was fixed on 2026-08-16
          # and these three were not, so the defect survived one branch over --
          # on 2026-08-17 run 32016760517 concluded `success` on `12497c2d`
          # with the gate green and BOTH certifying lanes skipped, which is the
          # false-green badge that comment describes, and it also fires the
          # promotion workflow only for its certifying-lane check to fail.
          if git merge-base --is-ancestor "$target" "$verified"; then
            echo "Requested proof tree is already contained in verified; cancelling."
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "lean=false" >> "$GITHUB_OUTPUT"
            gh api -X POST \
              "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel" \
              || true
            exit 0
          fi
          if ! git merge-base --is-ancestor "$verified" "$target"; then
            echo "verified and the requested proof tree diverge; verifying explicitly."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A not-yet-certified classifier or workflow must not decide that its
          # own commit can skip verification.  The first full green run
          # certifies the new control plane; later equivalent runs may use it.
          if ! git diff --quiet "$verified" "$target" -- \
            scripts/advance_verified_branch.py \
            scripts/p13_build_shards.py \
            .github/workflows/prover.yml \
            .github/workflows/p13-sharded-build.yml \
            .github/workflows/verified-fast-forward.yml \
            .github/workflows/verified-promote.yml; then
            echo "Verification control code differs from verified; running."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 scripts/advance_verified_branch.py self-test

          if ! git merge-base --is-ancestor "$target" "$main"; then
            echo "Requested SHA $target is not an ancestor of main; verifying it explicitly."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$target" != "$main" ]; then
            set +e
            python3 scripts/advance_verified_branch.py compare "$target" "$main"
            newer_delta=$?
            set -e
            case "$newer_delta" in
              0)
                echo "Later commits are publication-only; this SHA certifies their proof tree."
                echo "run=true" >> "$GITHUB_OUTPUT"
                ;;
              1)
                if [ "$(count_builders)" -gt 0 ]; then
                  echo "A newer verification-relevant proof tree exists and a certificate is already being computed; cancelling this SHA."
                  echo "run=false" >> "$GITHUB_OUTPUT"
                  echo "lean=false" >> "$GITHUB_OUTPUT"
                  gh api -X POST \
                    "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel" \
                    || true
                else
                  echo "A newer verification-relevant proof tree exists but nothing is building; certifying this SHA (the newer tree's own gate will yield to this build, and the hourly tick covers it)."
                  echo "run=true" >> "$GITHUB_OUTPUT"
                fi
                ;;
              *)
                echo "Proof-tree comparison failed with status $newer_delta." >&2
                exit "$newer_delta"
                ;;
            esac
            exit 0
          fi

          set +e
          python3 scripts/advance_verified_branch.py compare "$verified" "$target"
          verified_delta=$?
          set -e
          case "$verified_delta" in
            0)
              echo "The current verification-relevant tree is already certified; cancelling."
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "lean=false" >> "$GITHUB_OUTPUT"
              gh api -X POST \
                "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel" \
                || true
              ;;
            1)
              echo "The current proof tree differs from verified; running."
              echo "run=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Verified-tree comparison failed with status $verified_delta." >&2
              exit "$verified_delta"
              ;;
          esac

  p13:
    needs: gate
    if: ${{ needs.gate.outputs.run == 'true' }}
    uses: ./.github/workflows/p13-sharded-build.yml

  prove:
    name: Build and audit
    needs: [gate, p13]
    if: ${{ needs.gate.outputs.run == 'true' && needs.gate.outputs.lean == 'true' }}
    runs-on: ubuntu-latest
    # A few hundred modules of analysis on top of Mathlib.  A cold first build
    # can run for hours; every run saves whatever it compiled (see the
    # cache-save steps), so even a run that hits this ceiling leaves the next
    # one strictly warmer.
    timeout-minutes: 340

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Cache Lean toolchain
        id: elan-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.elan
          key: ${{ runner.os }}-elan-${{ hashFiles('lean-toolchain') }}

      - name: Install elan
        if: steps.elan-cache.outputs.cache-hit != 'true'
        run: curl https://raw.githubusercontent.com/leanprover/elan/464c9d28395000a2a0128e07081e4956d50eced2/elan-init.sh -sSf | sh -s -- -y

      - name: Add elan to PATH
        run: echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # WARM START, part 1: dependencies.
      #
      # STABLE key, deliberately different from the build cache below: the
      # dependency tree is COMPLETE the moment `lake exe cache get` finishes
      # and is a function of the manifest alone, so the partial-entry hazard
      # that forces the build cache onto unique keys does not exist here.  A
      # stable key gives an exact hit on every unchanged-manifest run, which
      # turns the ~5GB save step below into a no-op instead of a per-run
      # upload.
      - name: Restore Lake dependencies
        id: lake-deps-restore
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .lake/packages
          key: ${{ runner.os }}-lake-deps-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            ${{ runner.os }}-lake-deps-

      # WARM START, part 2: this project's own oleans.
      #
      # Keyed on the sources so an unchanged tree is an exact hit, with the
      # prefix fallback carrying the previous run's build forward when sources
      # did change.  Lake's own hashing decides what is actually reusable; a
      # stale olean is rebuilt, never trusted.
      - name: Restore compiled project
        id: build-restore
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .lake/build
          key: ${{ runner.os }}-nonsofic-build-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml', 'GroupApproximation.lean', 'GroupApproximation/**/*.lean') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-nonsofic-build-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml', 'GroupApproximation.lean', 'GroupApproximation/**/*.lean') }}-
            ${{ runner.os }}-nonsofic-build-

      # The archives `lake exe cache get` downloads live in ~/.cache/mathlib
      # and are a pure function of the manifest.  Caching them turns the fetch
      # step below into a local unpack instead of a multi-GB download whenever
      # the .lake/packages cache above missed -- the first run after a
      # manifest bump, or an eviction.  actions/cache saves automatically at
      # job end only when the key was a miss, so warm runs upload nothing.
      - name: Cache Mathlib olean archives
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/mathlib
          key: ${{ runner.os }}-mathlib-archives-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      # Mathlib's own oleans, from the upstream build cache.  This is what makes
      # the very first run warm rather than a from-scratch Mathlib compile:
      # without it the toolchain would rebuild Mathlib itself, which alone
      # exceeds this job's timeout.  Run unconditionally and let it no-op when
      # the dependency cache already had everything.
      - name: Fetch precompiled Mathlib
        run: lake exe cache get

      - name: Download the bounded P13 build
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: p13-*-${{ github.sha }}
          path: build/p13-prebuild

      - name: Restore and seal the P13 build
        run: |
          python3 scripts/p13_build_shards.py restore-all \
            --directory build/p13-prebuild
          python3 scripts/p13_build_shards.py seal

      # Saved BEFORE the long build, so a build that times out or fails still
      # leaves the (expensive, ~5GB unpacked) Mathlib oleans cached for the
      # next run.  The dependency tree is complete at this point; nothing the
      # build does improves it.
      - name: Save Lake dependencies
        if: always() && steps.lake-deps-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .lake/packages
          key: ${{ steps.lake-deps-restore.outputs.cache-primary-key }}

      # The source scan is CALIBRATED before it is believed, exactly as gnomon
      # calibrates its laundering detector before reading its verdict: a
      # detector that reports nothing is indistinguishable from a clean corpus,
      # so its silence is not evidence until both directions are asserted --
      # every planted defect reported under its own tag, and a clean tree
      # silent.  This step also fails if the calibration is deleted.
      - name: Calibrate the source scan
        run: |
          python3 scripts/check.py --self-test
          python3 scripts/test_claim_map.py
          python3 scripts/check_non_mf_refs.py --self-test
          python3 scripts/check_non_mf_claim_manifest.py --self-test

      # The finite P13 tables are committed Lean source, but their discovery
      # inputs and emitters are committed too.  Regenerate into a temporary
      # directory and compare before Lean sees the certificate, so neither a
      # stale generator nor hand-edited generated data can pass unnoticed.
      - name: Install the pinned P13 generator runtime
        run: python3 -m pip install --disable-pip-version-check --no-deps numpy==2.3.2

      - name: Replay the exact P13 source generators
        run: >-
          python3 scripts/check_p13_generated.py
          --temporary-root "$RUNNER_TEMP/p13-generated"

      # Source text: forbidden constructs, and the root import closure.  Runs
      # before the build because it is instant, and because the orphan-module
      # check is the one finding a green build actively conceals: `lake build`
      # compiles the root's import closure, so a module nothing imports is
      # never compiled and never audited.
      #
      # `continue-on-error` is NOT tolerance -- the "Zero-tolerance verdict"
      # step at the end of this job fails the run on this step's outcome, and
      # deleting that step turns the gate off loudly rather than quietly.  It
      # is here because the two scans see different things (source text vs.
      # kernel environment) and a first failure that hides the second costs a
      # multi-hour build to learn the other half.  One red run should name
      # every finding in the repository, not the first one alphabetically.
      - name: Source scan [outcome masked -- read the verdict]
        id: source-scan
        continue-on-error: true
        run: |
          python3 scripts/check.py
          # cairn check validates the research graph; the regenerated
          # FRONTIER.md is not diffed because it embeds lock countdowns
          # and mtime-derived sections that are time-dependent by design.
          bin/cairn check

      # The non-MF paper has its own generated roster and numbered-claim
      # manifest.  Every visible badge is exact, and the two load-bearing
      # literal endpoints below are required explicitly: the unconditional
      # eight-generator counterexample and the unconditional property-(T)
      # theorem for its literal base presentation.
      - name: Non-MF counterpart contract [outcome masked -- read the verdict]
        id: non-mf-contract
        continue-on-error: true
        run: |
          python3 scripts/check_non_mf_zero_input.py \
            --tex non_mf_groups_exist.tex
          python3 scripts/regenerate_non_mf_claim_manifest.py \
            --output /tmp/NON_MF_NUMBERED_CLAIMS.generated.json
          diff -u metadata/NON_MF_NUMBERED_CLAIMS.json \
            /tmp/NON_MF_NUMBERED_CLAIMS.generated.json
          python3 scripts/check_non_mf_refs.py \
            --tex non_mf_groups_exist.tex \
            --check-decls \
            --extra-declarations-from metadata/NON_MF_NUMBERED_CLAIMS.json \
            --require-verified \
              Sofic/LiteralNonMFEndpoint \
              GroupApproximation.LiteralNonMFEndpoint.manuscriptTheoremA \
            --require-verified \
              Sofic/LiteralNonMFEndpoint \
              GroupApproximation.LiteralNonMFEndpoint.manuscriptTheoremD \
            --require-verified \
              Sofic/LiteralBaseP13PropertyTBridge \
              GroupApproximation.LiteralBaseP13PropertyTBridge.manuscriptBaseHasKazhdanPropertyT
          python3 scripts/check_non_mf_claim_manifest.py \
            --tex non_mf_groups_exist.tex \
            --manifest metadata/NON_MF_NUMBERED_CLAIMS.json \
            --signature-roster metadata/NON_MF_CLAIM_DECLS.txt

      # The contract above certifies that every badge resolves and that every
      # cited declaration is SOURCE-CLOSED: its printed header ends at the
      # colon.  That is a fact about where the binders are typed, not about
      # what the proposition assumes, and it is being read as the latter.  This
      # step reads the proposition: a premise whose type is a corpus-defined
      # name the corpus never discharges is a conditional badge, however the
      # header is punctuated.
      #
      # It fails on any finding absent from metadata/NON_MF_UNCONDITIONAL_BASELINE.txt,
      # and on any baseline entry whose finding has gone -- so the register can
      # only shrink, and a discharged row cannot leave its exemption behind to
      # license a regression.  There is no count in the mechanism.
      #
      # REPORT-ONLY, deliberately and temporarily.  The register was written by
      # hand from metadata/NON_MF_CONDITIONAL_INVENTORY.md because it could not be
      # generated locally, so its first contact with the real corpus must not
      # be able to fail a certificate run.  TO ARM, after one run whose log
      # shows this step green:
      #
      #   1. move the `--self-test` line into "Calibrate the source scan"
      #      above, where every other calibration lives;
      #   2. delete the `continue-on-error: true` line below;
      #   3. add a clause to "Zero-tolerance verdict" reading this step's
      #      outcome, in the same four-line shape as the three already there:
      #      bind `unc` to the steps.non-mf-unconditional.outcome expression,
      #      and set `failed=1` unless it is `success`.
      #
      # If the first run is red here, the message names the exact line of the
      # register to add or delete; it is a transcription fix, not mathematics,
      # and it blocks nobody's lane.
      - name: Non-MF unconditionality (report-only until the register is confirmed)
        id: non-mf-unconditional
        continue-on-error: true
        run: |
          python3 scripts/check_non_mf_unconditional.py --self-test
          python3 scripts/check_non_mf_unconditional.py \
            --tex non_mf_groups_exist.tex \
            --baseline metadata/NON_MF_UNCONDITIONAL_BASELINE.txt

      # The build itself.  `lakefile.toml` sets `-DwarningAsError=true` for the
      # library, so an unused variable or a deprecated lemma is a failure here.
      - name: Build project
        id: build-project
        # The large P13 leaves were built three blocks at a time in 12 bounded
        # shards and sealed above.  The ordinary root build can now schedule
        # the remaining modules without exposing those 144 leaves together.
        run: lake build

      # The detector library, built separately so a deprecation warning in the
      # instrumentation can never take the corpus build down with it.
      - name: Build the audit library
        run: lake build Audit

      # CALIBRATION BEFORE VERDICT, the third time in this file.  The scans in
      # Audit.Scan report nothing on a clean corpus, and a scan that reports
      # nothing because it is broken looks exactly the same.  Audit.Plants
      # carries thirteen planted defects that must each be reported under their
      # own tag, six shapes that must NOT be reported under a named tag (one
      # row per false positive a real run emitted), and four clean
      # declarations that must be reported by nothing.
      # Needs no Mathlib and no corpus, so it still runs when the library does
      # not build -- which is when a broken detector is most likely to be
      # blamed on the corpus.
      - name: Calibrate the environment scans
        run: lake env lean scripts/Calibrate.lean

      # Saved with `always()` so a run that dies partway through still banks the
      # modules it did compile.  This is the mechanism that lets a build too
      # long for one job converge over consecutive runs instead of restarting
      # from zero each time.
      # Every run writes a unique cache key.  A same-source restore can still
      # be a partial snapshot from an earlier failed run, so it must not be
      # mistaken for a complete exact hit and suppress the newer checkpoint.
      - name: Save compiled project
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .lake/build
          key: ${{ steps.build-restore.outputs.cache-primary-key }}

      # A successful `lake build` says every module elaborates.  It says nothing
      # about what the proof terms rest on.  This step pins the statements of
      # the four public theorems and walks the transitive axiom closure of the
      # whole namespace through the kernel environment, rejecting anything
      # outside `propext` / `Classical.choice` / `Quot.sound`.  Without it,
      # "0 sorries" is a grep result rather than a fact about the proof.
      #
      # `continue-on-error` for the same reason as the source scan, and with
      # the same backstop: the verdict step below reads this outcome.
      - name: Kernel audit [outcome masked -- read the verdict]
        id: kernel-audit
        continue-on-error: true
        run: lake env lean scripts/Audit.lean

      # The name-level claim map says each mapped declaration exists; this
      # step pins what each one *states*.  It regenerates the elaborated
      # signatures of every mapped declaration and fails if either committed
      # signature snapshot differs -- so a mapped theorem
      # cannot lose a conclusion or gain a hypothesis without a red run and a
      # reviewed diff of the signature files.
      - name: Signature pinning (elaborated types of mapped declarations)
        run: |
          if grep -q '^PLACEHOLDER:' metadata/CLAIM_SIGNATURES.md; then
            # Not yet populated by a first build; generate for the log but do
            # not gate until a real signature file is committed.
            lake env lean scripts/Signatures.lean
            echo "::warning::metadata/CLAIM_SIGNATURES.md is a placeholder; commit the generated file to arm this gate"
          elif [ ! -s metadata/NON_MF_CLAIM_SIGNATURES.md ]; then
            echo "::error::metadata/NON_MF_CLAIM_SIGNATURES.md is missing; generate it with 'lake env lean scripts/Signatures.lean' and commit it"
            exit 1
          else
            lake env lean scripts/Signatures.lean
            git diff --exit-code \
              metadata/CLAIM_SIGNATURES.md metadata/NON_MF_CLAIM_SIGNATURES.md \
              || { echo "::error::a claim signature snapshot is stale; regenerate with 'lake env lean scripts/Signatures.lean' and commit the diff"; exit 1; }
          fi

      # The fresh kernel re-check certifies the compiled proof tree.  Its
      # verdict is a function of the Lean-relevant tree only: the sources,
      # toolchain pin, lock file, and scripts.  When that tree is
      # byte-identical to the one already certified on `verified`, the
      # standing verdict applies and replaying it buys nothing; every gate a
      # manuscript or docs change can affect (source scan, manifest
      # contract, statement pins, signature snapshots, kernel audit) still
      # runs above.  A run that changes any Lean-relevant path -- or any
      # verification control code, which the decide gate forces through a
      # full run -- always re-checks freshly.
      # The fresh kernel re-check itself now runs in the parallel `kernel`
      # matrix job below, which restores this job's saved build cache and
      # replays disjoint slices of the module tree through fresh kernel
      # environments.  Promotion to `verified` requires the WHOLE run to
      # succeed, so a red shard blocks promotion exactly as the old inline
      # step did; this job's own verdict below still covers every scan.

      # THE GATE.  The scan steps above defer their verdict here so that one
      # run names every finding; this step is what makes that deferral safe.
      # There are no budgets in either scan and there is no threshold here: a
      # single finding on either side is a red run.  If this step is ever
      # removed, `continue-on-error` above silently becomes real tolerance --
      # so it is the one step in this file that must not be deleted without
      # deleting the `continue-on-error` lines with it.
      - name: Zero-tolerance verdict
        if: always()
        shell: bash
        run: |
          failed=0
          bld='${{ steps.build-project.outcome }}'
          src='${{ steps.source-scan.outcome }}'
          nonmf='${{ steps.non-mf-contract.outcome }}'
          ker='${{ steps.kernel-audit.outcome }}'
          # The run page shows this table without anyone opening a log, which
          # is the whole point: the three gates above carry
          # `continue-on-error`, so GitHub records their *conclusion* as
          # success while their *outcome* -- the value read here -- is the
          # real one.  A reader who trusts the step list, `--json jobs`, or
          # `--log-failed` sees green over red; `--log-failed` does not even
          # contain the step that failed.
          {
            echo "## Zero-tolerance verdict"
            echo
            echo "| gate | outcome |"
            echo "| --- | --- |"
            echo "| build | ${bld:-skipped} |"
            echo "| source scan | ${src:-skipped} |"
            echo "| non-MF contract | ${nonmf:-skipped} |"
            echo "| kernel audit | ${ker:-skipped} |"
            echo
            echo "These outcomes are authoritative.  The step list is not:"
            echo "the three scan steps are \`continue-on-error\`, so each"
            echo "renders green whatever it found."
          } >> "$GITHUB_STEP_SUMMARY"
          # `skipped` counts as failure: it means an earlier step died, and an
          # unrun scan is not a clean one.  A scan reading `skipped` while the
          # build reads `failure` is a broken tree, not a red gate -- a
          # different emergency, and the table above distinguishes them.
          if [ "$bld" != "success" ]; then
            echo "::error::the build did not pass (outcome: ${bld:-skipped}); every scan below it is therefore unrun, not clean"
            failed=1
          fi
          if [ "$src" != "success" ]; then
            echo "::error::source scan did not pass (outcome: ${src:-skipped}); see the 'Source scan' step"
            failed=1
          fi
          if [ "$nonmf" != "success" ]; then
            echo "::error::non-MF counterpart contract did not pass (outcome: ${nonmf:-skipped}); see the 'Non-MF counterpart contract' step"
            failed=1
          fi
          if [ "$ker" != "success" ]; then
            echo "::error::kernel audit did not pass (outcome: ${ker:-skipped}); see the 'Kernel audit' step"
            failed=1
          fi
          if [ "$failed" -ne 0 ]; then
            echo "zero tolerance: the repository is not clean."
            exit 1
          fi
          echo "zero tolerance: build, source scans, counterpart contract, and kernel audit all clean."

  kernel:
    name: Fresh kernel re-check (shard ${{ matrix.shard }})
    # The shards restore the compiled tree by exact run-keyed cache hit,
    # which exists only after `prove` saves it.  Running concurrently
    # they fell back to a stale prefix snapshot and each recompiled the
    # day's churn on a two-core runner — measured 2026-08-15: shards
    # whose slice contained freshly-changed modules spent 2h+ in the
    # combined build-and-replay step while untouched slices finished in
    # ~43m.  Waiting for `prove` costs its wall time once and turns
    # every shard into a pure kernel replay.
    needs: [gate, p13, prove]
    if: needs.gate.outputs.run == 'true' && needs.gate.outputs.lean == 'true'
    runs-on: ubuntu-latest
    # Heavy shards exceed two hours on hosted runners (observed
    # 2026-08-15: the same shard indices timed out at 120 minutes in
    # consecutive runs while three light shards finished in ~45).  A
    # kernel re-check must never be killed for slowness: completion is
    # the certificate.  The hosted-runner ceiling is six hours.
    timeout-minutes: 330
    strategy:
      fail-fast: false
      # Cap the simultaneous shard footprint so one certificate run cannot
      # saturate the twenty-runner account pool: the draft-PDF build, the
      # gates, and the site jobs must always find a free runner (observed
      # 2026-08-15: a saturated pool starved the PDF build for ten hours).
      # TWO INVARIANTS, and the first one costs certification rather than
      # time, so read it first.
      #
      # (1) The modulus in the `Fresh kernel re-check` step must equal the
      #     LENGTH of this shard list.  Raise the modulus above the list and
      #     the extra residue classes are checked by nothing at all: silent
      #     coverage loss, and the run is still green.  Lower it below the
      #     list and shards merely idle.
      # (2) The shard count must not exceed `max-parallel`.  The shards have
      #     near-equal duration, so an overflow shard does not trickle in
      #     early -- it serializes a second full wave, and promotion pays for
      #     it after every gate has already gone green.
      #
      # Only (2) costs time; (1) costs certification.  Violating either leaves
      # the run green, which is why they are written down here.
      # FIVE, measured rather than guessed, and it is faster than ten.
      #
      # Every shard replays the shared Mathlib prefix, and that prefix -- not
      # the shard's own slice -- is nearly all of its cost.  Timings from run
      # 32001524762 (ten shards, all green): 176, 180, 182, 190, 192, 193, 195,
      # 199, 201, 213 minutes.  The floor is 176m of Mathlib replay that every
      # shard pays in full, so the entire project-specific work in that run was
      # the 161m of spread above the floor.  Ten shards therefore bought 161m of
      # parallelism at a cost of ten Mathlib replays: 32 runner-hours to verify
      # 2.7 runner-hours of this library.
      #
      # wall = 176 + 161/N, so wall is nearly flat in N while runner-hours are
      # linear.  N=10 -> 213m and 32.0 runner-hours; N=5 -> 208m and 17.4.
      # Five is both slightly faster in wall clock and half the pool footprint,
      # which is the resource that was actually scarce: this account's twenty
      # job slots are shared with another repository that routinely holds
      # thirteen of them, and on 2026-08-17 a ten-second gate job waited 37
      # minutes for a runner while a certificate held ten.
      #
      # Do not raise this back toward ten expecting speed.  The only way to make
      # certification substantially faster is to stop replaying Mathlib in every
      # shard, which is a trust-surface decision and not a tuning one.
      max-parallel: 5
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Cache Lean toolchain
        id: elan-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.elan
          key: ${{ runner.os }}-elan-${{ hashFiles('lean-toolchain') }}

      - name: Install elan
        if: steps.elan-cache.outputs.cache-hit != 'true'
        run: curl https://raw.githubusercontent.com/leanprover/elan/464c9d28395000a2a0128e07081e4956d50eced2/elan-init.sh -sSf | sh -s -- -y

      - name: Add elan to PATH
        run: echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Restore Lake dependencies
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .lake/packages
          key: ${{ runner.os }}-lake-deps-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            ${{ runner.os }}-lake-deps-

      - name: Cache Mathlib olean archives
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/mathlib
          key: ${{ runner.os }}-mathlib-archives-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - name: Fetch precompiled Mathlib
        run: lake exe cache get

      # This job runs concurrently with `prove`: it restores the newest
      # available compiled tree (typically the previous run's save through
      # the prefix fallback), rebuilds whatever is stale itself -- Lake's
      # hashing rebuilds rather than trusts -- and then replays its slice
      # through a fresh kernel.
      - name: Restore compiled project
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .lake/build
          key: ${{ runner.os }}-nonsofic-build-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml', 'GroupApproximation.lean', 'GroupApproximation/**/*.lean') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-nonsofic-build-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml', 'GroupApproximation.lean', 'GroupApproximation/**/*.lean') }}-
            ${{ runner.os }}-nonsofic-build-

      - name: Download the bounded P13 build
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: p13-*-${{ github.sha }}
          path: build/p13-prebuild

      - name: Restore and seal the P13 build
        run: |
          python3 scripts/p13_build_shards.py restore-all \
            --directory build/p13-prebuild
          python3 scripts/p13_build_shards.py seal

      # Deterministic 5-way partition of every module in the library, by sorted
      # index modulo the shard count.  THE MODULUS BELOW MUST EQUAL THE LENGTH
      # OF THE SHARD LIST -- see invariant (1) above, which costs certification
      # rather than time.  The count went twelve -> ten -> five; the sizing
      # argument and its measurements live with the matrix.
      #
      # Verified as an exact partition before the change landed, by replaying
      # this exact loop over the real tree: 1374 modules, 1374 covered by the
      # union of the five residue classes, zero covered twice.  The same check
      # at modulus ten gave the same 1374, which is what makes the two
      # configurations equivalent in coverage and not merely believed to be.
      #
      # A synthetic root importing the
      # shard's modules is compiled against the restored build (seconds, and
      # Lake's hashing rebuilds anything stale rather than trusting it), and
      # the toolchain's built-in checker then replays that root's full
      # import closure through a fresh kernel environment.  Every module of
      # the library lies in some shard's closure, and the shared Mathlib
      # prefix is re-verified by every shard; the union of the five green
      # shards is therefore at least as strong as the old single
      # `leanchecker --fresh GroupApproximation` invocation.  Shard 0 also
      # imports the root, so the root's own closure is replayed too.
      - name: Fresh kernel re-check (leanchecker)
        shell: bash
        run: |
          set -euo pipefail
          i=0
          : > KernelShard.lean
          while read -r f; do
            mod="${f%.lean}"
            mod="${mod//\//.}"
            if [ $((i % 5)) -eq ${{ matrix.shard }} ]; then
              echo "import $mod" >> KernelShard.lean
            fi
            i=$((i+1))
          done < <({ find GroupApproximation -name '*.lean' -type f; } | LC_ALL=C sort)
          if [ "${{ matrix.shard }}" -eq 0 ]; then
            echo "import GroupApproximation" >> KernelShard.lean
          fi
          wc -l KernelShard.lean
          # Bring the shard's modules up to date against the restored tree;
          # on an exact cache hit this is a no-op, otherwise the shard
          # compiles its own delta.
          grep '^import ' KernelShard.lean | sed 's/^import //' | \
            xargs lake build
          lake env lean KernelShard.lean -o .lake/build/lib/lean/KernelShard.olean
          lake env leanchecker --fresh KernelShard

  publight:
    name: Build and audit (publication layer)
    needs: gate
    if: ${{ needs.gate.outputs.run == 'true' && needs.gate.outputs.lean == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Everything a manuscript or docs change can affect is a pure-Python
      # gate: the source scan, the research-graph check, the non-MF
      # counterpart contract, and the manifest/roster consistency checks.
      # The Lean-side verdicts -- build, kernel audit, signature snapshot,
      # fresh kernel re-check -- are functions of the Lean-relevant tree,
      # which the gate verified to be byte-identical to the certified
      # revision on `verified`; the standing verdicts therefore apply
      # verbatim.  Any change to those inputs takes the full lane instead.
      - name: Calibrate the source scan
        run: |
          python3 scripts/check.py --self-test
          python3 scripts/test_claim_map.py
          python3 scripts/check_non_mf_refs.py --self-test
          python3 scripts/check_non_mf_claim_manifest.py --self-test

      - name: Source scan
        run: |
          python3 scripts/check.py
          # cairn check validates the research graph; the regenerated
          # FRONTIER.md is not diffed because it embeds lock countdowns
          # and mtime-derived sections that are time-dependent by design.
          bin/cairn check

      # The unconditionality gate, exactly as in the `prove` job above: badge
      # source-closure is a property of the printed header, and this reads the
      # proposition instead.  A manuscript-only change is precisely the change
      # that can move a badge onto a conditional declaration, so this lane
      # needs the gate as much as the full one does.
      #
      # REPORT-ONLY for the same reason and with the same exit: the register
      # was written by hand from the inventory and has not yet met the real
      # corpus.  TO ARM, after one run whose log shows this step green, move
      # the `--self-test` line into "Calibrate the source scan" above and
      # delete `continue-on-error: true`.  This job has no deferred verdict, so
      # that one deletion is the whole arming diff.
      - name: Non-MF unconditionality (report-only until the register is confirmed)
        continue-on-error: true
        run: |
          python3 scripts/check_non_mf_unconditional.py --self-test
          python3 scripts/check_non_mf_unconditional.py \
            --tex non_mf_groups_exist.tex \
            --baseline metadata/NON_MF_UNCONDITIONAL_BASELINE.txt

      - name: Non-MF counterpart contract
        run: |
          python3 scripts/check_non_mf_zero_input.py \
            --tex non_mf_groups_exist.tex
          python3 scripts/regenerate_non_mf_claim_manifest.py \
            --output /tmp/NON_MF_NUMBERED_CLAIMS.generated.json
          diff -u metadata/NON_MF_NUMBERED_CLAIMS.json \
            /tmp/NON_MF_NUMBERED_CLAIMS.generated.json
          python3 scripts/check_non_mf_refs.py \
            --tex non_mf_groups_exist.tex \
            --check-decls \
            --extra-declarations-from metadata/NON_MF_NUMBERED_CLAIMS.json \
            --require-verified \
              Sofic/LiteralNonMFEndpoint \
              GroupApproximation.LiteralNonMFEndpoint.manuscriptTheoremA \
            --require-verified \
              Sofic/LiteralNonMFEndpoint \
              GroupApproximation.LiteralNonMFEndpoint.manuscriptTheoremD \
            --require-verified \
              Sofic/LiteralBaseP13PropertyTBridge \
              GroupApproximation.LiteralBaseP13PropertyTBridge.manuscriptBaseHasKazhdanPropertyT
          python3 scripts/check_non_mf_claim_manifest.py \
            --tex non_mf_groups_exist.tex \
            --manifest metadata/NON_MF_NUMBERED_CLAIMS.json \
            --signature-roster metadata/NON_MF_CLAIM_DECLS.txt
