name: Lean Prover CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-prover-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and audit Palomar
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Calibrate and run source gates
        run: |
          python3 -c 'import yaml' 2>/dev/null \
            || python3 -m pip install --disable-pip-version-check --no-deps PyYAML==6.0.3
          python3 scripts/check.py --self-test
          python3 scripts/check_palomar_submission.py --self-test
          python3 scripts/check.py
          python3 scripts/check_palomar_submission.py

      - name: Cache Lean toolchain
        id: elan-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.elan
          key: ${{ runner.os }}-elan-${{ hashFiles('lean-toolchain') }}

      - name: Install elan
        if: steps.elan-cache.outputs.cache-hit != 'true'
        run: curl https://raw.githubusercontent.com/leanprover/elan/464c9d28395000a2a0128e07081e4956d50eced2/elan-init.sh -sSf | sh -s -- -y

      - name: Add elan to PATH
        run: echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache Lake dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .lake/packages
          key: ${{ runner.os }}-lake-deps-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - name: Cache compiled project
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .lake/build
          key: ${{ runner.os }}-palomar-build-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml', 'GroupApproximation.lean', 'GroupApproximation/**/*.lean', 'Palomar/**/*.lean', 'PalomarSolution.lean') }}
          restore-keys: |
            ${{ runner.os }}-palomar-build-

      - name: Fetch precompiled Mathlib
        run: lake exe cache get

      - name: Build
        run: lake build

      - name: Build and calibrate the audit
        run: |
          lake build Audit
          lake env lean scripts/Calibrate.lean

      - name: Kernel audit
        run: lake env lean scripts/Audit.lean

      - name: Package-wide lint
        run: lake env lean scripts/Lint.lean

      - name: Palomar statement match
        run: bash scripts/check_palomar_statement_match.sh

      - name: Check generated signature snapshot
        run: |
          cp metadata/CLAIM_SIGNATURES.md /tmp/CLAIM_SIGNATURES.expected.md
          lake env lean scripts/Signatures.lean
          cmp /tmp/CLAIM_SIGNATURES.expected.md metadata/CLAIM_SIGNATURES.md

      - name: Check generated statement surface
        run: |
          cp metadata/AUDIT_SURFACE.md /tmp/AUDIT_SURFACE.expected.md
          lake env lean scripts/StatementClosure.lean
          cmp /tmp/AUDIT_SURFACE.expected.md metadata/AUDIT_SURFACE.md
