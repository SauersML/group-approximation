name: One-shot manuscript solved-questions refresh

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/manuscript-solved-questions-once.yml'

permissions:
  contents: write

jobs:
  rewrite:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Rewrite the settled/open frontier in the manuscript
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('non_mf_groups_exist.tex')
          s = path.read_text()

          s = s.replace(
              r'''The converse of each arrow is open, as is
\textup{MF}$\,\Rightarrow\,$\textup{hyperlinear} (Question~2 of
Section~\ref{sec:limits}).''',
              r'''The converse of each displayed arrow is open, as is
\textup{MF}$\,\Rightarrow\,$\textup{hyperlinear} (Question~1 of
Section~\ref{sec:limits}).''')

          s = s.replace(
              r'''The quotient $E/\langle w\rangle$
is also non-MF\@.''',
              r'''The quotient $E/\langle w\rangle$
is also non-MF\@.  We determine the full MF residual of $E$:
$\operatorname{Res}_{\mathrm{MF}}(E)$ is the normal closure of
$u=[tct^{-1},v_1]$.  We also construct a two-generated finitely
presented torsion-free property-\textup{(T)} group whose MF residual
is the whole group.''')

          start = s.index(r'\subsection*{Questions}')
          end = s.index(r'\section{The maximal group \texorpdfstring{$C^*$}{C*}-algebra}', start)

          new = r'''\subsection*{Questions settled by the method}

\paragraph{The exact MF residual of $E$.}
Put $B=\iota(\mathcal B)$, $d=\hat c=tct^{-1}$ and
$D=\langle\!\langle u\rangle\!\rangle_E$, where $u=[d,v_1]$.  Then
\begin{equation}\label{eq:exact-mf-residual}
 \operatorname{Res}_{\mathrm{MF}}(E)
 =D=N_{\mathrm{conj}},
 \qquad
 E/D\cong \Sigma *_B(B\times C_2),
\end{equation}
and the quotient in \eqref{eq:exact-mf-residual} is MF.  Moreover, if
$q\colon E\to E/\langle w\rangle$ is the quotient map and
$D_{\mathrm{coll}}$ is the collapse subgroup used in the proof of
Theorem~\ref{thm:signfree}, then
\[
 \operatorname{Res}_{\mathrm{MF}}(E/\langle w\rangle)
 =D_{\mathrm{coll}}=D/\langle w\rangle,
 \qquad
 \operatorname{Res}_{\mathrm{MF}}(E)=q^{-1}(D_{\mathrm{coll}}).
\]

Indeed, $d$ commutes with the linear part of $B$ and with the even
translations, because
$tBt^{-1}=(2\mathbb Z^3)\rtimes\langle x,y,z\rangle$.  Hence
$[d,b]$ depends, up to conjugacy, only on the translation coordinate
of $b$ modulo~$2$.  The explicit mod-$2$ calculation in the proof of
Theorem~\ref{thm:signfree} shows that the linear part is transitive on
the seven nonzero classes of $(\mathbb Z/2)^3$.  Thus every defining
commutator $[d,b]$ of $N_{\mathrm{conj}}$ is either trivial or a
conjugate of $u$, while $u$ itself is one of those commutators.  This
gives $N_{\mathrm{conj}}=D$.

In $E/D$ the involution $d$ centralizes $B$, and $c=t^{-1}dt$.  The
old relation $[c,B]=1$ becomes $[d,tBt^{-1}]=1$, which is redundant
because $tBt^{-1}\le B$; the relations involving $w$ are redundant as
well because $w=u^2=1$.  Therefore
\[
 E/D\cong
 \langle B,t,d\mid tbt^{-1}=\alpha(b),\ d^2=1,\ [d,B]=1\rangle
 \cong \Sigma *_B(B\times C_2).
\]
The group $\Sigma$ is the finitely generated subgroup of
$\GL_4(\mathbb Q)$ described in Section~\ref{sec:witness}, hence is
residually finite by Mal'cev's theorem \cite{Malcev}.  Put
$G_0=\Sigma\times C_2$.  The profinite regular matrix models of the
residually finite group $G_0$ carry the canonical group trace.  If
$A$ is the $C^*$-algebra generated by the resulting corona image of
$G_0$ and $C$ is the subalgebra generated by $B$, then $A$ is MF and
Shulman's symmetric-amalgam theorem gives that $A*_C A$ is MF
\cite[Theorem~10]{Shulman}.  The trace-preserving GNS representation
maps this amalgam onto
$L(G_0)*_{L(B)}L(G_0)\cong L(G_0*_B G_0)$, so the induced group map
$G_0*_B G_0\to\U(A*_C A)$ is injective.  Finally,
\[
 \Sigma *_B(B\times C_2)\longrightarrow G_0*_B G_0
\]
is injective by the normal-form theorem for amalgamated free products:
a syllable in $\Sigma\setminus B$ stays outside $B$ in the first
factor, and a syllable in $(B\times C_2)\setminus B$ stays outside
$B$ in the second.  Thus $E/D$ is MF.  Theorem~\ref{thm:signfree}
and Corollary~\ref{cor:pullback} already give $D\le
\operatorname{Res}_{\mathrm{MF}}(E)$; Corollary~\ref{cor:exactradical}
now gives equality.  Applying the same pullback formula through
$E\to E/\langle w\rangle$, and using the orbit witness from the proof
of Theorem~\ref{thm:signfree}, gives the two remaining equalities.

\paragraph{A torsion-free finitely presented example.}
There exists a two-generated finitely presented torsion-free
property-\textup{(T)} group $Q$ such that
\begin{equation}\label{eq:full-mf-residual}
 \operatorname{Res}_{\mathrm{MF}}(Q)=Q.
\end{equation}
Consequently every homomorphism from $Q$ to an MF group is trivial,
and every nontrivial quotient of $Q$ again has full MF residual and is
non-MF.

For the construction, use the torsion-free finitely presented
property-\textup{(T)} compression group in Fournier-Facio's
small-cancellation construction \cite{FFF}.  It contains a finitely
presented nonabelian simple torsion-free subgroup $S$ inside the
Kazhdan base $\Gamma$, together with a stable letter $t$ such that
$t^{-1}St$ centralizes $\Gamma$.  Choose $1\ne s\in S$ and set
$c=t^{-1}st$.  Then $c$ centralizes $\Gamma$ and $tct^{-1}=s$.
The compression defect meets $S$ nontrivially: since $S$ is
nonabelian simple, choose $r\in S$ with $[s,r]\ne1$; this commutator
belongs to the defect.  The intersection of the defect with $S$ is
normal in $S$, hence the whole of $S$.  Thus the defect contains
$N=\langle\!\langle S\rangle\!\rangle$.

The group supplied by Fournier-Facio is obtained through Hull's
acylindrical small-cancellation machinery.  The infinite normal
subgroup $N$ is a suitable reservoir for that machinery by the
normal-subgroup results of Osin \cite{Osin}.  Applying Hull's
Theorem~7.1 to a two-generated suitable subgroup of $N$, with a finite
generating set of the ambient group as the prescribed elements and
with one nontrivial element of $S$ protected, produces a quotient
$q\colon G\twoheadrightarrow Q$ in which every generator lies in
$q(N)$ \cite{Hull}.  Hence
\[
 Q=q(N)=\langle\!\langle q(S)\rangle\!\rangle_Q.
\]
The order-preservation clause makes $Q$ torsion-free, the protected
element makes it nontrivial, the construction uses only finitely many
new relators in the finitely generated case, and the two chosen
suitable elements generate the quotient.  Property~\textup{(T)} passes
to $Q$.  Since the mapped compression defect is all of $Q$,
Theorem~\ref{thm:normal-kazhdan}, applied with the normal Kazhdan
subgroup $K=Q$, gives \eqref{eq:full-mf-residual}.  Finally,
functoriality of the MF residual under a surjection shows that every
quotient of $Q$ also has full residual.

\begin{remark}[the torsion-free realization]\label{rem:ff-realization}
The Clifford construction of Theorem~\ref{thm:kazhdan-clifford}
itself cannot produce a torsion-free group: it imposes $c^2=1$, hence
$\hat c^2=1$, and every homomorphism to a torsion-free group kills
$\hat c$ and its compression defect.  The preceding construction uses
a different feature of Fournier-Facio's group: the centralizing
conjugate $t^{-1}St$ is torsion-free and supplies an infinite-order
compression element, while Hull's quotient makes the resulting simple
factor normally generate.  The final obstruction is therefore the
normal-Kazhdan criterion, not a finite spectral corner.
\end{remark}

\paragraph{Building blocks beyond matrices.}
The matrix hypothesis in Theorem~\ref{thm:kazhdan-transport} can be
weakened in a precise way.  If $(A,\tau)$ is a unital $C^*$-algebra
with faithful tracial state, write
\[
 \mathcal D_\tau(A)=C^*(L_a,R_b:a,b\in A)
 \subseteq B(L^2(A,\tau))
\]
for the $C^*$-algebra generated by left and right multiplication.
Let $(A_n,\tau_n)$ be faithfully tracial unital $C^*$-algebras and
assume that every $\mathcal D_{\tau_n}(A_n)$ is finite.  Then the
one-sided asymptotic-commutant theorem, and hence the finite-normal and
central-involution obstructions, remain valid for homomorphisms into
\[
 \U\!\left(\prod_nA_n\big/\bigoplus_nA_n\right).
\]

To see this, put $D_n=\mathcal D_{\tau_n}(A_n)$.  The adjoint action of
a coordinate unitary belongs to $D_n$, since
$\operatorname{Ad}u=L_uR_{u^*}$, and operator-norm multiplicative
defects still give operator-norm defects for the adjoint actions.  The
norm ultraproduct $\prod_\omega D_n$ is finite: an isometry in the
ultraproduct lifts to almost-isometries, polar correction gives
coordinate isometries, and finiteness of each $D_n$ makes those
coordinate isometries unitary.  The Kazhdan spectral projection
therefore lies in a finite algebra, so the comparison
$P\le VPV^*$ and $P\sim VPV^*$ again gives $P=VPV^*$.  The argument
survives the corners used in Section~\ref{sec:sign}: for a nonzero
projection $q\in A$, with the trace renormalized on $qAq$, the
left-right algebra of the corner embeds as a unital subalgebra of
\[
 (L_qR_q)\,\mathcal D_\tau(A)\,(L_qR_q),
\]
which is finite.  Thus the compression argument may be iterated.
This includes commutative building blocks and, with faithful traces,
AF and UHF algebras: for AF $A$, the left-right algebra is an image of
$A\otimes A^{\mathrm{op}}$, hence is AF and finite.  The constant
coordinate example $A_n=\Cred(E)$ above shows that faithful traces
alone are not enough.

\paragraph{A dimension--defect criterion for hyperlinearity.}
There is also a quantitative positive result toward MF implying
hyperlinearity.  Let $G$ be countable and suppose that, on an
exhaustion by finite sets, there are maps
$V_n\colon G\to\U(d_n)$ which separate distinct elements of the test
set by operator norm at least $1$, have multiplicative defect at most
$\varepsilon_n$, and satisfy
\begin{equation}\label{eq:dimension-defect}
 d_n\varepsilon_n\longrightarrow0.
\end{equation}
Then $G$ is hyperlinear.

Indeed, replace $V_n(g)$ by
$\widetilde V_n(g)=V_n(g)\oplus I_{d_n}$; this changes neither the
operator-norm defect nor the separation.  For a separated pair put
$z=V_n(g)^*V_n(h)$ and $m_0=\tr_{d_n}(z)$.  Some eigenvalue of $z$
is at distance at least $1$ from $1$, and therefore
\[
 2-2\operatorname{Re}m_0
 =\frac1{d_n}\sum_j|\lambda_j-1|^2
 \ge\frac1{d_n}.
\]
The normalized trace of $z\oplus I_{d_n}$ is
$m=(1+m_0)/2$, whence
\[
 1-|m|^2\ge\frac1{4d_n},
 \qquad
 |m|\le \exp\!\left(-\frac1{8d_n}\right).
\]
For $p_n=\lceil8d_n\rceil$ the $p_n$-fold tensor powers therefore
satisfy
\[
 \left\|\widetilde V_n(g)^{\otimes p_n}
       -\widetilde V_n(h)^{\otimes p_n}\right\|_2^2
 =2-2\operatorname{Re}(m^{p_n})
 \ge2(1-e^{-1}).
\]
The tensor-product telescoping estimate bounds every multiplicative
defect by $p_n\varepsilon_n$, which tends to zero by
\eqref{eq:dimension-defect}.  The same exponent works simultaneously
for every pair in the finite test set, giving hyperlinear local
models.  The MF definition itself supplies no relation between the
requested error and the dimension needed to realize it, so this does
not settle the implication below.

\subsection*{Remaining questions}
\begin{enumerate}
\item Does MF imply hyperlinearity?  The preceding criterion proves the
implication whenever MF models can be selected with
$d_n\varepsilon_n\to0$, but the CDE definition imposes no such rate.
Equivalently, one needs a mechanism that turns operator-norm visibility
into positive-density tracial visibility, for example by selecting
better models or by extracting invariant corners and renormalizing
their traces.  For stronger trace-controlled MF conventions the
implication is built into the definition.
\item How far does one-sided Kazhdan transport extend beyond matrix
blocks?  The left-right finiteness condition above gives a sufficient
class containing commutative and AF/UHF building blocks, while the
constant-coordinate example $A_n=\Cred(E)$ shows that stable
finiteness and faithful traces alone are insufficient.  Is there an
intrinsic characterization of the faithfully tracial $C^*$-algebras
for which $\mathcal D_\tau(A)$ is finite, or a strictly larger natural
class for which the compression obstruction still survives?
\item For which groups or Kazhdan conjugation data do the criteria of
Theorems~\ref{thm:criterion},~\ref{thm:normal-kazhdan} and
\ref{thm:projection-collapse} compute the MF residual exactly?  The
group $E$ and its sign-free quotient now give positive examples:
\eqref{eq:exact-mf-residual} and the equality
$D_{\mathrm{coll}}=\operatorname{Res}_{\mathrm{MF}}(E/\langle w\rangle)$
show that the compression and orbit-collapse mechanisms can be exact.
What structural hypotheses force this equality in general?
\end{enumerate}

'''
          s = s[:start] + new + s[end:]

          if r'\bibitem[Hu]{Hull}' not in s:
              marker = r'\bibitem[JNVWY]{MIPRE}'
              entry = r'''\bibitem[Hu]{Hull}
M.~Hull,
\emph{Small cancellation in acylindrically hyperbolic groups},
Groups Geom. Dyn. \textbf{10} (2016), no.~4, 1077--1119,
\doi{10.4171/GGD/377}, \arxiv{1308.4345}.

'''
              s = s.replace(marker, entry + marker, 1)

          if r'\bibitem[Os]{Osin}' not in s:
              marker = r'\bibitem[Ra]{Rabin58}'
              entry = r'''\bibitem[Os]{Osin}
D.~Osin,
\emph{Acylindrically hyperbolic groups},
Trans. Amer. Math. Soc. \textbf{368} (2016), no.~2, 851--888,
\doi{10.1090/tran/6343}, \arxiv{1304.1246}.

'''
              s = s.replace(marker, entry + marker, 1)

          assert 'Is there a torsion-free finitely presented non-MF group?' not in s
          assert 'What is $\\operatorname{Res}_{\\mathrm{MF}}(E)$?' not in s
          assert r'\subsection*{Remaining questions}' in s
          assert r'\label{eq:exact-mf-residual}' in s
          assert r'\label{eq:full-mf-residual}' in s
          assert r'\label{rem:ff-realization}' in s
          path.write_text(s)
          PY

      - name: Check manuscript contracts affected by the edit
        run: |
          set -euo pipefail
          python3 scripts/check_non_mf_refs.py --tex non_mf_groups_exist.tex
          python3 scripts/check_non_mf_claim_manifest.py

      - name: Commit the manuscript rewrite
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add non_mf_groups_exist.tex
          git diff --cached --check
          git commit -m 'Manuscript: promote solved MF questions and narrow the frontier'
          git push origin HEAD:main
