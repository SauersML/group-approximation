name: Keep verified current across publication-only commits

on:
  push:
    branches: [main]
  schedule:
    # Pushes are immediate.  The quarter-hour pass catches a transient push failure
    # or a branch-promotion race without waiting for the next repository edit.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

# Collapse only redundant lightweight runs.  The full Prover promotion is not
# in this group: both writers use non-force pushes and explicitly accept only
# an ancestry-safe race, while sharing a group could cancel a pending full-gate
# promotion when a later documentation push arrives.
concurrency:
  group: verified-publication-fast-forward
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  advance:
    name: Fast-forward publication-only descendants
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main with branch history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Refresh main and verified
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/heads/verified:refs/remotes/origin/verified'

      # Do not let a not-yet-certified edit to the classifier or this workflow
      # authorize its own promotion.  The next full green Prover run certifies
      # both; until then this lightweight path deliberately does nothing.
      - name: Require already-certified promotion code
        id: trusted-promotion
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet \
            refs/remotes/origin/verified refs/remotes/origin/main -- \
            scripts/advance_verified_branch.py \
            .github/workflows/verified-fast-forward.yml; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo 'Promotion code differs from verified; waiting for the full Prover gate.'
          fi

      - name: Calibrate the verified-tree classifier
        if: steps.trusted-promotion.outputs.run == 'true'
        run: python3 scripts/advance_verified_branch.py self-test

      - name: Advance only across byte-identical proof inputs
        if: steps.trusted-promotion.outputs.run == 'true'
        run: |
          python3 scripts/advance_verified_branch.py advance \
            --certified-ref refs/remotes/origin/verified \
            --main-ref refs/remotes/origin/main \
            --verified-ref refs/remotes/origin/verified \
            --remote origin
