    axioms: [propext, Classical.choice, Quot.sound]   # likewise
    comparator_config: Palomar/comparator-bowen-chapman.json

  - declaration: BowenChapman.exists_finitelyGenerated_surjunctive_not_sofic
    file: Palomar/BowenChapmanSolution.lean
    sorry_count: 0
    axioms: [propext, Classical.choice, Quot.sound]
    comparator_config: Palomar/comparator-bowen-chapman.json

alignment_statements:
  - source: >-
      Bowen-Chapman Problem 1.1 (are all surjunctive groups sofic?), in their
      setting of finitely generated groups and finite palettes: no, some
      finitely generated group is surjunctive and not sofic.
    lean: BowenChapman.exists_finitelyGenerated_surjunctive_not_sofic
    module: Palomar.BowenChapmanChallenge
    status: proved

  - source: >-
      Problem 1.1 without finite generation: not every surjunctive group is
      sofic.
    lean: BowenChapman.not_all_surjunctive_groups_sofic
    module: Palomar.BowenChapmanChallenge
    status: proved

fidelity_divergences_addendum: >-
  Surjunctivity is stated with Bowen-Chapman's cellular automata,
  Phi(c)(x) = phi(c(x gamma_1), ..., c(x gamma_n)), over palettes that are
  finite types in Type 0. Soficity is the finite-set normalized-Hamming form.
  Finite generation is the existence of a finite subset generating the whole
  group. All groups range over Type 0, and the counterexample is in Type 0.
