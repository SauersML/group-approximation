version: "v0.4"

# This submission selects Palomar/comparator-surjunctive-nonsofic.json only.
project:
  name: A Surjunctive Group That Is Not Sofic
  description: >-
    We formalize the existence of a finitely generated surjunctive group
    that is not sofic. This answers negatively the converse to the
    Gromov-Weiss surjunctivity theorem, recorded as open problem OP-11 by
    Ceccherini-Silberstein and Coornaert and as Problem 1.1 by Bowen and
    Chapman. The witness is the symmetric double G *_Gamma G, where
    Gamma = EL_3(F_2[x_1,x_2,x_3]) and
    G = EL_3(F_2[x_1^+-1,x_2^+-1,x_3^+-1]) semidirect EL_3(Z), with the
    action given by monomial substitution. Kun and Thom constructed this
    pair and proved the double nonsofic. The new ingredient here is a
    surjunctivity theorem for symmetric doubles of surjunctive groups.
    The Lean development proves both halves for this witness, including
    the required permutation centralizer normalization theorem. The
    challenge states surjunctivity through finite-memory cellular
    automata and soficity through finite normalized-Hamming models.
    The two selected declarations assert the finitely generated
    counterexample and the failure of the universal converse.
  authors: [Sauers]
  responsible_maintainers: [SauersML]
  license: Apache-2.0

classification:
  arxiv: [math.GR, math.DS]
  msc2020: ["20F69", "37B15", "20E06"]

sources:
  - title: A surjunctive group that is not sofic
    type: original-proof
    relationship: other
    contributors:
      - name: Astra
        role: developed the original surjunctivity argument using a custom proof tool under the author's direction
      - name: Claude (Anthropic)
        role: produced the Lean development and original exposition under the author's direction
      - name: Codex (OpenAI)
        role: prepared the submission metadata and account of sources, and audited the submission package
    note: >-
      The original contribution is surjunctivity of the previously
      constructed Kun-Thom nonsofic witness. The proof uses finite quotients
      of finite free factors of the fold kernel, transplants cellular
      automata to coset sets, and cancels lower support strata in a fixed
      subset order. The remaining map acts on finitely many cosets of a
      stabilizer intersection, whose surjunctivity supplies an inverse.
      The unconditional formal endpoint is
      GroupApproximation.SurjunctiveNonsofic.exists_fg_surjunctive_not_isSofic.
      The group's construction and its nonsoficity are credited to Kun
      and Thom below. A September 13 literature review found no earlier
      separation proof or applicable permanence theorem
      making the separation an immediate corollary; this is a bounded search,
      not a certification of absolute priority.

  - title: Cellular Automata and Groups
    authors: [Tullio Ceccherini-Silberstein, Michel Coornaert]
    year: 2010
    type: book
    id: https://doi.org/10.1007/978-3-642-14034-1
    location: Open Problems, OP-11
    relationship: background
    note: >-
      Records the converse question. The second edition, Open Problems,
      p. 527, explicitly says its list appeared in the first edition and
      retains OP-11. This supports a 2010 occurrence, not an identification
      of the first person to pose the question. Chapters 1 and 3 supply
      standard cellular-automaton and surjunctivity facts.

  - title: Cellular Automata and Groups, second edition
    authors: [Tullio Ceccherini-Silberstein, Michel Coornaert]
    year: 2024
    type: book
    id: https://doi.org/10.1007/978-3-031-43328-3
    location: Open Problems, p. 527, OP-11; Chapter 3 historical notes
    relationship: background
    note: >-
      The authors' retrospective confirmation of the first-edition problem
      list. The publisher dates the eBook to January 2024; its copyright
      year is 2023.

  - title: Surjunctivity does not characterize cosoficity of invariant random subgroups
    authors: [Lewis Bowen, Michael Chapman]
    year: 2025
    type: paper
    id: https://arxiv.org/abs/2511.06586
    location: Problem 1.1 and Theorem 1.2
    relationship: background
    note: >-
      Problem 1.1 asks whether all surjunctive groups are sofic. Their
      Theorem 1.2 answers the analogous question for invariant random
      subgroups; it does not supply a surjunctive nonsofic group. The
      challenge uses their finite-list definition of a cellular automaton.

  - title: On approximation properties of semidirect products of groups
    authors: [Goulnara Arzhantseva, Światosław R. Gal]
    year: 2020
    type: paper
    id: https://doi.org/10.5802/ambp.386
    location: p. 127; Theorems 1 and 7, Lemma 6
    relationship: background
    note: >-
      Annales Mathematiques Blaise Pascal 27(1), 125-130. Preprint
      arXiv:1312.7682 first posted December 30, 2013. Proves surjunctivity
      for split extensions with finitely generated residually finite
      kernel and surjunctive quotient, and finite-index permanence.
      The finite-generation hypothesis on the kernel prevents direct
      application to the infinite-rank free fold kernel used here.

  - title: Some general dynamical notions
    authors: [Walter H. Gottschalk]
    year: 1973
    type: paper
    id: https://doi.org/10.1007/BFb0061728
    location: Lecture Notes in Mathematics 318, 120-125
    relationship: background
    note: >-
      Origin of surjunctivity and the question whether every group is
      surjunctive. That question is distinct from the converse to
      Gromov-Weiss and is not settled here.

  - title: Note on symbolic transformation groups
    authors: [Wayne M. Lawton]
    year: 1972
    type: paper
    location: Notices of the American Mathematical Society 19, abstract
    relationship: other
    note: >-
      Credit for residual-finiteness surjunctivity and subgroup heredity,
      as attributed in the historical notes of Cellular Automata and
      Groups, Chapter 3. The original abstract was not directly inspected;
      the cited sources disagree on its page, so none is asserted here.

  - title: Endomorphisms and automorphisms of the shift dynamical system
    authors: [Gustav A. Hedlund]
    year: 1969
    type: paper
    id: https://doi.org/10.1007/BF01691062
    location: Mathematical Systems Theory 3, 320-375
    relationship: other
    note: >-
      Classical source for the Curtis-Hedlund-Lyndon theorem. The proof
      uses its arbitrary-group finite-alphabet form and the finite-memory
      inverse of a bijective cellular automaton; see Cellular Automata
      and Groups, Chapter 1, for that formulation.

  - title: Endomorphisms of symbolic algebraic varieties
    authors: [Mikhail Gromov]
    year: 1999
    type: paper
    id: https://doi.org/10.1007/PL00011162
    relationship: background
    note: The implication from soficity to surjunctivity whose converse is answered here.

  - title: Sofic groups and dynamical systems
    authors: [Benjamin Weiss]
    year: 2000
    type: paper
    id: https://www.jstor.org/stable/25051326
    relationship: background
    note: >-
      Sankhya Series A 62, 350-359. Develops soficity and proves
      surjunctivity of sofic groups. The present result concerns the converse.

  - title: Nonsofic wreath products of residually finite groups
    authors: [Gabor Kun, Andreas Thom]
    year: 2026
    type: paper
    id: https://arxiv.org/abs/2608.06222v3
    location: Theorems A, E, and 4.1
    relationship: other
    note: >-
      Supplies the existing nonsofic double and its polynomial/Laurent
      polynomial pair. Our witness is q = 2 and r = d = 3 in Theorem E;
      EL_3(Z) equals SL_3(Z). Theorem A supplies the nonsoficity argument,
      and Theorem 4.1 is its centralizer normalization input. The required
      results are proved in the Lean development, not added as axioms.
      This is credit for an ingredient of the new separation theorem,
      not a claim to have originated their construction or nonsoficity proof.

  - title: Centralizers of sofic approximations of Kazhdan groups
    authors: [Vadim Alekseev, Andreas Thom]
    year: 2026
    type: paper
    id: https://arxiv.org/abs/2608.05362
    relationship: other
    note: >-
      The component and almost-automorphism machinery used in the
      Kun-Thom normalization argument. Its needed estimates are developed
      in the formal proof.

  - title: Property (T) for noncommutative universal lattices
    authors: [Mikhail Ershov, Andrei Jaikin-Zapirain]
    year: 2010
    type: paper
    id: https://doi.org/10.1007/s00222-009-0218-2
    location: Theorem 1.1
    relationship: other
    note: >-
      Supplies property (T) for elementary groups over finitely generated
      unital rings. The instances used by the witness are proved in Lean.

  - title: On sofic approximations of Property (T) groups
    authors: [Gabor Kun]
    year: 2016
    type: paper
    id: https://arxiv.org/abs/1606.04471v5
    relationship: background
    note: >-
      Expander-decomposition ancestry of the nonsoficity machinery.
      First posted in 2016; the cited fifth version is dated July 30, 2019.

  - title: Inapproximability of actions and Kazhdan's property (T)
    authors: [Gabor Kun, Andreas Thom]
    year: 2019
    type: paper
    id: https://arxiv.org/abs/1901.03963v3
    relationship: background
    note: >-
      Almost-automorphism and cluster-group ancestry of the centralizer
      machinery. First posted in 2019; the cited third version is dated
      August 4, 2026. These background credits supplement the direct
      Kun-Thom and Alekseev-Thom inputs above.

