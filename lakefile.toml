name = "GroupApproximation"
version = "0.1.0"
defaultTargets = ["GroupApproximation", "PalomarChallenge", "PalomarSolution", "PalomarLIXChallenge", "PalomarLIXSolution", "PalomarSurjunctiveNonsoficChallenge", "PalomarSurjunctiveNonsoficSolution", "PalomarSurjunctiveNonsoficModelTests", "PalomarPestov91Challenge", "PalomarPestov91Solution", "PalomarTypeA2Challenge", "PalomarTypeA2Solution", "PalomarGubaThompsonChallenge", "PalomarGubaThompsonSolution", "PalomarGKPCommutingActionsChallenge", "PalomarGKPCommutingActionsSolution", "PalomarSTWProblemX1Challenge", "PalomarSTWProblemX1Solution", "PalomarSTWProblemXXIIChallenge", "PalomarSTWProblemXXIISolution", "PalomarBlanchardToeplitzChallenge", "PalomarBlanchardToeplitzSolution"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.32.0"

[[lean_lib]]
name = "GroupApproximation"
moreLeanArgs = ["-DwarningAsError=true"]

# The audit's own library: detector logic only, no side effects, so it can be
# built and calibrated independently of the corpus it audits.  The drivers
# (scripts/Audit.lean, scripts/Calibrate.lean) are deliberately NOT roots here
# -- they run under `lake env lean` and their whole purpose is to fail.
#
# No `warningAsError`: this library is instrumentation, and a deprecation
# warning in a detector must not be able to take the corpus build down with it.
[[lean_lib]]
name = "Audit"
srcDir = "scripts"
roots = ["Audit.DeclFilter", "Audit.Scan", "Audit.Plants"]

# The Palomar registry submission surface (`leanprover/comparator` protocol).
#
# `Palomar/Challenge.lean` is the small, human-auditable statement of record.
# It imports Mathlib and NOTHING from this development -- that is a hard
# requirement of the registry, which recompiles the challenge against a frozen
# canonical Mathlib and rejects any project-local source in its transitive
# import closure.  It therefore carries its own copy of the presentation and
# of the three approximation notions, and states the theorem with a
# deliberate hole.
#
# `Palomar/Solution.lean` repeats that block byte-for-byte -- Comparator
# compares the exported statements SYNTACTICALLY, and recursively requires
# every constant they mention to be identical in both environments, so the
# copy cannot be replaced by an import -- and then proves the theorem from
# the development.  `scripts/check_palomar_submission.py` gates the copy.
#
# No `warningAsError` here: the challenge's hole is a deliberate warning.

[[lean_lib]]
name = "PalomarChallenge"
roots = ["Palomar.Challenge"]

[[lean_lib]]
name = "PalomarSolution"
roots = ["Palomar.Solution"]

# The second Comparator configuration, `Palomar/comparator-lix.json`: STW
# Problem LIX (a simple unital C*-algebra that is not K_1-injective).  Same
# protocol as above -- `Palomar/LIXChallenge.lean` imports Mathlib only and
# states the theorems with deliberate holes; `Palomar/LIXSolution.lean`
# repeats the shared block byte-for-byte and proves them from the development.
# The registry takes exactly one configuration per submission, so this pair is
# submitted separately from the one above.

[[lean_lib]]
name = "PalomarLIXChallenge"
roots = ["Palomar.LIXChallenge"]

[[lean_lib]]
name = "PalomarLIXSolution"
roots = ["Palomar.LIXSolution"]

# The third Comparator configuration, `Palomar/comparator-lix-strong.json`: the
# strengthened Problem LIX theorems, where the counterexample's unitary has a
# class in U(A)/U_0(A) whose order is divisible by every prime dividing the
# rank, and still vanishes in K_1.  Same protocol as the pair above.
#
# NOT in `defaultTargets`, deliberately, and this is the one difference from
# the other two.  `Palomar/LIXStrongSolution.lean` proves the three statements
# from one proposition the construction still owes, so its theorems carry a
# hypothesis the challenge's do not; the configuration is listed as pending in
# `scripts/check_palomar_submission.py` and is not submittable yet.  A default
# target is built by every `lake build` in a checkout shared by several agents,
# and a surface that is deliberately incomplete should not be on that path.
# Both libraries join `defaultTargets` when the missing proposition lands.

[[lean_lib]]
name = "PalomarLIXStrongChallenge"
roots = ["Palomar.LIXStrongChallenge"]

[[lean_lib]]
name = "PalomarLIXStrongSolution"
roots = ["Palomar.LIXStrongSolution"]

# The fourth Comparator configuration, `Palomar/comparator-surjunctive-nonsofic.json`:
# the surjunctivity-soficity question (is every surjunctive group sofic?).  Same protocol
# as the pairs above: `Palomar/SurjunctiveNonsoficChallenge.lean` imports Mathlib only
# and states the two theorems with deliberate holes; `Palomar/SurjunctiveNonsoficSolution.lean`
# proves them from the development endpoint
# `GroupApproximation.SurjunctiveNonsofic.exists_fg_surjunctive_not_isSofic`.  Both
# libraries are in `defaultTargets`.

[[lean_lib]]
name = "PalomarSurjunctiveNonsoficChallenge"
roots = ["Palomar.SurjunctiveNonsoficChallenge"]

[[lean_lib]]
name = "PalomarSurjunctiveNonsoficSolution"
roots = ["Palomar.SurjunctiveNonsoficSolution"]

# Definition checks and equivalences for the surjunctive nonsofic result.
[[lean_lib]]
name = "PalomarSurjunctiveNonsoficModelTests"
roots = ["Palomar.SurjunctiveNonsoficModelTests", "Palomar.SurjunctiveNonsoficSoficityEquivalence", "Palomar.SurjunctiveNonsoficSurjunctivityEquivalence"]


# The fifth Comparator configuration, `Palomar/comparator-pestov91.json`:
# Pestov's Open Question 9.1 (can an infinite simple group with property (T) be
# hyperlinear, or sofic?).  Same protocol as the pairs above:
# `Palomar/Pestov91Challenge.lean` imports Mathlib only and carries its own
# copies of property (T), soficity and hyperlinearity, taking infiniteness and
# simplicity from Mathlib; `Palomar/Pestov91Solution.lean` proves both
# statements from the development endpoint
# `GroupApproximation.Pestov91.exists_infinite_simple_kazhdan_lef`, an infinite
# simple LEF group with property (T).  Both libraries are in `defaultTargets`.

[[lean_lib]]
name = "PalomarPestov91Challenge"
roots = ["Palomar.Pestov91Challenge"]

[[lean_lib]]
name = "PalomarPestov91Solution"
roots = ["Palomar.Pestov91Solution"]

# `PalomarPestov91ModelTests` exercises every definition of the Pestov 9.1 shared
# block on controls and bridges it to Pestov's Theorems 3.5 and 3.6; it is not a
# submission library.
[[lean_lib]]
name = "PalomarPestov91ModelTests"
roots = ["Palomar.Pestov91ModelTests"]

# The sixth Comparator configuration, `Palomar/comparator-type-a2.json`:
# Question 5.8 of Fournier-Facio, Wu and Zaremsky (is there an action of type
# [A_2] whose acting group, modulo the kernel of the action, is not finitely
# presented?).  Same protocol: `Palomar/TypeA2Challenge.lean` imports Mathlib
# only and carries its own copies of type [A_2], their Definition 1.3 with
# n = 2, and of the kernel of an action, taking finite presentation and finite
# generation from Mathlib; `Palomar/TypeA2Solution.lean` proves the statement
# from `GroupApproximation.TypeA2.question58`.  Both libraries are in
# `defaultTargets`.

[[lean_lib]]
name = "PalomarTypeA2Challenge"
roots = ["Palomar.TypeA2Challenge"]

[[lean_lib]]
name = "PalomarTypeA2Solution"
roots = ["Palomar.TypeA2Solution"]

# The seventh Comparator configuration, `Palomar/comparator-guba-thompson.json`:
# Question 3.20 of Guba's survey on the amenability of Thompson's group F (does
# the equation (1 - x_1) u = b v have a non-zero solution in K[F] for every b?).
# `Palomar/GubaThompsonChallenge.lean` imports Mathlib only and carries its own
# copy of the presentation of F; `Palomar/GubaThompsonSolution.lean` proves both
# statements from `GroupApproximation.ThompsonOre.one_sub_x1_solution`.  Both
# libraries are in `defaultTargets`.

[[lean_lib]]
name = "PalomarGubaThompsonChallenge"
roots = ["Palomar.GubaThompsonChallenge"]

[[lean_lib]]
name = "PalomarGubaThompsonSolution"
roots = ["Palomar.GubaThompsonSolution"]

# The eighth Comparator configuration,
# `Palomar/comparator-gkp-commuting-actions.json`: Question 4.2 of Gao,
# Kunnawalkam Elayavalli and Patchell (when commuting actions of groups G_i on
# one set are each sofic, is the action of the direct sum sofic?).  Same
# protocol: `Palomar/GKPCommutingActionsChallenge.lean` imports Mathlib only and
# carries its own copies of soficity for groups and for actions, their
# Definition 2.1, and of the action that commuting actions combine into;
# `Palomar/GKPCommutingActionsSolution.lean` proves both statements from the
# development endpoint
# `GroupApproximation.CommutingSoficActions.exists_commuting_sofic_actions_not_sofic`.
# Both libraries are in `defaultTargets`.

[[lean_lib]]
name = "PalomarGKPCommutingActionsChallenge"
roots = ["Palomar.GKPCommutingActionsChallenge"]

[[lean_lib]]
name = "PalomarGKPCommutingActionsSolution"
roots = ["Palomar.GKPCommutingActionsSolution"]

# The ninth Comparator configuration, `Palomar/comparator-stw-x1.json`: Problem
# X(1) of Schafhauser, Tikuisis and White (are amenable traces on C*-algebras
# necessarily quasidiagonal?), N. P. Brown's question.  Same protocol:
# `Palomar/STWProblemX1Challenge.lean` imports Mathlib only and carries its own
# copies of tracial states and of Brown's amenable and quasidiagonal traces;
# `Palomar/STWProblemX1Solution.lean` proves both statements from
# `GroupApproximation.PalomarBridges.X1.amenableNonQuasidiagonalTrace_zero`, the
# development's witness moved to `Type`.  Both libraries are in
# `defaultTargets`.  `PalomarSTWProblemX1ModelTests` exercises every `Prop` of
# the challenge on a small instance and is not a submission library.

[[lean_lib]]
name = "PalomarSTWProblemX1Challenge"
roots = ["Palomar.STWProblemX1Challenge"]

[[lean_lib]]
name = "PalomarSTWProblemX1Solution"
roots = ["Palomar.STWProblemX1Solution"]

[[lean_lib]]
name = "PalomarSTWProblemX1ModelTests"
roots = ["Palomar.STWProblemX1ModelTests"]

# The tenth Comparator configuration, `Palomar/comparator-stw-xxii.json`: Problem
# XXII of Schafhauser, Tikuisis and White (are all traces on the uniform tracial
# completion of a C*-algebra automatically continuous for the uniform 2-norm?),
# an instance of Question 1.1 of arXiv:2310.20594.  Same protocol:
# `Palomar/STWProblemXXIIChallenge.lean` imports Mathlib only and carries its own
# copies of tracial states, the uniform 2-norm and tracially complete
# C*-algebras; `Palomar/STWProblemXXIISolution.lean` proves both statements from
# `GroupApproximation.STW22.antipodalFactorialNegativeSolutionToProblemXXII`
# through `GroupApproximation.PalomarBridges.XXII`.  Both libraries are in
# `defaultTargets`.  `PalomarSTWProblemXXIIModelTests` exercises every `Prop` of
# the challenge on a small instance and is not a submission library.

[[lean_lib]]
name = "PalomarSTWProblemXXIIChallenge"
roots = ["Palomar.STWProblemXXIIChallenge"]

[[lean_lib]]
name = "PalomarSTWProblemXXIISolution"
roots = ["Palomar.STWProblemXXIISolution"]

[[lean_lib]]
name = "PalomarSTWProblemXXIIModelTests"
roots = ["Palomar.STWProblemXXIIModelTests"]

# The eleventh Comparator configuration, `Palomar/comparator-blanchard-toeplitz.json`:
# Question 5.4 of Blanchard, arXiv:1507.02535 (is the Toeplitz algebra of the
# Dixmier-Douady Hilbert module E_DD properly infinite?).  Same protocol:
# `Palomar/BlanchardToeplitzChallenge.lean` imports Mathlib only and carries its
# own copies of the Hilbert cube, the module E_DD, its Fock module and the
# Toeplitz algebra; `Palomar/BlanchardToeplitzSolution.lean` proves the statement
# from `GroupApproximation.Toeplitz.exists_properlyInfinite_of_coeff`.  Both
# libraries are in `defaultTargets`.  `PalomarBlanchardToeplitzModelTests` tests
# the definitions of the challenge and is not a submission library.

[[lean_lib]]
name = "PalomarBlanchardToeplitzChallenge"
roots = ["Palomar.BlanchardToeplitzChallenge"]

[[lean_lib]]
name = "PalomarBlanchardToeplitzSolution"
roots = ["Palomar.BlanchardToeplitzSolution"]

[[lean_lib]]
name = "PalomarBlanchardToeplitzModelTests"
roots = ["Palomar.BlanchardToeplitzModelTests"]

# The Comparator configuration `Palomar/comparator-metabelian-boone-higman.json`:
# item (7) of Problem 5.3 of Belk, Bleak, Matucci and Zaremsky (the Boone–Higman
# conjecture for finitely presented metabelian groups), with the finitely
# generated form.  `Palomar/MetabelianBooneHigmanChallenge.lean` imports Mathlib
# only; `Palomar/MetabelianBooneHigmanSolution.lean` is still a skeleton whose
# theorems carry the development endpoint as a hypothesis.
[[lean_lib]]
name = "PalomarMetabelianBooneHigmanChallenge"
roots = ["Palomar.MetabelianBooneHigmanChallenge"]

[[lean_lib]]
name = "PalomarMetabelianBooneHigmanSolution"
roots = ["Palomar.MetabelianBooneHigmanSolution"]

# `PalomarMetabelianBooneHigmanModelTests` exercises both definitions of the
# shared block on controls; it is not a submission library.
[[lean_lib]]
name = "PalomarMetabelianBooneHigmanModelTests"
roots = ["Palomar.MetabelianBooneHigmanModelTests"]
