name = "GroupApproximation"
version = "0.1.0"
defaultTargets = ["GroupApproximation", "PalomarChallenge", "PalomarSolution", "PalomarLIXChallenge", "PalomarLIXSolution"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.32.0"

[[lean_lib]]
name = "GroupApproximation"
moreLeanArgs = ["-DwarningAsError=true"]

# The audit's own library: detector logic only, no side effects, so it can be
# built and calibrated independently of the corpus it audits.  The drivers
# (scripts/Audit.lean, scripts/Calibrate.lean) are deliberately NOT roots here
# -- they run under `lake env lean` and their whole purpose is to fail.
#
# No `warningAsError`: this library is instrumentation, and a deprecation
# warning in a detector must not be able to take the corpus build down with it.
[[lean_lib]]
name = "Audit"
srcDir = "scripts"
roots = ["Audit.DeclFilter", "Audit.Scan", "Audit.Plants"]

# The Palomar registry submission surface (`leanprover/comparator` protocol).
#
# `Palomar/Challenge.lean` is the small, human-auditable statement of record.
# It imports Mathlib and NOTHING from this development -- that is a hard
# requirement of the registry, which recompiles the challenge against a frozen
# canonical Mathlib and rejects any project-local source in its transitive
# import closure.  It therefore carries its own copy of the presentation and
# of the three approximation notions, and states the theorem with a
# deliberate hole.
#
# `Palomar/Solution.lean` repeats that block byte-for-byte -- Comparator
# compares the exported statements SYNTACTICALLY, and recursively requires
# every constant they mention to be identical in both environments, so the
# copy cannot be replaced by an import -- and then proves the theorem from
# the development.  `scripts/check_palomar_submission.py` gates the copy.
#
# No `warningAsError` here: the challenge's hole is a deliberate warning.

[[lean_lib]]
name = "PalomarChallenge"
roots = ["Palomar.Challenge"]

[[lean_lib]]
name = "PalomarSolution"
roots = ["Palomar.Solution"]

# The second Comparator configuration, `Palomar/comparator-lix.json`: STW
# Problem LIX (a simple unital C*-algebra that is not K_1-injective).  Same
# protocol as above -- `Palomar/LIXChallenge.lean` imports Mathlib only and
# states the theorems with deliberate holes; `Palomar/LIXSolution.lean`
# repeats the shared block byte-for-byte and proves them from the development.
# The registry takes exactly one configuration per submission, so this pair is
# submitted separately from the one above.

[[lean_lib]]
name = "PalomarLIXChallenge"
roots = ["Palomar.LIXChallenge"]

[[lean_lib]]
name = "PalomarLIXSolution"
roots = ["Palomar.LIXSolution"]

# The third Comparator configuration, `Palomar/comparator-lix-strong.json`: the
# strengthened Problem LIX theorems, where the counterexample's unitary has a
# class in U(A)/U_0(A) whose order is divisible by every prime dividing the
# rank, and still vanishes in K_1.  Same protocol as the pair above.
#
# NOT in `defaultTargets`, deliberately, and this is the one difference from
# the other two.  `Palomar/LIXStrongSolution.lean` proves the three statements
# from one proposition the construction still owes, so its theorems carry a
# hypothesis the challenge's do not; the configuration is listed as pending in
# `scripts/check_palomar_submission.py` and is not submittable yet.  A default
# target is built by every `lake build` in a checkout shared by several agents,
# and a surface that is deliberately incomplete should not be on that path.
# Both libraries join `defaultTargets` when the missing proposition lands.

[[lean_lib]]
name = "PalomarLIXStrongChallenge"
roots = ["Palomar.LIXStrongChallenge"]

[[lean_lib]]
name = "PalomarLIXStrongSolution"
roots = ["Palomar.LIXStrongSolution"]

# The fourth Comparator configuration, `Palomar/comparator-bowen-chapman.json`:
# Bowen-Chapman Problem 1.1 (is every surjunctive group sofic?).  Same protocol
# as the pairs above: `Palomar/BowenChapmanChallenge.lean` imports Mathlib only
# and states the two theorems with deliberate holes.  Only the challenge library
# exists so far, and it is NOT in `defaultTargets`: the solution waits for the
# development endpoint, and both libraries join `defaultTargets` when the
# solution proves the selected theorems without hypotheses.

[[lean_lib]]
name = "PalomarBowenChapmanChallenge"
roots = ["Palomar.BowenChapmanChallenge"]
