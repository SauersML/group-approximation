<text text-anchor="middle" x="246.5" y="-565.8" font-family="DejaVu Sans" font-size="14.00" fill="#152535">2 · LIU–THOM NORMALIZATION KILLS A NORMAL GENERATOR</text>
<text text-anchor="middle" x="246.5" y="-550.8" font-family="DejaVu Sans" font-size="14.00" fill="#152535">For every ρ:G → U(M), ρ(G) normalizes D = ρ(L)′ ∩ M</text>
<text text-anchor="middle" x="246.5" y="-535.8" font-family="DejaVu Sans" font-size="14.00" fill="#152535">c = [x₄₁(e),x₁₄(t)] centralizes L; ucu⁻¹ = x₁₂(e)</text>
<text text-anchor="middle" x="246.5" y="-520.8" font-family="DejaVu Sans" font-size="14.00" fill="#152535">Hence ρ([ucu⁻¹,x₂₃(1)]) = ρ(x₁₃(e)) = 1</text>
<text text-anchor="middle" x="246.5" y="-505.8" font-family="DejaVu Sans" font-size="14.00" fill="#152535">Two root commutators put x₄₂(bea) = x₄₂(1) in its normal closure</text>
<text text-anchor="middle" x="246.5" y="-490.8" font-family="DejaVu Sans" font-size="14.00" fill="#152535">Signed permutations + root commutators give the whole G</text>
<text text-anchor="middle" x="246.5" y="-475.8" font-family="DejaVu Sans" font-size="14.00" fill="#152535">Every tracial&#45;ultraproduct homomorphism of G is trivial</text>
</a>
