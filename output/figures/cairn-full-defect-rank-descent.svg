<text text-anchor="middle" x="497.5" y="-324.8" font-family="DejaVu Sans" font-size="14.00" fill="#152535">EL₄(C) → EL₄(R) → EL₂(R) contains D* = diag(1 + S₁T₂,1)</text>
<text text-anchor="middle" x="497.5" y="-309.8" font-family="DejaVu Sans" font-size="14.00" fill="#152535">D* normally generates EL₂(R); every hyperlinear&#45;target map kills D*</text>
