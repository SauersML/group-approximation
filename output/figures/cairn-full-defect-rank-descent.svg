<text text-anchor="middle" x="497.5" y="-746.8" font-family="DejaVu Sans" font-size="14.00" fill="#152535">1 · UNIVERSAL COHN SOURCE WITH ELEMENTARY COMPRESSORS</text>
<text text-anchor="middle" x="497.5" y="-731.8" font-family="DejaVu Sans" font-size="14.00" fill="#152535">C = ℤ⟨s,a,t,b | ts = ba = 1, ta = bs = 0⟩; e = 1 − st; bea = 1</text>
<text text-anchor="middle" x="497.5" y="-716.8" font-family="DejaVu Sans" font-size="14.00" fill="#152535">G = EL₄(C), L = diag(EL₃(C),1): finitely generated Kazhdan groups (EJZ)</text>
<text text-anchor="middle" x="497.5" y="-701.8" font-family="DejaVu Sans" font-size="14.00" fill="#152535">u_i = x₄ᵢ(t−1)xᵢ₄(1)x₄ᵢ(s−1)xᵢ₄(−t), u = u₃u₂u₁ ∈ G</text>
<text text-anchor="middle" x="497.5" y="-686.8" font-family="DejaVu Sans" font-size="14.00" fill="#152535">k₊ = [x₄₁(a),x₁₄(t³)], k₋ = [x₄₁(s³),x₁₄(b)] ∈ C_G(L)</text>
<text text-anchor="middle" x="497.5" y="-671.8" font-family="DejaVu Sans" font-size="14.00" fill="#152535">uLu⁻¹ ⊆ L and G = ⟨L,u,k₊,k₋⟩</text>
<text text-anchor="middle" x="497.5" y="-656.8" font-family="DejaVu Sans" font-size="14.00" fill="#152535">No relation st + ab = 1 and no GL = EL theorem are used</text>
