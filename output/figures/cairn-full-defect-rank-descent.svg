<text text-anchor="middle" x="749.5" y="-565.8" font-family="DejaVu Sans" font-size="14.00" fill="#152535">3 · THE EXACT RING HYPOTHESIS SUPPLIES A MAP C → R</text>
<text text-anchor="middle" x="749.5" y="-550.8" font-family="DejaVu Sans" font-size="14.00" fill="#152535">R is COUNTABLE, NONZERO, ASSOCIATIVE AND UNITAL</text>
<text text-anchor="middle" x="749.5" y="-535.8" font-family="DejaVu Sans" font-size="14.00" fill="#152535">ts = 1; e = 1 − st is FULL: 1 = Σⱼ αⱼeβⱼ (0 ≤ j &lt; m)</text>
<text text-anchor="middle" x="749.5" y="-520.8" font-family="DejaVu Sans" font-size="14.00" fill="#152535">v₀ = sᵐ, w₀ = tᵐ; v₁ = Σⱼ sʲeβⱼ, w₁ = Σⱼ αⱼetʲ</text>
<text text-anchor="middle" x="749.5" y="-505.8" font-family="DejaVu Sans" font-size="14.00" fill="#152535">e tⁱsʲ e = δᵢⱼe implies wᵢvⱼ = δᵢⱼ1</text>
<text text-anchor="middle" x="749.5" y="-490.8" font-family="DejaVu Sans" font-size="14.00" fill="#152535">Thus C → R is unital; injectivity is NOT required</text>
<text text-anchor="middle" x="749.5" y="-475.8" font-family="DejaVu Sans" font-size="14.00" fill="#152535">The two copies need not exhaust the identity</text>
